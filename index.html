是孩子的父親，也不是孩子的繼承權來源。孩子長大了，他就退場。<\/p><p>這是律法的位置。它有真實的功用：看守、保護、約束，也讓人看見自己還是孩子。但它的工作是帶到某一天、帶到某一個人那裡。「這因信得救的理既然來到，我們從此就不在師傅的手下了。」（3:25）<\/p><p>這一段要避開兩個誤用。一是把律法講成壞人，好像舊約的神很兇，新約的神才溫柔；那位家奴是父親派的，看管本身也是愛。二是以為「不在師傅手下」就是沒有規矩。長大的兒子不再需要人牽手過馬路，不是因為馬路變安全了，是因為他裡面有了判斷；第 5 章會說，那是聖靈的引導。<\/p><p>有些基督徒信主多年，仍然活得像被家奴看管的孩子：怕犯錯、怕被罰、數算自己做得夠不夠。保羅要說的是：你已經過了那個年紀。律法的三分法、道德誡命今天怎樣用，本章議題頁並陳各家；這裡只要記得，師傅帶你到的地方，是父親的家。<\/p>"},{"a":26,"z":27,"star":1,"grk":"<p lang=\"grc\">πάντες γὰρ υἱοὶ θεοῦ ἐστε διὰ τῆς πίστεως ἐν Χριστῷ Ἰησοῦ.<\/p><p lang=\"grc\">ὅσοι γὰρ εἰς Χριστὸν ἐβαπτίσθητε, Χριστὸν ἐνεδύσασθε·<\/p>","lit":"<p>因為你們全都是神的兒子，藉著那信，在基督耶穌裡。<\/p><p>因為你們凡受洗進入基督的，都穿上了基督。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>πάντες γὰρ υἱοὶ θεοῦ ἐστε<\/td><td>pantes gar huioi theou este<\/td><td>因為你們全都是神的兒子<\/td><td>從「我們」轉為「你們」<\/td><\/tr><tr><td>διὰ τῆς πίστεως<\/td><td>dia tēs pisteōs<\/td><td>藉著信<\/td><td>兒子的身分藉信領受<\/td><\/tr><tr><td>ὅσοι γὰρ εἰς Χριστὸν ἐβαπτίσθητε<\/td><td>hosoi gar eis Christon ebaptisthēte<\/td><td>凡受洗進入基督的<\/td><td>洗禮是歸屬的記號<\/td><\/tr><tr><td>Χριστὸν ἐνεδύσασθε<\/td><td>Christon enedysasthe<\/td><td>你們穿上了基督<\/td><td>中間語態：自己穿上<\/td><\/tr><\/table>","gram":"<p><strong>第 26 節的主詞從「我們」轉成「你們」，πάντες（pantes） 放在句首。<\/strong><\/p><p>πάντες γὰρ υἱοὶ θεοῦ ἐστε（pantes gar huioi theou este）：不是部分，是全部；不是將來，是現在式。被看管的孩子（3:24）已經是兒子，這正好接 4:1–7。διὰ τῆς πίστεως ἐν Χριστῷ Ἰησοῦ（dia tēs pisteōs en Christō Iēsou） 可以讀成「藉著對基督耶穌的信」，也可以分開讀：「藉著信，在基督耶穌裡，都是神的兒子」。後一讀把 ἐν Χριστῷ（en Christō） 連到「兒子」，與 3:28 的 ἐν Χριστῷ Ἰησοῦ（en Christō Iēsou） 平行，本講義較取這一讀。υἱοί（huioi） 在這裡包括女兒：「你們要作我的兒女」（林後 6:18）。<\/p><p>第 27 節 γάρ（gar） 給出理由。ἐνεδύσασθε（enedysasthe） 是不定過去式中間語態，「你們穿上了」。學者觀察到，羅馬少年成年時要脫下童裝、穿上成人的長袍；放在 3:24–25 的家奴之後，這個畫面很貼切。保羅在羅馬書也用同一個字作勸勉：「總要披戴主耶穌基督」（羅 13:14）。<\/p>","exp":"<p><strong>「你們因信基督耶穌都是神的兒子。」（3:26）<\/strong><\/p><p>上一段講家奴，這一段講兒子。身分換了：不是更守規矩的學生，是父親的兒女。加拉太人想靠割禮成為亞伯拉罕的子孫，保羅說，你們已經是神的兒子了，比他們想要的更高。<\/p><p>「你們受洗歸入基督的都是披戴基督了」（3:27）。洗禮在這裡不是加在信心之外的另一個條件，而是公開表明：我屬於基督。攪擾者要的記號是割禮，刻在身體上，只有男人能受；保羅指著的記號是洗禮，男女、猶太人與外邦人都一樣受。下一節的「都成為一」，已經在這裡打好地基。<\/p><p>「披戴」是一個穿衣服的畫面。同一件衣服，穿在不同的身體上：高的、矮的，男的、女的，說閩南語的、說英語的。衣服沒有把身體換掉，但人一看，認出來的是那件衣服。基督徒在神面前被認出來的，不是自己的出身，是基督。<\/p>"},{"a":28,"z":29,"star":3,"grk":"<p lang=\"grc\">οὐκ ἔνι Ἰουδαῖος οὐδὲ Ἕλλην, οὐκ ἔνι δοῦλος οὐδὲ ἐλεύθερος, οὐκ ἔνι ἄρσεν καὶ θῆλυ· πάντες γὰρ ὑμεῖς εἷς ἐστε ἐν Χριστῷ Ἰησοῦ.<\/p><p lang=\"grc\">εἰ δὲ ὑμεῖς Χριστοῦ, ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ, κατʼ ἐπαγγελίαν κληρονόμοι.<\/p>","lit":"<p>在那裡沒有猶太人也沒有希臘人，沒有奴僕也沒有自主的，沒有男和女；因為你們全都是一個，在基督耶穌裡。<\/p><p>而若你們是屬基督的，那麼你們就是亞伯拉罕的子孫，是照著應許的承受者。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>οὐκ ἔνι<\/td><td>ouk eni<\/td><td>沒有<\/td><td>強調的否定：在那裡沒有這區分<\/td><\/tr><tr><td>Ἰουδαῖος οὐδὲ Ἕλλην<\/td><td>Ioudaios oude Hellēn<\/td><td>猶太人也不是希臘人<\/td><td>民族<\/td><\/tr><tr><td>δοῦλος οὐδὲ ἐλεύθερος<\/td><td>doulos oude eleutheros<\/td><td>奴僕也不是自主的<\/td><td>階級；追蹤：自由與奴僕<\/td><\/tr><tr><td>ἄρσεν καὶ θῆλυ<\/td><td>arsen kai thēly<\/td><td>男和女<\/td><td>連接詞換了：回聲創 1:27<\/td><\/tr><tr><td>εἷς ἐστε<\/td><td>heis este<\/td><td>你們是一個<\/td><td>陽性：一個人，不是一樣東西<\/td><\/tr><tr><td>τοῦ Ἀβραὰμ σπέρμα ἐστέ<\/td><td>tou Abraam sperma este<\/td><td>你們是亞伯拉罕的後裔<\/td><td>單數集合名詞，回到 3:16<\/td><\/tr><tr><td>κατʼ ἐπαγγελίαν κληρονόμοι<\/td><td>kat' epangelian klēronomoi<\/td><td>照應許的承受者<\/td><td>接 4:1–7<\/td><\/tr><\/table>","gram":"<p><strong>◆ 3:28 的三組對照，第三組的連接詞換了。<\/strong><\/p><p>前兩組是 οὐδὲ（oude）：Ἰουδαῖος οὐδὲ Ἕλλην（Ioudaios oude Hellēn）、δοῦλος οὐδὲ ἐλεύθερος（doulos oude eleutheros）；第三組卻是 ἄρσεν καὶ θῆλυ（arsen kai thēly）「男和女」。這幾個字正是創 1:27 七十士譯本的字句，「造男造女」（創 1:27）。保羅不是說創造的男女被取消，而是說在基督裡，這一對不再決定誰更靠近神。ἄρσεν（arsen） 與 θῆλυ（thēly） 是中性的生理用字，不是「丈夫、妻子」，焦點在受造的性別，不在婚姻角色。<\/p><p>οὐκ ἔνι（ouk eni） 是強調的否定，「在那裡根本沒有」。學者觀察到，猶太男人的晨禱裡有感謝神沒有使他成為外邦人、奴僕、女人的句子；希臘人也有類似的格言。保羅列的三組，正是當時社會最深的三條隔閡。西 3:11 有平行的清單。<\/p><p>πάντες γὰρ ὑμεῖς εἷς ἐστε（pantes gar hymeis heis este）：εἷς（heis） 是陽性，不是中性的 ἕν（hen）。不是「一樣東西」，是「一個人」；這使我們想起弗 2:15「造成一個新人」（弗 2:15）。也回到 3:16 與 3:20 的「一」：神是一位，那子孫是一個，在他裡面的人成為一個。<\/p><p>第 29 節 εἰ δὲ ὑμεῖς Χριστοῦ（ei de hymeis Christou） 是真實條件句。ἄρα τοῦ Ἀβραὰμ σπέρμα ἐστέ（ara tou Abraam sperma este） 用的正是 3:16 那個單數 σπέρμα（sperma）：一個子孫是基督，屬基督的眾人就在那一個子孫裡。κληρονόμοι（klēronomoi） 收尾，接到 4:1「那承受產業的」（4:1）。<\/p>","exp":"<p><strong>「並不分猶太人、希臘人，自主的、為奴的，或男或女，因為你們在基督耶穌裡都成為一了。」（3:28）<\/strong><\/p><p>這是本章的山峰。三組隔閡：民族、階級、性別。第一世紀的人每天活在這三條線裡：猶太人不和外邦人同桌，主人不和奴隸平起平坐，男人在會堂裡站在女人前面。保羅說，在基督裡，這三條線不再決定誰屬於神、誰可以坐上桌子。<\/p><p>但合一不是一樣。3:28 沒有說猶太人變成希臘人，女人變成男人，奴隸的處境一夜之間消失。保羅自己仍是猶太人，仍稱呼男女不同的家人。「披戴基督」是同一件衣服、不同的身體。所以這一節不可以拿來抹平一切差異，叫人否定自己的文化、身體或身分；也不可以反過來，用差異為排斥找理由——「我們這一堂比較屬靈」、「他們那一族比較難帶」。語言分堂可以是為了福音的方便，但不可以變成彼得那一張分開的桌子。<\/p><p>「或男或女」在今天的教會引起許多討論。<strong>互補派<\/strong>認為 3:28 講的是在救恩上的平等，不取消教會與家庭裡的角色分工；<strong>平等派<\/strong>認為 3:28 是保羅神學的原則，其他經文是處境性的應用，今天男女都可以擔任一切職分。兩派都是敬重聖經權威的福音派，本講義並陳，不替各教會決定。但兩派都必須同意：3:28 之後，任何貶低、輕看、排斥女性的講法與做法都違背福音。「自主的、為奴的」：保羅為甚麼沒有直接廢除奴隸制，本章議題頁另有討論。<\/p><p>「你們既屬乎基督，就是亞伯拉罕的後裔，是照著應許承受產業的了。」（3:29）一個子孫是基督（3:16），屬基督的人就在那一個子孫裡。外邦信徒不必先變成猶太人，才能作亞伯拉罕的後裔；他們在基督裡已經是了。<\/p><p>這一節不可講成教會取代了以色列、神棄絕了猶太人。保羅在羅馬書說得清楚：「神棄絕了他的百姓嗎？斷乎沒有！」（羅 11:1）外邦人是被接上的野橄欖枝，「不是你托著根，乃是根托著你」（羅 11:18）。3:29 說的是外邦人被接進來，不是猶太人被趕出去。全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」。<\/p><p>這一章從「無知的加拉太人」開始，在「都成為一」與「承受產業」收尾。中間是被掛在木頭上的基督。人在十字架下成為一，不是因為彼此相同，是因為同被一位贖出來。<\/p>"}],"4":[{"a":1,"z":3,"star":2,"grk":"<p lang=\"grc\">Λέγω δέ, ἐφʼ ὅσον χρόνον ὁ κληρονόμος νήπιός ἐστιν, οὐδὲν διαφέρει δούλου κύριος πάντων ὤν,<\/p><p lang=\"grc\">ἀλλὰ ὑπὸ ἐπιτρόπους ἐστὶ καὶ οἰκονόμους ἄχρι τῆς προθεσμίας τοῦ πατρός.<\/p><p lang=\"grc\">οὕτως καὶ ἡμεῖς, ὅτε ἦμεν νήπιοι, ὑπὸ τὰ στοιχεῖα τοῦ κόσμου ἤμεθα δεδουλωμένοι·<\/p>","lit":"<p>而我說，承受產業的人只要是孩童的一段時間，他與奴僕毫無分別，雖然他是一切的主人，<\/p><p>卻是在監護人和管家之下，直到父親預先定好的日期。<\/p><p>我們也是這樣：當我們是孩童的時候，我們在世界的基本元素之下，曾是被奴役的；<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ὁ κληρονόμος νήπιός ἐστιν<\/td><td>ho klēronomos nēpios estin<\/td><td>承受產業的是孩童<\/td><td>νήπιος 是還不會說話的小孩，法律上未成年<\/td><\/tr><tr><td>οὐδὲν διαφέρει δούλου<\/td><td>ouden diapherei doulou<\/td><td>與奴僕毫無分別<\/td><td>分別的是權利，不是身分<\/td><\/tr><tr><td>κύριος πάντων ὤν<\/td><td>kyrios pantōn ōn<\/td><td>雖然是一切的主人<\/td><td>讓步分詞：名分已經在了<\/td><\/tr><tr><td>ὑπὸ ἐπιτρόπους<\/td><td>hypo epitropous<\/td><td>在監護人之下<\/td><td>管孩子人身的人<\/td><\/tr><tr><td>οἰκονόμους<\/td><td>oikonomous<\/td><td>管家<\/td><td>管孩子財產的人<\/td><\/tr><tr><td>ἄχρι τῆς προθεσμίας τοῦ πατρός<\/td><td>achri tēs prothesmias tou patros<\/td><td>直到父親預定的日期<\/td><td>日期由父親定，不由孩子定<\/td><\/tr><tr><td>ὑπὸ τὰ στοιχεῖα τοῦ κόσμου<\/td><td>hypo ta stoicheia tou kosmou<\/td><td>在世界的基本元素之下<\/td><td>和合本作「世俗小學」<\/td><\/tr><tr><td>ἤμεθα δεδουλωμένοι<\/td><td>ēmetha dedoulōmenoi<\/td><td>我們曾是被奴役的<\/td><td>迂說的過去完成式：長久的狀態<\/td><\/tr><\/table>","gram":"<p><strong>Λέγω δέ（Legō de） 把第 3 章的最後一個字接下去。<\/strong><\/p><p>3:29 剛說完「是照著應許承受產業的了」（3:29），4:1 就從 ὁ κληρονόμος（ho klēronomos） 開口——同一個字族。保羅換了一幅圖：不再是法庭，是家。一個繼承人 νήπιός ἐστιν（nēpios estin），還是孩童；κύριος πάντων ὤν（kyrios pantōn ōn） 是讓步分詞，「雖然是一切的主人」——名分已經寫在遺囑上，只是還沒有到手。所以 οὐδὲν διαφέρει δούλου（ouden diapherei doulou）：在權利上，他和家裡的奴僕一樣，被人管、不能作主。<\/p><p>第 2 節兩個管人的角色：ἐπιτρόπους（epitropous） 管孩子的人身，οἰκονόμους（oikonomous） 管孩子的財產。ἄχρι τῆς προθεσμίας τοῦ πατρός（achri tēs prothesmias tou patros），προθεσμία（prothesmia） 全本新約只出現這一次，是法律上「預先訂定的期限」。羅馬法的監護期有固定的年歲，保羅卻說是「父親預定的」——比喻服務神學，不照法條：時候由父親決定。<\/p><blockquote><p>τὰ στοιχεῖα τοῦ κόσμου（ta stoicheia tou kosmou） 是全章的難題，學者有三說：①<strong>基本規條<\/strong>，像字母表 ABC，初學的東西（和合本「小學」取此）；②<strong>宇宙元素<\/strong>，土、水、火、風，古人以為管轄世界的物質；③<strong>靈界勢力<\/strong>，掌管星宿、節令的屬靈權勢（參西 2:8、20）。4:8--9 把 στοιχεῖα（stoicheia） 和「那些本來不是神的」放在一起，4:10 又接著說日子、月份——③有它的道理。本講義取①為骨幹、兼含③：一套用規條與時令管人的宗教秩序，背後還有不是神的權勢。ἤμεθα δεδουλωμένοι（ēmetha dedoulōmenoi） 是迂說的過去完成式，「一直處在被奴役的狀態」。最驚人的是 ἡμεῖς（hēmeis）：保羅這個生來的猶太人，把自己也放進去了。<\/p><\/blockquote>","exp":"<p>加拉太人遇到的，是一套很有吸引力的說法：「你們信了耶穌很好，但要受割禮，才算真正進了亞伯拉罕的家。」攪擾你們的人沒有叫他們離開基督，只是在基督後面加上一道門檻。保羅在第 3 章已經說完：你們因信就是亞伯拉罕的後裔。第 4 章他換一幅家裡的圖，回答另一個問題：那麼律法那段日子算甚麼？<\/p><p>答案是：那是未成年的日子。孩子是真的繼承人，但「為孩童的時候卻與奴僕毫無分別」（4:1）。他不能動用產業，事事要問師傅和管家。這不是因為他不是兒子，是因為時候還沒有到。律法就是那位師傅：它管著、看著、教著，但它從來不是那份產業本身。<\/p><p>第 3 節最叫人吃驚。「我們為孩童的時候，受管於世俗小學之下，也是如此」（4:3）——保羅說「我們」。一個在猶太教裡長進、比同歲的人更熱心的法利賽人，竟把律法底下的猶太人，和拜偶像的外邦人，放在同一張「小學」的課表上。他不是說律法和偶像一樣壞；他是說兩者有同一個結構：<strong>人在一套規條底下，靠守住它來確定自己的地位。<\/strong><\/p><p>今天的「小學」換了課本，結構沒有換。有人信主多年，仍然靠讀經的天數、聚會的出席率、奉獻的比例來確認神有沒有接納他。那些都是好東西，但若它們成了確定身分的門檻，人就又回到師傅手下，作一個有名分、沒有自由的孩子。<\/p>"},{"a":4,"z":5,"star":3,"grk":"<p lang=\"grc\">ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου, ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ, γενόμενον ἐκ γυναικός, γενόμενον ὑπὸ νόμον,<\/p><p lang=\"grc\">ἵνα τοὺς ὑπὸ νόμον ἐξαγοράσῃ, ἵνα τὴν υἱοθεσίαν ἀπολάβωμεν.<\/p>","lit":"<p>但當時間的滿足來到，神差出了他的兒子，從女人而生，生在律法之下，<\/p><p>好叫他把在律法之下的人買贖出來，好叫我們領受兒子的名分。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τὸ πλήρωμα τοῦ χρόνου<\/td><td>to plērōma tou chronou<\/td><td>時間的滿足<\/td><td>回應 4:2 父親預定的日期<\/td><\/tr><tr><td>ἐξαπέστειλεν ὁ θεὸς τὸν υἱὸν αὐτοῦ<\/td><td>exapesteilen ho theos ton huion autou<\/td><td>神差出了他的兒子<\/td><td>4:6 同一個動詞再用一次<\/td><\/tr><tr><td>γενόμενον ἐκ γυναικός<\/td><td>genomenon ek gynaikos<\/td><td>從女人而生<\/td><td>真實的人性<\/td><\/tr><tr><td>γενόμενον ὑπὸ νόμον<\/td><td>genomenon hypo nomon<\/td><td>生在律法之下<\/td><td>與我們站在同一個位置<\/td><\/tr><tr><td>ἐξαγοράσῃ<\/td><td>exagorasē<\/td><td>買贖出來<\/td><td>3:13 同一個字<\/td><\/tr><tr><td>τὴν υἱοθεσίαν ἀπολάβωμεν<\/td><td>tēn huiothesian apolabōmen<\/td><td>領受兒子的名分<\/td><td>υἱοθεσία：收養為子<\/td><\/tr><\/table>","gram":"<p><strong>ὅτε δὲ（hote de） 是全章的轉軸。<\/strong><\/p><p>第 3 節 ὅτε ἦμεν νήπιοι（hote ēmen nēpioi），「當我們是孩童的時候」；第 4 節 ὅτε δὲ ἦλθεν τὸ πλήρωμα τοῦ χρόνου（hote de ēlthen to plērōma tou chronou），「但當時間的滿足來到」。同一個 ὅτε（hote），一個指向被奴役的日子，一個指向神動手的日子。τὸ πλήρωμα（to plērōma） 是「裝滿」——像一個容器滿了，正對應 4:2 的 προθεσμία（prothesmia）：父親定的日子到了。<\/p><p>第 4、5 節是一組交錯排列：<\/p><blockquote><p>A　γενόμενον ἐκ γυναικός（從女人而生）<br>B　γενόμενον ὑπὸ νόμον（生在律法之下）<br>B′　ἵνα τοὺς ὑπὸ νόμον ἐξαγοράσῃ（把律法以下的人贖出來）<br>A′　ἵνα τὴν υἱοθεσίαν ἀπολάβωμεν（叫我們得著兒子的名分）<\/p><\/blockquote><p>他進到我們的位置，好把我們帶到他的位置：生在律法以下的，贖出律法以下的人；女子所生的兒子，使我們成為兒子。ἐξαγοράσῃ（exagorasē） 與 3:13 的 ἐξηγόρασεν（exēgorasen） 同字，是在市場上把奴隸買出來。υἱοθεσία（huiothesia） 是羅馬法的收養：被收養的人舊的債一筆勾銷，取了新的姓，與親生的兒子有同樣的繼承權。γενόμενον ἐκ γυναικός（genomenon ek gynaikos） 強調的是真實的人性，學者多不以為保羅在這裡論童女生子。本卷追蹤 νόμος（nomos） 在這裡落一站：兒子自己「生在律法以下」。<\/p>","exp":"<p>「及至時候滿足，神就差遣他的兒子，為女子所生，且生在律法以下」（4:4）。這一節的主詞是神。孩子不能決定自己哪一天成年，奴僕不能替自己贖身——轉變的那一天，是父親定的，也是父親自己來成就的。<\/p><p>神的方法是「差遣他的兒子」。他不是從天上發一道命令說「你們自由了」；他讓兒子走進奴僕的處境，被女人懷胎、生下，在律法底下受割禮、守節期、被律法管著。腓立比書說他「取了奴僕的形像」（腓 2:7）。<strong>他先成為我們，我們才能成為他。<\/strong><\/p><p>「時候滿足」也提醒我們，神作事有他的鐘。從亞伯拉罕到基督，中間隔著幾千年的等待；在人看來是拖延，在父親看來是預定的日期。加拉太人急著用割禮替自己的身分加一道保險，正是忘了：該來的那一天已經來了，父親已經親自動手了。<\/p><p>目的有兩個 ἵνα（hina）：「要把律法以下的人贖出來，叫我們得著兒子的名分」（4:5）。第一個是解除，第二個是給予。神不只把我們從奴役裡買出來，放在門外說「你走吧」；他把我們收進家裡，改了姓，寫進遺囑。υἱοθεσία（huiothesia） 這個字說的是一個法律事實，不是一種感覺：收養文件一簽，孩子不會因為某一天表現不好，就被退回孤兒院。<\/p><p>這就是 3:13 的另一面。「基督既為我們受了咒詛」（3:13）講的是贖價；4:5 講的是贖出來以後去哪裡——去作兒子。加拉太人想靠割禮爭取一個在亞伯拉罕家裡的位置；保羅說，你們早就有了一個更大的位置：在神家裡作兒子。<strong>被收養的人不必再申請入籍。<\/strong>今天信耶穌再加上任何一道手續才算數的想法，都是一張不必要的申請表。<\/p>"},{"a":6,"z":6,"star":3,"grk":"<p lang=\"grc\">ὅτι δέ ἐστε υἱοί, ἐξαπέστειλεν ὁ θεὸς τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ εἰς τὰς καρδίας ἡμῶν κρᾶζον· Αββα ὁ πατήρ.<\/p>","lit":"<p>而因為你們是兒子，神就差出了他兒子的靈，進入我們的心，呼叫：阿爸，父！<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ὅτι δέ ἐστε υἱοί<\/td><td>hoti de este huioi<\/td><td>而因為你們是兒子<\/td><td>身分在前，聖靈在後<\/td><\/tr><tr><td>τὸ πνεῦμα τοῦ υἱοῦ αὐτοῦ<\/td><td>to pneuma tou huiou autou<\/td><td>他兒子的靈<\/td><td>全本新約只有這裡這樣稱呼聖靈<\/td><\/tr><tr><td>εἰς τὰς καρδίας ἡμῶν<\/td><td>eis tas kardias hēmōn<\/td><td>進入我們的心<\/td><td>◆ 和合本正文作「你們」<\/td><\/tr><tr><td>κρᾶζον<\/td><td>krazon<\/td><td>呼叫著<\/td><td>中性分詞，主詞是那靈<\/td><\/tr><tr><td>Αββα ὁ πατήρ<\/td><td>Abba ho patēr<\/td><td>阿爸，父<\/td><td>亞蘭文加希臘文，兩種語言叫同一位<\/td><\/tr><\/table>","gram":"<p><strong>◆ 經文鑑別：「你們的心」還是「我們的心」。<\/strong><\/p><p>SBLGNT 作 εἰς τὰς καρδίας ἡμῶν（eis tas kardias hēmōn），「我們的心」；拜占庭本（RP）作 ὑμῶν（hymōn），「你們的心」。和合本正文譯「你們的心」，cu89t 的註腳說明「原文是我們」。早期而重要的抄本多作 ἡμῶν（hēmōn）；而且前半句是 ἐστε（este），「你們是」，後半句忽然換成「我們」，是比較難的讀法——抄寫的人很容易把它改順成 ὑμῶν（hymōn），反過來改的可能性小。本講義判斷原文是 ἡμῶν（hēmōn）；和合本照上下文譯作「你們」並加註，意思沒有失落。但 ἡμῶν（hēmōn） 讓人看見一件事：<strong>保羅把自己也放進呼叫阿爸的人中間了。<\/strong><\/p><p>ὅτι（hoti） 有兩種讀法：①因果，「因為你們是兒子，所以神差了靈」；②證明，「為了證明你們是兒子，神差了靈」。和合本「你們既為兒子」取①，本講義從之：身分在前，聖靈的工作在後，聖靈不是用來換取身分的，是身分帶來的。<\/p><blockquote><p>第 4 節與第 6 節用同一個 ἐξαπέστειλεν ὁ θεὸς（exapesteilen ho theos）：神差出兒子，神差出兒子的靈。父、子、靈在一節之內都在。κρᾶζον（krazon） 是中性分詞，配 τὸ πνεῦμα（to pneuma）——在加拉太書，呼叫的是那靈；在羅 8:15 則是「我們呼叫」，兩處合起來看，是靈在我們裡面、我們用自己的口一同呼叫。κράζω（krazō） 是大聲喊，不是低聲念。Αββα（Abba） 是亞蘭文孩子叫父親的話，ὁ πατήρ（ho patēr） 是主格作呼格用的希臘文。本卷追蹤 πνεῦμα（pneuma） 與 υἱός（huios） 在這一節相遇。<\/p><\/blockquote>","exp":"<p>「你們既為兒子，神就差他兒子的靈進入你們的心，呼叫：『阿爸！父！』」（4:6）這一節是本章在全卷地勢圖上的平地，也是加拉太書最溫暖的一句話。前面三章滿是爭辯、咒詛、律法；到這裡，忽然聽見一個孩子叫父親。<\/p><p>聖靈在這裡有一個特別的名字：「他兒子的靈」。同一位在兒子裡面叫父親的靈，被差到我們心裡，用同一個稱呼叫同一位父親。這使我們想起客西馬尼園：「阿爸！父啊！在你凡事都能」（可 14:36）——耶穌在最痛苦的夜裡這樣稱呼神。保羅沒有說他在引用那個場景，但學者觀察到，早期教會能夠用耶穌自己的話叫神，是一件極大的事。羅馬書說：「所受的，乃是兒子的心，因此我們呼叫：『阿爸！父！』」（羅 8:15）<\/p><p>「阿爸」和「父」兩個詞並排，一個是亞蘭文，一個是希臘文。猶太信徒和外邦信徒用各自的母語，叫同一位父親。第 2 章那張被拆開的餐桌（2:12），在這一聲呼叫裡重新合起來。<\/p><p>這一節也回答一個牧養上常見的問題：我怎麼知道自己是神的兒女？答案不在感覺有多強。很多人信主多年，「阿爸」兩個字仍然叫不出口——也許是因為自己的父親很遙遠、很嚴厲，或根本不在。但經文的次序是：「你們既為兒子」，神才差靈來。身分不是靠呼叫得來的；呼叫是身分自己長出來的聲音。<strong>有時候聲音很小，有時候只是一聲嘆息，但那靈仍在裡面叫著。<\/strong>確據的根基是神差了他的兒子（4:4），也差了他兒子的靈（4:6）——兩次差遣，都是神作的。（得救的確據，見本章議題頁。）<\/p>"},{"a":7,"z":7,"star":3,"grk":"<p lang=\"grc\">ὥστε οὐκέτι εἶ δοῦλος ἀλλὰ υἱός· εἰ δὲ υἱός, καὶ κληρονόμος διὰ θεοῦ.<\/p>","lit":"<p>所以你不再是奴僕，乃是兒子；而若是兒子，也是後嗣，藉著神。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ὥστε<\/td><td>hōste<\/td><td>所以<\/td><td>把 4:1--6 收成一個結論<\/td><\/tr><tr><td>οὐκέτι εἶ δοῦλος ἀλλὰ υἱός<\/td><td>ouketi ei doulos alla huios<\/td><td>你不再是奴僕，乃是兒子<\/td><td>和合本譯「從此以後，你不是奴僕」<\/td><\/tr><tr><td>εἶ<\/td><td>ei<\/td><td>你是<\/td><td>第二人稱單數：從「你們」轉到「你」<\/td><\/tr><tr><td>εἰ δὲ υἱός<\/td><td>ei de huios<\/td><td>既是兒子<\/td><td>條件句，條件已經成立<\/td><\/tr><tr><td>κληρονόμος διὰ θεοῦ<\/td><td>klēronomos dia theou<\/td><td>藉著神為後嗣<\/td><td>回到 4:1 的 κληρονόμος<\/td><\/tr><\/table>","gram":"<p><strong>第 7 節把一整段論證，壓成一個人能帶回家的句子。<\/strong><\/p><p>ὥστε（hōste） 是結論詞。最值得注意的是動詞：前面都是複數的「你們」，這裡忽然是 εἶ（ei），第二人稱單數。保羅從一群人轉向一個人——讀信的每一個加拉太人，都聽見「你」。<\/p><p>οὐκέτι（ouketi） 字面是「不再」。和合本譯作「從此以後，你不是奴僕，乃是兒子了」，<strong>句子裡沒有「再」字<\/strong>：「從此以後」標出一條分界線，「你不是」是一個直述的宣告。有些譯本作「不再是奴僕」，意思相同，但和合本的句型讓人更清楚聽見：這不是一個漸進的過程，是一個已經發生的身分轉換。οὐκ（ouk）……ἀλλά（alla） 是本卷愛用的對照，像 2:20 也用同一個 οὐκέτι（ouketi）：「現在活著的不再是我……他是愛我，為我捨己」（2:20）。<\/p><p>εἰ δὲ υἱός（ei de huios）, καὶ κληρονόμος（kai klēronomos） 是條件句，但條件已經成立。κληρονόμος（klēronomos） 把本段帶回 4:1 那個「承受產業的」：未成年的繼承人，現在成年了。διὰ θεοῦ（dia theou） 交代是誰成就的：藉著神。拜占庭本作 κληρονόμος θεοῦ διὰ Χριστοῦ（klēronomos theou dia Christou），意思相近，SBLGNT 與和合本不取。本卷追蹤 ἐλευθερία（eleutheria）／δοῦλος（doulos） 與 υἱός（huios） 在這一節交會。<\/p>","exp":"<p>「可見，從此以後，你不是奴僕，乃是兒子了；既是兒子，就靠著神為後嗣」（4:7）。這是本章的章題。<\/p><p>請注意和合本沒有說「你不再作奴僕」或「你漸漸不是奴僕」。它說「從此以後，你不是」。身分是一個宣告，不是一個進度。一個被收養的孩子，進門的那一天就是這家的兒子；他還要學很多事，還會犯錯，還會因為從前的習慣害怕、討好、躲藏——但這一切都不改變門牌上的姓。<\/p><p>很多信徒活得像一個「快要成為兒子」的奴僕：表現好的時候覺得神近，失敗的時候覺得要重新申請。加拉太人的問題就在這裡：他們以為受了割禮，才算真正進了家。保羅用單數的「你」，一個一個地對他們說：你已經在家裡了。<strong>奴僕靠表現留下來，兒子靠父親留下來。<\/strong><\/p><p>「既是兒子，就靠著神為後嗣」（4:7）。後嗣的身分也不是自己掙的，是「靠著神」。產業不是工錢，是遺產；工錢要按工作算，遺產只問你是誰的孩子。這也是 3:29 那一句的收成：照著應許承受產業的，不必再補交任何一樣條件。<\/p><p>這一節也是 321 的根基。國度321空中團契的「無己不再是我乃是基督，不是我自己活乃是基督在我裡面活」，出自 2:20；而 2:20 說「不再是我」的那一口氣，緊接著就是「他是愛我，為我捨己」（2:20）。無己不是一個奴僕把自己抹掉，是一個兒子知道自己被愛到一個地步，不必再為自己爭位置。先有 4:7 的「你是兒子」，才有 2:20 的「基督在我裡面活」——身分換了，走路的方式才換得了。<strong>一個還在擔心自己是不是奴僕的人，沒有辦法無己；他只能更努力地保住自己。<\/strong><\/p>"},{"a":8,"z":9,"star":2,"grk":"<p lang=\"grc\">Ἀλλὰ τότε μὲν οὐκ εἰδότες θεὸν ἐδουλεύσατε τοῖς φύσει μὴ οὖσι θεοῖς·<\/p><p lang=\"grc\">νῦν δὲ γνόντες θεόν, μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ, πῶς ἐπιστρέφετε πάλιν ἐπὶ τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα, οἷς πάλιν ἄνωθεν δουλεύειν θέλετε;<\/p>","lit":"<p>但那時，你們不認識神，就給那些本性上不是神的作了奴僕；<\/p><p>但現在，你們已認識了神，更是已被神所認識，怎麼又轉回到那軟弱而貧乏的基本元素，你們願意再一次從頭給它們作奴僕呢？<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>οὐκ εἰδότες θεὸν<\/td><td>ouk eidotes theon<\/td><td>不認識神<\/td><td>從前的狀態<\/td><\/tr><tr><td>τοῖς φύσει μὴ οὖσι θεοῖς<\/td><td>tois physei mē ousi theois<\/td><td>那些本性上不是神的<\/td><td>有名無實的神<\/td><\/tr><tr><td>γνόντες θεόν<\/td><td>gnontes theon<\/td><td>已經認識了神<\/td><td>不定過去式分詞<\/td><\/tr><tr><td>μᾶλλον δὲ γνωσθέντες ὑπὸ θεοῦ<\/td><td>mallon de gnōsthentes hypo theou<\/td><td>更是被神所認識<\/td><td>保羅當場改正自己的話<\/td><\/tr><tr><td>τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα<\/td><td>ta asthenē kai ptōcha stoicheia<\/td><td>軟弱而貧乏的基本元素<\/td><td>和合本「懦弱無用的小學」<\/td><\/tr><tr><td>πάλιν ἄνωθεν δουλεύειν θέλετε<\/td><td>palin anōthen douleuein thelete<\/td><td>願意再一次從頭作奴僕<\/td><td>兩個「再」疊在一起<\/td><\/tr><\/table>","gram":"<p><strong>第 8、9 節是一組 τότε μέν（tote men）……νῦν δέ（nyn de） 的對照。<\/strong><\/p><p>「那時」οὐκ εἰδότες θεὸν（ouk eidotes theon），ἐδουλεύσατε（edouleusate） 是不定過去式，指他們歸信以前那一整段拜偶像的日子；τοῖς φύσει μὴ οὖσι θεοῖς（tois physei mē ousi theois），「那些本性上不是神的」——φύσει（physei） 是「按本性」，它們有神的名字、廟宇、祭司，卻沒有神的本質。<\/p><p>「現在」γνόντες θεόν（gnontes theon），保羅說到一半，用 μᾶλλον δὲ（mallon de） 改正自己：γνωσθέντες ὑπὸ θεοῦ（gnōsthentes hypo theou），「更是被神所認識」。主動分詞換成被動分詞，主角從人換成神。這個自我修正是刻意的：在加拉太的爭論裡，人人都在談自己知道多少、守了多少；保羅把重心翻過來——<strong>重要的不是你抓住了神，是神認得你。<\/strong><\/p><blockquote><p>πῶς ἐπιστρέφετε（pōs epistrephete） 是現在式，「你們正在轉回去」，事情還在進行，還來得及停。ἀσθενῆ καὶ πτωχὰ（asthenē kai ptōcha） 形容 στοιχεῖα（stoicheia）：軟弱，因為救不了人；貧乏，因為給不出產業。最重的是 πάλιν ἄνωθεν（palin anōthen），兩個副詞疊在一起，「再一次、從頭」。θέλετε（thelete），「你們願意」——沒有人逼他們，是他們自己想要。這是全章最尖銳的推論：外邦信徒接受割禮與猶太節期，在保羅看來，等於回到從前拜假神的那種奴役——不是因為律法是異教，是因為把它當作得救的門檻，結構就和從前一樣。<\/p><\/blockquote>","exp":"<p>加拉太人從前拜的是甚麼？在南加拉太的路司得，城外有宙斯的廟，祭司牽著牛、拿著花圈，要向保羅和巴拿巴獻祭（徒 14:13）。保羅當時對他們說：「是叫你們離棄這些虛妄，歸向那創造天、地、海，和其中萬物的永生神」（徒 14:15）。這些人真的離棄了偶像，認識了神。現在，攪擾你們的人帶來另一套日子、規條、記號，他們又覺得：多守一點，比較穩當。<\/p><p>保羅的話很重：「怎麼還要歸回那懦弱無用的小學，情願再給他作奴僕呢？」（4:9）他沒有說律法等於偶像；他說的是，人把任何東西放在基督旁邊當作得救的保險，靈魂就回到同一種姿勢——討好、害怕、計算。拜偶像的人計算要燒多少香，守規條的人計算要守多少條；姿勢一樣，都是奴僕。<\/p><p>那個自我修正值得帶回家：「更可說是被神所認識的」（4:9）。一個人若只知道「我認識神」，他會一直擔心自己認識得夠不夠；一個人若知道「神認識我」，他就可以安息。<strong>屬靈的安全感，不建立在我對神的把握上，建立在神對我的記得上。<\/strong>這也是保羅能說「懦弱無用」的理由：那些東西沒有一樣認得你。<\/p>"},{"a":10,"z":10,"star":2,"grk":"<p lang=\"grc\">ἡμέρας παρατηρεῖσθε καὶ μῆνας καὶ καιροὺς καὶ ἐνιαυτούς.<\/p>","lit":"<p>你們仔細守著日子，和月份，和節期，和年份。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἡμέρας παρατηρεῖσθε<\/td><td>hēmeras paratēreisthe<\/td><td>你們仔細守著日子<\/td><td>中間語態現在式：一直小心看守<\/td><\/tr><tr><td>μῆνας<\/td><td>mēnas<\/td><td>月份<\/td><td>月朔，或每月的吉凶<\/td><\/tr><tr><td>καιροὺς<\/td><td>kairous<\/td><td>節期<\/td><td>特定的節令<\/td><\/tr><tr><td>ἐνιαυτούς<\/td><td>eniautous<\/td><td>年份<\/td><td>安息年，或年度的星象<\/td><\/tr><\/table>","gram":"<p><strong>第 10 節只有一個動詞，卻有四個受詞。<\/strong><\/p><p>ἡμέρας παρατηρεῖσθε καὶ μῆνας καὶ καιροὺς καὶ ἐνιαυτούς（hēmeras paratēreisthe kai mēnas kai kairous kai eniautous）：日子、月份、節期、年份，用三個 καί（kai） 串起來，從小到大，像一本越翻越厚的曆書。παρατηρεῖσθε（paratēreisthe） 是中間語態現在式，「為自己仔細看守著」。福音書用同一個字族形容法利賽人「窺探」耶穌會不會在安息日治病——那是一種緊盯著、怕出錯的眼光。這一節也可以讀成問句（「你們在謹守……嗎？」），語氣一樣是責備。<\/p><blockquote><p>保羅指的是甚麼曆法？學者有三說：①<strong>猶太的節期<\/strong>——安息日、月朔、逾越節、安息年，攪擾的人要外邦信徒照著守，作為入門的記號；②<strong>加拉太人歸信前的異教曆法<\/strong>——吉日凶日、月相、星象，因為 4:8--9 剛說到「那些本來不是神的」；③<strong>兩者都有<\/strong>。本講義取③：猶太派教師把加拉太人帶回一種「照著日子過才蒙神喜悅」的宗教，在保羅眼中，這和他們從前在偶像底下看日子，是同一個 στοιχεῖα（stoicheia） 的結構。<\/p><\/blockquote>","exp":"<p>這一節直接碰到華人信徒最常問的問題：基督徒可以過春節、中秋、清明嗎？可以過聖誕、復活節嗎？擇日、看時辰呢？<\/p><p>先讓經文自己說。保羅責備的不是「有日子」，是「謹守」日子——把日子當作與神關係的條件，或當作掌管禍福的力量。同一位保羅在羅馬書說：「有人看這日比那日強；有人看日日都是一樣。只是各人心裡要意見堅定」（羅 14:5）；歌羅西書說：「不拘在飲食上，或節期、月朔、安息日都不可讓人論斷你們」（西 2:16）。可見問題不在日子本身，在<strong>那一天你信靠誰<\/strong>。<\/p><p>落在華人處境：春節的團圓、中秋的賞月、清明的追思，本身是文化，是孝敬與親情，基督徒可以參與，並在其中活出見證。但祭拜、燒香、向祖先求福、擇日看時辰、看風水，就是 4:8--9 說的「給那些本來不是神的作奴僕」——那不只是文化，是信靠的對象換了。清明節去掃墓、獻花、為家人禱告而不燒香，往往比根本不去，更能把福音帶進家裡。<\/p><p>所以本講義的立場兩面都講：<strong>不一概妖魔化<\/strong>，叫初信的人與家人斷絕往來——那是另一個軛；<strong>也不一概放任<\/strong>，把求問吉凶講成「只是習俗」——4:9 說那是歸回懦弱無用的小學。教會守聖誕、復活節來記念主是美好的，但過不過不是屬靈與否的標準。（詳見本章議題頁；本講義的全卷立場見議題「基督徒的自由：在律法主義與放縱之間」。）<\/p>"},{"a":11,"z":11,"star":1,"grk":"<p lang=\"grc\">φοβοῦμαι ὑμᾶς μή πως εἰκῇ κεκοπίακα εἰς ὑμᾶς.<\/p>","lit":"<p>我為你們害怕，恐怕我向你們枉然地勞苦了。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>φοβοῦμαι ὑμᾶς<\/td><td>phoboumai hymas<\/td><td>我為你們害怕<\/td><td>直譯「我怕你們」<\/td><\/tr><tr><td>μή πως<\/td><td>mē pōs<\/td><td>恐怕<\/td><td>說不出口的結果<\/td><\/tr><tr><td>εἰκῇ<\/td><td>eikē<\/td><td>枉然地<\/td><td>3:4 同一個字<\/td><\/tr><tr><td>κεκοπίακα<\/td><td>kekopiaka<\/td><td>我已經勞苦了<\/td><td>完成式：累到現在<\/td><\/tr><\/table>","gram":"<p><strong>第 11 節是一聲很短的嘆息。<\/strong><\/p><p>φοβοῦμαι ὑμᾶς（phoboumai hymas） 字面是「我怕你們」，意思是「我為你們害怕」——受詞直接放在動詞後面，沒有介系詞，把擔心的對象推到最前面。μή πως（mē pōs） 引出一個說不出口的結果：εἰκῇ κεκοπίακα εἰς ὑμᾶς（eikē kekopiaka eis hymas）。εἰκῇ（eikē） 是「枉然、白白地」，3:4 剛用過：「你們受苦如此之多，都是徒然的嗎？」（3:4）κεκοπίακα（kekopiaka） 是 κοπιάω（kopiaō） 的完成式，那種勞苦到筋疲力盡、而疲累一直留到現在的勞苦。這是本章在全卷地勢圖上的低谷。<\/p>","exp":"<p>「我為你們害怕，惟恐我在你們身上是枉費了工夫」（4:11）。剛剛還在宣告「你是兒子」的保羅，下一節就說他怕了。<\/p><p>他怕的不是自己的名聲，是加拉太人。他在南加拉太被石頭打過、被拖到城外（徒 14:19），還是回去堅固門徒（徒 14:21--22）。現在他擔心這一切都白費了——不是因為加拉太人去拜偶像，而是因為他們開始在基督之外多守一些日子。在保羅看來，加一樣，就把福音整個換掉了。<\/p><p>這一節給服事的人一個許可：屬靈領袖可以承認自己害怕。保羅沒有用「交託給神」把擔心蓋過去，他把它寫在信裡。但他也沒有停在害怕裡；下一節他就放下辯論，開始懇求。<strong>害怕可以說出來，但不要讓它變成控制。<\/strong><\/p><p>他怕的是「枉費了工夫」，這也說明在保羅眼中，福音的工作不是數人頭，是看基督有沒有在人身上成形（4:19）。人還坐在聚會裡，卻在基督之外多加了一樣保險，在他看來就是工夫可能白費了。<\/p>"},{"a":12,"z":14,"star":2,"grk":"<p lang=\"grc\">Γίνεσθε ὡς ἐγώ, ὅτι κἀγὼ ὡς ὑμεῖς, ἀδελφοί, δέομαι ὑμῶν. οὐδέν με ἠδικήσατε·<\/p><p lang=\"grc\">οἴδατε δὲ ὅτι διʼ ἀσθένειαν τῆς σαρκὸς εὐηγγελισάμην ὑμῖν τὸ πρότερον,<\/p><p lang=\"grc\">καὶ τὸν πειρασμὸν ὑμῶν ἐν τῇ σαρκί μου οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε, ἀλλὰ ὡς ἄγγελον θεοῦ ἐδέξασθέ με, ὡς Χριστὸν Ἰησοῦν.<\/p>","lit":"<p>你們要成為像我一樣，因為我也像你們一樣，弟兄們，我求你們。你們一點也沒有虧負我；<\/p><p>而你們知道，是因著肉體的軟弱，我先前把福音傳給你們，<\/p><p>而你們在我肉體裡的試煉，你們沒有輕看，也沒有吐唾沫，反倒接待我如同神的使者，如同基督耶穌。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Γίνεσθε ὡς ἐγώ<\/td><td>Ginesthe hōs egō<\/td><td>你們要成為像我一樣<\/td><td>像我一樣在律法以外自由<\/td><\/tr><tr><td>ὅτι κἀγὼ ὡς ὑμεῖς<\/td><td>hoti kagō hōs hymeis<\/td><td>因為我也像你們一樣<\/td><td>我先成了像外邦人一樣<\/td><\/tr><tr><td>δέομαι ὑμῶν<\/td><td>deomai hymōn<\/td><td>我求你們<\/td><td>語氣第一次轉軟<\/td><\/tr><tr><td>διʼ ἀσθένειαν τῆς σαρκὸς<\/td><td>di' astheneian tēs sarkos<\/td><td>因著肉體的軟弱<\/td><td>διά 加受格：原因<\/td><\/tr><tr><td>τὸ πρότερον<\/td><td>to proteron<\/td><td>先前、頭一次<\/td><td>可能暗示去過不只一次<\/td><\/tr><tr><td>ἐξεπτύσατε<\/td><td>exeptysate<\/td><td>你們吐唾沫<\/td><td>古人避邪的動作<\/td><\/tr><tr><td>ὡς ἄγγελον θεοῦ<\/td><td>hōs angelon theou<\/td><td>如同神的使者<\/td><td>下一句更高：如同基督耶穌<\/td><\/tr><\/table>","gram":"<p><strong>從第 12 節起，保羅放下論證，改用關係說話。<\/strong><\/p><p>Γίνεσθε ὡς ἐγώ（Ginesthe hōs egō）, ὅτι κἀγὼ ὡς ὑμεῖς（hoti kagō hōs hymeis） 兩個短句都沒有完整的動詞，讀起來像一句口號。最自然的意思是：你們要像我一樣，不再活在律法的軛下；因為我為了你們，也成了像你們外邦人一樣，不再靠律法站立。δέομαι ὑμῶν（deomai hymōn） 是全卷第一次「懇求」，配上 ἀδελφοί（adelphoi）——語氣從 3:1「無知的加拉太人」，轉成弟兄間的請求。οὐδέν με ἠδικήσατε（ouden me ēdikēsate） 是過去式：當年你們沒有虧待我。<\/p><p>第 13 節 διʼ ἀσθένειαν τῆς σαρκὸς（di' astheneian tēs sarkos） 是 διά（dia） 加受格，表示<strong>原因<\/strong>，不是「在軟弱中」：保羅是因為身體的疾病，才在加拉太傳福音——可能是病了，不得不停留，或為了養病改走這條路。τὸ πρότερον（to proteron） 可譯「頭一次」或「從前」，若取前者，就暗示他去過不只一次（參徒 14:21 的回程）。<\/p><blockquote><p>第 14 節把 τὸν πειρασμὸν ὑμῶν ἐν τῇ σαρκί μου（ton peirasmon hymōn en tē sarki mou） 放在句首：「我身上那件對你們是試煉的事」——他的病，成了他們的考驗。οὐκ ἐξουθενήσατε οὐδὲ ἐξεπτύσατε（ouk exouthenēsate oude exeptysate）：ἐκπτύω（ekptyō） 是吐唾沫，古代人見到病人或怕被「邪眼」沾上時的避邪動作。接著兩個 ὡς（hōs） 一級比一級高：ὡς ἄγγελον θεοῦ（hōs angelon theou）, ὡς Χριστὸν Ἰησοῦν（hōs Christon Iēsoun）。疾病是甚麼，學者有各說：眼疾（因 4:15、6:11）、瘧疾（潘非利亞低地的熱病）、癲癇、路司得被石頭打的舊傷（徒 14:19）。經文沒有說，本講義不猜。<\/p><\/blockquote>","exp":"<p>〔背景〕徒 14:8--20（使徒行傳講義第 14 章）<\/p><p>使徒行傳講義第 14 章講過南加拉太的這幾座城：彼西底的安提阿、以哥念、路司得、特庇。在路司得，眾人看見瘸腿的人站起來，就大聲說：「有神藉著人形降臨在我們中間了」（徒 14:11）。加拉太人曾把保羅當成神；保羅在 4:14 回憶他們「接待我，如同神的使者，如同基督耶穌」（4:14）。兩件事不必是同一件，但這使我們想起：這群人一向是熱烈的，熱烈到把人捧上天，也熱烈到很快被別人帶走。<\/p><p>保羅提醒他們最初的樣子：「你們知道我頭一次傳福音給你們，是因為身體有疾病」（4:13）。他不是以一個強壯、有口才、有排場的使徒進城的，是帶著病來的。那個病在當時的文化裡，足以叫人吐口唾沫、轉身走開；加拉太人卻沒有輕看，反倒接待他。福音在加拉太是從一個病人的口裡傳開的。<\/p><p>那是甚麼病？經文沒有說，本講義也不猜。哥林多後書講義第 12 章講過那根「刺」（林後 12:7），兩處可以並排看，但不必畫上等號。重要的不是病名，是神用軟弱開門。苦難與疾病的整體看法，回指哥林多後書立場二：疾病不必是缺乏信心，也不必是神不愛；神有時候不挪去它，卻藉它把福音送到原本不會去的地方。<\/p><p>今天的教會很容易只接待「有力的」服事者。加拉太人最好的時候，正是他們接待一個軟弱的人，如同接待基督。<\/p>"},{"a":15,"z":16,"star":1,"grk":"<p lang=\"grc\">ποῦ οὖν ὁ μακαρισμὸς ὑμῶν; μαρτυρῶ γὰρ ὑμῖν ὅτι εἰ δυνατὸν τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες ἐδώκατέ μοι.<\/p><p lang=\"grc\">ὥστε ἐχθρὸς ὑμῶν γέγονα ἀληθεύων ὑμῖν;<\/p>","lit":"<p>那麼你們的福氣在哪裡呢？因為我給你們作見證：若是可能，你們早已把你們的眼睛剜出來給了我。<\/p><p>這樣，我因對你們說真話，就成了你們的仇敵嗎？<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ποῦ οὖν ὁ μακαρισμὸς ὑμῶν<\/td><td>pou oun ho makarismos hymōn<\/td><td>那麼你們的福氣在哪裡<\/td><td>μακαρισμός：說自己有福<\/td><\/tr><tr><td>τοὺς ὀφθαλμοὺς ὑμῶν ἐξορύξαντες<\/td><td>tous ophthalmous hymōn exoryxantes<\/td><td>把你們的眼睛剜出來<\/td><td>最寶貴的東西也肯給<\/td><\/tr><tr><td>ἐχθρὸς ὑμῶν γέγονα<\/td><td>echthros hymōn gegona<\/td><td>我成了你們的仇敵<\/td><td>完成式：關係已經變了<\/td><\/tr><tr><td>ἀληθεύων ὑμῖν<\/td><td>alētheuōn hymin<\/td><td>因對你們說真話<\/td><td>現在分詞：說真話這件事<\/td><\/tr><\/table>","gram":"<p><strong>第 15 節是一個帶著懷念的問句。<\/strong><\/p><p>ποῦ οὖν ὁ μακαρισμὸς ὑμῶν（pou oun ho makarismos hymōn）：μακαρισμός（makarismos） 不是「福氣」本身，是「稱自己有福」——當年你們說「我們真有福，神差了保羅來」，那份喜樂到哪裡去了？μαρτυρῶ γὰρ ὑμῖν（martyrō gar hymin） 是保羅替他們作見證。εἰ δυνατὸν（ei dynaton） 後面的條件句省略了 ἄν（an），是一個反事實的語氣：「若是可能，你們早就把眼睛剜出來給我了」。<\/p><p>剜眼睛有兩種讀法：一說是成語，眼睛是人最寶貴的器官，意思是「甚麼都肯給」；一說是線索，暗示保羅的病在眼睛（參 6:11「字是何等的大呢」）。兩說都有學者主張，本講義以成語為主，不據此斷定病名。第 16 節 ὥστε（hōste） 帶出問句，γέγονα（gegona） 是完成式，ἀληθεύων（alētheuōn） 是現在分詞，與弗 4:15「用愛心說誠實話」同字。<\/p>","exp":"<p>「你們當日所誇的福氣在哪裡呢？」（4:15）這是一位牧者翻舊相簿時的問題。曾經願意把眼睛都給你的人，現在把你當仇敵。<\/p><p>改變的原因，保羅說得很直白：「如今我將真理告訴你們，就成了你們的仇敵嗎？」（4:16）他沒有改變，他傳的福音也沒有改變；改變的是加拉太人聽進了另一套說法，於是那個說真話的人，忽然成了障礙。<\/p><p>這兩節提醒兩種人。對被愛的服事者：會眾的熱情會冷卻，今天把你捧上天的人，明天可能最先轉身；不要靠那份熱情站立。對會眾：當一個人對你說了不中聽的真話，先別急著把他歸為敵人。<strong>說真話的人，往往是最後一個還肯為你冒險的人。<\/strong><\/p><p>保羅也沒有因為被當成仇敵，就收回真理去換回關係；他也沒有因為堅持真理，就放棄關係。下一節起，他一面點出對手的手法，一面用母親的口吻說話——真理與愛，他兩樣都不肯丟。<\/p>"},{"a":17,"z":18,"star":1,"grk":"<p lang=\"grc\">ζηλοῦσιν ὑμᾶς οὐ καλῶς, ἀλλὰ ἐκκλεῖσαι ὑμᾶς θέλουσιν, ἵνα αὐτοὺς ζηλοῦτε.<\/p><p lang=\"grc\">καλὸν δὲ ζηλοῦσθαι ἐν καλῷ πάντοτε, καὶ μὴ μόνον ἐν τῷ παρεῖναί με πρὸς ὑμᾶς,<\/p>","lit":"<p>他們熱心追求你們，不是好意，乃是想把你們關在外面，好叫你們熱心追求他們。<\/p><p>而在好事上被熱心追求，總是好的，不只是在我與你們同在的時候。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ζηλοῦσιν ὑμᾶς οὐ καλῶς<\/td><td>zēlousin hymas ou kalōs<\/td><td>熱心追求你們，不是好意<\/td><td>ζηλόω：熱烈地追求、獻殷勤<\/td><\/tr><tr><td>ἐκκλεῖσαι ὑμᾶς θέλουσιν<\/td><td>ekkleisai hymas thelousin<\/td><td>想把你們關在外面<\/td><td>和合本「離間你們」<\/td><\/tr><tr><td>ἵνα αὐτοὺς ζηλοῦτε<\/td><td>hina autous zēloute<\/td><td>好叫你們熱心追求他們<\/td><td>追求的方向反轉<\/td><\/tr><tr><td>καλὸν δὲ ζηλοῦσθαι ἐν καλῷ πάντοτε<\/td><td>kalon de zēlousthai en kalō pantote<\/td><td>在好事上被熱心追求總是好的<\/td><td>被動：被人熱心對待<\/td><\/tr><\/table>","gram":"<p><strong>這兩節是一串 ζηλόω（zēloō） 字族的文字遊戲。<\/strong><\/p><p>ζηλοῦσιν ὑμᾶς（zēlousin hymas）、ζηλοῦτε（zēloute）、ζηλοῦσθαι（zēlousthai）：同一個字根出現三次。ζηλόω（zēloō） 可以是「熱心」，也可以是「追求、獻殷勤」，像追求者對被追求的人那樣。οὐ καλῶς（ou kalōs） 與第 18 節的 ἐν καλῷ（en kalō） 又是一組對照：一種追求「不好」，一種追求「在好事上」。<\/p><p>ἐκκλεῖσαι ὑμᾶς θέλουσιν（ekkleisai hymas thelousin） 是關鍵：ἐκκλείω（ekkleiō） 是「關在外面」，cu89t 註腳說明「離間你們」原文是「把你們關在外面」。對手的手法是先讓你們覺得自己在門外——沒有受割禮，還不算完整的神子民——好叫你們反過來追求他們，求他們開門。第 18 節 ζηλοῦσθαι（zēlousthai） 是被動不定詞，加上 μὴ μόνον ἐν τῷ παρεῖναί με πρὸς ὑμᾶς（mē monon en tō pareinai me pros hymas），「不只在我同在的時候」。<\/p>","exp":"<p>「那些人熱心待你們，卻不是好意，是要離間你們，叫你們熱心待他們」（4:17）。攪擾你們的人沒有冷冰冰地來，他們很熱情、很關心、很投入。但那份熱情有一個目的：先把你們關在門外，再讓你們排隊進他們的門。<\/p><p>這是一種很古老、也很現代的操控：先製造不安全感——「你這樣還不夠」「真正屬靈的人都是這樣做的」——再提供一個只有我們才有的門。第 2 章彼得從外邦人的桌子退去（2:12），就是這道門的效果：桌子分開了，有人在裡面，有人在外面。<strong>真福音把人請進同一張桌子；假熱心把人關在外面，好叫他們來求。<\/strong><\/p><p>第 18 節很公道：保羅不反對有人熱心待加拉太人，「在善事上，常用熱心待人原是好的」（4:18）；他只是說，這份熱心不應該只在他在場的時候才有。好的屬靈關係不靠某一個人在不在，也不靠誰把門關得更緊。屬靈權柄的分辨，回指哥林多後書立場三。<\/p>"},{"a":19,"z":20,"star":3,"grk":"<p lang=\"grc\">τέκνα μου, οὓς πάλιν ὠδίνω μέχρις οὗ μορφωθῇ Χριστὸς ἐν ὑμῖν·<\/p><p lang=\"grc\">ἤθελον δὲ παρεῖναι πρὸς ὑμᾶς ἄρτι, καὶ ἀλλάξαι τὴν φωνήν μου, ὅτι ἀποροῦμαι ἐν ὑμῖν.<\/p>","lit":"<p>我的孩子們，我再一次為你們產痛，直到基督在你們裡面成形；<\/p><p>而我真願意此刻與你們同在，並改換我的聲音，因為我為你們走投無路。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τέκνα μου<\/td><td>tekna mou<\/td><td>我的孩子們<\/td><td>本卷唯一一次這樣稱呼<\/td><\/tr><tr><td>πάλιν ὠδίνω<\/td><td>palin ōdinō<\/td><td>我再一次產痛<\/td><td>ὠδίνω：產婦的陣痛<\/td><\/tr><tr><td>μέχρις οὗ<\/td><td>mechris hou<\/td><td>直到<\/td><td>生產之苦有一個終點<\/td><\/tr><tr><td>μορφωθῇ Χριστὸς ἐν ὑμῖν<\/td><td>morphōthē Christos en hymin<\/td><td>基督在你們裡面成形<\/td><td>被動：成形是神作的<\/td><\/tr><tr><td>ἀλλάξαι τὴν φωνήν μου<\/td><td>allaxai tēn phōnēn mou<\/td><td>改換我的聲音<\/td><td>和合本「改換口氣」<\/td><\/tr><tr><td>ἀποροῦμαι ἐν ὑμῖν<\/td><td>aporoumai en hymin<\/td><td>我為你們走投無路<\/td><td>ἀπορέω：找不到路<\/td><\/tr><\/table>","gram":"<p><strong>第 19 節是全本新約最完整的一句「屬靈父母」的話。<\/strong><\/p><p>τέκνα μου（tekna mou） 是全卷唯一一次這樣叫加拉太人。ὠδίνω（ōdinō） 是婦人臨盆的陣痛——同一個字在 4:27 以 ἡ οὐκ ὠδίνουσα（hē ouk ōdinousa） 再出現，「未曾經過產難的」，本章的比方因此和這一節接上了線。πάλιν（palin） 是「再一次」：他們已經生過一次了，保羅在他們歸信時受過一次痛；現在他們又走回去，他要再痛一次。<\/p><p>比喻在句中換了位置：開頭是保羅在生產，加拉太人是嬰孩；到了 μέχρις οὗ μορφωθῇ Χριστὸς ἐν ὑμῖν（mechris hou morphōthē Christos en hymin），變成基督在他們裡面成形，像胎兒在母腹中長出樣子。μορφόω（morphoō） 與 μορφή（morphē） 同字族：基督「取了奴僕的形像」（腓 2:7）是同一個「形」；羅馬書說神定下我們「效法他兒子的模樣」（羅 8:29）。μορφωθῇ（morphōthē） 是被動假設語氣——成形是神作的，保羅只能陣痛。ἐν ὑμῖν（en hymin） 可讀「在你們各人心裡」，也可讀「在你們中間」（在群體裡），本講義兩面都取：基督的樣子要在每個人身上、也在整間教會裡顯出來。<\/p><blockquote><p>第 20 節 ἤθελον（ēthelon） 是未完成式，表示一個無法實現的願望：「我真巴不得」。ἀλλάξαι τὴν φωνήν μου（allaxai tēn phōnēn mou），「改換我的聲音」——從信裡責備的口氣，換成面對面溫柔的語調。ἀποροῦμαι（aporoumai） 是「找不到路」，保羅承認他不知道該怎麼辦了。<\/p><\/blockquote>","exp":"<p>「我小子啊，我為你們再受生產之苦，直等到基督成形在你們心裡」（4:19）。這是全章最痛的一節，也是最溫柔的一節。<\/p><p>一個男人用生產來比喻自己的服事，在古代很少見。保羅別處也用母親的圖畫：「如同母親乳養自己的孩子」（帖前 2:7）。屬靈的父母不是一個職位，是一種陣痛。孩子走偏了，最痛的不是旁觀者，是生他的人。<\/p><p>但請看保羅陣痛的目標：「直等到基督成形在你們心裡」。他沒有說「直等到你們像我」「直等到你們聽我的話」，他說直等到基督成形。屬靈父母的成功，不是孩子變成自己的複製品，是孩子身上長出基督的樣子。所以 4:12 的「像我一樣」也要照這個來讀：像我一樣不靠律法、只靠基督。<strong>一個屬靈的父母若在孩子身上找的是自己，那就是控制，不是生養。<\/strong><\/p><p>「成形」也說出成聖是一個過程。被收養是一天的事（4:7）；基督成形卻像懷胎，要一段時間，有陣痛，也會有反覆。加拉太人已經是兒子了，但他們身上還沒有長出兒子的樣子。這兩件事要同時講：身分不靠成長換來，成長從身分裡長出來。（成聖是一生的過程，見本章議題頁。）<\/p><p>第 20 節更真實：「我巴不得現今在你們那裡，改換口氣，因我為你們心裡作難」（4:20）。保羅也有找不到路的時候。他寫信寫到這裡，希望自己能坐在他們面前，換一個比較溫柔的口氣說話。屬靈父母也會累、也會困惑；他們不必假裝永遠知道該怎麼做。陪伴別人成長的人，也需要被陪伴。<\/p>"},{"a":21,"z":23,"star":2,"grk":"<p lang=\"grc\">Λέγετέ μοι, οἱ ὑπὸ νόμον θέλοντες εἶναι, τὸν νόμον οὐκ ἀκούετε;<\/p><p lang=\"grc\">γέγραπται γὰρ ὅτι Ἀβραὰμ δύο υἱοὺς ἔσχεν, ἕνα ἐκ τῆς παιδίσκης καὶ ἕνα ἐκ τῆς ἐλευθέρας·<\/p><p lang=\"grc\">ἀλλʼ ὁ μὲν ἐκ τῆς παιδίσκης κατὰ σάρκα γεγέννηται, ὁ δὲ ἐκ τῆς ἐλευθέρας διʼ ἐπαγγελίας.<\/p>","lit":"<p>告訴我，你們這些願意在律法之下的人，你們沒有聽律法嗎？<\/p><p>因為經上記著：亞伯拉罕有了兩個兒子，一個出於那使女，一個出於那自由的婦人。<\/p><p>然而那出於使女的，是按著肉體被生的；那出於自由婦人的，是藉著應許。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>οἱ ὑπὸ νόμον θέλοντες εἶναι<\/td><td>hoi hypo nomon thelontes einai<\/td><td>願意在律法之下的人<\/td><td>θέλοντες：自己想要<\/td><\/tr><tr><td>τὸν νόμον οὐκ ἀκούετε<\/td><td>ton nomon ouk akouete<\/td><td>你們沒有聽律法嗎<\/td><td>此處 νόμος 指摩西五經<\/td><\/tr><tr><td>ἐκ τῆς παιδίσκης<\/td><td>ek tēs paidiskēs<\/td><td>出於那使女<\/td><td>先不提名字<\/td><\/tr><tr><td>ἐκ τῆς ἐλευθέρας<\/td><td>ek tēs eleutheras<\/td><td>出於那自由的婦人<\/td><td>與「使女」成對<\/td><\/tr><tr><td>κατὰ σάρκα γεγέννηται<\/td><td>kata sarka gegennētai<\/td><td>按著肉體被生<\/td><td>完成式被動<\/td><\/tr><tr><td>διʼ ἐπαγγελίας<\/td><td>di' epangelias<\/td><td>藉著應許<\/td><td>動詞省略：同樣是被生<\/td><\/tr><\/table>","gram":"<p><strong>第 21 節用律法回答想要律法的人。<\/strong><\/p><p>Λέγετέ μοι（Legete moi） 是挑戰的口氣。οἱ ὑπὸ νόμον θέλοντες εἶναι（hoi hypo nomon thelontes einai） 呼應 4:9 的 θέλετε（thelete）：他們「想要」在律法之下。τὸν νόμον οὐκ ἀκούετε（ton nomon ouk akouete） 的 νόμος（nomos） 換了意思：前一個是誡命的體系，後一個是摩西五經這本書。保羅的反諷在這裡：你們想活在律法底下，那就聽聽律法這本書怎麼說。<\/p><p>γέγραπται γὰρ（gegraptai gar） 帶出的不是逐字引文，是創世記 16、21 章的摘要。保羅先不說名字，只說 ἐκ τῆς παιδίσκης（ek tēs paidiskēs） 與 ἐκ τῆς ἐλευθέρας（ek tēs eleutheras），讓兩個身分詞自己對照；名字要到 4:24 才出現。第 23 節 μέν（men）……δέ（de） 對照：κατὰ σάρκα γεγέννηται（kata sarka gegennētai），「按著肉體被生」，完成式被動；另一半只有 διʼ ἐπαγγελίας（di' epangelias），動詞省略。注意這裡不對稱：σάρξ（sarx） 的對面不是 πνεῦμα（pneuma），是 ἐπαγγελία（epangelia）——要到 4:29 保羅才說 κατὰ πνεῦμα（kata pneuma）。本卷追蹤 ἐλευθερία（eleutheria）／δοῦλος（doulos） 在 4:22、ἐπαγγελία（epangelia） 在 4:23 各落一站。<\/p><p>從這一節起，保羅進入他自己稱為「比方」的段落（4:24）。他用的是律法書裡的歷史，比方建在真實發生過的事上。<\/p>","exp":"<p>〔創〕創 21:1--7（創世記講義第 21 章）<\/p><p>創世記講義第 16、21 章講過這兩個兒子的故事。以實瑪利的出生，是撒萊的一個計畫：「求你和我的使女同房，或者我可以因她得孩子」（創 16:2）。這是「按著血氣」——用人的辦法，替神的應許找一條捷徑。以撒的出生正好相反：亞伯拉罕年老、撒拉不能生育，人的辦法全部用完了，「到神所說的日期，就給亞伯拉罕生了一個兒子」（創 21:2）。<\/p><p>保羅要加拉太人看見的，是兩種出生方式。一種是人靠自己的力量、自己的計畫生出來的；一種是神憑應許、在人不可能的地方生出來的。攪擾你們的人要加拉太人加上割禮——割禮是在肉體上作的記號，正是一種「按著血氣」的保證。保羅說：你們的出生不是這樣來的。<\/p><p>有一件事要先說清楚：夏甲本人不是這個故事的反派。她是被安排、被使用、後來被趕出去的使女；在曠野裡，她是全本舊約第一個給神起名字的人：「夏甲就稱那對她說話的耶和華為『看顧人的神』」（創 16:13）。保羅在比方裡用她代表一種約，不是在評價她這個人，更不是在評價她的後代。讀這段比方，要先記得創世記裡那位看顧她的神。<\/p>"},{"a":24,"z":27,"star":3,"grk":"<p lang=\"grc\">ἅτινά ἐστιν ἀλληγορούμενα· αὗται γάρ εἰσιν δύο διαθῆκαι, μία μὲν ἀπὸ ὄρους Σινᾶ, εἰς δουλείαν γεννῶσα, ἥτις ἐστὶν Ἁγάρ,<\/p><p lang=\"grc\">τὸ δὲ Ἁγὰρ Σινᾶ ὄρος ἐστὶν ἐν τῇ Ἀραβίᾳ, συστοιχεῖ δὲ τῇ νῦν Ἰερουσαλήμ, δουλεύει γὰρ μετὰ τῶν τέκνων αὐτῆς·<\/p><p lang=\"grc\">ἡ δὲ ἄνω Ἰερουσαλὴμ ἐλευθέρα ἐστίν, ἥτις ἐστὶν μήτηρ ἡμῶν·<\/p><p lang=\"grc\">γέγραπται γάρ· Εὐφράνθητι, στεῖρα ἡ οὐ τίκτουσα, ῥῆξον καὶ βόησον, ἡ οὐκ ὠδίνουσα· ὅτι πολλὰ τὰ τέκνα τῆς ἐρήμου μᾶλλον ἢ τῆς ἐχούσης τὸν ἄνδρα.<\/p>","lit":"<p>這些事是被寓意地說的：因為這些婦人是兩個約，一個出於西奈山，生子進入奴役，她就是夏甲。<\/p><p>而這夏甲是在阿拉伯的西奈山，與現在的耶路撒冷同列，因為她和她的兒女一同為奴。<\/p><p>但那在上面的耶路撒冷是自由的，她就是我們的母親；<\/p><p>因為經上記著：不生育的石女啊，你要歡樂；沒有產痛的啊，你要迸發、呼喊；因為荒涼者的兒女比那有丈夫的更多。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἅτινά ἐστιν ἀλληγορούμενα<\/td><td>hatina estin allēgoroumena<\/td><td>這些事是被寓意地說的<\/td><td>全本新約唯一一次 ἀλληγορέω<\/td><\/tr><tr><td>δύο διαθῆκαι<\/td><td>dyo diathēkai<\/td><td>兩個約<\/td><td>比的是約，不是民族<\/td><\/tr><tr><td>εἰς δουλείαν γεννῶσα<\/td><td>eis douleian gennōsa<\/td><td>生子進入奴役<\/td><td>生出來的就是奴僕<\/td><\/tr><tr><td>συστοιχεῖ<\/td><td>systoichei<\/td><td>同列<\/td><td>排在同一欄<\/td><\/tr><tr><td>τῇ νῦν Ἰερουσαλήμ<\/td><td>tē nyn Ierousalēm<\/td><td>現在的耶路撒冷<\/td><td>要外邦人受割禮的那一套<\/td><\/tr><tr><td>ἡ δὲ ἄνω Ἰερουσαλὴμ<\/td><td>hē de anō Ierousalēm<\/td><td>但那在上的耶路撒冷<\/td><td>「現在」對「在上」<\/td><\/tr><tr><td>μήτηρ ἡμῶν<\/td><td>mētēr hēmōn<\/td><td>我們的母<\/td><td>接回 4:19 的生產<\/td><\/tr><tr><td>Εὐφράνθητι στεῖρα<\/td><td>Euphranthēti steira<\/td><td>不生育的啊，你要歡樂<\/td><td>賽 54:1，七十士譯本<\/td><\/tr><\/table>","gram":"<p><strong>📜 比方：ἀλληγορέω（allēgoreō） 的意思與限度。<\/strong><\/p><p>ἅτινά ἐστιν ἀλληγορούμενα（hatina estin allēgoroumena），和合本譯「這都是比方」。ἀλληγορέω（allēgoreō） 由「別的」與「說」組成，意思是「說的是一件事，指的是另一件事」。這是<strong>全本新約唯一一次明說自己在用寓意法的經文<\/strong>。同時代的猶太學者斐羅也用寓意解創世記，常把歷史化成抽象的德行；保羅不一樣——他沒有否定夏甲與撒拉的歷史，而是在真實的歷史上看見兩個約的對應，學者因此常說這段是寓意的字、對應的骨架。<\/p><p>限度要說清楚：保羅自己標明「這是比方」，而且這個連結是新約明文作的；<strong>本講義照保羅的比方講滿，但不把這個方法推到別的經文<\/strong>。教會歷史上，寓意解經曾讓人在任何經文裡讀出任何意思；保羅用了一次，不等於授權我們到處用。<\/p><blockquote><p>συστοιχεῖ（systoichei） 是「排在同一欄」——和 4:3 的 στοιχεῖα（stoicheia） 同字根，保羅像在列一張兩欄的表：<\/p><p>夏甲｜西奈山的約｜生子為奴｜現在的耶路撒冷<br>撒拉｜應許的約｜自主｜ἡ δὲ ἄνω Ἰερουσαλὴμ（hē de anō Ierousalēm）<\/p><p>第 25 節 τὸ δὲ Ἁγὰρ（to de Hagar） 用中性冠詞 τό（to），指「夏甲這個名字」。有抄本作 Σινᾶ γὰρ ὄρος（Sina gar oros），沒有「夏甲」二字；學者也推測當地阿拉伯語有一個與「夏甲」音近、指岩石的字，但都無定論。第 26 節「現在」的對面不是「將來」，是 ἄνω（anō），「在上」。第 27 節引賽 54:1，與七十士譯本逐字相同；ἡ οὐκ ὠδίνουσα（hē ouk ōdinousa） 與 4:19 的 ὠδίνω（ōdinō） 接上。<\/p><\/blockquote>","exp":"<p>「這都是比方：那兩個婦人就是兩約」（4:24）。保羅比的是兩個約、兩種出生方式，不是兩個民族。這一句是整段的鑰匙，也是講台上必須守住的線。<\/p><p>在保羅的比方裡，夏甲對應的是西奈山的約，與「現在的耶路撒冷同類」（4:25）。「現在的耶路撒冷」在加拉太書的處境裡，指的是那一套要外邦人受割禮才算數的宗教——也就是派人到安提阿、攪擾加拉太的那股力量（2:12）。它不是指猶太民族，更不是指阿拉伯人或穆斯林。保羅自己是「我們這生來的猶太人」（2:15），他在羅馬書說得清楚：「神並沒有棄絕他預先所知道的百姓」（羅 11:2）。<strong>任何把這段講成反猶太或反阿拉伯的講法，都把保羅的比方讀成了保羅沒有說的話。<\/strong><\/p><p>撒拉那一欄沒有寫山名，只寫「那在上的耶路撒冷是自主的，她是我們的母」（4:26）。加拉太的外邦信徒不必遷到耶路撒冷、不必改成猶太人的樣子，才有一個屬靈的母親；他們的母城在上面，戶籍是神登記的。<\/p><p>第 27 節引以賽亞書，原是對被擄後荒涼的耶路撒冷說的：「不懷孕、不生養的，你要歡樂……因為沒有丈夫的，比有丈夫的兒女更多」（4:27）。保羅聽見撒拉的故事在這句話裡：那個不能生的，反而兒女最多。從人看是絕路的地方，神生出最多的兒女。加拉太的外邦信徒就是這些「更多的兒女」。這個比方的落點不是貶低誰，而是安慰：<strong>你們的出生，是神在不可能之處作成的。<\/strong><\/p>"},{"a":28,"z":31,"star":2,"grk":"<p lang=\"grc\">ὑμεῖς δέ, ἀδελφοί, κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα ἐστέ ·<\/p><p lang=\"grc\">ἀλλʼ ὥσπερ τότε ὁ κατὰ σάρκα γεννηθεὶς ἐδίωκε τὸν κατὰ πνεῦμα, οὕτως καὶ νῦν.<\/p><p lang=\"grc\">ἀλλὰ τί λέγει ἡ γραφή; Ἔκβαλε τὴν παιδίσκην καὶ τὸν υἱὸν αὐτῆς, οὐ γὰρ μὴ κληρονομήσει ὁ υἱὸς τῆς παιδίσκης μετὰ τοῦ υἱοῦ τῆς ἐλευθέρας.<\/p><p lang=\"grc\">διό ἀδελφοί, οὐκ ἐσμὲν παιδίσκης τέκνα ἀλλὰ τῆς ἐλευθέρας.<\/p>","lit":"<p>而你們，弟兄們，照著以撒，是應許的兒女。<\/p><p>然而，正如那時那按著肉體被生的，逼迫那按著靈的，現在也是這樣。<\/p><p>然而經上說甚麼呢？把那使女和她的兒子趕出去，因為那使女的兒子絕不可與那自由婦人的兒子一同承受產業。<\/p><p>所以，弟兄們，我們不是使女的兒女，乃是那自由婦人的。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα<\/td><td>kata Isaak epangelias tekna<\/td><td>照著以撒，是應許的兒女<\/td><td>◆ 和合本作「我們」<\/td><\/tr><tr><td>ἐδίωκε<\/td><td>ediōke<\/td><td>曾在逼迫<\/td><td>未完成式：持續的敵意<\/td><\/tr><tr><td>τὸν κατὰ πνεῦμα<\/td><td>ton kata pneuma<\/td><td>那按著靈的<\/td><td>4:23 的「應許」在這裡叫「靈」<\/td><\/tr><tr><td>Ἔκβαλε τὴν παιδίσκην<\/td><td>Ekbale tēn paidiskēn<\/td><td>把使女趕出去<\/td><td>創 21:10<\/td><\/tr><tr><td>οὐ γὰρ μὴ κληρονομήσει<\/td><td>ou gar mē klēronomēsei<\/td><td>絕不可承受產業<\/td><td>雙重否定，最強的「不」<\/td><\/tr><tr><td>οὐκ ἐσμὲν παιδίσκης τέκνα ἀλλὰ τῆς ἐλευθέρας<\/td><td>ouk esmen paidiskēs tekna alla tēs eleutheras<\/td><td>我們不是使女的兒女，乃是自由婦人的<\/td><td>全章的結論<\/td><\/tr><\/table>","gram":"<p><strong>◆ 經文鑑別：4:28「你們」還是「我們」。<\/strong><\/p><p>SBLGNT 作 ὑμεῖς δέ（hymeis de）……ἐστέ（este），「而你們……是」；和合本譯「我們是憑著應許作兒女」，取的是 WH 與 RP 的 ἡμεῖς（hēmeis）……ἐσμέν（esmen）。兩種讀法都有古老的見證。支持「你們」的理由：保羅在本段一直對加拉太人說話，而抄寫的人容易受前面 4:26 μήτηρ ἡμῶν（mētēr hēmōn）、後面 4:31 ἐσμὲν（esmen） 的影響，把它改成「我們」。支持「我們」的理由：前後兩節都是「我們」，保持一致。本講義判斷 SBLGNT 的 ὑμεῖς（hymeis） 略勝；但意思沒有差別——保羅在 4:31 自己又回到「我們」，他和加拉太人同屬一位母親。<\/p><p>第 29 節 ἐδίωκε（ediōke） 是未完成式，持續的敵意。創世記只說以實瑪利「戲笑」（創 21:9），學者觀察到猶太傳統早有把這次戲笑讀成敵意的解釋，保羅可能沿用。τὸν κατὰ πνεῦμα（ton kata pneuma） 把 4:23 的 διʼ ἐπαγγελίας（di' epangelias） 換成「按著靈」——應許是靠聖靈生出兒女的。οὕτως καὶ νῦν（houtōs kai nyn）：現在也是這樣。<\/p><blockquote><p>第 30 節 τί λέγει ἡ γραφή（ti legei hē graphē） 把撒拉在創 21:10 的話，稱為「經上」說的；保羅還把「我的兒子以撒」改成 τοῦ υἱοῦ τῆς ἐλευθέρας（tou huiou tēs eleutheras），讓比方的兩欄完整。οὐ γὰρ μὴ κληρονομήσει（ou gar mē klēronomēsei） 是雙重否定，希臘文最強的「絕不」。第 31 節 διό（dio） 收結論；παιδίσκης（paidiskēs） 沒有冠詞，τῆς ἐλευθέρας（tēs eleutheras） 有冠詞——使女可以泛指，自由的婦人只有一位。比方到這裡講完。<\/p><\/blockquote>","exp":"<p>〔創〕創 21:8--14（創世記講義第 21 章）<\/p><p>創世記 21 章，以撒斷奶的筵席上，撒拉看見以實瑪利戲笑，就對亞伯拉罕說：「你把這使女和她兒子趕出去！」（創 21:10）保羅把這句話接到他的比方裡：「把使女和她兒子趕出去！因為使女的兒子不可與自主婦人的兒子一同承受產業」（4:30）。<\/p><p>這句話在比方裡要趕出去的是甚麼？不是一群人，是一個約、一種出生方式。對加拉太人來說，意思是：不要讓「信耶穌再加上割禮」的那一套，在教會裡和福音同坐、一同分產業。兩種約不能並存——一個靠應許，一個靠肉體；加一樣，另一樣就沒有了。這句話不能拿來趕走意見不同的弟兄，也不能拿來給任何民族定罪。<\/p><p>而且創世記沒有讓夏甲在曠野裡消失。神聽見了童子的聲音，「不要害怕，神已經聽見童子的聲音了」（創 21:17），還應許「我必使他的後裔成為大國」（創 21:18）。保羅的比方用夏甲代表西奈的約，但創世記裡的神，仍是看顧夏甲的神。講這一段，兩句話要一起講。<\/p><p>「當時，那按著血氣生的逼迫了那按著聖靈生的，現在也是這樣」（4:29）。加拉太的外邦信徒正在受壓力，被告知自己還不完整。保羅說：這種壓力本身就說明你們是哪一種兒女。最後他收在一句宣告上：「弟兄們，這樣看來，我們不是使女的兒女，乃是自主婦人的兒女了」（4:31）——和 4:7 一樣，是宣告，不是勸勉。下一節他就要說：「基督釋放了我們，叫我們得以自由」（5:1）。<\/p>"}],"5":[{"a":1,"z":1,"star":3,"grk":"<p lang=\"grc\">τῇ ἐλευθερίᾳ ἡμᾶς Χριστὸς ἠλευθέρωσεν· στήκετε οὖν καὶ μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε.<\/p>","lit":"<p>為了這自由，基督使我們得了自由；所以你們要站著，不要再被奴役的軛套住。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τῇ ἐλευθερίᾳ<\/td><td>tē eleutheria<\/td><td>為了這自由<\/td><td>有冠詞：4:31「自主婦人」的那一種自由<\/td><\/tr><tr><td>ἠλευθέρωσεν<\/td><td>ēleutherōsen<\/td><td>他使……得自由<\/td><td>不定過去式：在十字架上已經做成<\/td><\/tr><tr><td>στήκετε<\/td><td>stēkete<\/td><td>你們要站著<\/td><td>現在命令式：一直站著，不是站一次<\/td><\/tr><tr><td>πάλιν<\/td><td>palin<\/td><td>再<\/td><td>他們從前已經背過一副軛（4:8–9）<\/td><\/tr><tr><td>ζυγῷ δουλείας<\/td><td>zygō douleias<\/td><td>奴役的軛<\/td><td>套在牲口頸上、叫牠低頭拉車的橫木<\/td><\/tr><tr><td>ἐνέχεσθε<\/td><td>enechesthe<\/td><td>被套住<\/td><td>現在式被動：被困、被纏住<\/td><\/tr><\/table>","gram":"<p><strong>5:1 沒有任何連接詞，一句話直接擲出來；句首是 τῇ ἐλευθερίᾳ（tē eleutheria），「自由」被放在最前面。<\/strong><\/p><p>原文是同字根的重複：τῇ ἐλευθερίᾳ（tē eleutheria）……ἠλευθέρωσεν（ēleutherōsen），「為了自由，基督使我們自由」。間接受格可以讀成工具（憑著自由）或目的（為了自由），多數註釋家取目的：基督釋放我們，不是要把我們轉交給另一個主人，就是為了叫我們自由。冠詞 τῇ（tē） 回指 4:31 的 τῆς ἐλευθέρας（tēs eleutheras）：我們是「自主婦人的兒女」，這裡說的就是那一種自由。學者對這一節屬上段或屬下段各有主張；它其實像一道門檻，一腳踩著前面的論證，一腳踩著後面的勸勉。<\/p><p>ἠλευθέρωσεν（ēleutherōsen） 是不定過去式：釋放已經成就了。接著 οὖν（oun） 帶出命令：στήκετε（stēkete） 是現在命令式，「要一直站著」；μὴ πάλιν ζυγῷ δουλείας ἐνέχεσθε（mē palin zygō douleias enechesthe） 也是現在式，禁止一個可能正在發生的動作：「不要再讓自己被套進去」。直說語氣在前，命令語氣在後——保羅的倫理永遠是這個次序：神已經做了，所以你要站住。ζυγός（zygos） 這個字，耶路撒冷會議上彼得也用來形容律法（徒 15:10），這使我們想起，加拉太的難題正是那次會議要回答的。<\/p>","exp":"<p><strong>「基督釋放了我們，叫我們得以自由。」（5:1）前四章的辯論，到這裡收成一句話。<\/strong><\/p><p>保羅用了十一節講夏甲與撒拉，最後落在「我們不是使女的兒女，乃是自主婦人的兒女了」（4:31）。接著他不再論證，只下命令：「所以要站立得穩，不要再被奴僕的軛挾制。」（5:1）軛是一根橫木，套在牛的頸項上，叫牠低頭拉車。它的重不只在木頭，在於從此不能自己決定往哪裡走。<\/p><p>「再」字很痛。加拉太的信徒多半是外邦人，他們從前已經背過一副軛，「是給那些本來不是神的作奴僕」（4:8）。現在攪擾他們的人說：你們信了耶穌很好，但還要受割禮、守節期，才算完整的神子民。保羅說：這不是升級，是回頭。從偶像的軛換到律法的軛，形狀不同，都是軛。<\/p><p>這使我們想起主耶穌的話：「我的軛是容易的，我的擔子是輕省的。」（太 11:30）基督徒不是沒有軛的人；我們從一副叫人喘不過氣的軛底下出來，走到一位心裡柔和謙卑的主身邊。自由不是一個人站在曠野，是被釋放的人站在釋放他的那一位旁邊。<\/p><p>「站立得穩」是一個持續的命令。被釋放是一次完成的，站得住卻要天天站。今天的軛可能不叫割禮，卻常常長得像「信耶穌，還要再加上……」：加上某種聚會的次數才算屬靈，加上某個宗派的標記才算正統，加上某一套服裝與用語才算自己人。凡是把基督之外的東西變成進門的條件，都是同一副軛（全卷立場見議題「書信的處境與原則」、議題「基督徒的自由：在律法主義與放縱之間」）。<\/p><p>也要留意反方向。保羅沒有說「所以甚麼都可以」；他說站穩。自由有一個站的地方：就在基督釋放我們的地方。這一節是全卷鑰句；從 5:13 起，保羅要說明這自由往哪裡走。<\/p>"},{"a":2,"z":4,"star":3,"grk":"<p lang=\"grc\">Ἴδε ἐγὼ Παῦλος λέγω ὑμῖν ὅτι ἐὰν περιτέμνησθε Χριστὸς ὑμᾶς οὐδὲν ὠφελήσει.<\/p><p lang=\"grc\">μαρτύρομαι δὲ πάλιν παντὶ ἀνθρώπῳ περιτεμνομένῳ ὅτι ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι.<\/p><p lang=\"grc\">κατηργήθητε ἀπὸ Χριστοῦ οἵτινες ἐν νόμῳ δικαιοῦσθε, τῆς χάριτος ἐξεπέσατε.<\/p>","lit":"<p>看哪，我保羅告訴你們：你們若受割禮，基督對你們就毫無益處。<\/p><p>我又再一次向每一個受割禮的人作見證：他是欠債的，要行全部的律法。<\/p><p>你們已經與基督斷絕了，你們這些在律法裡稱義的人；你們從恩典中掉出去了。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Ἴδε ἐγὼ Παῦλος<\/td><td>Ide egō Paulos<\/td><td>看哪，我保羅<\/td><td>把使徒的名字與分量全壓上去<\/td><\/tr><tr><td>ἐὰν περιτέμνησθε<\/td><td>ean peritemnēsthe<\/td><td>你們若受割禮<\/td><td>現在假設語氣：正在考慮、正要走上這條路<\/td><\/tr><tr><td>οὐδὲν ὠφελήσει<\/td><td>ouden ōphelēsei<\/td><td>毫無益處<\/td><td>未來式：到那一天，基督對你們沒有用處<\/td><\/tr><tr><td>ὀφειλέτης<\/td><td>opheiletēs<\/td><td>欠債的人<\/td><td>割禮不是一張單據，是一整本帳<\/td><\/tr><tr><td>κατηργήθητε ἀπὸ Χριστοῦ<\/td><td>katērgēthēte apo Christou<\/td><td>與基督斷絕<\/td><td>καταργέω：使失效；5:11 同一個動詞<\/td><\/tr><tr><td>δικαιοῦσθε<\/td><td>dikaiousthe<\/td><td>你們要被稱義<\/td><td>現在式：嘗試靠律法稱義<\/td><\/tr><tr><td>τῆς χάριτος ἐξεπέσατε<\/td><td>tēs charitos exepesate<\/td><td>從恩典掉出去<\/td><td>ἐκπίπτω：船被沖離航道<\/td><\/tr><\/table>","gram":"<p><strong>三節之內，保羅用了三種最重的語氣：具名（5:2）、作見證（5:3）、宣判（5:4）。<\/strong><\/p><p>Ἴδε ἐγὼ Παῦλος（Ide egō Paulos） 是全卷最強的一次自我具名，像在法庭文件上簽下自己的名字。ἐὰν περιτέμνησθε（ean peritemnēsthe） 用現在式假設語氣，指的不是早已受了割禮的猶太信徒（保羅自己受過割禮，也曾為提摩太行割禮，徒 16:3），而是正在考慮把割禮當作稱義條件的外邦信徒。關鍵不在一個手術，在它被放在哪裡。<\/p><p>第 3 節的 μαρτύρομαι（martyromai） 是莊嚴作證的動詞；πάλιν（palin） 表示他從前說過。ὀφειλέτης ἐστὶν ὅλον τὸν νόμον ποιῆσαι（opheiletēs estin holon ton nomon poiēsai）：割禮不是單獨一條規矩，是簽下整份合約。這呼應 3:10 引申 27:26 的話：「凡不常照律法書上所記一切之事去行的，就被咒詛」（3:10）。<\/p><p>第 4 節兩個不定過去式：κατηργήθητε ἀπὸ Χριστοῦ（katērgēthēte apo Christou），καταργέω（katargeō） 是「使失效、使停擺」，加上 ἀπό（apo） 就是「與基督斷了聯繫」；τῆς χάριτος ἐξεπέσατε（tēs charitos exepesate），ἐκπίπτω（ekpiptō） 在徒 27:17、29 用來說船被風沖去擱淺。中間夾著 οἵτινες ἐν νόμῳ δικαιοῦσθε（hoitines en nomō dikaiousthe），現在式帶著「嘗試」的意味：你們這些想要靠律法稱義的人。墜落的方向寫得很清楚：不是掉進某一個罪，是從恩典掉到律法上。<\/p>","exp":"<p><strong>這三節最容易被讀成恐嚇；其實它像一位父親，伸手拉住正要跨出懸崖的孩子。<\/strong><\/p><p>「我－保羅告訴你們，若受割禮，基督就與你們無益了。」（5:2）攪擾你們的人大概是這樣說的：割禮只是一個小小的補充，信耶穌之外再加一點，更穩妥。保羅的算術正好相反：基督加上任何東西，不等於更多，等於基督「無益」。因為一旦割禮成了條件，你倚靠的就不再是基督，而是基督加上你自己。救主只要被當成一半，就等於沒有被當成救主。<\/p><p>第 3 節把帳攤開：「他是欠著行全律法的債」（5:3）。你不能只挑割禮，割禮是一整套生活的門票。走進那扇門，就要從頭行到尾，沒有一條可以少；這正是 3:10 所說的咒詛。<\/p><p>然後是全章最重的一句：「你們這要靠律法稱義的，是與基督隔絕，從恩典中墜落了。」（5:4）要讀清楚它的主詞：「要靠律法稱義的」。這裡沒有說一個基督徒犯了某個罪、軟弱了一次，就從恩典中掉下來；恰恰相反，「墜落」是離開恩典，跑去靠自己的表現。今天最容易從恩典中墜落的，常常不是跌倒的人，而是以為自己做得夠好的人。<\/p><p>那麼，真信徒會不會失去救恩？加爾文派認為，蒙神揀選的人終必蒙保守，這樣的警告正是神保守人的方法；阿民念派認為，人若持續棄絕恩典之道，確實可能失去救恩。兩派都敬重聖經，議題頁並陳；兩派也都同意：這一節的「墜落」是轉向律法稱義，回來的路就是回到恩典。所以這幾節不是用來嚇唬軟弱的人，而是叫想要「加碼」的人停下來。害怕自己掉出恩典的人，正好聽這一句：恩典從來不靠你抓得多緊，靠那位召你的。<\/p>"},{"a":5,"z":6,"star":2,"grk":"<p lang=\"grc\">ἡμεῖς γὰρ πνεύματι ἐκ πίστεως ἐλπίδα δικαιοσύνης ἀπεκδεχόμεθα.<\/p><p lang=\"grc\">ἐν γὰρ Χριστῷ Ἰησοῦ οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία, ἀλλὰ πίστις διʼ ἀγάπης ἐνεργουμένη.<\/p>","lit":"<p>因為我們藉著靈、出於信，熱切等候義的盼望。<\/p><p>因為在基督耶穌裡，割禮不能有甚麼效力，未受割禮也不能，而是藉著愛運作的信。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἡμεῖς γὰρ<\/td><td>hēmeis gar<\/td><td>因為我們<\/td><td>與 5:4「你們這要靠律法稱義的」相對<\/td><\/tr><tr><td>πνεύματι ἐκ πίστεως<\/td><td>pneumati ek pisteōs<\/td><td>藉著靈、出於信<\/td><td>兩個來源排在動詞之前<\/td><\/tr><tr><td>ἐλπίδα δικαιοσύνης<\/td><td>elpida dikaiosynēs<\/td><td>義的盼望<\/td><td>末日的判詞：今天已稱義，那天公開宣讀<\/td><\/tr><tr><td>ἀπεκδεχόμεθα<\/td><td>apekdechometha<\/td><td>熱切等候<\/td><td>伸長脖子等；羅 8:23 同字<\/td><\/tr><tr><td>τι ἰσχύει<\/td><td>ti ischyei<\/td><td>有甚麼效力<\/td><td>割禮與未受割禮都沒有<\/td><\/tr><tr><td>πίστις διʼ ἀγάπης ἐνεργουμένη<\/td><td>pistis di' agapēs energoumenē<\/td><td>藉著愛運作的信<\/td><td>中間語態：信心自己在運作<\/td><\/tr><\/table>","gram":"<p><strong>第 5 節的主詞 ἡμεῖς（hēmeis） 放在最前面，和第 4 節「你們這要靠律法稱義的」對立：一邊靠律法，一邊靠聖靈與信心。<\/strong><\/p><p>πνεύματι ἐκ πίστεως（pneumati ek pisteōs） 先排在動詞之前：聖靈是能力，信心是途徑。ἐλπίδα δικαιοσύνης（elpida dikaiosynēs） 的屬格有兩種讀法：一、「義所帶來的盼望」，已稱義的人盼望榮耀；二、「所盼望的就是義」，等候末日神最後的宣判。多數註釋家取第二種：稱義今天已經宣告（2:16），在末日要公開確認。ἀπεκδεχόμεθα（apekdechometha） 是保羅描寫末世盼望的專用字（羅 8:23、25；腓 3:20），帶著伸長脖子的熱切。<\/p><p>第 6 節 οὔτε περιτομή τι ἰσχύει οὔτε ἀκροβυστία（oute peritomē ti ischyei oute akrobystia） 把雙方都放倒：受割禮不加分，未受割禮也不加分——外邦信徒不可以反過來以沒受割禮為誇。ἀλλὰ（alla） 帶出唯一有效力的：πίστις διʼ ἀγάπης ἐνεργουμένη（pistis di' agapēs energoumenē）。ἐνεργουμένη（energoumenē） 若讀作被動，是「被愛所成形的信」，中世紀神學曾據此把愛算作稱義的一部分；宗教改革者讀作中間語態，「藉著愛運作的信」：愛不是信心的根基，是信心的出口。本講義取後者，這也是今天多數文法學者的判斷。這一句與 6:15、林前 7:19 幾乎平行，三處都以「受割禮不受割禮」開頭，結尾卻各不相同：信心生愛、新造的人、遵守神的誡命。<\/p>","exp":"<p><strong>攪擾的人說：不加上割禮，你們的信心不完整。保羅回答：真正的信心從來不是孤單的，它會生出愛。<\/strong><\/p><p>「我們靠著聖靈，憑著信心，等候所盼望的義。」（5:5）這是基督徒的姿勢：不是一邊做工一邊算分數，而是站在已經被宣告為義的地方，往前等。等候不是無事可做，而是不再焦慮——判決書已經在基督裡寫好，我們等的是它在那一天被公開宣讀。<\/p><p>「原來在基督耶穌裡，受割禮不受割禮全無功效，惟獨使人生發仁愛的信心才有功效。」（5:6）這一節同時擋住兩邊。擋住律法主義：割禮在基督裡不算數，你的資歷、背景、宗派標記都不算數。也擋住放縱：信心如果生不出愛，那就不是這一節所說的信心。雅各說「信心若沒有行為就是死的」（雅 2:17），保羅在這裡說同一件事的另一面：活的信心自然會動起來。<\/p><p>次序要說清楚：我們不是因為愛人而稱義，是因信稱義；然後這信心藉著愛活出來。愛是果，不是門票（全卷立場見議題「律法、稱義與『因信』」）。所以，有人說「我信主了，行為無所謂」，這一節不答應；有人說「你愛得不夠，所以還不算得救」，這一節也不答應。<\/p><p>「在基督耶穌裡」是整句的地基。不是在割禮裡，也不是在未受割禮裡；人只有在基督裡才得自由，信心也只有在那裡才生得出愛來。<\/p>"},{"a":7,"z":9,"star":1,"grk":"<p lang=\"grc\">Ἐτρέχετε καλῶς· τίς ὑμᾶς ἐνέκοψεν τῇ ἀληθείᾳ μὴ πείθεσθαι;<\/p><p lang=\"grc\">ἡ πεισμονὴ οὐκ ἐκ τοῦ καλοῦντος ὑμᾶς.<\/p><p lang=\"grc\">μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ.<\/p>","lit":"<p>你們向來跑得好；誰切斷了你們，使你們不信從真理？<\/p><p>這勸誘不是出於那召你們的。<\/p><p>一點酵使整團麵都發起來。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Ἐτρέχετε καλῶς<\/td><td>Etrechete kalōs<\/td><td>你們一直跑得好<\/td><td>未完成式：過去一段持續的好狀態<\/td><\/tr><tr><td>ἐνέκοψεν<\/td><td>enekopsen<\/td><td>切進來、絆住<\/td><td>ἐγκόπτω：在跑道上插進來擋路<\/td><\/tr><tr><td>μὴ πείθεσθαι<\/td><td>mē peithesthai<\/td><td>不信從<\/td><td>πείθω 字根第一次<\/td><\/tr><tr><td>ἡ πεισμονὴ<\/td><td>hē peismonē<\/td><td>這勸誘<\/td><td>字根第二次；新約只此一見<\/td><\/tr><tr><td>τοῦ καλοῦντος<\/td><td>tou kalountos<\/td><td>那召你們的<\/td><td>現在分詞：神仍在召<\/td><\/tr><tr><td>μικρὰ ζύμη<\/td><td>mikra zymē<\/td><td>一點酵<\/td><td>與林前 5:6 同一句諺語<\/td><\/tr><\/table>","gram":"<p><strong>保羅從法庭換到運動場：Ἐτρέχετε καλῶς（Etrechete kalōs），「你們一直跑得好」。<\/strong><\/p><p>Ἐτρέχετε（Etrechete） 是未完成式，描寫一段持續的好時光；τίς ὑμᾶς ἐνέκοψεν（tis hymas enekopsen） 用不定過去式，是一次闖入。ἐγκόπτω（enkoptō） 原指在路上挖斷、設障，用在賽跑上，就是有人從旁切進跑道，把人撞出路線。τίς（tis） 是單數，和 5:10 的單數一樣，可能指一位帶頭的人，也可能只是泛指。<\/p><p>三節之間有一串字根遊戲：μὴ πείθεσθαι（5:7）、ἡ πεισμονὴ（5:8）、πέποιθα（5:10）都來自 πείθω（peithō）。他們「不信從」真理，是因為被另一種「勸誘」說服了；而保羅的回應是「我在主裡很信你們」。三個同根字，把三方的位置排了出來。τοῦ καλοῦντος（tou kalountos） 是現在分詞，對照 1:6 的不定過去式 τοῦ καλέσαντος（tou kalesantos）：神從前召了你們，現在仍在召你們。第 9 節 μικρὰ ζύμη ὅλον τὸ φύραμα ζυμοῖ（mikra zymē holon to phyrama zymoi） 與林前 5:6 一字不差，是當時通行的諺語。<\/p>","exp":"<p><strong>「你們向來跑得好，有誰攔阻你們，叫你們不順從真理呢？」（5:7）<\/strong><\/p><p>加拉太人不是一起跑就摔倒的。他們聽了福音，受了聖靈，甚至願意把自己的眼睛剜出來給保羅（4:15）。問題出在半路：有人從旁邊切進來，不是把他們推出場外，而是叫他們換到一條看起來更「認真」的跑道。最危險的攔阻，常常說的是好聽的話。<\/p><p>保羅給了一個分辨的方法：「這樣的勸導不是出於那召你們的。」（5:8）凡是把你從恩典帶到自己表現上的聲音，不管多麼屬靈，都不是那位召你的神。神的呼召把人帶回基督；那種勸誘叫人在基督以外，再找一點安全感。<\/p><p>「一點麵酵能使全團都發起來。」（5:9）在哥林多前書，這句諺語指教會容讓一樁公開的罪（本系列哥林多前書講義第 5 章已講過）；在這裡，它指一點點「再加上」的教導。攪擾的人只要求加上割禮，看起來只是一小塊；保羅說，酵不在乎大小，在乎會不會擴散。一條附加的規矩，遲早會改變整個福音的味道。<\/p>"},{"a":10,"z":12,"star":2,"grk":"<p lang=\"grc\">ἐγὼ πέποιθα εἰς ὑμᾶς ἐν κυρίῳ ὅτι οὐδὲν ἄλλο φρονήσετε· ὁ δὲ ταράσσων ὑμᾶς βαστάσει τὸ κρίμα, ὅστις ἐὰν ᾖ.<\/p><p lang=\"grc\">ἐγὼ δέ, ἀδελφοί, εἰ περιτομὴν ἔτι κηρύσσω, τί ἔτι διώκομαι; ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ.<\/p><p lang=\"grc\">ὄφελον καὶ ἀποκόψονται οἱ ἀναστατοῦντες ὑμᾶς.<\/p>","lit":"<p>我在主裡對你們有信心：你們不會想別的；但那攪擾你們的，必擔當那判決，無論他是誰。<\/p><p>而我，弟兄們，我若還傳割禮，為甚麼還受逼迫？那麼十字架的絆腳石就已經被廢掉了。<\/p><p>但願那些擾亂你們的人連自己也割掉。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>πέποιθα εἰς ὑμᾶς ἐν κυρίῳ<\/td><td>pepoitha eis hymas en kyriō<\/td><td>我在主裡對你們有把握<\/td><td>把握的根據在主，不在加拉太人<\/td><\/tr><tr><td>ὁ ταράσσων<\/td><td>ho tarassōn<\/td><td>那攪擾的<\/td><td>1:7 同字；現在分詞<\/td><\/tr><tr><td>βαστάσει τὸ κρίμα<\/td><td>bastasei to krima<\/td><td>要擔當判決<\/td><td>βαστάζω：6:2、5 擔重擔的同一個字<\/td><\/tr><tr><td>ὅστις ἐὰν ᾖ<\/td><td>hostis ean ē<\/td><td>無論他是誰<\/td><td>名望再高也一樣（2:6）<\/td><\/tr><tr><td>τὸ σκάνδαλον τοῦ σταυροῦ<\/td><td>to skandalon tou staurou<\/td><td>十字架的絆腳石<\/td><td>κατήργηται：與 5:4 同一個動詞<\/td><\/tr><tr><td>ὄφελον<\/td><td>ophelon<\/td><td>但願<\/td><td>一個咬著牙說出的願望<\/td><\/tr><tr><td>ἀποκόψονται<\/td><td>apokopsontai<\/td><td>割掉自己<\/td><td>多數學者讀作閹割<\/td><\/tr><tr><td>οἱ ἀναστατοῦντες<\/td><td>hoi anastatountes<\/td><td>顛覆者<\/td><td>比「攪擾」更重：把人連根掀翻<\/td><\/tr><\/table>","gram":"<p><strong>第 10 節兩個主詞對照：ἐγὼ πέποιθα（egō pepoitha），我對你們有信心；ὁ δὲ ταράσσων（ho de tarassōn），那攪擾的人必受審判。<\/strong><\/p><p>ὁ ταράσσων（ho tarassōn） 是 1:7 οἱ ταράσσοντες（hoi tarassontes） 的單數，可能是帶頭的人，也可能是「凡這樣做的人」的泛稱。ὅστις ἐὰν ᾖ（hostis ean ē）「無論是誰」暗示對方也許有些名望或背景（2:6「那些有名望的」），但地位不能豁免審判。βαστάσει τὸ κρίμα（bastasei to krima） 用了 βαστάζω（bastazō）：同一個動詞在 6:2 是「互相擔當」重擔，在 6:5 是「擔當自己的擔子」。攪擾的人把重擔加在別人身上，最後自己要擔的是審判。<\/p><p>第 11 節回應一個謠言：有人說保羅自己也還在傳割禮。可能的根據是他為提摩太行割禮（徒 16:3），或他歸主之前在猶太教裡的熱心（1:14）。保羅用事實反駁：τί ἔτι διώκομαι（ti eti diōkomai），如果我還傳割禮，為甚麼還受逼迫？ἄρα κατήργηται τὸ σκάνδαλον τοῦ σταυροῦ（ara katērgētai to skandalon tou staurou） 是完成式被動，用的正是 5:4 的 καταργέω（katargeō）：加上割禮，十字架的絆腳石就「被廢掉了」。5:4 失效的是人與基督的聯繫，5:11 失效的是十字架的鋒利。<\/p><p>第 12 節 ὄφελον（ophelon） 加未來直說語氣，是一個說出口的強烈願望。ἀποκόψονται（apokopsontai） 字面是「割掉」，有兩種讀法：一、多數現代註釋家讀為閹割——加拉太一帶敬拜大地之母的祭司以自閹為敬虔，保羅反諷說：既然你們以割為敬虔，何不割到底？律法自己說「被閹割的，不可入耶和華的會」（申 23:1），割過了頭，反倒被擋在會外。二、少數讀作「與你們割斷、自絕於教會」。本講義取第一種，並承認這是一句極重的話。<\/p>","exp":"<p><strong>這三節裡，保羅的語氣從牧者的信任轉到使徒的憤怒。兩種語氣出於同一份愛。<\/strong><\/p><p>「我在主裡很信你們必不懷別樣的心」（5:10）。保羅的把握不建立在加拉太人的表現上，而在「主裡」：他信那位召他們的神，會把他們帶回來。接著他轉向攪擾的人：「但攪擾你們的，無論是誰，必擔當他的罪名。」（5:10）要分清楚：要外邦信徒受割禮、守律法才算完整，是攪擾你們的人的主張，不是保羅的。保羅把他們交給神審判，自己不執行審判。<\/p><p>第 11 節點出這些人真正怕的是甚麼。保羅若肯加上割禮，猶太社群就不會再逼迫他；十字架討厭的地方，正在於它宣告：人在基督以外沒有任何可誇的。6:12 說得更直接，他們勉強人受割禮，「無非是怕自己為基督的十字架受逼迫」（6:12）。給福音加上一點東西，常常是為了讓福音不那麼刺耳。<\/p><p>然後是第 12 節：「恨不得那攪亂你們的人把自己割絕了。」（5:12）這是一句刺耳的反諷。保羅可以說這麼重的話嗎？要看三件事：他對準的是拆毀羊群的教師，不是軟弱的羊；他說的是一個交給神的願望，不是號召教會動手；他的憤怒是為了別人的自由，不是為了自己的面子。議題頁並陳各家看法。這一節不能拿來為今天在網路上辱罵意見不同的人辯護，更不能借它咒詛弟兄姊妹。它真正的鋒芒向著內裡：凡把十字架之外的條件加在人身上的，不論坐在甚麼位置，都要聽見這句話的重量。<\/p>"},{"a":13,"z":13,"star":3,"grk":"<p lang=\"grc\">Ὑμεῖς γὰρ ἐπʼ ἐλευθερίᾳ ἐκλήθητε, ἀδελφοί· μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί, ἀλλὰ διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις·<\/p>","lit":"<p>因為你們是蒙召在自由上，弟兄們；只是不要把這自由變成給肉體的據點，而要藉著那愛彼此作奴僕。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἐπʼ ἐλευθερίᾳ ἐκλήθητε<\/td><td>ep' eleutheria eklēthēte<\/td><td>你們蒙召在自由上<\/td><td>自由是呼召的目的地<\/td><\/tr><tr><td>μόνον μὴ<\/td><td>monon mē<\/td><td>只是不要<\/td><td>省略了動詞：語氣急促<\/td><\/tr><tr><td>ἀφορμὴν<\/td><td>aphormēn<\/td><td>據點、橋頭堡<\/td><td>軍事用語：發動攻擊的基地<\/td><\/tr><tr><td>τῇ σαρκί<\/td><td>tē sarki<\/td><td>給肉體<\/td><td>σάρξ：離開神、以自我為中心的人性<\/td><\/tr><tr><td>διὰ τῆς ἀγάπης<\/td><td>dia tēs agapēs<\/td><td>藉著那愛<\/td><td>有冠詞：5:6 那生出仁愛的信心所帶的愛<\/td><\/tr><tr><td>δουλεύετε ἀλλήλοις<\/td><td>douleuete allēlois<\/td><td>要彼此作奴僕<\/td><td>現在命令式；追蹤三最後一站<\/td><\/tr><\/table>","gram":"<p><strong>Ὑμεῖς γὰρ ἐπʼ ἐλευθερίᾳ ἐκλήθητε（Hymeis gar ep' eleutheria eklēthēte）：「你們」放在句首；ἐπί（epi） 加間接受格表示目的或根基，自由是你們蒙召要去的地方。<\/strong><\/p><p>γὰρ（gar） 接回 5:1 與 5:8：那召你們的，正是召你們進入自由。ἀδελφοί（adelphoi） 在這裡再出現；全卷最重的話剛說完，保羅仍叫他們弟兄。接著 μόνον μὴ τὴν ἐλευθερίαν εἰς ἀφορμὴν τῇ σαρκί（monon mē tēn eleutherian eis aphormēn tē sarki） 沒有動詞，像一隻急忙伸出的手：只是——不要把自由變成……。ἀφορμή（aphormē） 在軍事文獻裡指發動攻擊的基地；羅 7:8、11 說罪「趁著機會」，用的也是這個字。自由若交給肉體，就成了敵人登陸的灘頭。<\/p><p>ἀλλὰ（alla） 帶出正面命令：διὰ τῆς ἀγάπης δουλεύετε ἀλλήλοις（dia tēs agapēs douleuete allēlois）。δουλεύετε（douleuete） 與 5:1 的 δουλείας（douleias） 同字根，這是本章最大的弔詭：基督救我們脫離奴役（5:1），是為了讓我們彼此作奴僕（5:13）。和合本譯「互相服事」，原文的力度更重：甘心作奴僕。ἀλλήλοις（allēlois） 也很要緊：這不是單向的服從，是雙向的，沒有一個人坐在上面專門被服事。本卷追蹤三（ἐλευθερία（eleutheria）／δοῦλος（doulos））在這裡走到最後一站：從奴僕的軛，走到愛裡的奴僕。<\/p>","exp":"<p>〔哥林多〕林前 8:9（哥林多前書講義第 8 章）<\/p><p><strong>「弟兄們，你們蒙召是要得自由，只是不可將你們的自由當作放縱情慾的機會，總要用愛心互相服事。」（5:13）前半章防的是律法主義，從這一節起，保羅轉身防另一邊。<\/strong><\/p><p>一個剛聽見「你不必受割禮」的人，很容易聽成「所以我想怎樣就怎樣」。保羅預先堵住這條路。自由有兩個敵人：一個在前面，叫你回去背軛（5:1）；一個在後面，叫你把自由交給肉體（5:13）。兩個敵人看起來相反，結局一樣——都叫人重新變成奴僕，一個作規條的奴僕，一個作私慾的奴僕。<\/p><p>本系列哥林多前書講義第 8 章已講過同一個原則。哥林多人說偶像算不得甚麼，保羅承認他們的知識沒錯，卻說：「只是你們要謹慎，恐怕你們這自由竟成了那軟弱人的絆腳石。」（林前 8:9）在哥林多，自由的試探來自知識；在加拉太，自由的試探來自肉體。兩封信給的出口相同：自由要朝著弟兄的益處走。<\/p><p>「總要用愛心互相服事」，原文是「藉著愛，彼此作奴僕」。這是全卷最美的翻轉：被釋放的人，用他的自由去選擇服事。奴僕是被迫服事，兒子是甘心服事；外面看起來一樣在洗碗、排椅子、陪伴人，裡面是完全不同的兩種生命。<\/p><p>但「互相」二字不可省。這不是叫某一群人無限付出，讓另一群人坐享其成；也不是叫受傷的人默默忍受。愛裡的奴僕是彼此的，擔當人，也被人擔當（6:2；全卷立場見議題「基督徒的自由：在律法主義與放縱之間」）。所以這一節有兩個檢驗：我的自由，是叫人得益處，還是給我的肉體開門？我的服事，是出於愛的選擇，還是出於怕被定罪的壓力？<\/p>"},{"a":14,"z":15,"star":2,"grk":"<p lang=\"grc\">ὁ γὰρ πᾶς νόμος ἐν ἑνὶ λόγῳ πεπλήρωται ἐν τῷ· Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν<\/p><p lang=\"grc\">εἰ δὲ ἀλλήλους δάκνετε καὶ κατεσθίετε, βλέπετε μὴ ὑπʼ ἀλλήλων ἀναλωθῆτε.<\/p>","lit":"<p>因為全部的律法在一句話裡已經被成全了，就是在這一句：你要愛你的鄰舍如同你自己。<\/p><p>但你們若彼此咬、又吞吃，要小心，免得被彼此吃光。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ὁ γὰρ πᾶς νόμος<\/td><td>ho gar pas nomos<\/td><td>因為全部的律法<\/td><td>對照 5:3 的「全律法」<\/td><\/tr><tr><td>ἐν ἑνὶ λόγῳ<\/td><td>en heni logō<\/td><td>在一句話裡<\/td><td>不是減少，是濃縮<\/td><\/tr><tr><td>πεπλήρωται<\/td><td>peplērōtai<\/td><td>已經被成全<\/td><td>完成式被動：成全是持續的事實<\/td><\/tr><tr><td>τὸν πλησίον σου<\/td><td>ton plēsion sou<\/td><td>你的鄰舍<\/td><td>利 19:18 七十士譯本原句<\/td><\/tr><tr><td>δάκνετε καὶ κατεσθίετε<\/td><td>daknete kai katesthiete<\/td><td>咬、吞吃<\/td><td>野獸的動作；現在式：正在發生<\/td><\/tr><tr><td>ἀναλωθῆτε<\/td><td>analōthēte<\/td><td>被吃光<\/td><td>被耗盡、被消滅<\/td><\/tr><\/table>","gram":"<p><strong>第 14 節與第 3 節是一組刻意的對照：ὅλον τὸν νόμον ποιῆσαι（5:3）對 ὁ γὰρ πᾶς νόμος（ho gar pas nomos）……πεπλήρωται（5:14）。<\/strong><\/p><p>受割禮的人「欠著」要去「行」全律法；在聖靈裡用愛服事的人，全律法在他身上「被成全」。一個是 ποιῆσαι（poiēsai），做；一個是 πεπλήρωται（peplērōtai），被填滿。完成式被動語態說的不是我們努力把律法做完，而是在愛裡，律法本來要的已經達成了。ἐν ἑνὶ λόγῳ（en heni logō） 之後，ἐν τῷ（en tō） 引出利 19:18 的七十士譯本原句：Ἀγαπήσεις τὸν πλησίον σου ὡς σεαυτόν（Agapēseis ton plēsion sou hōs seauton）。主耶穌也把這一句列為律法的總綱之一（太 22:39–40）；羅 13:10 說「愛就完全了律法」（羅 13:10）。<\/p><p>第 15 節的條件句 εἰ δὲ ἀλλήλους δάκνετε καὶ κατεσθίετε（ei de allēlous daknete kai katesthiete） 用直說語氣現在式：這不是遙遠的假設，是正在發生的事。δάκνετε（daknete） 是咬，κατεσθίετε（katesthiete） 是吞，都是野獸撕鬥的字。βλέπετε μὴ ὑπʼ ἀλλήλων ἀναλωθῆτε（blepete mē hyp' allēlōn analōthēte）：咬、吞，最後吃光，三個動詞層層加重；ἀλλήλους（allēlous）、ἀλλήλων（allēlōn） 兩次「彼此」，正好把 5:13 的「彼此作奴僕」反過來。這是全卷地勢圖的最低點。<\/p>","exp":"<p><strong>「因為全律法都包在……這一句話之內了。」（5:14）攪擾的人要加拉太人背起全律法；保羅說，全律法的心就在一句話裡。<\/strong><\/p><p>這一句話是「愛人如己」（利 19:18）。保羅不是說律法被丟掉了，而是說律法一直指向的地方就是愛。律法說不可殺人、不可偷盜、不可作假見證，背後都是同一句話：把鄰舍當作和你一樣寶貴的人。守了一千條規矩卻不愛人，律法的心沒有被成全；在聖靈裡愛人的人，律法要的已經在他身上長出來。<\/p><p>這一節也保護我們不落入另一個誤會：「不在律法以下」不等於「沒有道德標準」。基督徒的標準沒有降低，反而更深了。規條只能管到手，愛要管到心。<\/p><p>第 15 節馬上落地：「你們要謹慎，若相咬相吞，只怕要彼此消滅了。」（5:15）保羅用的是野獸的字。加拉太的教會為割禮爭、為飲食爭、為誰比較正統爭，爭到最後沒有贏家，大家都被吃掉。這是全卷的低谷。<\/p><p>值得注意的是：律法主義和放縱都會咬人。律法主義用規條咬人：「你不夠屬靈。」放縱用私慾咬人：「我想要的，你得讓開。」兩邊方向相反，牙齒一樣尖。今天教會群組裡的筆戰、小組裡的冷言冷語、同工之間的互相拆台，都是這一節的現代版本。出路不是更多的規條，也不是從此不談是非，而是回到 5:13：彼此作愛的奴僕。<\/p>"},{"a":16,"z":18,"star":3,"grk":"<p lang=\"grc\">Λέγω δέ, πνεύματι περιπατεῖτε καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε.<\/p><p lang=\"grc\">ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος, τὸ δὲ πνεῦμα κατὰ τῆς σαρκός, ταῦτα γὰρ ἀλλήλοις ἀντίκειται, ἵνα μὴ ἃ ἐὰν θέλητε ταῦτα ποιῆτε.<\/p><p lang=\"grc\">εἰ δὲ πνεύματι ἄγεσθε, οὐκ ἐστὲ ὑπὸ νόμον.<\/p>","lit":"<p>而我說：你們要藉著靈行走，就絕不會成全肉體的慾望。<\/p><p>因為肉體所欲的與靈相反，靈與肉體相反，因為這兩個彼此對立，以致你們所願意的，這些你們不做。<\/p><p>但你們若被靈引導，你們就不在律法以下。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>πνεύματι περιπατεῖτε<\/td><td>pneumati peripateite<\/td><td>要藉著靈行走<\/td><td>περιπατέω：一步一步的日常行走<\/td><\/tr><tr><td>οὐ μὴ τελέσητε<\/td><td>ou mē telesēte<\/td><td>絕不會成全<\/td><td>雙重否定：不是第二道命令，是應許<\/td><\/tr><tr><td>ἐπιθυμίαν σαρκὸς<\/td><td>epithymian sarkos<\/td><td>肉體的慾望<\/td><td>σάρξ 不是身體，是離開神的自我<\/td><\/tr><tr><td>ἀλλήλοις ἀντίκειται<\/td><td>allēlois antikeitai<\/td><td>彼此對立<\/td><td>兩個陣營對峙<\/td><\/tr><tr><td>πνεύματι ἄγεσθε<\/td><td>pneumati agesthe<\/td><td>被靈引導<\/td><td>現在被動：被牽著走<\/td><\/tr><tr><td>ὑπὸ νόμον<\/td><td>hypo nomon<\/td><td>在律法以下<\/td><td>4:4–5、21 的同一個片語<\/td><\/tr><\/table>","gram":"<p><strong>Λέγω δέ（Legō de） 是保羅提出主張的記號；整個勸勉段的總綱就在這裡：πνεύματι περιπατεῖτε（pneumati peripateite）。<\/strong><\/p><p>περιπατεῖτε（peripateite） 是現在命令式，「要繼續行走」。περιπατέω（peripateō） 字面是「到處走」，在猶太人的用語裡，「行走」就是生活方式。間接受格 πνεύματι（pneumati） 可以是工具（靠著聖靈）、範圍（在聖靈裡）或準則（照著聖靈），三者都通，和合本「順著」兼顧了後兩者。後半句 καὶ ἐπιθυμίαν σαρκὸς οὐ μὴ τελέσητε（kai epithymian sarkos ou mē telesēte） 用 οὐ μὴ（ou mē） 加不定過去假設語氣，是希臘文最強的否定：「絕不會」。這不是第二道命令，是第一道命令的結果——順著聖靈走，就絕不會把肉體的慾望做到底。<\/p><p>第 17 節兩個 γὰρ（gar） 交代原因。ἡ γὰρ σὰρξ ἐπιθυμεῖ κατὰ τοῦ πνεύματος（hē gar sarx epithymei kata tou pneumatos），τὸ δὲ πνεῦμα κατὰ τῆς σαρκός（to de pneuma kata tēs sarkos）：後半句省略了動詞，形成工整的對稱。ἀντίκειται（antikeitai） 是兩軍對陣。最難的是 ἵνα μὴ ἃ ἐὰν θέλητε ταῦτα ποιῆτε（hina mē ha ean thelēte tauta poiēte），有三種讀法：一、結果：兩邊拉鋸，使你們想行善不能、想行惡也不能；二、目的：聖靈抵擋肉體，為要叫你們不去做肉體所想的；三、與羅 7 章同讀：肉體攔阻你們行所願意的善。本講義認為，第 16、18 節把第 17 節夾在中間：這掙扎是真實的，卻不是勢均力敵的僵局，勝負在於跟隨誰。<\/p><p>第 18 節 εἰ δὲ πνεύματι ἄγεσθε（ei de pneumati agesthe） 是現在被動，ἄγω（agō）「被引導、被牽著走」，羅 8:14 用同一個動詞。οὐκ ἐστὲ ὑπὸ νόμον（ouk este hypo nomon） 接回「生在律法以下」（4:4）：聖靈既擋住放縱（5:16），也擋住律法主義（5:18）。<\/p>","exp":"<p><strong>本章的章題：「我說，你們當順著聖靈而行，就不放縱肉體的情慾了。」（5:16）<\/strong><\/p><p>保羅拆掉了律法的軛，也堵住了放縱的門。那麼基督徒到底要怎樣活？他的答案不是一張新的規條表，而是一種走路的方式：順著聖靈而行。這是一個很日常的動詞，不是偶爾的屬靈高峰，而是上班、吃飯、回訊息、跟家人說話的每一步。<\/p><p>注意這一節的次序。保羅沒有說：「你們先拚命壓住情慾，聖靈就會來。」他說：順著聖靈而行，就不放縱肉體的情慾。對付肉體的方法，不是把眼睛一直盯在肉體上，而是把腳步跟上聖靈。像在夜路上，與其一直數路上有幾個坑，不如緊跟那提燈的人。<\/p><p>第 17 節也很誠實：「情慾和聖靈相爭，聖靈和情慾相爭」（5:17）。屬靈的人不是沒有掙扎的人。基督徒裡面有兩個本性嗎？改革宗傳統常說信徒「同時是義人，又是罪人」；也有學者強調這不是兩個「我」，而是新舊兩個時代的力量在一個人身上交會。羅 7 章「我所願意的善，我反不做」（羅 7:19）說的是不是重生的人，各家也有不同判斷，議題頁並陳。但第 16 節的應許與第 18 節的結論，都站在聖靈這一邊：掙扎是真的，結局不是平手。<\/p><p>第 18 節再加一句：「但你們若被聖靈引導，就不在律法以下。」（5:18）被引導是被動的，像孩子被父親牽著手。本章用三個動詞說聖靈的引導：「順著聖靈而行」（5:16）是日常的行走；「被聖靈引導」（5:18）是交出方向盤；「靠聖靈行事」（5:25）是跟上隊伍的步伐。這正是 321 基礎三「聖靈是我的引導」在加拉太書的原型：引導不是一種神祕的感覺，是一條每天跟著走的路。<\/p>"},{"a":19,"z":21,"star":3,"grk":"<p lang=\"grc\">φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός, ἅτινά ἐστιν πορνεία, ἀκαθαρσία, ἀσέλγεια,<\/p><p lang=\"grc\">εἰδωλολατρία, φαρμακεία, ἔχθραι, ἔρις, ζῆλος, θυμοί, ἐριθεῖαι, διχοστασίαι, αἱρέσεις,<\/p><p lang=\"grc\">φθόνοι μέθαι, κῶμοι, καὶ τὰ ὅμοια τούτοις, ἃ προλέγω ὑμῖν καθὼς προεῖπον ὅτι οἱ τὰ τοιαῦτα πράσσοντες βασιλείαν θεοῦ οὐ κληρονομήσουσιν.<\/p>","lit":"<p>而肉體的作為是顯明的，就是：淫亂、污穢、放蕩、<\/p><p>拜偶像、行邪術、種種仇恨、紛爭、嫉妒、種種怒氣、種種自私的野心、種種分裂、種種派別、<\/p><p>種種嫉妒、種種醉酒、種種狂歡，以及與這些相似的事；這些我預先告訴你們，正如我從前說過的：那些行這類事的人，不能承受神的國。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>φανερὰ<\/td><td>phanera<\/td><td>顯明的<\/td><td>不用分辨，一看就知<\/td><\/tr><tr><td>τὰ ἔργα τῆς σαρκός<\/td><td>ta erga tēs sarkos<\/td><td>肉體的作為<\/td><td>複數：一件一件做出來的<\/td><\/tr><tr><td>πορνεία<\/td><td>porneia<\/td><td>淫亂<\/td><td>一切性方面的越界<\/td><\/tr><tr><td>εἰδωλολατρία<\/td><td>eidōlolatria<\/td><td>拜偶像<\/td><td>SBLGNT 此字無 Strong 編號；與下一字成一組<\/td><\/tr><tr><td>φαρμακεία<\/td><td>pharmakeia<\/td><td>邪術<\/td><td>與藥物、巫術、符咒有關<\/td><\/tr><tr><td>ἐριθεῖαι<\/td><td>eritheiai<\/td><td>結黨<\/td><td>為自己的利益拉幫結派；複數<\/td><\/tr><tr><td>καὶ τὰ ὅμοια τούτοις<\/td><td>kai ta homoia toutois<\/td><td>以及類似的事<\/td><td>清單列不完<\/td><\/tr><tr><td>οἱ τὰ τοιαῦτα πράσσοντες<\/td><td>hoi ta toiauta prassontes<\/td><td>那些行這類事的人<\/td><td>現在分詞：以此為生活方式<\/td><\/tr><\/table>","gram":"<p><strong>φανερὰ δέ ἐστιν τὰ ἔργα τῆς σαρκός（phanera de estin ta erga tēs sarkos）：「作為」是複數，和 5:22 單數的「果子」遙遙相對。<\/strong><\/p><p>SBLGNT 的清單共十五項，大致可分四組：性方面三項（πορνεία（porneia）、ἀκαθαρσία（akatharsia）、ἀσέλγεια（aselgeia））；宗教兩項（εἰδωλολατρία（eidōlolatria）、φαρμακεία（pharmakeia））；人際八項（從 ἔχθραι（echthrai） 到 φθόνοι（phthonoi））；放縱兩項（μέθαι（methai）、κῶμοι（kōmoi））。最大的一組是人際，而且多半用複數（ἔχθραι（echthrai）、θυμοί（thymoi）、ἐριθεῖαι（eritheiai）、διχοστασίαι（dichostasiai）、αἱρέσεις（haireseis）、φθόνοι（phthonoi）），指一次又一次的爆發。這和 5:15「相咬相吞」、5:26「彼此惹氣」正好呼應：加拉太的肉體，最明顯的是在教會裡撕裂彼此。αἱρέσεις（haireseis） 在這裡還不是後來教義意義上的「異端」，而是黨派、派系。清單最後 καὶ τὰ ὅμοια τούτοις（kai ta homoia toutois），「等類」：肉體的作為永遠列不完。<\/p><p><strong>◆ 經文鑑別 5:21：SBLGNT 與 NA28 在 φθόνοι（phthonoi） 之後沒有 φόνοι（phonoi）「凶殺」；和合本註腳說「有古卷加：凶殺二字」，拜占庭傳統（RP）與 Tregelles 版有此字。<\/strong>兩個字只差一個字母。主張原有此字的一方認為，抄寫者因兩字相似而看漏了一個；主張後來加上的一方指出，幾份最早的重要抄本都沒有，而羅 1:29 正好把嫉妒與凶殺並列，抄寫者容易照著補上。本講義從 SBLGNT，以較短的讀法為原文，並交代和合本註腳；這處異文不影響任何教義，凶殺本就落在仇恨與「等類」之中。<\/p><p>第 21 節 ἃ προλέγω ὑμῖν καθὼς προεῖπον（ha prolegō hymin kathōs proeipon）：保羅建立教會時就說過，現在再說一次。οἱ τὰ τοιαῦτα πράσσοντες（hoi ta toiauta prassontes） 是現在分詞，描寫一種持續、成為身分的生活方式；βασιλείαν θεοῦ οὐ κληρονομήσουσιν（basileian theou ou klēronomēsousin） 的「承受」接回 3:29、4:7、4:30 的後嗣語言：兒子才承受產業。<\/p>","exp":"<p><strong>「情慾的事都是顯而易見的」（5:19）。不需要特別的屬靈恩賜，就看得懂這張清單。<\/strong><\/p><p>清單從身體開始，經過宗教，停在人際，最後落在醉酒荒宴。今天的讀者容易只看見第一組與最後一組，以為肉體就是性與酒；保羅卻用了八項描寫人與人之間的毀壞：仇恨、爭競、忌恨、惱怒、結黨、紛爭、異端、嫉妒。照這張清單，一位從不喝酒、卻在教會裡拉幫結派的人，和一位醉酒的人，同樣是活在肉體裡。<\/p><p>「邪術」一字和藥物、符咒有關。放在華人處境裡，求籤問卦、畫符、靠風水改運，不只是文化，是把信靠交給了另一個力量（全卷立場見議題「基督徒的自由：在律法主義與放縱之間」）。<\/p><p>然後是重話：「我從前告訴你們，現在又告訴你們，行這樣事的人必不能承受神的國。」（5:21）這一句不能刪去，也不能講成恐嚇。不能刪去，因為它擋住放縱：一個人說「我信主了，怎樣生活都沒關係」，保羅不答應。不能講成恐嚇，因為動詞是現在分詞，說的是以這些事為生活方式、安然住在其中的人，不是偶然跌倒的人。對後者，下一章已經留了一條回來的路：「若有人偶然被過犯所勝……把他挽回過來」（6:1）。<\/p><p>基督徒犯了這些罪，就不能得救了嗎？林前 6:9–11 列了一張相似的清單之後，提醒哥林多人他們中間也有人從前是這樣，如今卻已經洗淨、成聖、稱義——這張清單描寫的是神國以外的生活樣式，也正是福音把人救出來的地方。對於持續活在其中的人是否曾真正得救，加爾文派與阿民念派有不同解釋，議題頁並陳。兩派都同意：得救的條件是信靠基督，生命的改變是得救的果子。看見這張清單而心裡發痛的人，正是聖靈還在他裡面動工的記號。<\/p>"},{"a":22,"z":23,"star":3,"grk":"<p lang=\"grc\">Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν ἀγάπη, χαρά, εἰρήνη, μακροθυμία, χρηστότης, ἀγαθωσύνη, πίστις,<\/p><p lang=\"grc\">πραΰτης, ἐγκράτεια· κατὰ τῶν τοιούτων οὐκ ἔστιν νόμος.<\/p>","lit":"<p>但靈的果子是：愛、喜樂、和平、恆久忍耐、恩慈、良善、信實、<\/p><p>溫柔、節制；對這類事，沒有律法。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Ὁ δὲ καρπὸς τοῦ πνεύματός<\/td><td>Ho de karpos tou pneumatos<\/td><td>但靈的果子<\/td><td>單數：一個果子<\/td><\/tr><tr><td>ἀγάπη<\/td><td>agapē<\/td><td>愛<\/td><td>排第一：5:6、13、14 的那一個字<\/td><\/tr><tr><td>μακροθυμία<\/td><td>makrothymia<\/td><td>恆久忍耐<\/td><td>氣很長：不輕易發怒<\/td><\/tr><tr><td>χρηστότης<\/td><td>chrēstotēs<\/td><td>恩慈<\/td><td>對人好、叫人可以親近<\/td><\/tr><tr><td>πίστις<\/td><td>pistis<\/td><td>信實<\/td><td>全卷「信心」的同一個字，這裡是可靠<\/td><\/tr><tr><td>πραΰτης<\/td><td>praytēs<\/td><td>溫柔<\/td><td>SBLGNT 此字無 Strong 編號；6:1 再出現<\/td><\/tr><tr><td>ἐγκράτεια<\/td><td>enkrateia<\/td><td>節制<\/td><td>掌管自己；對著醉酒荒宴<\/td><\/tr><tr><td>κατὰ τῶν τοιούτων<\/td><td>kata tōn toioutōn<\/td><td>對這類事<\/td><td>對照 5:21 的「這樣事」<\/td><\/tr><\/table>","gram":"<p><strong>Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν（Ho de karpos tou pneumatos estin）：δὲ（de） 是轉折，主詞是單數的 καρπὸς（karpos），動詞也是單數的 ἐστιν（estin）。<\/strong><\/p><p>肉體出產的是 τὰ ἔργα（ta erga），複數的「作為」，一件一件做出來；聖靈出產的是 ὁ καρπὸς（ho karpos），單數的「果子」，一棵樹活著自然長出來。保羅在這裡用一個單數名詞，接上九個名詞，多數註釋家認為是刻意的：不是九個果子讓人挑幾個來結，是一個果子的九種滋味。以弗所書說「光明所結的果子」（弗 5:9），也是同樣的單數。<\/p><p>九項常被分成三組：ἀγάπη（agapē）、χαρά（chara）、εἰρήνη（eirēnē） 是生命的根；μακροθυμία（makrothymia）、χρηστότης（chrēstotēs）、ἀγαθωσύνη（agathōsynē） 是向人的樣子；πίστις（pistis）、πραΰτης（praytēs）、ἐγκράτεια（enkrateia） 是自己的品格。這是讀者的整理，不是經文的明文，卻幫助我們看見九項彼此相連。ἀγάπη（agapē） 排第一，接回 5:6、13、14。πίστις（pistis） 在全卷多半譯作「信心」，在這裡和合本譯「信實」：信靠神的人，自己也成為可靠的人。πραΰτης（praytēs） 在 6:1 再出現，挽回跌倒的人要用「溫柔的心」。ἐγκράτεια（enkrateia） 排最後，正好對著肉體清單最後的醉酒荒宴。<\/p><p>第 23 節收尾 κατὰ τῶν τοιούτων οὐκ ἔστιν νόμος（kata tōn toioutōn ouk estin nomos） 是一句輕描淡寫的反語：律法哪裡會反對這些呢？τοιούτων（toioutōn） 與 5:21 的 τὰ τοιαῦτα（ta toiauta） 呼應：那「這樣的事」使人不能承受神的國，這「這樣的事」沒有律法禁止。<\/p>","exp":"<p><strong>「聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。」（5:22–23）<\/strong><\/p><p>讀這兩節之前，先回頭看 5:19：肉體的「作為」是複數，聖靈的「果子」是單數。這一個字的分別，改變了我們讀這張清單的方式。如果它是九個果子，我們很容易把它當作九項功課：這個月操練忍耐，下個月操練溫柔，年底再檢查自己結了幾個。但它是一個果子，有九種滋味。仁愛裡有忍耐，喜樂裡有節制，溫柔裡有信實；你不能只要其中一樣，也不能用其中一樣頂替別的。<\/p><p>果子也不是擠出來的。沒有一棵蘋果樹是咬緊牙關擠出蘋果的；它只是活著，連在根上，到了季節就結果。主耶穌說：「常在我裡面的，我也常在他裡面，這人就多結果子」（約 15:5）。這不表示基督徒甚麼都不用做——5:16 的「行」、5:25 的「行事」都是命令；但我們做的是跟上聖靈，果子是聖靈結的。<\/p><p>這正是 321「920」最要緊的原文提醒：操練活出無己的 0，結出聖靈的 9。這個 9 不是九項功課，是一個生命，就是第 2 章講過的「基督在我裡面活著」長出來的樣子；那一節的結尾是「他是愛我，為我捨己」（2:20）。被愛的人，才結得出愛的果子。<\/p><p>「這樣的事沒有律法禁止」（5:23）帶著一點幽默：從來沒有一條法律禁止人太有恩慈、太過溫柔。攪擾的人想用割禮造出更好的基督徒，保羅指出另一條路：律法要的，聖靈的果子自然就有，而且更多。這也提醒教會，衡量一個人的屬靈，不要先看他的恩賜與果效，先看他身上有沒有這一個果子的滋味。<\/p>"},{"a":24,"z":24,"star":2,"grk":"<p lang=\"grc\">οἱ δὲ τοῦ Χριστοῦ τὴν σάρκα ἐσταύρωσαν σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις.<\/p>","lit":"<p>而那些屬於基督的人，已經把肉體連同那些激情和慾望釘了十字架。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>οἱ δὲ τοῦ Χριστοῦ<\/td><td>hoi de tou Christou<\/td><td>而那些屬基督的<\/td><td>所屬的屬格：屬於誰<\/td><\/tr><tr><td>τὴν σάρκα ἐσταύρωσαν<\/td><td>tēn sarka estaurōsan<\/td><td>把肉體釘了十字架<\/td><td>不定過去式主動：主詞是信徒<\/td><\/tr><tr><td>σὺν τοῖς παθήμασιν<\/td><td>syn tois pathēmasin<\/td><td>連同那些激情<\/td><td>失序、轄制人的激情<\/td><\/tr><tr><td>ταῖς ἐπιθυμίαις<\/td><td>tais epithymiais<\/td><td>那些慾望<\/td><td>接回 5:16 的「情慾」<\/td><\/tr><\/table>","gram":"<p><strong>◆ 經文鑑別 5:24：SBLGNT 作 οἱ δὲ τοῦ Χριστοῦ（hoi de tou Christou）「屬基督的」；NA28、WH 作 τοῦ Χριστοῦ Ἰησοῦ（tou Christou Iēsou），和合本「基督耶穌」與後者相同。<\/strong>兩種讀法都有可觀的抄本支持：較短的讀法可能是原文，抄寫者照保羅常用的「基督耶穌」補上一個字；也可能是抄寫時漏去。本講義照 SBLGNT 讀原文、照和合本解經，兩種讀法意思完全相同。<\/p><p>τοῦ Χριστοῦ（tou Christou） 是所屬的屬格，與 3:29 εἰ δὲ ὑμεῖς Χριστοῦ（ei de hymeis Christou） 同一個說法：你們屬於基督。ἐσταύρωσαν（estaurōsan） 是不定過去式主動語態——這是本卷三次「釘十字架」中唯一以信徒為主詞的一次。2:19–20 的 Χριστῷ συνεσταύρωμαι（Christō synestaurōmai） 是完成式被動：我與基督同被釘，是神作成的；6:14 的 ἐσταύρωται（estaurōtai） 也是完成式被動：世界向我被釘。只有這裡說「他們把肉體釘了」。不定過去式指向一個已經發生的決定性時刻，多數註釋家連到信主、受洗歸入基督的那一刻（羅 6:6）。σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις（syn tois pathēmasin kai tais epithymiais）：παθήμασιν（pathēmasin） 在這裡不是一般的情感，而是失序、轄制人的激情；ταῖς ἐπιθυμίαις（tais epithymiais） 接回 5:16 的 ἐπιθυμίαν（epithymian）。<\/p>","exp":"<p><strong>「凡屬基督耶穌的人，是已經把肉體連肉體的邪情私慾同釘在十字架上了。」（5:24）<\/strong><\/p><p>這一節回答一個很實際的問題：既然情慾和聖靈相爭（5:17），我們怎麼贏得了？保羅的回答是先問身分：你是屬誰的？屬基督的人，在信主歸入基督的時候，已經對肉體說了「不」。那是一個已經作出的決定，不是每天重新簽一次的合約。<\/p><p>所以要避開一個常見的誤讀：把「同釘」講成「我每天要努力把自己釘死」。2:20 的「同釘」是完成式被動，神已經作成；5:24 的主動語態，是我們在信的那一刻同意了神所作的。今天的功課不是再釘一次，而是活在那個決定裡，順著聖靈而行（5:25）。第 2 章講過的四個誤讀，在這裡都要記住：「現在活著的不再是我，乃是基督在我裡面活著……他是愛我，為我捨己」（2:20）——無己不是自我消失，是被愛的自己交給了真正的主人。<\/p><p>也要避開第二個誤讀：把「邪情私慾」聽成「一切感受」。釘上十字架的是失序的激情與私慾，不是人的情感本身。主耶穌會哭；保羅在這封信裡會希奇（1:6）、會心裡作難（4:20）、會為他們再受生產之苦（4:19）。一個屬基督的人仍然會傷心、會生氣、會說「不」；不同的是，這些感受不再坐在王位上。<\/p><p>這是 321 無己在本章的落點：不是壓抑自己，是換了主人。屬基督的人，就聽基督的。<\/p>"},{"a":25,"z":26,"star":1,"grk":"<p lang=\"grc\">εἰ ζῶμεν πνεύματι, πνεύματι καὶ στοιχῶμεν.<\/p><p lang=\"grc\">μὴ γινώμεθα κενόδοξοι, ἀλλήλους προκαλούμενοι, ἀλλήλοις φθονοῦντες.<\/p>","lit":"<p>我們若藉著靈活著，也要藉著靈排隊前行。<\/p><p>我們不要成為貪圖虛榮的，彼此挑釁，彼此嫉妒。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>εἰ ζῶμεν πνεύματι<\/td><td>ei zōmen pneumati<\/td><td>既然我們藉著靈活著<\/td><td>第一類條件句：當作事實<\/td><\/tr><tr><td>πνεύματι καὶ στοιχῶμεν<\/td><td>pneumati kai stoichōmen<\/td><td>也要藉著靈排隊前行<\/td><td>勸勉的假設語氣：保羅把自己算在內<\/td><\/tr><tr><td>στοιχεῖα<\/td><td>stoicheia<\/td><td>小學、基本元素<\/td><td>4:3、9 同字根<\/td><\/tr><tr><td>κενόδοξοι<\/td><td>kenodoxoi<\/td><td>貪圖虛榮的<\/td><td>空的榮耀<\/td><\/tr><tr><td>ἀλλήλους προκαλούμενοι<\/td><td>allēlous prokaloumenoi<\/td><td>彼此挑釁<\/td><td>自以為強的人向下挑戰<\/td><\/tr><tr><td>ἀλλήλοις φθονοῦντες<\/td><td>allēlois phthonountes<\/td><td>彼此嫉妒<\/td><td>自以為弱的人向上眼紅<\/td><\/tr><\/table>","gram":"<p><strong>第 25 節是一個交錯排列：ζῶμεν πνεύματι（zōmen pneumati），πνεύματι（pneumati）……στοιχῶμεν（stoichōmen），兩個 πνεύματι（pneumati） 在中間相碰。<\/strong><\/p><p>εἰ（ei） 帶出第一類條件句，假定為事實：「既然我們靠聖靈得生」。στοιχῶμεν（stoichōmen） 是勸勉的假設語氣，「讓我們」，保羅把自己也放進隊伍裡。στοιχέω（stoicheō） 原指軍隊排成行列、按步伐前進；它和 4:3、9 的 στοιχεῖα（stoicheia） 同字根：從前人被「世俗小學」排成隊伍，如今跟上聖靈的步伐。6:16 會用同一個動詞說「照此理而行」。第 16 節的 περιπατέω（peripateō） 是行走，第 18 節的 ἄγω（agō） 是被牽引，第 25 節的 στοιχέω（stoicheō） 是跟上隊伍——三個動詞，三種引導。<\/p><p>第 26 節 μὴ γινώμεθα κενόδοξοι（mē ginōmetha kenodoxoi），κενόδοξοι（kenodoxoi） 由「空」與「榮耀」合成。兩個分詞指出虛榮的兩個方向：προκαλούμενοι（prokaloumenoi） 是向人挑戰，φθονοῦντες（phthonountes） 是對人眼紅。φθονοῦντες（phthonountes） 與 5:21 的 φθόνοι（phthonoi） 同字根：肉體的清單，從教會的後門又溜了進來。<\/p>","exp":"<p><strong>「我們若是靠聖靈得生，就當靠聖靈行事。」（5:25）生命的來源，決定走路的步伐。<\/strong><\/p><p>保羅把全章收在一個簡單的邏輯上：既然生命是聖靈給的，生活也要跟著聖靈。加拉太人的問題正是「你們既靠聖靈入門，如今還靠肉身成全嗎」（3:3）；保羅說，入門與走路是同一位聖靈。這也是全卷那條線：身分換了，走路的方式才換得了。<\/p><p>「行事」原文是排成隊伍、跟上步伐。聖靈的引導不只是一個人私下的感覺，而是一群人一起跟上同一個步伐，所以下一節立刻談到人際：「不要貪圖虛名，彼此惹氣，互相嫉妒。」（5:26）自覺比較屬靈的人容易挑釁人，自覺不如人的人容易嫉妒人；兩種都是虛名作祟，都是 321 所說的有己。治本的方法不是比較，是跟上：眼睛看著帶隊的那一位，就不必一直看旁邊的人。第 6 章會從這裡接下去，講挽回、擔當與察驗自己。<\/p>"}],"6":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Ἀδελφοί, ἐὰν καὶ προλημφθῇ ἄνθρωπος ἔν τινι παραπτώματι, ὑμεῖς οἱ πνευματικοὶ καταρτίζετε τὸν τοιοῦτον ἐν πνεύματι πραΰτητος, σκοπῶν σεαυτόν, μὴ καὶ σὺ πειρασθῇς.<\/p>","lit":"<p>弟兄們，即使有人在某個過犯中被搶先抓住，你們屬靈的人要用溫柔的靈修復這樣的人，留意你自己，免得連你也被試探。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Ἀδελφοί<\/td><td>Adelphoi<\/td><td>弟兄們<\/td><td>5:26「彼此惹氣」之後，先叫一聲家人<\/td><\/tr><tr><td>προλημφθῇ<\/td><td>prolēmphthē<\/td><td>被搶先抓住<\/td><td>被動；不是蓄意走進去，是被絆住<\/td><\/tr><tr><td>ἔν τινι παραπτώματι<\/td><td>en tini paraptōmati<\/td><td>在某個過犯裡<\/td><td>παράπτωμα：失足、走偏一步<\/td><\/tr><tr><td>ὑμεῖς οἱ πνευματικοὶ<\/td><td>hymeis hoi pneumatikoi<\/td><td>你們屬靈的人<\/td><td>不是階級；是 5:25「靠聖靈行事」的人<\/td><\/tr><tr><td>καταρτίζετε<\/td><td>katartizete<\/td><td>你們要修復<\/td><td>現在命令式；補網、接骨的字<\/td><\/tr><tr><td>ἐν πνεύματι πραΰτητος<\/td><td>en pneumati praütētos<\/td><td>用溫柔的靈<\/td><td>5:23 聖靈果子裡的「溫柔」<\/td><\/tr><tr><td>σκοπῶν σεαυτόν<\/td><td>skopōn seauton<\/td><td>留意你自己<\/td><td>從「你們」忽然轉成單數「你」<\/td><\/tr><\/table>","gram":"<p><strong>第 6 章的第一個字，是一聲稱呼。<\/strong><\/p><p>Ἀδελφοί（Adelphoi） 放在句首。前一節剛說完「不要貪圖虛名，彼此惹氣，互相嫉妒」（5:26），保羅轉身先叫一聲「弟兄們」。條件句用 ἐὰν καὶ（ean kai），「即使、萬一」：是假設，卻是隨時會發生的假設。προλημφθῇ（prolēmphthē） 是被動語態，字面是「被搶先抓住」。學者有兩讀：一讀是「被人當場撞見」，重點在被發現；一讀是「被過犯搶先一步抓住、措手不及」，重點在不是蓄意。多數解經家取後者，和合本「偶然被過犯所勝」也是這個方向。παραπτώματι（paraptōmati） 是失足、走偏一步，和 5:21 以此為生活方式的 οἱ τὰ τοιαῦτα πράσσοντες（hoi ta toiauta prassontes） 不是同一種人。<\/p><p>主要動詞 καταρτίζετε（katartizete） 是現在命令式。這個字在福音書裡用在漁夫補網（太 4:21 καταρτίζοντας τὰ δίκτυα（katartizontas ta diktya）），在希臘醫書裡用在接骨，把脫臼的骨頭復位。它不是審判，也不是開除，是修補——把破的地方補好，讓網可以再下水。<\/p><blockquote><p>句子後半忽然從複數換成單數：σκοπῶν σεαυτόν（skopōn seauton），μὴ καὶ σὺ πειρασθῇς（mē kai sy peirasthēs）。前面說「你們屬靈的人」，這裡說「你自己要留意，免得連你也……」。挽回是群體的事，警醒卻是每個人自己的事。ἐν πνεύματι πραΰτητος（en pneumati praütētos） 的「溫柔」就是 5:23 聖靈果子裡的 πραΰτης（praütēs）；πνεύματι（pneumati） 可以指人的心靈，也可以指聖靈，學者多認為兩者在這裡重疊：一顆被聖靈塑造的溫柔的心。<\/p><\/blockquote>","exp":"<p>「弟兄們，若有人偶然被過犯所勝，你們屬靈的人就當用溫柔的心把他挽回過來」（6:1）。第 5 章剛講完聖靈的果子，第 6 章第一個情境就是有人跌倒。這個次序很誠實：結果子的教會，仍然會有人跌倒；分別不在有沒有人跌倒，在跌倒的人被怎樣對待。<\/p><p>「屬靈的人」不是一個階級。加拉太教會裡，大概正有人以為自己比別人屬靈——守了日子、受了割禮，或者反過來，以自己「不守」為傲；5:26 的「貪圖虛名」就在前一節。保羅說的屬靈的人，是 5:25「靠聖靈行事」的人，他的記號正好是溫柔。一個人看見弟兄跌倒，第一個反應若是興奮、傳話、定罪，他就證明了自己不是這裡說的屬靈的人。<\/p><p>挽回的意思是補網、接骨。接骨的手要穩，也要輕：太重會再傷一次，太輕骨頭接不回去。所以挽回不是假裝沒事——網破了要補，骨頭斷了要接，罪要被指出來；但目的始終是讓這個人重新站起來，不是讓教會出一口氣。哥林多後書講義立場四分清楚了四件事：饒恕、和好、信任、職分。挽回一個人回到神的家，不等於立刻把他放回原來的職位；保護受傷的人，也不等於不肯挽回。<\/p><p>最後一句是寫給挽回者的：「又當自己小心，恐怕也被引誘」（6:1）。站在旁邊看別人跌倒的人，最容易忘記自己也是泥做的。這也是第 5 章紅線的出口：5:21 那些「行這樣事的人」是以此為生活方式；6:1 告訴我們，偶然被勝的人有一條回來的路，而那條路是一家人一起鋪的。<\/p>"},{"a":2,"z":2,"star":3,"grk":"<p lang=\"grc\">ἀλλήλων τὰ βάρη βαστάζετε, καὶ οὕτως ἀναπληρώσετε τὸν νόμον τοῦ Χριστοῦ.<\/p>","lit":"<p>彼此的重擔你們要背，並且這樣，你們就要填滿基督的律法。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἀλλήλων<\/td><td>allēlōn<\/td><td>彼此<\/td><td>放在句首強調：不是一個人扛<\/td><\/tr><tr><td>τὰ βάρη<\/td><td>ta barē<\/td><td>那些重擔<\/td><td>βάρος 的複數：壓得人站不起來的重量<\/td><\/tr><tr><td>βαστάζετε<\/td><td>bastazete<\/td><td>你們要扛<\/td><td>現在命令式：持續的生活方式<\/td><\/tr><tr><td>καὶ οὕτως<\/td><td>kai houtōs<\/td><td>並且這樣<\/td><td>就是這樣，不是另外一條路<\/td><\/tr><tr><td>ἀναπληρώσετε<\/td><td>anaplērōsete<\/td><td>你們就要填滿<\/td><td>未來式；前綴 ana- 加強：填到滿<\/td><\/tr><tr><td>τὸν νόμον τοῦ Χριστοῦ<\/td><td>ton nomon tou Christou<\/td><td>基督的律法<\/td><td>追蹤 νόμος 最後一站<\/td><\/tr><\/table>","gram":"<p><strong>ἀλλήλων（allēlōn） 放在句首。<\/strong>這個字在第 5 章出現了三次：「總要用愛心互相服事」（5:13）；「若相咬相吞，只怕要彼此消滅了」（5:15）；「彼此惹氣，互相嫉妒」（5:26）。同一個「彼此」，可以用來咬，也可以用來扛。6:2 把它放回正確的位置。<\/p><p>τὰ βάρη（ta barē） 是 βάρος（baros） 的複數，指沉重、壓人的重量；耶路撒冷會議說「不將別的重擔放在你們身上」（徒 15:28），用的就是這個字。βαστάζετε（bastazete） 是現在命令式：不是一次的救急，是一種持續的生活方式。同一個動詞，約翰用在耶穌「背著自己的十字架出來」（約 19:17），原文 βαστάζων（bastazōn）。<\/p><p>καὶ οὕτως（kai houtōs） 是「並且就這樣」，接著是未來式 ἀναπληρώσετε（anaplērōsete）：「你們就要把……填滿」。前綴 ana- 加強了完全的意思：不是補一點，是填到滿。<\/p><blockquote><p>「基督的律法」是甚麼？學者大致三說：一說是基督的教訓，特別是彼此相愛的新命令（約 13:34）；一說是 5:14 那一句「愛人如己」，律法在基督裡被總結；一說是基督自己的榜樣——他擔當了我們最重的擔子。本講義三說合讀：5:14 說「全律法都包在『愛人如己』這一句話之內了」（5:14），6:2 說扛重擔就填滿了基督的律法；那位「愛我，為我捨己」（2:20）的基督，就是這條律法活出來的樣子。本卷追蹤的 νόμος（nomos） 走到這裡：律法沒有被丟掉，它在一個彼此扛擔子的群體裡被填滿。<\/p><\/blockquote>","exp":"<p>「你們各人的重擔要互相擔當，如此，就完全了基督的律法」（6:2）。這是本章在地勢圖上的第一個高點（72），也是本卷「律法」追蹤的最後一站。<\/p><p>注意這句話裡的反諷。攪擾加拉太人的人要他們守律法——受割禮、守日子，好像那才叫完全。保羅說：你們要完全律法嗎？有一條路，是那些人沒有走的——去扛別人的重擔。第 13 節他要揭穿：「他們那些受割禮的，連自己也不守律法」（6:13）。這裡已經先說了：律法真正被滿足，不在肉體的記號上，在一個人彎下腰，去扛另一個人的重量的時候。<\/p><p>重擔，原文是壓得人站不起來的重量。可能是 6:1 那個跌倒的人背著的羞愧與後果；也可能是病、失業、喪親、照顧年老的父母、一段走不出來的婚姻。這種重量，一個人扛不起來，所以保羅用命令式：要彼此扛。教會不是一群各自完美的人，是一群輪流替別人扛一角的人。<\/p><p>但這一節也最容易被講成另一個軛。「你是基督徒，就要擔當他的重擔，不可以拒絕」——對一個照顧失智父母多年、已經崩潰的人說這句話，是把 6:2 變成法利賽人那種「把難擔的重擔捆起來，擱在人的肩上」（太 23:4）的律法。原文的主詞是「彼此」：擔子是一家人輪流分的，不是壓在最肯擔的那一個人身上。照顧別人的人，自己也是「彼此」裡的一個，也需要被人扛。下一段 6:5 換了一個字，正是要守住這條界線（紅線八）。<\/p><p>這也是 2:20 落地的樣子。「他是愛我，為我捨己」（2:20）——基督扛了我最重的擔子；所以基督在我裡面活，最先看得見的地方，不是我的屬靈經驗，是我願不願意替別人扛一角。<\/p>"},{"a":3,"z":5,"star":2,"grk":"<p lang=\"grc\">εἰ γὰρ δοκεῖ τις εἶναί τι μηδὲν ὤν, φρεναπατᾷ ἑαυτόν ·<\/p><p lang=\"grc\">τὸ δὲ ἔργον ἑαυτοῦ δοκιμαζέτω ἕκαστος, καὶ τότε εἰς ἑαυτὸν μόνον τὸ καύχημα ἕξει καὶ οὐκ εἰς τὸν ἕτερον,<\/p><p lang=\"grc\">ἕκαστος γὰρ τὸ ἴδιον φορτίον βαστάσει.<\/p>","lit":"<p>因為若有人以為自己是個甚麼，其實甚麼都不是，他就是欺騙自己的心思。<\/p><p>但各人要察驗他自己的工作，那時他的誇口就只對著自己，而不對著另一個人；<\/p><p>因為各人要背自己的擔子。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>δοκεῖ τις εἶναί τι μηδὲν ὤν<\/td><td>dokei tis einai ti mēden ōn<\/td><td>有人以為自己是個甚麼，其實甚麼都不是<\/td><td>τι 對 μηδὲν<\/td><\/tr><tr><td>φρεναπατᾷ ἑαυτόν<\/td><td>phrenapata heauton<\/td><td>騙了自己的心思<\/td><td>新約只此一次<\/td><\/tr><tr><td>τὸ ἔργον ἑαυτοῦ δοκιμαζέτω<\/td><td>to ergon heautou dokimazetō<\/td><td>要察驗自己的工作<\/td><td>δοκιμάζω：驗金子的字<\/td><\/tr><tr><td>τὸ καύχημα<\/td><td>to kauchēma<\/td><td>誇口的根據<\/td><td>預告 6:13--14 的誇口<\/td><\/tr><tr><td>τὸ ἴδιον φορτίον<\/td><td>to idion phortion<\/td><td>自己的背包<\/td><td>旅人、士兵自己背的行囊<\/td><\/tr><tr><td>βαστάσει<\/td><td>bastasei<\/td><td>他要背<\/td><td>未來式；與 6:2 同一個動詞<\/td><\/tr><\/table>","gram":"<p><strong>6:2 與 6:5 用同一個動詞，卻是兩個不同的名詞。<\/strong><\/p><p>6:2 是 ἀλλήλων τὰ βάρη βαστάζετε（allēlōn ta barē bastazete），6:5 是 ἕκαστος γὰρ τὸ ἴδιον φορτίον βαστάσει（hekastos gar to idion phortion bastasei）。動詞都是 βαστάζω（bastazō），名詞卻從 βάρος（baros） 換成 φορτίον（phortion）。φορτίον（phortion） 是一般的擔子、貨物，常指旅人或士兵自己的行囊；主耶穌說「我的擔子是輕省的」（太 11:30），原文 τὸ φορτίον μου（to phortion mou），就是這個字。6:2 是現在命令式，6:5 是未來式。<\/p><p>兩節看似矛盾，其實分工清楚：βάρος（baros） 是超過一個人能扛的重量，要一起扛；φορτίον（phortion） 是每個人本分該背的那一份，要自己背。6:5 的未來式 βαστάσει（bastasei） 有兩讀：多數學者讀成末日的交帳，到主面前各人為自己的那一份交代（羅 14:12）；也有人讀成格言式的未來，指日常的本分。兩讀不衝突，本講義兩者並取。<\/p><blockquote><p>中間兩節是一組自我檢驗。第 3 節 εἰ γὰρ δοκεῖ τις εἶναί τι μηδὲν ὤν（ei gar dokei tis einai ti mēden ōn）：τι（ti） 與 μηδὲν（mēden） 對照，「以為自己是個甚麼，其實甚麼也不是」——2:6 保羅說耶路撒冷那些「有名望的」，原文 τῶν δοκούντων εἶναί τι（tōn dokountōn einai ti），正是同一組字。φρεναπατᾷ（phrenapata） 新約只出現在這裡：「把自己的心思騙了」。第 4 節 δοκιμαζέτω（dokimazetō） 是驗金子的字：不是和別人比，是把自己的工作單獨放進火裡看。<\/p><\/blockquote>","exp":"<p>「人若無有，自己還以為有，就是自欺了」（6:3）。這一節接在扛重擔之後，正好說中人不肯扛的原因：一個人以為自己了不起，就不會彎腰；或者，他彎腰扛別人，只是為了證明自己了不起。兩種都是自欺。<\/p><p>保羅開的藥方是第 4 節：「各人應當察驗自己的行為；這樣，他所誇的就專在自己，不在別人了」（6:4）。不是拿自己和跌倒的人比——「至少我沒有像他那樣」；是拿自己的工作，單獨放在神面前驗。和別人比出來的誇口，要靠別人的失敗才站得住；6:13 那些人要藉著加拉太人的肉體誇口，正是這種誇口最極端的樣子。<\/p><p>然後是第 5 節：「因為各人必擔當自己的擔子」（6:5）。這裡的擔子是背包，不是重擔。行軍的時候，每個兵背自己的行囊，沒有人替你背；但若有人倒下了，全隊停下來一起抬他。兩種情形都是愛，也都是界線。<\/p><p>這一組字救了兩種人。一種是把 6:2 講成無限付出的人：他替所有人背背包，最後自己倒下。保羅說，別人的背包不是你的——成年人自己的本分、自己的選擇、自己的悔改，你不能替他背，也不該替他背。另一種是拿 6:5 當冷漠藉口的人：「各人擔當自己的擔子，他的事不要管。」保羅說，壓垮人的重擔不是背包，你不扛，就是不肯完全基督的律法。分辨的問題只有一個：這個重量，是他本分該背、背得起的，還是已經壓得他站不起來？照顧者也要問自己同一個問題（紅線八）。<\/p>"},{"a":6,"z":6,"star":1,"grk":"<p lang=\"grc\">Κοινωνείτω δὲ ὁ κατηχούμενος τὸν λόγον τῷ κατηχοῦντι ἐν πᾶσιν ἀγαθοῖς.<\/p>","lit":"<p>而那在道上受教導的，要在一切美好的事上與那教導他的人有分。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Κοινωνείτω<\/td><td>Koinōneitō<\/td><td>要與……有分<\/td><td>κοινωνία 的動詞；不是「付費」<\/td><\/tr><tr><td>ὁ κατηχούμενος<\/td><td>ho katēchoumenos<\/td><td>那受教導的<\/td><td>英文 catechism 的字根<\/td><\/tr><tr><td>τῷ κατηχοῦντι<\/td><td>tō katēchounti<\/td><td>那教導的人<\/td><td>同一個動詞，被動對主動<\/td><\/tr><tr><td>ἐν πᾶσιν ἀγαθοῖς<\/td><td>en pasin agathois<\/td><td>在一切美好的事上<\/td><td>不只限於金錢<\/td><\/tr><\/table>","gram":"<p><strong>Κοινωνείτω δὲ（Koinōneitō de） 用 δέ（de） 接在 6:5 之後。<\/strong>各人要背自己的背包，但有一種擔子要分——教導者的生計。動詞 κοινωνέω（koinōneō） 是 κοινωνία（koinōnia） 的動詞形，現在命令式，意思是「與……共享、有分」。被動分詞 ὁ κατηχούμενος（ho katēchoumenos） 與主動分詞 τῷ κατηχοῦντι（tō katēchounti） 是同一個動詞 κατηχέω（katēcheō） 的兩面；英文 catechism（要理問答）就從這個字來。這一節說明早期教會已經有固定教導信徒的人。<\/p><p>ἐν πᾶσιν ἀγαθοῖς（en pasin agathois） 的範圍有兩讀：一讀是物質的供給，和合本「一切需用的」取這個方向，可對照林前 9:14 與羅 15:27；一讀是更廣的「一切美善」，師生在屬靈的好處上彼此分享，像羅 1:11–12 那樣。本講義以第一讀為主，因為下一節馬上講撒種，而保羅在別處用撒種講錢（林後 9:6）；但 κοινωνέω（koinōneō） 這個動詞提醒：這是相交，不是交易。<\/p>","exp":"<p>「在道理上受教的，當把一切需用的供給施教的人」（6:6）。這一節夾在重擔與撒種中間，看似換了話題，其實一脈相承：教導者也是「彼此」裡的一個，他的生計是會眾一起分的擔子。<\/p><p>保羅自己常常不收供養（林後 11:7–9），但他從不說別人不該收；他在哥林多前書說，主命定傳福音的靠著福音養生（林前 9:14）。在加拉太的處境裡，這一節還多一層意思：攪擾的人帶著另一套教導來了，保羅要加拉太人繼續扶持那些教他們真福音的人。<\/p><p>動詞是「有分」，不是「付費」。供給施教的人，不是向他買服務，是和他同擔福音的事；教導的人也不是在收學費，是把自己有的與人分享。這給今天兩邊各一條界線：會眾不可把傳道人的需要當成「各人必擔當自己的擔子」（6:5）而撒手不管；傳道人也不可把這一節當成向人要錢的槓桿——下一節的撒種一被講成奉獻投資，就正好落進這個陷阱（見本章議題頁）。<\/p>"},{"a":7,"z":8,"star":3,"grk":"<p lang=\"grc\">μὴ πλανᾶσθε, θεὸς οὐ μυκτηρίζεται· ὃ γὰρ ἐὰν σπείρῃ ἄνθρωπος, τοῦτο καὶ θερίσει·<\/p><p lang=\"grc\">ὅτι ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ ἐκ τῆς σαρκὸς θερίσει φθοράν, ὁ δὲ σπείρων εἰς τὸ πνεῦμα ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον.<\/p>","lit":"<p>不要被迷惑，神是不被嗤之以鼻的；因為人無論種甚麼，這個他也要收；<\/p><p>因為那種到自己肉體裡的，要從肉體收朽壞；而那種到聖靈裡的，要從聖靈收永遠的生命。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>μὴ πλανᾶσθε<\/td><td>mē planasthe<\/td><td>不要被迷惑<\/td><td>現在命令式：別讓自己被帶偏<\/td><\/tr><tr><td>θεὸς οὐ μυκτηρίζεται<\/td><td>theos ou myktērizetai<\/td><td>神是不被嗤之以鼻的<\/td><td>μυκτηρίζω：皺鼻子嘲弄；新約只此一次<\/td><\/tr><tr><td>ὃ γὰρ ἐὰν σπείρῃ ἄνθρωπος<\/td><td>ho gar ean speirē anthrōpos<\/td><td>因為人無論種甚麼<\/td><td>農夫都懂的格言<\/td><\/tr><tr><td>τοῦτο καὶ θερίσει<\/td><td>touto kai therisei<\/td><td>這個他也要收<\/td><td>種與收是同一類<\/td><\/tr><tr><td>εἰς τὴν σάρκα ἑαυτοῦ<\/td><td>eis tēn sarka heautou<\/td><td>種到自己的肉體裡<\/td><td>問題不在種子，在田地<\/td><\/tr><tr><td>φθοράν<\/td><td>phthoran<\/td><td>朽壞<\/td><td>慢慢爛掉，不是一次報應<\/td><\/tr><tr><td>εἰς τὸ πνεῦμα<\/td><td>eis to pneuma<\/td><td>種到聖靈裡<\/td><td>5:25「靠聖靈行事」<\/td><\/tr><tr><td>ζωὴν αἰώνιον<\/td><td>zōēn aiōnion<\/td><td>永遠的生命<\/td><td>收成是生命，不是利息<\/td><\/tr><\/table>","gram":"<p><strong>μὴ πλανᾶσθε（mē planasthe） 是警告的開關。<\/strong>接著是 θεὸς οὐ μυκτηρίζεται（theos ou myktērizetai）：μυκτηρίζω（myktērizō） 從「鼻孔」一字來，是皺鼻子、嗤之以鼻、把人當傻瓜耍。人可以哄騙人，也可以哄騙自己——6:3 剛說過「自欺」；但人不能把神當傻瓜。<\/p><p>ὃ γὰρ ἐὰν σπείρῃ ἄνθρωπος（ho gar ean speirē anthrōpos） 與 τοῦτο καὶ θερίσει（touto kai therisei） 是一句古代農夫都懂的格言；先知也說「他們所種的是風，所收的是暴風」（何 8:7）。保羅用 γάρ（gar） 把格言接在「神是輕慢不得的」後面：神不受愚弄，因為種與收的道理是他定的。<\/p><blockquote><p>第 8 節用 ὅτι（hoti） 解釋格言，排出一組完全對稱的平行句：ὁ σπείρων εἰς τὴν σάρκα ἑαυτοῦ（ho speirōn eis tēn sarka heautou） 對 ὁ δὲ σπείρων εἰς τὸ πνεῦμα（ho de speirōn eis to pneuma）；ἐκ τῆς σαρκὸς θερίσει φθοράν（ek tēs sarkos therisei phthoran） 對 ἐκ τοῦ πνεύματος θερίσει ζωὴν αἰώνιον（ek tou pneumatos therisei zōēn aiōnion）。關鍵在介系詞 εἰς（eis）：問題不是種甚麼種子，是種進哪一塊田。σπείρων（speirōn） 是現在分詞，指一直在撒種的人——一種生活的方向，不是某一筆單獨的行為。這是本卷 σάρξ（sarx）／πνεῦμα（pneuma） 追蹤在第 6 章的第一站，直接接續 5:16–25 的肉體與聖靈。和合本把 σάρ
