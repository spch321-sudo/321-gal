。問題是：聖經沒有明說的事，基督徒可以自由決定嗎？自由的界線由誰來畫？<\/p>"],["規條說（為了安全，教會要畫清楚的線）","","<p>認為人心容易放縱，自由很快就會變成藉口；所以教會應該在灰色地帶訂出清楚的規矩，例如完全不喝酒、不參與某些娛樂，讓信徒有一條安全的界線，也保護軟弱的人。<\/p><p><strong>難處：<\/strong>這正是本章前半要拆掉的東西：人訂的規矩一旦成了「真基督徒」的標準，就是一副新的軛；而且規條管得到手，管不到心——一個守滿規矩卻冷酷苛刻的人，同樣活在肉體裡（5:19--21）。<\/p>"],["個人自由說（聖經沒有禁止的，旁人不該干涉）","","<p>認為凡聖經沒有明文禁止的事，都是個人良心的自由，教會不應該介入，別人也不應該論斷；強調「不在律法以下」，反對任何形式的屬靈控制。<\/p><p><strong>難處：<\/strong>這個說法守住了自由，卻漏掉了 5:13 的後半句：自由的方向是「彼此」。保羅在哥林多也說：「只是你們要謹慎，恐怕你們這自由竟成了那軟弱人的絆腳石。」（林前 8:9）只問「我可不可以」，不問「這對弟兄有沒有益處」，自由就成了肉體的據點。<\/p>"],["愛的方向說（自由是為了服事，用三個問題分辨）","","<p>認為基督徒的自由是真的，教會不該加上得救或被接納的條件；但自由有方向，用三個問題分辨：一、這件事把人帶近基督，還是加在基督後面？二、它是用愛服事人，還是給肉體開門？三、我說「聖靈引導」，是真的跟著聖靈，還是私慾的理由？<\/p><p><strong>難處：<\/strong>這三個問題需要智慧與群體的察驗，不像規條那樣一目了然；同一件事，在不同的人、不同的處境裡，答案可能不一樣，教會要學會容讓。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採愛的方向說。<\/strong>自由有兩個敵人：一個叫你回去背軛（5:1），一個叫你把自由交給肉體（5:13）。兩個方向相反，結局一樣，都讓人重新作奴僕。出路不是更多的規條，也不是各行其是，而是彼此作愛的奴僕。<\/p><p>灰色地帶的事，教會不訂成進門的條件；同時，信徒要問的不只是「我可不可以」，也要問「誰會因此跌倒、誰會因此得益處」。<\/p>"]],"con":[],"say":"本講義的立場：基督徒的自由是真的，不加任何進門的條件；但自由的方向是用愛彼此服事，不給肉體開門。本講義的全卷立場見議題「基督徒的自由：在律法主義與放縱之間」。","care":"有些人在很嚴格的教會長大，曾經因為一件小事被當眾責備，到今天聽見「界線」兩個字就緊張；也有人剛從某種成癮或放縱的生活裡走出來，需要清楚的界線保護自己。講台上不要嘲笑任何一邊。會後陪伴時，先分辨對方是需要被釋放，還是需要被保護；對正在戒除某種習慣的人，不要說「反正你自由了」。"},{"id":"ISS05_5","t":"5:16--17「情慾和聖靈相爭」——基督徒裡面有兩個本性嗎？","r":"5:16--18；羅7:19；羅7:24--25；羅6:6","ch":[5],"why":"許多信徒的經驗是：信主以後，掙扎沒有消失，反而更清楚了。於是有人說「我裡面有一隻黑狗、一隻白狗」，也有人拿「那是我的肉體做的，不是我」替自己開脫。基督徒裡面到底有幾個「我」？這一題關乎人怎樣面對自己的掙扎，而不絕望，也不推卸。","pos":[["【一】經文問的是甚麼","","<p>「因為情慾和聖靈相爭，聖靈和情慾相爭，這兩個是彼此相敵，使你們不能做所願意做的。」（5:17）<strong>ἀντίκειται<\/strong>（antikeitai）是兩軍對陣；<strong>ἵνα μὴ ἃ ἐὰν θέλητε ταῦτα ποιῆτε<\/strong>（hina mē ha ean thelēte tauta poiēte）的意思學者有不同讀法。問題是：這是兩個本性在一個人裡面打仗，還是別的意思？它和羅馬書第 7 章是同一件事嗎？<\/p>"],["兩性說（新本性與舊本性並存）","","<p>認為信徒重生後得著一個新本性，舊本性卻仍然存在，兩者在人裡面交戰；改革宗傳統常說信徒「同時是義人，又是罪人」。羅馬書第 7 章「我所願意的善，我反不做」（羅 7:19）就是重生之人的經驗。這個說法很貼近許多人的掙扎。<\/p><p><strong>難處：<\/strong>講得太粗，會變成兩個「我」，人就可以說「那是我的舊本性做的」；也容易讓人以為兩邊勢均力敵，看不見第 16 節「就不放縱肉體的情慾了」那個雙重否定的應許。<\/p>"],["兩個時代說（新舊時代的力量在一個人身上交會）","","<p>許多新約學者認為，保羅的「肉體」與「聖靈」不是人裡面的兩個零件，而是兩個時代、兩種權勢：舊的世代是肉體與律法，新的世代是聖靈；信徒已經屬於新時代，卻仍活在舊時代尚未過去的世界裡，所以有相爭。我還是一個我，只是站在兩個時代交界的地方。<\/p><p><strong>難處：<\/strong>這個讀法較抽象，一般信徒不容易把它和每天的掙扎連起來；若只講時代，不講個人的順服，也可能讓人覺得掙扎與自己的選擇無關。<\/p>"],["勝利說（真正屬靈的人不再有掙扎）","","<p>有些聖潔運動的傳統認為，信徒經歷第二次的祝福或完全的奉獻之後，可以脫離這種相爭，過一種不再被肉體拉扯的生活；仍有掙扎的人，是還沒有完全降服。<\/p><p><strong>難處：<\/strong>保羅這裡是對所有加拉太信徒說的，沒有把掙扎講成屬靈不夠的記號；這個說法也很容易讓仍在掙扎的人羞愧、隱藏，以為只有自己還沒有過關。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採兩個時代說為主，同時保留兩性說的牧養提醒。<\/strong>經文把第 17 節夾在第 16、18 節中間：掙扎是真的，結局不是平手；勝負不在人裡面哪一邊比較強，而在跟隨誰。<\/p><p>無論怎樣描述，有兩件事要守住：一、不可以用「那是我的肉體」推卸責任；二、不可以因為還在掙扎，就懷疑自己不是神的兒女。羅馬書第 7 章是不是重生的人，各家判斷不同，不必在講台上定案。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。你感到相爭，正表示聖靈在你裡面；死人是不會掙扎的。保羅自己在羅馬書也喊過「我真是苦啊！誰能救我脫離這取死的身體呢？」（羅 7:24），下一句就是感謝。<\/p><p>不必先把自己裡面的構造研究清楚，才開始順著聖靈走。今天就跟上一步，比弄懂幾個本性更要緊。<\/p>"]],"con":[],"say":"本講義的立場：情慾和聖靈的相爭是真的，但不是勢均力敵的僵局；它是新舊兩個時代在信徒身上交會，勝負在於跟隨誰。不可用「那是我的肉體」推卸，也不可因掙扎懷疑自己的身分。","care":"會眾席上可能有人長年和某種習慣、成癮或強迫的念頭掙扎，偷偷覺得自己是最差的基督徒。講台上不要說「真正屬靈的人不會有這種掙扎」。會後若有人說出他的掙扎，先謝謝他願意說，不追問細節，陪他找一兩位可以同行的人；若涉及成癮或身心狀況，鼓勵他也尋求專業協助。"},{"id":"ISS05_6","t":"5:21「行這樣事的人必不能承受神的國」——基督徒犯了這些罪就不能得救嗎？","r":"5:19--21；林前6:11；6:1；約壹1:9","ch":[5],"why":"清單裡有嫉妒、惱怒、紛爭、醉酒，幾乎沒有一個基督徒敢說自己從來沒有過其中一樣。那麼「必不能承受神的國」是說給誰聽的？講得太輕，等於刪掉這一節；講得太重，會讓每一個誠實的人都懷疑自己的得救。這一題關乎講台怎樣同時擋住放縱、又不恐嚇。","pos":[["【一】經文問的是甚麼","","<p>「我從前告訴你們，現在又告訴你們，行這樣事的人必不能承受神的國。」（5:21）<strong>οἱ τὰ τοιαῦτα πράσσοντες<\/strong>（hoi ta toiauta prassontes）是現在分詞，描寫持續的、成為身分的生活方式；「承受」接回 4:7 的後嗣語言。問題是：這一句說的是基督徒偶然的跌倒，還是另一種生活方式？一個信了主卻長期活在其中的人，處境是甚麼？<\/p>"],["生活方式說（指以此為生活、不悔改的人）","","<p>著重現在分詞：這一句描寫的是以這些事為生活方式、安然住在其中而不悔改的人，這樣的生活是神國以外的樣子。哥林多前書列了相似的清單之後說：「你們中間也有人從前是這樣」（林前 6:11），接著就說他們已經洗淨、成聖、稱義了——清單描寫的正是福音把人救出來的地方。<\/p><p><strong>難處：<\/strong>「生活方式」與「偶然跌倒」的界線在哪裡，經文沒有給一個數字；這個說法若被濫用，也可能讓人說「我只是偶爾」，替長期的罪找藉口。<\/p>"],["證據說（加爾文派：持續活在其中顯明未曾真正得救）","","<p>認為真正重生的人必有生命的改變；一個自稱信主、卻持續以這些事為樂而不悔改的人，顯明他從來沒有真正歸入基督。這一節是對整個教會的警告，叫人察驗自己的信心是不是真的。<\/p><p><strong>難處：<\/strong>這個說法容易讓人往內看、拿自己的表現量自己有沒有得救；對一位正在掙扎、心裡痛悔的人，若講成「你可能根本沒有得救」，就是在傷口上加鹽。<\/p>"],["警告說（阿民念派：真信徒持續行這些事可能失去產業）","","<p>認為這是對真信徒的真實警告：一個曾經信主的人，若持續、刻意地回到肉體的生活而不回頭，可能失去承受神國的產業。警告的嚴肅正是為了叫人及早回頭。<\/p><p><strong>難處：<\/strong>講不好，會讓敏感的人以為發一次脾氣、嫉妒一次就失去了救恩，與 6:1「偶然被過犯所勝」的人有回來的路這一點不容易調和。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義以生活方式說為解經的判斷，對兩派的神學解釋並陳。<\/strong>這一句不可刪去，因為它擋住放縱；也不可講成恐嚇，因為它說的是以此為生活方式的人，不是偶然跌倒的人。<\/p><p>得救的條件是信靠基督，生命的改變是得救的果子，這兩件事不可倒過來。看見這張清單而心裡發痛的人，正是聖靈還在他裡面動工的記號；回來的路一直在：「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪」（約壹 1:9）。<\/p>"]],"con":[],"say":"本講義的立場：5:21 說的是以這些事為生活方式、安然住在其中的人，不是偶然跌倒、心裡痛悔的人；它擋住放縱，卻不是恐嚇。本講義的全卷立場見議題「律法、稱義與『因信』」。","care":"讀到這張清單，有些人會想起自己過去的醉酒、外遇或某種長期的罪，覺得自己被判了死刑；也有人的家人還活在其中，他會害怕「我的家人是不是沒救了」。講台上不點名、不舉會眾的例子。會後陪伴時，先聽他心裡的痛，不追問細節，陪他一起讀 6:1 與約壹 1:9；不要替任何人宣判他能不能得救。"},{"id":"ISS05_7","t":"5:22--23 聖靈的果子為甚麼是單數？果子與恩賜哪一個重要？","r":"5:22--23；5:19；林前12:31；林前13:1","ch":[5],"why":"許多教會把聖靈的果子教成九項品格課程，一個月操練一項；也有教會很看重講道、醫治、方言、帶領這些恩賜，用恩賜來衡量一個人屬不屬靈。原文的單數，正好碰到這兩件事。對本團契來說，這也是 920 的「9」怎樣理解的根本。","pos":[["【一】經文問的是甚麼","","<p>「聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。」（5:22--23）<strong>Ὁ δὲ καρπὸς τοῦ πνεύματός ἐστιν<\/strong>（Ho de karpos tou pneumatos estin）的主詞與動詞都是單數，和 5:19 複數的 <strong>τὰ ἔργα<\/strong>（ta erga）相對。問題有兩個：單數是刻意的嗎？果子與哥林多前書第 12 章的恩賜，在教會裡哪一個比較重要？<\/p>"],["集合名詞說（單數只是習慣用法，可以分開操練）","","<p>認為 καρπός（karpos）在希臘文裡常作集合名詞用，單數不一定有特別的神學意義；九項品格可以分開教導、分開操練，教會設計「每月一個果子」的課程並沒有違背經文。<\/p><p><strong>難處：<\/strong>保羅在同一段裡刻意用複數的「作為」對單數的「果子」，對照很明顯；把九項拆開操練，很容易變成自我改進的功課表，正好掉回本章要拆掉的律法主義。<\/p>"],["一個生命說（一個果子，九種滋味）","","<p>多數註釋家認為單數是刻意的：肉體的作為是一件一件做出來的，聖靈的果子是一棵樹活著自然長出來的。九項是一個果子的九種滋味，彼此相連：仁愛裡有忍耐，溫柔裡有信實；不能只挑幾樣，也不能用一樣頂替別的。那個果子，就是基督在人裡面活著的樣子。<\/p><p><strong>難處：<\/strong>講得不好，會讓人以為果子全是被動的、自己甚麼都不必做；經文同時有「順著聖靈而行」（5:16）與「靠聖靈行事」（5:25）的命令，人的跟隨是真實的。<\/p>"],["恩賜優先說（恩賜建造教會，果子是個人的事）","","<p>有些教會認為，恩賜是神給教會的能力，直接帶來果效與增長，所以選立同工、評估服事，主要看恩賜；品格雖然重要，卻是個人靈修的範圍。<\/p><p><strong>難處：<\/strong>保羅在哥林多前書談完恩賜之後說「我現今把最妙的道指示你們」（林前 12:31），接著是愛的篇章：「我若能說萬人的方言，並天使的話語，卻沒有愛，我就成了鳴的鑼，響的鈸一般。」（林前 13:1）有恩賜沒有果子的領袖，往往是教會最深的傷口。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採一個生命說。<\/strong>單數的果子是 920 最要緊的原文提醒：操練活出無己的 0，結出聖靈的 9——這個 9 不是九項功課，是一個生命，就是第 2 章「基督在我裡面活著」長出來的樣子。<\/p><p>至於果子與恩賜：兩者都是聖靈給的，不必對立；但衡量一個人的屬靈與選立同工，先看果子，再看恩賜。恩賜說明聖靈藉他做了甚麼，果子說明聖靈在他裡面成了甚麼。<\/p>"]],"con":[],"say":"本講義的立場：5:22 的果子是刻意的單數，是一個生命的九種滋味，不是九項功課；920 的「9」就是這個生命。果子與恩賜都出於聖靈，衡量屬靈先看果子。","care":"有些同工恩賜很強、服事很有果效，卻在家裡或同工之間留下傷口，身邊的人不敢說；也有人自覺沒有任何恩賜，覺得自己在教會裡可有可無。講台上不點名任何人。會後陪伴時，對前者要溫和而清楚，對後者要讓他知道：恩慈、忍耐、信實是聖靈在他身上的工作，在神眼中一點也不小。"},{"id":"ISS05_8","t":"5:20「邪術」——求籤、算命、改運、看風水，基督徒怎樣分辨？","r":"5:20；申18:10；4:8--9","ch":[5],"why":"華人信徒的生活裡，處處遇到求籤、看日子、算命、風水、護身符、民俗療法；長輩送來的平安符要不要收，新居要不要看方位，孩子取名要不要算筆畫。有人一概定罪，傷了家人；有人一概放任，把信靠交給了別的力量。這一題關乎信徒在家族與文化裡怎樣分辨，又不失去愛。","pos":[["【一】經文問的是甚麼","","<p>保羅把「邪術」列在肉體的作為裡，和拜偶像放在一起。原文 <strong>φαρμακεία<\/strong>（pharmakeia）和藥物、符咒、巫術有關，在當時指用藥物或咒語操控人事與命運。舊約也說：「不可有占卜的、觀兆的、用法術的、行邪術的」（申 18:10）。問題是：今天華人處境裡的各種習俗，哪些落在這裡，哪些只是文化？<\/p>"],["全面拒絕說（凡與民間信仰有關的都要斷絕）","","<p>認為這些習俗都和民間信仰、鬼神觀念連在一起，難以切割；為了保守信心、也為了清楚的見證，基督徒應該一概拒絕，包括看日子、某些節慶的習俗與長輩送的護身符。<\/p><p><strong>難處：<\/strong>這個說法立場清楚，卻容易把文化與信仰混為一談，例如團圓、追思、敬重長輩也一起丟掉，讓家人覺得信了耶穌就不認祖宗、不要家；也可能把信徒帶進另一種恐懼。<\/p>"],["文化寬容說（多半只是傳統，不必太認真）","","<p>認為今天多數人看風水、算命、拿護身符，只是習慣或心理安慰，並不真的相信背後的神明；基督徒不必太緊張，可以隨俗，以免和家人起衝突。<\/p><p><strong>難處：<\/strong>保羅提醒加拉太人，他們從前是「給那些本來不是神的作奴僕」（4:8）；把未來交給卦象、把平安交給符咒，問題不在於信得多認真，而在於信靠轉向了誰。一概放任，等於在基督之外再加上一個保險。<\/p>"],["分辨信靠說（不看形式，看把信靠交給誰）","","<p>認為分辨的關鍵不是日子或物件本身，而是信靠誰：凡是向神明或命運求問、求保佑、改運的，就是把信靠交給另一個力量，要溫和而堅定地不參與；凡是表達親情、追思、團圓、敬重的，可以保留，甚至用基督徒的方式活得更好。<\/p><p><strong>難處：<\/strong>這需要一件一件分辨，不同家庭與地區的習俗也不一樣；信徒需要群體陪他想清楚，而不是自己一個人面對長輩的壓力。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採分辨信靠說。<\/strong>求籤、算命、擇日看時辰、看風水改運、靠符咒保平安，是「給那些本來不是神的作奴僕」；春節團圓、清明追思、敬重長輩，是可以保留的文化。<\/p><p>不一概妖魔化，也不一概放任；基督徒的平安不是來自方位與日子，而是來自那位釋放我們的主。<\/p>"]],"con":[],"say":"本講義的立場：分辨的關鍵不是日子或物件，而是信靠誰；求問、求保佑、改運的不參與，表達親情與追思的可以保留。本講義的全卷立場見議題「基督徒的自由：在律法主義與放縱之間」。","care":"剛信主的人常常夾在家人中間：媽媽替他求了平安符，奶奶要他新婚看日子。講台上不要嘲笑長輩的習俗，也不要叫人當面撕掉家人的心意。陪伴時，幫他想出一句既尊重又清楚的話，例如謝謝家人的關心，再說明自己把平安交給耶穌；若家中因此起衝突，先陪他處理關係，不催他立刻表態。"},{"id":"ISS05_9","t":"5:24「同釘在十字架上」——基督徒要壓抑自己的感受嗎？","r":"5:24；2:20；約11:35；4:19--20","ch":[5],"why":"不少信徒從小聽到「基督徒不可以生氣」「要把自己釘死」，於是把憤怒、委屈、悲傷都吞下去，以為那就是屬靈；有人在受傷害的關係裡也被這樣勸：你要捨己、要無己。這一節講不好，會把人推進更深的傷害，也與 2:20 的本意相反。","pos":[["【一】經文問的是甚麼","","<p>「凡屬基督耶穌的人，是已經把肉體連肉體的邪情私慾同釘在十字架上了。」（5:24）<strong>ἐσταύρωσαν<\/strong>（estaurōsan）是不定過去式主動，指已經作出的決定；<strong>τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις<\/strong>（tois pathēmasin kai tais epithymiais）指失序、轄制人的激情與私慾。問題是：被釘的是甚麼？基督徒的情感、渴望、說不的能力，也要一起釘死嗎？<\/p>"],["克制說（情感本身是危險的，要盡量壓下）","","<p>有些敬虔傳統認為，情感容易帶人犯罪，成熟的基督徒應該控制、壓抑自己的感受，不讓憤怒、悲傷、慾望表現出來；「同釘十字架」就是每天把這些感受釘死，越不動情越屬靈。<\/p><p><strong>難處：<\/strong>主耶穌會哭，經上說「耶穌哭了」（約 11:35）；他也會發怒、會憂愁。保羅在這封信裡也希奇、心裡作難、為加拉太人「再受生產之苦」（4:19）。把情感本身當作肉體，等於把基督的人性也當作罪。<\/p>"],["每日釘死說（基督徒要天天把自己釘上十字架）","","<p>認為「同釘」是每天的屬靈操練，信徒要每天努力治死自己，用更多的自省、禁慾與自責對付肉體。<\/p><p><strong>難處：<\/strong>5:24 是不定過去式，指信主歸入基督那一刻已經作出的決定；2:20 的「同釘」是完成式被動，是神作成的。天天治死罪的操練有它的地位（羅 8:13），但把它講成每天重新處決自己，會把恩典變成另一副軛，也讓人長期活在自我厭棄裡。<\/p>"],["換主人說（被釘的是私慾的王權，不是人的情感）","","<p>認為被釘的是失序的激情與私慾，是肉體作主的那個王權；人的情感、渴望與判斷都還在，只是不再坐在王位上。屬基督的人仍然會傷心、會生氣、會說「不」，不同的是，這些感受被帶到主面前，順著聖靈而行。<\/p><p><strong>難處：<\/strong>「失序」與「正常」的情感界線，需要在生活裡學著分辨；這個說法若被濫用，也可能讓人把每一種私慾都說成「正常的感受」。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採換主人說。<\/strong>第 2 章已經講過：「現在活著的不再是我，乃是基督在我裡面活著……他是愛我，為我捨己」（2:20）。不再是我，不是取消人格、壓抑感受、忍受傷害；是一個被愛到這個地步的我，換了主人。<\/p><p>所以無己不是不可以說不，也不是要人留在傷害裡；保羅在同一封信裡「當面抵擋」彼得。被釘的是私慾的王權，被留下來的，是一個被基督更新、能夠真實去愛的人。<\/p>"]],"con":[],"say":"本講義的立場：5:24 被釘的是失序的私慾與它的王權，不是人的情感；無己是換了主人，不是取消人格、壓抑感受或忍受傷害。2:20 一律連「他是愛我，為我捨己」一起讀。","care":"會眾席上可能有人正活在被控制、被傷害的關係裡，曾被勸「你要捨己、不要有自己」；也可能有人長年壓抑情緒，已經出現失眠或身體的症狀。講台上要明說：無己不是忍受傷害，也不是不可以說不。會後若有人說起自己的處境，不追問細節、不要求原諒，先確認他的安全；必要時協助他尋求專業協助。"},{"id":"ISS06_1","t":"6:1「用溫柔的心把他挽回過來」——教會怎樣挽回跌倒的人？誰是「屬靈的人」？","r":"6:1；5:25--26；太18:15--17；林後2:6--8","ch":[6],"why":"每一間教會遲早都會有人跌倒：婚外情、財務問題、上癮、說了傷人的話。教會的反應常常走兩個極端：一是公開審判、從此冷落，一是假裝沒事、誰也不提。還有一個更隱藏的問題：誰有資格去挽回？「屬靈的人」若被講成一個階級，挽回就變成上對下的懲戒。","pos":[["【一】經文問的是甚麼","","<p>「弟兄們，若有人偶然被過犯所勝，你們屬靈的人就當用溫柔的心把他挽回過來；又當自己小心，恐怕也被引誘」（6:1）。<strong>προλημφθῇ<\/strong>（prolēmphthē）是被動，「被搶先抓住」；<strong>καταρτίζετε<\/strong>（katartizete）是補網、接骨的字；最後一句忽然從「你們」換成單數的「你」。問題有兩個：挽回要怎樣做？「你們屬靈的人」指的是誰？<\/p>"],["屬靈階級說（屬靈的人是一群特別成熟的領袖）","","<p>認為「屬靈的人」指教會裡成熟的長老、牧者或屬靈領袖，挽回是他們的職責，一般信徒不宜插手；這一說的好處是保護跌倒的人，不讓他被眾人議論，也讓處理有秩序。<\/p><p><strong>難處：<\/strong>上下文剛說「我們若是靠聖靈得生，就當靠聖靈行事」（5:25），「屬靈的人」最自然的讀法是靠聖靈行事的人，不是一個職分；而且把挽回只交給領袖，容易讓挽回變成上對下的懲戒，也讓其他肢體以為「不關我的事」。<\/p>"],["反諷說（保羅在諷刺自以為屬靈的人）","","<p>有學者認為，加拉太教會裡有人自認屬靈、看不起跌倒的人，保羅故意用他們自己的稱號說：你們既然自稱屬靈，就證明給我看——用溫柔去挽回，不是用優越感去定罪。5:26「不要貪圖虛名」正好在前一節。<\/p><p><strong>難處：<\/strong>經文沒有明顯的反諷標記，保羅在 6:1 開頭用的是溫和的「弟兄們」；讀成反諷，容易讓整節變成責備，失去它原本給一般信徒的邀請與責任。<\/p>"],["靠聖靈行事說（凡靠聖靈行事、結出溫柔的人）","","<p>認為「屬靈的人」就是第 5 章說的、靠聖靈行事的信徒；他的記號正是聖靈果子裡的溫柔（5:23）與自省。挽回不是開除、不是審判，也不是假裝沒事，是補網、接骨：把罪說出來，目的是讓人重新站起來。<\/p><p><strong>難處：<\/strong>這一說需要分辨的智慧：教會仍然需要領袖承擔較重的責任，也需要有秩序的程序（太 18:15--17）；尤其當過犯傷害了別人，例如家暴、性侵或濫權，不能只靠個別信徒「溫柔挽回」。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採靠聖靈行事說，並沿用哥林多後書立場四：饒恕、和好、恢復信任、恢復職分是四件事。<\/strong>挽回的目的是接骨，不是出氣；挽回的人要溫柔，也要「自己小心」。<\/p><p>三個界線：一、若過犯傷害了別人，先保護受傷的人，涉及違法的事要依法處理，不以「挽回」為名私了；二、悔改的人可以立刻被饒恕，但信任與職分需要時間與看得見的果子才恢復；三、挽回不在台上公開進行，也不在群組裡轉傳——補網的人知道，網越破越要輕手。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。跌倒過的人，不必以為自己從此在教會沒有位置；6:1 一開頭就叫他「弟兄們」，這一節本身就是一條回家的路。挽回人的人，也不必怕自己不夠格——你不必完美，只要靠聖靈行事、知道自己也可能跌倒。<\/p><p>這一題真正要我們記得的，是主怎樣挽回了彼得：炭火旁邊，三次問話，一句「你餵養我的羊」。我們都是被那樣挽回過的人。<\/p>"]],"con":[],"say":"本講義的立場：「屬靈的人」是靠聖靈行事、結出溫柔的信徒，不是一個階級；挽回是補網接骨，不是公審也不是假裝沒事；饒恕、和好、信任、職分是四件事，回指哥林多後書立場四。","care":"會眾席上可能有一位剛跌倒、正在考慮要不要再回來的人，也可能有一位被教會用「挽回」之名公開羞辱過的人。講台上不舉真實的例子、不暗示任何人。若過犯涉及對他人的傷害，先保護受害者，不要求受害者「用溫柔挽回」加害者，也不要求他立刻原諒。會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS06_2","t":"6:2 與 6:5「互相擔當」與「各人擔當自己的擔子」——基督徒要無限付出嗎？","r":"6:2--5；6:10；太11:28--30；可6:31","ch":[6],"why":"這兩節在中文裡都是「擔當」，看起來互相矛盾。教會裡最常見的兩種傷害都從這裡來：一種人用 6:2 要求照顧者、同工、家裡最肯扛的人無限付出，不准說累；另一種人用 6:5 替冷漠找理由。長期照顧家人的弟兄姊妹，最需要這一題講清楚。","pos":[["【一】經文問的是甚麼","","<p>「你們各人的重擔要互相擔當，如此，就完全了基督的律法」（6:2）；「因為各人必擔當自己的擔子」（6:5）。動詞都是 <strong>βαστάζω<\/strong>（bastazō），名詞卻不同：6:2 是 <strong>βάρη<\/strong>（barē），壓得人站不起來的重量；6:5 是 <strong>φορτίον<\/strong>（phortion），行軍時每個士兵自己背的行囊。問題是：基督徒擔別人的重擔，有沒有界線？<\/p>"],["無限付出說（愛就是不設限）","","<p>認為基督為我們捨了一切，信徒擔別人的重擔也不應計算代價；累了、說不，都是愛不夠或肉體軟弱的表現。這一說抓住了 6:2「完全了基督的律法」的重量，也挑戰了只顧自己的信仰。<\/p><p><strong>難處：<\/strong>6:2 的主詞是「彼此」，是一群人互相擔，不是最肯扛的那一個人擔所有人；6:5 緊接著說各人有自己的擔子，照顧者自己的身體、婚姻、孩子與信仰也是他的擔子。這一說常把照顧者壓到崩潰，正是主耶穌責備的「把難擔的重擔」擱在人肩上。<\/p>"],["自顧說（各人管好自己就是負責）","","<p>認為 6:5 是成熟的標記：每個人要為自己的生命負責，不要依賴別人，也不要干涉別人；教會過度介入個人的難處，反而養成依賴。這一說提醒了個人責任，也保護了人的界線。<\/p><p><strong>難處：<\/strong>把壓垮人的重擔說成「他自己的擔子」，就把 6:2 一筆勾銷了；6:10 還說「向信徒一家的人更當這樣」。這一說很容易變成冷漠的神學，讓最孤單的人被推開。<\/p>"],["兩個字分辨說（重擔一起扛，背包自己背）","","<p>認為 6:2 與 6:5 用兩個不同的字，正是要人分辨：壓垮人的重擔（病痛、失業、喪親、長期照顧），一個人扛會受傷，要一群人一起扛；每個人日常該負的責任（工作、選擇、自己的過錯），要自己背，別人替你背反而害了你。兩者都是愛，也都是界線。<\/p><p><strong>難處：<\/strong>現實中兩者常常交纏，一份照顧可能起初是背包，多年後變成壓垮人的重擔；分辨需要時間、對話與彼此的誠實，沒有一條公式可以套。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採兩個字分辨說（紅線八）。<\/strong>基督徒不要無限付出，也不可以冷漠；擔子是「信徒一家的人」一起分的（6:10）。<\/p><p>分辨的問題只有一個：這個重量，是他背得起的，還是已經壓得他站不起來？照顧別人的人，自己也是「彼此」裡的一個，也需要被人扛；說「這一件我不能替你做」不是不愛，是分得清楚。主耶穌扛起了世人最重的擔子，也帶門徒「到曠野地方去歇一歇」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你一直在扛，累到不敢說，請聽：你的累不是愛不夠，是你需要被扛的時候到了。如果你曾經拒絕過一個人，也不必立刻自責；問的是那是他的背包，還是他的重擔。<\/p><p>這一題最終指向那一位說「凡勞苦擔重擔的人可以到我這裡來」的主：他的軛是容易的，他的擔子是輕省的。教會能彼此扛，是因為他先扛了我們。<\/p>"]],"con":[],"say":"本講義的立場：6:2 的 βάρη 是壓垮人的重擔，要一起扛；6:5 的 φορτίον 是自己的背包，要自己背；基督徒不要無限付出，也不可冷漠，照顧者也需要被照顧（紅線八）。","care":"會眾席上一定有長期照顧者：照顧失智父母、身心障礙的孩子、久病的配偶，有些人已經撐了十年。不要對他說「這是你的十字架，要甘心」，也不要說「你要有信心」。先承認他的累是真的，再具體問教會能接手哪一個時段；若他出現長期無望、睡不著、想放棄的跡象，會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS06_3","t":"6:7--8「人種的是甚麼，收的也是甚麼」——這是因果報應嗎？","r":"6:7--9；約9:2--3；路13:4","ch":[6],"why":"這是加拉太書最常被引用、也最常被講錯的一句話。華人文化裡「善有善報、惡有惡報」「種瓜得瓜」與佛教的業報觀念很深，這一節很容易被讀成同一回事，結果對受苦的人說「你一定是種了甚麼」；也有人把它講成奉獻投資的公式。這一題關乎受苦的人會不會在教會裡再受一次傷。","pos":[["【一】經文問的是甚麼","","<p>「不要自欺，神是輕慢不得的。人種的是甚麼，收的也是甚麼。順著情慾撒種的，必從情慾收敗壞；順著聖靈撒種的，必從聖靈收永生」（6:7--8）。<strong>μυκτηρίζεται<\/strong>（myktērizetai）是嗤之以鼻、把人當傻瓜；<strong>ὁ σπείρων<\/strong>（ho speirōn）是現在分詞，「一直在撒的人」。問題是：這是一條因果報應的定律，還是別的甚麼？<\/p>"],["因果報應說（每一件苦難都有前因）","","<p>認為這一節說的是道德因果：人今天所受的福或禍，都是從前所作的善或惡的結果；這一說在民間信仰與業報觀念裡很普遍，也有人引用它來勸人行善、警告人不要作惡。<\/p><p><strong>難處：<\/strong>主耶穌直接否定這種讀法：門徒問生來瞎眼的人是誰犯了罪，主說「也不是這人犯了罪，也不是他父母犯了罪」（約 9:3）；他也問那些被西羅亞樓壓死的人，是否「比一切住在耶路撒冷的人更有罪」（路 13:4），答案是否定的。業報是一筆一筆的帳，而福音正是有人替我們付了帳。<\/p>"],["奉獻投資說（種下金錢，收回加倍）","","<p>認為上下文 6:6 講供給施教的人，所以撒種是奉獻；種下多少，神就加倍還給你錢財、健康與事業。這一說抓住了 6:6 與 6:7 的連接，也鼓勵慷慨。<\/p><p><strong>難處：<\/strong>6:8 保羅自己解釋了收成：是「敗壞」或「永生」，不是存款；把撒種講成交易，是成功神學的變形，也讓貧窮與病中的人以為自己被神虧待（回指哥林多後書紅線三）。<\/p>"],["生命方向說（撒向哪一塊田，就長出哪一種生命）","","<p>認為 6:8 是 6:7 的解釋：關鍵不在一粒一粒的種子，而在撒「向」哪裡——向自己的肉體，或向聖靈。這是第 5 章肉體與聖靈的延續：一天一天的方向，最後長成敗壞或永生；而「到了時候」（6:9）收成的季節是神定的。<\/p><p><strong>難處：<\/strong>這一說仍然承認行為有後果——酗酒的人傷了肝、說謊的人失去信任，聖經不否認；講的人要小心，不可把「後果」反過來推成「所有苦難都是自己造成的」。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採生命方向說（紅線七）。<\/strong>6:7 不是因果報應，不是業報，也不是奉獻投資；它是一個警告：神不能被愚弄，你一直往肉體撒，就不要期待從那裡長出永生。<\/p><p>同時明說兩件事：一、行為的自然後果是真的，但不能倒推「你受苦，一定是你種了甚麼」；二、收成的時候在神手裡，一個忠心撒種卻看不見果效的人，不是種錯了。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果有人曾經對你說「你的病、你孩子的事，是你種下的」，請你知道：那不是這一節的意思，主耶穌親口否定過這種說法。<\/p><p>福音和業報最大的不同在十字架：業報說每個人要還自己的帳；保羅在同一章只誇十字架，因為基督「為我們受了咒詛」，把我們還不起的帳背走了。我們撒種，是因為已經被愛，不是為了換得被愛。<\/p>"]],"con":[],"say":"本講義的立場：6:7 不是因果報應、業報，也不是奉獻投資；撒種是生命的方向（6:8），收成的時候是神定的（6:9）；絕不對受苦的人說「你一定是種了甚麼」（紅線七，金錢部分回指哥林多後書紅線三）。","care":"會眾席上可能有人正經歷流產、不孕、孩子重病、親人意外過世，心裡早已在問「是不是我做錯了甚麼」。這一節講錯一句，就會把他壓垮。不追問細節，不說「你要有信心」，也不急著解釋苦難的原因；先陪他流淚，明說「這不是你的報應」。會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS06_4","t":"6:11「我親手寫給你們的字是何等的大呢」——保羅的眼疾？親筆與代筆是怎麼回事？","r":"6:11；4:13--15；羅16:22；帖後3:17","ch":[6],"why":"這一節常被拿來證明保羅有眼疾，再連到 4:13--15 與林後 12:7 的那根刺，有時還引申出「神不一定醫治」或「保羅的病就是刺」的結論。另一方面，「親手寫」也牽涉到新約書信怎樣寫成、代筆會不會影響聖經的權威，這是許多慕道朋友與信徒會問的問題。","pos":[["【一】經文問的是甚麼","","<p>「請看我親手寫給你們的字是何等的大呢」（6:11）。<strong>πηλίκοις<\/strong>（pēlikois）是「多大的」，修飾 <strong>γράμμασιν<\/strong>（grammasin），指字母的大小，不是信的篇幅。古代書信常由書記代筆，寫信人在結尾親筆問安（羅 16:22；帖後 3:17）。問題有兩個：保羅為甚麼寫大字？親筆從哪裡開始？<\/p>"],["眼疾說","","<p>認為保羅視力不好，所以字寫得大：他說頭一次傳福音給加拉太人是「因為身體有疾病」（4:13），又說加拉太人願意把眼睛剜出來給他（4:15）；有人還連到大馬士革路上三天不能看見。<\/p><p><strong>難處：<\/strong>這是把幾處經文串起來的推測，加拉太書沒有說他有眼疾；4:15 的「剜眼」可能只是當時表達極深情誼的說法。把推測講成定論，再拿去說明某種病的屬靈意義，就超過經文了。<\/p>"],["強調說","","<p>認為大字是故意的，像今天把要緊的話印成粗體或加底線：保羅把筆從書記手中拿過來，最後幾行要加拉太人一定不能錯過——對手的動機、十字架、新造、耶穌的印記。這一說和 6:11--18 的內容最相合。<\/p><p><strong>難處：<\/strong>古代沒有其他直接證據顯示人用大字表示強調；而且這一說也不能排除他的手或眼確實有狀況，只是說經文的作用在強調。<\/p>"],["手的說法（勞動或傷痕）","","<p>認為保羅是做帳棚的人，手粗，寫不出書記那種工整的小字；也有人推想他的手曾在逼迫中受傷（林後 11:25）。這一說讓人看見一位親手勞動的使徒，與 6:17 身上的印記互相呼應。<\/p><p><strong>難處：<\/strong>同樣是推測，經文沒有提他的手；而且做工的人也可以寫小字，這一說的證據最薄。<\/p>"],["【三】本講義站在哪裡","","<p><strong>經文沒有說原因，本講義不定一說，以強調說為最穩。<\/strong>無論原因是甚麼，大字的作用是叫人停下來讀；親筆的部分多數學者認為從 6:11 到 6:18。<\/p><p>至於代筆：保羅用書記寫信，像今天的人請秘書打字，內容仍是他的；羅 16:22 的德提甚至在信裡自己問安。代筆不減損聖經的權威，聖靈默示的是作者的信息，不是筆跡。本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。保羅的字為甚麼大，我們不知道；我們知道的是，他用大字寫下的那幾句：只誇十字架、作新造的人。<\/p><p>如果你自己身體有病、眼睛不好、手不靈活，不必從這一節推出「神不醫治」或「神一定醫治」的結論；這一節要你看見的，是一位不完美的使徒，用他自己的手，把最要緊的話寫大。<\/p>"]],"con":[],"say":"本講義的立場：6:11 的大字原因經文沒有說，本講義不定一說，以強調說為最穩；親筆從 6:11 開始，代筆不減損聖經權威。本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上可能有視障、手部殘疾或慢性病的弟兄姊妹。講台上不拿「保羅也有眼疾」作輕鬆的笑話，也不推論「所以你的病是神給的刺，不必求了」。若有身心障礙的人來談，先聽他的經驗，不追問病情，也不替他的病下屬靈結論；為他求醫治，也尊重他繼續就醫治療。"},{"id":"ISS06_5","t":"6:16「神的以色列民」——指教會，還是指信主的猶太人？","r":"6:16；3:7；3:29；羅11:1--2；羅11:26","ch":[6],"why":"這是全卷最難的一個 καί，也是最敏感的一題。讀法不同，牽動對以色列與教會關係的整套看法；講得不好，會變成「神棄絕了猶太人」的取代論，助長反猶的態度。這一題也關乎今天華人教會怎樣看待以色列、怎樣面對猶太裔與中東背景的朋友。","pos":[["【一】經文問的是甚麼","","<p>「凡照此理而行的，願平安、憐憫加給他們，和神的以色列民」（6:16）。原文 <strong>καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ<\/strong>（kai epi ton Israēl tou theou）的 καί 可以讀成「和」，也可以讀成「就是」。問題是：「神的以色列民」和「照此理而行的」是同一群人，還是另一群人？這個讀法又怎樣影響我們看待今天的猶太人？<\/p>"],["「和」讀法（另一群人：信主的猶太人或將來得救的以色列）","","<p>認為 καί 最自然的意思就是「和」；保羅在別處從未直接稱教會為「以色列」；所以平安加給照此理而行的人，也加給「神的以色列」——指以色列中信主的猶太人，或羅 11:26 將來要得救的以色列全家。<\/p><p><strong>難處：<\/strong>6:15 才說受割禮不受割禮都無關緊要，若緊接著又按割禮分出一群人另外祝福，論證似乎自相矛盾；而且加拉太書全卷要說的，正是外邦信徒不必成為猶太人才算數。<\/p>"],["「就是」讀法（同一群人：猶太與外邦信徒組成的全教會）","","<p>認為這是解說的 καί：照此理而行的人，就是神的以色列——在基督裡、由猶太與外邦信徒組成的一個子民。理由是全卷說「以信為本的人就是亞伯拉罕的子孫」（3:7），又說屬基督的人「就是亞伯拉罕的後裔」（3:29）。<\/p><p><strong>難處：<\/strong>這一讀若推到極端，就成了取代論——教會取代了以色列，肉身的以色列從此在神的計畫裡沒有位置；這不但與羅 11 章衝突，在歷史上也曾被用來為迫害猶太人辯護。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採「就是」讀法為主要判斷（立場四）。<\/strong>照十字架與新造這一把尺走路的人，不分猶太人、外邦人，都是神的子民；「神的以色列民」是一個把外邦人接進來的名字，不是一個把猶太人趕出去的名字。<\/p><p>同時明說羅 11 章：「上帝棄絕了他的百姓嗎？斷乎沒有！」（羅 11:1）「上帝並沒有棄絕他預先所知道的百姓」（羅 11:2）。保羅自己就是以色列人。本講義絕不採取任何使猶太人被輕看、被仇視的講法（紅線三）。本講義的全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。這一個 καί 怎樣讀，各派爭論了很久，但各派都同意：在基督裡，猶太人與外邦人同坐一張桌子，同蒙一位神的平安與憐憫。<\/p><p>真正會影響信心的，不是你採哪一種讀法，而是你有沒有因為這一節，更輕看某一個民族。照這把尺走的人，結出來的是平安與憐憫，不是驕傲。<\/p>"]],"con":[],"say":"本講義的立場：6:16 採「就是」讀法為主要判斷——照此理而行的猶太與外邦信徒，就是神的以色列民；同時明說羅 11:1--2，神沒有棄絕他的百姓，絕不使猶太人被輕看。本講義的全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」。","care":"會眾席上可能有猶太裔、中東或穆斯林背景的朋友，也可能有對以色列懷著強烈政治立場的弟兄姊妹。講台上不談當前的政治衝突，不讓任何一句話使人更不喜歡猶太人、阿拉伯人或穆斯林。若有人因政治立場在會後爭執，溫和地把話題帶回 6:16 的平安與憐憫，不在講台上替任何一方背書。"},{"id":"ISS06_6","t":"6:17「耶穌的印記」——是聖痕嗎？","r":"6:17；徒14:19；林後11:23--25；林後4:10","ch":[6],"why":"中世紀以後的教會傳統中，有人身上被認為出現與基督釘痕相同的傷口，稱為「聖痕」，常引這一節為根據；今天也有人用身上的記號、異象或神蹟證明屬靈等級。這一節若讀錯，一個為福音受苦的見證，會變成另一種「肉體上的記號」，正好走回保羅在 6:12 所揭穿的面子。","pos":[["【一】經文問的是甚麼","","<p>「從今以後，人都不要攪擾我，因為我身上帶著耶穌的印記」（6:17）。<strong>τὰ στίγματα<\/strong>（ta stigmata）新約只此一次，原指烙在奴僕、俘虜身上標明主人的記號；<strong>βαστάζω<\/strong>（bastazō）與 6:2、6:5 是同一個動詞。問題是：保羅身上的「印記」是甚麼？是神蹟出現的傷口，還是別的？<\/p>"],["聖痕說（神蹟出現的基督傷痕）","","<p>中世紀以後的部分傳統認為，6:17 指保羅身上出現了與基督釘痕相同的傷口，是神特別的恩寵與標記；後來的聖痕記載常以這一節作為聖經的先例，並視之為與基督受苦深度相連的記號。<\/p><p><strong>難處：<\/strong>經文沒有提到手、腳、肋旁，也沒有說傷口是忽然出現的；上下文是對手要誇別人肉體上的割禮，保羅若以另一種神蹟記號回應，就是用一個記號換另一個記號，與 6:14--15 的論證相反。<\/p>"],["為主受傷說（逼迫留下的傷痕）","","<p>認為印記就是保羅為福音受苦留下的疤：「被棍打了三次；被石頭打了一次」（林後 11:25），尤其是在路司得「用石頭打保羅，以為他是死了，便拖到城外」（徒 14:19）。若照南加拉太說，加拉太人當中可能有人親眼看過。<\/p><p><strong>難處：<\/strong>這一說最貼近上下文，但「印記」一詞的奴僕烙印背景，提醒我們不只是傷痕本身，還有「屬於誰」的意義；只講受傷，可能漏掉身分的一面。<\/p>"],["屬主記號說（奴僕的烙印，表明歸屬）","","<p>認為重點在 στίγματα 的背景：奴僕身上的烙印標明他屬於哪一位主人，有些神廟奴僕也帶著神明的記號。保羅說：我身上帶著的，是耶穌的名字——我是他的人，誰也不能再拿割禮來爭我屬於誰。<\/p><p><strong>難處：<\/strong>這一說若脫離為主受傷的實際，容易被講成純粹象徵、沒有血肉；保羅的記號是真實的疤，不只是一個比喻。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義合讀後兩說：印記是為福音受的傷，這些傷表明他屬於耶穌；它不是聖痕的神蹟。<\/strong>全卷講了五章「你不是奴僕」，最後保羅卻說：我身上帶著主人的記號——從律法的奴僕變成神的兒子，然後甘心作基督的僕人。<\/p><p>今天若有人拿身上的記號、異象或神蹟來證明自己的屬靈等級或權柄，正好走回 6:12「希圖外貌體面」。保羅身上的記號，不是叫人看他，是叫人看他屬於誰（屬靈權柄的部分回指哥林多後書立場三）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。你不需要身上出現任何神蹟記號，才算真正屬於基督；你屬於他，是因為他為你被釘。<\/p><p>但這一節也輕輕地問我們：這一生，有沒有哪一道痕跡，是為了愛人、為了不在福音後面加一個「和」字而留下的？主都認得那些痕跡。<\/p>"]],"con":[],"say":"本講義的立場：6:17 的 στίγματα 是為福音受的傷，表明保羅屬於耶穌，像奴僕身上主人的烙印；不是聖痕的神蹟，也不是屬靈等級的證書。","care":"會眾席上可能有來自天主教背景、敬重聖痕傳統的家人朋友，講台上不嘲笑、不攻擊任何傳統，只說明經文的意思。也可能有人身上帶著真實的傷——為信仰被家人打罵、被逼迫過——或帶著並非為主而受、卻被人說成「十字架」的傷，例如家暴。不把一切傷都美化成「耶穌的印記」；會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS06_7","t":"6:6「當把一切需用的供給施教的人」——傳道人的供應應該怎樣看？","r":"6:6；林前9:14；提前5:17--18","ch":[6],"why":"華人教會談傳道人的生活，常常很尷尬：有的教會把傳道人的薪水壓到最低，認為清貧才屬靈；也有傳道人把教導當作向會眾要錢的槓桿。這一節夾在「擔子」與「撒種」之間，講清楚了，能讓會眾與傳道人都在一家人的關係裡彼此承擔，而不是在交易裡彼此提防。","pos":[["【一】經文問的是甚麼","","<p>「在道理上受教的，當把一切需用的供給施教的人」（6:6）。<strong>κοινωνείτω<\/strong>（koinōneitō）是「有分、相交」的動詞；<strong>ὁ κατηχούμενος<\/strong>（ho katēchoumenos）與 <strong>τῷ κατηχοῦντι<\/strong>（tō katēchounti）是同一個字的兩個分詞，一個受教、一個施教，像同一條線的兩端；<strong>ἐν πᾶσιν ἀγαθοῖς<\/strong>（en pasin agathois）是「在一切美好的事上」。問題是：這是講金錢的供應，還是講更廣的屬靈相交？<\/p>"],["物質供應說","","<p>認為這一節明說會眾要供應教導者的生活需要，與林前 9:14「主也是這樣命定，叫傳福音的靠著福音養生」（林前 9:14）及提前 5:18「工人得工價是應當的」一致；這一說保護傳道人，也讓會眾負起責任。<\/p><p><strong>難處：<\/strong>若只講金錢，容易被濫用成「你受了我的教導，就欠我」的要求；而且 κοινωνείτω 的重點是一起有分，不只是付費。<\/p>"],["屬靈分享說","","<p>認為「一切美好的事」指屬靈的好處：受教的人要把所領受的美好，與教導他的人一同分享、一同相交，像學生與老師一同在真道上長進；這一說避免把信仰關係商業化。<\/p><p><strong>難處：<\/strong>這一說忽略了古代教師依靠學生供應的實際處境，也忽略了保羅在別處明說傳道的可以靠福音養生；講成純屬靈，容易讓教會對傳道人的生計撒手不管。<\/p>"],["家人同擔說（物質與屬靈並在的相交）","","<p>認為 κοινωνία 本來就包括物質與屬靈兩面：教導的人把生命與真道分給會眾，會眾把生活所需分給教導的人；這一節放在 6:2「互相擔當」與 6:10「信徒一家的人」之間，傳道人的生計是一家人一起分的擔子。<\/p><p><strong>難處：<\/strong>這一說需要教會建立透明的財務與合理的標準，不同處境的教會能力不同，沒有統一的數字可以套用。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採家人同擔說（回指哥林多前書第 9 章與哥林多後書紅線三）。<\/strong>會眾不可以用「各人背自己的擔子」把傳道人的需要撒手不管；傳道人也不可以把這一節當成向人要錢的槓桿。<\/p><p>具體的原則：財務公開、有人共同經手、量力而為；不以清貧作屬靈的標記，也不以奉獻多少換取講台的影響力。這是書信的原則落在今天的處境（全卷立場見議題「書信的處境與原則」）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你曾經被教會以金錢傷害過——被施壓奉獻、看見不透明的帳目——那不是這一節的意思，你可以溫和而清楚地要求透明。<\/p><p>如果你是傳道人，正為生計羞於開口，也請你知道：被供應不是可恥的事，是一家人彼此有分。我們供應彼此，是因為那位「為我捨己」的主，先把一切都分給了我們。<\/p>"]],"con":[],"say":"本講義的立場：6:6 的「供給」是一家人的相交，包括物質與屬靈兩面；會眾要合理、透明地供應傳道人，傳道人不可藉此向人施壓（回指哥林多前書第 9 章、哥林多後書紅線三；全卷立場見議題「書信的處境與原則」）。","care":"會眾席上可能有經濟困難、無力奉獻而感到羞愧的人，也可能有生活拮据、不敢開口的傳道人家庭。講台上不點名、不公布奉獻名單，不暗示「奉獻少就是不愛教導你的人」。若有人曾被教會的金錢問題傷害，會後單獨聆聽，不急著替教會辯護。"},{"id":"ISS06_8","t":"6:14「世界已經釘在十字架上」——基督徒要離開世界、對世界冷漠嗎？","r":"6:14；2:19--20；約17:15；約3:16","ch":[6],"why":"「就我而論，世界已經釘在十字架上」常被讀成基督徒要與世隔絕、不關心社會、不看新聞、不交非信徒朋友；也有人用「我已經釘在十字架上」叫人壓抑感受、忍受傷害。這一節是全卷的最高點，讀錯了，會把自由的信仰變成冷漠或壓抑的信仰。","pos":[["【一】經文問的是甚麼","","<p>「因這十字架，就我而論，世界已經釘在十字架上；就世界而論，我已經釘在十字架上」（6:14）。<strong>ἐσταύρωται<\/strong>（estaurōtai）是完成式被動，和 2:19「同釘十字架」同一個時態：已經被釘，到今天還有效。問題是：這裡的「世界」是甚麼？被釘，是要基督徒離開世界嗎？<\/p>"],["隔離說（離開世界的生活）","","<p>認為「世界」指信徒以外的社會、文化與一切屬世的事物；被釘就是與它一刀兩斷，盡量少接觸非信徒、不參與社會、不關心世上的事，專心屬靈的事。這一說嚴肅看待世界的引誘。<\/p><p><strong>難處：<\/strong>主耶穌禱告說「我不求你叫他們離開世界，只求你保守他們脫離那惡者」（約 17:15）；神「愛世人」（約 3:16）。保羅自己在城市裡做帳棚、與各樣的人同桌；隔離說與他的生活不合。<\/p>"],["自我否定說（每天努力把自己釘死）","","<p>認為這一節要信徒每天努力治死自己：不顧自己的感受、需要與意見，越壓抑越屬靈；這一說常與 2:20「不再是我」連在一起，強調完全的順服。<\/p><p><strong>難處：<\/strong>ἐσταύρωται 是完成式被動，是神作成的，不是我每天努力把自己打死；2:20 同一節說「他是愛我，為我捨己」（2:20）。這一說會叫受傷的人不敢說痛，正是紅線一要防止的。<\/p>"],["價值體系說（被釘的是用面子量人的那一套）","","<p>認為上下文的「世界」指 6:12--13 那一套體系：用肉體的記號、面子、成績與別人的眼光量人。因十字架，這一套對保羅失效了：世界的稱讚抬不高他，世界的白眼壓不垮他；他反而自由地留在世界裡愛人。<\/p><p><strong>難處：<\/strong>這一說需要分辨「世界」在新約裡多種用法——有時指受造界，有時指人群，有時指敵對神的體系；講的人要說清楚這裡用的是哪一種，否則容易講得太抽象。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採價值體系說。<\/strong>被釘的是那一套用面子、記號與成績量人的世界，不是受造界，也不是人的感受與人格（紅線一）。這不是冷漠：保羅寫這封信時，還為加拉太人像母親生產一樣痛（4:19）。<\/p><p>這是自由：一個人不再需要世界給他面子，才能放手去愛。基督徒的自由不是離開世界，也不是放縱於世界，而是在世界裡不再被它的尺量（全卷立場見議題「基督徒的自由：在律法主義與放縱之間」）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。你不必為了證明自己屬靈，就切斷和非信徒朋友、家人與社會的關係；也不必因為覺得受傷，就懷疑自己「還沒有被釘死」。<\/p><p>十字架已經替你作成了這件事：那一套量你的尺，在十字架上失效了。你可以帶著被愛的自由，回到你的辦公室、你的家、你的城市，去愛那裡的人。<\/p>"]],"con":[],"say":"本講義的立場：6:14 被釘的「世界」是用面子與記號量人的價值體系，不是受造界，也不是人的感受與人格；基督徒在世界裡自由地愛人，不離開也不放縱。本講義的全卷立場見議題「基督徒的自由：在律法主義與放縱之間」。","care":"會眾席上可能有人在教會裡被教導「你已經死了，不該有感覺」，長年壓抑、甚至在受傷的關係裡不敢離開。講台上要明說：2:20 與 6:14 不是叫你忍受傷害，也不是叫你不可以說不。若有人因此長期無望、失去自我感，會後單獨關心，不要求他原諒傷害他的人，必要時協助尋求專業協助。"},{"id":"ISS06_9","t":"6:18 一封沒有感恩的信，卻以「弟兄們」收尾——嚴厲的責備與家人的稱呼怎樣並存？","r":"6:18；1:6--9；4:19--20；5:12","ch":[6],"why":"加拉太書是保羅寫給教會的書信裡唯一沒有感恩段的一封，開口就是「我希奇」，中間有「被咒詛」「無知的加拉太人」「把自己割絕了」這樣的重話，結尾也沒有個人問安。有人據此說保羅是個脾氣火爆的人，也有人拿它為講台上的嚴厲辯護。原文阿們之前的最後一個字「弟兄們」，正好讓這一題有一個出口。","pos":[["【一】經文問的是甚麼","","<p>「弟兄們，願我主耶穌基督的恩常在你們心裡。阿們！」（6:18）原文的 <strong>ἀδελφοί<\/strong>（adelphoi）排在最後，之後只剩一聲 <strong>ἀμήν<\/strong>（amēn）；和合本照中文語氣把它移到句首。問題是：一封這麼嚴厲的信，為甚麼以家人的稱呼收尾？今天的教會可以從中學到甚麼樣的責備？<\/p>"],["情緒說（保羅在氣頭上，所以略去感恩與問安）","","<p>認為保羅寫信時情緒激動，聽說加拉太人這麼快離開福音，又氣又急，所以省去慣常的感恩與問安；結尾的「弟兄們」是氣消之後的軟化。這一說讓保羅顯得真實，也提醒人使徒也有情緒。<\/p><p><strong>難處：<\/strong>加拉太書的結構非常嚴謹，6:11--18 又是他親筆刻意的收束，不像一時衝動；把整封信歸於情緒，會讓人以為信中的重話只是氣話，而輕看了它的福音警告。<\/p>"],["修辭說（刻意的省略與刻意的收尾）","","<p>認為略去感恩是刻意的：當福音本身受到威脅時，保羅不能照常說「我為你們感謝神」；而把「弟兄們」放在最後，也是刻意的——責備的目的不是切斷關係，是把家人帶回恩典裡。全信從「藉著基督之恩召你們的」（1:6）開始，到「我主耶穌基督的恩」（6:18）結束。<\/p><p><strong>難處：<\/strong>這一說若講得太快，容易讓今天的講員以為「只要最後叫一聲弟兄姊妹，前面多重的話都可以說」；保羅的權柄與處境，不是每一位講員都有的。<\/p>"],["關係說（責備從愛裡出來）","","<p>認為關鍵在保羅和加拉太人的關係：他是在他們中間生病、被接待、被當作天使的那一位（4:13--14），又說「我小子啊，我為你們再受生產之苦」（4:19）。重話是從母親般的痛裡出來的，「弟兄們」是這份愛的最後一句。<\/p><p><strong>難處：<\/strong>這一說需要提醒：不是每一個自稱愛你的人都有資格對你說重話；教會裡也有人以「愛」為名說傷人的話，關係說不能成為屬靈虐待的藉口。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義合讀修辭說與關係說。<\/strong>略去感恩，是因為福音受到威脅；以「弟兄們」收尾，是因為責備的目的是家人的回轉。保羅的嚴厲對準的是「別的福音」與傳割禮的動機（全卷立場見議題「『攪擾你們的人』是誰？」），不是對準跌倒的人。<\/p><p>今天的原則：可以為福音說清楚的話，但要先檢查三件事——我對準的是動機與教導，還是人？我和這群人有沒有像保羅那樣的生命關係？我最後的目的，是把人推開，還是叫他們回到家裡？（全卷立場見議題「這些爭議該不該影響一個人的信心？」）<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你曾經在教會裡聽過很重的話、被責備得很痛，請你聽這封信在阿們之前的最後一個字：不是命令，不是警告，是「弟兄們」。神的恩典從頭到尾包著這封信。<\/p><p>如果那些重話不是為了帶你回到恩典，而是為了控制你、羞辱你，那就不是加拉太書的樣子；你可以把它放下，也可以找一位信得過的人談一談。<\/p>"]],"con":[],"say":"本講義的立場：加拉太書略去感恩，是因為福音受到威脅；以「弟兄們」收尾，是因為責備的目的是家人的回轉；嚴厲對準的是別的福音與攪擾者的動機，不是跌倒的人。本講義的全卷立場見議題「『攪擾你們的人』是誰？」、議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上可能有人曾被屬靈領袖以「為你好」為名長期責罵、控制，聽到「保羅也很嚴厲」會更不敢說出來。講台上不拿這封信為自己的嚴厲辯護，也不用它要求會眾「接受責備才是謙卑」。若有人談起被屬靈權柄傷害的經歷，先相信、先聆聽，不要求他原諒，必要時協助尋求專業協助（回指哥林多後書立場三）。"}],"terrain":{"points":[[0.729,28,6,"去從別的福音",null],[1.146,66,16,"將他兒子啟示在我心裡",null],[2.095,8,13,"甚至連巴拿巴也隨夥裝假","bot"],[2.429,94,20,"現在活著的不再是我","top"],[2.517,22,1,"誰又迷惑了你們呢",null],[3.448,86,28,"在基督耶穌裡都成為一了","top"],[3.677,90,6,"阿爸！父！",null],[3.839,14,11,"惟恐我在你們身上是枉費了工夫","bot"],[5.058,18,15,"若相咬相吞，只怕要彼此消滅了","bot"],[5.327,88,22,"聖靈所結的果子",null],[5.583,72,2,"各人的重擔要互相擔當",null],[6.25,98,14,"只誇我們主耶穌基督的十字架","top"]]},"tracks":[{"gk":"νόμος","tr":"nomos","gl":"律法","code":"G3551","root":"νόμος——規範、法律；在保羅筆下多半指摩西的律法。本卷 32 次，是全卷頻率最高的實詞","ins":"νόμος 在加拉太書出現 32 次，是全卷的主追蹤。它一出場就是一道門檻：「人稱義不是因行律法」（2:16），這一節原文三次說 ἐξ ἔργων νόμου。2:19 是一個奇怪的句子：「我因律法，就向律法死了」——把我帶到死地的，正是律法自己；而 2:21 把結論說死：「義若是藉著律法得的，基督就是徒然死了」。第 3 章律法成了咒詛：「凡以行律法為本的，都是被咒詛的」（3:10），基督卻「贖出我們脫離律法的咒詛」（3:13）。律法比應許晚來四百三十年（3:17），保羅問「律法是為甚麼有的呢」（3:19），答案是：「律法是我們訓蒙的師傅，引我們到基督那裡」（3:24）——παιδαγωγός 是帶孩子上學的家奴。4:4 基督自己「生在律法以下」，走進律法裡面把人帶出來。到第 5 章，靠律法稱義的人「從恩典中墜落了」（5:4），可是「全律法都包在『愛人如己』這一句話之內了」（5:14），聖靈的果子「沒有律法禁止」（5:23）。最後一站：「如此，就完全了基督的律法」（6:2）。律法沒有被丟掉，是被成全、被換了主人。","stops":[["2:16","人稱義不是因行律法","bot"],["2:19","我因律法，就向律法死了","top"],["2:21","義若是藉著律法得的，基督就是徒然死了","bot"],["3:10","凡以行律法為本的，都是被咒詛的","bot"],["3:13","就贖出我們脫離律法的咒詛","top"],["3:17","那四百三十年以後的律法",""],["3:19","律法是為甚麼有的呢",""],["3:24","律法是我們訓蒙的師傅，引我們到基督那裡","top"],["4:4","且生在律法以下","top"],["5:4","你們這要靠律法稱義的","bot"],["5:14","全律法都包在「愛人如己」這一句話之內了","top"],["5:23","這樣的事沒有律法禁止",""],["6:2","如此，就完全了基督的律法","top"]]},{"gk":"σάρξ／πνεῦμα","tr":"sarx / pneuma","gl":"肉體、肉身、血氣、身體／聖靈、靈","code":"G4561","root":"σάρξ——肉、肉身、人的本相，在保羅筆下也指離開神、自己作主的那種活法；πνεῦμα——風、氣息、靈，在本卷多半指神的靈。兩個字在加拉太書各 18 次","ins":"σάρξ 與 πνεῦμα 在加拉太書各出現 18 次，次數完全相同，而且常常同節對舉，所以本卷把它們立為一組。路加福音講義已有 πνεῦμα 一條，那一條的方向是聖靈的能力臨到人；這一條的方向是聖靈與肉體在一個人裡面相爭。σάρξ 一開始只是「人」：「我就沒有與屬血氣的人商量」（1:16，原文「肉與血」）；2:20 的「我如今在肉身活著」說明肉身本身不是罪，是基督活出來的地方。3:3 第一次對舉：「你們既靠聖靈入門，如今還靠肉身成全嗎」。4:6 神差「他兒子的靈進入你們的心」；4:13 保羅自己「身體有疾病」，原文也是 σάρξ。4:29 以實瑪利與以撒是「按著血氣生的」與「按著聖靈生的」。第 5 章是戰場：自由不可當作「放縱情慾的機會」（5:13，原文「給肉體的機會」）；「當順著聖靈而行」（5:16）；「情慾和聖靈相爭」（5:17）；肉體的作為是複數，「聖靈所結的果子」是單數（5:22）；屬基督的人「已經把肉體……同釘在十字架上了」（5:24）；「我們若是靠聖靈得生，就當靠聖靈行事」（5:25）。6:8 是兩種撒種，6:12 是對手的動機：「希圖外貌體面」，原文「在肉體上作出好看的臉」——割禮就是一刀切在肉體上的宗教。","stops":[["1:16","我就沒有與屬血氣的人商量",""],["2:20","並且我如今在肉身活著",""],["3:3","你們既靠聖靈入門，如今還靠肉身成全嗎","bot"],["4:6","神就差他兒子的靈進入你們的心","top"],["4:13","是因為身體有疾病",""],["4:29","那按著血氣生的逼迫了那按著聖靈生的",""],["5:13","只是不可將你們的自由當作放縱情慾的機會","bot"],["5:16","你們當順著聖靈而行，就不放縱肉體的情慾了","top"],["5:17","因為情慾和聖靈相爭","bot"],["5:22","聖靈所結的果子","top"],["5:24","已經把肉體連肉體的邪情私慾同釘在十字架上了","top"],["5:25","我們若是靠聖靈得生，就當靠聖靈行事","top"],["6:8","順著情慾撒種的，必從情慾收敗壞",""],["6:12","凡希圖外貌體面的人","bot"]]},{"gk":"ἐλευθερία／δοῦλος","tr":"eleutheria / doulos","gl":"自由、自主的、釋放／奴僕、為奴、使女","code":"G1657","root":"ἐλευθερία——自由，ἐλεύθερος 是生來自由的人；δοῦλος——奴僕，δουλεύω 是作奴僕、服事，παιδίσκη 是使女。本卷自由的字族 11 次，奴僕的字族 17 次","ins":"自由與奴僕在加拉太書是一組對照：自由的字族 11 次，奴僕的字族 17 次。第一站是保羅給自己的名號：「我就不是基督的僕人了」（1:10，原文 Χριστοῦ δοῦλος，基督的奴僕）。2:4 假弟兄「窺探我們在基督耶穌裡的自由，要叫我們作奴僕」——這是全卷的戰況。3:28 在基督裡「自主的、為奴的」都成為一了。第 4 章是身分的翻轉：承受產業的孩子「與奴僕毫無分別」（4:1），可是「你不是奴僕，乃是兒子了」（4:7）；加拉太人卻「情願再給他作奴僕」（4:9）。4:22–31 是全卷最長的對照：使女與自主的婦人，「那在上的耶路撒冷是自主的，她是我們的母」（4:26），「我們不是使女的兒女，乃是自主婦人的兒女了」（4:31）。5:1 是全卷鑰句：「基督釋放了我們，叫我們得以自由」，原文「為了自由，基督使我們自由」。最後一站最出人意料：「總要用愛心互相服事」（5:13），動詞是 δουλεύετε——彼此作奴僕。被釋放的人，自由地選擇作奴僕。","stops":[["1:10","我就不是基督的僕人了",""],["2:4","私下窺探我們在基督耶穌裡的自由，要叫我們作奴僕","bot"],["3:28","自主的、為奴的","top"],["4:1","與奴僕毫無分別","bot"],["4:7","你不是奴僕，乃是兒子了","top"],["4:9","情願再給他作奴僕呢","bot"],["4:22","一個是使女生的，一個是自主之婦人生的",""],["4:26","但那在上的耶路撒冷是自主的，她是我們的母","top"],["4:31","我們不是使女的兒女，乃是自主婦人的兒女了","top"],["5:1","基督釋放了我們，叫我們得以自由","top"],["5:13","總要用愛心互相服事","top"]]},{"gk":"ἐπαγγελία","tr":"epangelia","gl":"應許","code":"G1860","root":"ἐπαγγελία——應許、宣告要給的話；源自 ἐπαγγέλλομαι（應許、宣告）。應許是神說的，不是人換來的","ins":"ἐπαγγελία 在加拉太書出現 10 次，全部集中在 3:14 到 4:28。第一站就說出應許的內容：「使我們因信得著所應許的聖靈」（3:14）。3:16 是全條最奇特的一站：「所應許的原是向亞伯拉罕和他子孫說的」，而且「子孫」是單數，「指著一個人，就是基督」——應許從亞伯拉罕收窄到一個人。3:17–18 說明四百三十年以後的律法，不能「叫應許歸於虛空」，因為「神是憑著應許把產業賜給亞伯拉罕」。3:19 律法是「等候那蒙應許的子孫來到」的過渡；3:21 保羅自問：「律法是與神的應許反對嗎？」答：斷乎不是。3:22「使所應許的福因信耶穌基督，歸給那信的人」，3:29 應許又從那一個子孫打開給所有在他裡面的人：「是照著應許承受產業的了」。最後兩站，應許變成一種出生的方式：「那自主之婦人所生的是憑著應許生的」（4:23），「我們是憑著應許作兒女，如同以撒一樣」（4:28）。","stops":[["3:14","使我們因信得著所應許的聖靈","top"],["3:16","所應許的原是向亞伯拉罕和他子孫說的","top"],["3:17","叫應許歸於虛空","bot"],["3:18","但神是憑著應許把產業賜給亞伯拉罕",""],["3:19","等候那蒙應許的子孫來到",""],["3:21","這樣，律法是與神的應許反對嗎","bot"],["3:22","使所應許的福因信耶穌基督，歸給那信的人","top"],["3:29","是照著應許承受產業的了","top"],["4:23","那自主之婦人所生的是憑著應許生的",""],["4:28","我們是憑著應許作兒女，如同以撒一樣","top"]]},{"gk":"υἱός","tr":"huios","gl":"兒子、子孫、兒子的名分","code":"G5207","root":"υἱός——兒子；υἱοθεσία（4:5）是「立為兒子」，羅馬法的收養——被收養的兒子與親生的兒子有同等的承受權","ins":"υἱός 在加拉太書出現 13 次，加上 4:5 的 υἱοθεσία（兒子的名分）共 14 次，這是本卷「奴僕與兒子」那一組對照的骨幹。全卷第一個「兒子」是神的兒子：「既然樂意將他兒子啟示在我心裡」（1:16）；第二站是 321 的本文：「是因信神的兒子而活；他是愛我，為我捨己」（2:20）。3:7 原文說以信為本的人是「亞伯拉罕的兒子們」，3:26 再往上一層：「你們因信基督耶穌都是神的兒子」——神的兒子從單數變成複數。第 4 章四站連在一起：「神就差遣他的兒子」（4:4），「叫我們得著兒子的名分」（4:5），「神就差他兒子的靈進入你們的心」（4:6），「既是兒子，就靠著神為後嗣」（4:7）——神差兒子，又差兒子的靈，所以我們能用兒子的口氣叫「阿爸」。最後兩站回到亞伯拉罕的兩個兒子（4:22），以及「把使女和她兒子趕出去」（4:30）——這一句講的是兩種出生方式，不是兩個民族（紅線三）。","stops":[["1:16","既然樂意將他兒子啟示在我心裡","top"],["2:20","是因信神的兒子而活；他是愛我，為我捨己","top"],["3:7","那以信為本的人，就是亞伯拉罕的子孫",""],["3:26","你們因信基督耶穌都是神的兒子","top"],["4:4","神就差遣他的兒子","top"],["4:5","叫我們得著兒子的名分",""],["4:6","神就差他兒子的靈進入你們的心","top"],["4:7","既是兒子，就靠著神為後嗣","top"],["4:22","亞伯拉罕有兩個兒子",""],["4:30","把使女和她兒子趕出去","bot"]]}],"lesson":{"1":{"no":1,"vol":"《321加拉太書講義》第一課·加拉太書第一章","title":"一封沒有客套的家書——召、啟、榮","chars":5066,"min":60,"deep":8,"dchars":1750,"tchars":1449,"blocks":[["h","一、一封省掉客套的信"],["p","弟兄姊妹平安。我讀過一封很短的家書。寫信的是一位住在鄉下的父親，收信的是在大城市打工的兒子。華人的家書有一套規矩：開頭寫「見字如面」，接著問身體好不好、天冷要加衣，最後才說家裡的事。可是那一封信，第一行就是：「你先不要簽。」原來兒子在電話裡提過，有人介紹他一個穩賺的投資，要先把積蓄交出去。父親連問候都省了，他怕信寄到的時候，兒子已經簽了。"],["p","客套省掉了，不是因為不愛，是因為太愛，又太急。加拉太書就是這樣一封信。保羅寫給教會的信，問安之後幾乎都有一段感恩，連問題成堆的哥林多也有。加拉太書沒有，問安一完就是「我希奇」：保羅寫給教會的書信裡，唯一沒有感恩段的一封。缺席的感恩，本身就是信息。"],["p","可是在「我希奇」之前，保羅還是寫了五節，那是他在急信裡先放下的地基。先看第一句：「作使徒的保羅（不是由於人，也不是藉著人，乃是藉著耶穌基督，與叫他從死裡復活的父神）」（1:1）。名字還沒寫完，他就插進一個括號。"],["p","為甚麼？在加拉太，有人正在說：保羅不過是個二手的傳道人。保羅的回答是：我站在這裡，不是哪一群人發的委任狀，也不是哪一位前輩轉手給我的。這不是自誇，是全卷的第一個論點。"],["p","然後是問安。保羅在一句祝福裡，塞進了整個福音：「基督照我們父神的旨意，為我們的罪捨己，要救我們脫離這罪惡的世代。」（1:4）這是全卷第一次講到基督是誰，他先說基督已經做了甚麼：捨己。在要求任何改變以前，他先把那一位已經給完了的基督擺在桌上。"],["p","接著第五節：「但願榮耀歸於神，直到永永遠遠。阿們！」（1:5）還沒開始責備，先把榮耀歸給神。用書信三問來讀，第一問的答案在信封上就看得見：有人在質疑保羅的來源，也在動他們的福音。這一課用三個字走完：召、啟、榮。神藉著恩典呼召，神把兒子啟示在人心裡，最後榮耀回到神那裡。"],["d",["加拉太在哪裡？這封信是寫給哪一群人的？","加拉太有兩種意思。一種是小亞細亞中北部，高盧人後裔聚居的族群地區；另一種是羅馬帝國的加拉太行省，範圍向南延伸，包括使徒行傳第十三、十四章保羅去過的彼西底的安提阿、以哥念、路司得。主張北部的稱為北加拉太說，主張南部的稱為南加拉太說，兩說都有學者支持，也影響這封信寫成的年代。本講義的整理見全卷立場議題「加拉太在哪裡？這封信寫於何時？」。這裡只要記得一件事：無論在北在南，收信的是一群外邦人為主的家庭教會，第一章說的是「加拉太的各教會」，複數，是一封要傳閱的信。"]],["h","二、加一個「和」字，就不是福音"],["p","現在讀那一句沒有客套的話：「我希奇你們這麼快離開那藉著基督之恩召你們的，去從別的福音。」（1:6）先聽他們離開了誰：不是離開一套道理，是離開那藉著基督之恩召他們的那一位。離開福音，是轉身離開一個人。"],["p","第二個要聽見的詞是「這麼快」。福音不是被一場逼迫奪走的，是被一個看起來更完整、更有保障的版本悄悄換掉的。就像那位父親怕的，是一份看起來很合理的合約。"],["p","加拉太人遇到了甚麼？保羅離開以後，有一批也信耶穌的教師來到這些外邦人的教會。他們的主張是：外邦人信了耶穌還不夠，還要受割禮、守律法，才算真的進了亞伯拉罕的家。我要說清楚，這是他們的主張，不是保羅的。保羅的評語是：「那並不是福音，不過有些人攪擾你們，要把基督的福音更改了。」（1:7）"],["p","請記住：他們沒有拿掉基督。他們只是在基督後面加了一個字，一個「和」字。基督，和割禮；基督，和我們這一套。為甚麼加一點點，就成了「更改」？因為一旦得救需要「基督再加上一樣」，那一樣就成了真正的門檻。人會用那扇門判斷誰在裡面、誰在外面，基督就從終點變成了排隊的起點。保羅後來說得更直接：「若受割禮，基督就與你們無益了」（5:2）。哥林多後書講義第十一章講過同一種結構：耶穌，再加上我們認可的東西。"],["p","接著是全章最重的兩句。「但無論是我們，是天上來的使者，若傳福音給你們，與我們所傳給你們的不同，他就應當被咒詛。」（1:8）第九節再說一次。請看保羅第一個放上檢驗台的是誰：是「我們」。就算是保羅自己改了口，也一樣。準則高過傳的人。不必比較誰的名望大，只要問：傳的是不是那一位為我們的罪捨己的基督，有沒有在他後面加上別的。"],["p","第十節是保羅自己的心：「我豈是討人的喜歡嗎？若仍舊討人的喜歡，我就不是基督的僕人了。」（1:10）「僕人」原文是奴僕，只有一位主人。叫鄰舍喜悅，是為了對方得益處；討人喜歡，是為了自己得認可。前者是愛，後者是怕。當別人的眼光替我做決定，那也是一個「和」字：基督，和別人的眼光。"],["d",["「別的福音」和宗派之間的差異，怎樣分辨？","保羅自己在第五章下了定義：「你們這要靠律法稱義的，是與基督隔絕，從恩典中墜落了」（5:4）。所以別的福音有明確的內容：在基督之外加上得救的條件。可以用一個問題來分辨：如果一個人沒有做到這一樣，你會不會說他沒有得救？洗禮方式、方言、教會治理，都是真實的差異，可以討論，甚至可以因此分成不同的教會，但通常不會有人說另一邊不得救。若有人說「單單信耶穌不夠，還要加入我們這一個團體、守我們這一套規矩才得救」，那就碰到第一章的線了。分辨的時候，也先檢查自己：我們有沒有把自己的一套，加成了別人的門檻？本講義的全卷立場見議題「書信的處境與原則」、議題「『攪擾你們的人』是誰？」。"]],["d",["我很怕得罪人，常常說違心的話，這是不是就是「討人的喜歡」？","先不要急著給自己貼標籤。第十節的分別不在說話的語氣，在誰是主人、為了誰。叫鄰舍喜悅，是為了對方得益處；討人喜歡，是為了自己得認可。你可以用三個問題檢查最近一次的違心之論：我不說真話，是怕對方受傷，還是怕自己被討厭？如果這句真話說出來，對他有沒有益處？我在乎的是他，還是他怎樣看我？若常常是怕，出路不是逼自己變強硬，而是回到那位已經接納你的主那裡：他的評價不會因為別人的臉色改變。也要說清楚：若你在家裡或職場長期被要求委屈求全，甚至受到傷害，那不是你討好的問題，請找一位信得過的人或專業協助談一談。"]],["h","三、原文亮光：轉營、交給神、分別出來"],["p","這一章有三個原文字，拆開來，整章就站起來了。"],["p","第一個字在第六節：μετατίθεσθε（metatithesthe），和合本譯作「離開」。古代文獻用這個字形容士兵叛營、哲學家改換門派。它可以讀作「你們正在把自己轉過去」，也可以讀作「你們正被人帶走」：他們自己有責任，背後也有人在推。最要緊的是現在式：還沒轉完，所以這封信還來得及，就像那一句「你先不要簽」。"],["p","第二個字在第八、九節：ἀνάθεμα（anathema），和合本譯作「被咒詛」。這個字在舊約希臘文譯本裡，用來翻譯希伯來文的「當滅的物」，意思是交給神、由神處置。後面的 ἔστω（estō）是第三人稱命令，是一個宣告，不是交給教會去執行的命令。保羅沒有叫加拉太人去懲罰誰、趕走誰，他把那人交在神的審判之下，後來也說「攪擾你們的，無論是誰，必擔當他的罪名」（5:10），審判的是神。同一位使徒還說，為了骨肉之親，他寧願自己被咒詛，用的是同一個字。"],["p","第三個字在第十五節：ὁ ἀφορίσας με（ho aphorisas me），和合本譯作「那把我從母腹裡分別出來」。學者觀察到，這個字和「法利賽人」（分別出來的人）的字源相近。保羅從前以為，分別出來就是要跟不潔淨的人隔開，要比別人更守規矩；原來神早就把他分別出來，是為了「叫我把他傳在外邦人中」（1:16），把他送到他從前不肯同桌的人那裡去。"],["p","神的分別出來，是差遣，不是隔離。所以要問：你的分別為聖，是把你和某些人隔得更遠，還是把你差到他們中間？"],["d",["保羅說「應當被咒詛」，這和耶穌說「要愛你們的仇敵」矛盾嗎？","不矛盾，因為兩者對付的是不同的東西，而且保羅把審判交在神手裡。ἀνάθεμα 是交給神處置，ἔστω 是宣告，不是叫加拉太人去懲罰、驅逐、羞辱任何人。保羅一面說最重的話，一面在第四章說「我小子啊，我為你們再受生產之苦」（4:19），可見他重的不是脾氣，是愛。醫生看見有人在水井裡下毒，說話不會溫和，但他要攔阻的是那一口水。我們可以堅定地說「這不是福音」，同時為傳這個信息的人禱告，盼望他回轉。愛仇敵與守住福音，是同一份忠心的兩面。"]],["h","四、從逼迫者到叫人歸榮耀給神"],["p","加拉太人會問：你憑甚麼這麼肯定？保羅的回答，是講自己的故事。他說他的福音「乃是從耶穌基督啟示來的」（1:12）。他不是沒有從教會聽過耶穌，他就是因為聽見了，才去逼迫的。可是那一位被掛在木頭上的人就是神的兒子，這件事是神親自打開的。資訊可以傳授，啟示只能領受。"],["p","他從前是甚麼樣的人？「怎樣極力逼迫殘害神的教會」（1:13）。逼迫、殘害原文都是未完成式：不是一次失手，是一種生活。「殘害」古人常用來寫軍隊洗劫一座城。他又是同輩裡最出色的，「為我祖宗的遺傳更加熱心」（1:14），熱心到拿刀對著神的教會。熱心證明不了方向是對的。保羅不是在貶低猶太人，他到老都說自己是猶太人；他否定的，是自己從前那一種要把不一樣的人除掉的熱心，這種熱心任何教會都可能有。"],["p","然後經文轉了一個彎：「然而，那把我從母腹裡分別出來、又施恩召我的神，既然樂意將他兒子啟示在我心裡，叫我把他傳在外邦人中」（1:15–16）。找一找主詞：分別出來、施恩召、樂意、啟示，全是神。保羅從前的一生都是自己的動詞，現在換成了神的動詞。這就是第一個詞「召」。保羅在母腹裡還沒受割禮，神就已經把他分別出來；連使徒的呼召都在任何記號之前，外邦人得救，還需要甚麼「再加上」呢？"],["p","第二個詞是「啟」。這一章的章題就藏在這一句裡：將他兒子啟示在我心裡。保羅在大馬士革路上得著的，不是一份更正確的教義表，是一個人。使徒行傳講義第九章講過那一天，他仆倒在地，問了一句「主啊！你是誰？」（徒 9:5）。這是全卷第一次出現「兒子」，到第四章，這一位兒子會讓我們也能呼叫阿爸。福音不是一套說法，是一位兒子。"],["p","然後他沒有與屬血氣的人商量，卻往阿拉伯去，那是第一世紀約旦河東的一個王國，只是地名。他在那裡做甚麼，使徒行傳沒有記；那是一段不在台上的日子。「過了三年，才上耶路撒冷去見磯法，和他同住了十五天。」（1:18）「去見」原文在新約只出現這一次，是去拜訪、去認識一個人。他珍惜相交，只是不讓相交變成授權。"],["p","第三個詞是「榮」。猶太的教會一直沒見過他，只聽說一句話：「那從前逼迫我們的，現在傳揚他原先所殘害的真道。」（1:23）想像一間家庭教會，幾盞油燈，坐著一位丈夫當年被掃羅抓走的姊妹。他們聽完了，做了甚麼？「他們就為我的緣故，歸榮耀給神。」（1:24）他們沒有說保羅真了不起。「為我的緣故」原文和第十六節的「在我」是同一個片語。全章從第五節的榮耀開始，在這裡收尾。一個被改變的人，叫人看見的不是他，是那一位改變他的神。"],["d",["我從前傷過人，甚至傷過教會，我還配事奉嗎？","保羅說他從前「極力逼迫殘害神的教會」，而且是未完成式，一種生活，不是一次失手。神沒有因此不用他，猶太的眾教會最後還為他歸榮耀給神。所以你的過去不是神不能用你的理由，恩典比你做過的事大。可是有三件事要一起看。第一，被你傷過的人是真實的，若能夠又合宜，要真誠地認錯，必要時賠償，但不強求對方原諒你，也不要求他立刻和你和好。第二，事奉的節奏讓教會一起分辨，保羅自己也有三年不在台上的日子。第三，見證的重點不在你的過去有多黑，在神的恩典有多大；講的時候顧念台下可能坐著當年受傷的人。"]],["d",["保羅說「沒有與屬血氣的人商量」，那我做決定是不是也不必聽別人的意見？","不是。這一句講的是福音的來源：大馬士革路上那一位兒子的啟示，不需要任何人批准才算數。它不是一條做決定的方法論。同一個保羅，三年後去認識磯法，十四年後又「把我在外邦人中所傳的福音對弟兄們陳說」（2:2），甘心讓人檢驗；所以今天做重大決定，正常的方式是禱告，讀經，也請成熟的肢體一同分辨。若有人說「神直接告訴我，誰勸都沒用」，而那件事又要他離開所有勸告他的人、或要求別人付出金錢或身體，就要特別小心。真正從神來的領受，不怕被檢驗。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是拿第八、九節咒詛教義或宗派不同的人，把洗禮方式、方言、教會治理的差異都說成「別的福音」。別的福音是在基督之外加上得救的條件；拿這兩節給弟兄姊妹貼標籤，正好犯了攪擾者同樣的錯。"],["p","第二個偏差，是講得含糊，讓人以為「信耶穌還要守割禮、守律法」也是使徒的教導；或隨口把批評我們的同工比作「攪擾你們的人」。給人這個名號以前，先說得出他在基督之外加了哪一個得救的條件。"],["p","第三個偏差，是拿「不是由於人」「不是人教導我的」說：神直接對我說了，不需要教會的印證，誰也不能質疑。保羅講的是福音的來源，不是拒絕檢驗；他開頭就和「一切與我同在的眾弟兄」站在一起。"],["p","第四個偏差，是把第十節講成基督徒不必在乎別人的感受，替說話尖刻的人背書；或反過來，在講台上說某些人「就是討好型人格」，叫本來就不敢說不的人再忍一下。第十節拒絕的是讓人的眼光作主人，不是拒絕愛人。"],["p","第五個偏差，是把第十五節講成宿命，對年輕人說你生下來就注定要作傳道，不去就是違背神；或把第二十三節講成見證表演，叫人把過去的罪講得越精彩越好。呼召是施恩召的，不是恐嚇；眾教會是歸榮耀給神，不是為誰的過去鼓掌。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：華人教會很少講割禮，可是很多教會都有一套沒有寫進信仰告白、人人心裡卻知道的條件。講哪一種語言、穿成甚麼樣子、上過哪一套課，才算「真正是我們的人」。這些東西本身未必有錯，秩序、裝備、門訓都是好的；錯在它們悄悄被放到基督旁邊，成了「這樣才算數」的門檻。新朋友坐了半年，還覺得自己在門外。書信三問的第三問就落在這裡。同工可以一起檢查：哪一條只是秩序，哪一條已經被人當成了進門的條件。"],["p","第二個問題：華人很重面子，也很怕給人難堪。對長輩不敢說不，小組裡不敢說不同意，講台上不太敢講罪。另一面，我們也很在乎「是誰帶出來的」，看人先看輩分和師承。保羅兩頭都碰到了：他不靠耶路撒冷的授權來證明自己，也不靠討人喜歡來保住關係。這不是叫我們頂撞長輩、不顧情面；第十節要拿走的，是那一位坐錯了位置的主人。真話可以溫柔地說、挑時間說，但總要有人說。"],["d",["我們教會有受洗班、會員課程和服事資格，這些算不算今天的「割禮」？","不一定，要看它被放在哪一個位置。受洗班、會員委身、服事裝備，都是教會的秩序，本身是好的。它變成割禮，是在它悄悄成了得救或被接納的條件的時候：沒上完這一套課，就不被當作弟兄姊妹；不會講我們的語言，就永遠坐在邊上；同工會可以一起做一個簡單的檢查：一位真心信耶穌、還沒完成這些程序的人，在我們中間是被當作家人，還是被當作外人？若是外人，問題不在課程，在我們把它放錯了位置。本講義的全卷立場見議題「書信的處境與原則」。"]],["h","七、活出321——把那個「和」字拿掉"],["p","耶穌是我的榜樣：全卷第一次講基督，就是他「為我們的罪捨己」（1:4），而且是照著父神的旨意。群眾要強逼他作王，他退到山上去；他不受從人來的榮耀。學他，是先被他的捨己接住，再學他只看父的臉，不看人的臉。"],["p","聖經是我的準則：保羅第一個放上檢驗台的是「我們」，連天上來的使者也要被福音檢驗。準則高過傳的人，也高過我的領受、我教會的傳統；攪擾者說的，要說清楚是他們說的。"],["p","聖靈是我的引導：福音「乃是從耶穌基督啟示來的」（1:12），是神親自打開的。只有聖靈能把那一位兒子啟示在人心裡。求聖靈讓我分辨，心裡哪一條「再加上」是我自己寫上去的，也給我說真話的勇氣和溫柔。"],["p","讓耶穌作王：這一章要人讓出來的位置，是「我心裡另一位主人」。可能是長輩的期待、群組裡的評價，也可能是我替自己訂的那張清單。王只能有一位。讓這些聲音退回顧問的位置，不再坐在王位上。"],["p","讓耶穌得著一切的榮耀：這一章從「但願榮耀歸於神」開始，到「歸榮耀給神」結束。我身上若有甚麼改變，別人看見以後嘴裡說出來的，應該是神的名字，不是我的名字。見證裡不美化過去，也不渲染它。"],["p","建立屬神的體系：同工會一起檢查我們的會員制度、受洗班、服事資格，哪一條悄悄變成了得救的門檻，就把它放回秩序的位置；門訓要陪人親自被那一位兒子遇見；當「從前逼迫我們的」回到教會，預備一張接納的桌子，同時保護曾經受傷的人。讓人最後為神歡呼，不是為誰鼓掌。"],["h","八、四種心，各自握著一張清單"],["p","驕傲型的心，清單是拿來量別人的。我讀經幾年、服事多久，所以某些人「還不夠像基督徒」。這一章問你：你是不是在基督後面，替別人加了一個「和」字？保羅曾經是同輩裡最出色的，那份出色把他帶到逼迫教會的路上。"],["p","恐懼型的心，清單是拿來量自己的。總覺得自己還差一點：再穩一點、再好一點、再多做一點，神才會真的收納我。讀到「應當被咒詛」就發抖。請看清楚，這兩節咒詛的是在基督之外加上條件的福音，不是正在掙扎的你；那一位為你的罪捨己的，已經給完了，不是差一點。"],["p","羞恥型的心，清單上寫的是過去。像保羅一樣，你也許做過傷人的事，覺得自己不配再事奉，最好不要被人知道。保羅的過去沒有被藏起來，也沒有被美化，它被放在恩典旁邊，正好顯出恩典有多大。你不必急著上台說出來，但你的過去不是神不能用你的理由。"],["p","受傷型的心，也許曾被一張清單擋在門外：被說成異端，因為背景被當成次等的人，或被一位自稱神直接對他說話的領袖控制過。那不是福音，那正是加拉太的人被加上的重擔。今天不必勉強原諒誰，也不必立刻再相信誰；你的位置是神藉著基督之恩給的，不是誰的清單給的。請找一位安全的人，慢慢說出你的處境。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天讀一遍第三到五節，讀到「為我們的罪捨己」時停下來，說出一件你覺得還要補上的事，對主說：你已經夠了。"],["p","第二，在紙上寫下你心裡「信耶穌再加上甚麼才算數」的條件，量自己的一欄，量別人的一欄；週末劃掉不是神給的那幾條。"],["p","第三，挑一位你一直怕他不高興的人，長輩、主管或同工，這一週約一個時間，用溫柔、尊重的話說出一句你為了面子一直沒說的真話。"],["p","第四，在你的教會或小組裡，找一位還「不太像我們」的新朋友或回來的人，這一週主動坐到他旁邊，或約他吃一頓飯，不先問他上過哪些課。"],["p","第五，這一週發訊息、回群組之前，先問一句：我這樣說，是為了對方得益處，還是為了讓人覺得我很好？若只是為了面子，刪掉重寫。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：基督為我的罪捨己，他已經給完了，我不需要在他後面再加上甚麼。"],["p","我宣告：神藉著恩典呼召我，我的位置不是誰的清單給的，是他給的。"],["p","我宣告：我只有一位主人，我要用愛說真話，不讓別人的眼光坐在王位上。"],["p","我宣告：神在我身上做的事，要叫人把榮耀歸給神，不是歸給我。"],["d",["要對長輩說一句真話，怎樣說才不算不孝、不算沒禮貌？","第十節不是叫人頂撞長輩。可以這樣預備：第一，先確定這句話是為了對方或為了真理，不是為了出一口氣；第二，挑時間和地點，私下說，不在眾人面前讓長輩下不了台；第三，先說你感謝他、敬重他的地方，再說你的看法，用「我」開頭，例如「我心裡一直有一件事想跟你說」；第四，說完就交給神，不必當場要他同意，也不因為他不高興就收回。若長輩的要求牽涉到信仰的底線，例如要你在基督之外再加上甚麼，你可以溫柔而堅定地說不。若關係裡有長期的控制或傷害，安全優先，請找牧者或專業協助一起想辦法。"]],["h","十、結語"],["p","我們回到那一封家書。父親第一行寫「你先不要簽」，兒子後來說，他讀到那一行就哭了，因為他第一次發現父親那麼怕失去他。保羅省掉感恩、直接說「我希奇」，也是這樣的心。他寧可說最重的話，也不要加拉太人簽下那一份合約：信耶穌，再加上一樣。"],["p","可是這一課的焦點，不在保羅說得多重，也不在我們學會分辨別的福音。焦點在保羅信封裡第一次寫出的那一位：照父神的旨意，為我們的罪捨己的基督。他給得完全，所以不需要我們再補上甚麼；他就是神樂意啟示在一個逼迫者心裡的那一位兒子。國度321空中團契常說的「不再是我，乃是基督」，要到第二章才從安提阿的餐桌上長出來；第一章已經有了最早的樣子：一個被改變的人，人在他身上看見的是神。"],["p","我們一起低頭禱告。藉著基督之恩呼召我們的神，我們很容易在基督後面加上一個「和」字，給自己加，也給別人加；也常讓人的臉色替我們做決定。謝謝你的兒子為我們的罪捨己，已經給完了。求你把他啟示在我們心裡；也求你保守今天心裡被一張清單擋在門外的弟兄姊妹，讓他們知道自己的位置是你給的。願人在我們身上看見的不是我們，是你；但願榮耀歸於你，直到永永遠遠。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰懂得多，是讓每一個人說出心裡那一個「和」字，也說出一位這一週要說真話、要接納的人；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是召、啟、榮。席上可能有曾被教會擋在門外或被屬靈領袖控制過的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：別的福音是在基督後面加一個「和」字；第一個被檢驗的是「我們」；被改變的人叫人歸榮耀給神。"],["n","1. ★ 你第一次去一個新的團體時，有沒有一條沒人明說、後來才發現的規矩？是甚麼？怎麼發現的？"],["n","2. ★★★ 攪擾的人沒有拿掉基督，只是在基督後面加了一個「和」字。請用一句話說：為甚麼加一點點，就成了另一個福音？"],["n","3. ★★ 保羅說「無論是我們，是天上來的使者」，第一個放上檢驗台的是自己。這對今天的講台、小組長和你自己的領受，有甚麼提醒？"],["n","4. ★ 第十五、十六節裡，神有四個動作，保羅自己的動詞很晚才出現。請找出那四個動作，說說這對你看自己的信仰有甚麼意思。"],["m","帶領提醒：第一題輕鬆帶；談到第八、九節時不點名任何宗派或教會，也不讓討論變成批評別人。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出自己心裡那一個「和」字，放在為我們捨己的基督面前，並說出這一週要走的一步。"],["t","【看】看見自己"],["n","5. ★★★ 說出一條你心裡「信耶穌再加上甚麼才算數」的條件，可以是拿來量自己的，也可以是拿來量別人的。它最常在甚麼時候冒出來？"],["t","【聽】聽神說話"],["n","6. ★★ 請把第三到五節慢慢讀兩遍，留意「為我們的罪捨己」和「但願榮耀歸於神」。讀完說一句：這幾節讓你聽見，神怎樣看待你心裡那張清單？"],["t","【想】想通關卡"],["n","7. ★★★ 你遲遲放不下那個「和」字，卡在哪裡：怕單靠恩典不夠保險、怕放下以後會鬆懈，還是捨不得比別人強的感覺？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說一句：「我常在基督後面加上的是……，今天我要對主說，你已經夠了。」右手邊的人只回一句「他已經給完了」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要對他說一句真話的那一個人：他的名字或稱呼、星期幾、在哪裡、用甚麼方式說，以及你打算用哪一句話開頭。"],["m","帶領提醒：這一化可能碰到曾被教會排斥、被屬靈領袖控制、家庭傷害，或為自己過去傷過人而長期無望的人。不追問細節，不要求任何人原諒誰，也不要求誰立刻和誰和好；不對正在流淚的人說「你要有信心」；可以只說方面，不說事件。若有人說出正處在控制或危險中，不在組裡處理，會後單獨關心，告訴牧者，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進這一週的行事曆：一張接納的桌子、一句溫柔的真話、一個要帶的人。"],["n","10. ★★ 說出一位在你的教會或小組裡還「不太像我們」的新朋友或回來的人，這一週哪一天、在哪裡，你要坐到他旁邊或約他吃一頓飯？"],["n","11. ★ 我們的小組或服事團隊，有沒有一條不自覺加給新朋友的條件？說出是哪一條，以及你願意在哪一次聚會提出來，一起把它放回秩序的位置。"],["n","12. ★★ 這一週你要在哪一個群組或對話裡，練習先問「我這樣說，是為了對方得益處，還是為了面子」？說出群組名或對象。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，和這一週哪一天你要向他分享那一位為我們的罪捨己的基督。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，兩千年前有一個人熱心到去追捕基督徒，後來在路上被耶穌親自遇見，整個人翻過來。第二句，他寫信說，耶穌已經為我們的罪把自己給出去，人不必再加上任何條件才配被神接納。第三句，曾被他追捕的人聽見他的改變，沒有稱讚他，卻感謝神。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多接納別人」這類答案；談教會制度只談我們自己。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週，我要對誰說一句真話，我要坐到誰的旁邊。可以只說關係，不必說名字。"],["p","然後彼此代禱，為三種人指名禱告：一位覺得自己還要做得更多神才會接納的人，求主讓他知道基督已經夠了；一位還覺得格格不入的新朋友，求主讓他找到一張接納的桌子；一位從前傷過教會、現在想回來的人，求主賜教會智慧接待他，並保護曾經受傷的人。"],["p","散會以前，請確認紙上寫了三樣：你要劃掉的那一個「和」字、要對他說真話的那一個人、你的那個「2」的名字。下一次帶著這張紙來對。"]]},"2":{"no":2,"vol":"《321加拉太書講義》第二課·加拉太書第二章","title":"那一夜，彼得睡不著——桌、抵、釘","chars":5216,"min":60,"deep":8,"dchars":1667,"tchars":1431,"blocks":[["h","一、那一夜，彼得對自己說的話"],["p","弟兄姊妹平安。接下來這一段話，聖經沒有記載，是我們照著經文，替一個人想像出來的。時間是安提阿一頓晚飯之後的那一夜，說話的人是磯法，也就是彼得。請你聽他說。"],["p","我一向和他們一起吃，餅從同一個籃子拿，湯從同一口鍋舀。坐在我左邊的那位弟兄，幾年前還在廟裡燒香。在哥尼流的家，我親口說過，神已經指示我，無論甚麼人都不可看作俗而不潔淨的。這句話，我到今天也還相信。"],["p","可是今天傍晚，門口進來了幾位從雅各那裡來的弟兄。他們沒有說甚麼，只是看了看我手上的碗，又看了看坐在我旁邊的人。我心裡忽然算起帳來：他們回到耶路撒冷，會怎麼說我？於是我說那邊還有點事，就端著碗坐到另一張桌子去了。我的道理，一個字都沒有改。"],["p","我坐下來，看見巴拿巴也站起來了，其餘的猶太弟兄也一個一個跟了過來。我左邊那一位手上還拿著半塊餅，他沒有生氣，只是看著我，好像終於明白了：原來我們還不夠格。屋子另一頭，保羅沒有動，臉色很難看。"],["p","現在我躺在這裡，睡不著。那一年在大祭司的院子裡，我也是因為怕，說我不認得他。後來主在海邊問了我三次，你愛我嗎。我以為那一種怕已經過去了。原來它只是換了一個樣子：從前怕的是刀，今天怕的是一張臉。"],["p","這一段獨白是想像，可是每一個轉折都在經文裡：「他和外邦人一同吃飯，及至他們來到，他因怕奉割禮的人，就退去與外邦人隔開了。」（2:12）這一課，我們陪著這一個睡不著的人走完加拉太書第二章，用三個字：桌、抵、釘。"],["p","要看懂這一夜，得先往回看幾年。「過了十四年，我同巴拿巴又上耶路撒冷去，並帶著提多同去。」（2:1）一個猶太人、一個沒有受割禮的希臘人，本身就是一張小小的餐桌。「偷著引進來的假弟兄」（2:4）要外邦人受割禮才算數，這是他們的主張，不是保羅的；他們沒有拿掉耶穌，只是在耶穌後面加了一個「和」字。保羅說：「我們就是一刻的工夫也沒有容讓順服他們，為要叫福音的真理仍存在你們中間。」（2:5）請記住這一句。結果柱石們向保羅「用右手行相交之禮」（2:9），只請他們記念窮人。用書信三問來讀，第一問的答案是：加拉太人遇到的，是有人說信耶穌還不夠，要再加上割禮，才能同桌。"],["d",["第二章說的這一次上耶路撒冷，是使徒行傳裡的哪一次？為甚麼這件事有人在意？","學者有兩說。一說是徒 15 的耶路撒冷會議：人物相同，議題相同，都是外邦人要不要受割禮。一說是徒 11:30 送賑濟的那一趟：保羅在第一章正逐次交代他和耶路撒冷的接觸，不會略過一次；這裡是私下的會面，徒 15 是公開的大會；記念窮人正和饑荒的賑濟相合；而且整封信沒有提到徒 15 的決議。本講義略傾向後一說，但兩說都有敬重聖經的學者支持。不論是哪一次，爭的都是同一個問題：信耶穌，還要不要再加上甚麼。詳見議題頁與全卷立場議題「加拉太在哪裡？這封信寫於何時？」。"]],["h","二、一張分開的桌子，一張當著的臉"],["p","「後來，磯法到了安提阿；因他有可責之處，我就當面抵擋他。」（2:11）「他和外邦人一同吃飯」，原文是未完成式：不是吃過一次，是一向如此，一餐又一餐。對一個守潔淨條例長大的猶太人，這等於承認對面坐的是一家人。"],["p","然後門口來了人。彼得沒有宣布新的神學，他只是換了一張桌子。「退去」和「隔開」原文也是未完成式，可以讀成漸漸地退：先少來一次，再坐到另一頭，最後固定在另一張桌子。很多分開都不是一聲巨響，是一步一步的退。原因只有兩個字：「因怕」。不是怕挨打，是怕失去在那個圈子裡的位置。人的自我，最常見的樣子不是張狂，是怕。"],["p","「其餘的猶太人也都隨著他裝假，甚至連巴拿巴也隨夥裝假。」（2:13）「裝假」的字根是戲台上戴面具的演員：心裡知道外邦人是潔淨的，臉上卻演另一套。最叫人心痛的是「甚至連」。巴拿巴「是個好人，被聖靈充滿，大有信心」（徒 11:24），「隨夥」卻是被動的，像被一股水流沖走。好人也會被沖走。"],["p","保羅的診斷不是沒有禮貌，是「行的不正，與福音的真理不合」（2:14），字面是腳走得不直。彼得的道理還是直的，他的腳歪了。所以一張分開的桌子不是禮節的問題，是福音的問題。保羅當眾問他：「你既是猶太人，若隨外邦人行事，不隨猶太人行事，怎麼還勉強外邦人隨猶太人呢？」（2:14）"],["p","「當面抵擋」，原文就是當著他的臉。彼得在看來客的臉色，保羅不看彼得的臉色，他當著那張臉說，不在背後傳話。退是公開的，責備也是公開的，但那是一個問題，不是一場羞辱；分寸議題頁整理過。跌倒的人也沒有被丟掉，後來同一位彼得說：「我們得救乃是因主耶穌的恩，和他們一樣，這是我們所信的」（徒 15:11）。"],["p","請想一個今天的畫面。公司尾牙，你本來和一位剛進公司、不太會說話的同事坐一桌；經理那一桌有人向你招手。你說我過去敬個酒，然後就沒有再回來。他一個人把那一盤菜吃完。沒有人講一句道理，桌子已經在講道了。"],["d",["保羅公開抵擋彼得，是不是表示我們也可以在網上、在會議上公開批評領袖？","要分清楚兩種錯。彼得的退去是公開的，而且影響了整間教會對福音真理的認識，所以保羅公開處理；但他是當著彼得的臉說，不是背後傳話；他說的是一個問題，不是一場羞辱。一般的得罪，仍要照主的吩咐，「趁著只有他和你在一處的時候，指出他的錯來」（太 18:15）。所以先問自己：這是私人的得罪，還是公開影響福音的錯？我先當面談過了嗎？目的是挽回人，還是贏一場？屬靈權柄的分寸，回指哥林多後書立場三。"]],["h","三、不是因行律法：基督不是徒然死的"],["p","保羅問完那一句，話沒有停：「我們這生來的猶太人，不是外邦的罪人；」（2:15）他說的是「生來的猶太人」，不是「從前的猶太人」。加拉太書不是一本反猶太的書；問題不在民族，在把一個身分記號當成同桌的條件。"],["p","接著一轉：「既知道人稱義不是因行律法，乃是因信耶穌基督，連我們也信了基督耶穌」（2:16）。請聽那三個字：連我們。連有律法、受了割禮的我們，也得空著手來到基督面前。猶太人也是因信稱義，外邦人又何必先變成猶太人？餐桌的問題，根子是福音的問題。「稱義」是法庭的字，宣告的是神；「因為凡有血氣的，沒有一人因行律法稱義。」（2:16）"],["p","「律法的行為」指甚麼，傳統讀法和保羅新觀各有強調，議題頁有整理。本講義站在宗教改革的底線：稱義是神白白的恩典，單單因信；也接受新觀的提醒：在加拉太，因信稱義的第一個結果，是猶太人和外邦人可以一起吃飯。今天兩種加法都還在：一種說你要做到這些，神才喜悅你；一種說你要像我們，才算自己人。"],["p","攪擾的人反駁：你們和外邦人同桌，不就成了罪人？保羅只回：「難道基督是叫人犯罪的嗎？斷乎不是！」（2:17）又說：「我素來所拆毀的，若重新建造，這就證明自己是犯罪的人。」（2:18）彼得端著碗走開，就是把拆掉的牆砌回去。護欄也要放：不是因行律法，不等於行為不重要；我們不是靠這些得救，是得救了才活出這些。"],["p","這一段怎樣收尾？我們先跳過最熟的那一節，看最後一句：「我不廢掉神的恩；義若是藉著律法得的，基督就是徒然死了。」（2:21）「廢掉」是把合約宣告作廢的字。「徒然」平常的意思是白白地，恩典是白白給的；在這裡卻是另一面：白死了。攪擾的人沒有拿掉十字架，只是在後面加一點點；保羅說，加一點點，十字架就成了多餘的。"],["p","所以每一張分開的桌子，都在無聲地說：基督的死還不夠，他那樣的口音、那樣的過去，還要再加一點才夠格。怎樣才醫得好？保羅的答案不是「彼得，你要更勇敢」，是一個已經發生的事實。"],["d",["「保羅新觀」說律法的行為主要指割禮、飲食這些身分記號，那因信稱義是不是被推翻了？","沒有被推翻。新觀提醒我們，加拉太的爭議確實圍著割禮和餐桌打轉，這是對的；但 2:16 末句回響詩篇「凡有血氣的」在神面前都不能稱義，3:10 起講的是律法的咒詛，說的是罪人在神面前的處境，不只是族群的界線。所以本講義站在宗教改革的底線：稱義是神白白的恩典，單單因信，不靠任何人的作為；同時吸收新觀的提醒：在加拉太，稱義也是一張餐桌，被稱義的人可以一起吃飯。兩面合起來，正好擋住兩種加法：用表現賺神的喜悅，用身分把人擋在門外。學術上的細節見議題頁與全卷立場議題「律法、稱義與『因信』」。"]],["h","四、原文亮光：同釘、不再是我、為我捨己"],["p","先讀前一節：「我因律法，就向律法死了，叫我可以向神活著。」（2:19）「死了」是 ἀπέθανον（apethanon），不定過去式，一次過去的事：不是我正在努力死，是我已經死過了。律法的判決落在基督身上，也落在與他聯合的我身上。一個死過的人不再怕法官，判決已經執行過了。彼得還怕那些眼光，保羅說，我向那些眼光已經死了。"],["p","這裡有一個分節的小秘密。希臘文聖經 SBLGNT 把 2:19 讀到 Χριστῷ συνεσταύρωμαι（Christō synestaurōmai）為止，和合本卻把「我已經與基督同釘十字架」放在 2:20 句首。照原文的切法，同釘是「向神活著」的方法；照和合本的切法，它是「不再是我」的原因。連起來讀才完整。現在我們整句讀，一個字都不省：「我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信神的兒子而活；他是愛我，為我捨己。」（2:20）"],["p","第一個字：συνεσταύρωμαι（synestaurōmai），完成式，又是被動。完成式是說已經被釘了，到今天仍然是；被動是說，是被釘的，不是自己釘的。很多認真的弟兄姊妹把它聽成每天的功課：我要努力把自己釘死，今天又沒有釘好。那就又成了一張成績單。不是我每天把自己再釘一次，是我每天承認，我已經在那裡了；這是神作的事。"],["p","第二句：ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός（zō de ouketi egō, zē de en emoi Christos）。兩句都以「活」起頭，主詞放在句末，ἐγώ（egō）換成了 Χριστός（Christos）。保羅沒有說我不再活，他說活著的不再是我：活還在，主人換了。接著又是「我如今在肉身活著」，保羅仍然吃飯、寫信、生氣、流淚。數一數這一節有幾個「我」：我已經、我裡面、我如今、愛我、為我。"],["p","第三個字在句末：παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ（paradontos heauton hyper emou），把自己交出去，為了我；前面的 τοῦ ἀγαπήσαντός με（tou agapēsantos me）是不定過去式，指向十字架那一次的愛。「信神的兒子」也可以讀成「神兒子的信實」，本講義照和合本讀，但它提醒我：我能信，是因為他先信實。說這句話的，是曾經逼迫教會的人。這一節的意思不是我消失了，是我被愛了。"],["p","回到那一夜。彼得為甚麼站起來？因為那張臉還在他心裡作主。要靠別人的眼光保住自己的人，就得不停地換桌子；一個已經與基督同釘、被他愛著的人，價值已經在十字架上定了，可以和任何人同坐。也請記得 2:5：寫這一節的人一刻也沒有容讓。被基督愛著的人不是沒有骨頭，是骨頭換成了基督的。"],["d",["主耶穌說要「天天背起他的十字架」，這和「已經同釘十字架」不是互相矛盾嗎？","不矛盾，是兩個不同的動作。主說：「若有人要跟從我，就當捨己，天天背起他的十字架來跟從我。」（路 9:23）這是門徒每天的跟隨。2:20 說的是一個已經發生的聯合：我已經與基督同釘，完成式被動，是神作的。前者是在後者的根基上走出來的：因為我已經和他同死同活，所以我每天可以不再為自己活，跟著他走。若倒過來，以為背得夠重、釘得夠深才換到與基督聯合，恩典就又變回了成績單。每天的功課是承認，並且順著聖靈而行，不是再釘一次。"]],["d",["「信神的兒子」也可以讀成「神兒子的信實」，這兩種讀法對我的生活有甚麼不同？","這是原文屬格的兩種讀法。和合本讀成「信神的兒子」，以他為信的對象；另一說讀成「神兒子的信實」，就是他順服到十字架的那份忠誠，理由是緊接的兩個動作都是兒子作的：他愛了我，他捨了自己。本講義照和合本解經，但兩面都可以放在心裡。第一，我要信，信是投靠，不是旁觀。第二，我的信不是另一種功勞；我能信，是因為他先信實。軟弱的時候，不必先問我信得夠不夠用力，先抬頭看那一位：他愛了我，沒有反悔。詳見議題頁。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把「不再是我」講成我不重要、我的感受不重要、我的需要不必說。同一口氣保羅說「他是愛我，為我捨己」；被愛的人不能是不存在的人。只引上半句，等於把這一節剪掉一半。"],["p","第二個偏差，是把「同釘十字架」講成你每天要努力把自己釘死，今天又沒有釘好。動詞是完成式被動，已經被釘，是神作的；每天的功課是承認它，並且順著聖靈而行。"],["p","第三個偏差，是把「基督在我裡面活著」講成我的想法、我的感動就是基督的想法，或領袖用它要人不可質疑。同一章，一位被基督充滿的使徒被當面抵擋；正因為基督在我裡面活，我才能被糾正。"],["p","第四個偏差，是用這一節叫受傷害的人忍，不可以說不、不可以離開危險、不可以求助。寫這一節的人「一刻的工夫也沒有容讓」，又當面抵擋了彼得；那位主是愛我、為我捨己的，不是替加害者撐腰的。如果有人一邊傷害你，一邊要你不再有自己，那不是加拉太書第二章。"],["p","第五個偏差在兩頭：一頭是把新的規條當成進門的條件，說真正的自己人一定要守某一套才算數；另一頭是說既然不靠行律法，怎麼活都可以。也不要把安提阿講成猶太人愛分桌，或把「假弟兄」丟給意見不同的人；問題在加上的那一個條件。"],["d",["我在家裡長期被傷害，有人用這一節勸我要「不再是我」、要忍，我該怎麼辦？","請先聽清楚：那不是加拉太書第二章。寫這一節的保羅，對要人作奴僕的假弟兄一刻也沒有讓步，對彼得的錯也當面說出來；而那一節的下半句說，神的兒子愛你，為你捨己。被這樣愛著的人，可以說不，可以離開危險，可以求助。實際上，第一，先確認自己和孩子是否安全，有立即的危險就撥打當地的緊急電話。第二，找一位信得過的人說出來，組長、牧者、輔導，或社工與法律協助。第三，不必急著原諒，也不必立刻和好；原諒和回到危險裡是兩件事。組長若聽到這樣的事，不在組裡處理，會後單獨關心，陪他找專業協助。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：面子決定座位。年夜飯上，你把飯前禱告縮成心裡的一秒；公司聚餐，主管開了一個你不舒服的玩笑，你也跟著笑；家族群組裡那一位離過婚的表姊，你漸漸不回她的訊息。教會裡也一樣：國語堂、粵語堂、英語堂分開聚會，可以是為了福音的方便，讓阿嬤和孩子都聽得懂；可是若幾個堂從不一起吃飯、一起禱告，提到對方總說「他們那邊的」，那就不再是分堂，是彼得那一張分開的桌子。合一不是大家都一樣，但合一一定要落在桌上。"],["p","第二個問題：以和為貴、凡事要忍。媳婦受了委屈，被勸要忍；同工被長輩當眾羞辱，被勸要謙卑；有人在家裡受了傷害，還被教會的人勸：你要不再是你自己，就不要計較。這一章把這條路堵住了。保羅為了別人的福音一刻也沒有讓步，看見錯就當著那張臉說。叫受害的人閉口不是忍耐，是把十字架借給加害的人用。說不、離開危險、找人幫忙，常常正是讓那位愛你的主作主的一步。"],["d",["我們教會有不同語言堂，這樣算不算彼得那一張分開的桌子？","分堂本身不等於分桌。語言分堂可以是為了福音的方便，讓阿嬤和孩子都聽得懂；第 2:9 的右手相交，本來就有分工：不同的工場，同一個福音。問題在分工有沒有變成分家。可以用三個問題自己檢查：各堂最近一次一起吃飯、一起禱告是甚麼時候？重要的決定，各堂有沒有一起坐在桌邊？提到另一個堂，我們的語氣是「我們」，還是「他們那邊的」？三題都答不出來，就是一張分開的桌子了。第一步可以很小：一次一起的愛筵，同工會裡有各堂的代表。全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」。"]],["h","七、活出321——坐回那一張為我捨己的桌子"],["p","走到這裡，我們才把國度321空中團契那一句話接上去：無己不再是我乃是基督，不是我自己活乃是基督在我裡面活。它是從這一節來的，根卻不在口號裡，在下半句；所以每一次說它，都要把整句讀完：「現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信神的兒子而活；他是愛我，為我捨己。」（2:20）無己，不是我努力變得沒有自己，是我被一位捨己的主愛到，不必再為自己活。"],["p","耶穌是我的榜樣：法利賽人議論他，「這個人接待罪人，又同他們吃飯」（路 15:2）。主從不為了名聲換桌子，卻也不是沒有骨頭，他在聖殿推翻桌子。他的自由從父的愛來：「沒有人奪我的命去，是我自己捨的」（約 10:18）。"],["p","聖經是我的準則：次序不可倒過來。先看見安提阿的桌子，先聽見基督不是徒然死的，那一句才長得出來；「不再是我」永遠連著「為我捨己」。"],["p","聖靈是我的引導：已經同釘了，每天的功課是承認，並且「順著聖靈而行」（5:16）。哪一張桌子要坐回去，哪一段傷害你的關係要先保持距離，求聖靈給你分辨的心。"],["p","讓耶穌作王：讓出兩個位置。一個是別人的臉在我心裡的寶座，那張臉曾叫彼得退去；一個是門口守門人的鑰匙，我習慣替神決定誰夠格同桌。讓他作王不是讓我消失，是讓愛我的那一位作主。"],["p","讓耶穌得著一切的榮耀：保羅說他「只誇我們主耶穌基督的十字架」（6:14）。基督不是徒然死的；被接納的人，見證裡最大的名字不是自己多勇敢，是為我捨己的主。"],["p","建立屬神的體系：讓相交的右手成為教會的樣子：各語言堂、各世代可以分工，卻要定期同桌，一起吃飯、禱告、作決定；建立當面說、也說得出愛的糾正文化；把記念窮人寫進預算；同工訓練裡明說，無己從來不是叫受傷的人閉口。"],["h","八、四種心，坐在同一張桌子旁"],["p","驕傲型的心，常常是那個守門人。我不說你不夠格，可是我會量：背景、口音、讀經的天數、服事的時數。這一章只問一句：「連我們」也是空著手來的，你手上那一張成績單，在神的法庭上值多少？基督若不是徒然死的，你也不必替他把門。"],["p","恐懼型的心，最像那一夜的彼得。道理都對，只是在某些桌子上，信仰會自動降低音量。請聽那個完成式：你已經與基督同釘了，不必再靠別人的臉色活。他是愛你，為你捨己；被這樣愛著的人，可以留在原來的位子上。"],["p","羞恥型的心，像那一位手上拿著半塊餅的外邦弟兄。被人冷落過、被人說過你們那邊的，你早就認定：我大概還不夠格。可是 2:20 那一個「我」，也包括你。神的兒子愛的，偏偏是曾經逼迫教會的保羅，也是你。沒有人能替你在這張桌子上蓋一個作廢的章。"],["p","受傷型的心，也許被人用「不再是我」叫你忍過，或在你說出傷害之後，被勸要原諒、要和好。那不是這一章的意思。保羅一刻也沒有讓步，那位主為你捨己，不要你被傷害。今天不必勉強原諒誰，也不必立刻回到那一張桌子；若你正處在危險裡，請先告訴一位信得過的人，讓人陪你找到安全和專業的幫助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上整句讀一次 2:20，讀到「他是愛我，為我捨己」時，把「我」換成你的名字再讀一次，然後說：主啊，我已經與你同釘十字架了，今天我不必靠別人的臉色活。"],["p","第二，找出一張你慢慢退出的桌子，或教會飯堂裡常常一個人吃飯的人；選定一天，約他吃一頓飯或喝一杯茶，只為了坐在一起。"],["p","第三，這七天，每當你因為別人的眼光換了位子、藏起信仰，就記下時間、地點和那張你怕的臉；週末帶到主面前，承認那個位置還在作王。"],["p","第四，若你曾在背後轉述某一位弟兄姊妹的事，這一週當面溫和地和他談，或停止再轉述；若你一直在一段傷害你的關係裡忍著，這一週向一位信得過的人說出來。"],["p","第五，照 2:10 記念窮人：為一個有經濟難處的家庭預備一份實際的幫助，一袋米、一張車票，或陪他辦一件事。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我已經與基督同釘十字架，這是神作成的事，我不必每天再釘一次。"],["p","我宣告：活著的不再是我，乃是基督在我裡面活著；他是愛我，為我捨己。"],["p","我宣告：基督不是徒然死的，我不在恩典後面加任何條件，也不替神把門。"],["p","我宣告：被愛的人不必靠臉色活，我要坐回那一張桌子，也可以向傷害說不。"],["d",["我想約一位疏遠了的人同桌吃飯，可是很尷尬，具體要怎麼開口？","不必準備一篇講章，也不必先解釋過去為甚麼疏遠。第一，選一個簡單的約，說出具體的日子，例如「星期四中午有空嗎？我請你吃個飯」。第二，坐下來先問他最近好不好，聽他說完，不急著傳講甚麼，也不急著轉到教會的事。第三，如果你知道自己曾經冷落他，可以簡短地說一句：「這陣子我比較少找你，對不起。」不必多說。第四，散的時候說一句「下次再一起吃」。若對方曾經傷害你，這一題不必勉強，先照顧好自己的安全，和組長談過再決定。"]],["h","十、結語"],["p","我們回到那一夜。彼得睡不著，因為他看見了半塊餅，也看見了自己。經文沒有告訴我們他當下怎樣回答，可是幾年以後在耶路撒冷，他說我們得救是因主耶穌的恩，和他們一樣。那個怕臉的人，坐回那一張桌子了。"],["p","可是這一課的焦點，不在彼得多軟弱，也不在保羅多勇敢，更不在我們學會一句團契的話。焦點在保羅寫下的那一行字：神的兒子，為我捨己。為站起來的彼得，為被沖走的巴拿巴，為拿著半塊餅的外邦弟兄，也為寫信的保羅。他的死夠讓所有的人同坐一桌。你不必更佩服保羅，只要更認識這一位愛你、為你捨己的主。"],["p","我們一起低頭禱告。愛我們、為我們捨己的主，我們很會看臉色，常常悄悄換了桌子；我們也很會守門，替你決定誰夠格。謝謝你已經把我們和你一同釘在十字架上。求你醫治心裡還在怕的人，叫他們坐回原來的位子；也保守正被人用你的名字要求忍受傷害的人，讓他們知道你愛他們，身邊有人陪他們找到安全。活著的不再是我們，乃是你在我們裡面活著。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰的見證屬靈，是讓每一個人說出一張自己慢慢退出的桌子，也說出這一週要坐回去的那一個人；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是桌、抵、釘。席上可能有被排擠的人，也可能有正被人用「你要無己」要求忍受傷害的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：分開的桌子是福音的問題；在恩典後面加條件，基督就是徒然死了；同釘是神已經作成的事，「不再是我」永遠連著「他是愛我，為我捨己」。"],["n","1. ★ 說一張你記得最清楚的餐桌：年夜飯、學校的午餐、第一次去朋友家吃飯。那一桌誰坐在你旁邊？你自在，還是緊張？"],["n","2. ★★★ 彼得一個字的道理都沒有改，保羅卻說他「與福音的真理不合」。請用一句話說：為甚麼換一張桌子，會是一個福音的問題？"],["n","3. ★★ 保羅說「義若是藉著律法得的，基督就是徒然死了」。請說出一個今天教會裡常見的「信耶穌再加上」，它怎樣在說基督的死還不夠？"],["n","4. ★★ 「同釘十字架」是完成式被動。這和「我每天要努力把自己釘死」有甚麼不同？兩種想法過起日子來有甚麼不一樣？"],["m","帶領提醒：第一題輕鬆帶；討論 2:20 時，請組員整句讀出下半句，不要停在「不再是我」。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出一張自己慢慢退出的桌子、一張自己怕的臉，並在「他是愛我，為我捨己」裡，說出這一週要坐回去的地方。"],["t","【看】看見自己"],["n","5. ★★★ 你最近一次因為怕別人怎麼看你，而換了位子、沒有出聲，或沒說自己是基督徒，是在哪一個場合？你怕的是誰的臉？"],["t","【聽】聽神說話"],["n","6. ★★ 請把 2:20 整句慢慢讀兩遍，第二遍把「我」換成你自己的名字。讀完說一句：讀到「他是愛我，為我捨己」時，你聽見神怎樣看你？"],["t","【想】想通關卡"],["n","7. ★★★ 你不敢坐回那一張桌子，或不敢對傷害說不，卡在哪裡：怕失去位置、怕衝突，還是覺得說不就不屬靈？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我已經與基督同釘十字架，他是愛我，為我捨己；我不必再靠……的臉色活。」右手邊的人只回「他也愛我」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週要坐回去的那一張桌子：對象的名字、星期幾、在哪裡。若你正在一段傷害你的關係裡，改寫下你要告訴的那一位信得過的人，和哪一天。"],["m","帶領提醒：無己不是要受傷的人忍受傷害。這一化可能碰到家庭傷害、職場欺壓或屬靈控制；不追問細節，不要求任何人原諒誰或回到傷害他的關係裡，不對正在流淚的人說「你要有信心」。若有人說出正處在危險中，不在組裡處理，會後單獨關心，先確認他是否安全，必要時協助尋求專業協助。不要帶任何人「把自己再釘死一次」；每一題都回到那一句：他是愛我，為我捨己。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：每天整句讀 2:20、一次同桌、一次當面談話、一個要帶的人。"],["n","10. ★★ 你的小組最近一次和另一個語言堂或世代一起吃飯禱告，是甚麼時候？說出這個月你可以提出的一個安排，和要去找誰談。"],["n","11. ★ 有沒有一位你在背後轉述過他的事的弟兄姊妹？說出你哪一天要當面溫和地和他談，或從今天起停止轉述。"],["n","12. ★★ 照 2:10 記念窮人：說出一個有經濟難處的家庭，這一週哪一天，你要送去甚麼實際的幫助？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，說出這一週哪一天你要約他同桌，並向他分享：神的兒子愛他，為他捨己。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，兩千年前有一位大領袖，因為怕別人的眼光，在飯桌上悄悄離開了他的朋友。第二句，另一位寫信說，醫好這種怕的不是更勇敢，是知道耶穌已經替我死，我不必靠別人的臉色活。第三句，那封信說，耶穌愛我，為我捨己，所以甚麼人都可以和他同坐一桌。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多接納別人」這類答案；若對方曾傷害組員，不勉強同桌。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要約誰同桌。可以只說關係。"],["p","然後彼此代禱，為三種人指名禱告：一位常常一個人吃飯的人，求主讓他被接納；一位被臉色拉扯的領袖，求主給他說真話、也被提醒時謙卑的心；一位以為只能一直忍受傷害的人，求主讓他知道自己被愛，也讓你陪他找到安全與專業的幫助。"],["p","散會以前，確認紙上寫了三樣：要坐回去的桌子、要當面談或要告訴的人、你的那個「2」。下次帶來對。"]]},"3":{"no":3,"vol":"《321加拉太書講義》第三課·加拉太書第三章","title":"引我們到基督那裡——告示、木頭、書包","chars":5099,"min":60,"deep":8,"dchars":1801,"tchars":1378,"blocks":[["h","一、查經班裡的一場爭論"],["p","弟兄姊妹平安。建華把聖經往桌上一放，說：「既然得救是因信，不是靠行律法，那十誡還要不要守？舊約那些條例，是不是整本跳過去也沒關係？」坐在對面的美玲馬上接話：「不能這樣講。不守規矩，怎麼叫信主？我們小組規定每天讀三章，就是怕大家隨便。」"],["p","建華不服氣：「那讀不到三章的人呢？他就不算數了嗎？」美玲停了一下，說：「我沒有這樣說……可是總要有個標準吧。」那天的查經，就在不太高興的氣氛裡結束了。"],["p","請你留意，這兩個人都愛主，也都說對了一半。建華怕的是把恩典變成功課；美玲怕的是把恩典變成放縱。兩千年前，加拉太的教會裡也有一模一樣的爭論，只是題目不是讀幾章，是受不受割禮。保羅在這一章裡替他們把問題問了出來：「這樣說來，律法是為甚麼有的呢？」（3:19）今天這一課，我們就帶著建華和美玲的問題，把第三章走一遍。"],["p","保羅一開口不是答案，是一聲喊叫：「無知的加拉太人哪，耶穌基督釘十字架，已經活畫在你們眼前，誰又迷惑了你們呢？」（3:1）攪擾他們的人並沒有叫他們不信耶穌，只是說：信耶穌很好，再加上割禮才完全。他們沒有拿掉基督，只是在基督後面加了一個「和」字；這個主張是他們的，不是保羅的。"],["p","接著保羅只問一件事：「我只要問你們這一件：你們受了聖靈，是因行律法呢？是因聽信福音呢？」（3:2）加拉太人是外邦人，沒有受過割禮，也沒有守過摩西的律法，卻受了聖靈。答案已經在他們自己的經歷裡。所以他再問：「你們既靠聖靈入門，如今還靠肉身成全嗎？」（3:3）"],["p","這一句是建華和美玲都要聽的。對美玲說：入門的是聖靈，往後走下去的也是聖靈，每天三章是好事，卻不是第二道門。對建華說：保羅問的是「靠甚麼成全」，不是「要不要成全」。第五節的「賜給」原文是現在分詞：神一直在供應，不是入門那天給一次就交給你自己撐。"],["d",["既然得救不靠行律法，十誡和舊約的誡命今天還要不要守？","要分清楚兩件事：得救的條件，和得救之後的生命。第三章說得很清楚，沒有一個人靠律法在神面前稱義，所以十誡不是進門的門票。可是保羅也說律法「是聖潔的」，它像那位提書包的家奴，把我們帶到基督那裡。進了家門以後，律法沒有變成廢紙，它所指向的愛神愛人，在聖靈的果子裡被成全；所以第五章說全律法都包在「愛人如己」這一句之內。基督徒當然要守，只是理由換了：不是怕被趕出去，是因為已經是兒女，願意活得像父親。禮儀和飲食條例怎樣看，議題頁有整理。"]],["d",["我們小組規定每天讀三章聖經，這樣算不算「靠肉身成全」？","規定本身不是問題，問題是它在你心裡站在甚麼位置。用三個問題檢查。第一，沒讀完的那一天，你是覺得少吃了一頓飯，還是覺得神不要你了？前者是果子，後者就變成了門票。第二，你會不會用這個數字量別人，心裡把人分成讀完的和讀不完的？第三，新來的朋友聽見這個規定，是覺得被邀請，還是覺得自己還不夠格？如果答案都還健康，就繼續讀，讀經是聖靈供應我們最常用的管道。如果已經變成重擔，可以換個說法：「我們一起每天到主面前」，讀得少的人也被歡迎。這就是第三節的意思：入門的是聖靈，走下去的也是聖靈。"]],["h","二、亞伯拉罕的那一夜：兩群人"],["p","講完加拉太人的經歷，保羅把他們帶回一個更早的晚上：「正如『亞伯拉罕信神，這就算為他的義』。」（3:6）這是創世記第十五章。本系列創世記講義第十五章講過那一夜：亞伯蘭年紀老了，沒有兒子，神領他到帳棚外面數天上的星。經上說：「亞伯蘭信耶和華，耶和華就以此為他的義。」（創 15:6）"],["p","攪擾的人的王牌是創世記第十七章割禮的約，保羅請大家往前翻兩章：亞伯拉罕被算為義，是在割禮以前，也在律法頒佈以前四百多年。「算為」是記帳的字，記帳的是神。信不是功勞，信是伸出手，把神放在桌上的東西接過來。"],["p","於是保羅給這一章分出兩群人。一群叫「以信為本的人」：「所以，你們要知道：那以信為本的人，就是亞伯拉罕的子孫。」（3:7）而且應許從一開始就包括外邦人：「萬國都必因你得福。」（3:8）不是萬國先變成猶太人才能得福，是萬國在亞伯拉罕裡得福。第九節說他們「和有信心的亞伯拉罕一同得福」：不是坐偏桌，是同一張桌子。"],["p","另一群叫「以行律法為本的」：「凡以行律法為本的，都是被咒詛的」（3:10）。這是全章最刺耳的一句。保羅接著引申命記：「凡不常照律法書上所記一切之事去行的，就被咒詛。」（3:10）律法不是自助餐，不能挑幾道菜；選了割禮作進門的條件，就等於簽下整份合約。"],["p","第十一、十二節把兩條路擺在一起。一邊是「義人必因信得生」（3:11），一邊是「行這些事的，就必因此活著」（3:12）。一條說「我接受」，一條說「我做到」。律法像一面鏡子，照得出臉上的污點，卻不能替你洗臉。這一段學者讀法不同，議題頁有並陳；我們只抓住一件事：沒有人能站在「我做到了」上面面對神。"],["p","所以美玲說「總要有個標準吧」，答案是：有，而且高到沒有人達得到。這正是為甚麼我們需要下一節。"],["d",["舊約時代沒有耶穌，那時的人到底是怎樣得救的？","第三章的答案就是亞伯拉罕。他活在律法頒佈以前，也活在耶穌降生以前，卻因為信神的應許被算為義。舊約的人不是靠守律法得救，也是因信；只是他們信的是神所應許、還沒有來到的那一位，我們信的是已經來了的那一位。所以保羅說，聖經早就預先傳福音給亞伯拉罕。律法在那個時代有它的功用：把罪照出來，看守百姓，指向將要來的基督；可是律法本身從來沒有能力叫人得生命，第二十一節說得很清楚。所以舊約的聖徒和我們是同一個家，用同一道門進來。所以我們不能輕看舊約。"]],["h","三、原文亮光：成了咒詛、買出來、提書包的人"],["p","律法的判決是真的，一個字也沒有作廢。然後第十三節沒有任何連接詞，一個名字突然出現：「基督既為我們受了咒詛，就贖出我們脫離律法的咒詛；因為經上記著：『凡掛在木頭上都是被咒詛的。』」（3:13）我們拆三個字。"],["p","第一個是 κατάρα（katara），咒詛。請看和合本這一節的小字註腳：「受了咒詛」原文是「成了」咒詛。前面的 γενόμενος（genomenos）是「成為」，後面接的是名詞，不是形容詞。保羅不只說基督被咒詛，他說基督成了咒詛本身。本系列哥林多後書講義第五章講過另一句一樣驚人的話：「神使那無罪的，替我們成為罪」（林後 5:21）。不是他變成了罪人，是他站進了罪和咒詛的位置。咒詛沒有被一筆勾銷，是被他擔下了。"],["p","這裡要畫一條線。十字架不是一位憤怒的父親懲罰一個無辜的兒子；保羅說的是「為我們」，原文 ὑπὲρ ἡμῶν（hyper hēmōn），替我們。父和子是同一個心意。所以引樞紐那一節，一定要連下半句一起引：「我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信神的兒子而活；他是愛我，為我捨己。」（2:20）"],["p","第二個字是 ἐξηγόρασεν（exēgorasen），贖出。字根是市場，用在把奴隸從市場上買出來；不定過去式，一次完成。加拉太人想走回律法底下，就像被贖出來的人又自己走回市場。贖出來的目的寫在第十四節：「這便叫亞伯拉罕的福，因基督耶穌可以臨到外邦人，使我們因信得著所應許的聖靈。」（3:14）應許的終點，是神的靈住進人裡面。"],["p","第三個字是 παιδαγωγός（paidagōgos），在第二十四節：「這樣，律法是我們訓蒙的師傅，引我們到基督那裡，使我們因信稱義。」（3:24）和合本譯「訓蒙的師傅」，原文卻不是老師。在那時有錢人的家裡，他是一個家奴：每天早上牽著主人家孩子的手，提著書包，把他送到學堂門口，路上管規矩。他不是父親，家業也不是從他手上來的。孩子長大了，他的工作就做完了。"],["p","這個字同時回答了建華和美玲。對建華說：這個家奴是父親派來的，看管本身也是愛，律法不是壞人，第二十一節保羅自己說「斷乎不是」。對美玲說：「我們從此就不在師傅的手下了。」（3:25）長大的兒子不再需要人牽著過馬路，不是因為馬路變安全了，是因為他裡面有了判斷；第五章會告訴我們，那是聖靈的引導。"],["d",["有人說要斷開祖宗的咒詛才能蒙福，第十三節是這個意思嗎？","不是。第十三節說基督已經替我們成了咒詛，把我們贖出來；「贖出」是不定過去式，一次完成的事。如果還要我們一次又一次追查家族的罪、一代一代去斷，等於說十字架只做了一半，又在基督後面加了一個條件，這正是第三章要拆掉的東西。家族裡酗酒、暴力、冷漠的模式確實會一代傳一代，需要悔改與幫助，有時也需要專業協助；但那是在已經得自由的身分裡長大，不是在咒詛底下設法逃出來。讓人走出去時更依賴一次又一次的儀式的教導，就要小心了。"]],["d",["說基督「成了咒詛」，聽起來好像天父很殘忍，該怎樣理解？","這是很誠實的問題，特別是被父親傷過的人。先看保羅自己的用詞：基督是「替我們」成了咒詛，在樞紐那一節他說「他是愛我，為我捨己」。主耶穌自己也說，沒有人奪他的命去，是他自己捨的。所以十字架不是一位憤怒的父親拿無辜的兒子出氣，而是父與子同一個心意，要把人從咒詛裡救出來；父差兒子來，兒子甘心走到木頭上。神學上怎樣理解代替的意義，議題頁有幾種說法並陳。教學場上請記住一句：咒詛是真的，愛也是真的；判決沒有被取消，是被一位愛你的主擔下了。若你讀到這裡心裡很痛，可以先停在「他是愛我」這幾個字上。"]],["h","四、一份遺囑、一張限速牌、一件衣服"],["p","第十五到十八節，保羅換了一個親切的稱呼：「弟兄們，我且照著人的常話說：雖然是人的文約，若已經立定了，就沒有能廢棄或加增的。」（3:15）「文約」在當時的日常生活裡就是遺囑。一份遺囑生效了，旁人不能作廢，也不能在後面加條款。攪擾的人沒有說應許作廢，他們做的正是在後面加一條：還要受割禮。"],["p","而且這份遺囑早在律法以前四百三十年就立好了：「神是憑著應許把產業賜給亞伯拉罕。」（3:18）「賜給」是完成式，禮物已經送出去，而且一直有效。禮物不會因為後來多了一張清單，就變成了貸款。"],["p","那律法到底做甚麼？「原是為過犯添上的，等候那蒙應許的子孫來到」（3:19）。沒有限速牌的時候，超速只是開得快；牌子一豎起來，超速就是違規。律法不製造罪，它把罪照出來，而且有期限。第二十二節說：「但聖經把眾人都圈在罪裡，使所應許的福因信耶穌基督，歸給那信的人。」（3:22）把所有人關在同一個地方，是為了用同一把鑰匙放所有人出來。那把鑰匙是信；而我們能信，是因為他先信實。"],["p","然後是這一章的山頂。「所以，你們因信基督耶穌都是神的兒子。」（3:26）「你們受洗歸入基督的都是披戴基督了。」（3:27）割禮只有男人能受；洗禮，猶太人、外邦人、男的、女的都一樣受。接著是：「並不分猶太人、希臘人，自主的、為奴的，或男或女，因為你們在基督耶穌裡都成為一了。」（3:28）這三組正是那個時代最深的三道牆。"],["p","請聽清楚：合一不是一樣。「成為一」的「一」原文是陽性，不是一樣東西，是一個人。保羅沒有叫猶太人變成希臘人，也沒有叫女人變成男人。披戴基督，是同一件衣服穿在不同的身體上：說閩南語的、說英語的、說馬來語的。衣服沒有把身體換掉，可是人一看，認出來的是那件衣服。所以這一節不能拿來抹平差異，也不能反過來拿差異替排斥找理由。語言分堂可以是為了福音的方便，卻不可以變成彼得在安提阿那一張分開的桌子。"],["p","「或男或女」在教會裡的分工有互補、平等兩種看法，都是敬重聖經的弟兄姊妹，議題頁並陳；兩邊都必須同意，任何貶低女性的講法都違背福音。最後一節：「你們既屬乎基督，就是亞伯拉罕的後裔，是照著應許承受產業的了。」（3:29）這是外邦人被接進來，不是猶太人被趕出去；保羅在羅馬書說得很清楚：「神棄絕了他的百姓嗎？斷乎沒有！」（羅 11:1）"],["d",["第二十八節說不分男女，那教會裡到底可不可以有女牧師？","這一題在華人教會裡有真實的分歧，兩邊都是敬重聖經的福音派。互補派認為，第二十八節講的是在基督裡同為兒女、同承產業的平等，並不取消神在家庭和教會裡所設的分工；平等派認為，這一節是保羅的原則，男女都可以按恩賜擔任一切職分。本講義兩邊並陳，不替各教會作決定，詳細的經文與理由請看議題頁。可是在這一課裡，兩邊都必須同意幾件事：第一，女性在基督裡是完全的兒女，不是次一等的成員；第二，任何貶低、輕看女性的講法都違背福音；第三，不同看法的弟兄姊妹仍然坐在同一張桌子上。組裡看法不同時，請帶回第二十七節：我們披戴的是同一位基督。"]],["d",["保羅說「自主的、為奴的」都成為一，為甚麼他不乾脆主張廢除奴隸制？","保羅活在羅馬帝國，奴隸佔人口很大的比例，一封寫給小教會的信不可能下令改變帝國的法律；他沒有發動社會革命，可是他放下了一個原則。在基督裡，主人和奴隸同受一個洗、坐同一張桌子、稱彼此為弟兄。他要腓利門把阿尼西謀當作親愛的兄弟。這個原則像種子，終究從裡面瓦解了奴隸制，所以這一節不是叫我們說「聖經過時了」，也絕不能拿來替剝削辯護。今天它最先落在外籍幫傭的休假、移工的薪水、公司最基層的同事身上；這一週，就從叫出他的名字開始。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是建華那一邊走過頭：把「不靠行律法」講成「行為不重要」「反正已經稱義，怎麼活都可以」。保羅反對的是把行為當作稱義的條件，不是反對順服；同一封信要講「使人生發仁愛的信心」（5:6），也要講聖靈的果子。"],["p","第二個偏差，是美玲那一邊走過頭：講完因信稱義，又說「真正得救的人一定要每天讀幾章、受洗滿幾年、不碰某些東西」。屬靈操練是好的，一旦變成門票，就是今天的割禮，是律法主義換了一件衣服。"],["p","第三個偏差，是把律法講成壞人：「舊約的神很兇，新約的神才溫柔」「律法可以整本丟掉」。保羅自問律法是不是與應許反對，答案是斷乎不是；那位提書包的家奴是父親派來的。"],["p","第四個偏差，是把第十三節講成父子對立的憤怒，或變成一再重做的斷咒儀式：「不斷開祖宗的咒詛，你就不能蒙福」。贖出是一次完成的事；要人一次又一次追查家族的罪，等於說十字架還不夠，又在基督後面加了一個條件。"],["p","第五個偏差，是用第二十八、二十九節做兩件相反的錯事：一是抹平差異，要少數族群放下母語才算合一；二是說「教會取代以色列，神不要猶太人了」。合一不是一樣；外邦人被接進來，不是猶太人被趕出去。若有一位猶太人坐在我們中間，他聽到的應當是福音的邀請，不是輕蔑。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：很多弟兄姊妹來自拜拜的家庭，從小聽慣了犯沖、下咒、風水。讀到第一節「誰又迷惑了你們」，原文又是民間「用邪眼看人」的字，心裡就發毛：基督徒是不是也會中邪？保羅是借當時人最怕的字作反諷：真正叫人失去判斷的不是邪眼，是別的福音。屬基督的人，是被那位成了咒詛的主贖出來的；沒有任何咒語能把你從他手裡奪去。對受驚嚇的人，我們陪他禱告；若有長期失眠或極度恐慌，也陪他就醫。"],["p","第二個問題：華人家庭很習慣「做到才被接納」。考第一名才是乖孩子，賺得夠多才是孝順的兒子，媳婦做得夠好才算自己人。帶進教會，就變成「服事夠多才算屬靈」。第三章把次序翻過來：先是兒子，再談長大；先被接納，再談要做到甚麼。對孩子說「你是我的孩子，所以我們一起把功課寫完」，和說「寫完了，你才是好孩子」，是兩種完全不同的福音。"],["h","七、活出321——讓那件衣服披在每一個人身上"],["p","耶穌是我的榜樣：律法說「凡掛在木頭上都是被咒詛的」，主耶穌沒有繞過這一句，他自己走到那木頭上。他說：「沒有人奪我的命去，是我自己捨的。」（約 10:18）他一生也沒有用律法把人擋在門外。學他，是在別人被排在外面的地方先走過去。"],["p","聖經是我的準則：「子孫」是單數那一節，我們照保羅自己作的連結講，不拿來在別處任意抓單數複數。經文說律法「引我們到基督那裡」，我們就不把它講成壞人，也不把它講成門票。"],["p","聖靈是我的引導：「你們既靠聖靈入門」，往後走路的也是他。長大的兒子不再被家奴牽著手，是因為裡面有了判斷。遇到「該不該」的事，先求聖靈引導，不急著找一條新規矩管住自己或別人。"],["p","讓耶穌作王：這一章要人讓出兩個位置。一個是「成全者」：起頭的是他，成全的也是他，我不是自己屬靈生命的承包商。另一個是「看門的人」：決定誰夠資格坐上桌子、誰還缺一樣的那個位置，不屬於我。讓耶穌作王，不是從此不守規矩，是讓順服從被愛裡長出來。"],["p","讓耶穌得著一切的榮耀：如果我是因為做到了才蒙福，榮耀就有一半是我的；可是福是在基督裡承受的，咒詛是他擔的，聖靈是他賜的，所以榮耀全是他的。查經班吵贏了誰都沒有用，讓人看見那位被掛在木頭上的主才是目的。"],["p","建立屬神的體系：第一，教會進門的門只有一道，就是信基督；洗禮班、會員課程、服事訓練都是好的，卻不可以變成做完才算自己人的割禮。第二，教會的規矩要像那位提書包的家奴，有期限、有方向，目標是讓人長大，不是讓人離不開帶領者。第三，讓三道牆在同一個團契裡倒下：不同語言、不同階層、男和女，一起禱告、一起吃飯、一起服事；分工可以不同，桌子只有一張。"],["h","八、四種心，都站在那張告示前"],["p","驕傲型的心，是心裡有一本帳的人：讀經天數、服事年資、奉獻多少，記得清清楚楚，也拿來量別人。第三章請你把那本帳放在十字架下面：你站得住，是因為有人替你成了咒詛，不是因為你的帳好看。"],["p","恐懼型的心，是怕自己做得不夠、神就把應許收回去的人；也可能是怕被下咒、怕犯沖、怕祖先不保佑的人。請聽第十八節：神是「憑著應許」把產業賜下的，而且是完成式，已經送出去了。愛你的那一位，已經站在你和一切咒詛之間。"],["p","羞恥型的心，是一直覺得自己坐偏桌的人：因為出身、語言、性別、學歷，或者因為過去的一段日子，覺得自己是教會裡次一等的成員。第二十八節對你說：你披戴的是同一位基督，你在那一個子孫裡面，你是兒子，不是寄住的客人。"],["p","受傷型的心，是曾經被「做到才被愛」傷過的人，也許是一位只看成績的父親，也許是一個用規矩管人的教會。這一課不要你立刻原諒誰，也不要你假裝不痛。你聽見十字架的時候，若害怕那是一位懲罰兒子的父親，請記得：父與子是同一個心意，那一位是「愛我，為我捨己」的主。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀一次第十三、十四節，用自己的話對主說一句：「那份咒詛，你替我擔了。」再為今天看得見的一件聖靈的供應感謝他。"],["p","第二，把你信仰裡那份「做到才算數」的私人清單寫出來，在每一條旁邊寫一個字：「果」或「票」。清單上的好事照樣去做，只是用法換了：那是果子，不是門票。"],["p","第三，這一週有一天沒做到清單上的一條時，先不急著補做來讓自己安心，先到主面前說：「我在你家裡，是因為信，不是因為做到。」隔天照常去做。"],["p","第四，說出一位在「牆那一邊」的人：不同語言、不同年齡層，或家裡的外籍幫傭、公司最基層的同事。這一週用他的名字稱呼他，問一次他的家人好不好；若他該有的休息與薪水沒有按時給足，這週就改。"],["p","第五，若你曾和人為規矩爭過，主動約他喝一杯茶，不為吵贏，只說：「我們一起回到十字架那裡看看。」"],["p","然後我們一起開口說出四句話。"],["p","我宣告：基督已經替我成了咒詛，那份判決我不必再背。"],["p","我宣告：我靠聖靈入門，也要靠聖靈走下去，不靠肉身成全。"],["p","我宣告：我是神的兒子，不是被家奴牽著手的孩子。"],["p","我宣告：我披戴基督，不抹去別人的不同，也不把任何人擋在桌子外面。"],["d",["清單上寫「果」或「票」，要怎樣分辨某件事是果子還是門票？","同一件事可以是果子，也可以是門票，分別在你心裡怎樣用它。有三個簡單的測試。第一，沒做到的時候：若是果子，你會覺得可惜，明天再來；若是門票，你會覺得神不要你了，急著補做來讓自己安心。第二，看別人的時候：若是果子，你會為別人結出別的果子高興；若是門票，你會用它量別人夠不夠格。第三，教新朋友的時候：若是果子，你會說「慢慢來，主會帶你」；若是門票，你會說「這個沒做到不算」。挑一條最常讓你審判人的，帶到主面前認罪。然後照常去做，只是對自己說：我做這件事，是因為我已經在你家裡。"]],["h","十、結語"],["p","回到那一晚的查經班。後來兩個人一起讀了第二十四、二十五節。美玲說：「原來我想要的那個標準，是要把人送到基督那裡，不是擋在門口。」建華說：「原來不在師傅手下，不是沒有規矩，是長大了。」兩個人都沒有吵贏，兩個人都被帶到了同一個地方。"],["p","所以這一課的焦點，不在建華對還是美玲對，也不在保羅的論證有多漂亮；焦點在那一位被掛在木頭上的主。律法說的是真的，他就走進那份咒詛裡，替我們成了咒詛，把我們從市場上買出來，又把他自己像一件衣服披在我們身上。你不必更佩服保羅，你只要回到那張一直貼在你眼前的告示前面。"],["p","我們一起低頭禱告。主耶穌，謝謝你為我們成了咒詛，把我們從律法的咒詛裡贖出來。赦免我們，常常靠聖靈入門，又想靠自己成全；常常在你後面加上一個「和」字，把自己壓垮，也把別人擋在門外。求你把你的靈一直供應給我們，叫我們像長大的兒女一樣跟隨你。求你讓我們的教會只有一張桌子，讓說不同語言、不同出身、男的女的，都坐在你面前。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一課最重要的，不是分出建華和美玲誰對，是接下來這一個鐘頭，每個人都說出自己心裡那一條加在基督後面的條款，又說出這一週要把哪一張門票拿下來；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是靠聖靈入門也靠聖靈走下去、基督替我們成了咒詛、在他裡面成為一。席上可能有怕被下咒的人，也可能有在「做到才被愛」的家庭裡受過傷的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員用自己的話講得出「律法不是門票，是帶路的師傅」「咒詛沒有被勾銷，是被基督擔下了」「合一不是一樣」三個觀念。"],["n","1. ★ 你小時候有沒有一個大人每天接送你上學、盯著你寫功課？你記得他最常對你說的一句話是甚麼？"],["n","2. ★★★ 建華和美玲各說對了一半。請用一句話向旁邊的人說：律法為甚麼不是門票，卻也不是廢紙？用那位提書包的家奴來說明。"],["n","3. ★★ 和合本註腳說基督不只是「受了」咒詛，是「成了」咒詛。這兩個說法差在哪裡？為甚麼這不是說天父懲罰無辜的兒子？"],["n","4. ★★ 「合一不是一樣」，請用「同一件衣服、不同的身體」舉一個你們教會裡的例子：哪兩種不同的人，穿著同一件衣服坐在一起？"],["m","帶領提醒：第一題輕鬆帶；性別角色、子孫單數等爭議一句帶過、指向議題頁，不在組裡辯論。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人看見自己在基督後面加上的條款，並說出這一週要拿下哪一張門票。"],["t","【看】看見自己"],["n","5. ★★★ 最近一次你覺得「我做得不夠，神大概不太高興」，是哪一天、因為甚麼？那時你做了甚麼來「補回來」？只說事情，不必說細節。"],["t","【聽】聽神說話"],["n","6. ★★ 請把第十三、十四節慢慢讀一遍，在「基督既為我們受了咒詛」停下來，安靜一分鐘。說出一個你曾被罪咎或懼怕壓著、後來在十字架前被釋放的時刻。"],["t","【想】想通關卡"],["n","7. ★★★ 你很難相信自己「已經是兒子」，卡在哪裡：從小被教「做到才被接納」、怕停下來就會退後、怕被下咒或犯沖，還是習慣用規矩量別人？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說一句：「我常在基督後面加上的那一條是……；可是我在你家裡，是因為信，不是因為做到。」右手邊的人只回「你已經披戴基督了」。"],["t","【行】走一步"],["n","9. ★★★ 說出你清單上最常用來審判自己或別人的那張「門票」，以及這一週哪一天、甚麼時候把它帶到主面前。唸給旁邊的人聽。"],["m","帶領提醒：這一化可能碰到原生家庭的傷害、被父親或教會用規矩管過的經歷，也可能碰到對咒詛、犯沖的長期懼怕。只問類別，不追問細節，不要求原諒任何人，不對正在流淚的人說「你要有信心」；說不出口的可以跳過。有人透露長期失眠、極度恐慌或長期無望感的，會後單獨關心，必要時協助尋求專業協助。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進這一週的行事曆。"],["n","10. ★★ 這一週每天早上讀第十三、十四節、對主說「那份咒詛，你替我擔了」，你要定在幾點、在哪裡？那張「果」與「票」的清單，你要在哪一天寫好？"],["n","11. ★★★ 說出一位在「牆那一邊」的人的名字或關係：不同語言、不同年齡層、家裡的幫傭或公司最基層的同事。你要在哪一天、用甚麼方式接近他？"],["n","12. ★ 你的小組裡，有沒有一條沒寫出來、卻讓新朋友覺得「還不夠格」的門檻？說出它，以及你要在哪一天向帶領者提出調整。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。這一週向他分享這一課，當場說出他的名字，以及你要約他的日子和地點。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，很多人以為信仰就是守規矩，做得夠好神才接納你，可是沒有人能真的做到全部。第二句，聖經說耶穌被掛在木頭上，替我們承受了那份做不到的判決，把我們像奴隸一樣從市場上買出來。第三句，所以神接納人不看出身、性別、語言或表現，只看你肯不肯信他，然後他的靈會帶你長大。下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會更有恩典」這類答案；談到幫傭或同事時，只談自己可以做的事。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週，我要拿下的那一張門票是甚麼。"],["p","然後彼此代禱，為三種人指名禱告：一位還常怕被下咒或犯沖的弟兄姊妹；一位覺得自己只能坐偏桌的人；以色列地的猶太人與阿拉伯人，包括那裡的信徒，求主賜他們平安。"],["p","散會前確認紙上寫了三樣：讀經的時間、牆那一邊那個人、你的「2」的名字。"]]},"4":{"no":4,"vol":"《321加拉太書講義》第四課·加拉太書第四章","title":"你不是奴僕，乃是兒子了——收養、陣痛、兩約","chars":5201,"min":60,"deep":8,"dchars":1592,"tchars":1394,"blocks":[["h","一、羅馬公堂上的那一天"],["p","弟兄姊妹平安。羅馬城的一間公堂，早上，幾個人站在長官面前。一位父親牽著他的兒子，旁邊站著另一位男人，還有幾位作見證的人。按照羅馬的法律，一個兒子不能自己換一個父親；原來的父親要放手，新的父親要在長官面前公開聲明：這個孩子是我的。要有見證人、有文件、當眾宣告。"],["p","宣告完了，文件一簽，事情就成了。孩子從那一刻起有了新的姓，舊債勾銷，和親生的兒子有同樣的繼承權。就算他明天打破一個花瓶，也不會被退回去。"],["p","可是請你看那個孩子的臉。文件簽了，他還站在那裡，不太敢動。他知道自己被收養了，心裡卻還是原來那個怕做錯事、習慣看臉色的孩子。回家的路上，他走在新父親後面半步，不知道該怎麼稱呼這個人。那個最簡單的字，他叫不出口。"],["p","也許過了幾天，也許過了好幾個月。有一天夜裡打雷，孩子嚇醒了，衝出房門，一頭撞進那個男人的懷裡，脫口而出一聲：「爸。」那一聲出來以後，他自己也愣住了。收養在公堂上早就完成了；可是直到那一刻，那張文件才在他心裡活起來。"],["p","加拉太書第四章，就是在講這兩個時刻：一個是父親在公堂上宣告的那一天，一個是孩子心裡第一次叫出阿爸的那一晚。保羅寫信的對象，是一群已經被收養、卻被人說服要再去辦一次手續的人：信耶穌很好，但還要受割禮才算數。攪擾他們的人沒有拿掉基督，只是在基督後面加了一道門檻。"],["p","保羅先畫一幅家裡的圖：「我說那承受產業的，雖然是全業的主人，但為孩童的時候卻與奴僕毫無分別」（4:1）。產業是他的，可是他還小，每天被人管著，「乃在師傅和管家的手下，直等他父親預定的時候來到」（4:2）。可是他不是僕人，只是時候還沒有到。"],["p","第三節保羅說了一個叫人吃驚的「我們」：「我們為孩童的時候，受管於世俗小學之下，也是如此」（4:3）。一個生來的猶太人，把律法底下的自己和拜偶像的外邦人放在同一張課表上：不是說兩者一樣壞，是說兩樣底下，人有同一種姿勢：靠守住一套規條，來確定自己在神面前的位置。"],["d",["保羅說的兒子名分，是羅馬法的收養，還是猶太人的家族觀念？","第五節「兒子的名分」原文是 υἱοθεσία（huiothesia），是希臘羅馬世界的法律用語，舊約裡沒有同樣正式的收養制度。加拉太的外邦信徒一聽就懂：換了姓，舊債勾銷，和親生的兒子有同樣的繼承權。不過保羅不是在上法律課；第二節說時候由「父親預定」，羅馬法其實規定了年歲，比喻是為神學服務的。所以抓住它說的是一個法律事實，不是一種感覺：你今天覺得離神很遠，收養文件並沒有因此作廢；但也不必把羅馬法每一條細節搬進來解經。"]],["h","二、時候滿足，神差了兩次"],["p","第四節是全章的轉軸：「及至時候滿足，神就差遣他的兒子，為女子所生，且生在律法以下」（4:4）。孩子不能決定自己哪一天成年，奴僕不能替自己贖身。那一天是父親定的，也是父親自己來成就的。"],["p","神沒有在天上發一道命令說你們自由了；他差他的兒子走進奴僕站的地方，生下來第八天受割禮，活在律法底下。腓立比書說他「取了奴僕的形像」（腓 2:7）。他先站到我們的位置，好把我們帶到他的位置。"],["p","目的是：「要把律法以下的人贖出來，叫我們得著兒子的名分」（4:5）。贖，和第三章「基督既為我們受了咒詛」（3:13）那個贖是同一個字，是在市場上把奴隸買出來。神不只把我們買出來，放在門外說你走吧；他把我們領進家裡，改了姓，寫進遺囑。這就是開頭那間公堂。"],["p","然後是加拉太書最溫暖的一句：「你們既為兒子，神就差他兒子的靈進入你們的心，呼叫：『阿爸！父！』」（4:6）第四節神差了兒子，第六節神又差了兒子的靈，同一個動詞用了兩次。第一次像公堂上的宣告，第二次像打雷那一晚脫口而出的那一聲。"],["p","請看次序：你們既為兒子，神才差靈來。不是你叫得夠大聲，才變成兒子；是你已經是兒子了，那靈在你裡面替你叫出來。有人阿爸兩個字很難叫出口，因為自己的父親很遙遠、很嚴厲，或者根本不在。有時候那一聲很小，有時候只是一聲嘆息，但那靈仍然在你裡面叫著。"],["p","第七節收成一句話：「可見，從此以後，你不是奴僕，乃是兒子了；既是兒子，就靠著神為後嗣」（4:7）。前面都是你們，這裡忽然變成單數的你，和合本這一句沒有再字，也沒有漸漸：從此以後，你不是。身分是宣告，不是進度。奴僕靠表現留下來，兒子靠父親留下來。"],["p","這一節也接上我們團契的名字，那是從第二章來的：「我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信神的兒子而活；他是愛我，為我捨己」（2:20）。說不再是我的那一口氣，緊接著說他是愛我。無己不是奴僕把自己抹掉，是兒子知道自己被愛，不必再為自己爭位置。"],["d",["既然身分是宣告不是進度，那我犯了罪以後，還需要認罪悔改嗎？","需要，而且正因為是兒子，認罪的方式才不一樣。僕人犯了錯，怕被趕出去，所以會躲、會拖、會先拼命補回來；兒子知道自己不會被退回去，所以可以直接跑回父親面前說我錯了。認罪不是重新申請入籍，是回到已經屬於你的家，把關係裡的灰塵擦乾淨。基督在我們心裡成形的過程，一定有跌倒，也一定有悔改。所以這一週的操練是：搞砸了，先叫一聲阿爸，再認罪。若一再犯同一件事，請找一位信得過的弟兄姊妹一起扛，不要一個人躲起來。"]],["d",["我很少有叫阿爸的感覺，是不是表示我裡面沒有聖靈，也沒有真正得救？","不是。第六節的次序是「你們既為兒子」，神才差兒子的靈進來；身分在前，呼叫在後，而呼叫的主詞是那靈。確據的根基是神差了兒子，也差了兒子的靈，不是你的感覺有多強。很多人叫不出口，背後是一個遙遠、嚴厲或不在的父親，那是傷，不是不信。可以從很小的一步開始：每天把第七節的你換成自己的名字念一次。若關於父親的記憶讓你很痛，不必勉強自己原諒或回想細節，可以請牧者陪你，必要時尋求專業的協助。"]],["h","三、原文亮光：被認識、謹守、陣痛"],["p","從第八節起，保羅看見這些兒子正往奴僕的房間走回去。我們拆三個原文字，跟著他從責備走到陣痛。"],["p","第一個字是 γνωσθέντες（gnōsthentes），被認識。第九節保羅說到一半改口：「現在你們既然認識神，更可說是被神所認識的，怎麼還要歸回那懦弱無用的小學，情願再給他作奴僕呢？」（4:9）他先用主動的認識，馬上改成被動的被神所認識，主角從人換成神。重要的不是你抓住了神，是神認得你。只知道我認識神的人，會一直擔心認識得夠不夠；知道神認識我的人，才能安息。"],["p","同一節還有兩個疊在一起的副詞，πάλιν ἄνωθεν（palin anōthen），再一次、從頭。外邦人從前「是給那些本來不是神的作奴僕」（4:8），現在被人勸去守割禮和節期，保羅說這是從頭回到同一種奴役：把任何東西放在基督旁邊當作得救的保險，靈魂就回到討好、害怕、計算的姿勢。"],["p","第二個字是 παρατηρεῖσθε（paratēreisthe），謹守：「你們謹守日子、月份、節期、年份」（4:10）。這是緊緊盯著、怕出錯的眼光；四樣東西從小到大排下去，像一本越翻越厚的曆書。保羅責備的不是有日子，是把日子當作與神關係的條件，或當作掌管禍福的力量。分辨的關鍵不是哪一天，是那一天你信靠誰。"],["p","接著是全章的低谷：「我為你們害怕，惟恐我在你們身上是枉費了工夫」（4:11）。然後保羅放下辯論，改用關係說話，提醒他們最初的樣子：「你們知道我頭一次傳福音給你們，是因為身體有疾病」（4:13）。那是甚麼病，經文沒有說，我們不猜。他們當時卻「沒有輕看我，也沒有厭棄我，反倒接待我，如同神的使者，如同基督耶穌」（4:14）。"],["p","可是現在，「如今我將真理告訴你們，就成了你們的仇敵嗎？」（4:16）那些攪擾的人「熱心待你們，卻不是好意，是要離間你們，叫你們熱心待他們」（4:17）。離間，原文是把你們關在外面：先讓你覺得自己還在門外，再讓你排隊求他們開門。"],["p","第三個字是 ὠδίνω（ōdinō），產婦陣痛的那個字：「我小子啊，我為你們再受生產之苦，直等到基督成形在你們心裡」（4:19）。說再，是因為他們信主時保羅已經痛過一次。他陣痛的目標不是你們像我，是基督成形。成形在原文是被動的，是神作的。被收養是一天的事，基督成形卻像懷胎，要一段時間，也會反覆。第二十節保羅說他「為你們心裡作難」（4:20）：陪伴別人成長的人，自己也需要被陪伴。"],["d",["第三節和第九節的世俗小學，到底是規條、宇宙元素，還是靈界的勢力？","原文 στοιχεῖα（stoicheia）本來是排成一列的東西：字母、元素、基本原理。學者有三說：初級的宗教規條，和合本譯作小學就取這個意思；古人以為掌管世界的土、水、火、風，所以第十節接著說日子、月份；背後的靈界權勢，因為第八節說「那些本來不是神的」。本講義以第一說為骨幹，兼含第三說，但不可把神所賜的律法講成魔鬼的工具；保羅說的是結構相同，不是本質相同。三說一致的是：那些東西懦弱無用，給不出產業。詳見議題頁。"]],["h","四、兩個婦人，兩種出生"],["p","第二十一節，保羅用律法回答想要律法的人：「你們這願意在律法以下的人，請告訴我，你們豈沒有聽見律法嗎？」（4:21）你們想活在律法底下，就聽聽律法書怎麼說：亞伯拉罕有兩個兒子，「一個是使女生的，一個是自主之婦人生的」（4:22）。"],["p","關鍵在第二十三節：「那使女所生的是按著血氣生的；那自主之婦人所生的是憑著應許生的」（4:23）。本系列創世記講義講過，以實瑪利的出生是撒萊的計畫，用人的辦法替應許找捷徑；以撒卻是在人的辦法全部用完以後，「到神所說的日期，就給亞伯拉罕生了一個兒子」（創 21:2）。"],["p","第二十四節，保羅自己標明：「這都是比方：那兩個婦人就是兩約」（4:24）。我們照保羅的比方講滿，但不把這個方法推到別的經文去。他像列了一張兩欄的表：一欄是夏甲、西奈山的約、生子為奴、現在的耶路撒冷；另一欄是撒拉、應許的約、自主，「但那在上的耶路撒冷是自主的，她是我們的母」（4:26）。"],["p","這裡有一條線，教學場上一定要守住：比的是兩個約、兩種出生方式，不是兩個民族。現在的耶路撒冷，在這封信裡指的是那一套要外邦人受割禮才算數的宗教，不是指猶太民族，更不是指阿拉伯人或穆斯林。保羅自己是「我們這生來的猶太人」（2:15），他在羅馬書說：「神並沒有棄絕他預先所知道的百姓」（羅 11:2）。"],["p","也請記得，夏甲本人不是反派。她是被安排、被使用、後來被趕出去的使女，卻是給神起名字的人，稱那位神為「看顧人的神」（創 16:13）。水用盡的時候，神的使者對她說：「不要害怕，神已經聽見童子的聲音了」（創 21:17）。保羅用她代表一個約，不是在評價她，更不是評價她的後代。"],["p","第二十七節引以賽亞書：「不懷孕、不生養的，你要歡樂；未曾經過產難的，你要高聲歡呼；因為沒有丈夫的，比有丈夫的兒女更多」（4:27）。從人看是絕路的地方，神生出最多的兒女；加拉太的外邦信徒，就是這些更多的兒女。"],["p","第三十節說「把使女和她兒子趕出去」（4:30），在比方裡要趕出去的不是一群人，是一個約、一種出生方式：不要讓信耶穌再加上割禮那一套，在教會裡和福音同坐、一同分產業。最後保羅收在一句宣告上：「弟兄們，這樣看來，我們不是使女的兒女，乃是自主婦人的兒女了」（4:31）。和第七節一樣，這是宣告，不是勸勉。"],["d",["保羅可以用比方解經，為甚麼我們不可以照樣在別的經文裡找隱藏的意思？","因為保羅自己標明了「這都是比方」，這個連結是新約明文作的，也是全本新約唯一一次明說在用寓意法。而且他沒有否定夏甲與撒拉的歷史，是在真實的歷史上看見兩個約的對應。教會歷史上，寓意解經曾讓人在任何經文裡讀出任何意思，例如把好撒馬利亞人的每一個細節都配上一個教義，經文就沒有辦法再檢驗我們了。所以照保羅的比方講滿，但不推到別處。檢驗很簡單：你的講法離開這段經文以後，還能不能從上下文本身被檢驗？"]],["d",["把使女和她兒子趕出去聽起來很殘忍，神真的這樣對待夏甲和以實瑪利嗎？","這句話在創世記是撒拉說的，保羅在比方裡引用它，要趕出去的是一個約，不是一群人。而且創世記沒有讓夏甲在曠野裡消失：早在第十六章，她就給神起名字，稱他為看顧人的神；第二十一章水用盡的時候，神聽見了童子的聲音，還應許要使他的後裔成為大國。所以兩句話要一起講：保羅的比方用夏甲代表西奈的約，創世記裡的神仍是看顧夏甲的神。這句話絕不能拿來給任何民族定罪，或趕走教會裡意見不同的人。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把第七節講成既然是兒子，怎樣活都可以，行為不重要；或者反過來說，兒子要表現好，才保得住名分。身分不靠表現保住，但會長出兒子的樣子；得救的條件和得救的果子，兩邊都要講。"],["p","第二個偏差，是對與父親關係受傷的人說，叫不出阿爸就表示你還沒有真正得救，或要求他先原諒父親才能親近神。第六節是先為兒子，然後靈在心裡呼叫；呼叫的是那靈，不是人憑自己叫得多順。"],["p","第三個偏差，是把第十節講成一切節慶都不可過，春節回家吃團圓飯、中秋賞月、清明掃墓一概妖魔化，叫初信者和家人斷絕往來；或者反過來，把燒香祭拜、擇日看時辰、看風水輕輕說成只是文化。前者是另一個軛，後者是回到本來不是神的面前。"],["p","第四個偏差，是用第十二節的像我一樣、第十九節的我小子啊建立屬靈控制，要被帶的人像他、聽他、離不開他，否則就是不順服。保羅陣痛的目標是基督成形，不是複製自己。"],["p","第五個偏差，是把第二十五節和第三十節講成對阿拉伯人、穆斯林或猶太人的定罪，或拿趕出去這句話對付教會裡意見不同的人。保羅比的是兩個約，不是兩個民族；要趕出去的是我們心裡再加上的那一套，不是任何一個人。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：清明、春節和擇日。很多華人信徒清明前都睡不好：去不去掃墓？拿不拿香？要搬家、開刀的時候，長輩翻開農民曆說這一天不好，你心裡還是有一點不安。春節團圓、清明去墓前獻花、為家人禱告，是孝敬與親情，基督徒可以參與；燒香祭拜、向祖先求福、擇日看時辰、看風水，是把信靠交給本來不是神的，要溫和而清楚地不做。不一概妖魔化，也不一概放任。清明照樣回家、在墓前流淚、只是不拿香的兒子，往往比不回家的兒子更能讓父母看見他信的是誰。"],["p","第二個問題：華人的父子關係。很多華人父親不太說話，愛是用做的；孩子從小聽到的多半是考得怎麼樣，很少聽到我以你為樂。於是我們以為神也是一位要看成績單的父親。第四章的父親不是這樣。他在你還沒有任何成績的時候，就差了兒子來贖你，又差了兒子的靈進到你心裡。有人叫不出阿爸，不是不屬靈，是地上的那一聲從來沒有被好好接住。也有人自己就是那位不太會說話的父親；這一週，試著對孩子說一句不附帶條件的話。"],["d",["家裡長輩要我在清明拿香拜祖先，我不拿會被說不孝，具體該怎麼做？","先預備，不要到墓前才臨時反應。第一，照樣回家、照樣去掃墓，早一點到，幫忙拔草、擦墓碑，讓長輩看見你沒有不要祖宗。第二，帶一束花，在墓前安靜站著，說些記念先人的話。第三，輪到拿香的時候，溫和而短地說一句：我信耶穌了，我用獻花和鞠躬來記念阿公，香我就不拿了。不要在現場辯論；長輩生氣，事後再單獨陪他吃飯、說說話。也請告訴你的組長，請小組為你禱告。若你當年處理得太硬，今年可以是重新修補的機會，不必一直自責。"]],["h","七、活出321——從公堂走回家"],["p","耶穌是我的榜樣：他是兒子，卻甘心「為女子所生，且生在律法以下」（4:4）。他受割禮、守節期，卻不必靠這些證明自己是兒子；學他，是不再靠日子和規條證明自己，卻甘心走進別人的處境，把人帶回家。"],["p","聖經是我的準則：經文說保羅的病是甚麼了嗎？沒有，我們就不猜。經文說「這都是比方」，我們就照保羅的比方講，不拿這個方法到別的經文裡找隱藏的意思；經文比的是兩個約，我們就不把它講成兩個民族。"],["p","聖靈是我的引導：那靈在我們心裡呼叫阿爸，也在節日和家族的壓力裡引導我們分辨，哪一件事是孝敬，哪一件事是把信靠交給別的。求聖靈給我們溫柔的口氣和清楚的界線。"],["p","讓耶穌作王：這一章要人讓出兩個位置。一個是自己身分的審核員：我們常把審核權交給表現、別人的眼光或一本農民曆；讓耶穌作王，是承認只有父能宣告我是誰，而他已經宣告了。另一個是別人生命的塑造者：帶人的時候，不在他身上找自己。"],["p","讓耶穌得著一切的榮耀：收養的文件不是孩子寫的，贖價不是奴僕付的，以撒也不是撒拉憑力氣生的。從第四節到第三十一節，動手的都是神，榮耀都歸給那位差了兒子、又差了兒子之靈的父。"],["p","建立屬神的體系：第一，作一個家，不作一道門檻；第十七節那種把人關在外面、好叫人來求的熱心，不可以在這裡。第二，每一位初信者身邊，有一位願意為他再受生產之苦的屬靈父母，目標是基督成形，不是複製帶領者。第三，讓帶著病和軟弱的人在這裡被接待，像加拉太人當年接待保羅。"],["h","八、四種心，站在門口的孩子"],["p","驕傲型的心，是那個很會守規矩的孩子。你讀經、聚會、服事的紀錄都很漂亮，心裡暗暗覺得這些讓你比別人更算數。第四章對你說：你的名分是父親給的，不是你掙的；你最得意的那張清單，在父親面前只是師傅手下的功課。"],["p","恐懼型的心，是打雷那一晚還不敢衝出房門的孩子。你怕做錯事被退回去，怕挑錯日子招來禍。請你聽第七節：從此以後，你不是奴僕。你已經被神所認識，沒有一個日子能讓你更蒙愛，也沒有一個日子能讓你被咒詛。"],["p","羞恥型的心，是覺得自己出身不好的孩子。你的過去和從前拜過的，讓你覺得自己永遠是使女的兒女。第二十七節說，那個不能生的，兒女反而最多；你的出生不是靠你的條件，是神在不可能之處作成的。你只要知道現在是誰家的孩子。"],["p","受傷型的心，是叫不出那一聲的孩子。也許你的父親很遙遠，或曾經傷害你；也許你曾被教會的門檻關在外面。這一課不要你立刻原諒誰，也不要你假裝不痛。那靈在你裡面呼叫，即使你只發得出一聲嘆息。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀一次第四到七節，把第七節的你換成自己的名字念出來。"],["p","第二，寫一張再加上清單：你心裡覺得信耶穌還要再加上甚麼才算數的東西。每一條旁邊寫一個字，果或門；寫著門的那幾條，帶到主面前。"],["p","第三，為下一個家族節日預先想好兩件事：一件表達孝敬的具體行動，例如幫忙準備團圓飯、帶一束花去掃墓；一件你要溫和而清楚地不做的事，以及你要怎麼說。"],["p","第四，找一位你曾經在信仰上幫助過、現在走遠或停住了的人，這一週聯絡他一次，不責備、不講道，只問近況，告訴他你一直為他禱告。"],["p","第五，每次搞砸了一件事，在說對不起之前，先叫一聲阿爸父，然後再認罪；用兒子的口氣認罪，不用僕人的口氣求情。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：從此以後，我不是奴僕，乃是兒子；我的名分是父親宣告的，不是我掙來的。"],["p","我宣告：我已經被神所認識，沒有一個日子、一個時辰能叫我更蒙愛，或叫我被咒詛。"],["p","我宣告：那靈在我心裡呼叫阿爸，即使我的聲音很小，父也聽得見。"],["p","我宣告：我不是使女的兒女，乃是自主婦人的兒女；我願意讓基督在我裡面成形。"],["d",["我想陪一位初信的人走，但怕自己變成控制他的人，該怎麼分辨？","保羅的尺很清楚：他陣痛是「直等到基督成形」，不是直等到你們像我。可以定期問自己三題：他是更能自己到神面前，還是更依賴我？他和我意見不同時，我覺得被冒犯，還是願意聽？他身上長出的是基督的樣子，還是我的習慣和用語？具體做法：每次見面留一段時間讓他自己讀經禱告；鼓勵他和小組其他人建立關係，不要只有你一個窗口。也請你自己找一位同工陪你；若你發現自己很需要被他需要，正是該把這份需要帶到主面前的時候。"]],["h","十、結語"],["p","回到那間公堂。文件早就簽了，孩子卻要過一段日子，才在一個打雷的晚上叫出那一聲。很多人也是這樣：在公堂上早就是兒子，在心裡還走在父親後面半步。加拉太人想再辦一次手續；保羅說，不必了，回家吧。"],["p","所以這一課的焦點，不在我們叫得多大聲，也不在我們守了多少日子；焦點在那位父親。他差了兒子，又差了兒子的靈進到我們心裡呼叫。客西馬尼園那一夜，那位兒子在最痛的時候也是這樣叫的：「阿爸！父啊！在你凡事都能」（可 14:36）。他叫過的那一聲，現在在你心裡。你不必更佩服保羅，你只要更認識這位父。"],["p","我們一起低頭禱告。阿爸，父，謝謝你在時候滿足的時候差了你的兒子，把我們從律法以下贖出來，又差你兒子的靈進到我們心裡。我們當中有人還不敢叫你，有人還在看日子、算條件。求你讓我們聽見你說：從此以後，你不是奴僕，乃是兒子。求你在每一個家族節日裡給我們溫柔和清楚，也讓基督在我們心裡一天一天成形。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一課最重要的，不是背出夏甲和撒拉那張兩欄的表，是接下來這一個鐘頭，有多少人肯說出自己心裡還在申請的那一張清單、說出下一個節日要怎麼過，又說出這一週要為誰陣痛；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是兒子的身分、走回奴僕房間的試探、為人陣痛的心。席上可能有與父親關係受傷、或正因不拜祖先承受家庭壓力的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員用自己的話講得出「從此以後，你不是奴僕」是宣告不是進度、「分辨的關鍵不是日子，是信靠誰」、「比的是兩個約，不是兩個民族」三個觀念。"],["n","1. ★ 你小時候有沒有一個只有家裡人才叫的小名？是誰這樣叫你？"],["n","2. ★★★ 請用開頭那個被收養的孩子當例子，向旁邊的人說明：為甚麼「從此以後，你不是奴僕」是一個宣告，不是一個進度？"],["n","3. ★★ 保羅改口說加拉太人是被神所認識的。請說出一個理由：知道神認識我，和只知道我認識神，對一個常常自責的人有甚麼不同？"],["n","4. ★★ 請用一句話說出按著血氣生和憑著應許生的差別，再舉一個今天教會裡按著血氣、用人的辦法替神的應許找捷徑的例子。"],["m","帶領提醒：第一題輕鬆帶；不猜保羅的病，不討論任何民族的對錯，世俗小學和寓意解經的爭議一句帶過、指向議題頁。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人看見自己還在用表現申請的那一部分，並說出這一週怎樣用兒子的口氣活。"],["t","【看】看見自己"],["n","5. ★★★ 最近一次你覺得要先表現好一點，神才會接納你，是甚麼時候、為了甚麼事？那時你是躲起來、拼命補，還是不敢禱告？"],["t","【聽】聽神說話"],["n","6. ★★ 請把第四到七節慢慢讀一遍，在第七節停下來，安靜一分鐘。說出這一節裡最打中你的一個詞，以及為甚麼。"],["t","【想】想通關卡"],["n","7. ★★★ 你不敢相信自己是兒子，卡在哪裡：地上父親留下的樣子、一次說不出口的失敗、一張還沒拆掉的再加上清單，還是怕家人說你不孝？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說一句：「從此以後，我不是奴僕，乃是兒子；我不必再用……換父的接納。」右手邊的人只回一句「父已經接住你了」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要用自己名字念第七節的時間和地點，以及一件你要從門改成果的事。唸給旁邊的人聽，請他下次問你。"],["m","帶領提醒：這一化可能碰到與父親關係的傷害、家庭衝突或被教會排斥的經驗。只問類別，不追問細節，不要求任何人原諒父親或家人，不對正在流淚的人說「你要有信心」；說不出口的可以跳過。若有人透露家庭暴力或長期無望感，不在組裡處理，會後單獨關心，必要時協助尋求專業協助。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進這一週的行事曆和下一個家族節日。"],["n","10. ★★ 下一個家族節日或要選日子的決定是哪一天、和誰？說出一件你要做的孝敬行動，一件你要溫和地不做的事，以及你打算怎麼說那一句話。"],["n","11. ★★ 說出一位你曾經帶過、現在走遠或停住的人的名字或關係。你要在哪一天、用甚麼方式聯絡他，第一句話要說甚麼？"],["n","12. ★ 你的小組，新朋友要先通過甚麼才算自己人？說出一道最具體的門檻，和你要在哪一天向誰提出拆掉它。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。這一週向他分享這一課，當場說出他的名字，以及你要約他的日子和地點。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，聖經說神在預定的時候差了他的兒子，把我們從各種規條和懼怕底下買出來，還收養我們作他的兒女。第二句，這個身分是神宣告的，不是靠表現、挑日子或守規矩換來的，就像被收養的孩子不必天天重新申請。第三句，所以你可以叫神阿爸，在最不安的那一天，也知道自己是誰家的孩子。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會更有愛心」這類答案；談節日時不嘲笑習俗，也不用「你妥協了」責備人。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週，我要在哪一件事上用兒子的口氣回到父親面前。"],["p","然後彼此代禱，為三種人指名禱告：一位剛信主、在家裡因為不再拜祖先而承受壓力的弟兄姊妹；一位為走遠了的孩子或學生心裡作難的父母、老師或組長；一位曾經被教會某一道門檻關在外面、從此不再來的人。"],["p","散會前確認紙上寫了三樣：念第七節的時間、下一個節日的那一句話、你的「2」的名字。"]]},"5":{"no":5,"vol":"《321加拉太書講義》第五課·加拉太書第五章","title":"被釋放的人往哪裡走——線、風、果","chars":5094,"min":60,"deep":8,"dchars":1752,"tchars":1470,"blocks":[["h","一、風箏與那一條線"],["p","弟兄姊妹平安。老一輩放風箏的人常說一句俗語：風箏飛得高，是因為有一條線牽著。小孩子聽不懂，總覺得那條線礙事。你也許見過一個孩子嫌線綁手綁腳，一剪刀剪斷了，想看它自由地飛。風箏沒有飛得更高，晃了兩下，一頭栽進對岸的田裡。"],["p","也有人走另一邊。大人怕風箏被吹走，把線收得很短，牢牢綁在欄杆上。風一來，風箏只能貼著地面拖。兩種做法方向相反，結果一樣：一個是剪斷，一個是綁死，風箏都毀了。"],["p","加拉太書第五章，就是保羅擋在這兩種做法中間。前四章他已經講完身分：我們是兒子，不是奴僕；接著他只說一句話：「基督釋放了我們，叫我們得以自由。所以要站立得穩，不要再被奴僕的軛挾制。」（5:1）"],["p","加拉太人遇到甚麼？有一群人對他們說：你們信耶穌很好，但還要受割禮、守節期，才算完整的神子民。這是攪擾他們的人的主張，不是保羅的。他們沒有拿掉基督，只是在基督後面加了一個「和」字。"],["p","可是另一個危險就在旁邊。一個剛聽見「你不必受割禮」的人，很容易聽成「所以我想怎樣就怎樣」。我們也常聽人說：自由不是想做甚麼就做甚麼。保羅比這句話說得更深，他在第十三節轉身擋住剪刀：「只是不可將你們的自由當作放縱情慾的機會」（5:13）。"],["p","那風箏要怎樣才飛得起來？還缺一樣：風。本章的關鍵字「靈」，原文 πνεῦμα（pneuma） 也有風的意思；主耶穌就用「風隨著意思吹」（約 3:8）說聖靈的工作。比方有它的限度：我們不是被線扯著的玩具，線比的是我們屬基督（5:24），風比的是聖靈。這一課走三步：不要綁回去（5:1–12），不要剪斷（5:13–15），順著風飛（5:16–26）。"],["d",["保羅說「不要再被奴僕的軛挾制」，那基督徒是不是就不必守任何規矩了？","不是。保羅拆掉的是「進門的條件」，不是「生活的方向」。割禮在加拉太代表的是：你要先做到這一樣，才算神的子民。保羅說不，基督已經釋放了我們，我們站在神面前只憑信靠他。可是同一章他也說，信心會生發仁愛，自由不可成為放縱的機會。所以基督徒仍然有讀經、聚會、奉獻的好習慣。分辨的方法是問一句：我做這件事，是因為我已經被接納，還是為了換取被接納？前者是兒子的生活，後者就是一副軛。若我拿這個習慣去量別人夠不夠屬靈，它多半已經變成「再加上」了。"]],["h","二、不要再綁回欄杆上：軛與酵"],["p","第一節的原文是同一個字根重複兩次：為了自由，基督使我們自由。基督釋放我們，不是要把我們轉手交給另一個主人。軛是套在牛頸上的橫木，它的重不只在木頭，是從此不能自己決定往哪裡走。請注意那個「再」字：這些外邦信徒從前已經給偶像作過奴僕（4:8），現在有人要他們換一副律法的軛。形狀不同，都是軛。"],["p","第二、三節是保羅的算術。攪擾的人說：基督加一點割禮，比較穩妥。保羅說：「若受割禮，基督就與你們無益了。」（5:2）不是更多，是基督無益；因為一旦割禮成了條件，你倚靠的就不再是基督，是基督加上你自己。而且受割禮的人「他是欠著行全律法的債」（5:3）。割禮不是一張單據，是一整本帳。"],["p","接著是全章最重的一句：「你們這要靠律法稱義的，是與基督隔絕，從恩典中墜落了。」（5:4）請先看主詞：「要靠律法稱義的」。「墜落」這個字，原文用來說一條船被風沖離航道；偏離的方向是從靠恩典偏到靠自己的表現，不是軟弱了一次就掉下去。真信徒會不會失去救恩，議題頁有兩派並陳；兩邊都同意，回來的路就是回到恩典。今天最容易從恩典中墜落的，常常不是跌倒的人，是以為自己做得夠好的人。"],["p","第五、六節把路指出來。「原來在基督耶穌裡，受割禮不受割禮全無功效，惟獨使人生發仁愛的信心才有功效。」（5:6）這一句兩邊都擋。它擋住律法主義：你的資歷、背景、宗派標記，在基督裡都不加分。它也擋住放縱：信心若生不出愛，就不是這一節說的信心。次序要清楚：我們因信稱義，然後這信心藉著愛活出來。愛不是門票，是信心的出口。"],["p","「你們向來跑得好，有誰攔阻你們，叫你們不順從真理呢？」（5:7）「攔阻」原文是在跑道上從旁邊切進來，把人撞出路線。保羅接著用一句諺語：「一點麵酵能使全團都發起來。」（5:9）哥林多前書講義第五章講過保羅用同一句話。酵不在乎大小，在乎會不會擴散；一條附加的規矩，遲早改變整個福音的味道。"],["p","第十到十二節的話很重。保羅說：「但攪擾你們的，無論是誰，必擔當他的罪名。」（5:10）他把審判交給神，自己不執行。第十二節「恨不得那攪亂你們的人把自己割絕了」（5:12）是一句咬著牙的反諷：既然你們以割為敬虔，何不割到底？他對準的是拆毀羊群的教師，不是軟弱的羊；他的怒氣是為了別人的自由，不是自己的面子。這一節不能拿來替今天在網路上罵人辯護；它的鋒芒其實向著裡面，包括站在台上的人。"],["d",["讀到「從恩典中墜落了」，我很怕自己已經失去救恩，該怎麼辦？","先請你看這一節的主詞：「你們這要靠律法稱義的」。保羅說的是一群人正打算用割禮和律法換取在神面前的義，等於從恩典偏到靠自己的表現上；不是說一個信徒犯了一個罪、軟弱了一次，就掉出恩典。會不會失去救恩，議題頁有兩派並陳；兩派都同意，回來的路就是回到恩典。你會因為怕失去神而難過，這份害怕本身就說明你並不想靠自己。把你最怕的那件事向主說出來，也找一位信得過的牧者或組長談一談，不要一個人在夜裡反覆算帳。"]],["d",["保羅說「恨不得……把自己割絕了」，那我們在網路上罵假教師兩句也可以嗎？","不可以拿這一節作理由。保羅這句話有三個界線。第一，他對準的是把人帶離福音的教師，不是軟弱的羊，也不是意見不同的弟兄姊妹。第二，他說的是一個交給神的願望，第十節已經說「必擔當他的罪名」，審判是神的，不是教會或網友去執行。第三，他的怒氣是為了別人的自由，不是為了自己的面子或贏一場辯論。同一章第十五節就警告「相咬相吞」。所以很想開罵的時候，先問兩個問題：對方真的是在基督之外加上得救的條件嗎？我說這句話是為了保護人，還是為了出氣？真有錯誤的教導，交給教會長執合宜地處理。"]],["h","三、原文亮光：彼此作奴僕、一步一步走、一個果子"],["p","從第十三節起，保羅轉身去擋剪刀。這一段有三個字，拆開來，整章就站起來了。"],["p","第一個字在第十三節：「弟兄們，你們蒙召是要得自由，只是不可將你們的自由當作放縱情慾的機會，總要用愛心互相服事。」（5:13）「機會」原文 ἀφορμὴν（aphormēn） 是軍事用語，指發動攻擊的據點；自由交給肉體，就是替敵人留一塊灘頭。「互相服事」原文是 δουλεύετε ἀλλήλοις（douleuete allēlois），「彼此作奴僕」，和第一節「奴僕的軛」是同一個字根。這是全章最大的翻轉：基督救我們脫離奴役，是為了叫我們彼此作愛的奴僕。奴僕是被逼著服事，兒子是甘心服事；而且是「彼此」，沒有一群人只能付出。"],["p","第二個字在第十六節：「我說，你們當順著聖靈而行，就不放縱肉體的情慾了。」（5:16）「行」原文 περιπατεῖτε（peripateite），是很日常的行走，一步一步。是上班、吃飯、回訊息的每一步。後半句原文用 οὐ μὴ（ou mē），雙重否定，希臘文裡最強的「絕不」。所以後半句不是第二道命令，是第一道命令帶來的應許。對付肉體的方法，不是眼睛一直盯著肉體，是腳步跟上聖靈。"],["p","第三個字在第二十二節：「聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。這樣的事沒有律法禁止。」（5:22–23）肉體出產的是 τὰ ἔργα（ta erga），複數的「作為」，一件一件做出來；聖靈出產的是 ὁ καρπὸς（ho karpos），單數的「果子」，後面的動詞也是單數。不是九個果子讓你挑幾個來結，是一個果子，九種滋味。你不能只要其中一樣，用它頂替其他八樣。"],["p","這就是我們團
