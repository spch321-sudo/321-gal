封信的關係，必須在開卷交代清楚。","pos":[["【一】經文問的是甚麼","","<p>兩封信有許多相同的骨架。都引同一節創世記：「正如『亞伯拉罕信神，這就算為他的義』。」（3:6）——羅馬書也說「亞伯拉罕信神，這就算為他的義。」（羅 4:3）都引同一節哈巴谷書：「義人必因信得生」（3:11；羅 1:17）。都講兒子的名分與聖靈的呼叫：「呼叫：『阿爸！父！』」（4:6）——「因此我們呼叫：『阿爸！父！』」（羅 8:15）。都用「愛人如己」總結律法（5:14；羅 13:9）。<\/p><p>但兩封信也有明顯的不同。加拉太書說律法「原是為過犯添上的……並且是藉天使經中保之手設立的」（3:19），羅馬書卻說「這樣看來，律法是聖潔的，誡命也是聖潔、公義、良善的。」（羅 7:12）加拉太書用夏甲比「現在的耶路撒冷」（4:25），羅馬書卻用三章（羅 9–11）為以色列哀哭、盼望：「於是以色列全家都要得救。」（羅 11:26）<strong>經文問的是：這是同一個福音的兩種寫法，還是保羅的想法改變了？讀加拉太書時，要不要先拿羅馬書來解它？<\/strong><\/p>"],["草稿與定稿說（加拉太書是羅馬書的雛形）","","<p>認為加拉太書是保羅在一場危機裡倉促寫下的第一版因信稱義論述，羅馬書則是他經過多年思考後的完整版本；所以讀加拉太書遇到難解處，就以羅馬書為準。宗教改革以來，許多註釋實際上就是這樣讀的，路德的加拉太書註釋處處帶著羅馬書的框架。這派的優點是看見兩封信確實是同一位作者、同一套福音，可以互相照明。<\/p><p><strong>難處：<\/strong>加拉太書不是一份未完成的草稿，它是一封完整、有自己論證與處境的信；若一律拿羅馬書來解，加拉太書自己的聲音——安提阿的餐桌、割禮作為門檻、兩個婦人的比方、6:15 的新造——就會被壓平，只剩下一份「羅馬書摘要」。而且若加拉太書寫於羅馬書之前好幾年（議題「加拉太在哪裡？這封信寫於何時？」的南加拉太早期說），那時羅馬書還不存在，加拉太的教會只能照加拉太書讀加拉太書。<\/p>"],["發展說（保羅對律法的看法從加拉太書到羅馬書有了改變）","","<p>認為兩封信之間保羅的思想有實質的發展，甚至修正：加拉太書在辯論的熱度裡把律法說得幾乎是負面的（天使設立、為過犯添上、使人為奴），羅馬書冷靜下來以後，才說律法聖潔、說「我們因信廢了律法嗎？斷乎不是！更是堅固律法。」（羅 3:31）以色列的問題也一樣：加拉太書幾乎不談，羅馬書則肯定神對以色列的揀選不會後悔。這派的優點是誠實面對兩封信語氣與重點的差異，不急著把它們抹成一樣。<\/p><p><strong>難處：<\/strong>加拉太書本身並沒有說律法是壞的：「這樣，律法是與神的應許反對嗎？斷乎不是！」（3:21）律法是「訓蒙的師傅，引我們到基督那裡」（3:24），最後還「都包在『愛人如己』這一句話之內」（5:14）。兩封信的差異，用處境與目的就能解釋，不一定要假定保羅改變了神學；而且發展說很容易讓讀者覺得聖經作者在自相矛盾。<\/p>"],["同一個福音，兩種處境說（一封救火的信、一封介紹自己的信）","","<p>認為兩封信講的是同一個福音，但處境完全不同。<strong>加拉太書是一封救火的信<\/strong>：保羅親手建立的教會正被「別的福音」吞沒，他沒有時間寫感恩段，開口就是「我希奇你們這麼快離開那藉著基督之恩召你們的，去從別的福音。」（1:6）所以語氣急、對律法作為得救條件的一面說得重。<strong>羅馬書是一封介紹自己的信<\/strong>：寫給一間他還沒有去過的教會，「我屢次定意往你們那裡去……只是到如今仍有阻隔」（羅 1:13），要他們支持他往西班牙宣教（羅 15:24），而那間教會裡猶太與外邦信徒之間有張力，所以他從頭到尾有系統地展開，並且特別處理以色列與律法的正面角色。<\/p><p>這派的優點是同時尊重兩封信。<strong>難處<\/strong>是它仍需要逐處說明某些說法上的差異，不能用「處境不同」四個字一筆帶過；例如 3:19「藉天使」設立律法的說法，在羅馬書裡就沒有對應。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：同一個福音，兩種處境——加拉太書是一封救火的信，羅馬書是一封介紹自己的信。<\/strong>兩封信都說：人稱義不是因行律法，乃是因信基督（2:16；羅 3:28）；律法不是與應許反對的（3:21；羅 3:31）；信的人得著兒子的名分與聖靈（4:6–7；羅 8:14–17）。<\/p><p>讀法上，本講義<strong>先讓加拉太書自己說話<\/strong>：每一章照加拉太人自己的處境讀，不先拿羅馬書的框架套進來；遇到需要補充的地方——特別是律法的正面角色與以色列的將來——才用羅馬書來<strong>補充<\/strong>，不用它來<strong>改寫<\/strong>。所以第 3 章講律法時，必定把 3:21–25 的「師傅」一起講；第 4 章與第 6 章講夏甲、講 6:16 時，必定回指羅馬書 11 章（議題「在基督裡成為一：族群、性別、以色列與教會」）。發展說的觀察可以陳列，但本講義不採「保羅改變了神學」的結論。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該——反過來說，這兩封信的差異正好讓我們看見一位真實的牧者。對一間正在被拉走的教會，他會大聲喊、會說重話、會說「我為你們心裡作難」（4:20）；對一間還沒見過面的教會，他會耐心地從頭講起。<strong>福音沒有變，變的是他怎樣把同一個福音遞到不同的人手裡。<\/strong><\/p><p>這也給今天的講台一個榜樣：同一個福音，對正在被規條壓垮的人，要說「基督釋放了我們」（5:1）；對正在懷疑神是否還愛以色列、還愛自己的人，要說「神的恩賜和選召是沒有後悔的。」（羅 11:29）兩封信加在一起，不是兩套神學，是一位神在兩個處境裡對他的兒女說話。<\/p>"]],"con":[],"say":"本講義的立場：加拉太書與羅馬書是同一個福音、兩種處境——一封救火的信，一封介紹自己的信。先讓加拉太書照它自己的處境說話，再用羅馬書補充律法的正面角色與以色列的將來；用羅馬書補充，不用羅馬書改寫。發展說的觀察可以陳列，但不採「保羅改變了神學」的結論。","care":"這一題容易讓信徒覺得「聖經前後說法不一」而不安。講台上不需要展開學術爭論，只要讓會眾看見同一位牧者怎樣對不同的教會說話。也要想到會眾裡曾被加拉太書的重話嚇到的人——聽到「從恩典中墜落」「與基督隔絕」就以為自己完了——對他們，要指出 5:4 的上下文是「要靠律法稱義的」，並且把羅馬書 8 章的安慰一起帶給他。不要用這一題製造「哪一封信比較屬靈」的比較。"},{"id":"ISS00_8","t":"這些爭議該不該影響一個人的信心？","r":"2:20；5:6；6:14--15","ch":[],"why":"全卷通用：爭議與信心。這一卷的議題頁要陳列許多爭論：傳統觀點與保羅新觀、「信基督」還是「基督的信實」、北加拉太說與南加拉太說、6:16 的「和」與「就是」、古卷異文與分節位移。有些讀者會因此鬆一口氣，有些讀者卻會開始不安：連稱義的意思都有爭論，我信的到底可不可靠？而加拉太書本身又是一封對「別的福音」寸步不讓的信。甚麼可以爭、甚麼不能讓，必須在開卷講清楚。","pos":[["【一】經文問的是甚麼","","<p>加拉太書同時給了兩幅圖。一幅是寸步不讓：「但無論是我們，是天上來的使者，若傳福音給你們，與我們所傳給你們的不同，他就應當被咒詛。」（1:8）另一幅是極大的彈性：保羅不肯讓提多受割禮（2:3），卻在不久之後親手給提摩太行了割禮（徒 16:3）；他說「受割禮不受割禮全無功效」（5:6），又說「受割禮不受割禮都無關緊要，要緊的就是作新造的人。」（6:15）同一個人，在一件事上絕不退讓，在另一件事上可以放手。<\/p><p>這一卷的議題頁會陳列許多爭論，有語法的、有歷史的、有神學的。<strong>經文問的是：甚麼是「別的福音」，不能讓？甚麼是可以有不同看法的事，要彼此接納？一個人知道了這麼多爭議以後，信心該建立在哪裡？<\/strong><\/p>"],["完美答案說（每一題都必須有唯一的標準答案，信心才站得住）","","<p>認為一位真正信靠聖經的人，在每一個議題上都應當有清楚而唯一的答案；承認有爭議，就是承認聖經不清楚，信心就會動搖。所以教會應當在律法、稱義、末世、性別、以色列等每一題上都立好標準答案，要信徒照著相信。這派的心志是保護信徒，不讓他們在各種教訓中搖擺不定，這份心是好的。<\/p><p><strong>難處：<\/strong>這正是加拉太書所警告的那一步：把「我們這一派的答案」加在基督後面，當成算不算真信徒的條件。保羅自己承認「我們如今彷彿對著鏡子觀看，模糊不清」（林前 13:12）；他也說在某些事上「各人心裡要意見堅定」（羅 14:5）。把每一題都升格成福音本身，結果是信心變得很脆——任何一題的答案動了，整個信仰就跟著倒。<\/p>"],["爭議即不可靠說（既然甚麼都有爭論，信仰就只剩個人意見）","","<p>認為既然學者們連「律法的行為」「信基督」「神的以色列民」都意見分歧，那就表示聖經沒有確定的教導，每個人照自己的感覺讀就好；保羅對「別的福音」那麼強硬，只是第一世紀的宗教排他。這派誠實地面對了爭議的存在，也提醒教會不要假裝一切都很簡單。<\/p><p><strong>難處：<\/strong>它把爭議的「細節」與爭議的「範圍」混在一起了。學者們爭論的，是「律法的行為」最主要指身分標記還是一切努力，卻沒有人否認 2:16 說人稱義不是因行律法；爭論的是 6:16 的 καί，卻沒有人否認 3:28 說在基督裡都成為一了。而且保羅的強硬並不是排他的傲慢：他把第一個放上檢驗台的是「我們」（1:8），他拒絕的是任何人——包括他自己——在基督之外再加上得救的條件。<\/p>"],["中心與邊緣說（福音的中心不能讓，其餘的事可以有不同看法）","","<p>認為加拉太書本身就劃出了一條線。<strong>不能讓的<\/strong>，是福音的中心：「基督照我們父神的旨意，為我們的罪捨己，要救我們脫離這罪惡的世代」（1:4）；人稱義是因信基督，不因行律法（2:16）；「基督既為我們受了咒詛」（3:13）；信的人得著兒子的名分與聖靈（4:6–7）。誰在這些上面加上條件，就是「別的福音」。<strong>可以有不同看法的<\/strong>，是在這中心之外的解釋、歷史與實踐的問題：收信人在哪裡、某個屬格怎樣讀、某個連接詞怎樣譯、教會怎樣整理律法。<\/p><p><strong>難處：<\/strong>中心與邊緣的界線本身有時也會被爭論——有人會說性別或安息日就是中心。所以劃線的時候，要以經文自己最清楚、最反覆強調的事為中心，而不是以某一個宗派最在意的事為中心；並且要記得，把邊緣升格成中心，本身就是加拉太的錯。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：採中心與邊緣的讀法。<\/strong>福音的中心不能讓：基督為我們的罪捨己（1:4），人稱義是因信基督、不因行律法（2:16），基督為我們受了咒詛（3:13），信的人是兒子、不是奴僕（4:7），「惟獨使人生發仁愛的信心才有功效」（5:6），我們「只誇我們主耶穌基督的十字架」（6:14）。這幾件事，各派都同意，兩千年沒有被任何學術爭論動搖。<\/p><p>其餘的事，本講義照鐵律三：先陳列各家、說出各自的難處、再給判斷，並且把判斷的理由講出來；講台與教學場上一句帶過，指向議題頁。古卷異文、2:19／2:20 的分節位移、保羅對磯法的話到哪裡結束，都照實交代，不講成懷疑。全卷的樞紐是 2:20，引它時一律引全句：「我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信神的兒子而活；他是愛我，為我捨己。」（2:20）爭議可以留在議題頁裡，這一節要帶回家。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。信心不是建立在「我對每一題都有答案」上，而是建立在那一位「愛我，為我捨己」的神的兒子身上。學者的爭論會一直持續下去；但你可以在不知道 6:16 的 καί 怎樣譯的情況下，完全確定自己是神的兒子，因為「神就差他兒子的靈進入你們的心，呼叫：『阿爸！父！』」（4:6）<\/p><p>這一卷要讀完的人，<strong>不是更會辯論，而是更不敢在十字架之外誇任何東西<\/strong>——包括不誇自己的學問、自己的宗派、自己的答案。保羅在信末寫：「受割禮不受割禮都無關緊要，要緊的就是作新造的人。」（6:15）爭議是重要的，但不是最要緊的；最要緊的，是基督在我裡面活著，而我在愛裡活出來。<\/p>"]],"con":[],"say":"本講義的立場：福音的中心不能讓——基督為我們的罪捨己、人稱義是因信基督不因行律法、基督為我們受了咒詛、信的人是兒子不是奴僕；其餘解釋、歷史與實踐的問題，先陳列各家、說出難處、再給判斷，講台一句帶過、指向議題頁。把邊緣升格成中心，本身就是加拉太的錯。","care":"席上會有正在信仰危機裡、問題多到不敢說出口的人，也會有一聽到「學者有爭論」「有古卷這樣寫」就不安、覺得教會怎麼甚麼都不確定的人，還有曾經在某一題上——規條、性別、節慶——被教會傷過、因此連神也不敢信的人。對第一種人，不要說「你就是信心不夠」，也不要急著用一堆答案堵住他，先陪他；對第二種人，指給他看 2:20 與 4:6 那幾件從來沒有被任何爭議動搖的事；對第三種人，讓他知道傷他的是人錯用了經文，不是那位愛他、為他捨己的基督。疑惑若伴隨長期的失眠、無望感或輕生念頭，會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS01_1","t":"1:1「不是由於人」——今天有人自稱直接從神領受、不需要教會的印證，可以嗎？","r":"1:1；1:11--12；2:2","ch":[1],"why":"1:1 與 1:11--12 常被拿來當作「我直接從神領受，誰也不能質疑我」的根據；有人據此拒絕長執的勸告、離開教會自立門戶，甚至用「神對我說」控制別人。另一面，也有教會把「按立」「授權」看得高過神的呼召。這一題關係到教會怎樣分辨呼召，也關係到被操控過的人能不能重新信任教會。","pos":[["【一】經文問的是甚麼","","<p>保羅一開口就說：「作使徒的保羅（不是由於人，也不是藉著人，乃是藉著耶穌基督，與叫他從死裡復活的父神）」（1:1）。原文 <strong>οὐκ ἀπʼ ἀνθρώπων οὐδὲ διʼ ἀνθρώπου<\/strong>（ouk ap' anthrōpōn oude di' anthrōpou），一個講來源，一個講管道。第 12 節又說他的福音「不是從人領受的，也不是人教導我的」（1:12）。問題是：保羅是在說使徒不需要教會的印證嗎？今天的信徒可以用同樣的話，替自己的領受免除一切檢驗嗎？<\/p>"],["個人直接領受說","","<p>認為既然保羅的福音不是從人來的，今天真正被神呼召的人也一樣：神直接對他說話，就不需要任何人或團體認可；教會的勸告、長執的分辨，只是「屬血氣的人商量」（1:16）。這一說看重神的主權，也提醒教會不要以為自己握有發放呼召的權利。<\/p><p><strong>難處：<\/strong>它忽略了同一個保羅後來「把我在外邦人中所傳的福音對弟兄們陳說」（2:2），耶路撒冷的柱石也「就向我和巴拿巴用右手行相交之禮」（2:9）。保羅的來源不是人，他卻甘心讓眾人驗證；而且他還特別說，連「我們」也要被福音檢驗（1:8）。把這一節當作免檢證，正好與經文的方向相反。<\/p>"],["教會授權說","","<p>認為呼召必須經過教會正式的按立與授權才算數，個人說自己蒙召並沒有分量；保羅的情況是使徒時代的特例，今天的事奉者都要從教會領受差遣。這一說看重秩序與群體的分辨，能防止自封的領袖。<\/p><p><strong>難處：<\/strong>保羅寫這兩節，正是要否認「福音的真偽由人的授權決定」；若把教會的手續看得高過神的呼召，就可能重演加拉太的處境——用一道人設的門檻決定誰算數。歷史上也有不少真實的呼召，一開始並沒有被體制承認。<\/p>"],["來源與印證並重說","","<p>認為 1:1 講的是來源：福音與使徒職分出於神，不由人授權；但來源出於神，不等於不受檢驗。神的呼召常常透過時間、群體、果子被印證：保羅三年後見磯法（1:18），十四年後把福音對弟兄們陳說（2:2），最後是眾教會「為我的緣故，歸榮耀給神」（1:24）。來源在神，印證在教會，兩者並不衝突。<\/p><p><strong>難處：<\/strong>這一說需要分辨「印證」與「控制」的分別：有些教會借印證之名壓住神的工作，有些人借呼召之名拒絕一切問責。分辨需要時間，也需要彼此謙卑。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採來源與印證並重說：福音與呼召的來源是神，不是人；但從神來的呼召，甘心讓教會看見、驗證。<\/strong>保羅「不是由於人」，卻開頭就與「一切與我同在的眾弟兄」（1:2）站在一起；獨立的權柄，不等於孤單的權柄。<\/p><p>真正從神來的領受有幾個記號：它不在基督之外加上得救的條件（1:8），它不怕被檢驗（2:2），它結出的果子叫人把榮耀歸給神（1:24）。屬靈權柄的界線，本講義回指哥林多後書講義的全卷立場三：權柄是為造就，不是為轄管。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。神今天仍然親自呼召人，也仍然把人放在一個身體裡。你不必在「只聽神」與「只聽人」之間二選一。<\/p><p>若有人對你說「神告訴我，你應當……」，而那件事要你離開所有勸告你的人、要你付出金錢或身體、要你不准問問題，你可以平靜地把它拿到成熟的肢體面前一同分辨。保羅自己都願意被檢驗，真正從神來的話不怕被檢驗。<\/p>"]],"con":[],"say":"本講義的立場：福音與呼召的來源是神，不是人的授權；但從神來的呼召甘心讓教會看見、驗證，真正從神來的領受不怕被檢驗。屬靈權柄的界線，回指哥林多後書講義的全卷立場三。","care":"會眾席上可能有人曾被一位自稱「神直接告訴我」的領袖控制、羞辱，甚至在金錢或身體上受到傷害；也有人真實地感到神的呼召，卻長年被教會忽略、否定。講這一題不要一面倒：不嘲笑感受到呼召的人，也不要求受過屬靈控制的人立刻重新信任領袖。會後單獨關心，若涉及屬靈操控或任何形式的傷害，陪他找可信任的長執與專業協助。"},{"id":"ISS01_2","t":"1:6--9「他就應當被咒詛」——可以拿來咒詛跟我們教義不同的人嗎？甚麼才算「別的福音」？","r":"1:6--9；5:2--4；林後11:4","ch":[1],"why":"這兩節是新約裡最重的話之一，也最常被誤用：有人拿它咒詛別的宗派，把洗禮方式、方言、教會治理的差異都說成「別的福音」；也有人因為害怕這兩節，乾脆說「教義不重要，大家都一樣」。這一題要把「別的福音」的界線說清楚，保護人不被濫用的咒詛所傷，也不讓福音的核心被稀釋。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「但無論是我們，是天上來的使者，若傳福音給你們，與我們所傳給你們的不同，他就應當被咒詛。」（1:8）第 9 節再說一次。原文 <strong>ἀνάθεμα ἔστω<\/strong>（anathema estō），交在神的審判之下；<strong>παρʼ ὃ<\/strong>（par' ho）可以讀作「相反於」，也可以讀作「在……之外加上」。問題是：甚麼才算「別的福音」？這兩節可以拿來咒詛教義或宗派不同的人嗎？<\/p>"],["凡教義錯誤說","","<p>認為凡是教導與正確教義不合的，都是「別的福音」，都在這兩節的咒詛之下；所以教會要嚴格劃清界線，與一切持不同看法的團體分開，甚至公開宣告他們是異端。這一說看重真理，不肯在福音上妥協。<\/p><p><strong>難處：<\/strong>它把「福音」擴大成一個宗派的全部教義，結果連點水或浸水、聚會講不講方言、長老制或會眾制，都成了得救與否的界線。這正好重演攪擾者的錯：把自己的一套加成得救的條件。保羅自己在別處就容許「有人看這日比那日強」（羅 14:5）。<\/p>"],["只限當時割禮說","","<p>認為這兩節只針對第一世紀要外邦人受割禮的那一群人，是一個歷史事件，今天已經沒有人傳割禮，所以這兩節對今天沒有直接的適用；教會不應該再用「別的福音」這種字眼評論任何人。這一說想保護教會不再彼此咒詛。<\/p><p><strong>難處：<\/strong>保羅把準則說成普遍的：「若有人傳福音給你們，與你們所領受的不同」（1:9）；而且他在哥林多也看見同一種結構：「另傳一個耶穌」（林後 11:4）。把這兩節鎖在第一世紀，會讓教會失去分辨的能力，也看不見今天換了名目的「割禮」。<\/p>"],["基督之外加上得救條件說","","<p>認為從全卷看，「別的福音」有明確的內容：在基督之外加上得救的條件。保羅自己下了定義：「你們這要靠律法稱義的，是與基督隔絕，從恩典中墜落了」（5:4）。所以準則不是「跟我們一不一樣」，而是「得救是不是單單靠基督」；宗派之間真實的差異，多半不在這條線上。<\/p><p><strong>難處：<\/strong>這一說需要分辨哪些是福音的核心、哪些是次要的差異，而這條線在教會歷史上一直有討論；也有人會借「只要不加條件就好」把一切教義都看成無所謂，忘了保羅同樣看重所傳的是「基督的福音」（1:7）。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採「基督之外加上得救條件說」。<\/strong>「別的福音」是在基督之外加上得救的條件；宗派之間在洗禮方式、恩賜、治理、敬拜形式上的差異，是真實的差異，卻不是 1:8 所說的別的福音。<\/p><p>保羅第一個放上檢驗台的是「我們」，所以這兩節首先是講台的鏡子；ἀνάθεμα 是交在神的審判之下，不是交給教會去懲罰、羞辱、驅逐。割禮在加拉太代表甚麼、今天的「割禮」可能是甚麼，本講義的全卷立場見 <strong>議題「書信的處境與原則」<\/strong>；「攪擾你們的人」是誰、傳的是甚麼，見 <strong>議題「『攪擾你們的人』是誰？」<\/strong>。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。這兩節不是叫你活在「我會不會被咒詛」的懼怕裡，而是給你一份自由：你不必在各種名望之間比較誰比較大，只要問一件事——傳的是不是那一位為我們的罪捨己的基督，有沒有在他之外加上別的。<\/p><p>若你曾被人說成「異端」「不得救」，只因為你的教會用不同方式施洗或敬拜，你可以把這一節的準則拿回來：單單靠基督，就是福音。<\/p>"]],"con":[],"say":"本講義的立場：「別的福音」是在基督之外加上得救的條件；宗派之間的差異不是別的福音，這兩節不可拿來咒詛教義或宗派不同的人。本講義的全卷立場見議題「書信的處境與原則」、議題「『攪擾你們的人』是誰？」。","care":"會眾席上可能有人曾被原來的教會宣告為「異端」或被趕出去，有人的家人在別的宗派而常被身邊的人批評，也有人剛從一個真正加上條件、控制信徒的團體裡走出來，心裡仍有懼怕。講這一題時，不點名任何宗派或教會，不用嘲諷的語氣；對剛離開控制性團體的人，不急著要他表態，會後單獨陪伴，必要時協助尋求專業協助。"},{"id":"ISS01_3","t":"1:10「我豈是討人的喜歡嗎？」——面子文化與討好型人格：顧念人與討人喜歡有甚麼分別？","r":"1:10；羅15:2；帖前2:4","ch":[1],"why":"華人教會很重面子與和諧：講台上不敢講罪，小組裡不敢說不同意，對長輩、對大奉獻的會友，話總是繞三圈。另一面，也有人拿 1:10 替自己的尖刻開脫，說「我不討人喜歡，我只討神喜歡」。這一題關係到信徒怎樣在愛人與說真話之間站穩，也關係到長期不敢說不的人能不能得到釋放。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「我現在是要得人的心呢？還是要得神的心呢？我豈是討人的喜歡嗎？若仍舊討人的喜歡，我就不是基督的僕人了。」（1:10）原文 <strong>ζητῶ ἀνθρώποις ἀρέσκειν<\/strong>（zētō anthrōpois areskein），「尋求討人喜歡」；<strong>Χριστοῦ δοῦλος<\/strong>（Christou doulos），基督的奴僕。可是保羅在別處又說「我們各人務要叫鄰舍喜悅，使他得益處，建立德行」（羅 15:2）。問題是：基督徒到底要不要在乎別人的感受？<\/p>"],["不必在乎人說","","<p>認為 1:10 的意思是：基督徒只要對神負責，不必理會別人的看法；在乎別人的感受就是討人喜歡，說話直接、不顧情面才是忠心。這一說抓住了經文的鋒利，也提醒人不要被人的眼光綁住。<\/p><p><strong>難處：<\/strong>它忽略了保羅自己「叫鄰舍喜悅」的教導（羅 15:2），也忽略了他「向甚麼樣的人，我就作甚麼樣的人」的心志；把 1:10 講成冷漠，會讓說話傷人的人披上屬靈的外衣，而 1:10 前後的重話，其實是出於愛（4:19）。<\/p>"],["和諧優先說","","<p>認為在重視關係與面子的文化裡，維持和諧本身就是愛；保羅的語氣是因為情況緊急，今天的信徒應當以不得罪人為原則，有不同意見最好私下、委婉，甚至不說。這一說看重文化處境，也提醒人說話要有溫柔。<\/p><p><strong>難處：<\/strong>當和諧成了最高原則，就有一些真話永遠說不出口：罪不能講、傷害不能說、不公義不能指出。保羅說得很清楚，若「仍舊討人的喜歡」，就不是基督的僕人了；和諧若取代了主人，就不再是美德。<\/p>"],["誰是主人說（動機說）","","<p>認為分別不在說話的方式，而在誰是主人、為了誰。保羅在另一封信說：「不是要討人喜歡，乃是要討那察驗我們心的神喜歡」（帖前 2:4）。叫鄰舍喜悅，是為了對方得益處；討人喜歡，是為了自己得認可。前者是愛，後者是怕。同樣是溫柔的話，前者在必要時願意說難聽的真話，後者永遠說不出口。<\/p><p><strong>難處：<\/strong>動機不容易看清，人很會用「為你好」包裝自己的控制，也很會用「顧念你」包裝自己的懼怕；所以這一說需要長期在神面前省察，也需要信得過的肢體幫我們看見盲點。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採誰是主人說：1:10 拒絕的是讓人的眼光作主人，不是拒絕愛人。<\/strong>顧念人的感受是美德；但當「別人會怎麼看我」成了我做決定的那一位主人，基督就被擠到了第二位。<\/p><p>「討好型人格」是一般的描述，本講義不在講台上拿來給人貼標籤。1:10 給的出路不是「更努力不討好」，而是先被那一位「為我們的罪捨己」（1:4）的基督愛過：被這樣愛過的人，才有力氣不必討每一個人喜歡。面子與「希圖外貌體面」的問題，在 6:12 還會再談。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。若你發現自己很怕人不高興，這不表示你沒有得救，只表示你心裡還有一位要退位的主人。神不是要你從討好人，變成討好神的另一種焦慮；他要你知道，你已經被接納了。<\/p><p>可以從一件小事開始：這一週用溫柔、尊重的話，說出一句你一直不敢說的真話。說完以後，不必等對方的掌聲。<\/p>"]],"con":[],"say":"本講義的立場：1:10 拒絕的是讓人的眼光作主人，不是拒絕愛人；叫鄰舍喜悅是為了對方得益處，討人喜歡是為了自己得認可。出路是先被基督的愛接住，有一位真正的主人。","care":"會眾席上可能有人在家庭、婚姻或職場裡長期被控制、被要求委屈求全，從小學會用討好換取安全；他的討好不是虛偽，是求生。不在講台上給人貼心理標籤，也不叫他「再順服一點、再忍一下」；若他身處有暴力或控制的關係，人身安全優先，會後單獨關心，陪他找可信任的肢體，必要時協助尋求專業協助。"},{"id":"ISS01_4","t":"1:15「從母腹裡分別出來」——預定與呼召：神是不是在人出生以前就決定了一切？","r":"1:15--16；耶1:5；賽49:1","ch":[1],"why":"1:15 常被引來討論預定論：神是不是在人出生前就揀選了誰得救、誰不得救？也常被拿來對年輕人說「你生下來就注定要作傳道人」。讀法不同，直接影響人怎樣看自己的生命、怎樣面對呼召，也影響那些覺得自己「生來就不被期待」的人，聽不聽得見神的恩典。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「然而，那把我從母腹裡分別出來、又施恩召我的神，既然樂意將他兒子啟示在我心裡，叫我把他傳在外邦人中」（1:15--16）。原文 <strong>ὁ ἀφορίσας με ἐκ κοιλίας μητρός μου<\/strong>（ho aphorisas me ek koilias mētros mou）。保羅沒有引經，但這使我們想起耶利米：「你未出母胎，我已分別你為聖」（耶 1:5）。問題是：這一節講的是個人得救的預定，還是使命的呼召？神的主權與人的回應怎樣並存？<\/p>"],["個人得救預定說","","<p>認為這一節與弗 1:4「創立世界以前」一樣，顯明神在人出生之前，按自己的旨意揀選了人得救；保羅的歸主完全是神主權的恩典，連他在逼迫教會的時候，神的揀選也沒有改變。這一說高舉神的主權，叫人不能在得救上誇口。<\/p><p><strong>難處：<\/strong>1:15--16 的焦點是保羅的使命——「叫我把他傳在外邦人中」，而不是一般地討論誰得救、誰不得救；若把這一節直接推成完整的預定論體系，容易超過經文本身要說的，也容易讓人把呼召讀成冷冰冰的命定。<\/p>"],["預知與回應說","","<p>認為神的揀選建立在他的預知上：神預先知道保羅會回應，所以從母腹裡就分別他；保羅在大馬士革路上仍然要親自回應「主啊！你是誰？」（徒 9:5）。這一說看重人的回應與責任，避免把人看成被動的棋子。<\/p><p><strong>難處：<\/strong>這一節的主詞全是神：分別出來、施恩召、樂意、啟示；保羅自己的動詞要到後面才出現，而且是否定的。若把重點放在「神看見保羅會回應」，就削弱了經文強調的「施恩」——保羅當時正在逼迫教會，看不出有甚麼值得被揀選的。<\/p>"],["使命呼召說","","<p>認為保羅在這裡把自己放在先知蒙召的行列裡（耶 1:5；賽 49:1），講的是職分與使命的呼召：神在他出生前就定意要用他向外邦人傳福音。重點不是解決預定論的系統爭論，而是說明：連使徒的呼召，都在任何記號、任何功課之前，所以外邦人的得救，也不需要再加上割禮。<\/p><p><strong>難處：<\/strong>這一說若講得太窄，會迴避神主權與人回應的真實問題；而且保羅的使命與他的得救在大馬士革路上是同一件事，很難完全分開。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義在本章採使命呼召說為主要讀法，同時承認這一節見證神在救恩上的主權恩典。<\/strong>經文的重點是：呼召是神「施恩」召的，在保羅還沒有受割禮、還在逼迫教會的時候，神已經定意；這正是全章的論證——福音不是出於人，也不需要人再加上甚麼。<\/p><p>神的主權與人的回應怎樣並存，改革宗與循道宗（阿民念）傳統各有完整的論述，兩者都是敬重聖經的福音派傳統，本講義並陳，不在一節經文裡定案。兩派都同意：人得救，不能在神面前誇口。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。這一節不是要你去猜自己在不在名單上，而是要你看見：神找到保羅的時候，保羅正在逃離他；神的恩典走在人的前面。<\/p><p>神的呼召也不只給全職傳道人。你在職場、在家裡、在病床上忠心，同樣是神施恩呼召你的地方；沒有走上講台，不表示你錯過了神。<\/p>"]],"con":[],"say":"本講義的立場：1:15 的重點是神施恩的呼召走在人的一切功課與記號之前；預定與人的回應怎樣並存，兩大傳統並陳，本章不定案。呼召不只給全職事奉者，也不可拿來給人施壓。","care":"「從母腹裡」這幾個字，可能觸動經歷過流產、不孕、失去孩子的人，也可能觸動那些從小被告知「你本來不該生下來」的人；還有被父母或教會說「你注定要作傳道人」而背著重擔長大的人。講這一節時，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」；可以明說：神看顧每一個生命，也看顧沒有出生的孩子與為他們流淚的父母。會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS01_5","t":"1:17--18 往阿拉伯去、三年後才見磯法——保羅在阿拉伯做甚麼？","r":"1:17--18；徒9:19--26；林後11:32--33","ch":[1],"why":"使徒行傳沒有記保羅去阿拉伯，加拉太書只用一句話帶過，於是各種想像都出現了：有人說他去閉關三年，有人說他去了西奈山，有人據此說使徒行傳的記載有誤。這一題關係到兩卷書的記載怎樣並讀，也關係到今天的信徒怎樣看待一段「沒有人看見的日子」。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「也沒有上耶路撒冷去見那些比我先作使徒的，惟獨往阿拉伯去，後又回到大馬士革。」（1:17）又說：「過了三年，才上耶路撒冷去見磯法，和他同住了十五天。」（1:18）原文 <strong>εἰς Ἀραβίαν<\/strong>（eis Arabian），指當時的拿巴提王國。使徒行傳講義第 9 章講過，路加只說他在大馬士革「過了好些日子」（徒 9:23）。問題是：保羅在阿拉伯做甚麼？兩份記載矛盾嗎？<\/p>"],["退修默想說","","<p>認為保羅在大馬士革路上被改變以後，需要一段安靜的日子重新整理整本舊約，在禱告與默想中明白「被釘的彌賽亞」的意義；所以他沒有立刻去找使徒，而是退到曠野。這一說合乎 1:12「從耶穌基督啟示來的」的語氣。<\/p><p><strong>難處：<\/strong>經文沒有說他在阿拉伯默想；而上一節剛說神啟示兒子，是「叫我把他傳在外邦人中」（1:16），後來又有「亞哩達王手下的提督」要捉拿他（林後 11:32），可見他在拿巴提惹起了注意，不太像一段完全隱居的日子。<\/p>"],["傳道說","","<p>認為保羅蒙召以後立刻照神的託付，到拿巴提人中間傳福音；拿巴提王國的勢力延伸到大馬士革，所以後來亞哩達王的提督在大馬士革要捉拿他。這一說與 1:16 的使命銜接得最緊，也解釋了林後 11:32--33 的追捕。<\/p><p><strong>難處：<\/strong>這一段沒有留下任何教會或果子的記錄，保羅自己也沒有提到在那裡建立教會；若他在阿拉伯有大規模的傳道，很難想像他在證明自己的福音時不提。<\/p>"],["西奈山說","","<p>認為保羅像以利亞一樣，到了「神的山」何烈山（王上 19:8），在律法頒布的地方重新理解律法與福音的關係；學者觀察到 4:25 保羅提到「阿拉伯的西奈山」（4:25），可見他心裡把阿拉伯與西奈連在一起。這一說有豐富的神學聯想。<\/p><p><strong>難處：<\/strong>這是經文沒有作的連結，只能說「這使我們想起」；拿巴提王國範圍很廣，1:17 只說阿拉伯，並沒有說西奈山，把兩處經文拉在一起，容易把聯想講成事實。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義不定案，以傳道說為較可能，並包含退修默想的成分。<\/strong>保羅寫這一節的目的，不是交代他在阿拉伯做了甚麼，而是說他蒙召以後沒有先去耶路撒冷取得資格：他的福音不是從那裡領來的。<\/p><p>使徒行傳與加拉太書不矛盾：路加寫的是福音往前推進的歷史，保羅寫的是他的福音從哪裡來；阿拉伯那一段，大概就藏在路加的「好些日子」裡。這裡的阿拉伯只是一個地名，不可與今天的族群、宗教衝突拉在一起（全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。聖經沒有記下的，不是聖經的缺陷，而是作者有自己的重點；兩份記錄互相補足，正好讓我們看見更完整的保羅。<\/p><p>對今天的信徒，這一段沒人看見的日子也是一份安慰：待業、病中、照顧家人、被擱在一邊的年月，都不是被神浪費的時間。保羅在台下的三年，神沒有缺席。<\/p>"]],"con":[],"say":"本講義的立場：保羅在阿拉伯做甚麼，經文沒有說，本講義不定案，以傳道說為較可能；這一節的重點是保羅蒙召以後沒有先去耶路撒冷取得資格。阿拉伯只是地名，相關族群議題見全卷立場議題「在基督裡成為一：族群、性別、以色列與教會」。","care":"會眾席上可能有人正處在一段「不在台上」的日子：失業、久病、照顧年邁父母、從服事崗位退下來，心裡覺得自己被神擱在一邊。講這一題時，不要把阿拉伯講成「屬靈閉關的成功學」，好像只要隱退一段就會更有能力；也不要對正在這段日子裡的人說「這是神在磨練你，你要感恩」。陪他走一段，比解釋他的處境更重要。"},{"id":"ISS01_6","t":"1:15 SBLGNT 沒有「神」字——古卷異文會影響意思嗎？","r":"1:15","ch":[1],"why":"細心的讀者若拿和合本對照原文版本，會發現 1:15 有些希臘文版本沒有「神」字；網路上也常有文章拿這類異文說「聖經被改過」。這一題關係到信徒怎樣看待抄本的差異，以及在面對這類資訊時，能不能既誠實、又不被動搖。","pos":[["【一】經文問的是甚麼","","<p>和合本作「然而，那把我從母腹裡分別出來、又施恩召我的神」（1:15）。SBLGNT 作 <strong>ὅτε δὲ εὐδόκησεν<\/strong>（hote de eudokēsen），沒有 <strong>ὁ θεός<\/strong>（ho theos）；WH 正文、NA28 與拜占庭傳統（RP）都有這兩字，和合本與它們相同。問題是：這兩字是後來抄寫的人加上去的，還是早期抄本漏掉的？少了「神」字，經文的意思會不會改變？<\/p>"],["較長讀法說（有「神」字）","","<p>認為原本就有 ὁ θεός，因為支持它的抄本範圍很廣，包括許多古老而分布各地的抄本；NA28 與多數英文、中文譯本都採這一讀。少數抄本沒有，可能是抄寫時漏掉，或覺得主詞已經清楚而省略。<\/p><p><strong>難處：<\/strong>經文鑑別有一條常用的原則：抄寫者比較容易為了句意清楚而補上主詞，不容易刪掉它；而一些很早的抄本（如 P46 與梵蒂岡抄本）正好沒有這兩字，所以較短的讀法也有分量。<\/p>"],["較短讀法說（沒有「神」字）","","<p>認為原本沒有 ὁ θεός，保羅只寫「當那一位樂意的時候」，因為讀者都知道那一位就是神；後來的抄寫者為了清楚，補上了主詞。Holmes 編 SBLGNT 時採用了 WH 的旁註讀法，就是根據這種考量。<\/p><p><strong>難處：<\/strong>較早的抄本不一定就是較準確的抄本，各地抄本傳統的整體證據仍然支持較長的讀法；而且兩派學者都承認，這一處的證據接近，任何一方都不宜說得太滿。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義照和合本讀「神」，並交代 SBLGNT 的讀法。<\/strong>兩種讀法意思完全相同：即使沒有寫出 ὁ θεός，「分別出來」、「施恩召」、「樂意」、「啟示」的主詞也只能是神。這一處異文不影響任何教義，反而讓我們更清楚看見：整個長句的動作，全是神的動作。<\/p><p>古卷異文與信心的關係，本講義的全卷立場見 <strong>議題「這些爭議該不該影響一個人的信心？」<\/strong>：誠實地陳列，不放大，也不迴避。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。新約抄本的數量與年代，在古代文獻裡是極為豐富的；正因為抄本多，學者才能逐字比對，把每一處差異攤在陽光下。看得見異文，不是聖經不可靠的證據，而是聖經被小心保存的證據。<\/p><p>你讀到 1:15 的時候，可以放心地讀「神」：不論哪一種抄本，這一節都在說同一件事——是神樂意，把他兒子啟示在一個逼迫者的心裡。<\/p>"]],"con":[],"say":"本講義的立場：1:15 照和合本讀「神」，SBLGNT 沒有寫出這兩字；兩種讀法意思完全相同，主詞只能是神，不影響任何教義。本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上可能有正在讀大學、接觸到批判學術的青年，或在網路上讀到「聖經被改過」的文章而心裡不安的人；也有人從來沒想過這種問題，突然聽到會很困惑。不在講台上大談抄本細節，也不嘲笑提問的人；可以在主日學或小組裡另找時間，耐心陪他一起看資料，讓他知道誠實提問與信心並不衝突。"},{"id":"ISS01_7","t":"1:13--14 保羅從前逼迫教會——一個人的過去會不會使他不配事奉？","r":"1:13--14；1:23--24；林前15:9--10；提前1:13","ch":[1],"why":"教會裡常有兩種極端：一種認為犯過重大錯誤的人永遠不可以再事奉，另一種認為只要悔改就應該立刻恢復一切職分，不必問受害者的感受。保羅「極力逼迫殘害神的教會」，後來卻成了使徒；這一題關係到教會怎樣接納悔改的人，也關係到曾經被傷害的人是否被保護、被顧念。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「你們聽見我從前在猶太教中所行的事，怎樣極力逼迫殘害神的教會。」（1:13）原文 <strong>ἐδίωκον<\/strong>（ediōkon）與 <strong>ἐπόρθουν<\/strong>（eporthoun）都是未完成式，是一種持續的生活。後來猶太的眾教會聽說「那從前逼迫我們的，現在傳揚他原先所殘害的真道」（1:23），就「歸榮耀給神」（1:24）。問題是：一個人的過去會不會使他不配事奉？悔改以後，可以立刻回到事奉的崗位嗎？<\/p>"],["永久不配說","","<p>認為某些過犯，特別是傷害教會、傷害人的罪，會使人永遠失去事奉或領導的資格；教會必須保護群羊，不能冒險讓曾經傷人的人再有權柄。這一說看重受害者與群體的安全，也看重領袖的品格要求（提前 3:2）。<\/p><p><strong>難處：<\/strong>若是這樣，保羅就永遠不配作使徒；他自己也說「我原是使徒中最小的，不配稱為使徒，因為我從前逼迫神的教會」（林前 15:9），卻緊接著說「然而我今日成了何等人，是蒙神的恩才成的」（林前 15:10）。把人永遠定在過去，等於說恩典有一條到不了的線。<\/p>"],["一筆勾銷說","","<p>認為既然神已經赦免，教會也應當完全不再提起，悔改的人可以立刻回到原來的位置，甚至上台作見證；再追究過去，就是不肯饒恕。這一說高舉恩典的完全，也盼望叫回頭的人不再被羞辱。<\/p><p><strong>難處：<\/strong>赦免不等於不需要時間與印證。保羅蒙召以後，三年後才上耶路撒冷，門徒都怕他，「惟有巴拿巴接待他，領去見使徒」（徒 9:27）；教會的接納是一個過程。一筆勾銷說常常忽略了受害者的傷，讓他們在教會裡再受一次傷。<\/p>"],["恩典與時間說","","<p>認為神的赦免是完全的，過去不能使人永遠不配蒙恩；但重新被託付事奉，需要時間、果子、群體的印證，也需要對曾經傷害的人負起責任。保羅的過去沒有被隱藏，也沒有被美化：「我從前是褻瀆神的，逼迫人的，侮慢人的；然而我還蒙了憐憫」（提前 1:13）。眾教會歸榮耀給神，是因為他們看見了一個真實被改變的生命。<\/p><p><strong>難處：<\/strong>「多久才夠」「怎樣才算印證」沒有一條公式，需要教會在每一個個案中謹慎分辨；而某些涉及侵害他人的過犯，教會也必須遵守法律與保護弱勢的責任，不是單憑屬靈判斷就能決定。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採恩典與時間說：過去不能使人永遠不配蒙恩，恩典可以把逼迫者變成傳道者；但恢復事奉需要時間、果子與群體的印證，也需要顧念曾經受傷的人。<\/strong><\/p><p>1:24 的方向是我們的尺：眾人最後歸榮耀給神，而不是為一個人的戲劇化見證鼓掌。挽回跌倒的人怎樣進行，本講義回指哥林多後書講義的全卷立場四；第 6 章 6:1「你們屬靈的人就當用溫柔的心把他挽回過來」（6:1）還會再談。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你心裡一直覺得「我做過那樣的事，神不會再用我」，請看保羅：他的履歷上寫著「殘害神的教會」，神卻把他兒子啟示在他心裡。恩典比你的過去大。<\/p><p>但如果你曾經傷過人，回到神面前的路，也包括誠實面對你傷過的人、接受群體的陪伴與時間；這不是懲罰，而是讓你的改變被人真實地看見，最後叫人為神歡呼。<\/p>"]],"con":[],"say":"本講義的立場：過去不能使人永遠不配蒙恩，神能把逼迫者變成傳道者；但恢復事奉需要時間、果子與群體的印證，也要顧念曾經受傷的人。挽回跌倒的人，回指哥林多後書講義的全卷立場四。","care":"會眾席上可能同時坐著兩種人：一種是曾經犯錯、心裡一直覺得自己不配再事奉的人；一種是曾被教會裡的人傷害過，甚至經歷過性暴力、家庭傷害或屬靈操控的人。講這一題不可以只顧前者：不要求受害者原諒或與加害者和好，不追問細節，不對正在流淚的人說「你要有信心」；會後單獨關心，涉及侵害時優先保護受害者並遵守通報責任，必要時協助尋求專業協助。"},{"id":"ISS01_8","t":"1:6「我希奇」——保羅連一句感恩都沒有，牧者今天可以這樣嚴厲地責備會眾嗎？","r":"1:6；4:19--20；6:1","ch":[1],"why":"加拉太書是保羅寫給教會的書信裡唯一沒有感恩段的一封，問安之後直接說「我希奇」，又兩次說「應當被咒詛」。有傳道人拿這封信作根據，在講台上嚴厲斥責會眾；也有人因此覺得保羅太兇，不像愛人的牧者。這一題關係到講台的語氣與界線，也關係到曾被講台言語傷過的人。","pos":[["【一】經文問的是甚麼","","<p>別的信，問安之後幾乎都是感謝；這封信卻是「我希奇你們這麼快離開那藉著基督之恩召你們的，去從別的福音」（1:6）。原文 <strong>Θαυμάζω<\/strong>（Thaumazō），在古代書信裡是表達失望、責怪的套語。可是同一封信也說：「我小子啊，我為你們再受生產之苦，直等到基督成形在你們心裡。」（4:19）問題是：保羅的嚴厲是可以照樣學的講台模式嗎？牧者的責備，界線在哪裡？<\/p>"],["嚴厲合宜說","","<p>認為保羅示範了：當福音的核心受到威脅，牧者就應該說重話，不必顧及情面；今天教會太軟弱、太怕得罪人，正需要加拉太書這樣的語氣。這一說看重真理的分量，也合乎 1:10 不討人喜歡的心志。<\/p><p><strong>難處：<\/strong>保羅的重話是針對「在基督之外加上得救條件」的危險，不是針對會眾的一般軟弱或對牧者的不同意；把加拉太書的語氣套在每一次講道上，會讓講台變成發洩的地方，也會把會眾的小錯講成背道。<\/p>"],["只用溫柔說","","<p>認為新約的牧養原則是溫柔：「你們屬靈的人就當用溫柔的心把他挽回過來」（6:1）；保羅的語氣是使徒時代的特殊處境，今天的牧者不應該再用責備的口氣，以免傷人。這一說保護了會眾，也提醒牧者自己的軟弱。<\/p><p><strong>難處：<\/strong>若完全不能責備，教會就沒有辦法面對真正危害福音、傷害群羊的教導；保羅在同一封信裡既說重話，也說溫柔的話，兩者並不互相取消。<\/p>"],["對象與心腸說","","<p>認為保羅的嚴厲有清楚的對象與心腸：最重的話對準的是「攪擾你們的人」和那「別的福音」，對被攪擾的加拉太人，他稱「弟兄們」（1:11），說自己受「生產之苦」（4:19）；他把判決交給神（ἀνάθεμα），不交給自己的拳頭。嚴厲是因為愛，像醫生看見有人在水源裡下毒；而且他第一個放上檢驗台的是自己（1:8）。<\/p><p><strong>難處：<\/strong>牧者很容易以為自己的憤怒就是保羅的熱心；所以這一說需要牧者先省察自己：我說重話，是為了福音，還是為了我的面子、我的權柄？<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採對象與心腸說：在福音的核心受威脅時，可以說重話；但重話要對準錯誤的教導，不對準受傷、軟弱、只是意見不同的會眾，而且要出於生產之苦的愛，並先檢驗講台自己。<\/strong><\/p><p>講台的權柄是為造就，不是為敗壞，本講義回指哥林多後書講義的全卷立場三。保羅以「弟兄們」作這封信原文阿們之前的最後一個字（6:18）：再重的話，也是對家人說的。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。若你曾被講台上的重話傷過，請知道：保羅的嚴厲不是為了壓碎人，而是為了把人從危險裡拉回來；被濫用的責備，不是加拉太書的錯，是講的人越過了界線。<\/p><p>你可以把這一封信讀到最後：那一位說「我希奇」的人，也說「願我主耶穌基督的恩常在你們心裡」。神對你的心意，是恩典。<\/p>"]],"con":[],"say":"本講義的立場：福音的核心受威脅時可以說重話，但要對準錯誤的教導，不對準軟弱或意見不同的會眾，出於生產之苦的愛，並先檢驗講台自己。屬靈權柄的界線，回指哥林多後書講義的全卷立場三。","care":"會眾席上可能有人曾在講台上、會議裡被牧者公開斥責，因而多年不敢再回教會，或一聽到嚴厲的語氣就發抖；也有牧者正因為不敢責備而內疚。講這一題時，不要用「保羅也這樣罵人」替講台的傷害辯護；若有人告訴你他曾被講台言語傷害，先聽，不急著替任何人解釋，必要時陪他找可信任的長執一起面對。"},{"id":"ISS01_9","t":"1:4「救我們脫離這罪惡的世代」——基督徒要離開世界嗎？","r":"1:4；6:14--15；約17:15","ch":[1],"why":"1:4 說基督捨己「要救我們脫離這罪惡的世代」。有人據此主張基督徒要遠離世俗：不碰流行文化、不參與社會、職場只是賺錢的地方；也有人覺得這只是古代說法，今天好好生活就好。讀法不同，直接影響信徒怎樣看待職場、家庭、社會與華人文化習俗。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「基督照我們父神的旨意，為我們的罪捨己，要救我們脫離這罪惡的世代。」（1:4）原文 <strong>ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ αἰῶνος τοῦ ἐνεστῶτος πονηροῦ<\/strong>（hopōs exelētai hēmas ek tou aiōnos tou enestōtos ponērou），「好把我們拔出這現今邪惡的世代」。問題是：被「救出」是指身體離開這個世界、遠離社會文化嗎？還是另有所指？<\/p>"],["分離說","","<p>認為基督徒既然被救出這罪惡的世代，就應當盡量與世俗分開：少接觸非信徒的文化、娛樂與社團，把生活圈放在教會裡，職場只是不得已的地方。這一說看重聖潔，也提醒信徒「不要效法這個世界」（羅 12:2）。<\/p><p><strong>難處：<\/strong>主耶穌禱告說「我不求你叫他們離開世界，只求你保守他們脫離那惡者」（約 17:15）。而且加拉太的問題正好是：攪擾的人用割禮、飲食、節期把人分成「裡面」和「外面」；把分離當成聖潔，可能只是換了一種割禮。<\/p>"],["融入說","","<p>認為「這罪惡的世代」是第一世紀猶太人的說法，今天不必照字面理解；基督徒只要在社會上作好人、好公民，和大家一樣生活，就是見證。這一說看重在世上的責任，也避免信仰變成封閉的小圈子。<\/p><p><strong>難處：<\/strong>保羅把十字架說成「救」與「脫離」，可見這個世代有一套與神對立的秩序；若完全融入，就聽不見全卷最後那一句：「我斷不以別的誇口，只誇我們主耶穌基督的十字架」（6:14），信仰就只剩下道德，沒有新造。<\/p>"],["兩個世代說","","<p>認為保羅用的是「這世代」與「來世」的框架：基督的十字架已經把人從舊世代的秩序裡拉出來，新的世代已經在基督裡開始，但舊的世代還在。信徒仍活在這個世界裡，卻不再照舊秩序的規則活——不再用出身、記號、行為把人分成裡面和外面，而是以「新造的人」（6:15）身分活在職場與家庭裡。<\/p><p><strong>難處：<\/strong>「已經」與「還沒有」之間的張力不容易拿捏：甚麼可以參與、甚麼要拒絕，常常需要在具體的處境裡分辨，沒有一張清單可以照著打勾。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採兩個世代說：被救出，不是身體離開世界，而是不再被舊世代的秩序轄制。<\/strong>十字架不是給舊世代加一條新規則，是把人帶出舊世代；所以在加拉太，加上割禮反而是把人拉回舊秩序。<\/p><p>基督徒怎樣面對節期、飲食、習俗與華人節慶，本講義的全卷立場見 <strong>議題「基督徒的自由：在律法主義與放縱之間」<\/strong>：分辨的關鍵不是日子或形式，而是信靠誰；不一概妖魔化，也不一概放任。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。你不必為了證明自己被救出來，就切斷與家人、同事、朋友的關係；你被救出來，正是為了在他們中間活出另一種樣子。<\/p><p>明天回到辦公室、回到家裡，你仍在同一個世界裡，但你已經屬於另一個世代：不必再用舊世代的方法證明自己，因為那一位已經為你捨己了。<\/p>"]],"con":[],"say":"本講義的立場：「脫離這罪惡的世代」不是身體離開世界，而是不再被舊世代的秩序轄制，以新造的人活在世上；節期、習俗與華人節慶的分辨，本講義的全卷立場見議題「基督徒的自由：在律法主義與放縱之間」。","care":"會眾席上可能有家中唯一信主、常在年節與家族聚會中左右為難的人，也有在職場被要求參與某些儀式而不知怎麼辦的人；還有從前被教會要求切斷與非信徒家人關係而受傷的人。講這一題時，不要叫人與家人對立，也不要輕看他們的掙扎；可以在小組裡陪他具體分辨一件事、一個場合，而不是給他一張規條清單。"},{"id":"ISS02_1","t":"2:1--10 這次上耶路撒冷，是使徒行傳的哪一次？","r":"2:1--10；徒 11:30；15:1--29","ch":[2],"why":"保羅在加拉太書逐次交代他和耶路撒冷的每一次接觸，使徒行傳也記了他歸主後幾次上耶路撒冷，兩份記錄怎樣對上，關係到加拉太書寫於耶路撒冷會議之前還是之後，也關係到讀者怎樣看待聖經兩卷書之間的一致。有人因為對不上而懷疑聖經的可靠，這一題值得把過程攤開來看。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「過了十四年，我同巴拿巴又上耶路撒冷去，並帶著提多同去。」（2:1）<strong>πάλιν ἀνέβην<\/strong>（palin anebēn）的「又」回指 1:18 那十五天，這是第二次。使徒行傳記保羅歸主後上耶路撒冷，第二次是徒 11:30 送賑濟，第三次是徒 15 的會議。問題是：加拉太書 2:1–10 這一次，對應的是徒 11:30，還是徒 15？<\/p>"],["徒 15 說（就是耶路撒冷會議）","","<p>人物相同：巴拿巴、雅各、彼得；議題相同：外邦人要不要受割禮；結論也相同：不勉強外邦人。許多傳統註釋採這一說，認為保羅只記會議的私下部分，路加記公開的大會。<\/p><p><strong>難處：<\/strong>保羅在 1:20 起誓說他不是說謊，正在逐次交代自己和耶路撒冷的每一次接觸；若略過徒 11:30 那一趟，對手正好抓住把柄。2:2 明說是「背地裡」的會面，徒 15 卻是公開的大會；而且整封信隻字不提會議的決議，那本該是保羅手上最有力的一張牌。<\/p>"],["徒 11:30 說（送賑濟的那一趟）","","<p>認為 2:1–10 是饑荒時保羅與巴拿巴把捐項送到耶路撒冷的那一次：時序上剛好是第二次；2:2 的私下會面、2:10「記念窮人」與賑濟正相合；加拉太書寫於會議之前，所以沒有提會議的決議。這一說常與南加拉太說相配。<\/p><p><strong>難處：<\/strong>徒 11:30 沒有提到提多，也沒有提到割禮的爭論；而且照這一說，同樣的議題要在幾年之內討論兩次，有些學者覺得不自然。<\/p>"],["【三】本講義站在哪裡","","<p><strong>兩說都有敬重聖經的學者支持；本講義略傾向徒 11:30 說<\/strong>，與南加拉太說、本信寫於會議之前相配，也最能解釋保羅為甚麼不引會議的決議。但這是歷史重建，不是信仰的根基。<\/p><p>不論是哪一次，有一件事兩說都同意：這裡爭的正是徒 15 要解決的同一個問題——外邦人要不要先變成猶太人，才能作基督徒。而兩份記錄的答案也一樣：不必。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。兩位作者從不同的角度寫，一位寫自傳、一位寫歷史，細節要用心對照，本來就是讀古代文獻的常態；對不上的地方，學者有好幾種合理的解釋，沒有一處動到福音本身。<\/p><p>真正該讓我們停下來的，是兩卷書都記下的那一隻右手：雅各、磯法、約翰向保羅和巴拿巴「用右手行相交之禮」（2:9）。<\/p>"]],"con":[],"say":"本講義的立場：兩說並陳，略傾向徒 11:30 說；不論是哪一次，兩份記錄爭的是同一個問題、給的是同一個答案——外邦人不必先變成猶太人。寫作年代與地點的全卷立場見議題「加拉太在哪裡？這封信寫於何時？」。","care":"會眾席上可能有正在讀神學、或在網路上看到「聖經自相矛盾」文章而心裡動搖的年輕人。不要在講台上把這一題講成考據比賽，也不要說「有疑問就是不信」。會後若有人來問，先肯定他認真讀經，陪他看兩說的理由，再把他帶回兩卷書都同意的那件事：福音不必加上任何東西。"},{"id":"ISS02_2","t":"2:3 提多沒有受割禮，徒 16:3 保羅卻給提摩太行了割禮——保羅前後矛盾嗎？","r":"2:3--5；徒 16:1--3；林前 9:20","ch":[2],"why":"保羅在加拉太書寸步不讓，連提多都不讓人勉強受割禮；使徒行傳卻記他親手給提摩太行了割禮。這看起來像雙重標準，常被拿來說保羅見風轉舵，也常讓今天的信徒困惑：在文化與傳統面前，甚麼可以讓、甚麼不可以讓？這一題正是書信三問的第三問。","pos":[["【一】經文問的是甚麼","","<p>「但與我同去的提多，雖是希臘人，也沒有勉強他受割禮」（2:3）；保羅說他對假弟兄「一刻的工夫也沒有容讓順服他們」（2:5）。可是徒 16:3 說：「保羅要帶他同去，只因那些地方的猶太人都知道他父親是希臘人，就給他行了割禮。」（徒 16:3）同一個保羅、同一個動作，為甚麼一次堅拒、一次親手去做？<\/p>"],["矛盾說（保羅不一致，或見機行事）","","<p>認為兩處記載顯示保羅在壓力下會改變立場：在加拉太書寫得很硬，實際作法卻有彈性，甚至有人說他是為了被接納而讓步。<\/p><p><strong>難處：<\/strong>這一說沒有看見兩件事的處境完全不同。提多的割禮被假弟兄當作得救的條件，一受就等於承認福音不夠；提摩太的母親是猶太人，行割禮是為了進會堂向猶太人傳福音。而且保羅在別處明說他的原則：「向猶太人，我就作猶太人，為要得猶太人」（林前 9:20）。<\/p>"],["史料不可靠說（路加記錯了）","","<p>認為使徒行傳是後來的作品，路加想把保羅寫得和耶路撒冷比較一致，所以加上了提摩太受割禮的故事；要認識真正的保羅，只能讀保羅自己的書信。<\/p><p><strong>難處：<\/strong>這一說的前提是兩處必然矛盾，但只要分清楚處境，兩處其實一致；而且路加是保羅的同工，提摩太的故事細節具體，看不出捏造的理由。用「記錯了」解決一切張力，也太輕易地放棄了細讀經文。<\/p>"],["處境原則說（處境不同，原則一致）","","<p>認為保羅的原則從來沒有變：人進入神的家只有一個門——基督。割禮本身無關得救，「受割禮不受割禮全無功效」（5:6）。所以當割禮被當作門票，一步也不讓；當割禮只是為福音開門的文化讓步，可以為愛去做。<\/p><p><strong>難處：<\/strong>這個原則需要牧養的智慧去分辨，不像一條規條那樣簡單；同一個動作在不同處境裡意義不同，容易被人拿來替真正的妥協找藉口。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採處境原則說。<\/strong>同一個動作，當作門票就是另一個福音，當作為福音的讓步就是愛。分辨的問題只有一個：這一樣東西，是被當成得救、被接納、坐上桌子的條件，還是為了讓別人聽見福音而甘心放下的權利？<\/p><p>今天的割禮可能是一種語言、一套服裝規矩、一個宗派的標記、一份會員資格。它們本身未必錯，錯在被當成坐上桌子的門票（全卷立場見議題「書信的處境與原則」）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。這一題反而讓我們看見保羅的一致：他不是死守規矩的人，也不是見風轉舵的人，他守的是福音的真理，讓的是自己的權利。<\/p><p>對今天的你，這是一份自由：你可以為了家人、同事、鄰舍在許多文化的事上變通，只要那件事沒有變成「信耶穌再加上」的那一樣。<\/p>"]],"con":[],"say":"本講義的立場：保羅前後一致——割禮被當作得救的條件時一步不讓，只是為福音開門的文化讓步時可以為愛去做；處境不同，原則一致。本講義的全卷立場見議題「書信的處境與原則」。","care":"會眾席上可能有剛信主、正為家裡的傳統習俗左右為難的人，也可能有被教會要求「完全切斷」原生文化而受傷的人。不要把這一題講成「甚麼都可以讓」，也不要講成「一點都不能讓」。陪他一件一件分辨：哪一樣是被當作門票的，哪一樣只是愛的讓步；涉及祭拜等信靠對象的事，回到議題「基督徒的自由：在律法主義與放縱之間」的三個檢驗。"},{"id":"ISS02_3","t":"2:11--14 保羅當面抵擋彼得——領袖可以公開批評另一位領袖嗎？使徒會犯錯嗎？","r":"2:11--14；太 18:15","ch":[2],"why":"一位使徒當眾指正另一位使徒，是新約裡最直接的一次領袖衝突。今天有人拿這一段替網路公審、講台點名辯護，也有人因此對使徒、對聖經的權威感到不安：如果彼得會錯，我們還能信他寫的書信嗎？這一題關乎教會怎樣面對領袖的錯，也關乎會眾能不能分辨屬靈權柄。","pos":[["【一】經文問的是甚麼","","<p>「後來，磯法到了安提阿；因他有可責之處，我就當面抵擋他。」（2:11）<strong>κατὰ πρόσωπον<\/strong>（kata prosōpon）是「當著他的臉」；保羅又「在眾人面前對磯法說」（2:14）。問題有兩個：一位使徒會在行為上犯錯嗎？一位領袖可以、也應當公開指正另一位領袖嗎？分寸在哪裡？<\/p>"],["使徒不錯說（這是一場安排好的戲）","","<p>早期教會有人（如俄利根、耶柔米）不忍心看兩位使徒衝突，主張這是彼得和保羅事先說好的一場示範，彼得故意退去，好讓保羅藉機把真理講清楚。<\/p><p><strong>難處：<\/strong>奧古斯丁當時就反對：若是演戲，保羅說「他有可責之處」、「他們行的不正」就成了不誠實的話，整封信說「我寫給你們的不是謊話」（1:20）的保證也跟著動搖。經文明說彼得是「因怕」，不是因為計畫。<\/p>"],["只能私下說（公開指正違背主的教導）","","<p>認為主耶穌已經定了次序：「趁著只有他和你在一處的時候，指出他的錯來」（太 18:15）；保羅當眾說話是使徒的特殊權柄，今天的信徒與同工不應效法，對領袖尤其要私下勸。<\/p><p><strong>難處：<\/strong>這一說保護了人的尊嚴，卻忽略了彼得的錯本身是公開的、影響了整間教會，連巴拿巴也被帶走；若只能私下說，一個公開扭曲福音真理的作法就可能永遠沒有人處理。<\/p>"],["分辨說（公開的錯公開處理，有分寸）","","<p>認為使徒在寫成聖經的教導上受聖靈保守，在個人的行為上仍會跌倒；彼得的道理沒有錯，他的腳歪了。私人的得罪照太 18:15 私下處理；公開影響福音真理的作法，可以公開、當面、清楚地指出——說的是一個問題，不是一場羞辱，目的是挽回。<\/p><p><strong>難處：<\/strong>「影響福音真理」的界線需要判斷，容易被人擴大解釋，把個人的不滿包裝成真理之爭。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採分辨說。<\/strong>彼得在行為上錯了，經文沒有替他遮掩；但他寫下的書信仍是神的話，因為聖經的權威來自聖靈的默示，不是來自作者一生無過。保羅的作法有三個分寸：當面，不在背後；針對公開影響福音的事，不針對個人的不完全；目的是挽回，不是贏。<\/p><p>屬靈權柄與糾正的分寸，回指哥林多後書立場三；挽回跌倒的人，回指哥林多後書立場四。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。聖經不美化它的英雄，這正是它可信的地方。而且故事沒有停在衝突上：同一位彼得後來說「我們得救乃是因主耶穌的恩，和他們一樣，這是我們所信的」（徒 15:11）。<\/p><p>跌倒的人被當面抵擋之後，沒有被丟掉。我們信的不是一位不會錯的使徒，是一位能挽回使徒的主。<\/p>"]],"con":[],"say":"本講義的立場：使徒在個人行為上會錯，聖經的權威卻來自聖靈的默示；私人的得罪私下處理，公開影響福音真理的作法可以當面、公開、有分寸地指出，目的是挽回。屬靈權柄的分寸回指哥林多後書立場三，「攪擾你們的人」的全卷立場見議題「『攪擾你們的人』是誰？」。","care":"會眾席上可能有曾經被領袖在台上點名羞辱的人，也可能有因為指出領袖的錯而被冷落、被趕出事工的人。不要拿這一段鼓勵網路公審，也不要拿「不可論斷」叫受害者閉口。若有人來談一位領袖的錯，先聽、先保護可能受傷的人；涉及屬靈或性方面的傷害，協助他找到教會以外的安全管道與專業協助。"},{"id":"ISS02_4","t":"2:12 彼得「因怕」而退去——華人教會的分堂：語言堂、族群堂是合一還是隔開？","r":"2:12--13；3:28","ch":[2],"why":"許多華人教會有國語堂、粵語堂、台語堂、英語堂，海外教會還有不同族群的聚會。安提阿那一張分開的桌子，常被拿來批評一切分堂；也有人用「方便」替從不往來的分堂辯護。這一題直接碰到每一間華人教會的週日早上，也碰到第一代與第二代之間的張力。","pos":[["【一】經文問的是甚麼","","<p>彼得「和外邦人一同吃飯，及至他們來到，他因怕奉割禮的人，就退去與外邦人隔開了」（2:12），連巴拿巴也被帶走。保羅說這是「與福音的真理不合」（2:14）。問題是：今天按語言、族群分開聚會，是彼得那一張分開的桌子，還是為了福音的合理安排？分界線在哪裡？<\/p>"],["一律合併說（分堂就是分桌）","","<p>認為福音拆掉了中間隔斷的牆，教會就應當在同一個聚會裡敬拜；按語言、族群分堂，等於把安提阿的桌子制度化，用翻譯、雙語敬拜才是合一的見證。<\/p><p><strong>難處：<\/strong>這一說看重合一的見證，卻容易忽略聽得懂的需要：一位只會方言的長者、一位只聽得懂英文的少年，都有權用心裡的語言聽福音。保羅自己也說「向甚麼樣的人，我就作甚麼樣的人」（林前 9:22）。強迫合併有時反而讓弱勢的一群坐在聽不懂的位子上。<\/p>"],["同質單位說（按族群分開最有效）","","<p>二十世紀教會增長學提出「同質單位原則」：人喜歡在不必跨越族群、語言、階級的地方信主，所以按同質群體建立教會最能增長，分堂是宣教策略。<\/p><p><strong>難處：<\/strong>作為傳福音的入口，這一說有它的觀察；但若成為教會的終點，就正好是彼得換的那一張桌子——為了讓某一群人自在，讓另一群人坐到別處。安提阿的問題從來不是有效不有效，是福音的真理。<\/p>"],["分工不分家說（可以分堂，不可以分桌）","","<p>認為 2:9「我們往外邦人那裡去，他們往受割禮的人那裡去」已經示範了分工；語言分堂可以是為了福音的方便，但各堂必須承認彼此屬於同一張桌子：一起吃飯、一起禱告、一起作決定。<\/p><p><strong>難處：<\/strong>這一說最需要持續的努力，很容易名義上是一間教會，實際上是幾間互不往來的教會；標準也需要每一間教會自己誠實地檢查。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採分工不分家說。<\/strong>合一不是一樣，但合一一定要落在桌上。檢驗標準是：不同堂的人有沒有一起吃飯、一起禱告、一起作決定？提到對方時，語氣裡有沒有「他們那邊的」？資源與決策是不是只在某一堂的手上？<\/p><p>同樣的標準也適用於性別、階級、世代：桌子可以分工，不可以分出上下（全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。各教會的安排可以不同，這是牧養的判斷；但「在基督裡成為一」各派都同意。<\/p><p>真正會影響信心的，不是分了幾堂，是教會不肯一起吃飯。如果你所在的那一堂和另一堂很少往來，你可以是第一個端著碗走過去的人。<\/p>"]],"con":[],"say":"本講義的立場：語言分堂可以是為了福音的方便，但不可以變成彼得那一張分開的桌子；檢驗標準是不同堂的人有沒有一起吃飯、一起禱告、一起作決定。本講義的全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」。","care":"會眾席上可能有在英語堂長大、覺得自己在中文堂永遠是「小孩」的第二代，也可能有聽不懂英文、覺得被年輕人遺忘的長輩，還有新移民、少數族群的家庭。不要在台上點名任何一堂，也不要叫任何一群人覺得自己是問題。會後主動關心那些在兩個堂之間找不到位子的人，陪他們找到一張可以坐下的桌子。"},{"id":"ISS02_5","t":"2:16「稱義」是甚麼意思？——傳統觀點與保羅新觀：法庭上的宣告，還是生命的改變？","r":"2:15--16；3:10--13；詩 143:2","ch":[2],"why":"「因信稱義」是宗教改革的核心，也是近五十年保羅研究最大的爭論：「律法的行為」指的是賺取救恩的努力，還是標記猶太身分的割禮、飲食、安息日？稱義是法庭上的宣告、立約群體的成員資格，還是生命被改變？這一題直接關係到人怎樣在神面前站立。","pos":[["【一】經文問的是甚麼","","<p>「既知道人稱義不是因行律法，乃是因信耶穌基督」（2:16）。<strong>ἐξ ἔργων νόμου<\/strong>（ex ergōn nomou）一節之內出現三次；<strong>δικαιοῦται<\/strong>（dikaioutai）是現在被動：被稱為義。問題是：「律法的行為」指甚麼？「稱義」是神宣告一個人無罪，是神承認他屬於立約的子民，還是神使他在生命裡變成義人？<\/p>"],["傳統觀點（法庭上的宣告）","","<p>路德、加爾文與今天許多福音派學者：「律法的行為」是一切想靠自己在神面前賺得義的作為；「稱義」是法庭的字，神因基督的緣故宣告罪人為義，把基督的義算在信的人身上。2:16 末句「凡有血氣的，沒有一人因行律法稱義」回響詩 143:2，講的是罪人在神面前的處境。<\/p><p><strong>難處：<\/strong>這一說有時只讀出個人與神的關係，忽略了 2:11–14 的上下文：保羅在這裡講稱義，起因是一張分開的餐桌；稱義在加拉太一開始就有群體的面向。<\/p>"],["保羅新觀（立約群體的成員）","","<p>桑德斯、鄧雅各、賴特等：一世紀猶太教不是靠行為賺救恩的宗教，而是「立約的恩典」；「律法的行為」主要指割禮、飲食、安息日這些標記猶太身分的界線；稱義是神宣告誰屬於他的子民，所以問題是誰可以同桌。2:3 的割禮、2:12 的餐桌，正支持這一讀法。<\/p><p><strong>難處：<\/strong>2:16 的詩篇回聲與 3:10–13 的咒詛，講的不只是族群界線，是全人類在神面前的罪；若稱義只剩下成員資格，罪人怎樣在聖潔的神面前站立的問題就被淡化了。<\/p>"],["轉化說（稱義包含使人成義）","","<p>天主教傳統與部分東方教會：稱義不只是宣告，也包括神藉著恩典使人在生命裡成為義人，信心與愛德一起，在聖禮與成聖的過程中被成全。<\/p><p><strong>難處：<\/strong>2:16 的「稱義」一直是被動，是神的宣告；若把稱義和成聖混在一起，人很容易又開始計算自己夠不夠義，正是加拉太的問題。改革宗的回應是：成聖一定跟著稱義，但不是稱義的根據。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在宗教改革的底線：稱義是神白白的恩典，單單因信，不靠任何人的作為<\/strong>——這是 2:16 與 3:10–14 的明文。同時吸收新觀的提醒：在加拉太，因信稱義的第一個結果，是猶太人和外邦人可以一起吃飯。<\/p><p>所以今天兩種「律法的行為」都要拒絕：一種說「你要做到這些，神才喜悅你」，一種說「你要像我們，才算自己人」。兩種都是在耶穌後面加一個「和」字（全卷立場見議題「律法、稱義與『因信』」）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：人得救是因著神的恩典、藉著信靠基督；聖靈在信徒裡面結出愛的果子。爭論的是細節與重點，不是福音本身。<\/p><p>你不必先弄清楚每一位學者的理論，才能安心。你可以像保羅一樣說：「連我們也信了基督耶穌」（2:16）——空著手來的人，已經被接納了。<\/p>"]],"con":[],"say":"本講義的立場：稱義是神白白的恩典，單單因信，不靠行律法（宗教改革底線）；同時吸收新觀的提醒，加拉太的稱義也是一張猶太人和外邦人同坐的餐桌。本講義的全卷立場見議題「律法、稱義與『因信』」。","care":"會眾席上可能有從小在很重視表現的教會長大、到今天仍然覺得自己不夠好的人，也可能有讀了新觀而開始懷疑「因信稱義」的神學生。不要在台上把學者貼上異端的標籤，也不要把這一題講成考試。對前者，陪他一再回到「被稱為義」的被動語態；對後者，陪他兩邊都讀，再回到 2:16 的明文。"},{"id":"ISS02_6","t":"2:16「信耶穌基督」——是「信基督」，還是「基督的信實」？","r":"2:16；2:20；3:22","ch":[2],"why":"πίστις Χριστοῦ（pistis Christou）是近代保羅研究最熱烈的文法爭論之一：同一個屬格，可以讀成我們對基督的信，也可以讀成基督自己的信實。有些新譯本已經改了譯法，會眾讀不同譯本會困惑；而這一題背後的問題很實際：我得救，靠的是我信得夠，還是他信實得夠？","pos":[["【一】經文問的是甚麼","","<p>2:16 兩次出現 <strong>πίστεως Ἰησοῦ Χριστοῦ<\/strong>（pisteōs Iēsou Christou）、<strong>πίστεως Χριστοῦ<\/strong>（pisteōs Christou），2:20 有 ἐν πίστει ζῶ τῇ τοῦ υἱοῦ τοῦ θεοῦ（en pistei zō tē tou huiou tou theou）。希臘文的屬格可以表示對象（信基督），也可以表示主體（基督的信）。和合本譯作「因信耶穌基督」；問題是：保羅的重點在我們對基督的信，還是在基督自己對父的信實？我們得救的根據，落在哪一邊？<\/p>"],["受格讀法（信基督）","","<p>和合本、多數譯本、路德以來的傳統：以基督為對象的信。理由：保羅從未在別處明說「基督信神」；3:6–9 亞伯拉罕的例子講的是人的信；同一節 εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν（eis Christon Iēsoun episteusamen）這個動詞正好解釋了前後兩個名詞。<\/p><p><strong>難處：<\/strong>照這一讀法，一句話裡「信基督」說了三次，顯得重複；而且若講得不小心，信心容易被聽成另一種我們拿得出手的功勞。<\/p>"],["主格讀法（基督的信實）","","<p>海斯、賴特等學者，NET 譯本採用：指耶穌基督自己的信實，他順服父、直到十字架。理由：可以避免一句話裡的重複；全段的焦點是基督作了甚麼；2:20 緊接著兩個分詞「愛我」「為我捨己」，講的全是兒子的作為。<\/p><p><strong>難處：<\/strong>這一讀法在文法上可能，卻缺少保羅別處清楚的平行；若講得不小心，可能淡化了保羅一再強調的「你們信」，好像人的回應不重要。<\/p>"],["兼顧讀法（兩面都在）","","<p>有些學者認為保羅有意讓這個片語兩面都帶著：基督的信實是我們得救的根據，我們的信是投靠這份信實的方式；同一個屬格，指向同一件事的兩面。<\/p><p><strong>難處：<\/strong>在翻譯時必須二選一，這一說無法直接幫助譯者；而且有人批評它把文法問題神學化，避開了作決定。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義照和合本讀作「信基督」<\/strong>，因為同一節的動詞 ἐπιστεύσαμεν（episteusamen）清楚說出人的信，3:6–9 亞伯拉罕的信也是如此。同時承認主格讀法提醒了一件真事：<strong>我們能信，是因為他先信實。<\/strong><\/p><p>講台上兩面都講：信心不是我們拿到神面前的成績單，是投靠一位已經信實到十字架的主；連信心的焦點也在他，不在我信得夠不夠用力（全卷立場見議題「律法、稱義與『因信』」）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。兩種讀法都說到同一位主，也都承認人要信。不同的譯本，是學者在文法上的判斷不同，不是福音不同。<\/p><p>如果你常常擔心自己信得不夠，這一題正好是一份安慰：你抓得住他，是因為他先抓住了你。那位「愛我，為我捨己」的神的兒子，從來沒有不信實過。<\/p>"]],"con":[],"say":"本講義的立場：照和合本讀作「信基督」，同時承認「基督的信實」讀法所強調的真事——我們能信，是因為他先信實。本講義的全卷立場見議題「律法、稱義與『因信』」。","care":"會眾席上可能有長期懷疑自己「信得不夠真」、甚至一再重新決志的人，也可能有因為讀到不同譯本而不安的初信者。不要把這一題講成文法課，更不要說「你信得不夠，所以沒有平安」。陪他把眼光從自己的信心移到基督的信實上，一起讀 2:20 的下半句。"},{"id":"ISS02_7","t":"2:14--21 保羅對磯法的話到哪裡結束？","r":"2:14--21","ch":[2],"why":"希臘文沒有引號，各譯本把保羅對磯法說的話收在不同地方。這看起來只是標點，卻決定了 2:15–21，包括 2:20 那一句，是保羅對一位跌倒的使徒說的話，還是他轉身對加拉太人講的神學。讀法不同，2:20 的語氣與落點也不同，值得把過程攤開。","pos":[["【一】經文問的是甚麼","","<p>和合本的引號始於 2:14「你既是猶太人……」，也收在 2:14；2:15 起沒有引號。但 2:15 說「我們這生來的猶太人」，這個「我們」是誰？是保羅和彼得，還是保羅和一般的猶太信徒？問題是：保羅對磯法的話，到 2:14、2:16，還是一直到 2:21 才結束？<\/p>"],["止於 2:14 說","","<p>和合本、和修本等：引號只包住那一個問句；2:15 起保羅轉向加拉太人，把安提阿的事件推到神學的結論。理由：2:14 的問句本身完整，2:15 以後的論證比較像寫給讀信的人。<\/p><p><strong>難處：<\/strong>2:15 沒有任何轉換對象的記號，「我們這生來的猶太人」最自然的讀法是保羅和彼得兩個人；一刀切在 2:14，容易讓讀者忘記 2:20 是在衝突裡說出來的。<\/p>"],["止於 2:16 說","","<p>認為 2:15–16 的「我們」仍是對彼得說的「我們兩個猶太人」，到「凡有血氣的，沒有一人因行律法稱義」才把對彼得的話說完；2:17 起是保羅向加拉太人說的反駁與見證。<\/p><p><strong>難處：<\/strong>2:17–18 仍在處理「和外邦人同桌是否成了罪人」，正是安提阿的問題；在 2:16 結束引號，同樣把一段連續的論證切開了。<\/p>"],["止於 2:21 說","","<p>不少註釋家認為 2:14–21 整段都是對彼得說的話，同時也寫給加拉太人聽：保羅把當年對彼得說的，原封不動地講給正被誘惑去受割禮的加拉太人。理由：論證從頭到尾緊扣餐桌與律法，到 2:21 才下結論。<\/p><p><strong>難處：<\/strong>2:19–21 轉成第一人稱單數，語氣更像保羅自己的見證，未必是當年在安提阿眾人面前的原話；古人記述演講，也常常把當時的話與後來的反省連在一起。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義照和合本標點<\/strong>，讀經、背誦都照和合本。但不論引號收在哪裡，2:15–21 都是在當面抵擋彼得的同一個脈絡裡說出來的；這一點三種讀法都同意。<\/p><p>所以 2:20 不是一句在安靜書房裡寫的金句，是一句在衝突裡、對一位跌倒的領袖、也對正要換桌子的加拉太人說的話：「他是愛我，為我捨己」，說給彼得聽，也說給我們聽。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。引號是後人加的，三種讀法的經文一字不差，意思也沒有衝突；差別只在語氣的落點。<\/p><p>倒是這一題提醒我們：最美的經文常常是從最難的時刻長出來的。你今天的衝突，也可能是主要在你裡面說出 2:20 的地方。<\/p>"]],"con":[],"say":"本講義的立場：照和合本標點；但不論引號收在哪裡，2:15–21 都是在當面抵擋彼得的脈絡裡說出來的，2:20 是一句在衝突裡說的話。爭議與信心的全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上可能有正在和教會同工、家人或上司僵持的人，以為屬靈的人不該有衝突。不要把這一題只講成標點學；讓他知道 2:20 正是在衝突裡說的。陪他分辨：衝突裡要守住的是福音的真理，不是自己的面子；必要時一起找一位信得過的人調解。"},{"id":"ISS02_8","t":"2:20「不再是我」——無己是取消人格嗎？","r":"2:19--20；2:5；2:11","ch":[2],"why":"這一節是國度321空中團契「無己」的本文，也是教會裡最常被引用、最常被誤用的一節。有人聽成「我不重要」，有人聽成每天要把自己釘死的苦修，有人拿來說自己的想法就是基督的想法，更有人拿它叫受傷害的人忍、不可以說不——卻都漏掉了同一節的下半句「他是愛我，為我捨己」。這一題是在保護人，也是在保護這一節經文。","pos":[["【一】經文問的是甚麼","","<p>「我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信神的兒子而活；他是愛我，為我捨己。」（2:20）問題是：「不再是我」是說人格、感受、意志被取消了嗎？基督在我裡面活，我還在不在？<strong>συνεσταύρωμαι<\/strong>（synestaurōmai）是要我每天去做的事，還是已經發生的事？<\/p>"],["自我消融說（我被基督取代）","","<p>一些神祕主義的靈修傳統，以及把東方「無我」觀念混進來的講法：「不再是我」是自我的消融，人的意志、感受、個性要被基督完全取代，越沒有自己的意見、越沒有自己的感受，就越屬靈。<\/p><p><strong>難處：<\/strong>同一節保羅說「我如今在肉身活著」，又說神的兒子「愛我，為我捨己」；兩節之內「我」一再出現。被愛的人不能是不存在的人。這一說容易被拿來要人壓抑感受、放棄判斷，甚至叫受害者忍受傷害。<\/p>"],["克己苦修說（我要每天把自己釘死）","","<p>認為 2:20 是一份每天的功課：信徒要靠意志、紀律與屬靈操練，天天把「老我」釘上十字架，釘得越徹底，基督的生命就越彰顯；常引「天天背起他的十字架」作支持。<\/p><p><strong>難處：<\/strong>συνεσταύρωμαι 是完成式被動：已經被釘，至今仍是，是神作的。把它講成每天的苦修，無己就變成另一種行律法、另一張成績單，正是 2:16、21 要拆的東西；許多認真的信徒因此長年活在「今天又沒有釘好」的自責裡，聽不見同一節說的是他「愛我，為我捨己」。<\/p>"],["聯合說（我與基督聯合，被愛、換了主人）","","<p>認為 2:20 說的是信徒與基督的聯合：在基督的死裡，律法對我的判決已經執行；在基督的活裡，我得著新的生命。ζῶ δὲ οὐκέτι ἐγώ（zō de ouketi egō）不是「我不再活」，是「活著的不再是我」——活還在，生命的主人換了。我每天的功課不是再釘一次，是承認，並且順著聖靈而行（5:16、25）；而這一切的根，是神的兒子「愛我，為我捨己」。<\/p><p><strong>難處：<\/strong>這一說需要同時講清楚「已經」與「還要」：聯合是已經成就的，生活的改變卻是一生的過程；講不清楚，容易被聽成「既然已經釘了，怎麼活都可以」。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採聯合說，並把四個誤讀擋在門外。<\/strong>第一，「不再是我」不等於我不重要——同一節說他「愛我，為我捨己」。第二，「同釘」不等於我每天要努力把自己釘死——完成式被動，是神作的。第三，「基督在我裡面活」不等於我的想法就是基督的想法——同一章，被基督充滿的彼得被當面抵擋。第四，「無己」不等於要忍受傷害、不可以說不——寫這句話的人「一刻的工夫也沒有容讓順服他們」（2:5），又當面抵擋了彼得（2:11）。<\/p><p><strong>無己不是我消失了，是我被愛了；無己的人不是沒有骨頭，是骨頭換成了基督的。<\/strong>321 團契的那一句話，根不在口號裡，在下半句「他是愛我，為我捨己」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該，反而應該讓你得著安慰。你不必靠努力把自己變得沒有感受、沒有意見，才算屬靈；你也不必每天早上擔心自己今天釘得夠不夠。那件事神已經作成了。<\/p><p>如果有人一邊傷害你，一邊要你「無己」、要你忍，那不是加拉太書第二章。你可以說不，可以離開危險，可以求助——那位愛你、為你捨己的主，不要你被傷害。<\/p>"]],"con":[],"say":"本講義的立場：2:20 說的是與基督聯合——已經被釘，是神作的；活著的不再是我，是換了生命的主人，不是取消人格；「不再是我」一律連「他是愛我，為我捨己」一起講。四個誤讀見全卷附錄〈2:20 的四個誤讀〉，自由與律法主義的全卷立場見議題「基督徒的自由：在律法主義與放縱之間」。","care":"會眾席上可能有正在受家暴、受屬靈控制、或在婚姻與職場裡長期被壓迫的人，曾經被人用「你要無己」叫他閉口；也可能有長年自責「釘得不夠」而憂鬱的認真信徒。不追問細節，不要求他原諒，不對正在流淚的人說「你要有信心」。會後單獨關心，先確認他是否安全，必要時協助尋求專業與法律的協助；陪他一再聽見那下半句：他是愛你，為你捨己。"},{"id":"ISS02_9","t":"2:17--18 因信稱義會叫人放縱嗎？基督是叫人犯罪的嗎？","r":"2:17--18；5:13","ch":[2],"why":"每一個時代都有人擔心：講恩典講得太多，人就不在乎聖潔了；也有人真的把恩典當成放縱的通行證。保羅在 2:17 正面碰到這個指控。這一題關乎教會怎樣在律法主義與放縱兩頭之間講恩典，也關乎會眾聽完恩典之後，是更愛人，還是更隨便。","pos":[["【一】經文問的是甚麼","","<p>「我們若求在基督裡稱義，卻仍舊是罪人，難道基督是叫人犯罪的嗎？斷乎不是！」（2:17）這是攪擾者的推論：猶太信徒放下律法、和外邦人同桌，就成了「罪人」，基督豈不成了叫人犯罪的？保羅接著說「我素來所拆毀的，若重新建造，這就證明自己是犯罪的人」（2:18）。問題是：不靠行律法稱義，會不會叫人放縱？<\/p>"],["律法保護說（需要規條守住聖潔）","","<p>認為恩典若沒有規條保護，人一定會濫用；所以教會要加上清楚的行為標準、生活守則、屬靈紀律，作為信徒的圍牆，越嚴越安全。這是攪擾者當年的直覺，也是今天許多教會的作法。<\/p><p><strong>難處：<\/strong>保羅說把拆毀的再建造起來，才是真正的「犯罪」（2:18）；規條若成了被接納的條件，就是在基督後面加一個「和」字。而且規條管得住外面，管不住怕與驕傲，正是彼得換桌子的原因。<\/p>"],["反律說（恩典之下行為不重要）","","<p>另一頭認為：既然稱義全是恩典，行為就和信仰無關；談順服、談改變就是律法主義，信徒只要記得自己已經被赦免，怎麼活都可以。<\/p><p><strong>難處：<\/strong>保羅對「基督是叫人犯罪的嗎」的回答是最強的否定：「斷乎不是！」同一章唯一的請求是「記念窮人」；第 5 章他說自由「不可將你們的自由當作放縱情慾的機會，總要用愛心互相服事」（5:13）。恩典不是放縱的通行證。<\/p>"],["新生命說（得救的條件與得救的果子）","","<p>認為行為不是得救的條件，卻是得救的果子：向律法死了的人，是「向神活著」（2:19）；基督在他裡面活，就生發仁愛（5:6）。聖潔的動力不是規條的圍牆，是被愛之後的回應。<\/p><p><strong>難處：<\/strong>這一說要求教會有耐心等果子慢慢長出來，不像規條那樣立刻看得見成效；也需要牧者分辨：一個人的掙扎是在成長裡，還是在拿恩典當藉口。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採新生命說。<\/strong>分清楚得救的條件與得救的果子：我們不是靠這些得救，是得救了，才活出這些。律法主義與放縱都要拒絕——一個把新的規條當作進門的條件，一個把自由當作放縱的機會。<\/p><p>三個檢驗：它把人帶近基督，還是加在基督後面？它是用愛服事人，還是給肉體開門？它是聖靈的引導，還是私慾找的理由？（全卷立場見議題「基督徒的自由：在律法主義與放縱之間」）<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。如果你曾經在很嚴的規條裡長大，現在第一次聽見白白的恩典，不必害怕自己會因此變壞；被愛的人會想要回應愛。<\/p><p>如果你曾經拿恩典當藉口，也不必絕望：恩典不只赦免你，也要帶你向神活著。那位愛你、為你捨己的主，不是叫人犯罪的，是叫人得自由去愛的。<\/p>"]],"con":[],"say":"本講義的立場：因信稱義不會叫人放縱——行為不是得救的條件，卻是得救的果子；律法主義與放縱都要拒絕。本講義的全卷立場見議題「基督徒的自由：在律法主義與放縱之間」，律法與稱義見議題「律法、稱義與『因信』」。","care":"會眾席上可能有在嚴苛的規條文化裡長大、到今天仍不敢相信恩典的人，也可能有正在罪裡掙扎、怕一說出來就被趕出教會的人。不要用恐嚇叫人守規矩，也不要用「反正有恩典」叫人不在乎。對前者，陪他一再聽見白白的恩典；對後者，私下陪他面對，給他一條回來的路（挽回跌倒的人回指哥林多後書立場四）。"},{"id":"ISS03_1","t":"3:1「誰又迷惑了你們呢？」——基督徒會被下咒、被邪眼所害嗎？","r":"3:1；約壹4:4","ch":[3],"why":"華人教會裡有許多弟兄姊妹來自民間信仰的家庭，從小聽慣了犯沖、下咒、降頭、風水；信主以後，這些懼怕不一定立刻消失。讀到「誰又迷惑了你們」，原文又是「用邪眼看人」的字，有人就以為聖經承認基督徒也會中邪，需要另外的護身方法。這一題關係到信徒是活在愛裡，還是活在懼怕裡。","pos":[["【一】經文問的是甚麼","","<p>「無知的加拉太人哪，耶穌基督釘十字架，已經活畫在你們眼前，誰又迷惑了你們呢？」（3:1）「迷惑」原文 <strong>ἐβάσκανεν<\/strong>（ebaskanen），字根 βασκαίνω 在當時的民間信仰裡指用邪眼看人、施咒，被看的人會中邪、失去判斷；這個字在新約只出現這一次。問題是：保羅是在說加拉太人真的被人下了咒嗎？基督徒會被邪眼、咒術所害嗎？<\/p>"],["實際威脅說（基督徒若有破口，仍可能被咒術所害）","","<p>認為靈界是真實的，新約也記載行邪術的人（徒 13:6--11；19:19）；保羅用這個字，表示加拉太人真的落在一股屬靈的迷惑之下。所以信徒若有罪的破口、家族有拜偶像的背景，就可能被下咒、中降頭，需要斷咒、驅邪、潔淨的禱告與儀式來保護自己。<\/p><p><strong>難處：<\/strong>保羅沒有教加拉太人怎樣防邪眼，他叫他們回到眼前那位被釘的基督；全章的解藥是十字架與聖靈，不是護身法。這個讀法常讓信徒活在比信主前更大的懼怕裡，也等於在基督之外加上新的保護條件，正好落進本章要拆掉的那個「再加上」。<\/p>"],["純修辭說（只是一句俗語，靈界的事不必當真）","","<p>認為保羅只是借用一句當時人人聽得懂的俗話，就像今天說「你是被灌了甚麼迷湯」；這裡沒有任何靈界的意思，講台上也不必談咒術或邪靈，把它當成比喻就夠了。<\/p><p><strong>難處：<\/strong>新約確實承認黑暗權勢真實（徒 16:16--18；弗 6:12），保羅自己也說偶像背後有鬼魔（林前 10:20）。一概當作俗語，會讓從民間信仰出來、有過真實屬靈經歷的人覺得不被理解，也錯過了回應他們懼怕的機會：問題不是靈界存不存在，而是在基督裡的人要不要怕。<\/p>"],["反諷與得勝說（借字反諷；靈界真實，但在基督裡不必懼怕）","","<p>認為保羅是用加拉太人最怕的字作反諷：你們的樣子，像是被人下了咒——可是你們的眼睛明明看過被釘的基督。真正的「迷惑」是別的福音；能叫人站穩的，是那幅一直掛在眼前的十字架。靈界是真實的，但基督已經在十字架上勝過了執政掌權的，信徒的安全在他，不在任何護身方法。<\/p><p><strong>難處：<\/strong>這個讀法需要牧養上的細膩：對一位真的被嚇壞、整夜睡不著的人，只說「那是反諷，不要怕」是不夠的，教會還要陪他禱告、讀經，必要時也協助他就醫。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採反諷與得勝說。<\/strong>保羅不是說基督徒會中邪；他用民間怕的字，指出加拉太人真正的危險：他們的眼睛從十字架移開了。今天叫信徒失去判斷的，多半不是邪眼，而是在基督之外又加上的東西——包括一套又一套的護身、斷咒、擇日、看風水。<\/p><p>本講義承認靈界真實，也鼓勵為受驚嚇的人禱告；但禱告的根基是「那在你們裡面的，比那在世界上的更大」（約壹 4:4），不是一套新的儀式。風水、擇日、護身物怎樣看，屬於全卷立場議題「基督徒的自由：在律法主義與放縱之間」的範圍。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。你若曾經怕過被下咒，請你聽見：屬基督的人，是被那位成了咒詛的主贖出來的（3:13）；沒有任何咒語，能把你從他手裡奪去。<\/p><p>下一次懼怕來的時候，不必急著找方法，先把眼睛放回 3:1 那幅畫上：一位為你被釘、至今仍帶著釘痕的主。愛裡沒有懼怕，是因為愛你的那一位，已經站在你和一切咒詛之間。<\/p>"]],"con":[],"say":"本講義的立場：3:1 是保羅借民間怕的字作反諷，不是說基督徒會中邪；靈界真實，但屬基督的人不必怕咒詛，真正叫人失去判斷的是別的福音。護身、擇日、風水的問題，本講義的全卷立場見議題「基督徒的自由：在律法主義與放縱之間」。","care":"會眾席上可能有人家裡還在拜拜，每次回家都被說「你信了耶穌，祖先不保佑你」；也可能有人正為家人重病而害怕是被人下了降頭。講台上不嘲笑民間信仰，也不渲染靈界的恐怖故事。會後單獨陪他禱告，聽他說出懼怕；若他有長期失眠、幻聽、極度恐慌的情形，不要一律當作「中邪」，要溫和地陪他尋求醫療與專業協助。"},{"id":"ISS03_2","t":"3:6--9 亞伯拉罕的子孫——今天的基督徒是亞伯拉罕的子孫嗎？那猶太人呢？","r":"3:6--9；3:29；羅11:1--2；羅11:17--18","ch":[3],"why":"保羅說「那以信為本的人，就是亞伯拉罕的子孫」（3:7），又說屬基督的人「就是亞伯拉罕的後裔」（3:29）。這兩節在教會歷史上常被拿來說「教會取代了以色列」，甚至成為輕看、迫害猶太人的藉口；也有人反過來說猶太人另有一條得救的路。這一題關係到福音的一道門，也關係到我們怎樣對待猶太人。","pos":[["【一】經文問的是甚麼","","<p>「正如『亞伯拉罕信神，這就算為他的義』。所以，你們要知道：那以信為本的人，就是亞伯拉罕的子孫。」（3:6--7）原文 <strong>υἱοί εἰσιν Ἀβραάμ<\/strong>（huioi eisin Abraam），「是亞伯拉罕的兒子」。亞伯拉罕在受割禮、在律法頒佈之前，就因信被算為義（創 15:6）。問題是：外邦信徒在甚麼意義上是亞伯拉罕的子孫？那麼按血統是亞伯拉罕後裔的猶太人，今天在神眼中是甚麼位置？<\/p>"],["取代說（教會取代以色列）","","<p>認為以色列因拒絕彌賽亞而失去了選民的地位，神的應許如今完全轉給教會；教會就是「新以色列」，舊約對以色列的應許都要在教會身上屬靈地應驗，民族的以色列在救恩歷史上已經沒有特別的角色。<\/p><p><strong>難處：<\/strong>保羅在羅馬書明說「神棄絕了他的百姓嗎？斷乎沒有！」（羅 11:1），又說「神的恩賜和選召是沒有後悔的」（羅 11:29）。取代說在教會歷史上曾被用來為反猶的言論與暴力辯護，這是教會必須悔改的傷痕；3:29 說的是外邦人被接進來，不是猶太人被趕出去。<\/p>"],["兩約說（猶太人另有一條得救的路）","","<p>認為神與以色列的約仍然有效，猶太人可以藉著這個約與神和好，不必信耶穌；外邦人則藉著基督進入神的子民。這樣既尊重猶太人，也避免了反猶的歷史重演。<\/p><p><strong>難處：<\/strong>這與加拉太書的核心衝突：「沒有一個人靠著律法在神面前稱義」（3:11），保羅自己是生來的猶太人，卻說他也是因信基督稱義（2:15--16）。兩約說用尊重的動機，卻拆開了福音的一道門，也讓猶太人失去聽見他們自己的彌賽亞的機會。<\/p>"],["接枝說（一棵橄欖樹：外邦人被接上，以色列仍蒙愛）","","<p>認為神的子民只有一棵橄欖樹，根是神給亞伯拉罕的應許；外邦人因信被接上，猶太人因不信暫時被折下，但神仍能、也必定把他們接回去（羅 11:23--26）。所以在基督裡，猶太人與外邦人都從同一道門——信——進入同一個家，而以色列民族在神的心意裡仍有不被取消的位置。<\/p><p><strong>難處：<\/strong>羅馬書 11 章「以色列全家都要得救」的意思，各家看法不一；接枝說也不直接回答今天以色列國的政治問題，需要謹慎，不可把屬靈的論述直接套在中東的政治衝突上。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採接枝說，照全卷立場四。<\/strong>外邦信徒在基督裡，確實是亞伯拉罕的子孫，不必先變成猶太人才算數；但這絕不是說神棄絕了猶太人。外邦人是被接上的野橄欖枝，「不是你托著根，乃是根托著你」（羅 11:18）。<\/p><p>門只有一道：信基督。猶太人與外邦人從同一道門進來，坐同一張桌子。所以本講義不講取代，也不講兩條路；絕不使猶太人被輕看，也不把信仰的論述當作支持或反對任何一方政治立場的工具。本講義的全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。你的身分不在你的血統、國籍或宗派，在於你是否在基督裡；這一點，猶太信徒與外邦信徒完全一樣。主耶穌說「你們的祖宗亞伯拉罕歡歡喜喜地仰望我的日子」（約 8:56），亞伯拉罕所盼望的，就是你所信的那一位。<\/p><p>至於神怎樣成就他對以色列的應許，那是他的信實，不是我們的焦慮；我們能做的，是為以色列的平安禱告，也在言語上尊重每一位猶太人。<\/p>"]],"con":[],"say":"本講義的立場：外邦信徒在基督裡確實是亞伯拉罕的子孫，但這不是取代以色列；神沒有棄絕他的百姓，猶太人與外邦人從同一道門——信基督——進入同一個家。本講義的全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」。","care":"會眾席上可能有人對以色列有強烈的政治立場，有人親友住在中東，也可能有猶太背景或穆斯林背景的慕道朋友。講台上不談論政治選邊，不用「猶太人殺了耶穌」一類的話，也不把阿拉伯人或穆斯林講成反派。若有人因此感到被冒犯，會後單獨聽他說，承認教會歷史上的錯，再陪他回到同一位亞伯拉罕的神。"},{"id":"ISS03_3","t":"3:10「凡以行律法為本的，都是被咒詛的」——舊約的人是怎樣得救的？","r":"3:10--12；創15:6；羅4:3","ch":[3],"why":"讀到「凡以行律法為本的，都是被咒詛的」，許多人會問：那麼舊約的以色列人是靠守律法得救的嗎？神是不是在舊約和新約用了兩種救法？如果律法不能使人稱義，神為甚麼要給它？這一題講不好，會讓人以為舊約的神是另一位神，也會讓人誤會今天的猶太人。","pos":[["【一】經文問的是甚麼","","<p>「凡以行律法為本的，都是被咒詛的；因為經上記著：『凡不常照律法書上所記一切之事去行的，就被咒詛。』」（3:10）接著：「沒有一個人靠著律法在神面前稱義，這是明顯的；因為經上說：『義人必因信得生。』」（3:11）<strong>ἐξ ἔργων νόμου<\/strong>（ex ergōn nomou）「以行律法為本」，正是全卷爭議的字眼。問題是：舊約的人是靠守律法得救的嗎？如果不是，他們是怎樣蒙神接納的？<\/p>"],["兩途說（舊約靠守律法，新約靠信）","","<p>認為神在舊約時代給以色列一條守律法的路，守得住就蒙福得生，「行這些事的，就必因此活著」（3:12）；到了新約，因為人守不住，神才改用因信稱義的方法。所以舊約與新約是兩個不同的救恩時代。<\/p><p><strong>難處：<\/strong>保羅的論證正好相反：亞伯拉罕在律法之前四百三十年就因信稱義（3:6、17），他引的「義人必因信得生」也是舊約先知哈巴谷的話。若舊約有一條靠守律法得救的路，「若曾傳一個能叫人得生的律法，義就誠然本乎律法了」（3:21）就不能成立。<\/p>"],["約內說（新觀：以色列在約裡蒙恩，守律法是留在約中的記號）","","<p>保羅新觀的學者指出，第一世紀的猶太教本身並不教導「靠功德賺取救恩」：以色列人是因神的揀選與恩典進入約，守律法是留在約中的回應與記號。3:10 的「以行律法為本」，指的是把割禮、飲食、節期當作身分的界線，用來分辨誰是神的子民。<\/p><p><strong>難處：<\/strong>這個提醒很寶貴，加拉太的「行律法」確實具體表現為割禮與分桌（2:12）；但保羅在 3:10 引用申 27:26 說的是「一切之事」都要遵行，3:22 又說「聖經把眾人都圈在罪裡」。若只是身分界線的問題，3:13「基督成了咒詛」就失去了分量。<\/p>"],["一貫恩典說（舊約的聖徒也是因信，信那位應許的神）","","<p>認為從亞伯拉罕到摩西到先知，神接納人的方式始終是恩典，人回應的方式始終是信：信那位應許的神，並仰望他所應許的救恩。律法是給已經蒙救贖的百姓的生活方式——十誡是在「我是耶和華你的神，曾將你從埃及地為奴之家領出來」之後才頒佈的；獻祭制度也指向將來那一次永遠的獻上。<\/p><p><strong>難處：<\/strong>舊約的聖徒對基督的認識有限，說他們「信基督」需要小心，比較準確的說法是他們信那位應許的神，而那應許在基督身上成就；這種說法也需要解釋，那些在律法下真誠卻失敗的人，怎樣因信被算為義。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採一貫恩典說，同時吸收新觀的提醒。<\/strong>神從來沒有兩套救法：亞伯拉罕「信神，這就算為他的義」（3:6），舊約的聖徒也是因信，信那位應許的神；律法從來不是被設計來使人稱義的。3:10 說的是：任何人想把律法當作稱義的根基，就要站在律法完整的要求之下，而沒有人站得住。<\/p><p>同時，在加拉太，「行律法」的具體樣子正是割禮與分桌；稱義不只是個人與神之間的事，也是誰可以同坐一張桌子。本講義的全卷立場見議題「律法、稱義與『因信』」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該，而且它應該加深你的信心。舊約與新約是同一位神、同一個恩典、同一條信的路；你今天讀的詩篇、先知書，是和你一樣靠著恩典活的人寫的。<\/p><p>你若曾經以為舊約的神很兇、只會要求，請你重讀創 15 那一夜：神叫亞伯蘭數星星，然後親自把義記在他的帳上。那是同一位在十字架上把咒詛擔下來的神。<\/p>"]],"con":[],"say":"本講義的立場：神從來沒有兩套救法；舊約的聖徒也是因信稱義，信那位應許的神，律法不是稱義的途徑，而是給蒙恩之民的生活方式與看管。本講義的全卷立場見議題「律法、稱義與『因信』」。","care":"會眾席上可能有人家裡長輩過世時沒有信主，一聽到「誰能得救」就心裡揪緊；也可能有人從小在嚴格的規條裡長大，一讀舊約就聽見責罵。講台上不對任何已故的人下判斷，把審判交給公義而憐憫的神。會後單獨陪伴這樣的人，不追問細節，先陪他看見舊約裡那位領人出為奴之家的神。"},{"id":"ISS03_4","t":"3:13「基督……受了咒詛」——代受刑罰的贖罪論站得住嗎？","r":"3:13--14；林後5:21；賽53:5","ch":[3],"why":"3:13 是新約講十字架最直接的經文之一：基督「替我們」成了咒詛。福音派傳統用「代受刑罰」來理解它，近年卻有人批評這個講法像「父親虐待兒子」，或太偏重法庭的畫面，主張改用「得勝」或「代表」的說法。這一題關係到我們怎樣傳講十字架，也關係到受過父親傷害的人怎樣看天父。","pos":[["【一】經文問的是甚麼","","<p>「基督既為我們受了咒詛，就贖出我們脫離律法的咒詛；因為經上記著：『凡掛在木頭上都是被咒詛的。』」（3:13）<strong>ἐξηγόρασεν<\/strong>（exēgorasen）是從市場上買出來；<strong>γενόμενος ὑπὲρ ἡμῶν κατάρα<\/strong>（genomenos hyper hēmōn katara）是「替我們成了咒詛」，和合本註腳說「受了咒詛」原文是「成了咒詛」。問題是：基督怎樣替我們承受咒詛？這是刑罰的代替，還是別的意思？<\/p>"],["代受刑罰說","","<p>認為 3:10 說的咒詛，是神的律法對罪人公義的判決；基督站進我們的位置，承受了那份判決，我們因此被赦免、被贖出。這與「神使那無罪的，替我們成為罪」（林後 5:21）、「他為我們的過犯受害，為我們的罪孽壓傷」（賽 53:5）相合，是宗教改革以來福音派的主流理解。<\/p><p><strong>難處：<\/strong>若講得不好，會把父與子講成對立：一位憤怒的父親懲罰無辜的兒子，被批評為「宇宙級的虐兒」；也可能只剩下法庭的畫面，忽略了十字架勝過權勢、帶來新生命與聖靈的一面（3:14）。<\/p>"],["得勝說（基督勝過罪、死與黑暗權勢）","","<p>認為十字架最主要是基督勝過奴役人的權勢：罪、死亡、魔鬼，以及第 4 章說的「世俗小學」。「贖出」是把奴隸從主人手下買出來，強調的是釋放；這個講法在早期教父中很普遍，近代又被稱為「得勝基督」。<\/p><p><strong>難處：<\/strong>3:13 明說是「律法的咒詛」，引的是申 27:26 與申 21:23，咒詛來自神的律法，不只是邪惡的權勢；只講得勝，容易略過罪人在神面前真實的罪咎，也說不清基督為甚麼必須「掛在木頭上」。<\/p>"],["代表說（基督作以色列與人類的代表，走完咒詛的歷史）","","<p>認為基督是以色列的彌賽亞與代表，以色列在律法下所承受的咒詛（申 27--28 章的被擄與流亡），由他一人在十字架上走到盡頭，好叫亞伯拉罕的福臨到外邦人（3:14）。這個讀法強調群體與救恩歷史，常與新觀的學者相連。<\/p><p><strong>難處：<\/strong>代表的觀念很合經文，但若只停在以色列的歷史，就難以說明 3:13 的「我們」也包括外邦人，以及「替我們」所帶有的代替意味；代表不排除代替，反而需要代替來說完。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義以代受刑罰為核心，同時吸收得勝說與代表說。<\/strong>3:10 的咒詛是神公義的判決，3:13 的「替我們」是真實的代替；咒詛沒有被一筆勾銷，是被他擔下了。但這位替我們受咒詛的，是我們的代表，也是勝過權勢、把我們贖出來的主；十字架的終點是聖靈的應許（3:14）。<\/p><p>最重要的是：父與子沒有對立。父「差遣他的兒子」（4:4），子「是愛我，為我捨己」（2:20）；「惟有基督在我們還作罪人的時候為我們死，神的愛就在此向我們顯明了」（羅 5:8）。本講義的全卷立場見議題「律法、稱義與『因信』」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。教會兩千年來用不同的畫面描述十字架：法庭、戰場、市場、聖殿；每一個畫面都說出一部分，沒有一個能說盡。但每一個畫面都同意一件事：他是替我們。<\/p><p>你若曾經因為「代受刑罰」這個講法而怕天父，請你看清楚：在十字架上付代價的，正是神自己的愛。父沒有把兒子推上十字架，是父與子同心，把你從咒詛裡領出來。<\/p>"]],"con":[],"say":"本講義的立場：3:13 的核心是代受刑罰——基督替我們成了律法的咒詛；同時吸收得勝與代表的畫面，而且父與子同心，十字架是神的愛，不是父子對立。本講義的全卷立場見議題「律法、稱義與『因信』」。","care":"會眾席上可能有人在原生家庭裡被父親打罵、羞辱，一聽到「父親懲罰兒子」就全身緊繃；也可能有人正受家暴，會把「替人受苦」當成留在危險裡的理由。講台上不用暴力的細節渲染十字架，也絕不說「你要像基督一樣替人受苦」。會後單獨關心，不追問細節；若涉及正在發生的暴力，協助他先求安全，必要時尋求專業與法律協助。"},{"id":"ISS03_5","t":"3:16「子孫」是單數——保羅的釋經合理嗎？","r":"3:15--16；3:29；創22:17--18；創21:12","ch":[3],"why":"細心的讀者會發現：創世記裡的「後裔」本來就是集合名詞，單數形式也指眾多子孫。保羅卻說經上不是說「眾子孫」，乃是說「你那一個子孫」，「就是基督」。有人因此說保羅在玩文字遊戲、斷章取義；這一題關係到讀者怎樣看待新約引用舊約，也關係到他們對聖經的信任。","pos":[["【一】經文問的是甚麼","","<p>「所應許的原是向亞伯拉罕和他子孫說的。神並不是說『眾子孫』，指著許多人，乃是說『你那一個子孫』，指著一個人，就是基督。」（3:16）原文 <strong>τῷ σπέρματί σου<\/strong>（tō spermati sou）是單數，<strong>τοῖς σπέρμασιν<\/strong>（tois spermasin）是複數。但創 13:15、17:8、22:18 的「後裔」，希伯來文與希臘文本來就是集合名詞。問題是：保羅的論證站得住嗎？<\/p>"],["拉比方法說（屬於那個時代的字面論證）","","<p>認為保羅受過拉比的訓練，用了當時常見的方法：從一個字的單複數形式抽出意義。這種方法在第一世紀的猶太人聽來很自然，今天的讀者不必模仿；保羅的結論對，但論證的方法屬於他的時代。也有更激烈的學者說，這是保羅為了結論而勉強讀出的意思。<\/p><p><strong>難處：<\/strong>保羅自己在 3:29 說「你們……就是亞伯拉罕的後裔」，用的是同一個單數字指眾人，可見他清楚知道這是集合名詞，並不是不懂文法；把他的論證只當作時代的方法，低估了他在說的神學。<\/p>"],["集合與代表說（眾子孫總結在一位代表身上）","","<p>認為保羅知道 σπέρμα（sperma）是集合名詞，他的意思是：眾子孫被總結在一位代表身上。舊約已經有這個走向：神對亞伯拉罕說「你子孫必得著仇敵的城門」（創 22:17），希伯來文接著用單數代名詞；撒下 7:12 應許大衛的「後裔」，也指一位君王。代表與眾人本來就是一體。<\/p><p><strong>難處：<\/strong>這需要讀者對希伯來文與舊約的君王神學有一些認識，才看得出保羅不是任意取義；一般會眾聽來，仍可能覺得是在單數、複數上做文章，需要講台耐心說明。<\/p>"],["揀選收窄說（創世記自己在收窄後裔）","","<p>認為創世記本身就在一路收窄「後裔」：不是以實瑪利，是以撒，「從以撒生的，才要稱為你的後裔」（創 21:12）；不是以掃，是雅各；然後是猶大、是大衛的家。保羅看見這條線的終點是一個人，就是基督；應許從一族收窄到一位，又從這一位擴展到所有在他裡面的人。<\/p><p><strong>難處：<\/strong>這個讀法解釋了方向，卻不直接解釋保羅為甚麼要特別強調文法上的單數；它需要和代表說一起讀，才完整。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義以集合與代表說為主，揀選收窄說為輔。<\/strong>保羅不是在玩文字遊戲，而是看見應許從一族收窄到一位，又從一位擴展到眾人：3:16 的「一個子孫」，到 3:29 就變成「你們」。<\/p><p>講台上只照保羅自己作的連結講，不把這種方法推到別的經文，在單數複數上任意找新教義。這是釋經方法的爭議，不影響任何一條教義；本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。新約怎樣讀舊約，是學者認真討論的題目，討論越深，越看得見保羅讀經的深度，而不是他的草率。<\/p><p>更重要的是，這一節回答了一個每個人都會問的問題：我夠不夠資格承受神的應許？答案不在你的出身、表現或屬靈年資，而在你是否在那一個子孫——基督——裡面。<\/p>"]],"con":[],"say":"本講義的立場：保羅知道「子孫」是集合名詞，他看見眾子孫總結在一位代表——基督——身上，又從他擴展到所有屬他的人（3:29）；這不是文字遊戲。這是不影響信心的釋經爭議，本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上可能有正在讀神學、或在網路上看了批評聖經文章的年輕人，心裡很不安，卻不敢在教會裡問。講台上不炫耀原文知識，也不嘲笑提出質疑的人。會後若有人來問，先謝謝他願意問，耐心陪他看經文，讓他知道在教會裡可以帶著問題來，也可以帶著問題留下來。"},{"id":"ISS03_6","t":"3:19--25 律法的功用——道德律、禮儀律、民事律的三分法，今天還有約束力嗎？","r":"3:19--25；太5:17；羅3:31","ch":[3],"why":"保羅說律法是「為過犯添上的」，是「訓蒙的師傅」，而且「我們從此就不在師傅的手下了」（3:25）。那麼十誡今天還要守嗎？安息日、飲食條例、什一奉獻呢？許多教會用「道德律、禮儀律、民事律」三分法來回答，也有人認為這不是聖經自己的分法。這一題關係到信徒每天怎樣看待舊約的誡命。","pos":[["【一】經文問的是甚麼","","<p>「這樣說來，律法是為甚麼有的呢？原是為過犯添上的，等候那蒙應許的子孫來到」（3:19）；「律法是我們訓蒙的師傅，引我們到基督那裡，使我們因信稱義」（3:24）。<strong>παιδαγωγός<\/strong>（paidagōgos）是看管孩子的家奴，孩子長大，他的工作就完成了。問題是：「不在師傅的手下」，是指整個摩西律法都不再約束信徒嗎？還是只有一部分？<\/p>"],["三分法說（禮儀律、民事律已成全，道德律仍有約束力）","","<p>源自中世紀並在宗教改革傳統中定型（例如威斯敏斯德信條）：獻祭、潔淨、節期等禮儀律，在基督身上已經成全；管理以色列國的民事律，隨著以色列神權國家結束；而十誡所代表的道德律，反映神永恆的性情，今天仍然約束信徒。<\/p><p><strong>難處：<\/strong>摩西律法本身沒有這樣分類，同一章裡常把三類誡命混在一起（如利 19 章）；安息日屬於哪一類，各派爭論不休。保羅在 3:25 說「不在師傅的手下」，看起來是指整個律法的看管，而不是只有一部分。<\/p>"],["整體成全說（摩西律法整體在基督裡成全，信徒在基督的律法之下）","","<p>認為摩西律法是一個整體，屬於從西奈山到基督的這一段時期；基督來了，整個律法在他身上成全，主耶穌說「我來不是要廢掉，乃是要成全」（太 5:17）。信徒今天不是在摩西律法之下，而是在「基督的律法」之下（6:2），舊約的道德教導，經過基督與使徒重新賜下，在聖靈的果子裡被活出來。<\/p><p><strong>難處：<\/strong>這個講法若說不清楚，容易被誤會成「十誡不再重要」；它需要說明：神的道德心意從來沒有改變，改變的是律法的位置與功用，而不是神的聖潔。<\/p>"],["神治延續說（舊約民事律今天仍應施行於社會）","","<p>少數改革宗學者（神治主義）認為，除了明說已經成全的禮儀律，舊約的民事律與刑罰，今天仍應成為各國法律的標準，基督徒應當推動社會照摩西律法治理。<\/p><p><strong>難處：<\/strong>這忽略了以色列神權國家獨特的處境，也與加拉太書「不在師傅的手下」的方向相反；歷史上把宗教律法變成國家強制的做法，常常帶來壓迫，連福音也被扭曲成政治工具。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：摩西律法整體在基督裡成全；它不是稱義的途徑，也不是進入神家的身分門檻，但它不是廢紙。<\/strong>律法「引我們到基督那裡」（3:24），也在聖靈的果子裡被成全：「愛人如己」（5:14）。保羅自己問「我們因信廢了律法嗎？斷乎不是！更是堅固律法」（羅 3:31）。<\/p><p>三分法可以作為教學工具，幫助說明哪些誡命今天以甚麼方式延續；但它不是保羅自己的分類，不宜拿來作為爭論的武器。本講義的全卷立場見議題「律法、稱義與『因信』」；安息日、節期、飲食怎樣看，見議題「基督徒的自由：在律法主義與放縱之間」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論你的教會採用哪一種講法，忠心的基督徒都同意：我們不是靠守律法得救，也不是因此可以隨便活；律法讓我們看見自己需要基督，聖靈讓我們活出律法真正的心意。<\/p><p>你若一直活得像那個被家奴牽著手的孩子，戰戰兢兢地怕犯錯，請你聽見：你已經到了父親的家，你是兒子，不是被看管的學生。從今天起，順服是從愛裡長出來的。<\/p>"]],"con":[],"say":"本講義的立場：摩西律法整體在基督裡成全，不是稱義的途徑，也不是廢紙；它引我們到基督那裡，在聖靈的果子裡被成全。三分法可作教學工具，但不是保羅自己的分類。本講義的全卷立場見議題「律法、稱義與『因信』」，自由與節期見議題「基督徒的自由：在律法主義與放縱之間」。","care":"會眾席上可能有人從守安息日、守飲食條例的團體出來，心裡還有罪咎；也可能有人在嚴格的規條裡長大，一聽到「律法」就想起被罰的童年。講台上不嘲笑任何守日或不守日的人。會後若有人來談，先聽他走過的路，不急著辯論，陪他看見自己在父親家裡的身分。"},{"id":"ISS03_7","t":"3:28「或男或女……都成為一了」——教會裡的性別角色：互補派與平等派怎樣讀？","r":"3:26--28；創1:27；林前11:11","ch":[3],"why":"3:28 是今天討論教會性別角色最常被引用的經文之一：女性可以作牧師、長老嗎？可以講道嗎？家庭裡丈夫與妻子是甚麼關係？兩派都敬重聖經，卻讀出不同的結論，教會也常在這裡受傷、分裂。這一題要讓兩派都被公平地聽見，也要守住一條共同的底線。","pos":[["【一】經文問的是甚麼","","<p>「並不分猶太人、希臘人，自主的、為奴的，或男或女，因為你們在基督耶穌裡都成為一了。」（3:28）前兩組用 οὐδὲ（oude），第三組卻是 <strong>ἄρσεν καὶ θῆλυ<\/strong>（arsen kai thēly）「男和女」，正是創 1:27「造男造女」的字句；<strong>εἷς<\/strong>（heis）是陽性，「一個人」。問題是：3:28 只講救恩上的平等，還是也決定了教會與家庭裡的角色？<\/p>"],["互補派","","<p>認為 3:28 講的是在基督裡的身分與救恩：男女同樣是神的兒子、同樣承受產業，在神面前完全平等。但這節經文的上下文是「誰是亞伯拉罕的後裔」，不是教會的職分；保羅在別處（提前 2 章；林前 14 章；弗 5 章）對教會與家庭的帶領有具體的教導，男女在價值上平等，在角色上互補，這是創造的秩序，不是墮落的結果。<\/p><p><strong>難處：<\/strong>那些具體的教導本身怎樣解釋，有很多爭議；保羅也稱讚許多女同工（羅 16 章），提到女人禱告、說預言（林前 11:5）。互補派若講得不好，容易把「角色」變成「位階」，讓女性在教會裡只能坐偏桌。<\/p>"],["平等派","","<p>認為 3:28 是保羅神學的原則：在基督裡，民族、階級、性別都不再決定一個人在神家中的地位與服事；其他限制女性的經文，是針對當時特定教會處境的應用。正如教會後來看出「自主的、為奴的」這一組最終要改變社會制度，「或男或女」也應當讓男女都能擔任一切職分。<\/p><p><strong>難處：<\/strong>3:28 的上下文確實是救恩與承受產業，直接推出職分的結論需要更多步驟；把其他經文一律說成處境性的，也需要逐段的論證。平等派若講得不好，容易抹平男女的差異，忘了 ἄρσεν καὶ θῆλυ 回聲的是創造，不是取消創造。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義兩派並陳，不替各教會做決定，照全卷立場四。<\/strong>互補派與平等派都是敬重聖經權威的福音派，各教會可以照自己的傳統與釋經作決定，彼此尊重，不把對方講成不信聖經。<\/p><p>但兩派都必須同意一條底線：<strong>3:28 之後，任何貶低、輕看、排斥女性的講法與做法，都違背福音。<\/strong>合一不是一樣：「然而照主的安排，女也不是無男，男也不是無女」（林前 11:11）。本講義的全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。你的教會採哪一派，都不改變你在基督裡的身分：你是神的兒子，披戴基督，照著應許承受產業。<\/p><p>若你是一位姊妹，曾被告訴你的恩賜不重要、你的聲音不必聽，請你知道：那不是 3:28 的主。若你在一間持守互補立場的教會裡，也不必因此被看成落後；兩邊都可以在同一位主面前，一起尊重女性的恩賜與尊嚴。<\/p>"]],"con":[],"say":"本講義的立場：互補派與平等派都是敬重聖經的福音派，本講義並陳，不替各教會決定；但兩派都必須同意，任何貶低、輕看女性的講法都違背福音。本講義的全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」。","care":"會眾席上可能有姊妹曾因性別被拒於服事之外，帶著很深的傷；也可能有弟兄姊妹在自己的教會傳統裡被批評為保守或激進。講台上不嘲諷任何一派，不點名任何教會，更不用這一題開玩笑。若有姊妹談到在教會或家庭裡受到控制、羞辱或暴力，先相信她、保護她，不追問細節，必要時協助尋求專業協助。"},{"id":"ISS03_8","t":"3:28「自主的、為奴的」——保羅為甚麼不廢除奴隸制？","r":"3:28；林前7:21；門16","ch":[3],"why":"保羅說在基督裡「並不分……自主的、為奴的」，卻沒有呼籲廢除奴隸制，還在別處勸奴僕順服主人。歷史上，有人拿這一點為奴隸制辯護；也有人因此說聖經是壓迫者的書。今天，從外籍幫傭到移工，從人口販運到剝削勞工，這一題仍然關係到教會怎樣對待社會最底層的人。","pos":[["【一】經文問的是甚麼","","<p>「並不分猶太人、希臘人，自主的、為奴的，或男或女」（3:28）。<strong>δοῦλος οὐδὲ ἐλεύθερος<\/strong>（doulos oude eleutheros），在羅馬帝國，奴隸可能佔城市人口的相當比例，是整個經濟的基礎。問題是：既然在基督裡不分主奴，保羅為甚麼不直接呼籲廢除奴隸制？這是否表示他認可這個制度？<\/p>"],["處境順應說（保羅接受當時的社會制度，只改變人心）","","<p>認為保羅的使命是傳福音，不是改革社會；在羅馬帝國裡，一個小小的教會若公開號召奴隸解放，會被當作叛亂鎮壓，也會讓福音被誤會成政治運動。所以他接受現存制度，只要求主人與奴隸都敬畏主。<\/p><p><strong>難處：<\/strong>這個講法若停在這裡，很容易被拿來為不公義辯護——美洲的奴隸主就曾這樣引用保羅；它也忽略了保羅確實鼓勵「若能以自由，就求自由更好」（林前 7:21），並把搶人口的列在罪惡清單裡（提前 1:10）。<\/p>"],["批判說（保羅認可奴隸制，聖經在這事上已經過時）","","<p>認為保羅既然沒有反對奴隸制，還勸奴僕順服，就說明聖經在這個問題上反映的是古代社會的道德水準；今天的人權觀念已經超越了聖經，在這類議題上不必再以聖經為準。<\/p><p><strong>難處：<\/strong>這忽略了 3:28 與腓利門書的力量：保羅要腓利門接回逃奴阿尼西母，「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（門 16）——這在當時是驚人的話。歷史上推動廢奴運動的許多先驅，正是從這些經文得著力量的基督徒。<\/p>"],["內在瓦解說（福音放下的原則，從裡面瓦解奴隸制）","","<p>認為保羅沒有在處境中發動革命，卻在教會裡放下了一個制度無法長久承受的原則：主人與奴隸同坐一張桌子、同受一個洗、同稱一位父；奴隸可以作教會的帶領者，主人要稱奴隸為弟兄。這個原則像酵一樣，終究從裡面瓦解了奴隸制。<\/p><p><strong>難處：<\/strong>這個「終究」走了一千多年，其間許多基督徒仍然擁有奴隸、為奴隸制辯護；這個讀法要誠實承認教會的失敗，不能只用原則替歷史美化。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採內在瓦解說，並照處境與原則分清。<\/strong>處境是羅馬帝國裡一個沒有權力的少數群體；原則是在基督裡，人的價值與在神家中的位置，不再由他的社會身分決定。保羅沒有拆制度，卻拆掉了制度的根基。<\/p><p>所以今天不能用「保羅沒有反對」為任何剝削辯護；這個原則今天落在外籍幫傭的休假、移工的薪水、人口販運的受害者身上。本講義的全卷立場見議題「書信的處境與原則」（處境與原則）與議題「在基督裡成為一：族群、性別、以色列與教會」（在基督裡成為一）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該，但它應該讓你誠實。聖經沒有為壓迫辯護，是人拿聖經為壓迫辯護；教會在這件事上曾經失敗，也曾因著同一本聖經悔改、起來為受壓的人發聲。<\/p><p>你若曾在工作中被當作工具、被壓榨，請你聽見：在基督裡，你不是誰的財產，你是神的兒子。你若是雇主或主管，3:28 正在問你：你家裡、公司裡最基層的那一位，你叫得出他的名字嗎？<\/p>"]],"con":[],"say":"本講義的立場：保羅在處境中沒有發動社會革命，卻放下了在基督裡不分主奴的原則，從裡面瓦解了奴隸制；今天不可用這一節為任何剝削辯護。本講義的全卷立場見議題「書信的處境與原則」與議題「在基督裡成為一：族群、性別、以色列與教會」。","care":"會眾席上可能有外籍幫傭、移工，或正在被雇主苛待、被扣證件、被欠薪的人；也可能有祖先曾被賣為奴、被當作苦力的家族記憶。講台上不輕描淡寫地說「那是古代的事」。會後單獨關心這樣的人，不追問細節；若涉及扣押證件、人身控制或人口販運，協助他聯絡相關的保護機構與法律協助。"},{"id":"ISS03_9","t":"3:27「受洗歸入基督的都是披戴基督了」——洗禮能使人得救嗎？","r":"3:26--27；羅6:3--4","ch":[3],"why":"3:27 把洗禮說得很重：受洗歸入基督，就是披戴基督。有些教會因此教導洗禮使人重生，有些教會則說洗禮只是外在的見證；有人為嬰孩時受的洗不安，也有人因家庭反對而還不能受洗，擔心自己是否得救。加拉太書整卷反對把一個身體上的儀式當作得救的條件，這一題就更需要說清楚。","pos":[["【一】經文問的是甚麼","","<p>「所以，你們因信基督耶穌都是神的兒子。你們受洗歸入基督的都是披戴基督了。」（3:26--27）<strong>εἰς Χριστὸν ἐβαπτίσθητε<\/strong>（eis Christon ebaptisthēte）「受洗歸入基督」；<strong>Χριστὸν ἐνεδύσασθε<\/strong>（Christon enedysasthe）「披戴了基督」，是不定過去式，一次完成的事。問題是：洗禮在得救上是甚麼位置？是使人得救的途徑，還是得救之後的見證？<\/p>"],["洗禮重生說（洗禮是神施恩、使人重生的途徑）","","<p>天主教、東正教與信義宗等傳統認為，洗禮不只是象徵，而是神藉著水與話語施恩、使人與基督聯合的途徑；3:27 與羅 6:3「受洗歸入他的死」都說明，洗禮真實地把人帶進基督裡。<\/p><p><strong>難處：<\/strong>3:26 先說「因信基督耶穌」，3:27 的「因為」是在解釋這個信；加拉太書整卷反對把割禮這個身體上的記號當作得救的條件，若把洗禮講成沒有它就不能得救，很容易讓洗禮變成新的割禮。十字架上的強盜沒有受洗，主卻應許他在樂園裡。<\/p>"],["純象徵說（洗禮只是外在的見證）","","<p>部分浸信會與重洗派傳統認為，洗禮是信徒順服主命令、公開見證自己已經信主的行動，本身沒有施恩的作用；得救完全是因信，洗禮只是外面的記號。<\/p><p><strong>難處：<\/strong>3:27 的語氣很強：「受洗歸入基督」「披戴基督」，不像只是一個可有可無的儀式；新約裡信主與受洗幾乎總是連在一起（徒 2:41；8:36--38）。講得太輕，會讓信徒輕看主所命定的聖禮。<\/p>"],["立約記號說（洗禮是與信心相連的恩典記號與印記）","","<p>改革宗等傳統認為，洗禮是新約的記號與印記：它不使人自動得救，卻是神所命定、與信心連在一起的恩典記號，向人宣告並印證他已經與基督聯合。正如保羅在 3:27 用洗禮說明信的實際：信的人被公開地「穿上」基督。<\/p><p><strong>難處：<\/strong>這個傳統多主張為信徒的嬰孩施洗，與主張信而後洗的教會有很深的分歧；「記號與印記」怎樣作用，也需要細心的說明，一般會眾不容易明白。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：稱義單單因信；洗禮是神所命定、與信心連在一起的公開記號，不可輕看，也不可變成新的割禮。<\/strong>3:26 先說「因信」，3:27 再說「受洗」：信是根，洗禮是那個信被公開穿上的時刻。<\/p><p>洗禮的方式（點水、浸水）與年齡（嬰孩、成人），各宗派有不同的傳統，本講義尊重彼此；但都同意：洗禮是同一件衣服，猶太人、外邦人、男女主僕都一樣受，正好拆掉了只有男人能受的割禮之牆。本講義的全卷立場見議題「律法、稱義與『因信』」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。你若在嬰孩時受洗，或在別的宗派受洗，可以和你的牧者談，但不必懷疑自己是否得救；得救的根基是那位替你成了咒詛的基督，不是洗禮的形式。<\/p><p>你若已經信主，卻因家庭或處境還不能受洗，請你知道：你因信已經是神的兒子（3:26）。在等待的日子裡，你可以和你的牧者一起禱告，等候合適的時候；主看見你的心。<\/p>"]],"con":[],"say":"本講義的立場：稱義單單因信；洗禮是神所命定、與信心相連的公開記號，不可輕看，也不可變成新的割禮。各宗派洗禮方式與年齡的差異，彼此尊重。本講義的全卷立場見議題「律法、稱義與『因信』」。","care":"會眾席上可能有人已經信主，卻因為家人強烈反對、甚至有人身安全的顧慮，而不能公開受洗；也可能有人因為受洗的方式不同被別的教會說「不算數」而受傷。講台上不對這樣的人施壓，不說「沒受洗就不算得救」。會後單獨關心，評估他的處境與安全，陪他一起禱告、等候，不替他做決定。"},{"id":"ISS04_1","t":"4:3、9「世俗的小學」是甚麼？基本規條、宇宙元素，還是靈界勢力？","r":"4:3；4:8--9；西2:8；西2:20","ch":[4],"why":"「小學」這個譯名讓很多讀者以為保羅只是在說「初級的功課」，讀起來無關痛癢；可是保羅把它和「那些本來不是神的」放在一起，又說回到那裡就是「再給他作奴僕」。這個詞怎麼讀，決定了我們怎麼看今天那些「在基督以外再加上」的東西，是無害的習慣，還是真實的捆綁。","pos":[["【一】經文問的是甚麼","","<p>「我們為孩童的時候，受管於世俗小學之下，也是如此」（4:3）；「怎麼還要歸回那懦弱無用的小學，情願再給他作奴僕呢？」（4:9）。原文是 <strong>τὰ στοιχεῖα τοῦ κόσμου<\/strong>（ta stoicheia tou kosmou），第 9 節作 <strong>τὰ ἀσθενῆ καὶ πτωχὰ στοιχεῖα<\/strong>（ta asthenē kai ptōcha stoicheia）。στοιχεῖα（stoicheia）原意是排成一列的東西：字母、元素、基本原理。問題是：保羅說的是哪一種？更難的是，他把猶太人在律法下的日子（「我們」）和外邦人拜偶像的日子，放在同一個詞底下。<\/p>"],["基本規條說（初階的宗教原則）","","<p>認為 στοιχεῖα（stoicheia）是字母表的 ABC，指初學的、基本的宗教規條：律法的條例、外邦宗教的禁忌，都是人在「孩童時期」受管的課程。和合本譯作「小學」就是取這個意思，與 4:1--2 孩童在師傅手下的比喻最相合。<\/p><p><strong>難處：<\/strong>這個讀法很難解釋 4:8--9 為甚麼把 στοιχεῖα 和「本來不是神的」連在一起，也讓「再給他作奴僕」聽起來太輕——如果只是初級課程，為甚麼回去就等於被奴役？<\/p>"],["宇宙元素說（土、水、火、風）","","<p>認為這個詞在希臘文獻裡最常指構成世界的四大元素；古人以為這些元素與天上的星體掌管季節、時令與人的命運，所以 4:10 緊接著說「日子、月份、節期、年份」。保羅的意思是：人在基督以外，總是被受造的世界秩序管著。<\/p><p><strong>難處：<\/strong>說猶太人在律法下「受管於」土水火風，聽起來很奇怪；這個讀法需要再多走一步，把律法的曆法和外邦人的星象曆法看成同一種結構，才講得通。<\/p>"],["靈界勢力說（掌管元素與時令的屬靈權勢）","","<p>認為當時的猶太文獻與希臘思想都把元素、星辰和天使或靈界勢力連在一起；4:8 說「本來不是神的」，4:9 說「再給他作奴僕」，都像是在講有位格的權勢。歌羅西書也用同一個詞警告人不要被「世上的小學」擄去（西 2:8、20）。<\/p><p><strong>難處：<\/strong>把神所賜的律法說成在靈界勢力的手下，必須非常小心——保羅在 3:19、3:24 說律法是神設立的、是訓蒙的師傅；這個讀法若推得太遠，會把律法講成魔鬼的工具，違背保羅的意思。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義以「基本規條」為骨幹，兼含「靈界勢力」的面向：<\/strong>στοιχεῖα 是一套用規條與時令來管人的宗教秩序，人在基督以外，不論是猶太人守律法的條例，還是外邦人看星象、拜偶像，都處在同一種被管的姿勢裡；而在偶像與吉凶的背後，確實有「本來不是神的」權勢。<\/p><p>保羅沒有說律法等於偶像，他說的是：把任何東西放在基督旁邊，當作確定自己在神面前位置的保險，靈魂就回到同一個結構。所以這一題的答案是一個檢驗：<strong>那件事是幫助我到基督那裡，還是我拿它代替基督？<\/strong>本講義的全卷立場見議題「基督徒的自由：在律法主義與放縱之間」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。三種讀法在一件事上完全一致：那些東西「懦弱無用」——<strong>ἀσθενῆ καὶ πτωχὰ<\/strong>，軟弱，救不了人；貧乏，給不出產業。能給產業的只有父，能贖人的只有那位生在律法以下的兒子。<\/p><p>如果你曾經被吉凶、禁忌、規條管得很緊，今天信了主仍然不時害怕，請你知道：那些力量不是你的主人。你已經被神所認識（4:9），不必再回到那間課室。<\/p>"]],"con":[],"say":"本講義的立場：「世俗的小學」是一套用規條與時令管人的宗教秩序，背後也有不是神的權勢；律法本身不是偶像，但把任何東西加在基督旁邊當作保險，就是回到同一種奴役。本講義的全卷立場見議題「基督徒的自由：在律法主義與放縱之間」。","care":"會眾席上可能有人從民間信仰、道教或其他宗教背景信主，聽到「靈界勢力」會勾起從前的懼怕；也可能有人從很嚴格的教會出來，聽到「規條」就想起被管得喘不過氣的日子。講台上不渲染靈界的恐怖，也不嘲笑任何人的過去。會後若有人說他仍然怕，陪他禱告，陪他把 4:9「被神所認識」讀幾次，必要時請有經驗的同工一起陪伴。"},{"id":"ISS04_2","t":"4:10「你們謹守日子、月份、節期、年份」——基督徒可以過聖誕、春節、清明嗎？擇日看時辰呢？","r":"4:8--11；羅14:5--6；西2:16","ch":[4],"why":"這是華人信徒最常問、也最容易造成家庭衝突的一題。有人信主以後不回家過年、清明不去掃墓，家人覺得「信耶穌就不要祖宗了」；也有人把擇日、看風水、向祖先上香說成「只是習俗」。4:10 是新約直接講到「日子」的經文之一，講錯了，會叫人在家裡失去見證，或在信仰上失去分辨。","pos":[["【一】經文問的是甚麼","","<p>「你們謹守日子、月份、節期、年份」（4:10）。原文 <strong>ἡμέρας παρατηρεῖσθε καὶ μῆνας καὶ καιροὺς καὶ ἐνιαυτούς<\/strong>（hēmeras paratēreisthe kai mēnas kai kairous kai eniautous），παρατηρέω（paratēreō）是仔細守著、緊緊盯著。保羅指的是猶太的節期（安息日、月朔、逾越節），還是加拉太人歸信前的異教曆法？今天的基督徒，可以過聖誕節、春節、中秋、清明嗎？擇日、看時辰、看風水又怎麼看？<\/p>"],["一概禁止說（凡是有宗教淵源的節日都不過）","","<p>認為春節、中秋、清明、端午都和民間信仰、祭祀有關，連聖誕節也有異教的來源；4:10 既然責備「謹守日子」，基督徒就應該一概不過，以表明與世界分別，也免得軟弱的人跌倒。<\/p><p><strong>難處：<\/strong>保羅在別處說「有人看這日比那日強；有人看日日都是一樣。只是各人心裡要意見堅定」（羅 14:5），他責備的不是「有日子」，而是把日子當成稱義的條件。一概禁止容易變成另一套規條，也讓家人以為信耶穌就是不要家，把福音的門關在最親的人面前。<\/p>"],["一概放任說（都是文化，怎樣過都沒關係）","","<p>認為節慶是華人文化的一部分，祭祖是孝道，擇日、風水是生活智慧；基督徒在基督裡有自由，不必那麼緊張，入境隨俗就好，以免得罪家人、失去關係。<\/p><p><strong>難處：<\/strong>4:8--9 說得清楚，加拉太人從前是「給那些本來不是神的作奴僕」；向祖先求福、燒香、擇日看時辰，信靠的對象已經換了，不只是文化。把這些都叫作習俗，會讓信徒在最不安的時候，不知不覺又回到從前那位主人面前。<\/p>"],["分辨說（分辨的關鍵不是日子，是信靠誰）","","<p>認為要分開兩件事：<strong>文化的部分<\/strong>——春節團圓、向長輩拜年、中秋賞月、清明追思掃墓——基督徒可以參與，而且可以在裡面活出見證；<strong>信靠的部分<\/strong>——祭拜、燒香、向祖先求福、擇日看時辰、看風水——是給不是神的作奴僕，要溫和而清楚地不做。聖誕節、復活節可以過來記念主，也可以不過，但不可以拿來論斷人（西 2:16）。<\/p><p><strong>難處：<\/strong>分辨需要智慧，界線不總是一刀切得清楚，各家、各地的習俗也不同；初信者常常需要有人陪著，一次一次地想清楚，而不是領到一張清單。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採分辨說，照全卷立場三。<\/strong>保羅責備的是「照日子過才蒙神喜悅」的宗教，以及把日子當作掌管禍福的力量；他不是反對日曆本身。所以分辨的關鍵不是日子，是我在那一天信靠誰。<\/p><p>不一概妖魔化，也不一概放任。清明節不去掃墓，和清明節去掃墓、獻一束花、在墓前為家人禱告而不燒香，是兩種不同的見證；後者往往更能把福音帶進家裡。除夕回家吃團圓飯是孝敬，翻農民曆決定哪一天開刀，則要帶到主面前。本講義的全卷立場見議題「基督徒的自由：在律法主義與放縱之間」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。各教會在細節上的判斷可以不同，但有一件事各派都同意：<strong>基督是唯一的門，你在任何一天都是父的兒女。<\/strong>沒有一個日子可以讓你更蒙愛，也沒有一個日子可以讓你被詛咒。<\/p><p>如果你曾經因為不知道怎麼過節而和家人起衝突，不必自責。今年的節日，可以是你第一次試著用愛與尊重、同時又清楚地讓家人看見你信靠誰的機會。<\/p>"]],"con":[],"say":"本講義的立場：分辨的關鍵不是日子，是我在那一天信靠誰——春節團圓、中秋、清明追思是文化，可以參與並作見證；祭拜、燒香、向祖先求福、擇日、看風水是給本來不是神的作奴僕。不一概妖魔化，也不一概放任。本講義的全卷立場見議題「基督徒的自由：在律法主義與放縱之間」。","care":"會眾席上一定有人正在家裡為這件事受壓：父母說「你不拿香，就是不孝」，兄弟姊妹不再跟他說話；也有人當年處理得太硬，和家人鬧翻，到今天還在後悔。不要在台上嘲笑任何習俗，也不要用「你妥協了」責備人。會後陪他具體想下一個節日怎麼過：哪些可以做、哪一點溫和地不做、用甚麼行動表達孝敬；必要時願意陪他回家一趟。"},{"id":"ISS04_3","t":"4:13--15 保羅身上的「疾病」是甚麼？","r":"4:13--15；6:11；林後12:7；徒14:19","ch":[4],"why":"這幾節留下許多線索：身體有疾病、對加拉太人是一種試煉、他們沒有吐唾沫、願意把眼睛剜出來給他。讀者很自然想知道答案，也常把它和哥林多後書那根刺連起來。但這一題的意義不在破案，而在於：福音是從一個病人的口裡傳到加拉太的；今天教會怎樣看待生病的傳道人與信徒。","pos":[["【一】經文問的是甚麼","","<p>「你們知道我頭一次傳福音給你們，是因為身體有疾病」（4:13）。原文 <strong>διʼ ἀσθένειαν τῆς σαρκὸς<\/strong>（di' astheneian tēs sarkos）是 διά 加受格，表示原因：保羅是因為病，才在加拉太傳福音。第 14 節他們「沒有輕看我，也沒有厭棄我」，「厭棄」原文 <strong>ἐξεπτύσατε<\/strong>（exeptysate）是吐唾沫，古人看見病人或怕沾上「邪眼」時的避邪動作；第 15 節又說他們願意「把自己的眼睛剜出來給我」。那到底是甚麼病？<\/p>"],["眼疾說","","<p>理由是 4:15「把自己的眼睛剜出來給我」，以及 6:11 保羅說「請看我親手寫給你們的字是何等的大呢」——好像他看不清楚，只能寫大字；也有人連上大馬士革路上的強光（徒 9:8--9）。這是最普遍的讀法。<\/p><p><strong>難處：<\/strong>「把眼睛剜出來給我」很可能只是一句表達極深愛護的俗語，像我們說「把心掏出來給你」；寫大字也可以是為了強調。把兩條線索接成一個診斷，比經文本身走得更遠。<\/p>"],["瘧疾或熱病說","","<p>認為保羅與巴拿巴從潘非利亞的低地上到彼西底的安提阿（徒 13:13--14），那一帶沼澤多，瘧疾常見；染病的人會上高地養病，正好解釋他為甚麼「因為身體有疾病」改走加拉太。瘧疾發作時劇烈的頭痛，也與「刺」的畫面相合。<\/p><p><strong>難處：<\/strong>這是根據地理作出的推想，使徒行傳完全沒有提到保羅在那裡生病；而且「吐唾沫」較像是面對外表可怕的病，瘧疾不一定如此。<\/p>"],["癲癇或舊傷說","","<p>有人因「吐唾沫」的避邪習俗，認為是發作時令人害怕的癲癇；也有人認為是在路司得「用石頭打保羅，以為他是死了，便拖到城外」（徒 14:19）留下的傷，身上帶著明顯的傷痕與不便——這也使我們想起 6:17「我身上帶著耶穌的印記」。<\/p><p><strong>難處：<\/strong>癲癇說在古代與近代都常被用來貶低保羅的異象，說那只是發病；舊傷說則要看石頭事件是否在「頭一次傳福音」之前，年代上並不容易排定。<\/p>"],["【三】本講義站在哪裡","","<p><strong>經文沒有說，本講義不猜。<\/strong>各說都有理由，也都有難處；保羅寫這幾節，不是要留下病歷，而是要提醒加拉太人：你們當初是怎樣接待一個病人的，現在怎麼會把傳真理的人當成仇敵？<\/p><p>這一題真正的亮光是：<strong>福音在加拉太，是從一個病人的口裡傳開的。<\/strong>神沒有等保羅好了才用他；加拉太人也沒有因為他病，就把他當成被神咒詛的人，反倒「接待我，如同神的使者，如同基督耶穌」（4:14）。苦難與疾病的牧養立場，回指哥林多後書立場二；爭議與信心見議題「這些爭議該不該影響一個人的信心？」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。知道那是甚麼病，不會讓你更認識主；知道神怎樣使用一個生病的人，才會。<\/p><p>如果你正帶著病服事，或因為病不能像從前那樣服事，請你聽見：<strong>病不是你不夠格的證據。<\/strong>保羅在病中傳了福音，加拉太人在他的病中遇見了基督。你的軟弱，也可能正是別人遇見主的地方。<\/p>"]],"con":[],"say":"本講義的立場：保羅的疾病是甚麼，經文沒有說，本講義不猜；福音在加拉太是從一個病人的口裡傳開的。苦難與疾病回指哥林多後書立場二，本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上可能有人因為長期病痛不能再服事，覺得自己被神放在一邊；也可能有人的病外表看得出來，曾經被人避開、被人用異樣眼光看。不要說「保羅的病是神的管教」，也不要說「有信心的人不會病」。會後單獨關心，不追問病情細節，問他：教會可以怎樣具體地接待你、和你一起服事？並鼓勵他繼續接受治療。"},{"id":"ISS04_4","t":"4:19「直等到基督成形在你們心裡」——成聖是一生的過程嗎？","r":"4:19--20；4:7；羅8:29；林後3:18","ch":[4],"why":"同一章裡，4:7 說「從此以後，你不是奴僕，乃是兒子了」，像是一次完成；4:19 卻說保羅要「再受生產之苦，直等到基督成形」，像是還沒完成。信徒常在這兩句之間擺盪：既然已經是兒子，為甚麼我還這麼不像？是不是還沒真正得救？這一題關乎人怎樣面對自己的反覆，也關乎教會怎樣陪人成長。","pos":[["【一】經文問的是甚麼","","<p>「我小子啊，我為你們再受生產之苦，直等到基督成形在你們心裡」（4:19）。<strong>ὠδίνω<\/strong>（ōdinō）是產婦陣痛，前面有 <strong>πάλιν<\/strong>（palin）「再一次」；<strong>μορφωθῇ<\/strong>（morphōthē）是被動假設語氣，「被塑成形狀」，和基督「取了奴僕的形像」（腓 2:7）是同一個字族。問題是：基督在信徒裡面成形，是一次完成的事，還是一生的過程？它和 4:7 那一次的宣告是甚麼關係？<\/p>"],["完全成聖說（第二次的恩典經歷）","","<p>衛斯理傳統與聖潔運動的一些教會認為，信徒在稱義之後，可以經歷第二次明確的恩典，使心中的動機被愛完全潔淨，稱為「完全成聖」或「完全的愛」；基督成形可以在一個時刻達到一種完全。<\/p><p><strong>難處：<\/strong>4:19 的語氣正好相反：保羅是對已經信主、甚至經歷過聖靈的人說「再」受生產之苦，表示成形會反覆、會倒退。若把成聖講成一次可以抵達的境界，沒有抵達的人容易灰心，抵達了的人容易驕傲。<\/p>"],["漸進成聖說（一生的成長）","","<p>改革宗與多數福音派認為，成聖是聖靈在信徒一生中持續的工作：「效法他兒子的模樣」（羅 8:29）是神的目標，我們「變成主的形狀，榮上加榮」（林後 3:18），直到見主的面才完全。4:19 的陣痛、「直等到」，都指向一段時間。<\/p><p><strong>難處：<\/strong>若只講漸進，信徒容易把成長當成另一張成績單，焦慮自己長得不夠快；也容易忘了在基督裡已經成就、不再改變的身分。<\/p>"],["身分與成形兩面說","","<p>認為新約同時講兩件事：在地位上，信徒已經被分別為聖、已經是兒子（4:7；林前 6:11）；在經歷上，基督要在他裡面一天一天成形（4:19）。前者是一次的宣告，後者是一生的懷胎；後者從前者長出來，不是用來換取前者。<\/p><p><strong>難處：<\/strong>這個讀法要求講台同時把兩面講清楚，稍一偏，就會變成「身分已定，所以怎樣都好」，或「要長得夠好，身分才算數」。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採身分與成形兩面說，以漸進成聖為主要框架。<\/strong>4:7 和合本沒有「再」字：「從此以後，你不是奴僕」——身分是宣告，不是進度；4:19 卻用了「再」：成形是懷胎，要時間，有陣痛，也會反覆。身分不靠成長換來，成長是從身分裡長出來的。<\/p><p>而且 μορφωθῇ 是被動：<strong>成形是神作的，保羅只能陣痛。<\/strong>屬靈父母、牧者、小組長的工作，是陪伴、禱告、說真話、等候，不是把人塑成自己的樣子。本講義的全卷立場見議題「律法、稱義與『因信』」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>如果你發現自己信主多年，還在同一個地方跌倒，請你不要把這當成「我大概不是真的兒子」。加拉太人也走回頭路，保羅沒有說「你們不是我的孩子了」，他說「我小子啊」。<\/p><p>基督在你裡面成形，像胎兒在母腹中長出樣子：從外面看不出每天的變化，卻一直在長。你可以為自己的慢而難過，但不必為它害怕。<\/p>"]],"con":[],"say":"本講義的立場：身分是一次的宣告（4:7），成形是一生的懷胎（4:19）；成長從身分裡長出來，不是用來換取身分，而且成形是神作的，人只能陪伴與陣痛。本講義的全卷立場見議題「律法、稱義與『因信』」。","care":"會眾席上可能有人信主很多年，仍然在某一個罪或習慣裡反覆，暗暗懷疑自己是否得救；也可能有一位父母或組長，為走遠的孩子痛得不知道怎麼辦。不要說「你信了這麼久還這樣」，也不要對屬靈父母說「是你沒帶好」。陪前者回到 4:7 的宣告，陪後者把 4:20「心裡作難」說出來；陪伴人的人，自己也需要被陪伴。"},{"id":"ISS04_5","t":"4:21--31 夏甲與撒拉的「比方」——寓意解經可以用嗎？","r":"4:21--27；4:24；林前10:4；林前10:11","ch":[4],"why":"保羅明說「這都是比方」，是全本新約唯一一處自己標明在用寓意法的經文。教會歷史上，寓意解經曾經讓人在任何經文裡讀出任何意思；今天也有講員說「保羅可以這樣讀，我們也可以」。這一題關乎我們怎樣讀這一段，也關乎我們怎樣讀整本聖經。","pos":[["【一】經文問的是甚麼","","<p>「這都是比方：那兩個婦人就是兩約」（4:24）。原文 <strong>ἅτινά ἐστιν ἀλληγορούμενα<\/strong>（hatina estin allēgoroumena），ἀλληγορέω（allēgoreō）是「說的是一件事，指的是另一件事」。保羅把夏甲與西奈山、現在的耶路撒冷排在一欄，把撒拉與應許、在上的耶路撒冷排在另一欄。問題是：保羅在用的是寓意法，還是預表法？我們今天可以照這個方法讀別的經文嗎？<\/p>"],["全面寓意說（亞歷山大學派的傳統）","","<p>古代亞歷山大的猶太學者斐羅，與後來的教父俄利根，認為經文有字面的意思，也有更深的屬靈意思；既然保羅自己這樣讀創世記，就表示寓意法是正當的讀經方法，可以在經文的細節裡找出基督、教會與靈魂的奧祕。<\/p><p><strong>難處：<\/strong>這個方法沒有外在的檢驗——同一段經文，不同的人可以讀出完全不同的寓意，最後是讀者決定經文說甚麼，而不是經文決定讀者聽甚麼。宗教改革特別強調回到經文的字面與上下文，正是為了修正這個問題。<\/p>"],["只是預表說（保羅用的其實是預表，不是寓意）","","<p>認為保羅並沒有否認夏甲與撒拉是歷史人物，也沒有在故事的每一個細節裡找隱藏意思；他是看見舊約歷史與基督裡的現實之間的對應，這比較接近預表法（參林前 10:11「這些事發生在他們身上，都要作為鑑戒」）。所以這一段不算寓意解經。<\/p><p><strong>難處：<\/strong>保羅自己用了 ἀλληγορέω 這個字，而且「夏甲就是西奈山」「與現在的耶路撒冷同類」確實超出了一般的預表對應；說他「其實不是寓意」，有一點是在替保羅迴避他自己的用詞。<\/p>"],["有限使用說（照保羅講滿，不推到別處）","","<p>認為保羅確實用了寓意式的比方，但這是在他所領受的啟示權柄下、針對加拉太的處境、用對手最熟悉的方式作的論證；而且他的比方仍然錨定在創世記的歷史與他整封信的福音論證上。今天的讀者可以照保羅的比方講，但不能把這當成任意讀經的授權。<\/p><p><strong>難處：<\/strong>這個立場要求講員清楚劃界：在 4:21--31 講滿，到別的經文就停；實際講道時，界線不容易守，聽眾也可能問：為甚麼保羅可以，我們不行？<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採有限使用說（企劃書 4.7 丁）。<\/strong>保羅自己標明「這都是比方」，這是新約自己作的連結，所以 4:21--31 照他的比方講滿：兩個婦人、兩個約、兩種出生方式（按血氣／憑應許）。<\/p><p>但保羅用了一次，不等於授權我們到處用。他的比方有三條錨：創世記的歷史、他在第 3 章已經完成的論證、以及基督的十字架。我們讀別的經文，仍然照上下文、文體與作者的意思讀。爭議與信心見議題「這些爭議該不該影響一個人的信心？」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論學者把保羅的方法叫作寓意還是預表，他要說的話是清楚的：「我們不是使女的兒女，乃是自主婦人的兒女了」（4:31）。這一點不需要任何特別的讀經方法就讀得出來。<\/p><p>如果你曾經聽過一些令人眼花撩亂的「屬靈解經」，覺得自己永遠讀不懂聖經，請放心：聖經不是一本只有少數人才解得開的密碼書。照著上下文好好讀，聖靈會帶你看見基督。<\/p>"]],"con":[],"say":"本講義的立場：4:21--31 是保羅自己標明的「比方」，照他的比方講滿——比的是兩個約、兩種出生方式；但不把這個方法推到別的經文。本講義體例見企劃書 4.7 丁，全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上可能有人曾經在某個團體裡，被一位講員用「只有我看得懂的屬靈意思」帶著走，後來受了傷；也可能有人因此對讀經失去信心。不要嘲笑任何讀經傳統，也不要讓會眾覺得解經只屬於專家。會後若有人說起從前的經歷，先聽他說，再陪他一起照上下文讀一段經文，讓他重新嘗到自己讀經的喜樂。"},{"id":"ISS04_6","t":"4:25、30「夏甲……指著阿拉伯的西奈山」「把使女和她兒子趕出去」——是在講阿拉伯人或猶太人嗎？","r":"4:24--31；羅11:1--2；創16:13；創21:17","ch":[4],"why":"4:25 出現「阿拉伯」，4:30 出現「趕出去」，又說「現在的耶路撒冷……都是為奴的」。這幾句在歷史上曾被拿來講成對阿拉伯人、穆斯林或猶太人的定罪，今天的中東新聞也常讓講台忍不住對號入座。這一題講錯了，福音會變成仇恨的理由；講對了，會眾會看見神看顧每一個民族。","pos":[["【一】經文問的是甚麼","","<p>「這夏甲二字是指著阿拉伯的西奈山，與現在的耶路撒冷同類，因耶路撒冷和她的兒女都是為奴的」（4:25）。<strong>συστοιχεῖ<\/strong>（systoichei）是「排在同一欄」，和 4:3 的 στοιχεῖα（stoicheia）同字根。4:30 引創 21:10：「把使女和她兒子趕出去！」問題是：保羅的兩欄，是在把民族分類嗎？「阿拉伯」是在指以實瑪利的後裔，「現在的耶路撒冷」是在指整個猶太民族嗎？<\/p>"],["民族解讀說（夏甲代表阿拉伯人，撒拉代表猶太人或教會）","","<p>認為既然以實瑪利傳統上被視為阿拉伯人的祖先，4:25 又提到阿拉伯，保羅就是在說阿拉伯民族在應許之外；後來有人再把這一欄延伸到穆斯林，說他們是「使女的兒女」，不能承受產業。<\/p><p><strong>難處：<\/strong>這和保羅的比方正好顛倒。在他的兩欄裡，夏甲對應的是「現在的耶路撒冷」——那些要外邦人受割禮的人，不是阿拉伯人；「阿拉伯」只是西奈山所在的地理位置（參 1:17）。而且創世記裡，神親自看顧夏甲與她的兒子（創 16:13；21:17）。<\/p>"],["取代輕看說（猶太人被棄絕，教會取代以色列）","","<p>認為「現在的耶路撒冷……都是為奴的」與「趕出去」表示整個猶太民族已經被神棄絕，教會完全取代了以色列；教會歷史上，這種讀法曾經被用來合理化對猶太人的輕看、隔離甚至迫害。<\/p><p><strong>難處：<\/strong>保羅自己是「生來的猶太人」（2:15），他在羅馬書明說「神並沒有棄絕他預先所知道的百姓」（羅 11:2）；加拉太書的對手也不是整個猶太民族，而是一群要外邦信徒受割禮的教會內部教師。把比方讀成民族判決，違背保羅自己的話。<\/p>"],["兩約兩出生說（比的是兩種出生方式，不是兩個民族）","","<p>認為保羅從頭到尾比的是兩個約、兩種出生方式：一種「按著血氣」，靠人自己的力氣與計畫；一種「憑著應許」，是神在不可能之處作成的。「現在的耶路撒冷」指的是那一套要外邦人受割禮才算數的宗教體系；要「趕出去」的，是在教會裡和福音同坐的「再加上」那一套。<\/p><p><strong>難處：<\/strong>這個讀法要求講員在情緒上很節制，也要多花時間解釋背景；在中東衝突的新聞底下，會眾很難不對號入座，講員必須主動把那條線切斷。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採兩約兩出生說，照全卷立場四與紅線三。<\/strong>保羅比的是兩個約、兩種出生方式，不是兩個民族；在他的比方裡，夏甲對應的是「現在的耶路撒冷」——那些要外邦人受割禮的人。4:21--31 絕不講成對阿拉伯人、穆斯林或猶太人的定罪。<\/p><p><strong>夏甲本人不是反派。<\/strong>她是被安排、被使用、後來被趕出去的使女，卻是給神起名字的人：「看顧人的神」（創 16:13）。比方裡她代表一個約；創世記裡，神始終看顧她。這兩件事要一起講（互見本系列創世記講義第 16、21 章）。本講義的全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。這一段要你確定的，是你自己的出生方式：你是憑應許、靠聖靈生的，「我們不是使女的兒女，乃是自主婦人的兒女了」（4:31）。它不是要你去判斷別的民族。<\/p><p>神看顧夏甲，也看顧以實瑪利；神沒有棄絕祂的百姓，也把外邦人帶進同一個家。一個知道自己是憑恩典出生的人，對任何一個民族，都只有一種態度：渴望他們也遇見那位看顧人的神。<\/p>"]],"con":[],"say":"本講義的立場：4:21--31 比的是兩個約、兩種出生方式，不是兩個民族；夏甲對應「現在的耶路撒冷」——要外邦人受割禮的那一套，不是阿拉伯人、穆斯林或猶太人；夏甲本人不是反派。本講義的全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」。","care":"會眾席上可能有阿拉伯裔、猶太裔或穆斯林背景的朋友，也可能有人家裡有穆斯林親人、同事或鄰居；也可能有一位曾被利用、被拋棄的婦女，聽到「趕出去」就想起自己。講台上絕不拿這一段評論中東時局，不給任何民族貼標籤。會後若有人受傷，先道歉、先聽；陪那位婦女讀創 16:13，讓她知道神也是看顧她的神。"},{"id":"ISS04_7","t":"4:4--6「阿爸！父！」——兒子的名分怎樣成為得救的確據？","r":"4:4--7；羅8:15--16；約壹5:13","ch":[4],"why":"許多信徒反覆問：我怎麼知道自己真的得救了？有人靠一次強烈的感受，感受淡了就懷疑；有人看自己的表現，表現差了就害怕；也有人被告訴「你若真得救，就一定會怎樣怎樣」。4:4--6 是新約講確據最溫暖的經文之一，講得好，能把人從懷疑裡帶出來；講錯了，反而叫人更不安。","pos":[["【一】經文問的是甚麼","","<p>「你們既為兒子，神就差他兒子的靈進入你們的心，呼叫：『阿爸！父！』」（4:6）。第 4 節與第 6 節用同一個動詞 <strong>ἐξαπέστειλεν<\/strong>（exapesteilen）：神差出兒子，神又差出兒子的靈。<strong>τὴν υἱοθεσίαν<\/strong>（tēn huiothesian）是羅馬法的收養；<strong>κρᾶζον<\/strong>（krazon）是中性分詞，呼叫的主詞是那靈。問題是：信徒得救的確據，根據在哪裡？是神的應許、聖靈的內證，還是生命的果子？<\/p>"],["內在見證說（確據主要來自聖靈在心裡的感動）","","<p>認為 4:6 與羅 8:16「聖靈與我們的心同證我們是神的兒女」說的是一種內在的、可以經歷的確知；信徒在禱告中呼叫「阿爸」時那份親近與平安，就是得救的記號。敬虔運動與許多靈恩傳統都重視這一面。<\/p><p><strong>難處：<\/strong>感受會起伏，憂鬱、疲倦、失落的時候，那份平安可能感覺不到；若確據只建立在感受上，最需要安慰的時候，人反而最沒有把握。<\/p>"],["應許客觀說（確據主要來自神的話與基督已成的工作）","","<p>認為確據的根基在信徒以外：神已經差遣兒子、兒子已經在十字架上把人贖出來，神的話也已經宣告「你不是奴僕，乃是兒子了」（4:7）。約翰說「我將這些話寫給你們……要叫你們知道自己有永生」（約壹 5:13）——確據是讀出來、信進去的。宗教改革傳統特別重視這一面。<\/p><p><strong>難處：<\/strong>若只講客觀的應許，容易變成理智上的同意，缺少聖靈在心裡的親密；4:6 明明說那靈進入「心」裡呼叫，不只是腦子裡知道。<\/p>"],["生命果子說（確據來自生命改變的證據）","","<p>清教徒傳統常用「實踐的推論」：真信心必然結出果子，所以察看自己是否愛神、愛弟兄、恨惡罪，可以幫助人確定自己是否真的重生（參約壹 3:14）。<\/p><p><strong>難處：<\/strong>若把果子當成主要根據，敏感的人會無止境地檢查自己，永遠覺得不夠；這正好把人推回 4:9 那種「照表現確定位置」的奴僕姿勢。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義認為三者都有，但有次序：<\/strong>先是神的宣告與差遣（客觀），然後是聖靈在心裡呼叫（內在），果子是印證，不是條件。4:6 的次序很清楚：「你們既為兒子」在前，「神就差他兒子的靈」在後——不是你叫得夠大聲才成為兒子，是你已經是兒子，那靈才在你裡面叫。<\/p><p>而且呼叫的主詞是那靈。在羅 8:15 是「我們呼叫」，在加 4:6 是靈在呼叫；兩處合起來，是靈在我們裡面、我們用自己的口一同呼叫。確據的錨在父的宣告上，不在我們叫得順不順。本講義的全卷立場見議題「律法、稱義與『因信』」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>如果你今天感覺不到神，請你聽見：4:7 沒有說「你若感覺得到，就不是奴僕」，它說「從此以後，你不是奴僕，乃是兒子了」（4:7）。宣告比感覺早，也比感覺長。<\/p><p>如果「阿爸」兩個字你很難叫出口，那也不是你沒有得救的證據。有時候那一聲只是一聲嘆息，那靈仍然在你裡面替你呼叫。<\/p>"]],"con":[],"say":"本講義的立場：得救的確據有次序——先是神的宣告與差遣，然後是聖靈在心裡呼叫「阿爸！父！」，果子是印證不是條件；確據的錨在父的宣告上，不在我們的感受或表現。本講義的全卷立場見議題「律法、稱義與『因信』」。","care":"會眾席上可能有人正在憂鬱或長期的低潮裡，感覺不到神，暗暗害怕自己沒有得救；也可能有人和父親的關係很痛，「阿爸」兩個字會勾起傷口。絕不說「你沒有感覺，就是沒有得救」，也不要求他先原諒父親才能親近神。會後單獨關心，陪他讀 4:7；若低潮持續很久、影響睡眠與生活，溫和地鼓勵他尋求專業協助。"},{"id":"ISS04_8","t":"4:4「及至時候滿足」「為女子所生」——是在講童女生子嗎？「時候滿足」又是甚麼時候？","r":"4:4；伯14:1；太1:23；可1:15","ch":[4],"why":"4:4 是保羅書信裡最接近「聖誕」的一節，常在聖誕節被引用。有人說這一節證明保羅知道童女生子，也有人說保羅在這裡完全沒有提到童女，可見他不知道或不在乎。「時候滿足」也常被講成羅馬的道路、希臘的語言已經預備好。這一題關乎我們怎樣讀這一節的重心，也關乎會眾對聖經一致性的信心。","pos":[["【一】經文問的是甚麼","","<p>「及至時候滿足，神就差遣他的兒子，為女子所生，且生在律法以下」（4:4）。<strong>τὸ πλήρωμα τοῦ χρόνου<\/strong>（to plērōma tou chronou）是「時間的滿足」，像一個容器裝滿了；<strong>γενόμενον ἐκ γυναικός<\/strong>（genomenon ek gynaikos）是「從一個女子而生」。問題有兩個：「為女子所生」是在講童女生子，還是在講真實的人性？「時候滿足」是指歷史條件的成熟，還是神主權的時刻？<\/p>"],["童女生子暗示說","","<p>認為保羅只提「女子」、沒有提父親，又用 γενόμενον（genomenon）而不用一般表示「生」的 γεννάω，可能是刻意避開人間的父親，與馬太、路加的童女生子記載相合（太 1:23）。<\/p><p><strong>難處：<\/strong>「為婦人所生」是猶太人描述一般人的慣用語，約伯記說「人為婦人所生」（伯 14:1）；而 γενόμενον 這個字，保羅在同一節「生在律法以下」也用，在羅 1:3 講基督「從大衛後裔生的」也用。把這一節當作童女生子的主要證據，比經文本身走得更遠。<\/p>"],["真實人性說","","<p>認為「為女子所生，且生在律法以下」兩句是平行的：前一句說兒子真正成為人，後一句說祂真正進入以色列人在律法下的處境。保羅的重點不在出生的方式，而在兒子走到了我們站的位置——這正是 4:5「要把律法以下的人贖出來」的前提。<\/p><p><strong>難處：<\/strong>這個讀法本身沒有問題，但若因此說「保羅不知道或否認童女生子」，就是用沉默作論證；一位作者在一處沒有提，不等於他不相信。<\/p>"],["時候滿足的兩種讀法","","<p>一種讀法強調歷史條件：羅馬的和平與道路、通行的希臘文、散居各地的猶太會堂，使福音得以迅速傳開；另一種強調神的主權：這個詞正對應 4:2「他父親預定的時候」，是父親定的日子到了，不是世界自己成熟了（參可 1:15「日期滿了」）。<\/p><p><strong>難處：<\/strong>歷史條件的讀法容易把「時候滿足」講成一堂古代史，忘了保羅的比喻是父親與孩子；主權的讀法若講得太抽象，又會失去神在真實歷史裡作工的具體感。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義以「真實人性」為這一節的重心：<\/strong>兒子為女子所生、生在律法以下，走進我們的處境，好把我們贖出來。這一節不作童女生子的主要證據，但與馬太、路加的記載完全相合；本講義相信童女生子，根據的是福音書的明文。<\/p><p>「時候滿足」以神的主權為主：它接續 4:2 的「父親預定的時候」，是父親定的日子到了；神也確實在真實的歷史條件裡成就這件事。爭議與信心見議題「這些爭議該不該影響一個人的信心？」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論這一節有沒有直接講童女生子，它清楚告訴我們一件更大的事：神沒有在天上下一道命令，而是差祂的兒子親自進來。祂被一個女子懷在腹中，第八天受割禮，活在律法底下。<\/p><p>如果你覺得自己的等候太長，請想起「時候滿足」：父親定的日子，從來沒有遲到過。<\/p>"]],"con":[],"say":"本講義的立場：4:4 的重心是兒子真實的人性與生在律法以下，好把我們贖出來；它不作童女生子的主要證據，但與福音書的明文完全相合；「時候滿足」是父親預定的日子到了。本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上可能有人讀過一些質疑童女生子或聖經一致性的文章，心裡不安卻不敢問；也可能有人正在一段很長的等候裡——等孩子、等工作、等醫治，聽到「時候滿足」反而更痛。不要嘲笑提問的人，也不要對等候中的人說「時候到了自然會有」。會後歡迎他把問題帶來，一起讀經；陪等候的人禱告，承認等候是真的難。"},{"id":"ISS04_9","t":"4:6、4:28 和合本作「你們的心」「我們」，原文卻是「我們的心」「你們」？","r":"4:6；4:28","ch":[4],"why":"細心比對原文的讀者會發現：4:6 和合本作「進入你們的心」，SBLGNT 作「我們的心」，和合本自己的小字註也說「原文是我們」；4:28 和合本作「我們是憑著應許作兒女」，SBLGNT 卻作「你們」。一章之內兩處人稱相反，容易讓人懷疑：譯本可靠嗎？原文到底是甚麼？","pos":[["【一】經文問的是甚麼","","<p>4:6 SBLGNT 作 <strong>εἰς τὰς καρδίας ἡμῶν<\/strong>（eis tas kardias hēmōn），「進入我們的心」；拜占庭傳統（RP）作 ὑμῶν（hymōn，你們），和合本正文作「你們的心」，註腳說「原文是我們」。4:28 SBLGNT 作 <strong>ὑμεῖς δέ, ἀδελφοί, κατὰ Ἰσαὰκ ἐπαγγελίας τέκνα ἐστέ<\/strong>（hymeis de, adelphoi, kata Isaak epangelias tekna este），「你們是」；WH 與 RP 作 ἡμεῖς……ἐσμέν（hēmeis……esmen，我們是），和合本照後者作「我們」。同一章之內，兩處人稱正好一來一往，譯本與原文各應該怎麼讀？這樣的差異又該怎樣看待？<\/p>"],["和合本讀法（4:6「你們」、4:28「我們」）","","<p>4:6 作「你們」，和前半句「你們既為兒子」一致，句子讀起來最順；4:28 作「我們」，和 4:26「她是我們的母」、4:31「我們不是使女的兒女」一致，整段比方都用第一人稱複數收尾。拜占庭傳統的大量抄本支持這樣的讀法。<\/p><p><strong>難處：<\/strong>正因為讀起來最順，抄寫的人很可能把人稱順手改成和上下文一致；按抄本學的一般原則，比較不順、比較難的讀法較可能是原始的。<\/p>"],["SBLGNT 讀法（4:6「我們」、4:28「你們」）","","<p>4:6 的「我們」有幾份最早的重要抄本支持：保羅在「你們既為兒子」之後，忽然改成「我們的心」，把自己也放進去——那靈在外邦信徒心裡呼叫，也在他這個生來的猶太人心裡呼叫。4:28 的「你們」則是保羅轉頭直接對加拉太人說：你們，就是憑應許生的兒女。<\/p><p><strong>難處：<\/strong>兩處的抄本證據都不是一面倒，學者之間仍有爭論；而且人稱的突然轉換讀起來比較跳，一般讀者若不知道背景，可能覺得混亂。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義解經照 SBLGNT（4:6「我們」、4:28「你們」），同時肯定和合本的譯法。<\/strong>和合本在 4:6 已經用註腳交代「原文是我們」，是誠實而負責的作法。<\/p><p>兩種讀法的意思沒有衝突：那靈在每一位信徒心裡呼叫「阿爸」，猶太人與外邦人都包括在內；憑應許作兒女的，就是加拉太的信徒，也是我們。SBLGNT 讀法多給的一層亮光是：<strong>保羅把自己放進「我們」裡，又把加拉太人推到「你們」的前面<\/strong>——他與他們同站在恩典底下，又要他們親耳聽見這一句是對他們說的。爭議與信心見議題「這些爭議該不該影響一個人的信心？」。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。這是人稱代名詞的差別，不影響這兩節的意思，更不影響任何一條教義。正因為新約抄本數量極多，學者才看得見、也比較得了這些細微的差異；和合本把它註明出來，正是要讀者放心。<\/p><p>看見不同讀法時，可以問：兩種讀法共同要我看見甚麼？在這裡，它們都說：<strong>那靈在你心裡，你是憑應許生的兒女。<\/strong><\/p>"]],"con":[],"say":"本講義的立場：本講義解經照 SBLGNT（4:6「我們的心」、4:28「你們」），同時肯定和合本的譯法與註腳；這是不影響任何教義的抄本差異，兩種讀法都說那靈在信徒心裡、我們是憑應許生的兒女。本講義的全卷立場見議題「這些爭議該不該影響一個人的信心？」。","care":"第一次發現譯本和原文有差異的人，常常會很震驚，甚至懷疑聖經是否可靠；也有人因此覺得只有懂原文的人才讀得懂聖經。不要在台上嘲笑和合本，也不要把抄本學講成只有專家才懂的事。會後歡迎他把問題帶來，陪他看和合本自己的註腳，讓他知道誠實地面對差異，正是對聖經的尊重。"},{"id":"ISS05_1","t":"5:2--4「基督就與你們無益了」「從恩典中墜落了」——基督徒會失去救恩嗎？","r":"5:2--4；6:1；約10:29；來6:4--6","ch":[5],"why":"「從恩典中墜落」是新約裡最常被拿來嚇人的一句話之一。有人讀了整夜睡不著，怕自己某一次的軟弱已經讓他掉出恩典；也有人拿它來威脅別人：你再這樣，就會失去救恩。這一題關乎得救的確據，也關乎講台會不會把恩典講成恐嚇。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「你們這要靠律法稱義的，是與基督隔絕，從恩典中墜落了。」（5:4）<strong>κατηργήθητε ἀπὸ Χριστοῦ<\/strong>（katērgēthēte apo Christou）是「與基督斷了聯繫」；<strong>τῆς χάριτος ἐξεπέσατε<\/strong>（tēs charitos exepesate）的動詞是船被風沖離航道。經文的主詞是「要靠律法稱義的」：墜落的方向是從恩典偏到律法。問題是：真正重生的人，有沒有可能這樣離開而失去救恩？<\/p>"],["蒙保守說（加爾文派：真信徒終必蒙保守）","","<p>認為神所揀選、所重生的人，神必保守到底：「誰也不能從我父手裏把他們奪去」（約 10:29）。這類警告不是說真信徒會失去救恩，而是神保守人的方法之一——神藉著警告叫他的兒女停下來、回頭。若有人徹底離開恩典而不回頭，顯明他從來沒有真正歸入基督。<\/p><p><strong>難處：<\/strong>這個說法容易讓人反過來懷疑「我是不是根本沒有得救」；而且若警告的對象不可能墜落，警告的分量要怎樣保留，需要很小心地講。<\/p>"],["可能離棄說（阿民念派：人可以持續棄絕恩典）","","<p>認為神的恩典是真實地賜給人，人也真實地可以回應或拒絕；一個真正信過的人，若持續、刻意地離開基督，轉去靠別的得救，確實可能失去救恩。他們引用本節與希伯來書「若是離棄道理」的警告（來 6:6），認為這些警告是說給真信徒聽的。<\/p><p><strong>難處：<\/strong>這個說法講不好，很容易讓敏感的信徒天天量自己有沒有「掉下去」，把得救變成要自己守住的成績，反倒違背了本章「不靠律法」的重點。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義兩派並陳，不在本章裁決。<\/strong>兩派都是敬重聖經的福音派，而且都同意三件事：一、這一節的墜落，是轉去靠律法稱義，不是犯了一個罪、軟弱了一次就掉下去；二、這是警告，目的是叫人回頭，不是宣判；三、回來的路就是回到恩典。<\/p><p>所以講台上可以講滿這一節的分量，卻不可以把它講成恐嚇。它真正要嚇醒的，是那些以為自己做得夠好、想在基督之外「加碼」的人。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你恐慌。如果你今天很怕自己已經掉出恩典，這份怕本身，常常就是你還在乎主的記號。恩典從來不靠你抓得多緊，靠的是那位召你的；保羅說他「在主裡很信你們」（5:10），他的把握在主，不在加拉太人的表現。<\/p><p>你能做的，不是更用力地證明自己沒掉下去，而是今天就回到基督面前，再一次單單信靠他。<\/p>"]],"con":[],"say":"本講義的立場：5:4 的「墜落」是離開恩典去靠律法稱義，不是一次跌倒；會不會失去救恩，加爾文派與阿民念派並陳，兩派都同意回來的路就是回到恩典。本講義的全卷立場見議題「律法、稱義與『因信』」、議題「這些爭議該不該影響一個人的信心？」。","care":"會眾席上一定有天生很敏感、很容易自責的人，也可能有正在憂鬱或焦慮中的人，一聽到「墜落」就整夜失眠。講台上不用這一節威脅任何人，也不說「你一定是沒有真正得救」。會後若有人來談，先問他怕的是甚麼、怕了多久，陪他一起讀 5:5「等候所盼望的義」；若焦慮已經影響睡眠和生活，溫和地建議他也尋求專業協助。"},{"id":"ISS05_2","t":"5:6「使人生發仁愛的信心」——信心與行為：加拉太書與雅各書衝突嗎？","r":"5:5--6；雅2:17；雅2:24；弗2:8--10","ch":[5],"why":"保羅說人稱義不靠行律法，雅各卻說「人稱義是因着行為，不是單因着信」。宗教改革時，路德一度稱雅各書為「稻草的書信」；今天也有信徒困惑：到底要不要行為？這一題不處理，會眾很容易落到兩頭——不是「行為不重要」，就是「行為才算數」。","pos":[["【一】經文問的是甚麼","","<p>保羅說：「惟獨使人生發仁愛的信心才有功效。」（5:6）原文 <strong>πίστις διʼ ἀγάπης ἐνεργουμένη<\/strong>（pistis di' agapēs energoumenē）是「藉著愛運作的信」。雅各卻說：「信心若沒有行為就是死的。」（雅 2:17）問題是：兩位使徒是在講兩個福音，還是同一個福音的兩面？愛與行為，是稱義的條件，還是稱義的果子？<\/p>"],["愛是稱義的一部分（中世紀「被愛成形的信」）","","<p>中世紀神學把 ἐνεργουμένη（energoumenē）讀作被動：「被愛所成形的信」，認為光有信心不足以稱義，信心要被愛充滿、成形，才是使人稱義的信心；所以愛與善行是稱義的一部分。<\/p><p><strong>難處：<\/strong>這樣讀，與本章前後文正好相反：保羅剛說「受割禮不受割禮全無功效」，目的就是拆掉在信心之外加上的條件；若把愛當作稱義的條件，等於把割禮換成另一個名字放回去。而多數文法學者也認為這個分詞是中間語態，信心自己在運作。<\/p>"],["兩人講兩件事（處境不同、用詞不同）","","<p>認為保羅與雅各對付的是相反的危險：保羅對付的是「信耶穌再加上割禮才算數」，雅各對付的是「我有信心，行為無所謂」。保羅的「行律法」指割禮、節期這類身分記號，雅各的「行為」指信心活出來的憐憫與順服；兩人的「稱義」也一個指在神面前被宣告為義，一個指在人面前被證明為真。<\/p><p><strong>難處：<\/strong>這個說法解釋力很強，但若說得太簡單，容易讓人覺得兩卷書各說各話，看不見它們其實在同一個福音裡彼此需要。<\/p>"],["同一棵樹的根與果（宗教改革的讀法）","","<p>認為人單單因信稱義，這信心卻從來不是孤單的，它必然藉著愛活出來。以弗所書把兩者放在一起：「你們得救是本乎恩，也因着信」（弗 2:8），接著說「我們原是他的工作，在基督耶穌裏造成的，為要叫我們行善」（弗 2:10）。根是信，果是愛。<\/p><p><strong>難處：<\/strong>「必然結果」這句話講得不好，會讓人反過來用自己的行為量自己有沒有得救，又落回焦慮；需要同時講清楚果子是慢慢長的，不是一夜之間的成績單。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在宗教改革的底線：稱義是神白白的恩典，單單因信，不靠行律法；<\/strong>同時接受「兩人處境不同」的提醒。5:6 的愛不是信心的根基，是信心的出口；雅各與保羅都在防一件事：假的信心。保羅防的是加上條件的信心，雅各防的是不結果子的信心。<\/p><p>所以「我信主了，行為無所謂」這一節不答應；「你愛得不夠，所以還不算得救」這一節也不答應。<\/p>"]],"con":[],"say":"本講義的立場：人單單因信稱義；真信心必藉著愛活出來，愛是信心的果子，不是稱義的條件。保羅防加上條件的信心，雅各防不結果子的信心。本講義的全卷立場見議題「律法、稱義與『因信』」。","care":"有些人從小在「表現好才被愛」的家庭長大，聽到「信心要生出愛」立刻變成新的壓力；也有人聽了「單單因信」就鬆了一口氣，卻把它當作不必改變的理由。講台上兩邊都要照顧：先講恩典，再講果子。不要對一位正在掙扎的人說「你的行為證明你沒有信心」；陪他看見自己身上已經長出來的一點點愛，那也是聖靈的工作。"},{"id":"ISS05_3","t":"5:12「恨不得那攪亂你們的人把自己割絕了」——保羅可以說這麼重的話嗎？","r":"5:11--12；申23:1；太23:33","ch":[5],"why":"這可能是保羅書信裡最刺耳的一句話，有些譯本甚至譯得更直白。讀者會問：一位使徒怎麼可以這樣說話？更實際的問題是，有人拿這一節替今天在講台上、網路上辱罵意見不同的人辯護。這一題關乎保羅的品格，也關乎教會怎樣面對錯誤教導，而不變成相咬相吞。","pos":[["【一】經文問的是甚麼","","<p>「恨不得那攪亂你們的人把自己割絕了。」（5:12）<strong>ὄφελον<\/strong>（ophelon）是一個說出口的強烈願望，<strong>ἀποκόψονται<\/strong>（apokopsontai）字面是「割掉」。多數學者讀為閹割的反諷：加拉太一帶敬拜大地之母的祭司以自閹為敬虔；你們既以割為敬虔，何不割到底？問題是：這樣的話合乎基督的愛嗎？今天可以照著說嗎？<\/p>"],["失控說（保羅一時氣話，不必效法）","","<p>認為保羅是人，寫這封信時情緒激動，這句話是他一時的氣話；聖經忠實地記下了使徒的人性，但不表示這句話值得效法，讀者可以略過它的語氣，只取它的內容。<\/p><p><strong>難處：<\/strong>這句話不是孤立的爆發，前後文都很清醒：保羅在 5:10 剛說「我在主裡很信你們」，5:13 立刻轉向愛心互相服事。把它講成失控，容易讓人覺得聖經作者的話可以隨意打折。<\/p>"],["先知式的反諷說（為羊群發出的義怒）","","<p>認為這是一句刻意的先知式反諷，像主耶穌對法利賽人說「你們這些蛇類、毒蛇之種啊」（太 23:33）。保羅對準的是把軛加在外邦信徒身上、拆毀羊群的教師；律法自己說被閹割的不可入耶和華的會（申 23:1），割過了頭，反倒把自己擋在會外。他的怒氣是為了別人的自由，不是為了自己的面子。<\/p><p><strong>難處：<\/strong>這個讀法雖然解釋得通，卻很容易被今天的人拿去當作「我罵人也是義怒」的藉口；而保羅有使徒的身分與啟示，今天的我們不能直接比照。<\/p>"],["交託說（一個交給神的願望，不是教會的行動）","","<p>著重語法：ὄφελον（ophelon）表達的是願望，不是命令；保羅沒有叫教會去對付這些人，前兩節也說「攪擾你們的，無論是誰，必擔當他的罪名」（5:10），把審判交給神。這句重話是一個屬靈父親在神面前說出的痛，不是給教會的行動綱領。<\/p><p><strong>難處：<\/strong>這個說法安撫了讀者，卻可能把這句話講得太軟，失去它原本的鋒利；保羅確實是要加拉太人聽見：給福音加條件的事有多嚴重。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採反諷說，並以交託說作為今天的應用界線。<\/strong>保羅說的是一句極重的反諷，對準的是拆毀羊群的教師，不是軟弱的羊；說的是交給神的願望，不是號召教會動手。<\/p><p>今天的應用有三條界線：一、這一節不能拿來為辱罵、羞辱意見不同的人辯護；二、不能借它咒詛弟兄姊妹；三、它的鋒芒先向著講台自己——凡在十字架之外給人加條件的，包括講道的人，都要先聽見這句話。<\/p>"]],"con":[],"say":"本講義的立場：5:12 是一句對準拆毀羊群之教師的反諷，是交給神的願望，不是今天辱罵或咒詛人的許可證；它的鋒芒先向著講台自己。本講義的全卷立場見議題「『攪擾你們的人』是誰？」。","care":"會眾席上可能有人曾經被教會領袖在台上點名、在群組裡羞辱，聽到保羅也說這麼重的話，舊傷會被挑起來；也可能有人正打算拿這一節去回擊別人。講台上要明說這一節不替辱罵背書。會後若有人談起被羞辱的經驗，先聽、先承認那是傷害，不急著替說話的人解釋，也不要求他立刻原諒。"},{"id":"ISS05_4","t":"5:13「不可將你們的自由當作放縱情慾的機會」——基督徒自由的界線在哪裡？","r":"5:13--15；林前8:9；5:1","ch":[5],"why":"喝酒可不可以？紋身可不可以？某些娛樂、某些節慶、某些穿著可不可以？教會常在這些事上分成兩邊：一邊定出越來越多的規矩，一邊說「我在基督裡是自由的，你管不著」。5:13 正好站在兩邊中間，這一題關乎教會能不能在差異裡不相咬相吞。","pos":[["【一】經文問的是甚麼","","<p>「弟兄們，你們蒙召是要得自由，只是不可將你們的自由當作放縱情慾的機會，總要用愛心互相服事。」（5:13）<strong>ἀφορμή<\/strong>（aphormē）是軍事用語，發動攻擊的據點；<strong>δουλεύετε ἀλλήλοις<\/strong>（douleuete allēlois）是「彼此作奴僕」
