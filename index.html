<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="321加拉太書講義">
<meta name="application-name" content="321加拉太書講義">
<meta name="description" content="321加拉太書講義：全書六章逐節原文解經、講章逐字稿與321生命應用。">
<title>321加拉太書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}
.mkp.hl[data-c="charcoal"]{background:linear-gradient(transparent 62%, var(--hl-charcoal) 62%)}
.mknote{display:block}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:calc(var(--fs) * .85);line-height:1.8
}
.mknote[data-c="green"]{border-left-color:var(--hb-green)}

window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"將他兒子啟示在我心裡","sub":"召、啟、榮","lv":"A","arc":"不是出於人","sec":[["1:1--5","作使徒的保羅：不是由於人，也不是藉著人"],["1:6--10","去從別的福音：那並不是福音"],["1:11--17","乃是從耶穌基督啟示來的：從母腹裡分別出來"],["1:18--24","過了三年，才上耶路撒冷去見磯法：歸榮耀給神"]],"serm":{"pts":[["加一樣就不是福音","1:6--10","「去從別的福音。那並不是福音」——攪擾的人沒有拿掉基督，只是在基督後面加了東西"],["不是出於人","1:11--17","「乃是從耶穌基督啟示來的」——福音的源頭不是人的傳承；連保羅自己、連天上來的使者，都要被它檢驗"],["一個被改變的人","1:18--24","「他們就為我的緣故，歸榮耀給神」——從前的逼迫者成了傳道的人，人看見的不是保羅，是神"]]},"q":"你所在的教會，有沒有一些從來沒有寫在信仰告白裡、卻人人心裡都知道的條件？要穿成甚麼樣子、講哪一種語言、上過哪一套課、服事滿幾年、奉獻到甚麼程度，才算「真正是我們的人」。\n加拉太的外邦信徒碰到的就是這種條件：有人告訴他們，信耶穌很好，可是還要再受割禮，才算真的進了門。保羅一封信寫過去，連一句感謝都沒有，劈頭就說「我希奇」。\n這一章要問的是：在你心裡，耶穌「已經夠了」嗎？還是你一直在等，等自己再加上一樣甚麼，才敢相信神真的收納你？","truth":"福音是神藉著那一位為我們的罪捨己的基督，白白地呼召人；在基督之外加上任何得救的條件，就不再是福音。\n這個福音不是出於人，是神把他兒子啟示在人心裡；被這樣遇見的人不必再討人喜歡，人在他身上看見的，是神。","mv":{"t":"既然樂意將他兒子啟示在我心裡，叫我把他傳在外邦人中","r":"加1:16"},"card":["這一章是一位使徒寫給一群正在換陣營的信徒的急信。他先說自己的差遣不是出於人，在問安裡就把福音說滿：基督為我們的罪捨己；接著不寫感恩，直說「我希奇」，因為有人在基督後面加上了割禮；最後用自己的故事作證據：一個逼迫教會的人，被神親自改變，叫眾教會把榮耀歸給神。全章從召、到啟、到榮：福音從神來，也把榮耀帶回神那裡。","這一章的動詞，一再落在神身上：是父神叫基督從死裡復活（1:1）；是基督照父神的旨意捨己，救我們脫離這罪惡的世代（1:4）；是神藉著基督之恩呼召人（1:6）；是神把保羅從母腹裡分別出來、施恩召他、樂意將他兒子啟示在他心裡（1:15--16）。保羅從前一生都是自己的動詞，逼迫、殘害、長進、熱心；神一動手，主詞就換了。連最後那一句「歸榮耀給神」（1:24），眾人看見的，也是神的作為。","第 15 節「那把我從母腹裡分別出來」，「分別出來」原文是 ὁ ἀφορίσας με（ho aphorisas me）。學者觀察到，這個字和「法利賽人」的字源（希伯來文「分別出來的人」）相近。保羅從前以為，分別出來就是要跟不潔淨的人隔開、要比別人更守規矩；原來神早就把他分別出來，是為了「把他傳在外邦人中」（1:16），送到他從前不肯同桌的人那裡去。這改變今天的讀法：你的「分別為聖」，是把你和某些人隔得更遠，還是把你差到他們中間？","這一章照出來的，是一個心裡還留著一張清單的我。我口裡說靠恩典得救，心裡卻默默記著：我讀經的天數、我服事的年資、我比誰更忠心；我也拿這張清單去量別人，覺得某些人「還不夠像基督徒」。另一面，我在人面前很在乎面子，怕長輩不高興、怕同工有意見，一句真話繞三圈還說不出口。兩面其實是同一件事：我還想在基督之外，替自己加上一點分數。","「他們就為我的緣故，歸榮耀給神。」（1:24）全章最該被記住的，是這一個榮耀轉向的動作。攪擾的人想要的，是在別人身上留下自己的記號；保羅身上的改變，卻叫素未謀面的人為神歡呼。這一句把整章翻過來：一個人最大的見證，不是讓人記得他多了不起，而是讓人想起神多麼有恩典。你身上的改變，別人看見以後，嘴裡說出來的是你的名字，還是神的名字？","這一週做兩件事。第一，拿一張紙，寫下你心裡那些「信耶穌再加上甚麼才算數」的條件，不論是給自己的，還是拿來量別人的；一條一條讀出來，然後對主說：「你已經夠了。」第二，挑一位你一直不太敢講真話的人（長輩、主管、同工），這一週約一個時間，用溫柔的話說出一句你為了面子一直沒說的實話，事後不必等他的掌聲。","最終整合：加拉太，一間家庭聚會的晚上。\n一位外邦弟兄坐在角落，手心裡握著一塊小小的蠟板。\n蠟板上刻著一個日子——下個月，那幾位從遠方來的教師要替他行割禮。\n他們說得很溫和：「你信耶穌很好，只是還差這一步。」\n他算過了，這一步做完，他就再也不必在餐桌邊被人多看一眼。\n念信的人打開保羅的信。大家等著聽那一句熟悉的「我感謝神」。\n沒有。念出來的是：「我希奇你們這麼快離開那藉著基督之恩召你們的。」\n他愣住了。他以為自己只是多加一樣，原來是在離開一位。\n信繼續念：基督照我們父神的旨意，為我們的罪捨己。\n捨己。不是差一點，是已經給完了。\n那一晚散會的時候，他在油燈下把蠟板翻過來，\n用拇指慢慢把那個日子抹平。\n蠟面上甚麼都沒有了，只剩下他手指的溫度。\n今天，你手機的備忘錄裡，是不是也有一行還沒刪掉的日子——\n等我再好一點、再穩一點、再多做一點，神才會真的收納我？\n把它抹平吧。那一位已經為你捨己，\n但願榮耀歸於神，直到永永遠遠。"],"self":"這一章照出來的「有己」，第一個樣子是加分：我嘴裡說恩典，心裡卻替自己記帳，要在基督之外再加上我的表現、我的資歷、我的熟練，才敢相信自己真的被接納；我也用同一本帳去量別人，把我們這一群的習慣當成別人進門的門檻。\n第二個樣子是討好：我把「別人會怎麼看我」放在心裡最高的位置，為了面子不敢說真話，為了被稱讚而事奉；表面上很溫和，其實是另一位主人在替我做決定。","t321":{"k":"耶穌是我的榜樣：全卷第一次講基督，講的就是他「為我們的罪捨己」（1:4），而且是「照我們父神的旨意」。主在地上的時候，不受從人來的榮耀，群眾要強逼他作王，他退到山上去；在客西馬尼園，他把自己交在父的旨意裡。他不必討人喜歡，因為他的生命早已交給父；他也不必在恩典之外替自己加分，因為他本身就是那份恩典。學他，是先被他的捨己接住，再學他只看父的臉，不看人的臉。","g":"讓耶穌作王：這一章要人讓出來的位置，是「我心裡另一位主人」。保羅說「若仍舊討人的喜歡，我就不是基督的僕人了」（1:10）：王只能有一位。那一位可能是長輩的期待、同儕的比較、群組裡的評價、講台下的掌聲，也可能是我替自己訂的那張「再加上」的清單。讓耶穌作王，就是讓這些聲音退回顧問的位置，不再坐在王位上。可以自己檢查：我最近一次不敢說的那句真話，是怕誰？","p":"建立屬神的體系：這一章給教會三條建造的線。第一，門檻要回到基督：同工會可以一起檢查我們的會員制度、受洗班、服事資格，有沒有哪一條悄悄變成了「這樣才算數」的得救條件。第二，造就要從資訊走到啟示：1:13 保羅早就「聽見」了，1:16 神才「啟示」；門訓不只是教完課程，要陪人親自被那一位兒子遇見。第三，接納要讓神得榮耀：當「從前逼迫我們的」回到教會，我們要預備一張接納的桌子，也保護曾經受傷的人，讓眾人最後為神歡呼，而不是為誰鼓掌。"},"grp":["【一、破冰】你第一次去一個新的團體（新公司、新學校、新教會）時，有沒有一條沒人明說、你後來才發現的「規矩」？是甚麼？你是怎麼發現的？","【二、扎心】保羅說：「我豈是討人的喜歡嗎？若仍舊討人的喜歡，我就不是基督的僕人了。」（1:10）說出一個具體的人（家人、主管、長輩或同工）：你最怕他不高興。最近一次你為了他的臉色，沒有說出口、或說了違心之論的，是哪一句話？","【三、福音】保羅說基督「為我們的罪捨己，要救我們脫離這罪惡的世代」（1:4）。說一次你明明覺得自己還不夠好、還沒做到，卻被神（或透過某個人）白白接納的經驗：是哪一年、在哪裡、是透過誰？這件事讓你今天怎樣看自己心裡那張「再加上」的清單？","【四、行動】說出這一週你要做的一件事：一句要用溫柔的話說出來的實話（對誰、哪一天、在哪裡），或一位你要主動去接納、一起吃一頓飯的人——特別是那種「還不太像我們的人」的新朋友或回來的人。","【五、代禱】為三種人指名禱告：一位正在懷疑「我是不是還要做得更多，神才會接納我」的弟兄姊妹，求主讓他知道基督已經夠了；一位剛信主、在教會裡還覺得格格不入的新朋友，求主讓他找到一張接納的桌子；一位從前傷過教會、現在想回來的人，求主改變他，也賜教會智慧與溫柔接待他，並保護曾經受傷的人。"],"prac":{"main":"這一週，把心裡那張「信耶穌再加上甚麼才算數」的清單交出來，也說出一句為了面子沒說的真話。","items":["對神：每天讀一次加 1:3--5，讀到「為我們的罪捨己」時停下來，說出一件你覺得自己還要「補上」才配蒙愛的事，用一句話把它放在十字架下；讀到「但願榮耀歸於神」時，為神這一天在你身上做的一件小事說一聲阿們。","對自己：這七天，留意自己心裡出現「我還不夠」「我要再做多一點神才會喜悅」的時刻，在手機上記下：時間、因為甚麼、那一刻你拿甚麼來量自己。週末看一次，問自己：這張清單是神給我的，還是我自己加上去的？","對人：挑一位你一直怕他不高興的人，這一週用溫柔、尊重的話說出一句真話；再挑一位在教會或團體裡還「不太像我們」的人，主動坐到他旁邊、約他吃一頓飯，不先問他上過哪些課、在哪裡服事。","對生活：這一週發訊息、留言、回應群組之前，先問一句：我這樣說，是為了對方得益處，還是為了讓人覺得我很好？若發現自己只是為了面子，刪掉重寫；若是該說的真話，不要因為怕被已讀不回就收回。","對使命：在你的小組或服事團隊裡，下一次聚會時一起讀 1:6--9，誠實地列出「我們這一群人」可能不自覺加給新朋友的條件，選一條本月就拿掉或改變；並為一位還沒信主的朋友禱告，求神把他兒子啟示在那人心裡。"]},"safe":["① 拿 1:8--9「他就應當被咒詛」咒詛教義或宗派不同的人，把點水與浸水、方言、教會治理、詩歌風格的差異都說成「別的福音」。","保羅說的「別的福音」，是在基督之外加上得救的條件；他第一個放上檢驗台的是「我們」。拿這兩節去給弟兄姊妹貼標籤、喊異端，正好犯了攪擾者同樣的錯：把自己的一套加成得救的條件（紅線四）。","檢驗標準：你講完，會眾是更會檢查自己傳的福音有沒有加東西，還是更會給別的教會貼標籤？","② 把「攪擾你們的人」的主張講成保羅的，或講得含糊，讓會眾以為「信耶穌還要守割禮、守律法」也是使徒的教導。","「外邦人信了耶穌還要受割禮，才算進了亞伯拉罕的家」是攪擾者的主張，保羅的評語是「那並不是福音」；沒有說清楚是誰的話，等於把被否定的主張又放回講台上（全卷立場見議題「『攪擾你們的人』是誰？」）。","檢驗標準：你每次引述攪擾者的主張時，有沒有清楚說出「這是他們說的，不是保羅說的」？","③ 隨口把今天意見不同的人比作「攪擾你們的人」，拿 1:7 對付批評你的同工、離開的會友或別的教會。","攪擾者的問題不是「跟我意見不同」，是在基督之外加上得救的條件；把這個名號套在異議者身上，是用聖經保護自己的位置，也越過了哥林多後書立場三關於屬靈權柄的界線。","檢驗標準：你說某人是「攪擾的人」以前，能不能具體指出他在基督之外加上了哪一個得救的條件？","④ 用處境取消原則：「割禮是第一世紀猶太人與外邦人的問題，今天沒有人在講割禮，跟我們無關」；或跳過處境，把每一種教會規矩都說成割禮。","書信三問要走完：加拉太人被要求受割禮；保羅從福音推出原則——基督之外不可加上得救的條件；今天這原則落在語言、服裝、宗派標記、會員資格、服事年資被當成「這樣才算數」的處境裡（全卷立場見議題「書信的處境與原則」）。","檢驗標準：你有沒有具體說出，在你的教會裡，今天的「割禮」可能長甚麼樣子，同時也分清哪些只是秩序、不是得救條件？","⑤ 拿 1:1、1:11--12「不是由於人」「不是人教導我的」，鼓勵人說「我直接從神領受，不需要教會的印證、不需要人的勸告」。","保羅講的是福音的來源不是人的授權，不是說他不要教會；同一個保羅後來把所傳的福音「對弟兄們陳說」（2:2），開頭也有「一切與我同在的眾弟兄」（1:2）。把這一節當護身符，會讓人拒絕一切檢驗。","檢驗標準：你講完，會眾是更願意讓別人檢驗自己的領受，還是更覺得「神對我說了，誰也不能質疑」？","⑥ 把 1:10「我豈是討人的喜歡嗎」講成「基督徒不必在乎別人的感受」，替說話尖刻、不顧情面的人背書。","保羅在別處說「我們各人務要叫鄰舍喜悅，使他得益處，建立德行」（羅 15:2）；1:10 拒絕的是讓人的眼光作主人，不是拒絕愛人。把這一節講成冷漠，會讓傷人的話披上屬靈的外衣。","檢驗標準：你有沒有同時說出「不討人喜歡」與「叫鄰舍喜悅」的分別——一個是為了自己得認可，一個是為了對方得益處？","⑦ 把 1:10 講成病理診斷，在講台上說某些人「就是討好型人格」，或叫本來就不敢說不的人「再順服一點、再忍一下」。","會眾席上可能坐著在家庭或職場長期被控制、被要求委屈求全的人；給人貼心理標籤，或把順服講成無底線的忍讓，都會加重他的傷。1:10 的出路不是「更努力不討好」，是被基督的愛釋放，有一位真正的主人。","檢驗標準：一位長期不敢對人說不、在關係裡受傷的人聽完，是覺得被理解、有出路，還是覺得自己又多了一個毛病？","⑧ 把 1:13--14 講成「猶太教就是逼迫人的宗教」「猶太人的熱心都是錯的」，在講台上貶低猶太人或猶太傳統。","保羅到老都說自己是猶太人、以色列人；他否定的是自己從前那一種要把不一樣的人除掉的熱心，這種熱心任何宗教、任何教會都可能有。講成反猶，是把經文的鏡子轉去照別人（全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」）。","檢驗標準：你講完，會眾是更警醒自己的熱心會不會傷人，還是更看不起某一個民族？","⑨ 把 1:15「從母腹裡分別出來」講成宿命論：「你生下來就注定要作傳道人，不去就是違背神」，用來給年輕人施壓。","保羅在這裡講的是神的主權與恩典：呼召在任何記號、任何功課之前，是「施恩」召的；把它變成恐嚇，會讓人在懼怕中進入事奉，也讓沒有走上全職的人覺得自己是次等基督徒（議題見議題「1:15『從母腹裡分別出來』」）。","檢驗標準：一位在職場、在家裡忠心事奉的弟兄姊妹聽完，是更確定神在他身上也有恩典的呼召，還是覺得自己錯過了甚麼？","⑩ 把 1:15 的古卷異文講成「聖經抄錯了，所以不可靠」，或在講台上大談抄本，讓會眾不安。","SBLGNT 沒有寫出「神」字，和合本與多數抄本有；兩種讀法意思完全相同，「分別出來」「施恩召」的主詞都只能是神。講成懷疑，是把一個不影響任何教義的細節講成動搖信心的種子。","檢驗標準：會眾聽完，是更清楚這一節的主詞是神，還是只記得「聖經有不同的字」？","⑪ 把 1:17「往阿拉伯去」講成「保羅去了穆斯林的地方」，或把阿拉伯和今天的族群、宗教衝突拉在一起。","這裡的阿拉伯是第一世紀的拿巴提王國，只是一個地名，當時還沒有伊斯蘭；把它和今天的阿拉伯人、穆斯林連結，是讀錯了經文，也會在會眾心裡種下對某個族群的成見（全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」）。","檢驗標準：你講這一節的時候，會眾記得的是保羅不從人領受，還是記得一個關於某個族群的印象？","⑫ 把 1:23 講成見證表演：鼓勵人在台上把過去的罪講得越細越精彩，或叫剛悔改、還沒處理好傷害的人立刻上台作見證。","猶太的眾教會「歸榮耀給神」，不是為保羅的過去鼓掌；而保羅傷過的人、教會，都是真實的受害者。把過去講成精彩故事，會讓曾經受傷的人再受一次傷，也讓人更佩服說見證的人，而不是更愛主。","檢驗標準：見證講完，會眾記得的是那個人有多壞、多戲劇化，還是神的恩典有多大？台下曾經受傷的人，有沒有被顧到？","⑬ 先講 321「無己」，再拿 1:24「歸榮耀給神」或 2:20 來印證，讓第一章變成團契理念的插圖。","這一章先講的是福音的來源、別的福音、一個逼迫者被神改變；無己的本文在第 2 章，要從安提阿的餐桌與 2:21 長出來（鐵律五）。把經文當口號的註腳，會讓會眾記得口號，忘了經文。","檢驗標準：你的講法裡，是經文先說完、321 才在末端接上去，還是一開口就是口號？","⑭ 講 μετατίθεσθε、ἀνάθεμα、ἀφορίσας 時炫學，或把保羅講成「從頭到尾都對的英雄」，讓會眾更佩服保羅而不是更靠主。","這一章保羅自己說，他從前是逼迫教會的人；他的權柄是被神改變而來的，不是天生的。把他講成英雄，就違背了 1:24 的方向：人看見的應該是神，不是保羅。","檢驗標準：會眾聽完，是更佩服保羅的勇氣與學問，還是更不敢在基督之外誇任何東西、更愛那一位捨己的主？"]},{"n":2,"t":"現在活著的不再是我，乃是基督在我裡面活著","sub":"桌、抵、釘","lv":"A","arc":"不是出於人","sec":[["2:1--10","過了十四年，我同巴拿巴又上耶路撒冷去：用右手行相交之禮"],["2:11--14","我就當面抵擋他：安提阿的餐桌"],["2:15--18","人稱義不是因行律法：乃是因信耶穌基督"],["2:19--21","現在活著的不再是我：基督在我裡面活著"]],"serm":{"pts":[["一張分開的桌子","2:11--14","「他和外邦人一同吃飯」，「就退去與外邦人隔開了」——彼得沒有講錯道理，只是換了一張桌子；保羅說這是「與福音的真理不合」"],["不是因行律法","2:15--18","「人稱義不是因行律法，乃是因信耶穌基督」——餐桌的問題，根子是福音的問題"],["不再是我","2:19--21","「現在活著的不再是我，乃是基督在我裡面活著」——同一節說「他是愛我，為我捨己」：無己不是我消失，是我被愛"]]},"q":"你上一次換位子，是甚麼時候？不一定是教會的座位——也許是公司午餐的那一桌、家族群組裡你不再回話的那一位、年夜飯上你刻意不坐過去的那個親戚、團契裡一個你漸漸不約的人。沒有吵架，你只是坐到了另一頭。\n你後來怎麼對自己解釋？「比較自在」「大家比較聊得來」「免得別人誤會」？彼得當年大概也是這樣想的，經文卻只用了兩個字說出原因：「因怕」。\n這一章要問的是：是甚麼在決定你坐在哪一張桌子——是基督為你捨己的那份愛，還是別人看你的那張臉？","truth":"人稱義不是因行律法，乃是因信耶穌基督；義若是藉著律法得的，基督就是徒然死了（2:16、21）——所以凡在基督後面再加一個條件的桌子，都與福音的真理不合。\n醫治分桌的不是更大的勇氣，是一個已經發生的事實：我已經與基督同釘十字架，那位愛我、為我捨己的主在我裡面活著，我不必再靠別人的臉色保住自己。","mv":{"t":"我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信神的兒子而活；他是愛我，為我捨己。","r":"加2:20"},"card":["這一章從一隻右手講到一張分開的桌子，再從那張桌子講到十字架。耶路撒冷的柱石沒有勉強提多受割禮，向保羅伸出相交的右手；到了安提阿，彼得卻因怕而換了一張桌子，連巴拿巴也被帶走。保羅當面抵擋，因為這不是禮節，是福音：人稱義只因信基督，一加條件，基督就是徒然死了。全章的答案落在一句話上——我已經與基督同釘，他是愛我，為我捨己。","這一章真正在作工的是神。是他「託」保羅傳福音給外邦人，也「託」彼得給受割禮的人（2:7），同一位在兩個人身上運行；是他「不以外貌取人」（2:6），所以名望不能改寫真理；是他宣告人為義——「稱義」在這一章一直是被動的，宣告者是神；也是他的兒子「愛我，為我捨己」，把我和他一同釘上十字架。人只在一件事上有份：不廢掉神的恩。","2:21「我不廢掉神的恩」，「廢掉」原文是 ἀθετῶ（athetō），是把一份文件、一張合約宣告作廢的字，3:15 用它說人的文約一經立定就沒有人能廢棄。保羅的意思是：在恩典後面再加一個條件，就是在神的禮物上蓋一個「作廢」的章。這改變今天的讀法：當我對自己說「等我狀況好一點再來禱告」，當我心裡說「他那樣的人，還不夠格坐這一桌」，我不是在守規矩，我是在作廢恩典。","這一章照出來的我，是一個很會看臉色的人。我的道理沒有錯，可是我坐哪一桌、加入哪一個群組、在誰面前不提自己是基督徒，常常是由「別人會怎麼看我」決定的。另一面是，我也在悄悄地給別人設門檻：他的背景、他的口音、他的過去、他屬靈的程度，決定我願不願意和他同坐。兩種樣子都是彼得：怕被人擋在外面，又把別人擋在外面。","「義若是藉著律法得的，基督就是徒然死了」（2:21）。全章最該被記住的，是這一句冷靜的算式。它把一張桌子的座位，一路推到十字架：每一次我用一個額外的條件把人擋在外面，都在無聲地說基督的死還不夠。翻過來讀，它是最大的安慰——基督不是白死的，他的死夠了，夠讓任何一個人坐上這張桌子，也夠讓我不必再交任何成績單。","這一週，找出一張你慢慢退出的桌子——公司裡一個你不太同桌的同事、教會飯堂裡常常一個人吃飯的人、一位你因為別人的眼光而疏遠的朋友。選定一天，主動約他吃一頓飯或喝一杯茶，不為了傳講甚麼，只為了坐在一起。另外，若你一直在一段傷害你的關係裡忍著，這一週向一位信得過的人說出來：說「不」，也可以是讓基督作王。","最終整合：加拉太，一間家庭教會，晚上。\n桌上有餅，有一壺水。坐著的有猶太人，有希臘人，有一個奴僕，還有一位抱著孩子的婦人。\n這幾個禮拜，有人來過這裡。他們很客氣，說耶穌當然要信，只是還要再加上一點，才算真正的自己人。\n從那以後，桌子沒有搬走，人卻坐得越來越開。\n今晚，一封信到了。有人站起來，就著燈讀。\n讀到耶路撒冷那一隻右手，大家點頭；讀到安提阿那一張分開的桌子，屋子安靜了。\n連彼得也退了，連巴拿巴也被帶走了。\n然後讀信的人停了一下，把下一句慢慢讀出來：\n「我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信神的兒子而活；他是愛我，為我捨己。」（2:20）\n沒有人說話。\n那位婦人把孩子換到另一隻手，把面前的餅，推過桌面，推到那位一直坐在角落的弟兄面前。\n他是受過割禮的。他看了她一眼，把餅掰開，一半遞回去。\n信還沒有讀完，可是桌子已經合起來了。\n不是因為誰變得勇敢，是因為他們聽見了：那位被釘的神的兒子，愛的是「我」——也是坐在我對面的這一個。\n如果你今夜也坐在一張分得很開的桌子旁，不必先把自己釘得更死，\n只要再聽一次那下半句：他是愛我，為我捨己。\n然後把你手上的餅，推過去。"],"self":"這一章照出來的「有己」，第一個樣子不是張狂，是怕：我怕失去那個圈子裡的位置，怕被人說成「跟那種人混在一起的」，所以我的信仰在某些桌子上會自動降低音量，在某些人面前會悄悄換一個位子。我的道理一個字都沒有改，只是我的腳歪了。\n第二個樣子是把恩典變成成績單：我用讀經的天數、服事的時數、聚會的出席證明自己是自己人，也用同一張表去量別人夠不夠格。兩種樣子的中心都是我——一個要靠別人的臉色站立，一個要靠自己的表現站立，卻都忘了那一位已經愛我、為我捨己的主。","t321":{"k":"耶穌是我的榜樣：法利賽人和文士私下議論耶穌，說「這個人接待罪人，又同他們吃飯」（路 15:2）。主耶穌從來不為了保住名聲換一張桌子；連反對他的人都承認，「甚麼人你都不徇情面，因為你不看人的外貌」（太 22:16）。可是他也不是沒有骨頭的人：他在聖殿裡推翻桌子，在法利賽人面前說不。他的自由從哪裡來？從父的愛來；所以他能「愛他們到底」（約 13:1），也能把自己交出去——「沒有人奪我的命去，是我自己捨的」（約 10:18）。學他，不是學一種不在乎別人的硬，是學一種被父愛著、所以不怕臉色的自由。","g":"讓耶穌作王：這一章要人讓出來的第一個位置，是「別人的臉」在我心裡的寶座。彼得退去，是因為那張臉在作王；保羅說「我向律法死了」，就是那張臉不再有權決定我坐哪裡。第二個要讓出來的，是「門口的守門人」——我習慣替神決定誰夠格同桌，讓耶穌作王，就是把這一把鑰匙交還給那位為所有人捨己的主。讓耶穌作王不是讓我消失，是讓愛我的那一位作主。可以自己檢查：這一週我最後一次改變座位、改變說法，是因為愛，還是因為怕？","p":"建立屬神的體系：第 2 章給教會兩個畫面——一隻相交的右手、一張不可以分開的桌子。第一，不同的事工、不同的語言堂、不同的世代可以分工，卻要定期同桌：一起吃飯、一起禱告、一起作決定，讓「分工」不變成「分家」；第二，建立當面說、說得清楚、也說得出愛的糾正文化，不在背後傳話，也不在網路上公審，連柱石也可以被提醒；第三，記念窮人寫進教會的日常預算與探訪名單，因為因信稱義的福音從來不叫人不管窮人。這樣建起來的不是一群一模一樣的人，是一群因同一位捨己的主，可以坐在同一張桌子旁的人。"},"grp":["【一、破冰】說一張你記得最清楚的餐桌：小時候的年夜飯、學校的午餐、第一次去朋友家吃飯……那一桌是誰坐在你旁邊？你當時覺得自在，還是有點緊張？","【二、扎心】經文說彼得「因怕奉割禮的人，就退去與外邦人隔開了」（2:12）。說出一個具體的場合（公司、家族、學校、教會）：你最近一次因為怕別人怎麼看你，而換了位子、沒有出聲、或沒有說自己是基督徒，是在哪裡？你當時怕的是甚麼？","【三、福音】保羅說：「他是愛我，為我捨己。」（2:20）說一個具體的時刻：哪一年、在哪裡、透過誰，你第一次覺得這個「我」說的就是你自己？知道自己被這樣愛著，讓你在誰面前比較不怕了？","【四、行動】說出一位你這一週要主動同桌的人（名字或關係）——一位你漸漸疏遠的人，或教會裡常常一個人的人；說出哪一天、在哪裡、用甚麼方式約他（吃飯、喝茶、一起散步）。也說出這一週你可能最想「換桌子」的一個場合，以及你打算怎樣留下來。","【五、代禱】為三種人指名禱告：一位在教會或職場被冷落、常常一個人吃飯的人，求主讓他被接納；一位正在帶領教會或團隊、被人情與臉色拉扯的領袖，求主給他當面說真話、也被提醒時謙卑的心；一位正在一段傷害他的關係裡、以為「無己」就是要一直忍的人，求主讓他知道自己是被愛的，身邊有人陪他找到安全與專業的幫助。"],"prac":{"main":"這一週，坐回那一張桌子——因為那位愛我、為我捨己的主，已經替我付清了座位。","items":["對神：每天早上整句讀一次 2:20，讀到「他是愛我，為我捨己」時停下來，把「我」換成你的名字再讀一次；然後對主說一句：「主啊，我已經與你同釘十字架了，今天我不必靠別人的臉色活。」晚上回想：今天有沒有一個時刻，我是因為被愛而不怕？","對自己：這七天，每當你發現自己因為別人的眼光而改變座位、改變說法、隱藏信仰，就記下時間、地點與你怕的那張臉；週末把這張單子帶到主面前，不是為了責備自己，是承認「這個位置還在作王」，求主接手。","對人：主動約一位你漸漸疏遠、或常常一個人的人同桌一次；坐下來時不急著講道理，先問他最近好不好，聽他說完。若你曾經在背後談論過某一位弟兄姊妹，這一週選擇當面、溫和地和他談，或停止再轉述。","對生活：檢查你的手機——有沒有一個群組、一位聯絡人，是你因為怕被人歸類而悄悄退出或封鎖的？若那裡沒有傷害你的人，就回去說一句問候；若那裡有正在傷害你的人，這一週不必回去，而是向一位信得過的人說出來，必要時尋求專業協助。","對使命：在你的小組或事工團隊裡，提出一個「同桌」的具體安排——和另一個語言堂、另一個世代、另一個事工一起吃一頓飯或一起禱告一次；並照 2:10 記念窮人，為一位有經濟難處的家庭預備一份實際的幫助（一袋米、一張車票、一次陪同辦事）。"]},"safe":["① 把 2:20「不再是我」講成「我不重要、我的感受不重要、我的需要不必說出來」。","同一節說「他是愛我，為我捨己」：我被愛到一個程度，神的兒子為我死；兩節之內保羅用了一連串的「我」。無己不是自我消失，是我被愛、被交給真正的主人；講成我不重要，等於只引半句（紅線一，誤讀一）。","檢驗標準：你有沒有把「他是愛我，為我捨己」和「不再是我」放在同一口氣裡講？聽完的人，是覺得自己被愛了，還是覺得自己被抹掉了？","② 把「與基督同釘十字架」講成「你每天要努力把自己釘死，今天又沒有釘好」。","συνεσταύρωμαι（synestaurōmai）是完成式被動：已經被釘，至今仍是，是神作的；講成每天的苦修功課，無己就變成另一種行律法、另一張成績單，正是本章要拆的東西。每天的功課是承認並順著聖靈而行（5:16），根基是那位愛我、為我捨己的主已經作成的事（紅線一，誤讀二）。","檢驗標準：會眾聽完，是覺得又多了一件做不到的事，還是覺得可以安息在一件已經作成的事上？","③ 把「基督在我裡面活」講成「我的想法、我的感動就是基督的想法」，或領袖用它要求別人不可質疑。","同一章，一位被基督充滿的使徒彼得被當面抵擋（2:11）；基督在我裡面活，不代表我不會錯，正因為那位愛我、為我捨己的主在我裡面活，我才能被糾正。把個人感動等同基督的心意，是屬靈控制的入口（紅線一，誤讀三；屬靈權柄回指哥林多後書立場三）。","檢驗標準：你有沒有說出「連使徒也會錯、也需要被提醒」？會眾聽完，是更敢分辨，還是更不敢對領袖說話？","④ 用「無己」「不再是我」叫受害者忍受傷害，不可以說不、不可以離開危險、不可以求助。","寫這一節的人「一刻的工夫也沒有容讓順服他們」（2:5），又當面抵擋了彼得；無己的人不是沒有骨頭，是骨頭換成了基督的，而且那位主是愛我、為我捨己的。拿 2:20 叫正在受家暴、受屬靈或性方面傷害的人忍，是用十字架替加害者辯護；說「不」常常正是讓基督作王的一步（紅線一，誤讀四）。","檢驗標準：你有沒有明說「如果有人一邊傷害你一邊要你無己，那不是加拉太書第二章」，並告訴會眾可以向誰求助？","⑤ 先講 321 的「無己」，再拿 2:20 來印證；或只講 2:20，跳過安提阿的餐桌與 2:21。","2:20 是在一張分開的桌子旁、在當面抵擋一位跌倒的使徒時說出來的，前面是 2:16 的因信稱義，後面是「基督就是徒然死了」（2:21）；抽出來當口號，就把經文當成 321 理念的插圖，也容易只剩半句（鐵律五）。團契的那一句話，根在「他是愛我，為我捨己」。","檢驗標準：你講到 2:20 之前，會眾有沒有先看見那張桌子、先聽見 2:21？321 是最後才接上去的嗎？","⑥ 用「因信稱義」把新的規條當作進門的條件：「真正得救的人一定要受某種洗、說某種話、守某套規矩，才算自己人」。","這正是假弟兄的作法——他們沒有拿掉基督，只是在基督後面加了一個「和」字；保羅說加一點，基督就是徒然死了。律法主義不一定穿著摩西的衣服，也可能是一套教會文化、一份屬靈表現的檢查表（紅線二，全卷立場見議題「律法、稱義與『因信』」）。","檢驗標準：你講完，會眾心裡多了一張要過關的清單，還是更清楚只有基督是唯一的門？","⑦ 反過來講成放縱：「既然不靠行律法稱義，行為就不重要，怎麼活都可以」。","2:17 保羅對「基督是叫人犯罪的嗎」只回一句「斷乎不是」；同一章的握手之後，唯一的請求是「記念窮人」，保羅說那是他本來熱心去行的（2:10）。不靠行為得救，不等於行為不重要：分清楚得救的條件與得救的果子（紅線二，全卷立場見議題「基督徒的自由：在律法主義與放縱之間」）。","檢驗標準：你有沒有同時講到「不是靠這些得救」和「得救了就活出這些」？會眾聽完，是更自由地愛人，還是更自由地放縱自己？","⑧ 把「偷著引進來的假弟兄」的主張講成保羅或耶路撒冷使徒的主張，或拿「假弟兄」去給今天意見不同的弟兄姊妹、別的宗派貼標籤。","要外邦人受割禮才算數，是這些人的主張；保羅「一刻的工夫也沒有容讓」，耶路撒冷也沒有勉強提多。他們被稱為假弟兄，是因為在福音之外加上得救的條件，不是因為他們和我們在次要的事上看法不同。把這個詞隨手丟給人，自己就成了在桌邊另劃界線的人。","檢驗標準：講到 2:4 時，你有沒有說清楚這是誰的主張？你有沒有分清楚「加上得救的條件」和「看法不同」？","⑨ 用 2:11–14 否定一切語言分堂、族群堂，說「分堂就是分裂」；或反過來，用「為了方便」替從不往來的分堂辯護。","語言分堂可以是為了福音的方便，讓阿嬤和孩子都聽得懂；但若各堂從不一起吃飯、禱告、作決定，提到對方總說「他們那邊的」，那就是彼得那一張分開的桌子。合一不是一樣，但合一一定要落在桌上（紅線五，全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」）。","檢驗標準：你有沒有給會眾一個可以自己檢查的標準——不同堂的人，最近一次一起吃飯、一起禱告是甚麼時候？","⑩ 只把分桌講成族群的問題，卻讓同一張桌子上的女性、窮人、新來的人坐在看不見的地方，或用「合一」要求所有人變成一樣。","安提阿的問題是誰可以同桌；今天的分桌也可能沿著性別、階級、學歷、資歷劃線。性別角色互補派與平等派都是敬重聖經的福音派，本講義並陳；但任何貶低、輕看女性的講法與作法都違背福音（紅線五，全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」）。","檢驗標準：你的教會在作決定、在飯桌、在台前，女性、窮人、新來的人坐在哪裡？會眾聽完，有沒有想到自己桌邊的那一位？","⑪ 把安提阿講成「猶太人愛分桌、猶太人假冒為善」，把彼得與「奉割禮的人」講成整個猶太民族的代表。","保羅自己說「我們這生來的猶太人」（2:15），他沒有否認自己的猶太身分；彼得、巴拿巴、保羅都是猶太人，問題不在民族，在把一個身分記號當成同桌的條件。講成反猶太，就是另外劃了一張桌子（紅線三，全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」）。","檢驗標準：一位猶太裔或信主的猶太朋友坐在台下，聽完會覺得被尊重，還是被輕看？","⑫ 用「保羅當面抵擋彼得」為在網路上公審、在講台上點名、在會議上羞辱同工辯護。","彼得的退去是公開的、影響了整間教會的福音真理，所以公開處理；保羅當著他的臉說，不在背後傳話，說的是一個問題，不是一場羞辱。一般的得罪仍照「趁著只有他和你在一處的時候，指出他的錯來」（太 18:15）（屬靈權柄回指哥林多後書立場三）。","檢驗標準：你有沒有分清楚「公開影響福音真理的錯」和「私人的得罪」？你的指正，目的是挽回人，還是贏一場？","⑬ 把彼得講成徹底的失敗者、偽君子，或把保羅講成永遠站對邊的屬靈英雄。","彼得被抵擋之後沒有被丟掉，後來在耶路撒冷說「我們得救乃是因主耶穌的恩，和他們一樣，這是我們所信的」（徒 15:11）；連巴拿巴這樣的好人也會被沖走，該讓人謙卑。講成英雄與反派，會眾會更佩服保羅，卻看不見自己就是那個會換桌子的人（鐵律七）。","檢驗標準：會眾聽完，是更佩服保羅，還是更認識那位為彼得、巴拿巴、也為我捨己的主？","⑭ 用處境取消原則：「那是一世紀猶太人和外邦人吃飯的問題，和我們無關」；或反過來，用 2:3 說「任何文化讓步都是妥協」。","書信三問要走完：處境是割禮與潔淨條例在加拉太成了同桌的門檻；原則是人只有一個門——基督。提多不受割禮、提摩太受割禮（徒 16:3），處境不同、原則一致：當作門票就是另一個福音，當作為福音的讓步就是愛。今天的割禮可能是一種語言、一套服裝規矩、一個宗派標記（全卷立場見議題「書信的處境與原則」）。","檢驗標準：你有沒有具體說出，今天在你的教會裡，「信耶穌再加上」的那一樣是甚麼？","⑮ 把 2:16 的新觀與傳統觀點之爭搬上講台，叫會眾覺得「因信稱義」已經被推翻了；或把新觀一概斥為異端。","本講義站在宗教改革底線：稱義是神白白的恩典，單單因信；同時吸收新觀的提醒，加拉太的稱義也是一張餐桌。講台上一句帶過、指向議題頁；把學術爭論講成信心危機，或把敬重聖經的學者貼上異端標籤，都會傷人（全卷立場見議題「律法、稱義與『因信』」）。","檢驗標準：會眾聽完，是更確定自己因信被稱為義、也更願意和人同桌，還是更困惑、更好辯？"]},{"n":3,"t":"基督既為我們受了咒詛","sub":"畫、咒、師","lv":"A","arc":"乃是兒子","sec":[["3:1--5","無知的加拉太人哪：靠聖靈入門"],["3:6--9","亞伯拉罕信神，這就算為他的義：以信為本的人"],["3:10--14","基督既為我們受了咒詛：贖出我們脫離律法的咒詛"],["3:15--22","律法是為甚麼有的呢：四百三十年與一個子孫"],["3:23--29","律法是我們訓蒙的師傅：在基督耶穌裡都成為一"]],"serm":{"pts":[["活畫在眼前","3:1--5","「耶穌基督釘十字架，已經活畫在你們眼前」——靠聖靈入門的人，又想「靠肉身成全」"],["成了咒詛","3:6--14","「基督既為我們受了咒詛」——咒詛沒有被一筆勾銷，是被他擔下了；「亞伯拉罕的福」才臨到外邦人"],["帶路的師傅","3:15--29","「律法是我們訓蒙的師傅，引我們到基督那裡」——到了基督那裡，就「都成為一了」"]]},"q":"回想你剛信主的那一天：你甚麼都還沒做到，只是聽見了，就信了；你知道自己不配，卻第一次覺得被接納。\n可是現在呢？你是不是常常覺得，要讀得夠多、禱告得夠久、服事得夠好，神才會繼續對你滿意？好像入門是恩典，往後的路要靠自己撐；撐不住的那一週，你連聚會都不太想去。\n保羅問加拉太人：「你們既靠聖靈入門，如今還靠肉身成全嗎？」（3:3）這一章要問的是：你今天的信仰，還是用那一天的方式在走嗎？","truth":"基督替我們成了咒詛，把我們從律法的咒詛裡贖出來；亞伯拉罕的福與所應許的聖靈，是因信白白臨到的，不是做到了才換得的。\n律法把我們帶到基督那裡，它的看管就完成了；在基督裡，猶太人、希臘人，自主的、為奴的，或男或女，都披戴同一位基督，一同承受應許的產業。","mv":{"t":"基督既為我們受了咒詛，就贖出我們脫離律法的咒詛","r":"加3:13"},"card":["這一章是加拉太書辯證的開場。保羅先問加拉太人自己的經歷：你們受聖靈，是因行律法，還是因聽信福音？再翻回創世記：亞伯拉罕在割禮之前，就因信被算為義。接著說出最刺耳也最寶貴的一句：律法的咒詛是真的，基督替我們成了咒詛。最後說明律法是後來添上、有期限的看管，把人帶到基督那裡，在他裡面成為一。全章一句話：福從來不是賺來的，是在基督裡承受的。","這一章的主詞一再是神。是神「賜給你們聖靈，又在你們中間行異能」（3:5）；是神親口向亞伯拉罕說應許，那是「神預先所立的約」（3:17）；是神「憑著應許把產業賜給亞伯拉罕」（3:18）；是神差基督進到咒詛裡，把人贖出來；連律法本身，也是神在應許與基督之間安排的一段看管。人在這一章裡只做了一件事：聽見了，就信了。神先作完，人才接過來。","第 5 節「那賜給你們聖靈」的「賜給」，原文是 ἐπιχορηγῶν（epichorēgōn），現在分詞。字根 χορηγός 原是希臘城邦裡出錢供應整個合唱團的人：戲服、排練、演出，一路由他承擔。保羅用現在式說：聖靈不是入門那天給一次，往後要你自己出錢演下去；他一直在供應。這改變今天的讀法：你覺得屬靈生命快撐不下去的那一週，不是該更用力的時候，是該回到那位一直在供應的神面前的時候。","這一章照出來的我，常常是用聖靈開頭、用肉身收尾的人。剛信主時，我只知道自己不配；過了幾年，我開始用讀經天數、服事年資、奉獻多少來量自己，也量別人。表面上是更成熟，裡面其實是把十字架從眼前移開了一點。另一面是我其實在怕：怕自己做得不夠，神就把應許收回去；所以越做越累，越累越不敢停。","「基督既為我們受了咒詛」（3:13）。全章最該記住的動作，是基督自己走進了咒詛的位置。律法的判決沒有被取消，是被他擔下了。這一句把我從兩個地方挪出來：不必再假裝自己守得住全部的律法，也不必再一個人背著守不住的罪咎。下一次你心裡又聽見「你不夠」的判決，你可以回答：那判決是真的，而他已經替我承受了。","這一週，把你信仰裡那份「做到才算數」的私人清單寫出來——每天讀經的章數、早起的時間、服事的次數、不可以碰的東西。在每一條旁邊寫一個字：「果」或「票」。週六晚上把這張紙帶到主面前，為一條你最常拿來審判自己或別人的「票」認罪，感謝他白白賜下的聖靈。清單上的好事照樣去做，只是用法換了：那是果子，不是門票。","最終整合：加拉太高原上的一條小河，清晨，水很冷。\n岸邊站著三個人：一個從會堂來的猶太商人，一個在市場賣布的希臘婦人，一個手臂上還留著舊疤的年輕奴隸。\n平常在城裡，他們不走同一條路，更不坐同一張桌子。\n前幾天，一個身上帶著傷痕的傳道人，在市場邊對他們講了一個被掛在木頭上的人。\n他講得那樣清楚，好像那人就釘在他們眼前。\n律法說，凡掛在木頭上的都是被咒詛的。傳道人說：對，他就是替你們成了那份咒詛。\n現在，他們一個一個下到水裡，又一個一個上來。\n有人遞給他們一樣的白衣：商人的肩膀寬，婦人的個子小，奴隸的袖口遮不住那道疤。\n同一件衣服，穿在三個完全不同的身體上。\n沒有人因此變成別人。可是從岸上看過去，認出來的，是那件衣服。\n那天晚上，他們圍著同一張桌子，掰同一個餅。\n後來有人來說：很好，可是你們還缺一樣。\n保羅寫信回答他們：你們甚麼都不缺。你們在基督耶穌裡，已經成為一了。\n如果你今天也站在岸邊，手裡還捏著一張「我還缺甚麼」的清單——\n把它放下吧。\n那位替你成了咒詛的主，已經把他自己，像一件衣服，披在你身上。"],"self":"這一章照出來的「有己」，第一個樣子是「靠肉身成全」：我嘴上說得救本乎恩，日子卻過得像在還貸款——讀經、禱告、服事、奉獻，每一樣都在心裡記帳，記得夠多才敢抬頭，記得不夠就躲著神。我以為那叫認真，其實是把信主那一天白白的恩典，偷偷改成了頭期款。\n第二個樣子是「在基督後面加條款」：我不一定要人受割禮，但我會在心裡把人分等——講不講我的語言、是不是我這一派、做不做得到我做到的事。前一個樣子把自己壓在律法底下，後一個樣子把別人擋在桌子外面；中心都還是我。","t321":{"k":"耶穌是我的榜樣：律法說「凡掛在木頭上都是被咒詛的」（3:13），主耶穌沒有繞過這一句，他自己走到那木頭上。他說「沒有人奪我的命去，是我自己捨的」（約 10:18）——他不是被動地捲進咒詛，是甘心站進我們的位置。他一生也沒有用律法把人擋在門外：他摸痲瘋病人、和稅吏同席、在井旁和撒瑪利亞婦人說話。學他，不是去替別人受苦來證明自己屬靈，而是在別人被排在外面的地方，像他一樣先走過去。","g":"讓耶穌作王：這一章要人讓出來的第一個位置，是「成全者」。加拉太人靠聖靈入門，卻想自己用肉身完成；讓耶穌作王，是承認起頭的是他，成全的也是他，我不是自己屬靈生命的承包商。第二個要讓出來的，是「看門的人」：決定誰夠資格坐上桌子、誰還缺一樣的那個位置，不屬於我。讓耶穌作王，不是從此不守規矩，而是讓順服從被愛裡長出來。可以自己檢查：這一週我最常拿來審判自己或別人的那一條標準，是基督設的，還是我加上去的？","p":"建立屬神的體系：第 3 章給教會一個建造的次序。第一，進門的門只有一道：信基督；洗禮班、會員課程、服事訓練都是好的，卻不可以變成「做完才算自己人」的割禮。第二，教會的規矩要像那位訓蒙的師傅：有期限、有方向，把人帶到基督面前，不是永遠牽著人的手；帶領者的目標是讓人長大，不是讓人離不開自己。第三，讓三道牆在同一個團契裡倒下：不同語言、不同階層、男和女，一起禱告、一起吃飯、一起擔任服事，分工可以不同，桌子只有一張。這樣建起來的，不是一群做得一樣好的人，是一群披戴同一位基督的人。"},"grp":["【一、破冰】你小時候有沒有一個大人每天接送你上學、盯著你寫功課——父母、祖父母、保母或一位老師？你記得他最常對你說的一句話是甚麼？你長大以後，還會想起他嗎？","【二、扎心】保羅問：「你們既靠聖靈入門，如今還靠肉身成全嗎？」（3:3）說一件具體的事：最近一次你覺得「我做得不夠，神大概不太高興」，是哪一天、因為甚麼（少讀了經、發了脾氣、服事出了錯）？那時你做了甚麼來「補回來」？","【三、福音】「基督既為我們受了咒詛，就贖出我們脫離律法的咒詛」（3:13）。說出一個你曾被罪咎壓著、後來在十字架前被釋放的時刻：大約哪一年、在哪裡，是透過哪一節經文或哪一個人，讓你知道那份判決已經有人替你承受了？","【四、行動】3:28 說三道牆在基督裡倒下了。說出這一週你要主動接近的一位「牆那一邊」的人（不同語言、不同年齡層、不同社經背景，或在教會裡常被忽略的人）：他是誰（名字或關係）、哪一天、在哪裡，你要用甚麼方式（一起吃飯、一通電話、一起服事）？","【五、代禱】為三種人指名禱告：一位從民間信仰背景信主、還常怕被下咒或犯沖的弟兄姊妹，求主叫他住在愛裡、不再懼怕；一位在教會裡因為性別、語言或出身而覺得自己只能坐偏桌的人，求主讓他被看見、被接納；以色列地的猶太人與阿拉伯人，包括那裡的信徒，求主賜他們平安，也叫我們因同一位神而尊重他們。"],"prac":{"main":"這一週，把眼睛放回十字架，把加上去的條款拿下來——用聖靈開始的，也用聖靈走下去。","items":["對神：每天早上讀一次 3:13--14，用自己的話對主說一句：「那份咒詛，你替我擔了。」再為「所應許的聖靈」感謝他一件今天看得見的供應；晚上寫下今天哪一刻又想「靠肉身成全」，交給他。","對自己：拿出那份「果」與「票」的清單。這一週有一天沒做到其中一條時，先不急著補做來讓自己安心，而是先到主面前說：「我在你家裡，是因為信，不是因為做到。」隔天照常去做，但讓它成為回應，不是交換。週末看看自己的心有甚麼不同。","對人：若你家裡、公司或教會裡有外籍幫傭、移工或最基層的同事，這一週用他的名字稱呼他，問一次他的家人好不好，並確認他該有的休息與薪水有沒有按時給足；若沒有，這週就改。3:28 的「自主的、為奴的」，今天最先落在這裡。","對生活：檢查一條你家裡或工作上「做到才被接納」的規矩——給孩子的、給下屬的、給配偶的。規矩可以留，說法要換：先讓對方知道他被接納，再談要做到甚麼。例如對孩子說「你是我的孩子，所以我們一起把功課寫完」，而不是「寫完了，你才是好孩子」。","對使命：看看你所屬的小組或事工，有沒有一條沒寫出來、卻讓新朋友覺得「還不夠格」的門檻（某種語言、穿著、屬靈用語、聚會年資）。這一週向帶領者提出一個具體的調整，讓新來的人第一次來就知道：在基督裡，他已經是家人。"]},"safe":["① 用 3:1「誰又迷惑了你們」說基督徒會被下咒、中邪、被降頭，要人戴護身物、做驅邪或斷咒儀式才安全。","ἐβάσκανεν（ebaskanen）是保羅借民間怕的字作反諷；真正叫人失去判斷的是別的福音，不是邪眼。講成中邪，等於把會眾送回信主前的懼怕裡，也在基督之外加上新的護身條件（全卷立場見議題「基督徒的自由：在律法主義與放縱之間」）。","檢驗標準：一位從民間信仰背景信主的人聽完，是更怕被下咒，還是更確定在基督裡不必懼怕？","② 把「不靠行律法」講成「行為不重要」「怎麼活都沒關係，反正已經稱義了」。","保羅反對的是把行為當作稱義的條件，不是反對順服；同一封信要講「使人生發仁愛的信心」（5:6），也要講聖靈的果子。講成行為不重要，是給放縱開門（紅線二，全卷立場見議題「律法、稱義與『因信』」）。","檢驗標準：會眾聽完，是更自由地去愛人，還是更自由地放縱自己？","③ 反過來，講完因信稱義，又說「真正得救的人一定要天天讀經、十一奉獻、受洗滿幾年、不碰某些東西」，把新的規條當作進門的條件。","這正是「靠聖靈入門，如今還靠肉身成全」：屬靈操練是好的，一旦變成門票，就是今天的割禮，是律法主義換了一件衣服。","檢驗標準：你講出來的每一個要求，是被愛的人長出來的果子，還是又一張進門的門票？","④ 用 3:10「凡以行律法為本的，都是被咒詛的」說「猶太人都被咒詛了」「神已經棄絕以色列」，或把今天的中東衝突套進這一節。","保羅自己是生來的猶太人，他說的是任何人想靠律法稱義的處境，連他自己也在其中；羅馬書明說「神棄絕了他的百姓嗎？斷乎沒有！」（羅 11:1）。這樣講會助長反猶，也違背聖經（紅線三，全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」）。","檢驗標準：若有一位猶太人坐在會眾席上，他聽到的是福音的邀請，還是輕蔑？","⑤ 用 3:29「就是亞伯拉罕的後裔」說「教會已經取代以色列，神與猶太人的約作廢了」；或反過來把外邦信徒講成次一等的後裔。","3:29 說的是外邦人在基督裡被接進來，不是猶太人被趕出去；外邦人是被接上的枝子，「不是你托著根，乃是根托著你」（羅 11:18）。兩種講法都把一道門拆成兩道（紅線三，全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」）。","檢驗標準：你有沒有同時說出「外邦人被接進來」與「猶太人沒有被趕出去」這兩句？","⑥ 把 3:13 講成「憤怒的父親在十字架上懲罰無辜的兒子」，好像父與子對立；或把基督講成身不由己的受害者。","保羅說基督是「替我們」成了咒詛，而且是「他是愛我，為我捨己」（2:20）；父與子同一個心意救人。講成父子對立，會讓在原生家庭被父親傷害過的人更不敢靠近天父；講成受害者，又淡化了他甘心的愛。","檢驗標準：會眾聽完，看見的是父與子同一個愛，還是一位需要被安撫的怒神？","⑦ 把 3:13 變成一再重做的斷咒儀式：「不斷開祖宗的咒詛，你就不能蒙福」，要人一次又一次追查家族的罪。","「贖出」是一次完成的事；把它講成要反覆執行的儀式，等於說十字架還不夠，又在基督後面加了一個條件，也讓人活在對過去的恐懼裡（全卷立場見議題「基督徒的自由：在律法主義與放縱之間」）。","檢驗標準：會眾走出去，是更依賴一次又一次的斷咒禱告，還是更安息在已經成就的十字架？","⑧ 把律法講成壞人：「舊約的神很兇，新約的神才溫柔」「律法是錯的，可以丟掉了」。","保羅問「律法是與神的應許反對嗎？」，自己回答「斷乎不是」（3:21）；訓蒙的師傅是父親派來的，「律法是聖潔的」（羅 7:12）。講成壞人，是馬吉安式的錯誤，也把舊約讀者推離他們手上的聖經。","檢驗標準：你有沒有說出律法「引我們到基督那裡」，而不只是說它過時了？","⑨ 用 3:28 抹平差異：「在基督裡沒有族群、沒有男女，所以不要再提你的文化和語言」，要少數族群放下母語、融入主流才算合一。","合一不是一樣；披戴基督是同一件衣服、不同的身體，保羅自己仍是猶太人。抹平差異，會讓少數族群與第二語言的弟兄姊妹覺得要先變成別人，才算屬於這個家（紅線五，全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」）。","檢驗標準：一位少數族群或說第二語言的弟兄姊妹聽完，是覺得被接納，還是被要求變成別人？","⑩ 反過來用差異為排斥辯護：「女人不配上台」「那一族比較難帶」「移工另外一堂就好，不必和我們一起」；或在性別角色上把另一派講成不信聖經。","語言分堂可以是為了福音的方便，卻不可以變成彼得那一張分開的桌子；互補派與平等派都是敬重聖經的福音派，但兩派都必須同意：任何貶低、輕看女性的講法都違背福音（紅線五，全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」）。","檢驗標準：你有沒有明說「任何貶低女性的講法都違背福音」，並把兩派都當作敬重聖經的弟兄姊妹？","⑪ 用 3:28「自主的、為奴的」說「保羅沒有廢除奴隸制，所以苛待幫傭、剝削勞工也沒關係」；或反過來說「聖經贊成奴隸制，已經過時」。","這是處境與原則要分清的地方：保羅在羅馬帝國的處境裡沒有發動社會革命，卻放下了一個原則——主人與奴隸在基督裡是弟兄（門 16），這原則終究從裡面瓦解了奴隸制（全卷立場見議題「書信的處境與原則」）。","檢驗標準：你有沒有具體說出這一節今天落在哪裡——外籍幫傭的休假、移工的薪水、公司裡最基層的人？","⑫ 用處境取消原則：「割禮是猶太人的事，跟我們華人教會沒有關係」，講完歷史就結束。","書信三問的第三問要走完：處境是加拉太的割禮與分桌，原則是信基督之外不可再加任何得救的條件。今天的「割禮」可能是一種語言、宗派標記、服裝規矩、會員資格（全卷立場見議題「書信的處境與原則」）。","檢驗標準：你有沒有具體說出，在你的教會裡，今天的「割禮」可能是甚麼？","⑬ 用 3:16「子孫是單數」嘲笑保羅亂解經；或反過來，把這種方法當作通則，在別的經文裡任意從單數複數抓出新教義。","保羅自己在 3:29 用同一個單數字指眾人，他知道這是集合名詞；他看見的是應許收窄在一位代表身上。嘲笑會動搖會眾對聖經的信任，濫用則打開任意解經的門（全卷立場見議題「這些爭議該不該影響一個人的信心？」）。","檢驗標準：你有沒有說明保羅知道 σπέρμα（sperma）是集合名詞，並且只照他自己作的連結講？","⑭ 用 3:22 的「基督的信實」讀法說「人不必信，基督已經替我信了」；或在台上說和合本「信耶穌基督」譯錯了。","本講義照和合本「信基督」解經，同時陳列「基督的信實」讀法；兩面都要講：我們信，是因為他先信實。講成人不必信，取消了全章「聽信」的呼召；說和合本譯錯，則讓會眾不敢讀自己手上的聖經。","檢驗標準：會眾聽完，是更願意把信心放在信實的基督身上，還是更困惑自己還要不要信？","⑮ 把保羅講成辯論高手：「你看保羅引經據典，把攪擾的人駁得啞口無言」，全篇在佩服他的論證。","保羅的每一個論證都回到被釘的基督；攪擾的人的主張要說清楚是他們的，不寫成保羅的，但講台的目的不是贏一場辯論，是讓會眾的眼睛回到十字架。","檢驗標準：會眾聽完，是更佩服保羅的口才，還是更不敢在十字架之外誇任何東西？"]},{"n":4,"t":"你不是奴僕，乃是兒子了","sub":"子、痛、約","lv":"A","arc":"乃是兒子","sec":[["4:1--7","從此以後，你不是奴僕，乃是兒子了：阿爸，父"],["4:8--11","怎麼還要歸回那懦弱無用的小學：日子、月份、節期"],["4:12--20","我為你們再受生產之苦：直等到基督成形"],["4:21--31","這都是比方：兩個婦人、兩個約"]],"serm":{"pts":[["兒子的名分","4:1--7","「神就差他兒子的靈進入你們的心，呼叫：『阿爸！父！』」——兒子的名分不是表現換來的，是神差來的靈在心裡呼叫"],["回去作奴僕","4:8--20","「怎麼還要歸回那懦弱無用的小學」——保羅像一位母親，「再受生產之苦，直等到基督成形在你們心裡」"],["兩個婦人","4:21--31","「這都是比方：那兩個婦人就是兩約」——比的是兩種出生方式，不是兩個民族：「我們不是使女的兒女，乃是自主婦人的兒女了」"]]},"q":"你最近一次搞砸了一件事——對孩子發了脾氣、在公司出了錯、又回到那個戒了很多次的習慣——之後，你對神說的第一句話是甚麼？是「對不起，我下次會更好」，還是乾脆好幾天不敢禱告？\n再想一個場景：要搬家、要開刀、要訂婚期，家裡長輩翻開農民曆，說這一天不好。你嘴上說不信這些，心裡那一點不安，是從哪裡來的？\n這一章要問的是：你心裡最深的那個聲音，稱神為「主人」，還是叫他「阿爸」？在你最不安的那一天，你靠的到底是誰？","truth":"神在祂預定的時候差遣祂的兒子生在律法以下，把我們贖出來，又差祂兒子的靈進入我們的心——「從此以後，你不是奴僕，乃是兒子了」（4:7）。\n兒子的身分是父親宣告的，不是表現換來的；所以我們不必再歸回任何一套靠日子、規條、門檻來確定自己位置的小學，只要守在恩典裡，讓基督在我們裡面慢慢成形。","mv":{"t":"可見，從此以後，你不是奴僕，乃是兒子了；既是兒子，就靠著神為後嗣。","r":"加4:7"},"card":["這一章講的是一個身分的翻轉，和一場不肯放手的陣痛。保羅先畫一個還沒長大的繼承人，再說神在時候滿足時差兒子來贖、差兒子的靈來呼叫，宣告「你不是奴僕，乃是兒子了」；接著他看見這些兒子竟然想走回奴僕的房間，就像母親一樣再受生產之苦；最後用兩個婦人打比方：出生的方式，決定你是誰。全章一句話：兒子不必再申請成為兒子。","這一章的動詞，主詞一再是神。是父親定下日子（4:2）；是神在時候滿足的時候差遣祂的兒子，叫祂為女子所生、生在律法以下；是神把律法以下的人贖出來，給他們兒子的名分；是神再差一次，把祂兒子的靈送進人的心裡；是神先認識了人（4:9）；是神在不能生育的地方，生出比有丈夫的更多的兒女（4:27）。人能作的只剩一件：不要再走回去。","第 2 節「直等他父親預定的時候來到」，「預定的時候」原文是 προθεσμίας（prothesmias），全本新約只出現這一次，是法律文件上預先訂好的期限。日子不是孩子定的，是父親定的。這改變今天的讀法：我們常替自己的成長、孩子的信仰、家人的得救訂一個期限，到了沒有發生，就焦慮、灰心，或開始用自己的辦法催。保羅說，時候是父親的；我們的工作是信靠與陪伴，不是替神催日子。","這一章照出來的我，嘴裡叫「阿爸」，過的卻是僕人的日子：做得好，就覺得神很近；失敗了，就覺得要重新申請。我需要一張清單、一個儀式、一個好日子，才能確定自己沒事。另一面是，我也會像那些熱心的人一樣，對別人說「你這樣還不夠」，把人關在門外，好叫他來找我。兩種樣子，都是不肯只靠父親。","「弟兄們，我勸你們要像我一樣，因為我也像你們一樣」（4:12）。一個生來的猶太人，為了外邦人，先放下了自己的門檻，和他們一同吃、一同住；現在他求他們，也放下新撿起來的門檻。全章最該被記住的動作是這個：要請人進門，先從自己的門檻走出來。不是要人先變成我們的樣子，是我們先走到他們站的地方——就像那位兒子，先生在律法以下。","這一週，每次你搞砸了一件事，在說「對不起」之前，先叫一聲「阿爸，父」，然後再認罪——用兒子的口氣認罪，不用僕人的口氣求情。另外挑一件你心裡還在「看日子」的事：一個不敢在某一天做的決定、一個吉不吉利的顧慮、一個「要先做到這個，神才會滿意」的條件，寫在紙上帶進禱告裡，問自己：在這件事上，我信靠的是誰？","最終整合：路司得城外，一間矮房子，夜裡。\n隔壁有一個婦人在生產，叫聲一陣一陣傳過來，接生的老婦人一直說：快了，快了。\n幾年前，有一個人被石頭打得半死，就是被拖到這城外丟下的。\n那時有幾個人圍著他。他爬起來，又走回城裡。\n後來，那幾個人成了一間小小的教會。\n今夜，他的信從遠方送到了。大家圍著一盞油燈，聽人一句一句地念。\n念到一半，念信的人停了一下，因為信上的口氣變了：\n我小子啊。\n寫信的人說，他又在陣痛了。上一次，是他們信主的時候；這一次，是因為他們想走回去。\n他沒有說，直等到你們像我。\n他說，直等到基督成形在你們心裡。\n隔壁的嬰孩生下來了，哭出第一聲。屋裡沒有人說話。\n有人想起，很久以前，也有一位兒子為女子所生，也哭過第一聲；\n後來在一個園子裡，祂用同樣的聲音叫過：阿爸，父。\n你的信仰路上，也許有一個人這樣為你痛過——帶你信主的長輩、深夜還在為你禱告的組長。\n也許你今夜正為一個走遠了的孩子痛著，不知道下一句該怎麼說。\n痛，可以說出來。成形，是神作的。\n你只要守在那裡，直等到基督的樣子，在那個人身上，一點一點長出來。"],"self":"這一章照出來的「有己」，第一個樣子是活成一個靠表現留下來的僕人：我需要清單、需要好日子、需要「再加上」一點甚麼，才敢相信自己在家裡；搞砸一次，就躲起來，等自己變好了才敢回去。\n第二個樣子是當上那個管人的師傅：我熱心待人，心裡卻要人熱心待我；我帶人，等的是他變成我的樣子、聽我的話。一個怕被趕出去，一個要把人關在外面——中心都是我，不是那位叫我們能稱祂「阿爸」的父。","t321":{"k":"耶穌是我的榜樣：祂是兒子，卻甘心站在奴僕的位置上——「為女子所生，且生在律法以下」（4:4）。祂第八天受割禮，一年一年上耶路撒冷守節；但祂從來不必靠守節證明自己是兒子，受洗的時候，天上的聲音早已說了「這是我的愛子，我所喜悅的」（太 3:17）。祂守在律法以下，是為了把在律法以下的人贖出來。這使我們想起客西馬尼園，祂在最黑的夜裡仍然叫「阿爸」。學祂，是不再靠任何日子與規條證明自己，卻甘心走進別人的處境，把人帶回家。","g":"讓耶穌作王：這一章要人讓出來的第一個位置，是「自己身分的審核員」。加拉太人把審核權交給割禮與日子；我們常把它交給自己的表現、別人的眼光，或一本農民曆。讓耶穌作王，是承認只有父能宣告我是誰，而祂已經宣告了。第二個要讓出來的，是「別人生命的塑造者」：保羅陣痛，卻說成形的是基督，不是他自己的翻版。讓耶穌作王，是帶人的時候不在他身上找自己。可以自己檢查：最近一次我覺得自己不算數，那是誰的聲音？","p":"建立屬神的體系：第 4 章給教會三個建造的方向。第一，作一個家，不作一道門檻：新來的人不必先通過一張清單才算家人，4:17 那種把人關在外面、好叫人來求的熱心，不可以在這裡；第二，建立屬靈父母的關係（235 的 3）：每一位初信者身邊，有一位願意為他「再受生產之苦」的人，陪他走反覆的路，目標寫清楚——是基督成形，不是複製帶領者；而陪伴人的人自己也要有人陪，因為保羅也會「心裡作難」；第三，像加拉太人接待病中的保羅那樣，讓有病、軟弱的人在這裡被接待，不被厭棄。這樣建起來的，是一群憑應許出生、彼此作家人的兒女。"},"grp":["【一、破冰】你小時候家裡，有沒有一個只有「自己人」才知道的稱呼或習慣——一個小名、一句暗號、一道只有過年才做的菜？是誰會這樣叫你、做給你吃？","【二、扎心】保羅問加拉太人：「怎麼還要歸回那懦弱無用的小學，情願再給他作奴僕呢？」（4:9）說一個具體的時刻：最近一次你覺得要先表現好一點，神才會接納你，是甚麼時候、為了甚麼事？或者，你在哪一件事上，仍然會看日子、求吉利、心裡不踏實？","【三、福音】「你們既為兒子，神就差他兒子的靈進入你們的心」（4:6）——不是你叫得夠好才成為兒子。說一個你記得的時刻：在甚麼地方、甚麼處境，你只叫得出一聲「主啊」或「阿爸」，卻發現自己被接住了？","【四、行動】這一個月，你身邊有沒有一個節日、家族聚會，或要「選日子」的決定？說出是哪一天、和誰；你打算怎樣參與、在哪一點上溫和而清楚地說「這個我不做」，又用甚麼具體行動表達對家人的愛與尊重。若沒有，說出一位你願意像 4:19 那樣陪他成長的人，這一週哪一天、用甚麼方式聯絡他。","【五、代禱】為三種人指名禱告：一位剛信主、在家裡因為不再拜祖先而承受壓力的弟兄姊妹；一位為走遠了的孩子或學生心裡作難的父母、老師或組長；一位曾經被教會的某一道門檻關在外面、從此不再來的人。"],"prac":{"main":"這一週，用兒子的口氣禱告，用父母的心腸陪人——不再走回奴僕的房間。","items":["對神：每天早上讀一次 4:4--7，把第 7 節的「你」換成自己的名字念出來；一天當中，每當發現自己又想用表現換神的接納，就停下來說一句：我是兒子，不是奴僕。週末寫下一件這一週父親在你身上作的事。","對自己：寫一張「再加上」清單——你心裡覺得「信耶穌還要再加上才算數」的東西：讀經的天數、奉獻的數目、服事的位置、某一種屬靈經歷。每一條旁邊寫一個字：「果」（是兒子長出來的果子）或「門」（是我當成進門的條件）。把寫著「門」的那幾條帶到主面前。","對人：找一位你曾經在信仰上幫助過、現在走遠或停住了的人，這一週聯絡他一次，不責備、不講道，只問近況，告訴他你一直記得為他禱告。若你自己為他心裡作難，也把這份難處告訴一位同工，請他和你一起扛。","對生活：檢查家裡、車上、手機裡，有沒有你仍然倚靠的吉凶物件或習慣——護身符、看日子、生肖運勢、風水擺設——禱告之後決定怎麼處理；同時為下一個家族節日預先想好一件表達孝敬的具體行動：帶一束花、幫忙準備團圓飯、陪長輩說說從前的事。","對使命：在你的小組或團契，檢查新朋友進來時要先「通過」甚麼——語言、穿著、教會用語、聚會的次數——才會被當作自己人。挑一道最具體的門檻，這一週向組長提出一個把它拆掉的作法。"]},"safe":["① 把 4:25、4:30 講成阿拉伯人或穆斯林就是「使女的兒女」，是被神趕出去、不能承受產業的民族。","保羅比的是兩個約、兩種出生方式（按血氣／憑應許），在他的比方裡夏甲對應的是「現在的耶路撒冷」——那些要外邦人受割禮的人，不是任何一個民族；這樣講會在講台上製造仇恨，也把福音的門關在一群人面前（紅線三，全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」）。","檢驗標準：一位阿拉伯裔或穆斯林背景的朋友坐在會眾席上，聽完會覺得神看顧他，還是覺得自己生來就被定罪？","② 把「現在的耶路撒冷……都是為奴的」講成猶太人被神棄絕，教會取代以色列，所以猶太人可以被輕看。","保羅自己是生來的猶太人（2:15），他在羅馬書說「神並沒有棄絕他預先所知道的百姓」（羅 11:2）；教會歷史上，這類講法曾經成為迫害猶太人的藉口（紅線三，全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」）。","檢驗標準：你有沒有明說「保羅比的是兩個約，不是兩個民族」？會眾走出去，對猶太人是更尊重，還是更輕看？","③ 把夏甲講成反派、罪人或「血氣」的化身，或說她和以實瑪利的後代受了咒詛。","創世記裡夏甲是被安排、被使用、後來被趕出去的使女，她卻是給神起名字的人：「看顧人的神」（創 16:13）；水用盡的時候，神「已經聽見童子的聲音了」（創 21:17）。比方裡她代表一個約，不是在評價她這個人。","檢驗標準：會眾席上一位曾經被利用、被拋棄的婦女聽完，是看見神也看顧她，還是覺得自己就是那個被趕出去的人？","④ 用 4:30「把使女和她兒子趕出去」趕走教會裡意見不同的弟兄姊妹、批評者或離開的人。","在比方裡要趕出去的是一個約——「信耶穌再加上割禮」那一套——不是一群人；拿這一節處理人事衝突，等於把保羅反對的排斥，用保羅的話再做一次。","檢驗標準：你講這一節時，會眾想到的是要除掉自己心裡「再加上」的那一套，還是想到要趕走某一個人？","⑤ 把 4:10 講成基督徒一切節慶都不可過：春節回家吃團圓飯、中秋賞月、清明掃墓一概妖魔化，叫初信者與家人斷絕往來。","保羅責備的是把日子當作與神關係的條件，或當作掌管禍福的力量，不是「有日子」；一概禁止是另一個軛，也讓家人以為信耶穌就是不要祖宗、不要家（立場三，全卷立場見議題「基督徒的自由：在律法主義與放縱之間」）。","檢驗標準：一位剛信主的年輕人聽完，是更有信心回家過年、活出見證，還是更怕回家？","⑥ 反過來，把祭祖燒香、向祖先求福、擇日看時辰、看風水輕輕說成「只是文化，沒有關係」。","4:8--9 說得清楚，那是「給那些本來不是神的作奴僕」；分辨的關鍵不是日子，是我在那一天信靠誰——團圓、追思、孝敬是文化，求問吉凶、向不是神的求福是信靠的對象換了（立場三，全卷立場見議題「基督徒的自由：在律法主義與放縱之間」）。","檢驗標準：你有沒有分清楚「哪些可以參與、哪些溫和地不做」，並且說出分辨的理由是「信靠誰」，而不是「哪一天」？","⑦ 用 4:10 論斷守安息日、守猶太節期，或過不過聖誕節、復活節的弟兄姊妹，把自己教會的作法講成屬靈與否的標準。","錯不在守或不守，在把守當成得救的條件（5:2--4）；保羅在別處說「各人心裡要意見堅定」（羅 14:5），又說「節期、月朔、安息日都不可讓人論斷你們」（西 2:16）。拿 4:10 製造新的規條，正是這一章反對的事。","檢驗標準：你講完，會眾是更自由地在基督裡過日子，還是多了一條判斷別人的標準？","⑧ 把 4:7「從此以後，你不是奴僕」講成「既然是兒子，怎樣活都可以，行為不重要」；或反過來說「兒子要表現好，才保得住名分」。","身分是宣告，不是進度，所以不靠表現保住；但兒子的身分會長出兒子的樣子，所以 4:19 說基督要「成形」。分清楚得救的條件與得救的果子，兩邊都要講（紅線二，全卷立場見議題「律法、稱義與『因信』」）。","檢驗標準：一位剛跌倒的人聽完，是敢回到父親面前、也願意改變，還是覺得反正沒差，或是覺得自己又被退回去了？","⑨ 用 4:12「要像我一樣」與 4:19「我小子啊」建立屬靈控制：帶領者要被帶的人像他、聽他、離不開他，否則就是不順服。","保羅的「像我一樣」是像他一樣不靠律法、只靠基督；他陣痛的目標是「基督成形」，不是複製自己；在孩子身上找自己，那是控制，不是生養（屬靈權柄回指哥林多後書立場三）。","檢驗標準：你帶過的人，今天是更像基督、更能自己到神面前，還是更依賴你、更怕你？","⑩ 用 4:16「我將真理告訴你們，就成了你們的仇敵嗎」為自己的嚴厲辯護：「你不喜歡我說的，就是不愛真理」。","保羅這一句後面緊接著的是「我小子啊」與「改換口氣」——他說真話，是帶著陣痛說的，而且巴不得換一個溫柔的語調；拿這一節把一切批評都打成「不愛真理」，會讓講員再也聽不見任何提醒。","檢驗標準：你被人反對的時候，第一個反應是檢查自己的口氣與動機，還是先替自己找一節經文？","⑪ 替 4:13 的「疾病」下定論（眼疾、瘧疾、癲癇），或說「保羅是因為信心不夠才生病」「真有能力的傳道人不會病」。","經文沒有說，本講義不猜；福音在加拉太正是從一個病人的口裡傳開的，加拉太人「沒有厭棄我」（4:14）。把病講成信心的失敗，是在病人身上再加一根刺（苦難與疾病回指哥林多後書立場二）。","檢驗標準：一位帶著病痛服事的同工聽完，是覺得被接納，還是覺得自己不夠格？","⑫ 對與父親關係受傷的人說：「叫不出『阿爸』，就表示你還沒有真正得救」，或要求他先原諒父親才能親近神。","4:6 說的是「你們既為兒子，神就差他兒子的靈」——先是兒子，然後靈在心裡呼叫；呼叫的是那靈，不是人憑自己叫得多順。對一位被父親傷害過的人，這樣講等於叫他在傷口上再證明自己一次。","檢驗標準：會眾席上一位不敢叫「爸爸」的人聽完，是知道那靈仍在他裡面替他呼叫，還是開始懷疑自己的得救？","⑬ 把 4:21--31 的寓意讀法推到別的經文：「保羅可以這樣讀，我們也可以在任何經文裡找出隱藏的意思」。","保羅自己標明「這都是比方」（4:24），是全本新約唯一明說在用寓意法的地方；照他的比方講滿可以，推到別處就打開了「經文可以說任何意思」的門（企劃書 4.7 丁）。","檢驗標準：你的講法離開 4:21--31 以後，還能不能從經文的上下文本身被檢驗？","⑭ 用處境取消原則：「割禮、節期是加拉太的問題，和今天的我們無關」；或反過來，把加拉太的處境細節直接搬成今天的規定。","書信三問的第三問要走完：處境是外邦信徒被要求受割禮、守節期才算數；原則是人進入神的家只有一個門——基督，任何「再加上」的門檻都是另一個福音；今天它落在入會的規矩、屬靈的清單、農民曆與家族的壓力裡（全卷立場見議題「書信的處境與原則」）。","檢驗標準：你有沒有具體說出，這一章的原則在你的教會、你的家裡，今天落在哪裡？","⑮ 把保羅講成情緒失控或不屬靈：「你看保羅也會害怕、也會不知道怎麼辦，可見他信心軟弱」；或反過來把他講成永遠知道答案的英雄。","4:11 的「我為你們害怕」與 4:20 的「心裡作難」是一位屬靈父母真實的心；保羅沒有把擔心蓋起來，也沒有讓它變成控制。兩種講法都會讓正在陪人走路、心裡作難的人更孤單。","檢驗標準：一位正為某人心裡作難的組長聽完，是更敢把難處說出來、交給主，還是更覺得自己不該有這種感覺？"]},{"n":5,"t":"你們當順著聖靈而行","sub":"軛、酵、果","lv":"A","arc":"新造的人","sec":[["5:1--6","基督釋放了我們，叫我們得以自由：不要再被奴僕的軛挾制"],["5:7--12","你們向來跑得好：一點麵酵能使全團都發起來"],["5:13--15","總要用愛心互相服事：自由不是放縱"],["5:16--21","你們當順著聖靈而行：情慾和聖靈相爭"],["5:22--26","聖靈所結的果子：同釘在十字架上"]],"serm":{"pts":[["站立得穩","5:1--12","「基督釋放了我們，叫我們得以自由」——加上割禮，「基督就與你們無益了」"],["自由的方向","5:13--15","「總要用愛心互相服事」——原文是彼此作奴僕：被釋放的人，自由地去服事"],["一個果子","5:16--26","「聖靈所結的果子」——肉體的作為是複數，聖靈的果子是單數；所以「當順著聖靈而行」"]]},"q":"你有沒有發現，你在教會裡很有耐心，回到家卻很容易對最親的人發脾氣？或者，你對自己的要求越來越多：讀經要讀滿、聚會不能缺、服事不能推，做到了就覺得神比較喜歡你，做不到就整個禮拜抬不起頭？\n也許你走的是另一邊：你早就聽懂了「得救本乎恩」，所以有些事你心裡知道不對，卻告訴自己「反正神會饒恕」。\n這一章要問的是：被基督釋放的人，到底要往哪裡走？是回去背一副新的軛，還是把自由交給自己的私慾——還是有第三條路，叫做「順著聖靈而行」？","truth":"基督已經釋放了我們，所以我們不必再靠任何「再加上」的條件站在神面前；被釋放的人，也不把自由交給肉體，而是藉著愛彼此服事。\n這樣的生命不是一張越列越長的功課表，是聖靈在我們裡面結出的一個果子——那位愛我、為我捨己的基督，在我身上長出來的樣子。","mv":{"t":"聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。這樣的事沒有律法禁止。","r":"加5:22-23"},"card":["這一章講自由往哪裡走。前半章，保羅擋住回頭背軛的人：基督加上割禮，不是更穩，是基督無益；後半章，他擋住拿自由放縱的人：自由是為了彼此作愛的奴僕。兩邊中間有一條路，叫做順著聖靈而行——那條路上長出來的，不是一張功課表，是一個果子。身分在前四章已經換了，從這一章起，走路的方式也要跟著換。","這一章的第一個動詞，主詞是基督：「基督釋放了我們」，而且已經做成了。神仍然在召人——「那召你們的」是現在分詞；聖靈在信徒裡面與肉體相爭，引導人，結出果子；連「攪擾你們的，無論是誰」，神也親自擔起審判，不交給教會去執行。人在這一章要做的事很多，但每一件都站在神已經做成的事上：站穩、服事、跟上，都是回應，不是交換。","第 26 節「不要貪圖虛名」，原文 κενόδοξοι（kenodoxoi）由兩個字合成：「空的」加上「榮耀」。那是一個包裝很漂亮、打開裡面卻甚麼也沒有的禮盒。這改變今天的讀法：按讚數、職稱、在教會裡被點名感謝的次數、誰的小組人比較多，都可能是一個空盒子；為了它，我們挑釁比自己弱的，嫉妒比自己強的。聖靈的果子正好相反：外面不起眼，裡面是滿的。","這一章照出來的我，常常有兩副面孔。在教會裡，我很會守規矩，也很會看出別人哪裡不夠屬靈；回到家，對配偶和孩子卻缺少恩慈和忍耐。另一面，我心裡清楚有一兩件事不對，卻拿「我已經不在律法以下」替它開門。一個是把自己綁緊，一個是把自己放鬆；兩種樣子，坐在中心的都還是我。","「總要用愛心互相服事」（5:13），原文是「藉著愛，彼此作奴僕」。全章最大的翻轉在這裡：基督救我們脫離奴役，不是叫我們從此只為自己活，而是叫我們用自由去選擇服事。被逼的人才算計做了多少；被愛的人不算，因為他是甘心的。而且是「彼此」——我服事人，也讓人服事我，沒有一個人只能付出，也沒有一個人只坐著被服事。","這一週做一件事：挑一個你最常「破功」的地方——通常是家裡的餐桌、早上出門前的十分鐘，或是下班後回訊息的那一刻——在那裡刻意慢下來，讓一句恩慈的話先出口。單數的果子不分房間；它若只在教會裡結，在家裡不結，那多半還是我在表現。週末寫下一次你被聖靈攔住、沒有咬人的時刻，為它感謝神。","最終整合：加拉太高原上，一間農舍，黃昏。\n牆上掛著一副舊軛，木頭被牛的頸項磨得發亮。今天沒有人取它下來。\n那頭牛在院子裡站著，頸上空空的，還不太習慣，偶爾低一下頭，像在找那根橫木。\n灶邊，一團麵用布蓋著。主婦早上只放了一小塊酵，到傍晚，整團都發起來了。\n她笑著說，酵就是這樣，你看不見它在哪裡，卻嘗得出它在每一口。\n門外有人敲門，說還要再帶一副新的軛來，說那一副比較好看，比較屬靈。\n屋主沒有開門。他只指一指牆上那副舊的：我們已經背過了，不必再背。\n桌上擺著一盤無花果，是院子裡那棵老樹結的。\n沒有人教它結果子。它只是一年一年站在那裡，根往下紮，到了時候，枝子就垂下來了。\n一家人圍著桌子坐下，老的少的，把餅掰開，把果子分給彼此。\n這個家裡沒有誰是奴僕，可是每一個人都在替別人遞東西。\n原來自由不是一個人站在空曠的院子裡，\n是在那位釋放我們的主身邊，學著彼此作愛的奴僕；\n原來那一個果子，不必咬著牙擠出來——\n是那位愛我、為我捨己的主，在我裡面活著，\n慢慢地，叫我的枝子也垂下來，給餓的人吃。"],"self":"這一章照出來的「有己」，第一個樣子是加碼：我信靠基督，卻偷偷再加一點我自己——我的資歷、我的出席率、我守得比別人好的規矩，然後用這些東西去量別人，覺得他們不夠屬靈。教養孩子時，我也常常把「你要先乖，我才愛你」說出口。\n第二個樣子是放水：我把「不在律法以下」聽成「沒有人可以管我」，把私慾叫作自由，把苛刻叫作坦率，把冷淡叫作界線。兩種樣子方向相反，中心都是我——一個要靠自己站穩，一個要照自己的意思活。","t321":{"k":"耶穌是我的榜樣：主耶穌是全地最自由的人。他說「沒有人奪我的命去，是我自己捨的」（約 10:18），沒有任何人、任何規矩能逼他；可是他用這份自由做的事，是拿起毛巾，彎下腰，洗門徒的腳，然後說「你們也當彼此洗腳」（約 13:14）。他也不是一個不會說不的人：群眾要留住他，他說「我們可以往別處去」（可 1:38）；他會哭，也會發怒。九種滋味在他身上是一個生命，不是九項表現。學他，就是用自由去服事，而不是用服事去換取自由。","g":"讓耶穌作王：這一章要人讓出兩個位置。第一個是「替自己加分的人」：我不再在基督後面加上我的表現、我的宗派標記、我守得比別人好的規矩，承認只有他釋放得了我。第二個是「自己私慾的主人」：自由不是我想怎樣就怎樣，是讓聖靈握住方向，一步一步跟著走。讓耶穌作王，不是把自己取消，而是把王位交還給那位愛我、為我捨己的主；我的感受、判斷、說不的能力都還在，只是不再坐在中間。可以自己檢查：這一週我最後一次很想咬人的時候，是誰在決定我開口說甚麼？","p":"建立屬神的體系：第 5 章給教會三根柱子。第一，進門的條件只有一個：信靠基督。不讓任何服裝、用語、聚會次數、宗派標記變成「再加上」，新朋友第一次來，不必先學會一整套規矩才算自己人。第二，服事是「彼此」的：排班表要有人輪替、照顧者也要有人照顧，不讓同一群人一直付出、另一群人一直被服事。第三，衡量一位同工，先看他身上那一個果子的滋味，再看他的恩賜與果效；遇到爭論，先停止相咬相吞，再談是非。這樣建起來的，不是一群很會守規矩的人，也不是一群各行其是的人，是一群跟著同一位聖靈走路、彼此作愛的奴僕的人。"},"grp":["【一、破冰】你有沒有一件從小被規定、長大才發現其實不必那麼做的事？例如吃飯一定要吃完、某一天不能剪頭髮、考試前不能吃某樣東西。你後來是怎麼放下它的？","【二、扎心】「你們這要靠律法稱義的，是與基督隔絕，從恩典中墜落了。」（5:4）說一件具體的事：最近一次你覺得「神今天應該比較喜歡我」，是因為你做了甚麼？最近一次你覺得「神今天大概不想理我」，又是因為甚麼？","【三、福音】保羅說「基督釋放了我們，叫我們得以自由」（5:1），這是已經做成的事。說一個時刻：哪一年、在哪裡，你第一次真正明白自己不必再證明甚麼，神就已經接納你？是誰的一句話、哪一節經文、哪一件事讓你明白的？","【四、行動】說出這一週你最容易「咬人」的一個場合（家裡的哪個時段、公司的哪個會議、哪一個群組），和那裡的一個人（說出關係或名字）；再說出你打算在那個場合先說出口的一句恩慈的話，以及你要在哪一天試。","【五、代禱】為三種人指名禱告：一位被教會的規矩壓得喘不過氣、覺得自己永遠不夠好的人；一位心裡知道某件事不對、卻一直拿恩典當藉口的人，求聖靈溫柔地攔住他；一位在教會或家裡長期付出、從來沒有人問他累不累的照顧者，求主差人來服事他。"],"prac":{"main":"這一週，不在基督後面加任何東西，也不把自由交給私慾——跟著聖靈，一步一步走。","items":["對神：每天早上讀一次 5:1 與 5:22--23，用一句話告訴主：「今天我不靠表現站在你面前。」晚上回想今天哪一刻嘗到了那一個果子的某一種滋味（一句忍住的話、一份沒來由的平安），為它感謝。","對自己：這七天，抓出你心裡的一個「再加上」——「我要先讀完經才配禱告」「我要先戒掉這個才配去聚會」，把它寫下來，劃掉，旁邊寫上「基督釋放了我們」。同時也抓出一件你一直拿恩典替它開門的事，具體寫下這一週你要怎樣不再給它機會。","對人：找一位你這陣子常和他起衝突的人（家人、同事或同工），這一週主動為他做一件小小的服事——倒一杯水、接一段他做不完的工作、替他說一句好話；同時也讓一個人服事你一次，不推辭。","對生活：選一個你最常破功的時段（早上出門前、下班回家第一個小時），這一週在那個時段把手機放下，先禱告一句「聖靈，我跟著你走」再開口。若你發現自己又咬了人，當天就道歉，不拖到明天。","對使命：在你的小組或服事團隊裡，檢查一件可能變成「再加上」的事——服裝、用語、出席要求、加入同工的門檻，問一問：這是幫助人更靠近基督，還是新朋友進門前要先過的關？若是後者，這一週向負責的人提出具體建議。"]},"safe":["① 把 5:24「已經把肉體連肉體的邪情私慾同釘在十字架上」講成「基督徒要壓抑一切感受，不可以生氣、難過、說不」。","釘上十字架的是失序、轄制人的私慾，不是人的情感本身；保羅在這封信裡會希奇、會心裡作難、會當面抵擋。第 2 章講過，「現在活著的不再是我，乃是基督在我裡面活著……他是愛我，為我捨己」（2:20），不再是我不是取消人格，是被愛的我換了主人（紅線一）。","檢驗標準：一位長期把委屈吞下去的人聽完，是覺得可以把感受帶到主面前，還是覺得又多了一個要壓下去的理由？","② 把 5:24 的「同釘」講成「我每天都要努力把自己釘死」，叫會眾用更多的自責與苦修對付肉體。","5:24 是不定過去式，指信主歸入基督那一刻已經作出的決定；2:20 的「同釘」是完成式被動，是神作成的。講成每天的自我處決，會把恩典變成另一副軛，正是本章要拆掉的東西（紅線一）。","檢驗標準：會眾聽完，是更安息在已經作成的事上順著聖靈而行，還是更努力地跟自己作對？","③ 用 5:13「用愛心互相服事」要求某些人無限付出、不可以累、不可以說不，或要受傷的人默默忍受。","原文是「彼此作奴僕」，是雙向的；愛裡的服事是被釋放的人甘心的選擇，不是被逼出來的奴役。講成單向的要求，會把照顧者燒盡，也讓受傷的人以為留在傷害裡才算屬靈（紅線一、紅線八）。","檢驗標準：一位長期照顧家人、或在服事上透支的人聽完，是覺得被看見、也可以被人服事，還是覺得自己還不夠犧牲？","④ 把 5:1--6「不要再被奴僕的軛挾制」講成「行為不重要，基督徒怎樣生活都可以」，好像本章只有前半段。","保羅在同一章說信心是「使人生發仁愛的信心」（5:6），又說行那些事的人必不能承受神的國；他拆掉律法主義，馬上轉身擋住放縱（紅線二，全卷立場見議題「律法、稱義與『因信』」、議題「基督徒的自由：在律法主義與放縱之間」）。","檢驗標準：一位正拿「恩典」替某件事開門的人聽完，是覺得被放行，還是被溫柔地攔下來？","⑤ 反過來，把 5:19--23 講成一套新的規條：開出「基督徒不可以做的十五件事」與「每月操練一種果子」的功課表，或把守規矩當作進教會、作同工的條件。","肉體的作為是複數，聖靈的果子是單數；把果子拆成九項功課，就是用新的律法主義取代舊的。得救的條件是信靠基督，生命的改變是得救的果子，不可倒過來（紅線二）。","檢驗標準：會眾聽完，是更想連在基督身上，還是更想拿一張表給自己和別人打分數？","⑥ 用 5:4「從恩典中墜落了」嚇唬軟弱、跌倒的信徒：「你再這樣下去，就會失去救恩」。","5:4 的主詞是「要靠律法稱義的」，墜落的方向是離開恩典去靠自己的表現，不是犯了一個罪就掉下去；會不會失去救恩，加爾文派與阿民念派並陳於議題頁，兩派都同意回來的路就是回到恩典（紅線六）。","檢驗標準：一位很怕自己已經掉出恩典的人聽完，是更有得救的確據、更敢回到主面前，還是更恐慌？","⑦ 把 5:21「行這樣事的人必不能承受神的國」講成恐嚇：「你有嫉妒、發過脾氣、喝醉過一次，就進不了天國」。","「行」是現在分詞，指以這些事為生活方式、安然住在其中的人，不是偶然跌倒、心裡痛悔的人；6:1 已經為「偶然被過犯所勝」的人留了回來的路。這一句不可刪去，也不可拿來使人懷疑自己的得救（紅線六）。","檢驗標準：你有沒有同時說出「它擋住放縱」和「跌倒的人有回來的路」？聽了心裡發痛的人，是被推開，還是被帶回來？","⑧ 把 5:10「攪擾你們的」、5:12「攪亂你們的人」直接套在今天某個宗派、某位牧者或意見不同的弟兄姊妹身上，或把「要受割禮才算完整」講成保羅自己也有的主張。","要外邦信徒加上割禮，是攪擾者的主張，不是保羅的；保羅把審判交給神（「必擔當他的罪名」），自己不執行。隨便給人貼上「攪擾者」的標籤，等於拿這兩節做保羅沒有做的事（全卷立場見議題「『攪擾你們的人』是誰？」）。","檢驗標準：你有沒有說清楚「這是誰的主張」？會眾走出去，是更警醒自己有沒有給人加條件，還是更會指認別人？","⑨ 用 5:12「恨不得……把自己割絕了」為講台上、網路上辱罵意見不同的人辯護：「保羅都這樣說，我們罵兩句有甚麼關係」。","保羅對準的是拆毀羊群的教師，說的是交給神的願望，不是號召教會動手；他的怒氣是為了別人的自由，不是自己的面子。拿來合理化刻薄，正好掉進同一章的「相咬相吞」（5:15）。","檢驗標準：你講完這一節，會眾是更敢在群組裡罵人，還是更警醒自己有沒有在十字架之外給人加條件？","⑩ 把 5:19--21 的清單只講成性與酒，略過「仇恨、爭競、忌恨、惱怒、結黨、紛爭」，讓守規矩的人覺得自己安全。","十五樣裡最大的一組是人際的毀壞；一位從不喝酒、卻在教會裡拉幫結派的人，同樣活在肉體裡。只講前後兩組，會讓台下最會守規矩的人錯過這一章對他說的話。","檢驗標準：會眾聽完，是只想到「外面那些放縱的人」，還是也想到自己在小組和同工會裡的嫉妒與紛爭？","⑪ 用 5:20「邪術」把華人處境裡的一切習俗都講成拜偶像，或反過來說求籤、算命、改運、看風水「只是文化，沒關係」。","分辨的關鍵不在習俗本身，在信靠誰：把未來交給符咒、卦象與另一種力量，是給那些本來不是神的作奴僕；團圓、追思、敬重長輩卻是可以保留的文化（全卷立場見議題「基督徒的自由：在律法主義與放縱之間」）。","檢驗標準：一位剛信主、家裡仍有長輩拜拜的人聽完，是知道怎樣分辨、也知道怎樣尊重家人，還是只覺得被定罪或被放任？","⑫ 把 5:16--18「被聖靈引導」講成一種私人的感覺，拿「聖靈帶領我」替自己的決定背書，誰也不能質疑。","本章的聖靈引導有可以檢驗的方向：不放縱肉體、不在律法以下、結出那一個果子、不貪圖虛名；用「聖靈帶領」擋住一切勸告，常常是給肉體開門的另一種說法。","檢驗標準：你有沒有說出「聖靈的引導會結出仁愛、溫柔、節制，而且經得起弟兄姊妹的察驗」？","⑬ 用處境取消原則：「割禮是第一世紀猶太人與外邦人的問題，跟我們無關」；或反過來，把今天的某一種文化習慣說成就是割禮，一概定罪。","書信三問的第三問要走完：原則是在基督之外不加任何得救或被接納的條件，自由要用在彼此服事；處境是加拉太的割禮與節期。今天它落在服裝、用語、出席率、宗派標記、會員資格上——判斷的理由要說出來（全卷立場見議題「書信的處境與原則」）。","檢驗標準：你有沒有具體說出，這一章的原則今天在你的教會落在哪裡，並且說出判斷的理由？","⑭ 把這一章講成 321 的插圖：先講 920，再拿 5:22--23 來印證，或把「9」講成團契要操練的九門課。","次序是經文先講：單數的果子、肉體與聖靈、5:24 的同釘，然後 321 才在末端接上；9 是一個生命，是第 2 章「基督在我裡面活著」長出來的樣子，不是九項功課（鐵律五）。","檢驗標準：會眾聽完，記住的是一套團契的術語，還是那位在他裡面活著、結出果子的基督？"]},{"n":6,"t":"只誇我們主耶穌基督的十字架","sub":"擔、種、印","lv":"A","arc":"新造的人","sec":[["6:1--5","你們各人的重擔要互相擔當：重擔與擔子"],["6:6--10","人種的是甚麼，收的也是甚麼：行善不可喪志"],["6:11--16","只誇我們主耶穌基督的十字架：作新造的人"],["6:17--18","我身上帶著耶穌的印記：弟兄們"]],"serm":{"pts":[["一起扛與自己背","6:1--5","「你們各人的重擔要互相擔當」，「各人必擔當自己的擔子」——一個要一起扛，一個要自己背"],["撒種與收成","6:6--10","「人種的是甚麼，收的也是甚麼」——這不是報應的帳本，是生命的方向：「到了時候就要收成」"],["只誇十字架","6:11--18","「只誇我們主耶穌基督的十字架」——對手要誇別人肉體上的記號，保羅身上帶著「耶穌的印記」"]]},"q":"你身上有沒有一個記號，是你很想讓人看見的？一張文憑、一個頭銜、一個「我們教會今年受洗多少人」的數字、一個考上好學校的孩子、一份別人一看就點頭的履歷。\n你身上又有沒有一個記號，是你一直藏著的？一段跌倒過的日子、一份撐了很多年沒有人知道的照顧、一道別人看了會皺眉的疤。\n保羅在這封信的最後幾行，把筆拿過來親手寫：別人要誇的是加拉太人身上的記號，他卻說「我身上帶著耶穌的印記」（6:17）。這一章要問的是：走到最後，你想讓人在你身上看見的，是誰的名字？","truth":"保羅「只誇我們主耶穌基督的十字架」（6:14）；因這十字架，割禮與不割禮都不算數，「要緊的就是作新造的人」（6:15）。\n新造的人不再需要別人身上的記號來撐面子，他身上帶著的是屬於耶穌的印記——扛彼此的重擔，背自己的擔子；而這一切，最後收在原文阿們之前的最後一個字裡：「弟兄們」。十字架之下，我們是一家人。","mv":{"t":"但我斷不以別的誇口，只誇我們主耶穌基督的十字架；因這十字架，就我而論，世界已經釘在十字架上；就世界而論，我已經釘在十字架上。","r":"加6:14"},"card":["這一章是加拉太書的落地與收筆。前半章，保羅把「靠聖靈行事」放進一間教會的日常：有人跌倒了怎樣挽回、誰的重擔要一起扛、誰的擔子要自己背、教導的人怎樣被供應、累了的人怎樣不鬆手；後半章，他親筆寫下全卷的結論：別人要誇肉體上的記號，他只誇十字架；割禮不割禮都不算，要緊的是新造。全章一句話：被十字架重新造過的人，活成一個彼此扛擔子的家。","這一章真正動手的是神。是神的靈在人裡面結出溫柔，叫屬靈的人去接骨，而不是去定罪；是神「輕慢不得」，人不能把祂當傻瓜，卻也是祂定下收成的時候，不叫忠心撒種的人白白勞苦；是神藉著基督的十字架，把世界與保羅彼此釘住，叫他不再被面子綁著；是神在基督裡作新的創造，把外邦人和猶太信徒一起收進祂的子民；也是祂的恩，從這封信的第一章，一直包到最後一個字。","第 16 節「凡照此理而行的」，「此理」原文是 κανόνι（kanoni），量尺、準繩；「行」是 στοιχήσουσιν（stoichēsousin），排成一列、照著步伐前進。保羅最後留給教會的，不是一本加長版的規條，是一把尺：只誇十字架，作新造的人。這改變今天的讀法：我們常拿別的尺量自己和別人——出席人數、奉獻多少、學歷頭銜、會不會說教會的用語。6:16 只問一件事：這個人、這間教會，是不是照著十字架與新造這一把尺在走路？","這一章照出來的我，常常在別人身上找成績。我帶的小組有多少人、我輔導過的人有沒有「變好」、孩子有沒有讀好學校、我負責的事工有沒有被看見——像那些人「要藉著你們的肉體誇口」（6:13），我把自己的面子寫在別人身上。另一面，看見別人跌倒，我心裡先鬆一口氣，覺得自己還不錯；這正是「人若無有，自己還以為有，就是自欺了」（6:3）。","「但我斷不以別的誇口，只誇我們主耶穌基督的十字架」（6:14）。全章最該被記住的，是這個「但我」：前一節是「他們」要誇別人的肉體，這一節保羅轉過身，把全部的誇口押在一個羅馬人處死奴隸的刑具上。翻轉在於，我不必再讓任何成績替我說話；十字架已經替我說完了最要緊的一句——我被愛到這個地步。從這裡出發，扛別人的重擔不再是為了被看見，背自己的擔子也不再是羞恥。","這一週拿一張紙，畫兩欄。左欄寫「我自己的擔子」：該我負責的工作、該我面對的過錯、該我作的決定；右欄寫「壓著我站不起來的重擔」：照顧、病痛、失業、失去。左欄挑一件，這週自己做完，不推給別人；右欄挑一件，這週在小組或向一位信得過的人說出來，請他具體接手一個時段或一件事。讓「信徒一家的人」真的成為一家。","最終整合：路司得，一間信徒的家，黃昏。\n一封從遠方送來的信，在燈下被讀出來。讀信的人讀得很慢，屋子裡沒有人說話。\n這封信很嚴厲。開頭沒有感恩，第一句就是「我希奇」。\n讀到後來，有人低下了頭：前幾個月，他們差一點就去受了割禮，好讓那幾位遠來的客人點頭。\n然後讀信的人停了一下，把信轉向燈光——最後幾行，字忽然變大了。是他自己的手寫的。\n「但我斷不以別的誇口，只誇我們主耶穌基督的十字架。」\n坐在角落的一位老人，想起幾年前城外那一堆石頭，和那個被拖出去、大家都以為已經死了的人。\n後來那人站起來，又走回城裡。\n信上說：受割禮不受割禮都不算甚麼，要緊的是作新造的人。\n老人看看身邊——一個從前拜宙斯的鐵匠，一位猶太母親，一個前些日子跌倒、又被扶起來的年輕人。\n他們身上沒有同一個記號，卻坐在同一張桌子邊。\n信上說：我身上帶著耶穌的印記。\n老人記得那些疤。那些疤不是叫人看他，是叫人知道他是誰的人。\n最後一個字讀出來了。不是命令，不是警告。\n是一聲稱呼：弟兄們。\n屋子裡，有人哭了。\n如果你今夜也在想，自己身上的記號夠不夠體面——\n請你聽：十字架已經替你說完了一生的誇口，新造已經在你身上開始，\n你為愛熬過的夜、挨過的白眼，主都認得；\n而這封信阿們之前的最後一個字，也是寫給你的：弟兄們。"],"self":"這一章照出來的「有己」，第一個樣子是借別人的身體撐自己的面子：我要的不只是那個人好起來，是他的好起來可以記在我的帳上——孩子的成績、學生的表現、小組的人數、我帶信主的名單；對手願意加拉太人受割禮，「不過要藉著你們的肉體誇口」（6:13），我也常常這樣。\n第二個樣子是在重擔面前躲開或逞強：要麼用「各人必擔當自己的擔子」把人推開，要麼一個人把所有人的擔子都扛上身，不讓任何人知道我撐不住——前者是冷漠，後者常常是另一種驕傲；兩種樣子的中心，都還是我。","t321":{"k":"耶穌是我的榜樣：耶穌是真正扛起別人重擔的那一位，他說「凡勞苦擔重擔的人可以到我這裡來，我就使你們得安息」（太 11:28），最後「背著自己的十字架出來」（約 19:17），把我們扛不動的罪與咒詛背上各各他。可是同一位主，也會對累壞了的門徒說「你們來，同我暗暗地到曠野地方去歇一歇」（可 6:31）——他扛重擔，卻不被眾人的期待牽著走。他挽回跌倒的彼得，用的是炭火旁的三次問話，不是公開的審判。復活以後，他身上仍然帶著釘痕，讓多馬伸手來摸：那不是神蹟的展示，是愛留下的印記。","g":"讓耶穌作王：這一章要人讓出來的第一個位置，是「誇口的寶座」。6:14 說只誇十字架，意思是我的成績、我的名聲、我帶出來的人，都不能再坐在那個位置上替我證明我是誰。第二個要讓出來的，是「收成的時間表」：6:9「到了時候」是神的時候，不是我的業績表；我可以撒種，不能催熟。第三個要讓出來的，是「救世主的位置」：我不是每一個人的重擔都得一個人扛的那一位，基督才是。可以自己檢查：這一週我最想讓人看見的是甚麼？我最怕被人看見的又是甚麼？兩個答案都交給他。","p":"建立屬神的體系：第 6 章把一群人建成「信徒一家的人」（6:10）。第一，教會要有挽回的路：有人跌倒，由靠聖靈行事、溫柔而自省的人去接，不是公審，也不是假裝沒事；若過犯傷害了別人，先保護受傷的人。第二，教會要有分擔重擔的結構：長期照顧者、病人家屬、失業的人，不靠一兩位熱心人硬撐，而是排班、輪替、彼此代禱，也讓照顧者自己有喘息的時間。第三，供應教導的人，財務公開，不讓傳道人羞於開口，也不讓供應變成交易。第四，用 6:16 那一把尺量事工：不看人數與面子，看有沒有人被十字架重新造過。這樣建起來的，是一個家，不是一張成績單。"},"grp":["【一、破冰】你身上有沒有一道疤，或一個用久了的痕跡——手上的繭、膝蓋的舊傷、一雙磨平的鞋？它是怎麼來的？有沒有哪一道痕跡，你後來反而有點珍惜？","【二、扎心】保羅說那些人「不過要藉著你們的肉體誇口」（6:13）。說一個具體的人：最近一次，你希望誰的表現替你掙面子（孩子、學生、組員、下屬）？在甚麼場合？當他沒有表現好的時候，你第一個反應是心疼他，還是覺得自己丟臉？","【三、福音】保羅「只誇我們主耶穌基督的十字架」（6:14），因為在那裡，基督已經為我們受了咒詛。說出一個時刻：哪一年、在哪裡，你發現自己不必靠任何成績，也被神接納了？那時你身邊是誰？","【四、行動】從 6:2 與 6:5 各選一件：說出這一週你要自己負起責任的一件事（該道歉的人、拖延的工作、該面對的決定），在哪一天做；再說出一位正被重擔壓著的人（名字或關係），你這週在哪一天、用甚麼方式（送飯、接送、陪診、代班）具體分擔一個小時。","【五、代禱】為三種人指名禱告：一位長期照顧家人、已經很累卻不敢說的人，求主讓他身邊有人接手、讓他得著喘息；一位偶然被過犯所勝、正羞於回到教會的人，求主差溫柔的人去挽回他；一位忠心撒種多年卻看不見收成的傳道人或主日學老師，求主堅固他不灰心。"],"prac":{"main":"這一週，把誇口交回十字架：自己的擔子自己背，壓垮人的重擔一起扛。","items":["對神：每天早上慢慢讀一次 6:14，把你最想讓人看見的一樣東西（成績、頭銜、孩子、事工）說出來，放在十字架前，禱告說：主，我只誇你的十字架。晚上回想：今天有沒有哪一刻，我又拿別的東西撐面子？","對自己：用 6:4「察驗自己的行為」作一次盤點：寫下三件屬於「我自己的擔子」、卻一直推給別人或拖著不做的事，這週至少完成一件；同時寫下一件你正在獨自硬撐的重擔，不再假裝沒事。","對人：這週主動找一位你知道正在長期照顧家人、或剛經歷失落的弟兄姊妹，提出一個具體的幫忙（某天晚上送一頓飯、某個週六替他看顧兩小時），不給建議、不說「你一定是種了甚麼」，只問：哪一部分，我可以接手？","對生活：檢查你把時間與力氣「種」在哪裡：連續七天，睡前記下今天花最多時間的三件事；週末看一看，哪些是順著情慾撒種，哪些是順著聖靈撒種，挑一件，下週調整一個具體的時段。","對使命：在你所屬的小組或事工裡，提出一個「信徒一家的人」的分擔安排：為一位長期照顧者排一份輪班表、為一位生病的同工安排一個月的送餐，或為主日學老師安排輪休；同時照 6:6 的原則，了解你的教會怎樣供應傳道人，有需要就向負責的人提出具體建議。"]},"safe":["① 把 6:7「人種的是甚麼，收的也是甚麼」講成因果報應、業報，對受苦的人說「你一定是種了甚麼」「這是你活該」。","6:8 保羅自己解釋了撒種：是順著情慾或順著聖靈的生命方向，收成是敗壞或永生，不是一筆一筆的苦難帳；主耶穌在生來瞎眼的人身上明說「也不是這人犯了罪，也不是他父母犯了罪」（約 9:3）（紅線七）。","檢驗標準：一位正在病中、失業或剛失去親人的人聽完，是覺得被定罪，還是覺得神沒有輕看他的勞苦？","② 把 6:7--9 講成奉獻投資：「你今天種下多少奉獻，明天就收回多少倍的錢財、健康、生意」。","6:8 的收成是「永生」，不是存款；把撒種講成交易是成功神學的變形，也會讓貧窮或病中的人覺得自己被神虧待了（紅線七，回指哥林多後書紅線三）。","檢驗標準：會眾聽完，是在想「我投多少能回本」，還是在想「我的生命這一週往哪一塊田走」？","③ 把 6:2「互相擔當」講成無限付出，要長期照顧者、同工或家裡最肯扛的那一個人「再撐一下，這是背十字架」，不許他說累、說不。","6:2 的主詞是「彼此」，是一群人，不是最肯扛的那一個；6:5 φορτίον（phortion）提醒每個人也有自己要顧的背包，包括照顧者自己的身體、婚姻與信仰。要人無限付出，會把照顧者壓到崩潰（紅線八）。","檢驗標準：一位照顧失智父母多年的人聽完，是得到有人接手的盼望，還是又多了一份罪咎？","④ 反過來，用 6:5「各人必擔當自己的擔子」為冷漠辯護：「那是他自己的問題」「教會不是慈善機構」。","6:5 的 φορτίον 是自己背得起的行囊，6:2 的 βάρη（barē）是壓垮人的重擔；把重擔說成個人的擔子，就是拒絕「完全了基督的律法」（紅線八）。","檢驗標準：你有沒有幫會眾分辨「這是他背得起的，還是已經把他壓垮的」？教會裡最孤單的那個人聽完，是被找到，還是被推開？","⑤ 用 6:14「我已經釘在十字架上」與 2:20「不再是我」叫人壓抑感受、不可以說不、忍受傷害：「你已經死了，就不該覺得受傷」。","2:20 同一節說「他是愛我，為我捨己」（2:20）；被釘的是那一套用面子與記號量人的世界，不是人的感受與人格；ἐσταύρωται（estaurōtai）是完成式被動，是神作成的，不是我每天努力把自己打死（紅線一）。","檢驗標準：一位在家中或教會裡長期被傷害的人聽完，是更敢說「這樣不對」，還是更覺得自己不該有感覺？","⑥ 把 6:17「耶穌的印記」講成聖痕神蹟——身上忽然出現釘痕——或鼓勵人追求身上的記號、異象來證明屬靈等級。","στίγματα（stigmata）是烙在奴僕身上標明主人的記號，上下文指為福音受的傷，像路司得的石頭（徒 14:19）；講成神蹟，就把一個為愛受苦的見證變成新的「肉體上的記號」，正好走回 6:12 對手的面子。","檢驗標準：會眾聽完，是想去找自己身上的神蹟記號，還是想知道自己這一生為誰留下了痕跡？","⑦ 把 6:16「神的以色列民」講成神棄絕了猶太人、教會取代了以色列，或順勢輕看今天的猶太人，乃至阿拉伯人與穆斯林。","本講義採「就是」讀法為主要判斷，但保羅在羅馬書斷然說「上帝棄絕了他的百姓嗎？斷乎沒有！」（羅 11:1）；6:12 揭穿的是一群具體教師的動機，不是一個民族（紅線三，全卷立場見議題「在基督裡成為一：族群、性別、以色列與教會」）。","檢驗標準：一位猶太裔或穆斯林背景的朋友坐在會眾席上，聽完會覺得被接納，還是被當成反面教材？","⑧ 把 6:12--13「攪擾你們的人」的主張講成保羅的，或隨手給今天意見不同的弟兄姊妹、別的宗派貼上「希圖外貌體面」「傳割禮的」標籤。","「勉強你們受割禮」是對手的主張，保羅是在揭穿它；他揭穿的是在基督後面加一個「和」字的動機，不是給所有異見者定罪的許可（紅線四，全卷立場見議題「『攪擾你們的人』是誰？」）。","檢驗標準：你講這兩節時，有沒有說清楚「這是對手的主張與動機」？會眾聽完，是先檢查自己有沒有加「和」字，還是急著指認別人？","⑨ 用處境取消原則：「割禮是第一世紀猶太人的事，跟我們無關」；或反過來把原則釘死在一種處境，說「凡有任何規矩的教會都是加拉太異端」。","書信三問的第三問要走完：處境是加拉太的割禮、面子與逼迫；原則是信耶穌不可以再加上甚麼才算數、只誇十字架。今天的「割禮」可能是一種語言、一套服裝規矩、一張會員資格、一個宗派標記（全卷立場見議題「書信的處境與原則」）。","檢驗標準：你有沒有具體說出，在你的教會裡，「信耶穌再加上甚麼才算我們的人」可能是甚麼？","⑩ 用 6:1「挽回」作公開懲戒的藉口：在台上點名、在群組轉發、要跌倒的人在全會眾面前認罪示眾；或反過來以「溫柔」為名假裝沒事、不處理罪。","καταρτίζετε（katartizete）是補網、接骨，目的是讓人重新站起來，而且要「用溫柔的心」又「自己小心」；若過犯傷害了別人，先保護受傷的人，必要時依法處理。饒恕、和好、信任、職分是四件事（回指哥林多後書立場四）。","檢驗標準：一位剛跌倒的人聽完，是知道有一條回家的路，還是決定再也不讓任何人知道？","⑪ 把 6:9「到了時候就要收成」講成保證：「只要你忠心，事工一定興旺、孩子一定回頭、病一定會好」。","καιρῷ ἰδίῳ（kairō idiō）是「它自己的時候」，是神定的；有些收成在今生看見，有些要到永生（6:8）才看見。講成保證，會讓忠心多年仍沒看見的人以為自己種錯了。","檢驗標準：一位為走遠的孩子禱告了二十年的母親聽完，是得著不灰心的力量，還是又一次自責？","⑫ 把 6:6 講成要錢的槓桿：「你受了我的教導，就欠我供養」；或反過來說「好傳道人不該談錢」，讓傳道人的生計沒有人過問。","κοινωνείτω（koinōneitō）是有分、相交，是一家人一起承擔，不是付費課程；保羅也說「主也是這樣命定，叫傳福音的靠著福音養生」（林前 9:14）。財務公開、量力而為，才合乎「一切需用的」。","檢驗標準：會眾聽完，是覺得被勒索，還是更樂意、更透明地與教導他的人同擔？","⑬ 把 6:15 講成「我們不受割禮、不守那些規矩，所以比他們屬靈」，拿「沒有規矩」當作新的記號。","保羅說受割禮不受割禮「都」無關緊要；以「我們不那樣做」自豪，只是換了一個記號，仍然是在基督後面加了一個「和」字（全卷立場見議題「基督徒的自由：在律法主義與放縱之間」）。","檢驗標準：會眾聽完，是覺得「我們比較自由所以比較好」，還是更在乎神有沒有在自己身上作新的事？","⑭ 把保羅講成英雄：「你看保羅多偉大，被石頭打還站起來，身上傷痕累累，我們都要像他一樣」。","保羅在這裡只誇十字架，他身上的傷不是叫人看他，是叫人看他屬於誰；講成英雄，會眾走出去會更佩服保羅，也會讓那些身上沒有「夠大」傷痕的人覺得自己不算數。","檢驗標準：會眾聽完，是更佩服保羅，還是更愛他所誇的那一位？"]}],"txt":{"1":["作使徒的保羅（不是由於人，也不是藉著人，乃是藉著耶穌基督，與叫他從死裡復活的父神）","和一切與我同在的眾弟兄，寫信給加拉太的各教會。","願恩惠、平安從父神與我們的主耶穌基督歸與你們！","基督照我們父神的旨意，為我們的罪捨己，要救我們脫離這罪惡的世代。","但願榮耀歸於神，直到永永遠遠。阿們！","我希奇你們這麼快離開那藉著基督之恩召你們的，去從別的福音。","那並不是福音，不過有些人攪擾你們，要把基督的福音更改了。","但無論是我們，是天上來的使者，若傳福音給你們，與我們所傳給你們的不同，他就應當被咒詛。","我們已經說了，現在又說，若有人傳福音給你們，與你們所領受的不同，他就應當被咒詛。","我現在是要得人的心呢？還是要得神的心呢？我豈是討人的喜歡嗎？若仍舊討人的喜歡，我就不是基督的僕人了。","弟兄們，我告訴你們，我素來所傳的福音不是出於人的意思。","因為我不是從人領受的，也不是人教導我的，乃是從耶穌基督啟示來的。","你們聽見我從前在猶太教中所行的事，怎樣極力逼迫殘害神的教會。","我又在猶太教中，比我本國許多同歲的人更有長進，為我祖宗的遺傳更加熱心。","然而，那把我從母腹裡分別出來、又施恩召我的神，","既然樂意將他兒子啟示在我心裡，叫我把他傳在外邦人中，我就沒有與屬血氣的人商量，","也沒有上耶路撒冷去見那些比我先作使徒的，惟獨往阿拉伯去，後又回到大馬士革。","過了三年，才上耶路撒冷去見磯法，和他同住了十五天。","至於別的使徒，除了主的兄弟雅各，我都沒有看見。","我寫給你們的不是謊話，這是我在神面前說的。","以後我到了敘利亞和基利家境內。","那時，猶太信基督的各教會都沒有見過我的面。","不過聽說那從前逼迫我們的，現在傳揚他原先所殘害的真道。","他們就為我的緣故，歸榮耀給神。"],"2":["過了十四年，我同巴拿巴又上耶路撒冷去，並帶著提多同去。","我是奉啟示上去的，把我在外邦人中所傳的福音對弟兄們陳說；卻是背地裡對那有名望之人說的，惟恐我現在，或是從前，徒然奔跑。","但與我同去的提多，雖是希臘人，也沒有勉強他受割禮；","因為有偷著引進來的假弟兄，私下窺探我們在基督耶穌裡的自由，要叫我們作奴僕。","我們就是一刻的工夫也沒有容讓順服他們，為要叫福音的真理仍存在你們中間。","至於那些有名望的，不論他是何等人，都與我無干。神不以外貌取人。那些有名望的，並沒有加增我甚麼，","反倒看見了主託我傳福音給那未受割禮的人，正如託彼得傳福音給那受割禮的人。（","那感動彼得、叫他為受割禮之人作使徒的，也感動我，叫我為外邦人作使徒；）","又知道所賜給我的恩典，那稱為教會柱石的雅各、磯法、約翰，就向我和巴拿巴用右手行相交之禮，叫我們往外邦人那裡去，他們往受割禮的人那裡去。","只是願意我們記念窮人；這也是我本來熱心去行的。","後來，磯法到了安提阿；因他有可責之處，我就當面抵擋他。","從雅各那裡來的人未到以先，他和外邦人一同吃飯，及至他們來到，他因怕奉割禮的人，就退去與外邦人隔開了。","其餘的猶太人也都隨著他裝假，甚至連巴拿巴也隨夥裝假。","但我一看見他們行的不正，與福音的真理不合，就在眾人面前對磯法說：「你既是猶太人，若隨外邦人行事，不隨猶太人行事，怎麼還勉強外邦人隨猶太人呢？」","我們這生來的猶太人，不是外邦的罪人；","既知道人稱義不是因行律法，乃是因信耶穌基督，連我們也信了基督耶穌，使我們因信基督稱義，不因行律法稱義；因為凡有血氣的，沒有一人因行律法稱義。","我們若求在基督裡稱義，卻仍舊是罪人，難道基督是叫人犯罪的嗎？斷乎不是！","我素來所拆毀的，若重新建造，這就證明自己是犯罪的人。","我因律法，就向律法死了，叫我可以向神活著。","我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信神的兒子而活；他是愛我，為我捨己。","我不廢掉神的恩；義若是藉著律法得的，基督就是徒然死了。"],"3":["無知的加拉太人哪，耶穌基督釘十字架，已經活畫在你們眼前，誰又迷惑了你們呢？","我只要問你們這一件：你們受了聖靈，是因行律法呢？是因聽信福音呢？","你們既靠聖靈入門，如今還靠肉身成全嗎？你們是這樣的無知嗎？","你們受苦如此之多，都是徒然的嗎？難道果真是徒然的嗎？","那賜給你們聖靈，又在你們中間行異能的，是因你們行律法呢？是因你們聽信福音呢？","正如「亞伯拉罕信神，這就算為他的義」。","所以，你們要知道：那以信為本的人，就是亞伯拉罕的子孫。","並且聖經既然預先看明，神要叫外邦人因信稱義，就早已傳福音給亞伯拉罕，說：「萬國都必因你得福。」","可見那以信為本的人和有信心的亞伯拉罕一同得福。","凡以行律法為本的，都是被咒詛的；因為經上記著：「凡不常照律法書上所記一切之事去行的，就被咒詛。」","沒有一個人靠著律法在神面前稱義，這是明顯的；因為經上說：「義人必因信得生。」","律法原不本乎信，只說：「行這些事的，就必因此活著。」","基督既為我們受了咒詛，就贖出我們脫離律法的咒詛；因為經上記著：「凡掛在木頭上都是被咒詛的。」","這便叫亞伯拉罕的福，因基督耶穌可以臨到外邦人，使我們因信得著所應許的聖靈。","弟兄們，我且照著人的常話說：雖然是人的文約，若已經立定了，就沒有能廢棄或加增的。","所應許的原是向亞伯拉罕和他子孫說的。神並不是說「眾子孫」，指著許多人，乃是說「你那一個子孫」，指著一個人，就是基督。","我是這麼說，神預先所立的約，不能被那四百三十年以後的律法廢掉，叫應許歸於虛空。","因為承受產業，若本乎律法，就不本乎應許；但神是憑著應許把產業賜給亞伯拉罕。","這樣說來，律法是為甚麼有的呢？原是為過犯添上的，等候那蒙應許的子孫來到，並且是藉天使經中保之手設立的。","但中保本不是為一面作的；神卻是一位。","這樣，律法是與神的應許反對嗎？斷乎不是！若曾傳一個能叫人得生的律法，義就誠然本乎律法了。","但聖經把眾人都圈在罪裡，使所應許的福因信耶穌基督，歸給那信的人。","但這因信得救的理還未來以先，我們被看守在律法之下，直圈到那將來的真道顯明出來。","這樣，律法是我們訓蒙的師傅，引我們到基督那裡，使我們因信稱義。","但這因信得救的理既然來到，我們從此就不在師傅的手下了。","所以，你們因信基督耶穌都是神的兒子。","你們受洗歸入基督的都是披戴基督了。","並不分猶太人、希臘人，自主的、為奴的，或男或女，因為你們在基督耶穌裡都成為一了。","你們既屬乎基督，就是亞伯拉罕的後裔，是照著應許承受產業的了。"],"4":["我說那承受產業的，雖然是全業的主人，但為孩童的時候卻與奴僕毫無分別，","乃在師傅和管家的手下，直等他父親預定的時候來到。","我們為孩童的時候，受管於世俗小學之下，也是如此。","及至時候滿足，神就差遣他的兒子，為女子所生，且生在律法以下，","要把律法以下的人贖出來，叫我們得著兒子的名分。","你們既為兒子，神就差他兒子的靈進入你們的心，呼叫：「阿爸！父！」","可見，從此以後，你不是奴僕，乃是兒子了；既是兒子，就靠著神為後嗣。","但從前你們不認識神的時候，是給那些本來不是神的作奴僕；","現在你們既然認識神，更可說是被神所認識的，怎麼還要歸回那懦弱無用的小學，情願再給他作奴僕呢？","你們謹守日子、月份、節期、年份，","我為你們害怕，惟恐我在你們身上是枉費了工夫。","弟兄們，我勸你們要像我一樣，因為我也像你們一樣。你們一點沒有虧負我。","你們知道我頭一次傳福音給你們，是因為身體有疾病。","你們為我身體的緣故受試煉，沒有輕看我，也沒有厭棄我，反倒接待我，如同神的使者，如同基督耶穌。","你們當日所誇的福氣在哪裡呢？那時你們若能行，就是把自己的眼睛剜出來給我，也都情願。這是我可以給你們作見證的。","如今我將真理告訴你們，就成了你們的仇敵嗎？","那些人熱心待你們，卻不是好意，是要離間你們，叫你們熱心待他們。","在善事上，常用熱心待人原是好的，卻不單我與你們同在的時候才這樣。","我小子啊，我為你們再受生產之苦，直等到基督成形在你們心裡。","我巴不得現今在你們那裡，改換口氣，因我為你們心裡作難。","你們這願意在律法以下的人，請告訴我，你們豈沒有聽見律法嗎？","因為律法上記著，亞伯拉罕有兩個兒子，一個是使女生的，一個是自主之婦人生的。","然而，那使女所生的是按著血氣生的；那自主之婦人所生的是憑著應許生的。","這都是比方：那兩個婦人就是兩約。一約是出於西奈山，生子為奴，乃是夏甲。","這夏甲二字是指著阿拉伯的西奈山，與現在的耶路撒冷同類，因耶路撒冷和她的兒女都是為奴的。","但那在上的耶路撒冷是自主的，她是我們的母。","因為經上記著：不懷孕、不生養的，你要歡樂；未曾經過產難的，你要高聲歡呼；因為沒有丈夫的，比有丈夫的兒女更多。","弟兄們，我們是憑著應許作兒女，如同以撒一樣。","當時，那按著血氣生的逼迫了那按著聖靈生的，現在也是這樣。","然而經上是怎麼說的呢？是說：「把使女和她兒子趕出去！因為使女的兒子不可與自主婦人的兒子一同承受產業。」","弟兄們，這樣看來，我們不是使女的兒女，乃是自主婦人的兒女了。"],"5":["基督釋放了我們，叫我們得以自由。所以要站立得穩，不要再被奴僕的軛挾制。","我－保羅告訴你們，若受割禮，基督就與你們無益了。","我再指著凡受割禮的人確實地說，他是欠著行全律法的債。","你們這要靠律法稱義的，是與基督隔絕，從恩典中墜落了。","我們靠著聖靈，憑著信心，等候所盼望的義。","原來在基督耶穌裡，受割禮不受割禮全無功效，惟獨使人生發仁愛的信心才有功效。","你們向來跑得好，有誰攔阻你們，叫你們不順從真理呢？","這樣的勸導不是出於那召你們的。","一點麵酵能使全團都發起來。","我在主裡很信你們必不懷別樣的心；但攪擾你們的，無論是誰，必擔當他的罪名。","弟兄們，我若仍舊傳割禮，為甚麼還受逼迫呢？若是這樣，那十字架討厭的地方就沒有了。","恨不得那攪亂你們的人把自己割絕了。","弟兄們，你們蒙召是要得自由，只是不可將你們的自由當作放縱情慾的機會，總要用愛心互相服事。","因為全律法都包在「愛人如己」這一句話之內了。","你們要謹慎，若相咬相吞，只怕要彼此消滅了。","我說，你們當順著聖靈而行，就不放縱肉體的情慾了。","因為情慾和聖靈相爭，聖靈和情慾相爭，這兩個是彼此相敵，使你們不能做所願意做的。","但你們若被聖靈引導，就不在律法以下。","情慾的事都是顯而易見的，就如姦淫、污穢、邪蕩、","拜偶像、邪術、仇恨、爭競、忌恨、惱怒、結黨、紛爭、異端、","嫉妒、醉酒、荒宴等類。我從前告訴你們，現在又告訴你們，行這樣事的人必不能承受神的國。","聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、","溫柔、節制。這樣的事沒有律法禁止。","凡屬基督耶穌的人，是已經把肉體連肉體的邪情私慾同釘在十字架上了。","我們若是靠聖靈得生，就當靠聖靈行事。","不要貪圖虛名，彼此惹氣，互相嫉妒。"],"6":["弟兄們，若有人偶然被過犯所勝，你們屬靈的人就當用溫柔的心把他挽回過來；又當自己小心，恐怕也被引誘。","你們各人的重擔要互相擔當，如此，就完全了基督的律法。","人若無有，自己還以為有，就是自欺了。","各人應當察驗自己的行為；這樣，他所誇的就專在自己，不在別人了，","因為各人必擔當自己的擔子。","在道理上受教的，當把一切需用的供給施教的人。","不要自欺，神是輕慢不得的。人種的是甚麼，收的也是甚麼。","順著情慾撒種的，必從情慾收敗壞；順著聖靈撒種的，必從聖靈收永生。","我們行善，不可喪志；若不灰心，到了時候就要收成。","所以，有了機會就當向眾人行善，向信徒一家的人更當這樣。","請看我親手寫給你們的字是何等的大呢！","凡希圖外貌體面的人都勉強你們受割禮，無非是怕自己為基督的十字架受逼迫。","他們那些受割禮的，連自己也不守律法；他們願意你們受割禮，不過要藉著你們的肉體誇口。","但我斷不以別的誇口，只誇我們主耶穌基督的十字架；因這十字架，就我而論，世界已經釘在十字架上；就世界而論，我已經釘在十字架上。","受割禮不受割禮都無關緊要，要緊的就是作新造的人。","凡照此理而行的，願平安、憐憫加給他們，和神的以色列民。","從今以後，人都不要攪擾我，因為我身上帶著耶穌的印記。","弟兄們，願我主耶穌基督的恩常在你們心裡。阿們！"]},"blk":{"1":[{"a":1,"z":2,"star":2,"grk":"<p lang=\"grc\">Παῦλος ἀπόστολος, οὐκ ἀπʼ ἀνθρώπων οὐδὲ διʼ ἀνθρώπου ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν,<\/p><p lang=\"grc\">καὶ οἱ σὺν ἐμοὶ πάντες ἀδελφοί, ταῖς ἐκκλησίαις τῆς Γαλατίας·<\/p>","lit":"<p>保羅，使徒，不是從人，也不是藉著人，而是藉著耶穌基督和父神，那叫他從死人中復活的，<\/p><p>和那些與我同在的眾弟兄，給加拉太的眾教會：<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Παῦλος ἀπόστολος<\/td><td>Paulos apostolos<\/td><td>保羅，使徒<\/td><td>沒有冠詞，直接報上身分<\/td><\/tr><tr><td>ἀπʼ ἀνθρώπων<\/td><td>ap' anthrōpōn<\/td><td>從人（複數）<\/td><td>來源：不是哪一群人發的委任<\/td><\/tr><tr><td>διʼ ἀνθρώπου<\/td><td>di' anthrōpou<\/td><td>藉著人（單數）<\/td><td>管道：也不是經過哪一個人轉手<\/td><\/tr><tr><td>ἀλλὰ διὰ Ἰησοῦ Χριστοῦ καὶ θεοῦ πατρὸς<\/td><td>alla dia Iēsou Christou kai theou patros<\/td><td>乃是藉著耶穌基督和父神<\/td><td>一個介系詞管兩位：子與父站在同一邊<\/td><\/tr><tr><td>τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν<\/td><td>tou egeirantos auton ek nekrōn<\/td><td>那叫他從死人中復活的<\/td><td>保羅問安裡少見的復活句：他是被復活的主差遣的<\/td><\/tr><tr><td>ταῖς ἐκκλησίαις τῆς Γαλατίας<\/td><td>tais ekklēsiais tēs Galatias<\/td><td>加拉太的眾教會<\/td><td>複數：一封傳閱的信；沒有任何稱讚的修飾語<\/td><\/tr><\/table>","gram":"<p><strong>第一句話還沒說完，保羅就插進一個括號；這個括號就是全卷第一個論點。<\/strong><\/p><p>古代書信的開頭只要寫「某某致某某」。保羅在 Παῦλος ἀπόστολος（Paulos apostolos） 之後立刻用三個介系詞片語畫出界線：οὐκ ἀπʼ ἀνθρώπων（ouk ap' anthrōpōn），οὐδὲ διʼ ἀνθρώπου（oude di' anthrōpou），ἀλλὰ διὰ Ἰησοῦ Χριστοῦ（alla dia Iēsou Christou）。第一個 ἀπό（apo） 講來源，而且「人」是複數：不是哪一個團體開出的委任狀；第二個 διά（dia） 講管道，「人」轉成單數：也不是經過哪一位前輩轉手。這兩句否定，正好預先回答第 1–2 章的自傳：他沒有從耶路撒冷領差遣（1:17），也不是彼得的學生（1:18）。<\/p><p>ἀλλὰ（alla） 之後只有一個 διὰ（dia），卻同時管著 Ἰησοῦ Χριστοῦ（Iēsou Christou） 和 θεοῦ πατρὸς（theou patros）。保羅不覺得要分開說：差他的是基督，也是父。τοῦ ἐγείραντος（tou egeirantos） 是不定過去式分詞，指那一次的復活。保羅別的問安很少這樣寫；放在這裡，是因為他的使徒職分來自大馬士革路上那位復活的主（1:16），不是來自地上耶穌的門徒圈。第 2 節收信人只寫 ταῖς ἐκκλησίαις τῆς Γαλατίας（tais ekklēsiais tēs Galatias），沒有「蒙召作聖徒」一類的稱呼；加拉太究竟指北部的族群地區還是南部的羅馬行省，學者兩說並陳，見全卷立場議題「加拉太在哪裡？這封信寫於何時？」。<\/p>","exp":"<p><strong>保羅一開口，就先交代他站在這裡的根據。<\/strong><\/p><p>「作使徒的保羅（不是由於人，也不是藉著人，乃是藉著耶穌基督，與叫他從死裡復活的父神）」（1:1）。這個括號不是自誇。加拉太人遇到的難處，是有人來到他們中間，傳一套「信耶穌之外還要加上割禮」的教導；要叫這套教導站得住，最省力的方法就是把保羅降級：他不過是耶路撒冷派出來的二手傳道人，而且把福音講簡單了。保羅的回答是：我的福音若是二手的，你們大可以去找一手的；但它不是。<\/p><p>要小心一個誤用。今天有人說「我是直接從神領受的，不需要任何人印證」，拿這一節當護身符。可是同一個保羅，後來「把我在外邦人中所傳的福音對弟兄們陳說」（2:2），耶路撒冷的柱石也「用右手行相交之禮」（2:9）。「不是由於人」講的是來源，不是說他不要教會；他的福音不由人授權，卻甘心讓眾弟兄看見、驗證。本章議題頁另有討論。<\/p><p>第 2 節也值得多看一眼：「和一切與我同在的眾弟兄」（1:2）。一封要捍衛「不是出於人」的信，開頭就有一群人與他站在一起。獨立的權柄，不等於孤單的權柄。而他稱收信人為「加拉太的各教會」（1:2），一個讚美的字也沒有加。這不是冷淡，是急：家裡著火的時候，不先寒暄。<\/p>"},{"a":3,"z":5,"star":2,"grk":"<p lang=\"grc\">χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς καὶ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ,<\/p><p lang=\"grc\">τοῦ δόντος ἑαυτὸν ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν ὅπως ἐξέληται ἡμᾶς ἐκ τοῦ αἰῶνος τοῦ ἐνεστῶτος πονηροῦ κατὰ τὸ θέλημα τοῦ θεοῦ καὶ πατρὸς ἡμῶν,<\/p><p lang=\"grc\">ᾧ ἡ δόξα εἰς τοὺς αἰῶνας τῶν αἰώνων· ἀμήν.<\/p>","lit":"<p>恩典給你們和平安，從父神和我們的主耶穌基督，<\/p><p>那位為了我們的罪把自己給出去的，好救拔我們出離這現今邪惡的世代，照著神，就是我們父的旨意；<\/p><p>榮耀歸給他，直到眾世代的世代。阿們。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>χάρις ὑμῖν καὶ εἰρήνη<\/td><td>charis hymin kai eirēnē<\/td><td>恩典給你們和平安<\/td><td>保羅的固定問安；在這封信裡分量特別重<\/td><\/tr><tr><td>τοῦ δόντος ἑαυτὸν<\/td><td>tou dontos heauton<\/td><td>那把自己給出去的<\/td><td>全卷第一次描寫基督：捨己；2:20 呼應<\/td><\/tr><tr><td>ὑπὲρ τῶν ἁμαρτιῶν ἡμῶν<\/td><td>hyper tōn hamartiōn hēmōn<\/td><td>為了我們的罪<\/td><td>罪是複數：一筆一筆的債<\/td><\/tr><tr><td>ὅπως ἐξέληται ἡμᾶς<\/td><td>hopōs exelētai hēmas<\/td><td>好救拔我們出來<\/td><td>中間語態：把人從手裡拉出來<\/td><\/tr><tr><td>ἐκ τοῦ αἰῶνος τοῦ ἐνεστῶτος πονηροῦ<\/td><td>ek tou aiōnos tou enestōtos ponērou<\/td><td>出離這現今邪惡的世代<\/td><td>兩個世代的框架：舊的還在，新的已經來了<\/td><\/tr><tr><td>ᾧ ἡ δόξα<\/td><td>hō hē doxa<\/td><td>榮耀歸給他<\/td><td>感恩段的位置，換成了頌讚<\/td><\/tr><\/table>","gram":"<p><strong>問安本來只是一句祝福，保羅卻在祝福裡面塞進整個福音。<\/strong><\/p><p>第 3 節 χάρις ὑμῖν καὶ εἰρήνη（charis hymin kai eirēnē） 是保羅每封信都有的問安，但第 4 節 τοῦ δόντος ἑαυτὸν（tou dontos heauton） 接在「我們的主耶穌基督」後面，用屬格分詞把基督是誰說出來：他是那把自己給出去的。全卷第一次講基督，講的就是「捨己」；到 2:20 保羅會用同一個字根再說一次：παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ（paradontos heauton hyper emou）。第 1 章是「為我們的罪」，第 2 章是「為我」，從眾人收窄到一個人。<\/p><p>ὅπως ἐξέληται（hopōs exelētai） 是目的子句，ἐξέληται（exelētai） 是不定過去式中間語態，原意是「拔出來、救出來」，司提反講摩西時用它描寫神從埃及救出百姓（徒 7:34）。被救出來的地方是 ἐκ τοῦ αἰῶνος τοῦ ἐνεστῶτος πονηροῦ（ek tou aiōnos tou enestōtos ponērou）：猶太人把歷史分成「這世代」和「來世」，ἐνεστῶτος（enestōtos） 是完成分詞，指已經臨到、正在掌權的這一個世代。保羅說，十字架已經把人從舊世代裡拉出來。全卷最後也落在這裡：「要緊的就是作新造的人」（6:15）。第 5 節 ᾧ ἡ δόξα（hō hē doxa）……ἀμήν（amēn） 是頌讚，放在別的信寫感恩的位置。<\/p>","exp":"<p><strong>在保羅要求加拉太人做任何事以前，他先說基督已經做了甚麼。<\/strong><\/p><p>「基督照我們父神的旨意，為我們的罪捨己，要救我們脫離這罪惡的世代」（1:4）。這一節是整封信的種子。攪擾的人沒有否認基督死了，他們否認的是：基督的死已經夠了。保羅在問安裡就把話說滿——是基督「捨己」，不是我們補上；是神的「旨意」，不是人的設計；是「救我們脫離」，不是幫我們做得更好一點。<\/p><p>「這罪惡的世代」不只是一個壞環境。在保羅的用法裡，它是一個有自己規則的秩序：用出身、行為、記號把人分成裡面和外面。加拉太人想加上的割禮，表面上很屬靈，其實正是把人拉回這個舊秩序：再一次用肉體上的記號決定誰算數。所以第 4 節已經預告了全卷的答案：十字架不是給舊世代加一條新規則，是把人帶出舊世代。<\/p><p>然後是第 5 節：「但願榮耀歸於神，直到永永遠遠。阿們！」（1:5）別的信在這裡為收信人感謝神，這封信在第五節就先把榮耀歸給神。保羅還沒有開始責備，先把眼光定在神身上。一個要處理教會問題的人，若先失去了敬拜，就很容易把問題變成自己的戰爭。這一句「阿們」，是他在提筆責備之前替自己立的錨。<\/p><p>對今天的讀者，第 4 節也是一面鏡子。我們信耶穌以後，心裡是否還留著一份清單——要做到甚麼、守住甚麼，神才會真正接納我？那份清單就是我們自己的「再加上」。保羅的第一句福音是：他已經為我捨己了。<\/p>"},{"a":6,"z":7,"star":3,"grk":"<p lang=\"grc\">Θαυμάζω ὅτι οὕτως ταχέως μετατίθεσθε ἀπὸ τοῦ καλέσαντος ὑμᾶς ἐν χάριτι Χριστοῦ εἰς ἕτερον εὐαγγέλιον,<\/p><p lang=\"grc\">ὃ οὐκ ἔστιν ἄλλο· εἰ μή τινές εἰσιν οἱ ταράσσοντες ὑμᾶς καὶ θέλοντες μεταστρέψαι τὸ εὐαγγέλιον τοῦ Χριστοῦ.<\/p>","lit":"<p>我希奇，你們這樣快就正在轉離那位在基督的恩典裡呼召你們的，轉向另一種福音，<\/p><p>那不是另一個；只不過有些人是攪擾你們的，並且想要把基督的福音扭轉過來。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Θαυμάζω<\/td><td>Thaumazō<\/td><td>我希奇<\/td><td>書信裡責備的套語；放在感恩段的位置<\/td><\/tr><tr><td>οὕτως ταχέως<\/td><td>houtōs tacheōs<\/td><td>這樣快<\/td><td>時間短，也可能是腳步輕<\/td><\/tr><tr><td>μετατίθεσθε<\/td><td>metatithesthe<\/td><td>你們正在轉移<\/td><td>現在式：叛離還在進行，還來得及<\/td><\/tr><tr><td>ἀπὸ τοῦ καλέσαντος ὑμᾶς<\/td><td>apo tou kalesantos hymas<\/td><td>離開那召你們的<\/td><td>離開的不是一套說法，是一位神<\/td><\/tr><tr><td>εἰς ἕτερον εὐαγγέλιον<\/td><td>eis heteron euangelion<\/td><td>轉向另一種福音<\/td><td>掛著福音的名字<\/td><\/tr><tr><td>ὃ οὐκ ἔστιν ἄλλο<\/td><td>ho ouk estin allo<\/td><td>那不是另一個<\/td><td>其實沒有第二個福音<\/td><\/tr><tr><td>οἱ ταράσσοντες ὑμᾶς<\/td><td>hoi tarassontes hymas<\/td><td>那些攪擾你們的<\/td><td>冠詞加現在分詞：一群具體的人<\/td><\/tr><tr><td>μεταστρέψαι<\/td><td>metastrepsai<\/td><td>扭轉、顛倒<\/td><td>不是修改一點，是翻過來<\/td><\/tr><\/table>","gram":"<p><strong>◆ 加拉太書是保羅寫給教會的書信裡唯一沒有感恩段的一封：問安之後，第一個字是 Θαυμάζω（Thaumazō）。<\/strong><\/p><p>別的信，問安之後幾乎都是感謝：「我每逢想念你們，就感謝我的神」（腓 1:3）；「我們為你們眾人常常感謝神」（帖前 1:2）。連問題成堆的哥林多，保羅也先感謝神。這裡卻是 Θαυμάζω ὅτι（Thaumazō hoti），在古代蒲草紙書信裡，這是寫信人表達失望、責怪的套語，大意是「我真不明白你們怎麼會……」。缺席的感恩段本身就是信息。<\/p><p>μετατίθεσθε（metatithesthe） 是現在式，可以讀作中間語態「你們正在把自己轉過去」，也可以讀作被動「你們正被人帶走」；兩者都對，前者說他們有責任，後者說有人在推。它在古代文獻裡用來形容士兵叛營、哲學家改換門派。現在式表示事情還在進行：他們還沒走完，所以這封信還來得及。他們轉離的是 ἀπὸ τοῦ καλέσαντος ὑμᾶς（apo tou kalesantos hymas），是那位呼召的神，不只是一條教義。<\/p><p>εἰς ἕτερον εὐαγγέλιον（eis heteron euangelion）, ὃ οὐκ ἔστιν ἄλλο（ho ouk estin allo）：有學者主張 ἕτερος（heteros） 是「不同種類的另一個」，ἄλλος（allos） 是「同類的另一個」；但保羅在林後 11:4 交替使用兩字（ἄλλον Ἰησοῦν（allon Iēsoun）……εὐαγγέλιον ἕτερον（euangelion heteron）），區分不宜推得太硬。本講義的判斷：重點不在字義分別，而在保羅的自我更正——我剛說「另一種福音」，其實並沒有另一個福音。εἰ μή（ei mē） 接下去：唯一真實存在的，是 οἱ ταράσσοντες ὑμᾶς καὶ θέλοντες μεταστρέψαι（hoi tarassontes hymas kai thelontes metastrepsai）。θέλοντες（thelontes）「想要」，他們還沒得手；μεταστρέψαι（metastrepsai） 是「翻轉、顛倒」，五旬節彼得引約珥書說「日頭要變為黑暗」，用的就是這個字根。<\/p>","exp":"<p>〔哥林多〕林後 11:4（哥林多後書講義第 11 章）<\/p><p><strong>「我希奇你們這麼快離開那藉著基督之恩召你們的，去從別的福音。」（1:6）<\/strong><\/p><p>先問第一問：加拉太人遇到甚麼？保羅離開以後，有一批人來到這些外邦人的教會。從全卷看，他們是相信耶穌的猶太派教師，可能來自猶太地，或聲稱代表那裡；他們的主張是：外邦人信了耶穌，還要受割禮、守律法，才算真正進了亞伯拉罕的家（5:2；6:12）。請注意，這是攪擾者的主張，不是保羅的。保羅的評語只有一句：「那並不是福音，不過有些人攪擾你們，要把基督的福音更改了」（1:7）。<\/p><p>他們沒有拿掉基督。他們講耶穌，講十字架，也許講得很熱心。他們只是在基督後面加了一個「和」字：基督，和割禮；基督，和節期；基督，和我們這一套。保羅為甚麼說這樣一加，就「更改」了福音，甚至翻轉了它？因為一旦得救需要「基督再加上某樣東西」，那樣東西就成了真正的門檻。人會去守那扇門，會用那扇門判斷誰在裡面、誰在外面；基督反而變成了排隊的起點，不是終點。後來保羅說得更直接：「若受割禮，基督就與你們無益了」（5:2）。<\/p><p>哥林多後書講義第 11 章講過同一種危險：「假如有人來另傳一個耶穌，不是我們所傳過的……或者另得一個福音，不是你們所得過的」（林後 11:4）。在哥林多，人加上的是口才與排場；在加拉太，人加上的是割禮與律法。名目不同，結構一樣：耶穌，再加上我們認可的東西。<\/p><p>保羅也說「這麼快」。福音不是被一場逼迫奪走的，是被一個看起來更完整、更有保障的版本悄悄換掉的。今天的「割禮」可能是一種語言、一套服裝規矩、一個宗派標記、一張會員資格表；它們本身未必有錯，錯在被放到基督旁邊，成了「這樣才算數」的條件（全卷立場議題「書信的處境與原則」）。<\/p>"},{"a":8,"z":9,"star":3,"grk":"<p lang=\"grc\">ἀλλὰ καὶ ἐὰν ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ εὐαγγελίζηται ὑμῖν παρʼ ὃ εὐηγγελισάμεθα ὑμῖν, ἀνάθεμα ἔστω.<\/p><p lang=\"grc\">ὡς προειρήκαμεν, καὶ ἄρτι πάλιν λέγω, εἴ τις ὑμᾶς εὐαγγελίζεται παρʼ ὃ παρελάβετε, ἀνάθεμα ἔστω.<\/p>","lit":"<p>但即使是我們，或從天上來的使者，傳福音給你們，違反我們所傳給你們的，他當被咒詛。<\/p><p>正如我們先前已經說過，我現在又再說：若有人正在傳福音給你們，違反你們所領受的，他當被咒詛。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἐὰν ἡμεῖς<\/td><td>ean hēmeis<\/td><td>即使是我們<\/td><td>第一個被放上檢驗台的是保羅自己<\/td><\/tr><tr><td>ἄγγελος ἐξ οὐρανοῦ<\/td><td>angelos ex ouranou<\/td><td>從天上來的使者<\/td><td>最高的權威，也不高過福音<\/td><\/tr><tr><td>παρʼ ὃ εὐηγγελισάμεθα ὑμῖν<\/td><td>par' ho euēngelisametha hymin<\/td><td>違反／超出我們所傳的<\/td><td>παρά 可指「相反」，也可指「另外加上」<\/td><\/tr><tr><td>ἀνάθεμα ἔστω<\/td><td>anathema estō<\/td><td>他當被咒詛<\/td><td>交在神的審判之下；兩次<\/td><\/tr><tr><td>προειρήκαμεν<\/td><td>proeirēkamen<\/td><td>我們先前說過<\/td><td>完成式：說過的話仍然有效<\/td><\/tr><tr><td>εἴ τις ὑμᾶς εὐαγγελίζεται<\/td><td>ei tis hymas euangelizetai<\/td><td>若有人正在傳<\/td><td>直說語氣：不再是假設<\/td><\/tr><tr><td>παρελάβετε<\/td><td>parelabete<\/td><td>你們所領受的<\/td><td>領受傳統的專門字；1:12 同字<\/td><\/tr><\/table>","gram":"<p><strong>兩節幾乎一樣的句子，差別在條件句的語氣：從假設，走到眼前的實情。<\/strong><\/p><p>第 8 節 ἐὰν ἡμεῖς ἢ ἄγγελος ἐξ οὐρανοῦ εὐαγγελίζηται（ean hēmeis ē angelos ex ouranou euangelizētai） 是 ἐάν（ean） 加假設語氣，說的是一個近乎不可能的情況：就算是我，就算是天使。第 9 節換成 εἴ τις ὑμᾶς εὐαγγελίζεται（ei tis hymas euangelizetai），εἰ（ei） 加直說語氣、現在式：真的有人，而且正在傳。保羅先用極端的假設立下準則，再把準則套在眼前的人身上。ὡς προειρήκαμεν（hōs proeirēkamen） 是完成式，可能指他建立教會時已經警告過，也可能指上一節；無論哪一種，話說了就一直算數。<\/p><p>παρʼ ὃ（par' ho） 的 παρά（para） 加受格，有兩種讀法：一、「相反於」我們所傳的；二、「在我們所傳的之外」，即另外加上。本講義判斷兩義都在，而第二義特別切合加拉太的處境：攪擾的人不是反對保羅的福音，是要在它之外加東西。παρελάβετε（parelabete） 是傳遞信仰傳統的專門字，與 1:12 保羅自己 παρέλαβον（parelabon） 呼應。<\/p><p>ἀνάθεμα（anathema） 在七十士譯本翻譯希伯來文的「當滅的物」，指交給神、由神處置的對象。ἔστω（estō） 是第三人稱命令語氣，是宣告，不是交託給教會去執行的命令：保羅沒有叫加拉太人去懲罰誰，他把那人交在神的審判之下。他後來也說：「攪擾你們的，無論是誰，必擔當他的罪名」（5:10），審判的是神。值得對照的是，同一位使徒曾說，為了骨肉之親，「就是自己被咒詛，與基督分離，我也願意」（羅 9:3），用的是同一個字。<\/p>","exp":"<p><strong>這是全本新約最重的兩句話之一，也是最常被誤用的兩句話。<\/strong><\/p><p>先看保羅放上檢驗台的順序：「但無論是我們，是天上來的使者，若傳福音給你們，與我
