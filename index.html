們所傳給你們的不同，他就應當被咒詛」（1:8）。第一個被檢驗的，是「我們」。保羅沒有說「凡不同意我的人當被咒詛」；他說，連我自己改了口，也一樣。準則高過傳的人。連天使站在你面前，帶著光、帶著神蹟，傳的若是另一個版本，也不必信。這給了加拉太人一份自由：他們不必在保羅和那些教師之間比較誰的名望大，只要問一件事——傳的是不是那一個福音。<\/p><p>那麼，甚麼才算「別的福音」？從全卷看，它有明確的內容：在基督之外加上得救的條件。保羅自己下了定義：「你們這要靠律法稱義的，是與基督隔絕，從恩典中墜落了」（5:4）。所以，受洗用點水或浸水、聚會時講不講方言、教會怎樣治理、唱詩用甚麼樂器，這些宗派之間真實的差異，都不是 1:8 所說的別的福音。把這兩節拿來咒詛教義或宗派不同的弟兄姊妹，正好犯了攪擾者同樣的錯：把自己的一套，加成了得救的條件（紅線四；回指哥林多後書立場三）。<\/p><p>為甚麼保羅說得這樣重？因為牽涉的是人的得救。醫生看見有人在水源裡下毒，說話不會溫和。保羅重的不是脾氣，是愛：他寧可說最重的話，也不要加拉太人喝下那口水。而且他把判決交給神，不交給教會的拳頭。今天若有人以「護教」之名羞辱、驅逐、詛咒別人，他已經離開了這兩節的精神。<\/p><p>這兩節對傳道人也是一面鏡子。保羅先把自己放上去；我們也該先問：我講的福音，有沒有悄悄加了甚麼？加了我的宗派、我的方法、我的成功學？檢驗別人以前，先檢驗講台。<\/p>"},{"a":10,"z":10,"star":2,"grk":"<p lang=\"grc\">Ἄρτι γὰρ ἀνθρώπους πείθω ἢ τὸν θεόν; ἢ ζητῶ ἀνθρώποις ἀρέσκειν; εἰ ἔτι ἀνθρώποις ἤρεσκον, Χριστοῦ δοῦλος οὐκ ἂν ἤμην.<\/p>","lit":"<p>因為我現在是在說服人，還是說服神？或者我是在尋求討人喜歡嗎？如果我仍舊在討人喜歡，我就不會是基督的奴僕了。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Ἄρτι γὰρ<\/td><td>Arti gar<\/td><td>因為現在<\/td><td>γάρ：剛才的重話，就是證據<\/td><\/tr><tr><td>ἀνθρώπους πείθω ἢ τὸν θεόν<\/td><td>anthrōpous peithō ē ton theon<\/td><td>說服人還是說服神<\/td><td>第一個修辭問句；後半帶著反諷<\/td><\/tr><tr><td>ζητῶ ἀνθρώποις ἀρέσκειν<\/td><td>zētō anthrōpois areskein<\/td><td>尋求討人喜歡<\/td><td>第二個修辭問句<\/td><\/tr><tr><td>εἰ ἔτι ἀνθρώποις ἤρεσκον<\/td><td>ei eti anthrōpois ēreskon<\/td><td>如果我仍舊在討人喜歡<\/td><td>與事實相反的條件句；ἔτι 暗指從前<\/td><\/tr><tr><td>Χριστοῦ δοῦλος<\/td><td>Christou doulos<\/td><td>基督的奴僕<\/td><td>追蹤三第一站：保羅自稱奴僕<\/td><\/tr><tr><td>οὐκ ἂν ἤμην<\/td><td>ouk an ēmēn<\/td><td>我就不會是<\/td><td>ἄν 加未完成式：結果不成立<\/td><\/tr><\/table>","gram":"<p><strong>Ἄρτι γὰρ（Arti gar） 把第 10 節綁在剛才的咒詛上：一個說得出 ἀνάθεμα ἔστω（anathema estō） 的人，不可能是在討好誰。<\/strong><\/p><p>兩個修辭問句連發。第一個 ἀνθρώπους πείθω ἢ τὸν θεόν（anthrōpous peithō ē ton theon）；πείθω（peithō） 是「說服、爭取」，對人說得通，對神就帶著反諷：誰能說服神？答案只有一個：我不是在拉票。第二個 ζητῶ ἀνθρώποις ἀρέσκειν（zētō anthrōpois areskein） 更直接。可能有人批評保羅：他不要外邦人受割禮，是把福音講便宜了，好討外邦人喜歡；同一批人或許又說他在別處「仍舊傳割禮」（5:11）。保羅用問句把兩種說法一起推開。<\/p><p>後半句是與事實相反的條件句：εἰ ἔτι ἀνθρώποις ἤρεσκον（ei eti anthrōpois ēreskon），未完成式；Χριστοῦ δοῦλος οὐκ ἂν ἤμην（Christou doulos ouk an ēmēn），ἄν（an） 加未完成式。意思是「如果我仍在討人喜歡（但我沒有），我就不會是基督的奴僕（但我是）」。ἔτι（eti）「仍舊」暗示從前：1:14 那位在同儕中力求出眾的年輕人。δοῦλος（doulos） 是本卷追蹤三的第一站：全卷講了五章「你們不是奴僕」，卻是由保羅自稱奴僕開始，到 6:17 他身上的烙印收尾。<\/p>","exp":"<p><strong>「我豈是討人的喜歡嗎？若仍舊討人的喜歡，我就不是基督的僕人了。」（1:10）<\/strong><\/p><p>和合本譯作「僕人」，原文是奴僕。奴僕只有一位主人；他的去留、作息、是非，都由主人定。保羅的意思不是「我不在乎人」，而是「我已經有一位主人了」。一個人同時想作基督的奴僕，又想讓每一個人都滿意，最後一定會在某一天被迫選邊。<\/p><p>這一節不能讀成冷漠。保羅在別處說：「我們各人務要叫鄰舍喜悅，使他得益處，建立德行」（羅 15:2）。分別在哪裡？他在另一封信說得清楚：「不是要討人喜歡，乃是要討那察驗我們心的神喜歡」（帖前 2:4）。叫鄰舍喜悅，是為了對方得益處；討人喜歡，是為了我自己得認可。前者是愛，後者是怕。同樣是說好聽的話，前者願意在必要時說難聽的真話，後者永遠說不出口。<\/p><p>華人的處境裡，這一節特別扎心。我們很重面子，也很怕給別人難堪：講台上不敢講罪，小組裡不敢說不同意，對長輩、對大奉獻的會友，話總是繞三圈。顧念人的感受是美德；但當「別人會怎麼看我」成了我做決定的那一位主人，基督就被擠到了第二位。面子文化與討好型人格的分別，本章議題頁另有討論。<\/p><p>這一句也預備了全卷的轉折：人若不先被基督的愛釋放，就只能靠別人的眼光活著。到第 2 章保羅會說，基督「是愛我，為我捨己」（2:20）。被這樣愛過的人，才有力氣不必討每一個人喜歡。<\/p>"},{"a":11,"z":12,"star":1,"grk":"<p lang=\"grc\">Γνωρίζω γὰρ ὑμῖν, ἀδελφοί, τὸ εὐαγγέλιον τὸ εὐαγγελισθὲν ὑπʼ ἐμοῦ ὅτι οὐκ ἔστιν κατὰ ἄνθρωπον·<\/p><p lang=\"grc\">οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον αὐτό, οὔτε ἐδιδάχθην, ἀλλὰ διʼ ἀποκαλύψεως Ἰησοῦ Χριστοῦ.<\/p>","lit":"<p>因為我讓你們知道，弟兄們，那被我所傳的福音，它不是照著人的；<\/p><p>因為我也不是從人那裡領受了它，也不是被教導的，而是藉著耶穌基督的啟示。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Γνωρίζω γὰρ ὑμῖν<\/td><td>Gnōrizō gar hymin<\/td><td>因為我讓你們知道<\/td><td>宣告的套語：以下是正式聲明<\/td><\/tr><tr><td>οὐκ ἔστιν κατὰ ἄνθρωπον<\/td><td>ouk estin kata anthrōpon<\/td><td>不是照著人的<\/td><td>不是人的標準，也不是人的出品<\/td><\/tr><tr><td>παρὰ ἀνθρώπου παρέλαβον<\/td><td>para anthrōpou parelabon<\/td><td>從人領受<\/td><td>第一個否定：傳承<\/td><\/tr><tr><td>ἐδιδάχθην<\/td><td>edidachthēn<\/td><td>我被教導<\/td><td>第二個否定：課堂<\/td><\/tr><tr><td>διʼ ἀποκαλύψεως Ἰησοῦ Χριστοῦ<\/td><td>di' apokalypseōs Iēsou Christou<\/td><td>藉著耶穌基督的啟示<\/td><td>受格屬格與主格屬格兩讀<\/td><\/tr><\/table>","gram":"<p><strong>這兩節是 1:11–2:21 整段自傳的主題句，後面每一個地名、每一個日數，都在證明這一句。<\/strong><\/p><p>Γνωρίζω γὰρ ὑμῖν（Gnōrizō gar hymin） 是正式聲明的開場，林前 15:1 也用同樣的套語。τὸ εὐαγγέλιον τὸ εὐαγγελισθὲν ὑπʼ ἐμοῦ（to euangelion to euangelisthen hyp' emou） 用了同字根的名詞與分詞，「被我傳為福音的那福音」。οὐκ ἔστιν κατὰ ἄνθρωπον（ouk estin kata anthrōpon） 可指「不合人的標準」，也可指「不是人的出品」；第 12 節把後一義說清楚：οὐδὲ（oude）……παρὰ ἀνθρώπου παρέλαβον（para anthrōpou parelabon）, οὔτε ἐδιδάχθην（oute edidachthēn），一個否定傳承，一個否定課堂，對應 1:1 的兩個介系詞。<\/p><p>διʼ ἀποκαλύψεως Ἰησοῦ Χριστοῦ（di' apokalypseōs Iēsou Christou） 的屬格有兩讀：一、受格屬格，「把耶穌基督啟示出來」，基督是被啟示的內容；二、主格屬格，「耶穌基督所給的啟示」，基督是啟示者。1:16 說神 ἀποκαλύψαι τὸν υἱὸν αὐτοῦ（apokalypsai ton huion autou），啟示的內容是兒子本身，本講義因此以第一讀為主，同時不排除第二讀：啟示的人和被啟示的，都是同一位基督。<\/p>","exp":"<p><strong>「我素來所傳的福音不是出於人的意思。因為我不是從人領受的，也不是人教導我的，乃是從耶穌基督啟示來的。」（1:11–12）<\/strong><\/p><p>這裡似乎有一個張力。保羅在哥林多前書第 15 章說，他把「所領受的」傳給人：基督死了、埋葬了、復活了，又顯給磯法看。那些事實他當然從教會聽過，他從前就是因為聽見了才去逼迫。分別在這裡：關於耶穌的事，他早就知道；但這位被釘的人就是神的兒子、就是福音本身——這件事沒有人說服得了他，是神親自打開的。資訊可以傳授，啟示只能領受。<\/p><p>這也是加拉太人的處境：他們要分辨的，不是哪位老師資歷比較深，而是福音從哪裡來。今天的信徒也常把信仰當作一套從教會繼承的說法；保羅提醒我們，傳承很寶貴，但人終究需要親自被基督遇見。沒有被啟示過的傳承，很容易變成攪擾者那樣的規矩；被啟示過的人，才知道福音不能再加甚麼。<\/p>"},{"a":13,"z":14,"star":2,"grk":"<p lang=\"grc\">Ἠκούσατε γὰρ τὴν ἐμὴν ἀναστροφήν ποτε ἐν τῷ Ἰουδαϊσμῷ, ὅτι καθʼ ὑπερβολὴν ἐδίωκον τὴν ἐκκλησίαν τοῦ θεοῦ καὶ ἐπόρθουν αὐτήν,<\/p><p lang=\"grc\">καὶ προέκοπτον ἐν τῷ Ἰουδαϊσμῷ ὑπὲρ πολλοὺς συνηλικιώτας ἐν τῷ γένει μου, περισσοτέρως ζηλωτὴς ὑπάρχων τῶν πατρικῶν μου παραδόσεων.<\/p>","lit":"<p>因為你們聽過我從前在猶太教裡的為人：我過度地一直逼迫神的教會，並且一直要毀滅它，<\/p><p>並且我在猶太教裡一直超前，勝過我同族中許多同齡的人，更加是我祖先傳統的熱心者。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τὴν ἐμὴν ἀναστροφήν ποτε<\/td><td>tēn emēn anastrophēn pote<\/td><td>我從前的為人<\/td><td>生活方式；ποτε 與 1:23 呼應<\/td><\/tr><tr><td>ἐν τῷ Ἰουδαϊσμῷ<\/td><td>en tō Ioudaismō<\/td><td>在猶太教裡<\/td><td>新約只在這兩節出現<\/td><\/tr><tr><td>καθʼ ὑπερβολὴν<\/td><td>kath' hyperbolēn<\/td><td>過度地<\/td><td>沒有尺度的狂熱<\/td><\/tr><tr><td>ἐδίωκον<\/td><td>ediōkon<\/td><td>我一直逼迫<\/td><td>未完成式：不是一時衝動<\/td><\/tr><tr><td>ἐπόρθουν<\/td><td>eporthoun<\/td><td>我一直要毀滅<\/td><td>攻城掠地的字；1:23 再現<\/td><\/tr><tr><td>προέκοπτον<\/td><td>proekopton<\/td><td>我一直超前<\/td><td>像開路的人砍出一條路<\/td><\/tr><tr><td>ζηλωτὴς<\/td><td>zēlōtēs<\/td><td>熱心者<\/td><td>非尼哈與馬加比的傳統<\/td><\/tr><tr><td>τῶν πατρικῶν μου παραδόσεων<\/td><td>tōn patrikōn mou paradoseōn<\/td><td>我祖先的傳統<\/td><td>人傳下來的；與 1:12 的「不是從人」對照<\/td><\/tr><\/table>","gram":"<p><strong>兩節裡連用三個未完成式：ἐδίωκον（ediōkon）、ἐπόρθουν（eporthoun）、προέκοπτον（proekopton）。那不是一次失手，是一種生活。<\/strong><\/p><p>未完成式描寫持續的動作，ἐπόρθουν（eporthoun） 也可讀作「企圖性的」未完成式：「我一直試著要毀滅它」——他沒有成功。ἐπόρθουν（eporthoun） 在古代文獻裡常用來描寫軍隊洗劫城市；保羅用它形容自己對待 τὴν ἐκκλησίαν τοῦ θεοῦ（tēn ekklēsian tou theou）。他現在明白，他當年追殺的，是神的教會。這個字到 1:23 還會出現一次：ἥν ποτε ἐπόρθει（hēn pote eporthei），首尾成框。<\/p><p>Ἰουδαϊσμός（Ioudaismos） 在新約只出現在這兩節。它不等於今天所說的「猶太宗教」，在馬加比書的時代，它指抵抗希臘化、全力保守猶太人分別為聖的生活方式。ζηλωτὴς（zēlōtēs） 未必指後來的奮銳黨，而是承接非尼哈「以我的忌邪為心」（民 25:11）的熱心傳統：為了神的榮耀，不惜動刀。προέκοπτον（proekopton） 原意是砍出一條路往前推進，ὑπὲρ πολλοὺς συνηλικιώτας（hyper pollous synēlikiōtas） 說他在同齡人中拔尖。τῶν πατρικῶν μου παραδόσεων（tōn patrikōn mou paradoseōn） 是「人傳下來的」，與 1:12 οὐδὲ γὰρ ἐγὼ παρὰ ἀνθρώπου παρέλαβον（oude gar egō para anthrōpou parelabon） 正好相對：他從前的熱心，全是領受自人的。<\/p>","exp":"<p>〔背景〕徒 9:1--2（使徒行傳講義第 9 章）<\/p><p><strong>保羅講自己的過去，不是為了作見證感動人，而是在交證據。<\/strong><\/p><p>「你們聽見我從前在猶太教中所行的事，怎樣極力逼迫殘害神的教會」（1:13）。使徒行傳講義第 9 章講過那個「口吐威嚇凶煞的話」（徒 9:1）的掃羅，帶著大祭司的文書往大馬士革去捉人。保羅自己也說：「就熱心說，我是逼迫教會的」（腓 3:6）。他的論證很簡單：一個這樣的人，不可能是被哪位使徒慢慢勸服的。從人的角度看，他是最不可能接受這福音的人。所以，他的福音只能另有來源。<\/p><p>這兩節還有一層更細的意思。那些來加拉太的教師很熱心，熱心要外邦人守割禮與律法。保羅說：這種熱心我太熟悉了，我曾經是其中最出色的一個。「為我祖宗的遺傳更加熱心」（1:14），結果是拿刀對著神的教會。熱心本身不能證明方向是對的。<\/p><p>這裡必須說清楚：保羅不是在貶低猶太人或猶太傳統。他到老都說自己是猶太人、以色列人；他否定的是他自己「過度」的那一種熱心，那種要把不一樣的人除掉的熱心。這種熱心，任何宗教、任何教會都可能有。<\/p><p>一個人的過去會不會使他不配事奉？保羅後來寫：「我從前是褻瀆神的，逼迫人的，侮慢人的；然而我還蒙了憐憫」（提前 1:13）。過去不需要被隱藏，也不需要被美化；它被放在恩典旁邊，正好顯出恩典有多大。本章議題頁另有討論。<\/p>"},{"a":15,"z":16,"star":3,"grk":"<p lang=\"grc\">ὅτε δὲ εὐδόκησεν ὁ ἀφορίσας με ἐκ κοιλίας μητρός μου καὶ καλέσας διὰ τῆς χάριτος αὐτοῦ<\/p><p lang=\"grc\">ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν, εὐθέως οὐ προσανεθέμην σαρκὶ καὶ αἵματι,<\/p>","lit":"<p>但當那位從我母親的腹中就把我分別出來、又藉著他的恩典呼召我的，樂意<\/p><p>把他的兒子啟示在我裡面，好叫我在外邦人中把他當作福音傳揚，我立刻沒有與肉和血商量，<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>εὐδόκησεν<\/td><td>eudokēsen<\/td><td>他樂意<\/td><td>SBLGNT 沒有主詞「神」，主詞藏在動詞與分詞裡<\/td><\/tr><tr><td>ὁ ἀφορίσας με<\/td><td>ho aphorisas me<\/td><td>那把我分別出來的<\/td><td>與「法利賽」（分別出來的人）諧音<\/td><\/tr><tr><td>ἐκ κοιλίας μητρός μου<\/td><td>ek koilias mētros mou<\/td><td>從我母親的腹中<\/td><td>在任何作為之前<\/td><\/tr><tr><td>καλέσας διὰ τῆς χάριτος αὐτοῦ<\/td><td>kalesas dia tēs charitos autou<\/td><td>藉著他的恩典呼召<\/td><td>呼召的管道是恩典<\/td><\/tr><tr><td>ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ<\/td><td>apokalypsai ton huion autou en emoi<\/td><td>把他的兒子啟示在我裡面<\/td><td>章題；追蹤五第一站<\/td><\/tr><tr><td>ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν<\/td><td>hina euangelizōmai auton en tois ethnesin<\/td><td>好叫我在外邦人中傳他<\/td><td>現在式：一生的任務<\/td><\/tr><tr><td>εὐθέως<\/td><td>eutheōs<\/td><td>立刻<\/td><td>保羅自己的動作從這裡才開始<\/td><\/tr><tr><td>οὐ προσανεθέμην σαρκὶ καὶ αἵματι<\/td><td>ou prosanethemēn sarki kai haimati<\/td><td>沒有與肉和血商量<\/td><td>追蹤二第一站：σάρξ 在這裡只是「人」<\/td><\/tr><\/table>","gram":"<p><strong>◆ 經文鑑別 1:15：SBLGNT 作 ὅτε δὲ εὐδόκησεν（hote de eudokēsen），沒有 ὁ θεός（ho theos）；和合本「神」與 WH、NA28、RP 同。<\/strong><\/p><p>兩種讀法：一、有 ὁ θεός（ho theos），WH 正文、NA28、Tregelles 與拜占庭傳統（RP）都採用，抄本支持廣；二、沒有 ὁ θεός（ho theos），一些很早的抄本（如 P46 與梵蒂岡抄本）沒有這兩字，Holmes 編 SBLGNT 時採用了 WH 的旁註讀法。支持較短讀法的理由是：抄寫者容易為了句意清楚而補上主詞，不容易刪掉它。本講義照和合本讀「神」，並交代 SBLGNT 的讀法。兩種讀法意思完全相同：即使沒有寫出來，ὁ ἀφορίσας（ho aphorisas） 與 καλέσας（kalesas） 的主詞也只能是神。這一處異文不影響任何教義。<\/p><p>這兩節是一個長句，主詞是神，動作也全是神的：εὐδόκησεν（eudokēsen）、ἀφορίσας（aphorisas）、καλέσας（kalesas）、ἀποκαλύψαι（apokalypsai）。保羅自己的第一個動詞，要到 εὐθέως οὐ προσανεθέμην（eutheōs ou prosanethemēn） 才出現，而且是否定的。ἀφορίσας（aphorisas）「分別出來」，學者觀察到它與「法利賽人」的字源（希伯來文「分別出來的人」）相近：他從前以為自己分別出來是為了守律法，原來神早已把他分別出來傳福音。<\/p><p>章題 ἀποκαλύψαι τὸν υἱὸν αὐτοῦ ἐν ἐμοὶ（apokalypsai ton huion autou en emoi） 的 ἐν ἐμοί（en emoi） 有三種讀法：一、「在我裡面」，內在的啟示（林後 4:6「照在我們心裡」）；二、「向我」，簡單的間接受詞，指大馬士革路上的顯現；三、「藉著我」，神藉保羅的生命把兒子顯給外邦人看。和合本「在我心裡」取第一讀。本講義從第一讀，同時留意第三讀：1:24 同樣的 ἐν ἐμοὶ（en emoi），眾教會就「在我身上」歸榮耀給神——啟示在裡面發生，也從裡面透出來。σαρκὶ καὶ αἵματι（sarki kai haimati） 是希伯來式的說法，「肉和血」就是人；主對彼得也說「這不是屬血肉的指示你的」（太 16:17）。<\/p>","exp":"<p>〔背景〕徒 9:3--6（使徒行傳講義第 9 章）<\/p><p><strong>「既然樂意將他兒子啟示在我心裡，叫我把他傳在外邦人中」（1:16）——這是本章的章題，也是本章的答案。<\/strong><\/p><p>第 6 節是問題：加拉太人轉向別的福音；第 16 節是答案：福音不是一套說法，是一個人——神的兒子。保羅在大馬士革路上得著的，不是一份更正確的教義表，而是「主啊！你是誰？」（徒 9:5）的那一聲回答。全卷第一次出現的「兒子」就是神的兒子；到 3:26 這一個兒子會打開成為許多兒子，到 4:6 我們也能用兒子的口氣呼叫「阿爸」。追蹤五由此起步。<\/p><p>第 15 節把呼召推到他出生以前：「那把我從母腹裡分別出來、又施恩召我的神」（1:15）。保羅沒有引經，但這使我們想起耶利米：「你未出母胎，我已分別你為聖」（耶 1:5），也使我們想起以賽亞書的僕人：「自出母腹，他就提我的名」（賽 49:1）。保羅把自己放在先知蒙召的行列裡，而那位僕人的使命，正是作外邦人的光。這不是宿命論：神在他出生前就定意，而他在路上親身被遇見、親身回應。預定與呼召的討論，見本章議題頁。<\/p><p>這兩節對加拉太人的意思很直接。保羅在母腹裡還沒有受割禮，就已經被分別出來；他被呼召，是「施恩」召的。如果連使徒的呼召都在任何功課、任何記號之前，外邦人的得救還需要甚麼「再加上」呢？呼召與差遣也是同一件事：神啟示兒子，「叫我把他傳在外邦人中」。主早就對亞拿尼亞說，他是「我所揀選的器皿，要在外邦人和君王，並以色列人面前宣揚我的名」（徒 9:15）。<\/p><p>「我就沒有與屬血氣的人商量」（1:16）不是傲慢。他不是不聽勸，而是這件事的源頭不能由人來批准。今天蒙召的人仍然需要教會的印證與陪伴，2:2 保羅自己也這樣做；但呼召的根，要扎在神親自的啟示裡，否則風一吹就倒。321 所說「耶穌是我的榜樣」也從這裡開始：不是先學一個模範，是先被那一位兒子遇見。<\/p>"},{"a":17,"z":17,"star":1,"grk":"<p lang=\"grc\">οὐδὲ ἀνῆλθον εἰς Ἱεροσόλυμα πρὸς τοὺς πρὸ ἐμοῦ ἀποστόλους, ἀλλὰ ἀπῆλθον εἰς Ἀραβίαν, καὶ πάλιν ὑπέστρεψα εἰς Δαμασκόν.<\/p>","lit":"<p>也沒有上耶路撒冷去，到那些在我以前的使徒那裡，而是離開往阿拉伯去，然後又回到大馬士革。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἀνῆλθον εἰς Ἱεροσόλυμα<\/td><td>anēlthon eis Hierosolyma<\/td><td>上耶路撒冷<\/td><td>「上」去：往權威的中心<\/td><\/tr><tr><td>τοὺς πρὸ ἐμοῦ ἀποστόλους<\/td><td>tous pro emou apostolous<\/td><td>在我以前的使徒<\/td><td>πρό 是時間在先，不是地位在上<\/td><\/tr><tr><td>ἀπῆλθον εἰς Ἀραβίαν<\/td><td>apēlthon eis Arabian<\/td><td>離開往阿拉伯去<\/td><td>與「上去」成對的「離開」<\/td><\/tr><tr><td>ὑπέστρεψα εἰς Δαμασκόν<\/td><td>hypestrepsa eis Damaskon<\/td><td>回到大馬士革<\/td><td>順帶說出蒙召的地點<\/td><\/tr><\/table>","gram":"<p><strong>兩個動詞只差一個前綴：οὐδὲ ἀνῆλθον（oude anēlthon），ἀλλὰ ἀπῆλθον（alla apēlthon）——沒有「上去」，而是「離開」。<\/strong><\/p><p>耶路撒冷在地勢上、在信仰上都要「上去」；保羅偏偏往反方向走。τοὺς πρὸ ἐμοῦ ἀποστόλους（tous pro emou apostolous） 的 πρό（pro） 只說時間在先，保羅承認他們比他早作使徒，卻沒有說他們在他之上。ὑπέστρεψα εἰς Δαμασκόν（hypestrepsa eis Damaskon） 的「回到」順帶告訴讀者：他蒙召的地點就是大馬士革，與使徒行傳一致。<\/p><p>Ἀραβίαν（Arabian） 指當時的拿巴提王國，在大馬士革東南與南方。他在那裡做甚麼，經文沒有說，各家看法有三：一、退修默想，重新整理整本舊約；二、傳道，因為上一節剛說 ἵνα εὐαγγελίζωμαι αὐτὸν ἐν τοῖς ἔθνεσιν（hina euangelizōmai auton en tois ethnesin），而後來拿巴提的「亞哩達王手下的提督」要捉拿他（林後 11:32），可見他在那裡惹起了注意；三、到西奈山，像以利亞「到了神的山」（王上 19:8），學者觀察到 4:25 保羅提到「阿拉伯的西奈山」（4:25）。本講義不定案，以第二說為較可能，並包含第一說。<\/p>","exp":"<p>〔背景〕徒 9:19--25（使徒行傳講義第 9 章）<\/p><p><strong>保羅說了一件使徒行傳沒有記的事：他去了阿拉伯。<\/strong><\/p><p>使徒行傳講義第 9 章講過，掃羅在大馬士革「就在各會堂裡宣傳耶穌，說他是神的兒子」（徒 9:20），後來「過了好些日子」（徒 9:23），猶太人要殺他，門徒用筐子把他從城牆縋下去。阿拉伯的那一段，大概就藏在「好些日子」裡。路加寫的是福音往前推進的歷史，保羅寫的是他的福音從哪裡來；兩份記錄重點不同，並不衝突。<\/p><p>對加拉太人來說，這一節的重點是方向：保羅蒙召以後，沒有先去耶路撒冷報到、取得資格。他沒有否定那些使徒，只是說他的使命不是從他們那裡領來的。這裡的阿拉伯也不是要說哪一個民族好或壞，它只是一個地名；把它和今天的族群拉在一起，是讀錯了經文。至於那一段沒人看見的日子，它提醒今天的事奉者：被神差遣以前，常有一段不在台上的時間，那段時間不是浪費。<\/p>"},{"a":18,"z":20,"star":2,"grk":"<p lang=\"grc\">Ἔπειτα μετὰ ἔτη τρία ἀνῆλθον εἰς Ἱεροσόλυμα ἱστορῆσαι Κηφᾶν καὶ ἐπέμεινα πρὸς αὐτὸν ἡμέρας δεκαπέντε·<\/p><p lang=\"grc\">ἕτερον δὲ τῶν ἀποστόλων οὐκ εἶδον, εἰ μὴ Ἰάκωβον τὸν ἀδελφὸν τοῦ κυρίου.<\/p><p lang=\"grc\">ἃ δὲ γράφω ὑμῖν, ἰδοὺ ἐνώπιον τοῦ θεοῦ ὅτι οὐ ψεύδομαι.<\/p>","lit":"<p>然後過了三年，我上耶路撒冷去拜訪磯法，並且在他那裡住了十五天；<\/p><p>但另外的使徒我沒有看見，除了雅各，主的兄弟。<\/p><p>而我寫給你們的這些事，看哪，在神面前，我不說謊。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Ἔπειτα μετὰ ἔτη τρία<\/td><td>Epeita meta etē tria<\/td><td>然後過了三年<\/td><td>Ἔπειτα 一連三次排出年表<\/td><\/tr><tr><td>ἱστορῆσαι Κηφᾶν<\/td><td>historēsai Kēphan<\/td><td>去拜訪磯法<\/td><td>認識、親自察看；不是去領受福音<\/td><\/tr><tr><td>ἐπέμεινα πρὸς αὐτὸν<\/td><td>epemeina pros auton<\/td><td>在他那裡住下<\/td><td>同住，不是受訓<\/td><\/tr><tr><td>ἡμέρας δεκαπέντε<\/td><td>hēmeras dekapente<\/td><td>十五天<\/td><td>精確而短<\/td><\/tr><tr><td>Ἰάκωβον τὸν ἀδελφὸν τοῦ κυρίου<\/td><td>Iakōbon ton adelphon tou kyriou<\/td><td>雅各，主的兄弟<\/td><td>後來的耶路撒冷柱石（2:9）<\/td><\/tr><tr><td>ἰδοὺ ἐνώπιον τοῦ θεοῦ ὅτι οὐ ψεύδομαι<\/td><td>idou enōpion tou theou hoti ou pseudomai<\/td><td>看哪，在神面前，我不說謊<\/td><td>起誓的格式<\/td><\/tr><\/table>","gram":"<p><strong>Ἔπειτα（Epeita） 是年表的記號：1:18、1:21、2:1 一連三次，保羅把自己的行蹤一段一段排在讀者面前。<\/strong><\/p><p>ἱστορῆσαι（historēsai） 在新約只出現這一次。希臘史家用這個字表示「親自去察看、打聽」，日常用法是拜訪、結識一位人物。保羅選這個字，有分寸：他去見磯法，是去認識他，當然也聽他講耶穌的事；但不是去領受福音、取得授權。Κηφᾶν（Kēphan） 是亞蘭文的「磐石」，保羅多用這個名字，2:7–8 才改稱彼得。ἐπέμεινα πρὸς αὐτὸν ἡμέρας δεκαπέντε（epemeina pros auton hēmeras dekapente） 是同住十五天，數字精確，時間短。<\/p><p>第 19 節 εἰ μὴ Ἰάκωβον（ei mē Iakōbon） 有兩種讀法：一、「別的使徒我沒有見過，除了雅各」，雅各被算在使徒之內；二、「別的使徒我沒有見過，只見了雅各」，εἰ μή（ei mē） 作「只是」解，雅各不算在十二使徒中。本講義判斷前者較自然，但無論哪一種，保羅要說的都是：見的人很少，時間很短。第 20 節 ἰδοὺ ἐνώπιον τοῦ θεοῦ ὅτι οὐ ψεύδομαι（idou enōpion tou theou hoti ou pseudomai） 是起誓，暗示有人在流傳另一個版本的保羅生平。<\/p>","exp":"<p>〔背景〕徒 9:26--30（使徒行傳講義第 9 章）<\/p><p><strong>「過了三年，才上耶路撒冷去見磯法，和他同住了十五天。」（1:18）<\/strong><\/p><p>使徒行傳講義第 9 章講過這次上耶路撒冷：門徒都怕他，「惟有巴拿巴接待他，領去見使徒」（徒 9:27）。路加說「使徒」，是概括的寫法；保羅精確地說，只見了磯法和雅各。兩份記錄並不矛盾，一份講接納，一份講來源。<\/p><p>保羅這幾節有兩面要一起讀。一面是：三年之後才去，只住十五天，除了兩個人誰也沒見——他的福音不是在耶路撒冷學來的。另一面是：他畢竟去了，而且是去「認識」磯法，和他同住。保羅沒有反耶路撒冷，也沒有看不起彼得；他珍惜這份相交，只是不肯讓相交變成授權。今天也是一樣：尊重前輩、彼此相交是美事，但福音的真偽不由誰的資歷決定。<\/p><p>第 20 節他忽然起誓：「我寫給你們的不是謊話，這是我在神面前說的」（1:20）。在一段平淡的年表裡起誓，表示有人正在扭曲這段歷史，把他說成耶路撒冷的學生，說他後來偏離了老師。保羅的回應不是放大自己的故事，而是把細節說準：三年、十五天、兩個人。今天講見證的人也當學這一點：在神面前說話，不加油，也不添醋。<\/p>"},{"a":21,"z":24,"star":1,"grk":"<p lang=\"grc\">ἔπειτα ἦλθον εἰς τὰ κλίματα τῆς Συρίας καὶ τῆς Κιλικίας.<\/p><p lang=\"grc\">ἤμην δὲ ἀγνοούμενος τῷ προσώπῳ ταῖς ἐκκλησίαις τῆς Ἰουδαίας ταῖς ἐν Χριστῷ,<\/p><p lang=\"grc\">μόνον δὲ ἀκούοντες ἦσαν ὅτι Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται τὴν πίστιν ἥν ποτε ἐπόρθει,<\/p><p lang=\"grc\">καὶ ἐδόξαζον ἐν ἐμοὶ τὸν θεόν.<\/p>","lit":"<p>然後我去了敘利亞和基利家的地區。<\/p><p>而我的面是猶太那些在基督裡的教會一直不認得的；<\/p><p>他們只是一直聽說：「那從前逼迫我們的，現在傳揚他從前一直要毀滅的那信仰」，<\/p><p>他們就在我身上一直榮耀神。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τὰ κλίματα τῆς Συρίας καὶ τῆς Κιλικίας<\/td><td>ta klimata tēs Syrias kai tēs Kilikias<\/td><td>敘利亞和基利家的地區<\/td><td>安提阿與大數一帶<\/td><\/tr><tr><td>ἤμην δὲ ἀγνοούμενος τῷ προσώπῳ<\/td><td>ēmēn de agnooumenos tō prosōpō<\/td><td>我的面一直不被認得<\/td><td>迂說式未完成式：持續的狀態<\/td><\/tr><tr><td>ταῖς ἐν Χριστῷ<\/td><td>tais en Christō<\/td><td>那些在基督裡的<\/td><td>猶太的教會也「在基督裡」<\/td><\/tr><tr><td>Ὁ διώκων ἡμᾶς ποτε<\/td><td>Ho diōkōn hēmas pote<\/td><td>那從前逼迫我們的<\/td><td>眾教會口中的話：一個名號<\/td><\/tr><tr><td>νῦν εὐαγγελίζεται τὴν πίστιν<\/td><td>nyn euangelizetai tēn pistin<\/td><td>現在傳揚那信仰<\/td><td>全卷第一個 πίστις<\/td><\/tr><tr><td>ἐδόξαζον ἐν ἐμοὶ τὸν θεόν<\/td><td>edoxazon en emoi ton theon<\/td><td>在我身上一直榮耀神<\/td><td>與 1:16 的 ἐν ἐμοὶ 呼應<\/td><\/tr><\/table>","gram":"<p><strong>這一段用了三個持續的動作：ἤμην ἀγνοούμενος（ēmēn agnooumenos）、ἀκούοντες ἦσαν（akouontes ēsan）、ἐδόξαζον（edoxazon）。<\/strong><\/p><p>前兩個是迂說式未完成式（εἰμί（eimi） 加分詞），描寫一段時間裡持續的狀態：猶太的教會一直不認得他的面，只是一直聽說。第 23 節 SBLGNT 用大寫的 Ὁ（Ho） 標出直接引語，那是眾教會彼此傳講的話：Ὁ διώκων ἡμᾶς ποτε νῦν εὐαγγελίζεται（Ho diōkōn hēmas pote nyn euangelizetai）。ποτε（pote） 與 νῦν（nyn） 對立，ὁ διώκων（ho diōkōn） 用現在分詞當名號：「那個逼迫者」——他的外號還在，內容已經全變了。<\/p><p>τὴν πίστιν（tēn pistin） 是全卷第一次出現 πίστις（pistis），這裡指所信的內容，也就是福音；ἥν ποτε ἐπόρθει（hēn pote eporthei） 回到 1:13 的 ἐπόρθουν（eporthoun），把逼迫的那一段框起來。最後 ἐδόξαζον ἐν ἐμοὶ τὸν θεόν（edoxazon en emoi ton theon），ἐν ἐμοὶ（en emoi） 可譯「因我」「在我身上」，和合本作「為我的緣故」。它與 1:16 ἐν ἐμοί（en emoi） 同一個片語：神把兒子啟示「在我裡面」，眾教會就「在我身上」看見神。全章從第 5 節的 ἡ δόξα（hē doxa） 開始，在這裡的 ἐδόξαζον（edoxazon） 收尾。<\/p>","exp":"<p><strong>「他們就為我的緣故，歸榮耀給神。」（1:24）<\/strong><\/p><p>保羅接著去了「敘利亞和基利家境內」（1:21），基利家的大數是他的家鄉，使徒行傳說弟兄們送他回大數，後來巴拿巴再去那裡找他。這些年他不在猶太，所以猶太的教會「都沒有見過我的面」（1:22）。對加拉太人來說，這又是一條證據：他沒有在猶太的教會裡受訓。<\/p><p>但這一段最動人的，不在論證，而在結尾。那些教會只聽見一句話：「那從前逼迫我們的，現在傳揚他原先所殘害的真道」（1:23）。他們沒有說「保羅真了不起」，他們歸榮耀給神。一個被改變的人，叫人看見的不是他，是那位改變他的神。<\/p><p>這和攪擾的人正好相反。保羅後來說，他們要外邦人受割禮，「不過要藉著你們的肉體誇口」（6:13）：別人的改變成了他們的成績。保羅的改變，卻叫遠方從未見面的弟兄姊妹為神歡呼。321 所說的無己，在這一章最早的樣子就在這裡：人看見的，是神。<\/p>"}],"2":[{"a":1,"z":2,"star":2,"grk":"<p lang=\"grc\">Ἔπειτα διὰ δεκατεσσάρων ἐτῶν πάλιν ἀνέβην εἰς Ἱεροσόλυμα μετὰ Βαρναβᾶ συμπαραλαβὼν καὶ Τίτον·<\/p><p lang=\"grc\">ἀνέβην δὲ κατὰ ἀποκάλυψιν· καὶ ἀνεθέμην αὐτοῖς τὸ εὐαγγέλιον ὃ κηρύσσω ἐν τοῖς ἔθνεσιν, κατʼ ἰδίαν δὲ τοῖς δοκοῦσιν, μή πως εἰς κενὸν τρέχω ἢ ἔδραμον.<\/p>","lit":"<p>然後，經過十四年，我又上耶路撒冷去，與巴拿巴一起，也一同帶上提多；<\/p><p>我是照著啟示上去的；我把我在外邦人中所傳的福音向他們陳明，卻是私下向那些有名望的，免得我現在跑的、或已經跑過的落了空。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>διὰ δεκατεσσάρων ἐτῶν<\/td><td>dia dekatessarōn etōn<\/td><td>經過十四年<\/td><td>從哪一年算起，學者有兩說<\/td><\/tr><tr><td>πάλιν ἀνέβην<\/td><td>palin anebēn<\/td><td>我又上去<\/td><td>「又」回指 1:18 那十五天<\/td><\/tr><tr><td>συμπαραλαβὼν καὶ Τίτον<\/td><td>symparalabōn kai Titon<\/td><td>也一同帶上提多<\/td><td>一個未受割禮的活證據<\/td><\/tr><tr><td>κατὰ ἀποκάλυψιν<\/td><td>kata apokalypsin<\/td><td>照著啟示<\/td><td>不是被傳喚，是被差遣<\/td><\/tr><tr><td>ἀνεθέμην αὐτοῖς<\/td><td>anethemēn autois<\/td><td>我向他們陳明<\/td><td>攤開來請人看，不是請人批准<\/td><\/tr><tr><td>κατʼ ἰδίαν<\/td><td>kat' idian<\/td><td>私下<\/td><td>先私下，不是先公開<\/td><\/tr><tr><td>μή πως εἰς κενὸν τρέχω ἢ ἔδραμον<\/td><td>mē pōs eis kenon trechō ē edramon<\/td><td>免得我現在跑的、已經跑的落空<\/td><td>現在式與過去式並列<\/td><\/tr><\/table>","gram":"<p><strong>2:1 的「十四年」從哪裡算，連著一個更大的問題：這是使徒行傳裡的哪一次上耶路撒冷？<\/strong><\/p><p>Ἔπειτα（Epeita） 是保羅自傳的接續詞，1:18、1:21 都用它，一站一站往下交代。διὰ δεκατεσσάρων ἐτῶν（dia dekatessarōn etōn） 的 διὰ（dia） 帶屬格，是「經過了」一段時間。十四年可以從蒙召算起（1:15–16），也可以從 1:18 見磯法那一次算起；古人連頭帶尾算年，兩說相差不過兩三年。πάλιν ἀνέβην（palin anebēn） 的 πάλιν（palin） 把讀者帶回 1:18：「過了三年，才上耶路撒冷去見磯法，和他同住了十五天」（1:18）——這是第二次。<\/p><p>使徒行傳記保羅歸主後上耶路撒冷，第二次是徒 11:30 送賑濟的那一趟，第三次是徒 15 的會議。學者分兩說。<strong>一說是徒 15<\/strong>：人物相同（巴拿巴、雅各、彼得），議題相同（外邦人要不要受割禮），結論也相同。<strong>一說是徒 11:30<\/strong>：保羅在 1:20 起誓說他不是說謊，正在逐次交代自己和耶路撒冷的每一次接觸，若略過一次，對手正好抓住；2:2 是 κατʼ ἰδίαν（kat' idian），私下的會面，徒 15 卻是公開的大會；2:10「記念窮人」與饑荒賑濟正相合；而且整封信隻字不提徒 15 的決議——那本該是保羅手上最有力的一張牌。本講義的判斷：兩說都有敬重聖經的學者支持；本講義略傾向徒 11:30（與南加拉太說、本信寫於會議之前相配），但不論是哪一次，這裡爭的正是徒 15 要解決的同一個問題。<\/p><blockquote><p>κατὰ ἀποκάλυψιν（kata apokalypsin） 放在句首強調：保羅不是被耶路撒冷傳喚去受審的。ἀνεθέμην（anethemēn） 是「攤開來請人看」，不是「請人批准」。μή πως εἰς κενὸν τρέχω ἢ ἔδραμον（mē pōs eis kenon trechō ē edramon） 把現在式 τρέχω（trechō） 和不定過去式 ἔδραμον（edramon） 並列：怕的是正在跑的、和已經跑完的那一段一起落空。保羅不怕自己的福音是假的——1:11–12 他說得很清楚；他怕的是耶路撒冷若不承認，外邦教會就要被割成另一個教會。<\/p><\/blockquote>","exp":"<p>〔背景〕徒 11:27--30；徒 15:1--29（使徒行傳講義第 11、15 章）<\/p><p>第 1 章保羅一直在證明一件事：他的福音不是從人領受的（1:11–12），不是耶路撒冷發給他的執照。第 2 章一開口，他卻上了耶路撒冷。這看起來像自相矛盾，其實是證明的下一步：他的福音不是從使徒那裡領來的，但也沒有和使徒對立。同一個福音，兩邊都認得出來。<\/p><p>他不是一個人去的。「我同巴拿巴又上耶路撒冷去，並帶著提多同去」（2:1）。巴拿巴是猶太人，是當年把保羅帶到使徒面前的人（徒 9:27）；提多是希臘人，沒有受割禮。這一行人本身就是一張小小的餐桌：一個猶太信徒、一個外邦信徒、一個兩邊都走過的使徒。保羅帶去耶路撒冷的不只是一篇道理，是一個活生生的外邦弟兄。<\/p><p>「我是奉啟示上去的」（2:2）。這一句保護了保羅的獨立：他不是被叫去受審的。可是緊接著，他「把我在外邦人中所傳的福音對弟兄們陳說」（2:2），而且是「背地裡對那有名望之人說的」（2:2）。一個確信自己蒙了啟示的人，仍然願意把自己傳的攤開來給人看。這是健康的屬靈權柄：確信，但不封閉；不受人轄制，但願意受人檢驗。<\/p><p>他怕甚麼？「惟恐我現在，或是從前，徒然奔跑」（2:2）。不是怕自己錯了，是怕耶路撒冷若不認，外邦人的教會和猶太人的教會就要分成兩個。多年的奔跑，可能落在一張分開的桌子上。今天的「割禮」也常常這樣開始：不是有人否認基督，是有人說「你們那邊的不算」。保羅上耶路撒冷，是為了不讓福音被切成兩半。<\/p>"},{"a":3,"z":5,"star":3,"grk":"<p lang=\"grc\">ἀλλʼ οὐδὲ Τίτος ὁ σὺν ἐμοί, Ἕλλην ὤν, ἠναγκάσθη περιτμηθῆναι·<\/p><p lang=\"grc\">διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους, οἵτινες παρεισῆλθον κατασκοπῆσαι τὴν ἐλευθερίαν ἡμῶν ἣν ἔχομεν ἐν Χριστῷ Ἰησοῦ, ἵνα ἡμᾶς καταδουλώσουσιν<\/p><p lang=\"grc\">οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ, ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς.<\/p>","lit":"<p>但連與我在一起的提多，他是希臘人，也沒有被強迫受割禮；<\/p><p>是因為那些被偷帶進來的假弟兄，他們溜進來，要窺探我們在基督耶穌裡所有的自由，為要使我們作奴僕——<\/p><p>我們連一個時辰也沒有以順服向他們讓步，為要使福音的真理常存在你們那裡。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Τίτος ὁ σὺν ἐμοί<\/td><td>Titos ho syn emoi<\/td><td>與我在一起的提多<\/td><td>人就站在會場裡<\/td><\/tr><tr><td>Ἕλλην ὤν<\/td><td>Hellēn ōn<\/td><td>他是希臘人<\/td><td>分詞：身分擺在桌上，不用改<\/td><\/tr><tr><td>ἠναγκάσθη περιτμηθῆναι<\/td><td>ēnankasthē peritmēthēnai<\/td><td>被強迫受割禮<\/td><td>2:14 的「勉強」同字根<\/td><\/tr><tr><td>παρεισάκτους ψευδαδέλφους<\/td><td>pareisaktous pseudadelphous<\/td><td>被偷帶進來的假弟兄<\/td><td>從旁邊溜進來的「弟兄」<\/td><\/tr><tr><td>κατασκοπῆσαι<\/td><td>kataskopēsai<\/td><td>窺探<\/td><td>探子的字<\/td><\/tr><tr><td>τὴν ἐλευθερίαν ἡμῶν<\/td><td>tēn eleutherian hēmōn<\/td><td>我們的自由<\/td><td>本卷「自由」追蹤第一站<\/td><\/tr><tr><td>ἵνα ἡμᾶς καταδουλώσουσιν<\/td><td>hina hēmas katadoulōsousin<\/td><td>為要使我們作奴僕<\/td><td>ἵνα 接未來式；此字無 Strong 編號<\/td><\/tr><tr><td>οὐδὲ πρὸς ὥραν εἴξαμεν<\/td><td>oude pros hōran eixamen<\/td><td>連一個時辰也沒有讓步<\/td><td>紅線一的原文根據<\/td><\/tr><tr><td>ἡ ἀλήθεια τοῦ εὐαγγελίου<\/td><td>hē alētheia tou euangeliou<\/td><td>福音的真理<\/td><td>2:14 再出現<\/td><\/tr><\/table>","gram":"<p><strong>2:3–5 是一句沒有寫完的長句。<\/strong><\/p><p>第 3 節 ἀλλʼ οὐδὲ Τίτος（all' oude Titos），「連提多也沒有」：ἠναγκάσθη περιτμηθῆναι（ēnankasthē peritmēthēnai） 是不定過去式被動——有人施壓，壓力沒有成功。這個字根到 2:14 會再出現：ἀναγκάζεις（anankazeis），彼得「勉強」外邦人隨猶太人。同一個「勉強」，耶路撒冷沒有做成，安提阿卻差一點做成了。Ἕλλην ὤν（Hellēn ōn） 是分詞，把提多的身分擺在桌上：他是希臘人，這一點不必改。<\/p><p>第 4 節 διὰ δὲ τοὺς παρεισάκτους ψευδαδέλφους（dia de tous pareisaktous pseudadelphous） 開了一個子句，卻沒有主要動詞——文法上稱為破格句。保羅一講到這些人，話就斷了，第 5 節換一個句子才接上。παρεισάκτους（pareisaktous） 與 παρεισῆλθον（pareisēlthon） 都帶 παρά（para） 加 εἰς（eis） 的前綴：「從旁邊溜進來」；κατασκοπῆσαι（kataskopēsai） 是探子的字。ἵνα ἡμᾶς καταδουλώσουσιν（hina hēmas katadoulōsousin） 是 ἵνα（hina） 接未來直說語氣，不常見，語氣更實：他們的目的就是要叫我們作奴僕。καταδουλώσουσιν（katadoulōsousin） 緊接在 SBLGNT 的異文標記之後，資料裡沒有 Strong 編號（字典形 καταδουλόω（katadouloō）），是本卷「自由／奴僕」追蹤的第一站。<\/p><blockquote><p>第 5 節 οἷς οὐδὲ πρὸς ὥραν εἴξαμεν τῇ ὑποταγῇ（hois oude pros hōran eixamen tē hypotagē）：「我們連一個時辰也沒有以順服向他們讓步」。πρὸς ὥραν（pros hōran） 是「一時、一個鐘頭」；εἴξαμεν（eixamen） 是不定過去式，一次也沒有。ἵνα ἡ ἀλήθεια τοῦ εὐαγγελίου διαμείνῃ πρὸς ὑμᾶς（hina hē alētheia tou euangeliou diameinē pros hymas）——不讓步的理由不是保羅的面子，是加拉太人的福音；διαμείνῃ（diameinē） 是「存留到底」。少數西方抄本在這裡缺 οἷς οὐδὲ（hois oude） 兩字，讀成「我們暫時讓步了」；絕大多數抄本與 SBLGNT、和合本都作否定，本講義從之。<\/p><\/blockquote>","exp":"<p>〔背景〕徒 15:1--5（使徒行傳講義第 15 章）<\/p><p>提多是一個活的測試。耶路撒冷若要他受割禮，福音就加了一樣；若不要，外邦人就不必先變成猶太人才能作基督徒。結果是：「與我同去的提多，雖是希臘人，也沒有勉強他受割禮」（2:3）。這不是一場辯論的結論，是一個人被接納了。福音的真理，常常不是先在講章裡決定，是在一個具體的人身上決定的。<\/p><p>壓力從哪裡來？保羅說得清楚：是「偷著引進來的假弟兄」（2:4）。要外邦信徒受割禮、守摩西律法才算數，<strong>這是這些假弟兄的主張<\/strong>，不是耶路撒冷使徒的主張，更不是保羅的——正是徒 15 那些人說的：「你們若不按摩西的規條受割禮，不能得救」（徒 15:1）。他們沒有否認耶穌，只是在耶穌後面加了一個「和」字。保羅稱他們為假弟兄，不是因為他們不夠熱心，是因為他們傳的不是同一個福音。他們做事的方式也洩露了動機：「私下窺探」（2:4），目的是「要叫我們作奴僕」（2:4）。<\/p><p>保羅的反應很硬：「我們就是一刻的工夫也沒有容讓順服他們」（2:5）。<strong>這一節是紅線一的原文根據。<\/strong>後來寫出「現在活著的不再是我，乃是基督在我裡面活著」（2:20）、又說基督為他捨己的同一個人，在這裡一步也不讓。無己的人不是沒有骨頭，是骨頭換成了基督的。他不讓，不是為了贏，是「為要叫福音的真理仍存在你們中間」（2:5）——為了別人，為了遠在加拉太、當時還沒有讀到這封信的那些人。<\/p><p>那麼徒 16:3 呢？保羅後來給提摩太行了割禮：「只因那些地方的猶太人都知道他父親是希臘人，就給他行了割禮」（徒 16:3）。這不是前後矛盾，是處境不同、原則一致。提多的割禮在這裡被當成得救的條件，一受就等於承認福音不夠；提摩太的母親是猶太人，行割禮是為了進會堂傳福音的方便（參林前 9:20）。<strong>同一個動作，當作門票就是另一個福音，當作為福音的讓步就是愛。<\/strong>今天的割禮可能是一種語言、一套服裝規矩、一個宗派的標記；它們本身未必錯，錯在被當成坐上桌子的門票（立場一）。<\/p>"},{"a":6,"z":8,"star":1,"grk":"<p lang=\"grc\">ἀπὸ δὲ τῶν δοκούντων εἶναί τι— ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει· πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει— ἐμοὶ γὰρ οἱ δοκοῦντες οὐδὲν προσανέθεντο,<\/p><p lang=\"grc\">ἀλλὰ τοὐναντίον ἰδόντες ὅτι πεπίστευμαι τὸ εὐαγγέλιον τῆς ἀκροβυστίας καθὼς Πέτρος τῆς περιτομῆς,<\/p><p lang=\"grc\">ὁ γὰρ ἐνεργήσας Πέτρῳ εἰς ἀποστολὴν τῆς περιτομῆς ἐνήργησεν καὶ ἐμοὶ εἰς τὰ ἔθνη,<\/p>","lit":"<p>至於那些被看為是個人物的——他們從前是何等人，與我毫無分別；神不取人的臉——因為那些有名望的，並沒有給我加上甚麼；<\/p><p>反倒，他們看見我被託付了未受割禮者的福音，正如彼得被託付了受割禮者的；<\/p><p>因為那在彼得身上運行、使他成為受割禮者之使徒的，也在我身上運行，使我往外邦人那裡去；<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τῶν δοκούντων εἶναί τι<\/td><td>tōn dokountōn einai ti<\/td><td>那些被看為是個人物的<\/td><td>本段 δοκέω 四次<\/td><\/tr><tr><td>οὐδέν μοι διαφέρει<\/td><td>ouden moi diapherei<\/td><td>對我沒有分別<\/td><td>不是輕看，是不被名望左右<\/td><\/tr><tr><td>πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει<\/td><td>prosōpon theos anthrōpou ou lambanei<\/td><td>神不取人的臉<\/td><td>希伯來式說法：不看身分給待遇<\/td><\/tr><tr><td>οὐδὲν προσανέθεντο<\/td><td>ouden prosanethento<\/td><td>沒有加上甚麼<\/td><td>與 2:2 ἀνεθέμην 同字根<\/td><\/tr><tr><td>πεπίστευμαι<\/td><td>pepisteumai<\/td><td>我已被託付<\/td><td>完成式被動：託付的是神<\/td><\/tr><tr><td>τῆς ἀκροβυστίας<\/td><td>tēs akrobystias<\/td><td>未受割禮者的<\/td><td>字面是「包皮」<\/td><\/tr><tr><td>ὁ γὰρ ἐνεργήσας Πέτρῳ<\/td><td>ho gar energēsas Petrō<\/td><td>那在彼得身上運行的<\/td><td>同一位運行者<\/td><\/tr><\/table>","gram":"<p><strong>2:6 的句子又斷了一次。<\/strong>ἀπὸ δὲ τῶν δοκούντων εἶναί τι（apo de tōn dokountōn einai ti） 起頭，中間插進兩道破折號：ὁποῖοί ποτε ἦσαν οὐδέν μοι διαφέρει（hopoioi pote ēsan ouden moi diapherei） 和 πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει（prosōpon theos anthrōpou ou lambanei），然後 ἐμοὶ γὰρ（emoi gar） 重起一句。SBLGNT 用破折號標出插句；和合本則用括號把 2:7–8 標成插句。保羅一寫到「有名望的」，話就繞了一圈。<\/p><p>δοκέω（dokeō） 在本段出現四次：τοῖς δοκοῦσιν（2:2）、τῶν δοκούντων（tōn dokountōn） 與 οἱ δοκοῦντες（2:6）、οἱ δοκοῦντες στῦλοι εἶναι（2:9）。學者爭論它的語氣：一說帶反諷，「那些被人捧為是個人物的」；一說只是中性的「公認的領袖」。本講義的判斷：不是貶低，是降溫。保羅尊重他們（2:9 他們伸出右手），卻不讓名望決定真理——插句 πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει（prosōpon theos anthrōpou ou lambanei） 就是理由：「取臉」是希伯來式的說法，指看人的身分給待遇。<\/p><blockquote><p>προσανέθεντο（prosanethento） 與 2:2 的 ἀνεθέμην（anethemēn） 同字根：保羅向他們「陳明」，他們沒有向保羅「加上」任何東西。第 7 節 πεπίστευμαι（pepisteumai） 是完成式被動：託付的是神，至今有效。τὸ εὐαγγέλιον τῆς ἀκροβυστίας（to euangelion tēs akrobystias） 與 Πέτρος τῆς περιτομῆς（Petros tēs peritomēs） 對稱，不是兩個福音，是同一個福音的兩個工場；第 8 節 ἐνεργήσας（energēsas） 與 ἐνήργησεν（enērgēsen） 是同一位在兩個人身上運行。<\/p><\/blockquote>","exp":"<p>「至於那些有名望的，不論他是何等人，都與我無干」（2:6）。這句話容易聽成傲慢，其實是自由。保羅不是說雅各、彼得、約翰不重要，他是說：他們的名望不會改變福音的內容。真理不因為說話的人地位高就加一分，也不因為地位低就減一分。理由只有一句：「神不以外貌取人」（2:6）。<\/p><p>這也保護了保羅自己。他不必為了柱石的一句認可而改變信息，也不必因為沒有頭銜而自卑。結果是：「那些有名望的，並沒有加增我甚麼」（2:6）——沒有加上割禮，沒有加上條件。<strong>耶路撒冷沒有在福音後面加一個「和」字。<\/strong>攪擾加拉太人的那些人，卻正要加。<\/p><p>反倒，他們「看見了主託我傳福音給那未受割禮的人，正如託彼得傳福音給那受割禮的人」（2:7）。兩個人，兩個工場，一位託付的主。和合本用括號把 2:7–8 標成插句，好像保羅忍不住要補一句：在彼得身上作工的，和在我身上作工的，是同一位。321 說「讓人作人，讓神作神」：連使徒柱石也只是人；託付和能力，都是神的。<\/p>"},{"a":9,"z":10,"star":2,"grk":"<p lang=\"grc\">καὶ γνόντες τὴν χάριν τὴν δοθεῖσάν μοι, Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης, οἱ δοκοῦντες στῦλοι εἶναι, δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας, ἵνα ἡμεῖς εἰς τὰ ἔθνη, αὐτοὶ δὲ εἰς τὴν περιτομήν·<\/p><p lang=\"grc\">μόνον τῶν πτωχῶν ἵνα μνημονεύωμεν, ὃ καὶ ἐσπούδασα αὐτὸ τοῦτο ποιῆσαι.<\/p>","lit":"<p>並且認出了那賜給我的恩典，雅各、磯法和約翰，那些被看為柱石的，就把相交的右手給了我和巴拿巴，為要我們往外邦人那裡，他們卻往受割禮的人那裡；<\/p><p>只是要我們記念窮人，這件事我也正熱心去做。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>γνόντες τὴν χάριν<\/td><td>gnontes tēn charin<\/td><td>認出了恩典<\/td><td>認的是恩典，不是保羅的本事<\/td><\/tr><tr><td>οἱ δοκοῦντες στῦλοι εἶναι<\/td><td>hoi dokountes styloi einai<\/td><td>被看為柱石的<\/td><td>柱子：聖殿的意象<\/td><\/tr><tr><td>δεξιὰς ἔδωκαν<\/td><td>dexias edōkan<\/td><td>給了右手<\/td><td>立約、結盟的手勢<\/td><\/tr><tr><td>κοινωνίας<\/td><td>koinōnias<\/td><td>相交的<\/td><td>放在句末強調<\/td><\/tr><tr><td>ἵνα ἡμεῖς εἰς τὰ ἔθνη<\/td><td>hina hēmeis eis ta ethnē<\/td><td>我們往外邦人<\/td><td>沒有動詞：分工，不是分家<\/td><\/tr><tr><td>τῶν πτωχῶν ἵνα μνημονεύωμεν<\/td><td>tōn ptōchōn hina mnēmoneuōmen<\/td><td>要我們記念窮人<\/td><td>現在式：持續地記念<\/td><\/tr><tr><td>ἐσπούδασα<\/td><td>espoudasa<\/td><td>我熱心去做<\/td><td>保羅本來的心<\/td><\/tr><\/table>","gram":"<p><strong>2:9 是一個長分詞句，主角排在中間。<\/strong>γνόντες τὴν χάριν τὴν δοθεῖσάν μοι（gnontes tēn charin tēn dotheisan moi） 先講他們認出了甚麼——恩典；然後才報出三個名字 Ἰάκωβος καὶ Κηφᾶς καὶ Ἰωάννης（Iakōbos kai Kēphas kai Iōannēs），再加同位語 οἱ δοκοῦντες στῦλοι εἶναι（hoi dokountes styloi einai）。雅各排在磯法前面，反映當時耶路撒冷教會的實際帶領（徒 15:13；21:18）。保羅在這裡用 Κηφᾶς（亞蘭文的「磐石」）稱彼得，2:7–8 卻用 Πέτρος（Petros）；有學者以為 2:7–8 引了一份會議的文字，但證據不足，本講義只視為稱呼的變換。<\/p><p>στῦλοι（styloi） 是「柱子」，猶太文獻用來稱呼支撐以色列的先祖與義人，也帶著聖殿的意象。δεξιὰς ἔδωκαν ἐμοὶ καὶ Βαρναβᾷ κοινωνίας（dexias edōkan emoi kai Barnaba koinōnias） 把 κοινωνίας（koinōnias） 放在句末，是強調的位置：這是「相交」的右手，不是勝利者賞給下屬的手。ἵνα ἡμεῖς εἰς τὰ ἔθνη（hina hēmeis eis ta ethnē） 與 αὐτοὶ δὲ εἰς τὴν περιτομήν（autoi de eis tēn peritomēn） 兩句都沒有動詞，乾淨俐落：分工，不是分家。<\/p><blockquote><p>第 10 節 μόνον τῶν πτωχῶν ἵνα μνημονεύωμεν（monon tōn ptōchōn hina mnēmoneuōmen）：τῶν πτωχῶν（tōn ptōchōn） 提到 ἵνα（hina） 前面強調；μνημονεύωμεν（mnēmoneuōmen） 是現在假設語氣，持續地記念。接著 ὃ καὶ ἐσπούδασα αὐτὸ τοῦτο ποιῆσαι（ho kai espoudasa auto touto poiēsai）：ἐσπούδασα（espoudasa） 是不定過去式，可以讀成「我本來就熱心做」（和合本），也可以讀成「我後來也熱心做了」——指羅 15:26、林後 8–9 章的捐項。兩種讀法都說明：這不是附加的條件，是保羅本來的心。<\/p><\/blockquote>","exp":"<p>「那稱為教會柱石的雅各、磯法、約翰，就向我和巴拿巴用右手行相交之禮」（2:9）。這是第 2 章的第一個高點。耶路撒冷的三位柱石，安提阿來的兩位宣教士，右手伸出來握在一起。他們認出的不是保羅的口才或履歷，是「所賜給我的恩典」（2:9）。恩典是唯一的入場券，對雙方都是。<\/p><p>這次握手裡有分工：「叫我們往外邦人那裡去，他們往受割禮的人那裡去」（2:9）。不同的工場，同一個福音；不同的託付，同一個相交。321 的「建立屬神的體系」在這裡有一個原型：體系的合一不是大家做一樣的事，是做不同的事，卻承認彼此屬於同一張桌子。235 的團隊也在這裡：不同職分的人，同一個福音。<\/p><p>握手之後只有一個請求：「只是願意我們記念窮人」（2:10）。耶路撒冷的信徒多半貧窮，又遇上饑荒（徒 11:28–29）。這個請求不是在福音後面加條件，是愛自然的延伸——保羅說：「這也是我本來熱心去行的」（2:10）。後來他走遍馬其頓、亞該亞，為「耶路撒冷聖徒中的窮人」（羅 15:26）收捐。<\/p><p>這給今天一條很平實的線：因信稱義的福音，不會讓人不管窮人。<strong>不靠行為得救，不等於行為不重要<\/strong>（紅線二）。福音拆掉的是門檻，不是愛；一張外邦人和猶太人都能坐的桌子，桌上也會有窮人的位置。<\/p>"},{"a":11,"z":12,"star":3,"grk":"<p lang=\"grc\">Ὅτε δὲ ἦλθεν Κηφᾶς εἰς Ἀντιόχειαν, κατὰ πρόσωπον αὐτῷ ἀντέστην, ὅτι κατεγνωσμένος ἦν·<\/p><p lang=\"grc\">πρὸ τοῦ γὰρ ἐλθεῖν τινας ἀπὸ Ἰακώβου μετὰ τῶν ἐθνῶν συνήσθιεν· ὅτε δὲ ἦλθον ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν, φοβούμενος τοὺς ἐκ περιτομῆς.<\/p>","lit":"<p>但當磯法來到安提阿的時候，我當著他的面抵擋他，因為他已經是被定罪的。<\/p><p>因為在某些人從雅各那裡來到以前，他一向和外邦人一同吃飯；但他們來了以後，他就漸漸退縮，並把自己隔開，因為怕那些出於割禮的人。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>κατὰ πρόσωπον αὐτῷ ἀντέστην<\/td><td>kata prosōpon autō antestēn<\/td><td>我當著他的臉抵擋他<\/td><td>與 2:6「神不取人的臉」呼應<\/td><\/tr><tr><td>κατεγνωσμένος ἦν<\/td><td>kategnōsmenos ēn<\/td><td>他已是被定罪的<\/td><td>完成式分詞：事實擺在那裡<\/td><\/tr><tr><td>τινας ἀπὸ Ἰακώβου<\/td><td>tinas apo Iakōbou<\/td><td>某些從雅各那裡來的人<\/td><td>是否代表雅各，經文沒說<\/td><\/tr><tr><td>μετὰ τῶν ἐθνῶν συνήσθιεν<\/td><td>meta tōn ethnōn synēsthien<\/td><td>一向和外邦人一同吃<\/td><td>未完成式：習慣<\/td><\/tr><tr><td>ὑπέστελλεν<\/td><td>hypestellen<\/td><td>漸漸退縮<\/td><td>未完成式：一步一步<\/td><\/tr><tr><td>ἀφώριζεν ἑαυτόν<\/td><td>aphōrizen heauton<\/td><td>把自己隔開<\/td><td>1:15「分別出來」同一個字<\/td><\/tr><tr><td>φοβούμενος τοὺς ἐκ περιτομῆς<\/td><td>phoboumenos tous ek peritomēs<\/td><td>因為怕出於割禮的人<\/td><td>現在分詞：持續的怕<\/td><\/tr><\/table>","gram":"<p><strong>2:11–12 的時態，把一個人的退縮拍成了慢動作。<\/strong><\/p><p>κατὰ πρόσωπον αὐτῷ ἀντέστην（kata prosōpon autō antestēn）：「當著他的臉，我抵擋了他」。κατὰ πρόσωπον（kata prosōpon） 與 2:6 πρόσωπον θεὸς ἀνθρώπου οὐ λαμβάνει（prosōpon theos anthrōpou ou lambanei） 是同一個「臉」字：神不看人的臉，保羅也不看彼得的臉色——他當著那張臉說話，不在背後。ὅτι κατεγνωσμένος ἦν（hoti kategnōsmenos ēn） 是完成被動分詞加 ἦν（ēn）：彼得「已經是被定罪的」。有人解作被神定罪，有人解作被他自己的行為定了罪；後者較合上下文——不是保羅給他定罪，是他的行為已經自相矛盾。<\/p><p>第 12 節三個動詞是一組時態對照。μετὰ τῶν ἐθνῶν συνήσθιεν（meta tōn ethnōn synēsthien） 是未完成式：不是吃過一次，是一向一起吃。接著 ὅτε δὲ ἦλθον（hote de ēlthon），然後 ὑπέστελλεν καὶ ἀφώριζεν ἑαυτόν（hypestellen kai aphōrizen heauton），兩個又是未完成式，可以讀成起始的「漸漸退縮、漸漸隔開」——不是一天之內拍桌離席，是一餐一餐少來。ὑπέστελλεν（hypestellen） 有「收起、退縮」的意思；ἀφώριζεν（aphōrizen） 是「劃界、分開」，保羅在 1:15 也用同一個字說神把他「分別出來」；學者觀察到，「法利賽人」的希伯來字根也是「分開」。最後 φοβούμενος τοὺς ἐκ περιτομῆς（phoboumenos tous ek peritomēs） 是現在分詞，說出原因：怕。<\/p><blockquote><p>τινας ἀπὸ Ἰακώβου（tinas apo Iakōbou） 是「某些從雅各那裡來的人」。他們是雅各派來的，還是自稱代表雅各？經文沒說。徒 15:24 雅各與長老的信說，有人從耶路撒冷出去攪擾外邦信徒，「其實我們並沒有吩咐他們」（徒 15:24）；本講義不把責任推到雅各身上。τοὺς ἐκ περιτομῆς（tous ek peritomēs） 可能指耶路撒冷教會中堅持割禮的猶太信徒，也可能指向耶路撒冷信徒施壓的不信的猶太人；兩說都有學者主張，經文的重點是彼得「怕」。<\/p><\/blockquote>","exp":"<p>〔背景〕徒 15:1--2（使徒行傳講義第 15 章）<\/p><p>這是全卷最戲劇性的一幕，發生在一頓飯上。安提阿是第一間外邦人與猶太人同在的大教會（徒 11:19–26）。彼得來了，而且「他和外邦人一同吃飯」（2:12）——一向如此。這不是小事。對一個守潔淨條例長大的猶太人，和外邦人同桌，等於承認他們是一家人。彼得在哥尼流家學過這一課（徒 10:28）。<\/p><p>然後「從雅各那裡來的人」（2:12）到了。彼得沒有發表任何新神學：他沒有說外邦人不潔淨，也沒有說割禮是得救的條件。他只是換了一張桌子坐。原文的未完成式讓我們看見那個過程：先是少坐一次，然後換到另一頭，最後就固定在另一張桌子了。「他因怕奉割禮的人，就退去與外邦人隔開了」（2:12）。<\/p><p><strong>有己的另一面不是張狂，是怕。<\/strong>彼得怕的不是挨打，是失去在耶路撒冷那個圈子裡的位置，被人說成「跟外邦人混在一起的人」。這是華人最熟悉的一種有己：面子。全卷到 6:12 會把這件事說透：「凡希圖外貌體面的人都勉強你們受割禮，無非是怕自己為基督的十字架受逼迫」（6:12）。從 2:12 到 6:12，問題都不在割禮，在一張臉。<\/p><p>保羅怎麼做？「我就當面抵擋他」（2:11）。不是在背後散播，不是寫信去耶路撒冷告狀，是當著他的臉說。這不是個人恩怨：彼得的退去是公開的，影響了整間教會，所以責備也是公開的（2:14）。一位被基督充滿的使徒會跌倒，另一位使徒可以、也應當當面指出——<strong>基督在一個人裡面活，不代表他不會錯；正因為基督在他裡面活，他才能被糾正。<\/strong>（領袖可否公開指正領袖，見本章議題頁；屬靈權柄的分寸回指哥林多後書立場三。）<\/p><p>還有一件事值得記下：同一位彼得，後來在耶路撒冷會議上說：「我們得救乃是因主耶穌的恩，和他們一樣，這是我們所信的」（徒 15:11）。跌倒的人被當面抵擋之後，沒有被丟掉；他站起來了。<\/p>"},{"a":13,"z":14,"star":2,"grk":"<p lang=\"grc\">καὶ συνυπεκρίθησαν αὐτῷ καὶ οἱ λοιποὶ Ἰουδαῖοι, ὥστε καὶ Βαρναβᾶς συναπήχθη αὐτῶν τῇ ὑποκρίσει.<\/p><p lang=\"grc\">ἀλλʼ ὅτε εἶδον ὅτι οὐκ ὀρθοποδοῦσιν πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου, εἶπον τῷ Κηφᾷ ἔμπροσθεν πάντων· Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς καὶ οὐκ Ἰουδαϊκῶς ζῇς, πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν;<\/p>","lit":"<p>其餘的猶太人也和他一同裝假，以致連巴拿巴也被他們的假冒一同帶走了。<\/p><p>但當我看見他們沒有照著福音的真理直直地走，我就在眾人面前對磯法說：「你本是猶太人，若像外邦人、而不像猶太人那樣生活，怎麼強迫外邦人猶太化呢？」<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>συνυπεκρίθησαν αὐτῷ<\/td><td>synypekrithēsan autō<\/td><td>和他一同裝假<\/td><td>戲台上戴面具的字<\/td><\/tr><tr><td>οἱ λοιποὶ Ἰουδαῖοι<\/td><td>hoi loipoi Ioudaioi<\/td><td>其餘的猶太人<\/td><td>一個人的退，帶走一群人<\/td><\/tr><tr><td>καὶ Βαρναβᾶς συναπήχθη<\/td><td>kai Barnabas synapēchthē<\/td><td>連巴拿巴也被一同帶走<\/td><td>被動：像被水流沖走<\/td><\/tr><tr><td>οὐκ ὀρθοποδοῦσιν<\/td><td>ouk orthopodousin<\/td><td>腳走得不直<\/td><td>新約只此一次<\/td><\/tr><tr><td>πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου<\/td><td>pros tēn alētheian tou euangeliou<\/td><td>朝著福音的真理<\/td><td>真理是一條路<\/td><\/tr><tr><td>ἔμπροσθεν πάντων<\/td><td>emprosthen pantōn<\/td><td>在眾人面前<\/td><td>公開的退，公開地責<\/td><\/tr><tr><td>ἐθνικῶς καὶ οὐκ Ἰουδαϊκῶς ζῇς<\/td><td>ethnikōs kai ouk Ioudaikōs zēs<\/td><td>像外邦人、不像猶太人那樣生活<\/td><td>現在式：你一直這樣活<\/td><\/tr><tr><td>ἀναγκάζεις Ἰουδαΐζειν<\/td><td>anankazeis Ioudaizein<\/td><td>你強迫人猶太化<\/td><td>與 2:3 的「勉強」同字根<\/td><\/tr><\/table>","gram":"<p><strong>2:13 是全卷地勢圖的最低點，它的字眼也最重。<\/strong>συνυπεκρίθησαν（synypekrithēsan） 是介系詞 σύν（syn） 加上 ὑποκρίνομαι（hypokrinomai）；ὑποκριτής（hypokritēs） 原是戲台上戴面具的演員。彼得心裡知道外邦人是潔淨的，臉上卻演出另一套——這就是「裝假」：不是信錯了，是活得和自己信的不一樣。「同」的前綴說明這是一場群戲：οἱ λοιποὶ Ἰουδαῖοι（hoi loipoi Ioudaioi） 都上了台。<\/p><p>ὥστε καὶ Βαρναβᾶς συναπήχθη αὐτῶν τῇ ὑποκρίσει（hōste kai Barnabas synapēchthē autōn tē hypokrisei）：ὥστε（hōste） 帶出結果，καὶ（kai） 是「甚至連」；συναπήχθη（synapēchthē） 是不定過去式被動，「被一起帶走」，像被水流沖走。巴拿巴不是主動選擇裝假，是被沖走的——而他正是 2:1、9 和保羅一起上耶路撒冷、一起接過右手的人。<\/p><blockquote><p>2:14 οὐκ ὀρθοποδοῦσιν（ouk orthopodousin） 是新約只出現這一次的字，字面是「直」加「腳」：「腳走得不直」。πρὸς τὴν ἀλήθειαν τοῦ εὐαγγελίου（pros tēn alētheian tou euangeliou） 可以讀成「朝向／按照福音的真理」：真理像一條直路，他們的腳歪了。2:5 保羅不讓步，是為了「福音的真理」；2:14 彼得的腳偏離的，是同一個「福音的真理」。保羅的問句 Εἰ σὺ Ἰουδαῖος ὑπάρχων ἐθνικῶς καὶ οὐκ Ἰουδαϊκῶς ζῇς（Ei sy Ioudaios hyparchōn ethnikōs kai ouk Ioudaikōs zēs） 用現在式 ζῇς（zēs）：你一直像外邦人那樣生活（同桌吃飯）；πῶς τὰ ἔθνη ἀναγκάζεις Ἰουδαΐζειν（pōs ta ethnē anankazeis Ioudaizein） 的 ἀναγκάζεις（anankazeis） 與 2:3 ἠναγκάσθη（ēnankasthē） 同字根。耶路撒冷沒有勉強提多，安提阿的彼得卻用一張桌子在勉強外邦人。Ἰουδαΐζειν（Ioudaizein） 是「照猶太人的方式生活」，不是「在血統上變成猶太人」。<\/p><\/blockquote>","exp":"<p>「其餘的猶太人也都隨著他裝假，甚至連巴拿巴也隨夥裝假」（2:13）。這是加拉太書最低的一點。不是因為有人公開否認基督，是因為一個「甚至連」：甚至連巴拿巴。那個在大家都怕掃羅的時候把他帶到使徒面前的人（徒 9:27），那個「是個好人，被聖靈充滿，大有信心」（徒 11:24）的人，也被沖走了。<\/p><p>一個人退去，常常不只是一個人的事。領袖換一張桌子，整群人就跟著換。彼得也許覺得自己只是暫時遷就一下來客；他沒有想到，他的一個決定，讓安提阿的外邦信徒看見：原來我們還不夠格。<strong>分桌的訊息不需要講出來，桌子本身就在講道。<\/strong><\/p><p>保羅的診斷不是「你沒禮貌」，是「他們行的不正，與福音的真理不合」（2:14）。這是全章最要緊的一句定性：<strong>一張分開的桌子，是一個福音的問題。<\/strong>福音的真理不只是一套寫在紙上的教義，也是一條要用腳走的路；腳走歪了，教義再正也沒有用。<\/p><p>所以保羅「就在眾人面前對磯法說」（2:14）。退去是公開的，責備也是公開的；但它是一個問題，不是一場羞辱。他的問題切中要害：「你既是猶太人，若隨外邦人行事，不隨猶太人行事，怎麼還勉強外邦人隨猶太人呢？」（2:14）彼得自己早已不照猶太規矩生活，如今卻用一張桌子告訴外邦人：你們要照猶太規矩，才能和我同坐。<\/p><p>今天華人教會也有自己的桌子。語言分堂可以是為了福音的方便；但若國語堂、粵語堂、英語堂從不一起吃飯、一起禱告、一起作決定，那就不再是方便，是彼得那一張分開的桌子了（立場四）。合一不是一樣，但合一一定要落在桌上。<\/p>"},{"a":15,"z":16,"star":3,"grk":"<p lang=\"grc\">Ἡμεῖς φύσει Ἰουδαῖοι καὶ οὐκ ἐξ ἐθνῶν ἁμαρτωλοί,<\/p><p lang=\"grc\">εἰδότες δὲ ὅτι οὐ δικαιοῦται ἄνθρωπος ἐξ ἔργων νόμου ἐὰν μὴ διὰ πίστεως Ἰησοῦ Χριστοῦ, καὶ ἡμεῖς εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν, ἵνα δικαιωθῶμεν ἐκ πίστεως Χριστοῦ καὶ οὐκ ἐξ ἔργων νόμου, ὅτι ἐξ ἔργων νόμου οὐ δικαιωθήσεται πᾶσα σάρξ.<\/p>","lit":"<p>我們生來是猶太人，不是出於外邦的罪人；<\/p><p>但既知道人不是出於律法的行為稱義，除非是藉著耶穌基督的信，連我們也信入了基督耶穌，為要我們出於基督的信稱義，而不是出於律法的行為；因為出於律法的行為，一切肉體都不得稱義。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Ἡμεῖς φύσει Ἰουδαῖοι<\/td><td>Hēmeis physei Ioudaioi<\/td><td>我們生來是猶太人<\/td><td>保羅把自己放進「我們」<\/td><\/tr><tr><td>ἐξ ἐθνῶν ἁμαρτωλοί<\/td><td>ex ethnōn hamartōloi<\/td><td>出於外邦的罪人<\/td><td>猶太人的慣用語<\/td><\/tr><tr><td>εἰδότες δὲ ὅτι<\/td><td>eidotes de hoti<\/td><td>但既知道<\/td><td>猶太信徒的共識<\/td><\/tr><tr><td>οὐ δικαιοῦται ἄνθρωπος<\/td><td>ou dikaioutai anthrōpos<\/td><td>人不被稱義<\/td><td>現在被動：宣告的是神<\/td><\/tr><tr><td>ἐξ ἔργων νόμου<\/td><td>ex ergōn nomou<\/td><td>出於律法的行為<\/td><td>一節之內三次<\/td><\/tr><tr><td>διὰ πίστεως Ἰησοῦ Χριστοῦ<\/td><td>dia pisteōs Iēsou Christou<\/td><td>藉著耶穌基督的信<\/td><td>屬格的兩讀<\/td><\/tr><tr><td>εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν<\/td><td>eis Christon Iēsoun episteusamen<\/td><td>我們信入了基督耶穌<\/td><td>人的信，毫無疑義<\/td><\/tr><tr><td>οὐ δικαιωθήσεται πᾶσα σάρξ<\/td><td>ou dikaiōthēsetai pasa sarx<\/td><td>一切肉體都不得稱義<\/td><td>詩 143:2 的回聲<\/td><\/tr><\/table>","gram":"<p><strong>◆ 引號：保羅對磯法的話到哪裡結束？<\/strong>希臘文沒有引號。和合本把引號收在 2:14；2:15–21 是不是仍在對磯法說，學者有三種讀法：<strong>一、止於 2:14<\/strong>（和合本、和修本）：2:15 起保羅轉向加拉太人；<strong>二、止於 2:16<\/strong>：Ἡμεῖς φύσει Ἰουδαῖοι（Hēmeis physei Ioudaioi） 的「我們」仍是對彼得說的「我們兩個猶太人」；<strong>三、止於 2:21<\/strong>：2:15–21 都是對彼得的話，同時也寫給加拉太人聽。本講義照和合本標點；但不論引號收在哪裡，2:15–21 都是在當面抵擋彼得的同一個脈絡裡說出來的——2:20 是一句在衝突裡、對一位跌倒的領袖說的話。<\/p><p>2:15 的 ἐξ ἐθνῶν ἁμαρτωλοί（ex ethnōn hamartōloi） 是猶太人的慣用語：外邦人生來就是「罪人」，因為沒有律法。保羅借用這個說法，下一節就把它拆了：連「生來的猶太人」也不是靠律法稱義。<\/p><p><strong>⚖ 新觀與傳統觀點：ἐξ ἔργων νόμου（ex ergōn nomou） 是甚麼？<\/strong>這個片語在 2:16 出現三次。<strong>傳統觀點<\/strong>（路德、加爾文與今天許多福音派學者）讀作：一切想靠自己的努力、在神面前賺得義的行為。<strong>保羅新觀<\/strong>（桑德斯、鄧雅各、賴特等）讀作：主要指標記猶太身分的界線——割禮、飲食、安息日；問題不在賺取救恩，在誰屬於神的子民、誰可以同桌。上下文兩邊都支持：2:3 的割禮、2:12 的餐桌，正是身分界線（新觀有理）；但 2:16 末句 οὐ δικαιωθήσεται πᾶσα σάρξ（ou dikaiōthēsetai pasa sarx） 回響詩篇「在你面前，凡活著的人沒有一個是義的」（詩 143:2），講的是罪人在神面前的處境，不只是族群的界線（傳統有理）；3:10–13 的咒詛也是如此。本講義的判斷：站在宗教改革的底線——稱義是神白白的恩典，單單因信，不靠任何人的作為；同時吸收新觀的提醒——在加拉太，因信稱義的第一個結果，是猶太人和外邦人可以一起吃飯（立場二）。<\/p><blockquote><p><strong>✝ πίστεως Ἰησοῦ Χριστοῦ（pisteōs Iēsou Christou）：「信基督」還是「基督的信實」？<\/strong>屬格有兩讀。受格屬格：以基督為對象的信，「信耶穌基督」——和合本、多數譯本、路德以來的傳統。主格屬格：耶穌基督自己的信實，他順服至死——海斯、賴特等主張，NET 譯本採用。主張「基督的信實」的理由：同一節已經說了 εἰς Χριστὸν Ἰησοῦν ἐπιστεύσαμεν（eis Christon Iēsoun episteusamen），若 διὰ πίστεως Ἰησοῦ Χριστοῦ（dia pisteōs Iēsou Christou） 與 ἐκ πίστεως Χριστοῦ（ek pisteōs Christou） 也都是「信基督」，一句話裡就說了三次；而且全段的焦點是基督作了甚麼（2:20 末、2:21）。受格讀法的理由：保羅從未在別處明說「基督信神」；3:6–9 亞伯拉罕的例子講的是人的信；ἐπιστεύσαμεν（episteusamen） 這個動詞正好解釋了前後兩個名詞。本講義照和合本讀作「信基督」，同時承認主格讀法提醒了一件真事：我們能信，是因為他先信實。δικαιοῦται（dikaioutai） 是現在被動，δικαιωθῶμεν（dikaiōthōmen） 是不定過去被動——稱義的主詞一直是神。<\/p><\/blockquote>","exp":"<p>保羅對彼得的話，從一張桌子一下子轉到最深的地方。他說「我們」：「我們這生來的猶太人，不是外邦的罪人」（2:15）。這是彼得和保羅共同的出身，也是他們從小被教導的自我認識：我們有律法，他們沒有。保羅沒有否認自己的猶太身分——他說的是「生來的猶太人」，不是「從前的猶太人」。加拉太書不是一本反猶太的書（立場四）。<\/p><p>然後一個 δὲ（de） 把這份自信翻轉了：「既知道人稱義不是因行律法，乃是因信耶穌基督，連我們也信了基督耶穌」（2:16）。「連我們」——連有律法、受了割禮、守潔淨條例的我們，也得和外邦人一樣，空著手來到基督面前。如果猶太人也是因信稱義，外邦人又何必先變成猶太人？<strong>餐桌的問題，根子是福音的問題。<\/strong><\/p><p>「稱義」是法庭的字：法官宣告一個人在法律面前是義的。主詞是神，不是人。人不能宣告自己無罪，也不能用一套身分標記換到這個宣告。「因為凡有血氣的，沒有一人因行律法稱義」（2:16）。這句話把所有人放在同一條線上：受割禮的、未受割禮的，守規矩的、不守規矩的。<\/p><p>新觀和傳統觀點在這裡各自擦亮了一面。傳統觀點提醒：人想靠宗教表現在神面前加分，是在耶穌後面加一個「和」字。新觀提醒：人想用一個身分標記把別人擋在桌子外面，也是在耶穌後面加一個「和」字。今天兩種「律法的行為」都在：一種說「你要做到這些，神才喜悅你」，一種說「你要像我們，才算自己人」。兩種都不是福音。<\/p><p>「基督的信實」這個讀法，即使不採用，也留下一個安慰：我們的信不是另一種功勞。信心不是我們拿到神面前的成績單，是投靠一位信實的主。321 說「焦點在耶穌，不在自己」——連信心的焦點也在他，不在我信得夠不夠用力。<\/p>"},{"a":17,"z":18,"star":1,"grk":"<p lang=\"grc\">εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί, ἆρα Χριστὸς ἁμαρτίας διάκονος; μὴ γένοιτο·<\/p><p lang=\"grc\">εἰ γὰρ ἃ κατέλυσα ταῦτα πάλιν οἰκοδομῶ, παραβάτην ἐμαυτὸν συνιστάνω<\/p>","lit":"<p>但若我們尋求在基督裡稱義，自己也被發現是罪人，那麼基督是罪的執事嗎？絕對不可！<\/p><p>因為我若把我所拆毀的這些再建造起來，我就顯明自己是違法的人。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ζητοῦντες δικαιωθῆναι ἐν Χριστῷ<\/td><td>zētountes dikaiōthēnai en Christō<\/td><td>尋求在基督裡稱義<\/td><td>現在分詞：正在尋求<\/td><\/tr><tr><td>εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί<\/td><td>heurethēmen kai autoi hamartōloi<\/td><td>自己也被發現是罪人<\/td><td>回扣 2:15「外邦的罪人」<\/td><\/tr><tr><td>ἆρα Χριστὸς ἁμαρτίας διάκονος<\/td><td>ara Christos hamartias diakonos<\/td><td>那麼基督是罪的執事嗎<\/td><td>猶太派的推論<\/td><\/tr><tr><td>μὴ γένοιτο<\/td><td>mē genoito<\/td><td>斷乎不是<\/td><td>保羅最強的否定<\/td><\/tr><tr><td>ἃ κατέλυσα ταῦτα πάλιν οἰκοδομῶ<\/td><td>ha katelysa tauta palin oikodomō<\/td><td>我所拆毀的，又再建造<\/td><td>建築的字<\/td><\/tr><tr><td>παραβάτην ἐμαυτὸν συνιστάνω<\/td><td>parabatēn emauton synistanō<\/td><td>我就顯明自己是違法者<\/td><td>越界的人<\/td><\/tr><\/table>","gram":"<p><strong>2:17 是一個對手的反問，2:18 是保羅的反擊。<\/strong>εἰ δὲ ζητοῦντες δικαιωθῆναι ἐν Χριστῷ εὑρέθημεν καὶ αὐτοὶ ἁμαρτωλοί（ei de zētountes dikaiōthēnai en Christō heurethēmen kai autoi hamartōloi） 是第一類條件句：「假如——事實上也是——我們為了在基督裡稱義，被發現自己也成了『罪人』」。這裡的 ἁμαρτωλοί（hamartōloi） 回扣 2:15：猶太信徒離開律法、和外邦人同桌，在攪擾者眼中就成了和外邦人一樣的「罪人」。ἆρα Χριστὸς ἁμαρτίας διάκονος（ara Christos hamartias diakonos） 可以讀成問句（SBLGNT、和合本），也可以讀成直述；問句較合 μὴ γένοιτο（mē genoito） 的接法。μὴ γένοιτο（mē genoito） 是願望語氣，在保羅書信裡幾乎都接在一個荒謬的推論之後。<\/p><blockquote><p>2:18 換成第一人稱單數：εἰ γὰρ ἃ κατέλυσα ταῦτα πάλιν οἰκοδομῶ（ei gar ha katelysa tauta palin oikodomō）。κατέλυσα（katelysa） 與 οἰκοδομῶ（oikodomō） 是一組建築的對照：拆毀、再建。保羅講的是「我」，其實是說彼得：拆掉的是那道把猶太人和外邦人隔開的牆（參弗 2:14），彼得退去，就是把牆重新砌起來。παραβάτην（parabatēn） 是「越界者、違法者」——真正的違法，不是和外邦人同桌，是把拆掉的牆再建起來。<\/p><\/blockquote>","exp":"<p>攪擾者有一個看起來很有道理的反駁：你們這些因信稱義的猶太人，把律法放下了，和外邦人一起吃飯，那你們不就成了「罪人」了嗎？這樣一來，基督豈不成了叫人犯罪的？這是猶太派對恩典福音的指控，不是保羅的看法。保羅只用一句話回答：「斷乎不是！」（2:17）<\/p><p>然後他把指控翻過來：「我素來所拆毀的，若重新建造，這就證明自己是犯罪的人」（2:18）。真正的罪，不是拆掉那道隔斷的牆，是把它重新砌起來。彼得在安提阿做的正是這件事：他曾經和外邦人同桌，如今退回去，等於說「以前那樣是錯的」——那他就把自己定了罪。<\/p><p>這兩節替後面的 2:19–21 開了路，也防了一個誤會。恩典不是放縱的通行證；和外邦人同桌、不靠律法稱義，不等於基督縱容罪（紅線二）。第 5 章保羅會把這件事說完：自由「總要用愛心互相服事」（5:13）。今天也一樣：一間教會拆掉了「信耶穌再加上」的牆，就不要在背後用另一套規矩把它偷偷砌回來。<\/p>"},{"a":19,"z":19,"star":2,"grk":"<p lang=\"grc\">ἐγὼ γὰρ διὰ νόμου νόμῳ ἀπέθανον ἵνα θεῷ ζήσω·<\/p>","lit":"<p>因為我藉著律法，向律法死了，好叫我向神活。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἐγὼ γὰρ<\/td><td>egō gar<\/td><td>因為我<\/td><td>從「我們」換成「我」<\/td><\/tr><tr><td>διὰ νόμου νόμῳ ἀπέθανον<\/td><td>dia nomou nomō apethanon<\/td><td>藉著律法，向律法死了<\/td><td>兩個 νόμος，兩種格<\/td><\/tr><tr><td>ἵνα θεῷ ζήσω<\/td><td>hina theō zēsō<\/td><td>好叫我向神活<\/td><td>與 νόμῳ 平行的與格<\/td><\/tr><tr><td>Χριστῷ συνεσταύρωμαι<\/td><td>Christō synestaurōmai<\/td><td>我已與基督同釘十字架<\/td><td>SBLGNT 屬 2:19 句末<\/td><\/tr><\/table>","gram":"<p><strong>2:19 用 ἐγὼ γὰρ（egō gar） 起頭：保羅從「我們」換成了「我」。<\/strong>2:15–17 說的是「我們這些猶太信徒」，2:18 起換成第一人稱單數，到 2:19–21 每一節都是「我」。這是一個猶太人在說他自己的故事，也是每一個信徒的故事。<\/p><p>διὰ νόμου νόμῳ ἀπέθανον（dia nomou nomō apethanon） 是全卷最緊的一句：兩個 νόμος（nomos） 並排，一個屬格帶 διὰ（「藉著律法」），一個與格（「向律法」）。「藉著律法向律法死了」怎麼解？一說：律法定了我的罪、判我死，我就在那判決裡死了（3:10、13）；一說：律法本身把我帶到基督那裡（3:24），而基督替我受了律法的咒詛，我與他同死。兩說可以合起來讀：律法執行了它的判決，判決落在基督身上，也落在與他聯合的我身上——從此律法不再是我的主人（參羅 7:4）。νόμῳ（nomō） 與 θεῷ（theō） 是一組平行的與格：向律法死，向神活。死不是終點，是換一個對象活著。<\/p><blockquote><p><strong>◆ 原文分節位移（經文鑑別 2:19）。<\/strong>SBLGNT（NA28 同）把 2:19 讀到 Χριστῷ συνεσταύρωμαι（Christō synestaurōmai） 為止；和合本（KJV 同）把「我已經與基督同釘十字架」放在 2:20 句首。兩邊都是二十一節，經文一字不差，只是分節的位置不同。本講義的原文欄照和合本分節，把 Χριστῷ συνεσταύρωμαι（Christō synestaurōmai） 移到 2:20 起頭，2:19 以 ζήσω（zēsō） 結尾。兩種切法讀出的重點不同：在 SBLGNT 的分節裡，「同釘十字架」是「向神活著」的方法——我怎樣向律法死、向神活？藉著與基督同釘；在和合本的分節裡，它是「不再是我」的原因——為甚麼活著的不再是我？因為我已經與基督同釘。本講義的判斷：兩種切法都忠於原文，連起來讀才完整——同釘十字架，向後解釋了 2:19 的死，向前打開了 2:20 的活。<\/p><\/blockquote>","exp":"<p>「我因律法，就向律法死了，叫我可以向神活著」（2:19）。這一節要放在安提阿的桌子旁邊讀。彼得退回律法的桌子，是因為他還怕律法的眼光——怕被奉割禮的人看成不潔。保羅說：我已經向律法死了。一個死人不再怕法官，因為判決已經執行過了。<\/p><p>「因律法」是甚麼意思？律法把我帶到它的盡頭。它照實定了我的罪，「凡有血氣的，沒有一人因行律法稱義」（2:16）；而那個判決，基督替我承擔了（3:13）。律法沒有錯，它做完了它該做的事。從此我不是在律法的監管下活，是向神活著。<\/p><p>這一節替無己畫了第一條線：<strong>無己不是從「我」開始的努力，是從一個死開始的。<\/strong>保羅不是說「我要努力向律法死」，他說「我已經死了」——ἀπέθανον（apethanon） 是不定過去式。一個人若還想靠守規矩在神面前站立，他就還活在律法以下；一個人若知道自己已經在基督裡死過一次，就不必再用表現證明自己。<\/p><p>而死的目的是活：「叫我可以向神活著」（2:19）。律法主義的人，活著是為了不被定罪；向律法死了的人，活著是為了神。同一個人，同樣禱告、同樣讀經，可以是兩種完全不同的生命——一種在交成績單，一種在回應愛。<\/p>"},{"a":20,"z":20,"star":3,"grk":"<p lang=\"grc\">Χριστῷ συνεσταύρωμαι· ζῶ δὲ οὐκέτι ἐγώ, ζῇ δὲ ἐν ἐμοὶ Χριστός· ὃ δὲ νῦν ζῶ ἐν σαρκί, ἐν πίστει ζῶ τῇ τοῦ υἱοῦ τοῦ θεοῦ τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ.<\/p>","lit":"<p>我已與基督同釘十字架；活著的已不再是我，乃是基督活在我裡面；我如今在肉身裡所活的，是活在那屬神兒子的信裡，就是那愛了我、又為我交出自己的那一位。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Χριστῷ συνεσταύρωμαι<\/td><td>Christō synestaurōmai<\/td><td>我已經與基督同釘十字架<\/td><td>完成式被動：已經被釘，至今仍是<\/td><\/tr><tr><td>ζῶ δὲ οὐκέτι ἐγώ<\/td><td>zō de ouketi egō<\/td><td>活著的已不再是我<\/td><td>ἐγώ 放句末<\/td><\/tr><tr><td>ζῇ δὲ ἐν ἐμοὶ Χριστός<\/td><td>zē de en emoi Christos<\/td><td>活在我裡面的是基督<\/td><td>與上句交錯對稱<\/td><\/tr><tr><td>ὃ δὲ νῦν ζῶ ἐν σαρκί<\/td><td>ho de nyn zō en sarki<\/td><td>我如今在肉身裡所活的<\/td><td>肉身沒有被取消<\/td><\/tr><tr><td>ἐν πίστει ζῶ<\/td><td>en pistei zō<\/td><td>我在信裡活<\/td><td>信是活著的範圍<\/td><\/tr><tr><td>τῇ τοῦ υἱοῦ τοῦ θεοῦ<\/td><td>tē tou huiou tou theou<\/td><td>那屬神兒子的<\/td><td>又一個屬格的兩讀<\/td><\/tr><tr><td>τοῦ ἀγαπήσαντός με<\/td><td>tou agapēsantos me<\/td><td>那愛了我的<\/td><td>不定過去式：十字架上的愛<\/td><\/tr><tr><td>παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ<\/td><td>paradontos heauton hyper emou<\/td><td>為我交出了自己<\/td><td>321「捨己」的原型<\/td><\/tr><\/table>","gram":"<p><strong>2:20 的開頭兩個字，在 SBLGNT 是 2:19 的結尾（見上一段的分節位移）。<\/strong>和合本把 Χριστῷ συνεσταύρωμαι（Christō synestaurōmai） 放在這裡，讓它成了「不再是我」的原因。συνεσταύρωμαι（synestaurōmai） 是 συσταυρόω（systauroō） 的完成式、被動語態：完成式說「已經被釘，而且現在仍是被釘的狀態」；被動語態說「是被釘的，不是自己釘的」。這不是一個人每天要努力完成的功課，是一個已經發生、至今有效的事實——是神作的。同一個動詞用在與主同釘的兩個強盜身上（太 27:44），也用在「我們的舊人和他同釘十字架」（羅 6:6）的 συνεσταυρώθη（synestaurōthē）：都是被動。<\/p><p>接著是一組交錯對稱：ζῶ δὲ οὐκέτι ἐγώ（zō de ouketi egō） 對 ζῇ δὲ ἐν ἐμοὶ Χριστός（zē de en emoi Christos）。兩句都以動詞「活」起頭，主詞放在句末——ἐγώ（egō） 換成了 Χριστός（Christos）。保羅沒有說「我不再活」，他說「活著的不再是我」：活還在，生命的主人換了。下一句 ὃ δὲ νῦν ζῶ ἐν σαρκί（ho de nyn zō en sarki） 立刻又是「我活」：νῦν（nyn） 是「如今」，ἐν σαρκί（en sarki） 是「在肉身裡」——這裡的 σάρξ（sarx） 是中性的身體生命，不是第 5 章那個與聖靈相爭的「肉體」。保羅仍然吃飯、走路、寫信、生氣、流淚；只是這一切都 ἐν πίστει（en pistei）。2:19–20 兩節之內 ζάω（zaō） 出現五次：ζήσω（zēsō）、ζῶ（zō）、ζῇ（zē）、ζῶ（zō）、ζῶ（zō）。<\/p><blockquote><p><strong>✝ τῇ τοῦ υἱοῦ τοῦ θεοῦ（tē tou huiou tou theou）：又一次 πίστις Χριστοῦ（pistis Christou） 的兩讀。<\/strong>ἐν πίστει ζῶ τῇ τοῦ υἱοῦ τοῦ θεοῦ（en pistei zō tē tou huiou tou theou），「我活在那屬於神兒子的信裡」。受格讀法：我因「信神的兒子」而活（和合本）。主格讀法：我活在「神兒子的信實」裡——理由是緊接的兩個分詞τοῦ ἀγαπήσαντός με καὶ παραδόντος ἑαυτὸν ὑπὲρ ἐμοῦ（tou agapēsantos me kai paradontos heauton hyper emou） 講的全是兒子的作為：他愛了我，他交出自己；照這個讀法，「基督的信實」正是他順服到十字架的那份忠誠。本講義照和合本「信神的兒子」解經，同時看見主格讀法所強調的：我能這樣活，是因為他先信實地愛了我。兩個分詞都是不定過去式，指向十字架那一次的愛；παραδόντος ἑαυτὸν（paradontos heauton） 是「把自己交出去」，1:4 用 δόντος ἑαυτὸν（dontos heauton） 說同一件事。說「不再是我」的這兩節，ἐγώ（egō）、ἐμοὶ（emoi）、με（me）、ἐμοῦ（emou） 和一連串第一人稱動詞一個接一個——保羅沒有把「我」刪掉，是把「我」交給了愛他的那一位。<\/p><\/blockquote>","exp":"<p>2:20 不是從天上掉下來的一句金句。它是在安提阿的一張桌子旁邊、在當面抵擋一位跌倒的使徒的時候說出來的，前面是 2:16 的因信稱義，後面是 2:21 的「基督就是徒然死了」。彼得退去，是因為「我」還活著——我的位置、我的名聲、我在耶路撒冷那些人眼中的樣子。保羅的答案不是「你要更勇敢」，是一個更深的事實：「我已經與基督同釘十字架」（2:20）。<\/p><p>這句話說的是一件已經發生的事。完成式被動：我已經被釘了，而且現在仍然是。不是我每天早上醒來，努力把自己再釘一次；是我每天醒來，承認我已經在那裡了。無己不是一種靠意志力達到的境界，是神已經作成的事實；我們每天的功課不是再釘一次，是承認它，並且「順著聖靈而行」（5:16）。<\/p><p>然後是那一整句：「現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信神的兒子而活；他是愛我，為我捨己」（2:20）。<strong>這一句一定要整句讀。<\/strong>說「不再是我」的同一口氣，保羅說「在我裡面」「我如今在肉身活著」「愛我」「為我捨己」。無己不是我消失了，是我被愛了；不是取消人格，是換了生命的主人。<\/p><p>所以有四種讀法必須擋在門外。第一，「不再是我」不等於我不重要、我的感受不重要——同一節說他「愛我，為我捨己」，我被愛到一個程度，神的兒子為我死。第二，「同釘」不等於我每天要努力把自己釘死——動詞是完成式被動，是神作的。第三，「基督在我裡面活」不等於我的想法就是基督的想法——同一章，被基督充滿的彼得被當面抵擋；正因為基督在我裡面活，我才能被糾正。第四，「無己」不等於要忍受傷害、不可以說不——寫這句話的人，「一刻的工夫也沒有容讓順服他們」（2:5），又「當面抵擋」（2:11）了彼得。<strong>無己的人不是沒有骨頭，是骨頭換成了基督的<\/strong>；受傷害的人說「不」，常常正是讓基督作王的一步。<\/p><p>這也是本章三個詞走到的地方：桌、抵、釘。桌子分開了，因為有人還活在別人的眼光裡；保羅抵擋，因為福音的真理不能讓步；而真正醫治分桌的，是釘——一個已經與基督同釘、被基督愛著的人，不需要靠換桌子來保住自己。他可以和任何人同坐，因為他的價值已經在十字架上定了。<\/p><p>到這裡，321 才接上去。國度321空中團契說「無己不再是我乃是基督，不是我自己活乃是基督在我裡面活」，就是從這一節來的。但這句話的根不在我們的口號裡，在 2:20 的下半句：「他是愛我，為我捨己」（2:20）。<strong>無己不是我努力變得沒有自己，是我被一位捨己的主愛到，不必再為自己活。<\/strong>（2:20 的四個誤讀，見本章議題頁與全卷附錄。）<\/p>"},{"a":21,"z":21,"star":2,"grk":"<p lang=\"grc\">οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ· εἰ γὰρ διὰ νόμου δικαιοσύνη, ἄρα Χριστὸς δωρεὰν ἀπέθανεν.<\/p>","lit":"<p>我不廢棄神的恩；因為義若是藉著律法，那麼基督就是白白死了。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ<\/td><td>ouk athetō tēn charin tou theou<\/td><td>我不廢棄神的恩<\/td><td>把文約作廢的字<\/td><\/tr><tr><td>εἰ γὰρ διὰ νόμου δικαιοσύνη<\/td><td>ei gar dia nomou dikaiosynē<\/td><td>因為義若藉著律法<\/td><td>沒有動詞，像一道算式<\/td><\/tr><tr><td>ἄρα Χριστὸς δωρεὰν ἀπέθανεν<\/td><td>ara Christos dōrean apethanen<\/td><td>那麼基督是白白死了<\/td><td>δωρεὰν：白白、無故<\/td><\/tr><\/table>","gram":"<p><strong>2:21 是全章的結論，也是一道反證法。<\/strong>οὐκ ἀθετῶ τὴν χάριν τοῦ θεοῦ（ouk athetō tēn charin tou theou）：ἀθετέω（atheteō） 是把一份文件、一個約「作廢、當作無效」，3:15 用同一個字說人的文約一經立定，就沒有人能廢棄。這句話暗示有人在指控：你保羅廢了律法。保羅反過來說：我沒有廢掉神的恩；把恩典作廢的，是那些要在恩典後面加上律法的人。<\/p><p>εἰ γὰρ διὰ νόμου δικαιοσύνη（ei gar dia nomou dikaiosynē） 沒有動詞，乾淨得像一道算式：「若義藉著律法」——ἄρα Χριστὸς δωρεὰν ἀπέθανεν（ara Christos dōrean apethanen），「那麼基督是白白死了」。δωρεὰν（dōrean） 在新約多半是白白地、不收代價的意思，如「就白白地稱義」（羅 3:24）；在這裡是另一面的意思：無緣無故、徒然，如「他們無故地恨我」（約 15:25）。同一個字，兩個方向：恩典是白白給的；但若人能靠律法得義，基督的死就成了白白死的。2:21 與 2:16 前後包住 2:17–20：從 δικαιοῦται（dikaioutai）、δικαιωθῶμεν（dikaiōthōmen） 到 δικαιοσύνη（dikaiosynē）；νόμος（nomos） 在 2:16–21 出現六次，全章最後一個字落在 ἀπέθανεν（apethanen）。<\/p>","exp":"<p>2:20 是從這裡長出來的。保羅沒有停在 2:20 的高峰上，他用一句冷靜的邏輯收住全章：「我不廢掉神的恩；義若是藉著律法得的，基督就是徒然死了」（2:21）。<\/p><p>這是全卷最尖銳的一句。攪擾者的福音看起來很敬虔：信耶穌，再加上割禮；信耶穌，再加上一張分開的桌子。他們沒有拿掉十字架，只是在十字架後面加了一點東西。保羅說：只要加一點，十字架就成了多餘的。如果人能靠守律法得義，哪怕只靠一部分，神的兒子何必死？<\/p><p>這一句把加拉太的問題，連同安提阿的桌子，一起帶回十字架。彼得換桌子，看起來只是一件人際關係的小事；保羅卻說，它推到底的結論是「基督就是徒然死了」（2:21）。每一次我們用一個額外的條件把弟兄姊妹擋在桌外——語言、文化、宗派、資歷、屬靈表現——我們都在無聲地說：基督的死還不夠。<\/p><p>反過來，這一句也是最大的安慰。基督不是徒然死的。他的死夠了：夠讓一個猶太人和一個希臘人同坐，夠讓一個跌倒的彼得被抵擋之後再站起來，夠讓一個曾經逼迫教會的保羅說「他是愛我，為我捨己」（2:20）。<strong>不廢掉神的恩，就是不在恩典後面加一個「和」字。<\/strong>讀完這一章，該問的不是我守得夠不夠，是：我還有沒有在十字架之外誇別的東西？<\/p>"}],"3":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">Ὦ ἀνόητοι Γαλάται, τίς ὑμᾶς ἐβάσκανεν οἷς κατʼ ὀφθαλμοὺς Ἰησοῦς Χριστὸς προεγράφη ἐσταυρωμένος;<\/p>","lit":"<p>哦，無知的加拉太人，誰用邪眼迷惑了你們？在你們眼前，耶穌基督被公開張貼為已經被釘十字架的。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Ὦ ἀνόητοι Γαλάται<\/td><td>Ō anoētoi Galatai<\/td><td>哦，無知的加拉太人<\/td><td>不是笨，是不用心想；3:3 再說一次<\/td><\/tr><tr><td>ἐβάσκανεν<\/td><td>ebaskanen<\/td><td>用邪眼看了、施了咒<\/td><td>新約只此一次；保羅借用當時人怕的字<\/td><\/tr><tr><td>κατʼ ὀφθαλμοὺς<\/td><td>kat' ophthalmous<\/td><td>在眼前<\/td><td>與「邪眼」對照：你們的眼睛早已看過<\/td><\/tr><tr><td>προεγράφη<\/td><td>proegraphē<\/td><td>被公開張貼<\/td><td>告示、布告；講道就是貼出來的十字架<\/td><\/tr><tr><td>ἐσταυρωμένος<\/td><td>estaurōmenos<\/td><td>已經被釘的<\/td><td>完成分詞：被釘，而且一直是那位被釘的<\/td><\/tr><\/table>","gram":"<p><strong>全卷最重的一聲呼喊：Ὦ ἀνόητοι Γαλάται（Ō anoētoi Galatai）。<\/strong><\/p><p>感嘆詞 Ὦ（Ō） 在保羅書信裡很少用，這裡帶著痛。ἀνόητοι（anoētoi） 是「沒有用 νοῦς（nous）」，不是智力低，是不肯想清楚；第 3 節又問一次 οὕτως ἀνόητοί ἐστε（houtōs anoētoi este）。接著是修辭問句 τίς ὑμᾶς ἐβάσκανεν（tis hymas ebaskanen）。βασκαίνω（baskainō） 在當時的民間信仰裡指「用邪眼看人」，被看的人會中邪、失去判斷。保羅不是說基督徒會中邪，他是用加拉太人自己最怕的字反諷：你們的樣子，像是被人下了咒。<\/p><p>對照就在同一句裡：οἷς κατʼ ὀφθαλμοὺς（hois kat' ophthalmous）……προεγράφη（proegraphē）。邪眼看你們，可是你們自己的眼睛早已看過一幅畫。προγράφω（prographō） 是「預先寫」或「公開寫出來」，用在城裡張貼的告示、拍賣的公告；和合本譯「活畫」，抓住了那份鮮明。最後一個字 ἐσταυρωμένος（estaurōmenos） 是完成被動分詞，放在句尾作重音：被張貼出來的，是一位已經被釘、而且永遠帶著釘痕的基督。經文鑑別：有些晚期抄本在 ἐβάσκανεν（ebaskanen） 後加「不順從真理」，SBLGNT 與和合本都沒有，不影響經義。<\/p>","exp":"<p><strong>「無知的加拉太人哪，耶穌基督釘十字架，已經活畫在你們眼前，誰又迷惑了你們呢？」（3:1）<\/strong><\/p><p>第 1、2 章是自傳，保羅說他的福音不是從人來的。第 3 章開始辯證，第一句不是論證，是一聲喊叫。這是一位父親看見孩子走向懸崖時的聲音。他叫他們「無知」，不是罵他們笨，而是說：你們明明看過，怎麼會忘記？<\/p><p>保羅傳福音的方式，在這一句裡說得很清楚。他沒有拿出一套方法，他把十字架「貼」出來。加拉太人沒有人到過各各他，但保羅的講道讓他們像站在十字架前。所以問題不是他們不知道，而是有人讓他們把眼睛移開了。攪擾他們的人沒有叫他們不信基督，只是說：信基督很好，再加上割禮才完全。眼睛一離開十字架，加上去的東西就顯得合理了。<\/p><p>「誰又迷惑了你們呢」，保羅借用的是民間怕中邪的字。今天也有人怕被下咒、怕風水、怕犯沖，把這一節讀成「基督徒也會中邪」。這不是經文要說的。保羅的意思正好相反：真正讓人失去判斷的，不是甚麼邪眼，是別的福音。能讓人站穩的，也不是更多的護身方法，是那幅一直掛在眼前的十字架。本章議題頁「基督徒會被下咒、被邪眼所害嗎」另有討論。<\/p><p>ἐσταυρωμένος（estaurōmenos） 是完成分詞。復活的主仍然是被釘的主，釘痕沒有被抹去。教會甚麼時候最容易被「迷惑」？就是講台上甚麼都講，只是十字架不再在正中間的時候。<\/p>"},{"a":2,"z":5,"star":2,"grk":"<p lang=\"grc\">τοῦτο μόνον θέλω μαθεῖν ἀφʼ ὑμῶν, ἐξ ἔργων νόμου τὸ πνεῦμα ἐλάβετε ἢ ἐξ ἀκοῆς πίστεως;<\/p><p lang=\"grc\">οὕτως ἀνόητοί ἐστε; ἐναρξάμενοι πνεύματι νῦν σαρκὶ ἐπιτελεῖσθε;<\/p><p lang=\"grc\">τοσαῦτα ἐπάθετε εἰκῇ; εἴ γε καὶ εἰκῇ.<\/p><p lang=\"grc\">ὁ οὖν ἐπιχορηγῶν ὑμῖν τὸ πνεῦμα καὶ ἐνεργῶν δυνάμεις ἐν ὑμῖν ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως;<\/p>","lit":"<p>這一件我只想從你們學到：你們領受那靈，是出於律法的行為呢，還是出於信心的聽？<\/p><p>你們是這樣無知嗎？以靈開始了，現在要以肉身完成嗎？<\/p><p>你們經歷了這麼多，是徒然的嗎？如果真的是徒然的話。<\/p><p>所以那供應你們那靈、又在你們中間運行大能的，是出於律法的行為呢，還是出於信心的聽？<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τοῦτο μόνον<\/td><td>touto monon<\/td><td>只這一件<\/td><td>一個問題就夠了<\/td><\/tr><tr><td>ἐξ ἔργων νόμου<\/td><td>ex ergōn nomou<\/td><td>出於律法的行為<\/td><td>本章第一次出現；3:5、3:10 再出現<\/td><\/tr><tr><td>ἐξ ἀκοῆς πίστεως<\/td><td>ex akoēs pisteōs<\/td><td>出於信心的聽<\/td><td>和合本「聽信福音」<\/td><\/tr><tr><td>ἐναρξάμενοι πνεύματι<\/td><td>enarxamenoi pneumati<\/td><td>以聖靈開始<\/td><td>追蹤：聖靈與肉體第一次對舉<\/td><\/tr><tr><td>σαρκὶ ἐπιτελεῖσθε<\/td><td>sarki epiteleisthe<\/td><td>以肉身完成<\/td><td>肉身：割禮與人的努力<\/td><\/tr><tr><td>ἐπάθετε<\/td><td>epathete<\/td><td>你們經歷、受苦<\/td><td>兩種譯法都可能<\/td><\/tr><tr><td>ὁ οὖν ἐπιχορηγῶν<\/td><td>ho oun epichorēgōn<\/td><td>那供應的<\/td><td>現在分詞：聖靈一直在賜<\/td><\/tr><\/table>","gram":"<p><strong>四個修辭問句，一個比一個尖，答案都只有一個。<\/strong><\/p><p>第 2 節 τοῦτο μόνον θέλω μαθεῖν（touto monon thelō mathein）：保羅不需要長篇大論，一個問題就夠了。對照組第一次出現：ἐξ ἔργων νόμου ἢ ἐξ ἀκοῆς πίστεως（ex ergōn nomou ē ex akoēs pisteōs）。ἀκοῆς πίστεως（akoēs pisteōs） 怎麼讀，有三種看法：一、「帶著信心的聽」（聽的人用信心接受）；二、「信息的報告」，ἀκοή（akoē） 在羅 10:16 譯作「所傳的」；三、「引出信心的聽」（聽見福音而生出信心）。和合本「聽信福音」兼顧一與三。本講義取這個讀法：關鍵在 ἔργων（ergōn） 與 ἀκοῆς（akoēs） 的對照，一個是做，一個是聽。<\/p><p>第 3 節是全卷第一次聖靈與肉體對舉：ἐναρξάμενοι πνεύματι νῦν σαρκὶ ἐπιτελεῖσθε（enarxamenoi pneumati nyn sarki epiteleisthe）。ἐπιτελεῖσθε（epiteleisthe） 可讀作中間語態「你們要自己完成」，也可讀作被動「你們被完成」；兩讀都在問同一件事：開始的是聖靈，收尾的難道是割禮？σαρκί（sarki） 在這裡同時指割禮動刀的那塊肉，也指人的本事。<\/p><p>第 4 節 τοσαῦτα ἐπάθετε εἰκῇ（tosauta epathete eikē）：πάσχω（paschō） 多半是「受苦」，但也可以中性地指「經歷」。若是受苦，指他們信主後所受的逼迫（徒 14:22）；若是經歷，指第 5 節的聖靈與異能。第 5 節 ὁ οὖν ἐπιχορηγῶν（ho oun epichorēgōn） 與 ἐνεργῶν δυνάμεις（energōn dynameis） 都是現在分詞：聖靈不是當年給過一次就結束，神一直在供應。<\/p>","exp":"<p><strong>保羅不先講神學，他先問加拉太人自己的經歷。<\/strong><\/p><p>「我只要問你們這一件：你們受了聖靈，是因行律法呢？是因聽信福音呢？」（3:2）這是全章論證的地基。加拉太人是外邦人，從來沒有受過割禮，也沒有守過摩西的律法。他們卻受了聖靈。那麼答案很明顯：聖靈不是賞給守律法的人，是賜給聽了福音、信了的人。<\/p><p>「你們既靠聖靈入門，如今還靠肉身成全嗎？」（3:3）這是加拉太的試探，也是每一代教會的試探。入門靠恩典，大家都同意；到了要「長進」「完全」的時候，就悄悄換成靠自己的條件。攪擾他們的人說的是：信耶穌是開始，受割禮才是成熟。今天的版本可能是：信主是起步，守住我們這一套規矩、這一種語言、這一份會員資格，才算真正的屬靈人。<\/p><p>保羅的回答很簡單：用甚麼開始，就用甚麼走下去。「那在你們心裡動了善工的，必成全這工」（腓 1:6）。成全的主詞是神，不是我們的努力。這不是說行為不重要；第 5、6 章會講聖靈結出的果子。只是果子是從聖靈長出來的，不是我們用來換取聖靈的。<\/p><p>「你們受苦如此之多，都是徒然的嗎？」（3:4）若他們為福音受過逼迫，現在加上割禮，等於說那些苦都白受了。第 5 節回到現在式：神「賜給你們聖靈，又在你們中間行異能」（3:5）。神今天還在作工，作工的根據仍然是聽信，不是行律法。<\/p>"},{"a":6,"z":7,"star":3,"grk":"<p lang=\"grc\">καθὼς Ἀβραὰμ ἐπίστευσεν τῷ θεῷ, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην.<\/p><p lang=\"grc\">Γινώσκετε ἄρα ὅτι οἱ ἐκ πίστεως, οὗτοι υἱοί εἰσιν Ἀβραάμ.<\/p>","lit":"<p>正如亞伯拉罕信了神，就被算給他為義。<\/p><p>所以你們要知道：那些出於信的人，這些人就是亞伯拉罕的兒子。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>καθὼς<\/td><td>kathōs<\/td><td>正如<\/td><td>從加拉太人的經歷接到聖經<\/td><\/tr><tr><td>ἐπίστευσεν τῷ θεῷ<\/td><td>episteusen tō theō<\/td><td>他信了神<\/td><td>創 15:6；七十士譯本的字句<\/td><\/tr><tr><td>ἐλογίσθη<\/td><td>elogisthē<\/td><td>被算為<\/td><td>記帳的字：記在他的帳上<\/td><\/tr><tr><td>εἰς δικαιοσύνην<\/td><td>eis dikaiosynēn<\/td><td>作為義<\/td><td>義是被算給的，不是賺來的<\/td><\/tr><tr><td>οἱ ἐκ πίστεως<\/td><td>hoi ek pisteōs<\/td><td>那些出於信的人<\/td><td>本章的人群名稱；3:9 再出現<\/td><\/tr><tr><td>υἱοί εἰσιν Ἀβραάμ<\/td><td>huioi eisin Abraam<\/td><td>是亞伯拉罕的兒子<\/td><td>追蹤：υἱός 在本章第一站<\/td><\/tr><\/table>","gram":"<p><strong>第 6 節以 καθὼς（kathōs） 開頭，把加拉太人的經歷直接接到亞伯拉罕身上。<\/strong><\/p><p>引文出自創 15:6 的七十士譯本，只把「亞伯蘭」改成 Ἀβραὰμ（Abraam）：ἐπίστευσεν τῷ θεῷ（episteusen tō theō）, καὶ ἐλογίσθη αὐτῷ εἰς δικαιοσύνην（kai elogisthē autō eis dikaiosynēn）。ἐλογίσθη（elogisthē） 是記帳用語，把一筆款項記在某人名下；被動式說明記帳的是神。εἰς δικαιοσύνην（eis dikaiosynēn） 的 εἰς（eis） 表示「當作」：信被算作義。<\/p><p>為甚麼保羅選創 15 章？攪擾者手上的王牌是創 17 章：神與亞伯拉罕立割禮的約（創 17:10）。保羅往前翻兩章：亞伯拉罕被算為義，是在割禮之前。羅馬書把這一點說得更白：「不是在受割禮的時候，乃是在未受割禮的時候。」（羅 4:10）<\/p><p>第 7 節 Γινώσκετε（Ginōskete） 可以是直說語氣「你們知道」，也可以是命令語氣「你們要知道」；和合本取命令。ἄρα（ara） 帶出結論。οἱ ἐκ πίστεως（hoi ek pisteōs） 是本章給這群人起的名字，ἐκ（ek） 說明身分的來源。句子用 οὗτοι（houtoi） 回指，作強調：正是這些人，而不是別人，才是 υἱοί εἰσιν Ἀβραάμ（huioi eisin Abraam）。第一世紀的猶太教也常說亞伯拉罕「信」，但多半指他在試驗中的忠心（創 22 章）；保羅把焦點放在創 15 章的「信神」。<\/p>","exp":"<p>〔創〕創 15:6（創世記講義第 15 章）<\/p><p><strong>「亞伯拉罕信神，這就算為他的義」（3:6）——保羅把整個爭論帶回到起點。<\/strong><\/p><p>攪擾加拉太人的人也講亞伯拉罕。他們的論點聽起來很有力：神的應許是給亞伯拉罕的子孫的；要作亞伯拉罕的子孫，就要像他一樣受割禮。對外邦人來說，這很難反駁，因為創世記第 17 章白紙黑字寫著割禮之約。保羅沒有否認第 17 章，他只是請讀者往前看。<\/p><p>本系列創世記講義第 15 章講過那一夜：亞伯蘭年老無子，神領他到外邊，叫他數天上的星。「亞伯蘭信耶和華，耶和華就以此為他的義。」（創 15:6）那一夜他沒有受割禮，沒有律法，也還沒有獻以撒。他所做的只是一件事：相信神說的話。神就把義記在他的帳上。<\/p><p>所以保羅說：「那以信為本的人，就是亞伯拉罕的子孫。」（3:7）這一句把家譜重新畫過。作亞伯拉罕的兒女，不是看血統，也不是看身上的記號，是看你是不是像他一樣信。施洗約翰早就說過：「神能從這些石頭中給亞伯拉罕興起子孫來。」（太 3:9）<\/p><p>這裡要小心兩件事。第一，保羅不是說亞伯拉罕的信是一種功勞，所以神獎賞他；「算為」是神主動記帳，信只是伸手接過來。第二，保羅也不是在說猶太人從此不算亞伯拉罕的子孫。他自己就是「生來的猶太人」（2:15），而且在羅馬書說「神並沒有棄絕他預先所知道的百姓」（羅 11:2）。他要說的是：門檻只有一個，就是信；猶太人和外邦人都從這同一個門進來。<\/p><p>今天的「割禮」，可能是一份入會表格、一種敬拜方式、一張受訓證書。這些東西可以有用，但當它們被說成「沒有這個就不算真正屬神的人」，我們就又回到第 17 章，忘了第 15 章那一夜的星空。<\/p>"},{"a":8,"z":9,"star":1,"grk":"<p lang=\"grc\">προϊδοῦσα δὲ ἡ γραφὴ ὅτι ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς προευηγγελίσατο τῷ Ἀβραὰμ ὅτι Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη.<\/p><p lang=\"grc\">ὥστε οἱ ἐκ πίστεως εὐλογοῦνται σὺν τῷ πιστῷ Ἀβραάμ.<\/p>","lit":"<p>而聖經預先看見神要出於信稱外邦人為義，就預先傳福音給亞伯拉罕：萬國都必在你裡面蒙福。<\/p><p>所以那些出於信的人，與那信的亞伯拉罕一同蒙福。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>προϊδοῦσα δὲ ἡ γραφὴ<\/td><td>proidousa de hē graphē<\/td><td>聖經既預先看見<\/td><td>聖經被擬人化<\/td><\/tr><tr><td>δικαιοῖ<\/td><td>dikaioi<\/td><td>他稱義<\/td><td>現在式：神一向的作法<\/td><\/tr><tr><td>προευηγγελίσατο<\/td><td>proeuēngelisato<\/td><td>預先傳了福音<\/td><td>新約只此一次<\/td><\/tr><tr><td>Ἐνευλογηθήσονται ἐν σοὶ<\/td><td>Eneulogēthēsontai en soi<\/td><td>必在你裡面蒙福<\/td><td>創 12:3 與 18:18 合引<\/td><\/tr><tr><td>σὺν τῷ πιστῷ Ἀβραάμ<\/td><td>syn tō pistō Abraam<\/td><td>與那信的亞伯拉罕一同<\/td><td>πιστός：信的人，也是信實的人<\/td><\/tr><\/table>","gram":"<p><strong>第 8 節的主詞是 ἡ γραφὴ（hē graphē）：聖經被寫成一位會看、會傳福音的人。<\/strong><\/p><p>προϊδοῦσα（proidousa） 是「預先看見」，προευηγγελίσατο（proeuēngelisato） 是「預先傳福音」，兩個字都帶著「預先」的前綴。保羅的意思是：外邦人因信稱義不是後來才想出來的補救辦法，神在呼召亞伯拉罕的那一天就已經說了。ἐκ πίστεως δικαιοῖ τὰ ἔθνη ὁ θεὸς（ek pisteōs dikaioi ta ethnē ho theos），δικαιοῖ（dikaioi） 用現在式，表示這是神一向的作法；主詞是神，稱義是神的作為。<\/p><p>引文 Ἐνευλογηθήσονται ἐν σοὶ πάντα τὰ ἔθνη（Eneulogēthēsontai en soi panta ta ethnē） 合引了創 12:3「地上的萬族都要因你得福」（創 12:3）與創 18:18 的「萬國」。保羅取 12:3 的「因你」，取 18:18 的「萬國」，正好是他要說的：外邦人，在亞伯拉罕裡。第 9 節的 σὺν τῷ πιστῷ Ἀβραάμ（syn tō pistō Abraam），πιστός（pistos） 可以是「信實的」，也可以是「相信的」；猶太傳統稱讚亞伯拉罕在試驗中忠心，保羅在這裡取「相信的」，與第 6 節一致。<\/p>","exp":"<p><strong>「聖經既然預先看明，神要叫外邦人因信稱義，就早已傳福音給亞伯拉罕」（3:8）。<\/strong><\/p><p>這是一句很大膽的話。福音不是從保羅開始，也不是從五旬節開始，甚至不是從耶穌降生開始。神第一次呼召亞伯蘭離開本地本族的時候，就已經把外邦人放在計劃裡了：「萬國都必因你得福。」（3:8）<\/p><p>攪擾者的福音是先把外邦人變成猶太人，他們才能得福。保羅說，聖經從來不是這樣說的。應許是「萬國」在亞伯拉罕裡得福，不是萬國先變成亞伯拉罕家族的一員再得福。外邦人不必換掉自己的民族，才能進神的家。<\/p><p>「可見那以信為本的人和有信心的亞伯拉罕一同得福。」（3:9）「一同」這個字值得停一下。外邦信徒不是坐在亞伯拉罕家的偏桌，是和他坐在同一張桌子。這正好接回第 2 章安提阿的餐桌：彼得退去，就是把應許裡的「一同」拆開了。華人教會常有不同語言、不同背景的群體；這一節提醒我們，因信而來的人，在神面前沒有先來後到、本地外地的等級。<\/p>"},{"a":10,"z":10,"star":2,"grk":"<p lang=\"grc\">Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν ὑπὸ κατάραν εἰσίν, γέγραπται γὰρ ὅτι Ἐπικατάρατος πᾶς ὃς οὐκ ἐμμένει πᾶσιν τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου τοῦ ποιῆσαι αὐτά.<\/p>","lit":"<p>因為凡是出於律法行為的人，都是在咒詛之下；因為經上記著：凡不持守律法書上所寫的一切、去行它們的，都是被咒詛的。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν<\/td><td>Hosoi gar ex ergōn nomou eisin<\/td><td>凡是出於律法行為的人<\/td><td>與 3:7、9 的 οἱ ἐκ πίστεως 對照<\/td><\/tr><tr><td>ὑπὸ κατάραν<\/td><td>hypo kataran<\/td><td>在咒詛之下<\/td><td>與 3:9「一同得福」相反<\/td><\/tr><tr><td>Ἐπικατάρατος<\/td><td>Epikataratos<\/td><td>被咒詛的<\/td><td>申 27:26；3:13 再用同一個字<\/td><\/tr><tr><td>ἐμμένει<\/td><td>emmenei<\/td><td>持守、常在裡面<\/td><td>和合本「常照」<\/td><\/tr><tr><td>πᾶσιν τοῖς γεγραμμένοις<\/td><td>pasin tois gegrammenois<\/td><td>一切所寫的<\/td><td>全部，不是大部分<\/td><\/tr><\/table>","gram":"<p><strong>第 10 節把第 9 節翻過來：一邊是「一同得福」，一邊是 ὑπὸ κατάραν（hypo kataran）。<\/strong><\/p><p>Ὅσοι γὰρ ἐξ ἔργων νόμου εἰσὶν（Hosoi gar ex ergōn nomou eisin） 與 οἱ ἐκ πίστεως（hoi ek pisteōs） 形成本章的兩群人。引文是申 27:26：「不堅守遵行這律法言語的，必受咒詛！」（申 27:26）保羅加上 πᾶσιν（pasin），又把「這律法言語」換成 τοῖς γεγραμμένοις ἐν τῷ βιβλίῳ τοῦ νόμου（tois gegrammenois en tō bibliō tou nomou），強調「全部」與「寫成書的整部律法」。<\/p><p>難處在於邏輯：經文咒詛的是「不遵行的人」，保羅卻說「以行律法為本的」都在咒詛之下。中間少了一句前提。各家怎樣補？<\/p><p><strong>傳統觀點<\/strong>（路德、加爾文，今天許多福音派學者）：隱含的前提是「沒有人能完全遵行」。ἔργα νόμου（erga nomou） 指一切想靠遵行律法在神面前得義的作為；律法要求全部，人做不到全部，所以凡靠律法的都落在咒詛裡。3:11「沒有一個人靠著律法在神面前稱義」支持這個讀法。<\/p><p><strong>保羅新觀<\/strong>（桑德斯、鄧雅各、賴特）：ἔργα νόμου（erga nomou） 主要指標記猶太身分的界線——割禮、飲食、安息日。鄧雅各認為，咒詛落在把律法當作族群界線的人身上；賴特則認為，申 27–30 章說的是以色列整體的咒詛與被擄，以色列作為一個民族仍在那咒詛之下，等候彌賽亞擔當。<\/p><p>本講義的判斷：兩邊都有真實的觀察，但站在傳統觀點的底線上。3:10 不只是在講身分界線，是在講罪人在神面前的處境；否則 3:13「基督成了咒詛」就失去分量。同時吸收新觀的提醒：在加拉太，ἔργα νόμου（erga nomou） 的具體樣子正是割禮與分桌（2:12）。<\/p>","exp":"<p><strong>「凡以行律法為本的，都是被咒詛的」（3:10）——這是本章最刺耳的一句。<\/strong><\/p><p>保羅剛說完「得福」，馬上說「咒詛」。他要加拉太人看清楚：他們想加上去的那條路，不是更高一層的屬靈，是走回咒詛底下。攪擾者以為割禮會讓外邦人更安全地站在約裡；保羅說，要靠律法站，就要靠全部律法站，而律法自己宣告：「凡不常照律法書上所記一切之事去行的，就被咒詛。」（3:10）<\/p><p>律法不是一份自助餐，可以挑幾道菜。選了割禮，就等於簽下整份合約；第 5 章會說：「他是欠著行全律法的債。」（5:3）這條路的問題不在律法不好，而在人做不到。律法像一面鏡子，照得出臉上的污點，卻不能洗臉。<\/p><p>新觀的學者提醒我們，加拉太人遇到的「行律法」，是很具體的身分記號：割了禮，才能和猶太信徒同桌。這個提醒很重要。今天的「律法的行為」可能有兩種臉：一種是想靠宗教表現賺得神的喜悅，數算自己讀經、禱告、奉獻的次數；另一種是把人擋在門外的身分標記，「我們這一堂」「我們這一派」「我們的語言」。兩種都是在耶穌後面加一個「和」字。<\/p><p>舊約的人是怎樣得救的？他們也是靠律法嗎？從 3:6 看，亞伯拉罕在律法之前就因信稱義；律法時代的信徒，也是信靠神所預備的赦罪之恩。本章議題頁另有討論。這裡只需要記得：保羅在 3:10 宣告咒詛，是為了在 3:13 宣告贖出。<\/p>"},{"a":11,"z":12,"star":1,"grk":"<p lang=\"grc\">ὅτι δὲ ἐν νόμῳ οὐδεὶς δικαιοῦται παρὰ τῷ θεῷ δῆλον, ὅτι Ὁ δίκαιος ἐκ πίστεως ζήσεται,<\/p><p lang=\"grc\">ὁ δὲ νόμος οὐκ ἔστιν ἐκ πίστεως, ἀλλʼ· Ὁ ποιήσας αὐτὰ ζήσεται ἐν αὐτοῖς.<\/p>","lit":"<p>而在律法裡沒有人在神面前被稱義，這是顯明的；因為：義人必出於信而活。<\/p><p>而律法不是出於信，乃是：那行了這些的，必在其中活著。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>δῆλον<\/td><td>dēlon<\/td><td>顯而易見的<\/td><td>放在句尾作強調<\/td><\/tr><tr><td>Ὁ δίκαιος ἐκ πίστεως ζήσεται<\/td><td>Ho dikaios ek pisteōs zēsetai<\/td><td>義人出於信必活著<\/td><td>哈 2:4<\/td><\/tr><tr><td>ὁ δὲ νόμος οὐκ ἔστιν ἐκ πίστεως<\/td><td>ho de nomos ouk estin ek pisteōs<\/td><td>但律法不是出於信<\/td><td>兩條原則不同<\/td><\/tr><tr><td>Ὁ ποιήσας αὐτὰ ζήσεται ἐν αὐτοῖς<\/td><td>Ho poiēsas auta zēsetai en autois<\/td><td>行這些的必在其中活著<\/td><td>利 18:5<\/td><\/tr><\/table>","gram":"<p><strong>兩節兩段引文，用同一個動詞 ζήσεται（zēsetai） 互相對照。<\/strong><\/p><p>第 11 節引哈 2:4：Ὁ δίκαιος ἐκ πίστεως ζήσεται（Ho dikaios ek pisteōs zēsetai）。希伯來原文是「義人因他的信實而活」，七十士譯本作 ἐκ πίστεώς μου（ek pisteōs mou）「因我的信實」，保羅兩個代名詞都不要，只留下 ἐκ πίστεως（ek pisteōs）。ἐκ πίστεως（ek pisteōs） 修飾哪一個字？一說修飾 ζήσεται（zēsetai）：「義人要因信而活」；一說修飾 Ὁ δίκαιος（Ho dikaios）：「因信而義的人，必得生」。和合本「義人必因信得生」可以兩讀；本章的上下文在講怎樣被算為義，第二讀更貼近論證，第一讀說出義人一生的樣子。<\/p><p>第 12 節引利 18:5：Ὁ ποιήσας αὐτὰ ζήσεται ἐν αὐτοῖς（Ho poiēsas auta zēsetai en autois）。關鍵字是 ποιήσας（poiēsas） 對 πίστεως（pisteōs）：律法的原則是「做」，信的原則是「接受」。ὁ δὲ νόμος οὐκ ἔστιν ἐκ πίστεως（ho de nomos ouk estin ek pisteōs） 不是說律法反對信，而是說律法不是從信這個原則運作的。ἀλλʼ（all'） 後面直接接引文，像是說：律法自己的話就是這樣。<\/p>","exp":"<p><strong>「義人必因信得生」（3:11）——同一節經文，後來也點燃了宗教改革。<\/strong><\/p><p>哈巴谷生在一個不公義的年代，他問神為甚麼惡人得勢。神的回答是：義人要靠著信活下去，信那位守約的神。保羅拿這句話來說明，在神面前稱義的路從來就是信。羅馬書開頭也引了同一句：「義人必因信得生。」（羅 1:17）<\/p><p>第 12 節引利未記：「行這些事的，就必因此活著。」（3:12）這不是說律法騙人。在約中蒙恩的以色列人，守律法本來是蒙福的生活方式。但若把它當作得生命、得稱義的途徑，它就只有一個要求：全部做到。信靠神的人說「我接受」；靠律法的人說「我做到」。兩條路不能同時走。<\/p><p>這兩節也不是叫人輕看行為。因信得生的人，生命一定會長出順服；5:6 說得清楚，有功效的是「使人生發仁愛的信心」（5:6）。區別只在次序：先因信領受生命，然後在生命裡順服；不是先用順服換生命。<\/p>"},{"a":13,"z":14,"star":3,"grk":"<p lang=\"grc\">Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα, ὅτι γέγραπται · Ἐπικατάρατος πᾶς ὁ κρεμάμενος ἐπὶ ξύλου,<\/p><p lang=\"grc\">ἵνα εἰς τὰ ἔθνη ἡ εὐλογία τοῦ Ἀβραὰμ γένηται ἐν Χριστῷ Ἰησοῦ, ἵνα τὴν ἐπαγγελίαν τοῦ πνεύματος λάβωμεν διὰ τῆς πίστεως.<\/p>","lit":"<p>基督從律法的咒詛中把我們贖買出來，替我們成了咒詛；因為經上記著：凡被掛在木頭上的，都是被咒詛的；<\/p><p>為要使亞伯拉罕的福在基督耶穌裡臨到外邦人，為要使我們藉著信領受那靈的應許。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἐξηγόρασεν<\/td><td>exēgorasen<\/td><td>他從市場上買出來<\/td><td>贖：付了代價，把人從奴隸市場領出<\/td><\/tr><tr><td>ἐκ τῆς κατάρας τοῦ νόμου<\/td><td>ek tēs kataras tou nomou<\/td><td>脫離律法的咒詛<\/td><td>3:10 那份咒詛<\/td><\/tr><tr><td>γενόμενος ὑπὲρ ἡμῶν κατάρα<\/td><td>genomenos hyper hēmōn katara<\/td><td>替我們成了咒詛<\/td><td>cu89t 註腳：原文是成了咒詛<\/td><\/tr><tr><td>ὁ κρεμάμενος ἐπὶ ξύλου<\/td><td>ho kremamenos epi xylou<\/td><td>那被掛在木頭上的<\/td><td>申 21:23<\/td><\/tr><tr><td>ἵνα……ἵνα<\/td><td>hina……hina<\/td><td>為要……為要<\/td><td>雙重目的：外邦人得福，我們得聖靈<\/td><\/tr><tr><td>τὴν ἐπαγγελίαν τοῦ πνεύματος<\/td><td>tēn epangelian tou pneumatos<\/td><td>那靈的應許<\/td><td>應許的內容就是聖靈<\/td><\/tr><\/table>","gram":"<p><strong>◆ 本章章題：Χριστὸς ἡμᾶς ἐξηγόρασεν ἐκ τῆς κατάρας τοῦ νόμου γενόμενος ὑπὲρ ἡμῶν κατάρα（Christos hēmas exēgorasen ek tēs kataras tou nomou genomenos hyper hēmōn katara）。<\/strong><\/p><p>主詞 Χριστὸς（Christos） 放在最前面，前面沒有連接詞，突然出現，像一道光打進 3:10–12 的黑暗。ἐξαγοράζω（exagorazō） 是「從市場上買出來」，用在贖回奴隸；不定過去式，說的是一次完成的事。γενόμενος（genomenos）……κατάρα（katara） 是名詞，不是形容詞：cu89t 註腳說「受了咒詛」原文是「成了咒詛」。保羅不只說基督被咒詛，而是說他成了咒詛本身，把整份咒詛吸進自己裡面。ὑπὲρ ἡμῶν（hyper hēmōn） 是「為我們、替我們」。<\/p><p>引文是申 21:23。七十士譯本作 κεκατηραμένος ὑπὸ θεοῦ（kekatēramenos hypo theou）「被神咒詛的」，保羅改成 Ἐπικατάρατος（Epikataratos），與 3:10 的申 27:26 用同一個字，兩段引文就扣在一起；他也省去「被神」，大概不願讓人以為十字架上父與子對立。申命記原指被處死的人屍首被掛在木頭上示眾；使徒講道一再用「掛在木頭上」說十字架（徒 5:30；10:39）。<\/p><p>ἡμᾶς（hēmas） 指誰？一說指猶太信徒，他們在律法之下，所以第 14 節才轉到外邦人；一說指所有人，因為外邦人也在罪的咒詛下（3:22「眾人」）。第 14 節兩個 ἵνα（hina） 平行：第一個說亞伯拉罕的福臨到 τὰ ἔθνη（ta ethnē）；第二個說「我們」得著 τὴν ἐπαγγελίαν τοῦ πνεύματος（tēn epangelian tou pneumatos）。這個屬格是同位的：應許的內容就是聖靈。全段繞了一圈，回到 3:2 的問題：你們受了聖靈，是因為甚麼？<\/p>","exp":"<p>〔哥林多〕林後 5:21（哥林多後書講義第 5 章）<\/p><p><strong>「基督既為我們受了咒詛，就贖出我們脫離律法的咒詛」（3:13）——全卷的一條線走到十字架的正中間。<\/strong><\/p><p>咒詛沒有被一筆勾銷，是被他擔下了。3:10 的判決是真的，律法的話一個字也沒有作廢；但那份咒詛落在另一個人身上。原文說基督「成了」咒詛。本系列哥林多後書講義第 5 章講過另一句同樣驚人的話：「神使那無罪的，替我們成為罪」（林後 5:21）。兩處都用了一個抽象名詞：不是說他變成罪人，而是說他站進罪與咒詛的位置，替我們承受。<\/p><p>「贖」這個字是從奴隸市場來的。一個人被賣，要有人付價，把他領出來，從此他不再屬於原來的主人。加拉太人想走回律法底下，等於是被贖出來的奴隸，又自己走回市場。保羅在 4:5 會用同一個字：「要把律法以下的人贖出來，叫我們得著兒子的名分。」（4:5）贖出來，不是為了換一個主人繼續作奴僕，是為了作兒子。<\/p><p>「凡掛在木頭上都是被咒詛的」（3:13）。對第一世紀的猶太人來說，這句話是福音最大的絆腳石：一個被釘死在木頭上的人，怎麼可能是彌賽亞？保羅的回答是：正因為他被掛在木頭上，他才能替我們擔當那份咒詛。彼得也說：「他被掛在木頭上，親身擔當了我們的罪」（彼前 2:24）。基督怎樣擔當，神學上有幾種說法：代受刑罰、勝過權勢、代表我們，各家在本章議題頁並陳。保羅在這裡只用最簡單的話說：替我們。<\/p><p>第 14 節說出十字架的兩個目的。第一，「叫亞伯拉罕的福，因基督耶穌可以臨到外邦人」（3:14）：3:8 的應許，經過十字架才兌現。第二，「使我們因信得著所應許的聖靈」（3:14）。應許的終點不是一塊地、一個民族的特權，是神自己的靈住進人裡面。所以第 3 章從聖靈開始（3:2），也在這裡回到聖靈。<\/p><p>這一段若講得只剩下「我得救了」，就講少了一半。基督成了咒詛，是要讓外邦人和猶太人同得一個福。被同一個十字架贖出來的人，不能再坐兩張桌子。<\/p>"},{"a":15,"z":16,"star":2,"grk":"<p lang=\"grc\">Ἀδελφοί, κατὰ ἄνθρωπον λέγω· ὅμως ἀνθρώπου κεκυρωμένην διαθήκην οὐδεὶς ἀθετεῖ ἢ ἐπιδιατάσσεται.<\/p><p lang=\"grc\">τῷ δὲ Ἀβραὰμ ἐρρέθησαν αἱ ἐπαγγελίαι καὶ τῷ σπέρματι αὐτοῦ· οὐ λέγει· Καὶ τοῖς σπέρμασιν, ὡς ἐπὶ πολλῶν, ἀλλʼ ὡς ἐφʼ ἑνός· Καὶ τῷ σπέρματί σου, ὅς ἐστιν Χριστός.<\/p>","lit":"<p>弟兄們，我照著人來說：即使是人的遺囑，已經確立了，也沒有人廢棄或附加條款。<\/p><p>而應許是向亞伯拉罕和他的子孫說的；他不是說：和給眾子孫，好像指著許多；乃是好像指著一個：和給你的子孫，他就是基督。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Ἀδελφοί<\/td><td>Adelphoi<\/td><td>弟兄們<\/td><td>從「無知的」轉為「弟兄們」<\/td><\/tr><tr><td>κατὰ ἄνθρωπον λέγω<\/td><td>kata anthrōpon legō<\/td><td>我照著人說<\/td><td>用日常的例子<\/td><\/tr><tr><td>κεκυρωμένην διαθήκην<\/td><td>kekyrōmenēn diathēkēn<\/td><td>已確立的遺囑<\/td><td>διαθήκη：遺囑，也是約<\/td><\/tr><tr><td>ἐπιδιατάσσεται<\/td><td>epidiatassetai<\/td><td>附加條款<\/td><td>正是攪擾者在做的事<\/td><\/tr><tr><td>τοῖς σπέρμασιν<\/td><td>tois spermasin<\/td><td>給眾子孫<\/td><td>複數<\/td><\/tr><tr><td>τῷ σπέρματί σου<\/td><td>tō spermati sou<\/td><td>給你的子孫<\/td><td>單數：「你那一個子孫」<\/td><\/tr><tr><td>ὅς ἐστιν Χριστός<\/td><td>hos estin Christos<\/td><td>他就是基督<\/td><td>陽性關係代名詞<\/td><\/tr><\/table>","gram":"<p><strong>◆ 3:16 的單數子孫：全章最常被質疑的一處釋經。<\/strong><\/p><p>第 15 節先打一個比方。διαθήκη（diathēkē） 在希臘世界通常指「遺囑」，在七十士譯本卻是「約」的標準譯詞；保羅一字兩用，從人的遺囑推到神的約。κεκυρωμένην（kekyrōmenēn） 是完成分詞，「已經生效的」；ἀθετεῖ（athetei） 是作廢，ἐπιδιατάσσεται（epidiatassetai） 是附加條款。後一個字正打中加拉太的問題：攪擾者沒有廢掉應許，他們是在應許後面加條款。<\/p><p>第 16 節的論證：經上不是說 τοῖς σπέρμασιν（tois spermasin），乃是說 τῷ σπέρματί σου（tō spermati sou），指一個人，ὅς ἐστιν Χριστός（hos estin Christos）。問題是，創 13:15、17:8、22:18 的「後裔」，希伯來文與希臘文本來就是集合名詞，單數形式也指眾多子孫。保羅的釋經合理嗎？各家有三說：<\/p><p>一、<strong>拉比式的字面論證<\/strong>：保羅用了當時拉比常用的方法，從單數字形抽出意義；方法屬於那個時代，今天不必模仿。二、<strong>集合與代表<\/strong>：保羅當然知道 σπέρμα（sperma） 是集合名詞，因為十三節之後他自己說「你們……就是亞伯拉罕的後裔」（3:29），用的是同一個單數字指眾人。他的意思是：眾子孫被總結在一位代表身上。舊約已經有這個走向：創 22:17–18 的「後裔」接著說「你子孫必得著仇敵的城門」（創 22:17），在希伯來文用單數代名詞；撒下 7:12「我必使你的後裔接續你的位」（撒下 7:12）也是指一位君王。三、<strong>揀選的收窄<\/strong>：創世記本身就在收窄後裔，「從以撒生的，才要稱為你的後裔」（創 21:12）。<\/p><p>本講義取第二說為主，第三說為輔：保羅不是玩字面遊戲，而是看見應許從一族收窄到一位，又從一位擴展到所有在他裡面的人。<\/p>","exp":"<p><strong>保羅換了稱呼：前面是「無知的加拉太人」（3:1），這裡是「弟兄們」（3:15）。<\/strong><\/p><p>責備完了，他坐下來講道理。他說「我且照著人的常話說」（3:15），拿日常生活的例子：一份遺囑一旦立好、生效，旁人就不能作廢，也不能在後面附加條款。人的遺囑尚且如此，神親口給亞伯拉罕的應許，更不能被後來的人加上新條件。這正是加拉太的問題：攪擾者沒有說應許作廢，他們只是在後面加了一條「還要受割禮」。<\/p><p>第 16 節說應許是給亞伯拉罕「你那一個子孫」，「就是基督」（3:16）。應許不是散落在一大群人身上，任人憑血統認領；它收在一個人身上，就是基督。誰在基督裡，誰就承受應許。這一節是 3:29 的伏筆：那一個子孫，最後要變成「你們」。<\/p><p>這個讀法也解決了一個牧養上的問題。人若問「我夠不夠資格承受神的應許」，答案不在自己的出身、表現或屬靈年資，而在「我是否在基督裡」。應許的根基從自己身上移到基督身上，人就不必再一面信，一面焦慮自己還缺了哪一條。<\/p><p>至於保羅的釋經方法，本章議題頁「3:16 子孫是單數，保羅的釋經合理嗎」有更細的討論。講台上一句話就夠：保羅不是在挑字眼，他是看見整部舊約的應許都在一個人身上會合。<\/p>"},{"a":17,"z":18,"star":1,"grk":"<p lang=\"grc\">τοῦτο δὲ λέγω· διαθήκην προκεκυρωμένην ὑπὸ τοῦ θεοῦ ὁ μετὰ τετρακόσια καὶ τριάκοντα ἔτη γεγονὼς νόμος οὐκ ἀκυροῖ, εἰς τὸ καταργῆσαι τὴν ἐπαγγελίαν.<\/p><p lang=\"grc\">εἰ γὰρ ἐκ νόμου ἡ κληρονομία, οὐκέτι ἐξ ἐπαγγελίας· τῷ δὲ Ἀβραὰμ διʼ ἐπαγγελίας κεχάρισται ὁ θεός.<\/p>","lit":"<p>而我說這個：被神預先確立的約，那在四百三十年之後才有的律法，不能使它無效，以致廢掉那應許。<\/p><p>因為若產業是出於律法，就不再是出於應許；但神是藉著應許白白賜給了亞伯拉罕。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>προκεκυρωμένην ὑπὸ τοῦ θεοῦ<\/td><td>prokekyrōmenēn hypo tou theou<\/td><td>被神預先確立的<\/td><td>完成分詞：一直有效<\/td><\/tr><tr><td>τετρακόσια καὶ τριάκοντα ἔτη<\/td><td>tetrakosia kai triakonta etē<\/td><td>四百三十年<\/td><td>出 12:40<\/td><\/tr><tr><td>οὐκ ἀκυροῖ<\/td><td>ouk akyroi<\/td><td>不使無效<\/td><td>後來的不能廢掉先前的<\/td><\/tr><tr><td>ἡ κληρονομία<\/td><td>hē klēronomia<\/td><td>產業<\/td><td>承受產業：4:1–7 的伏筆<\/td><\/tr><tr><td>κεχάρισται<\/td><td>kecharistai<\/td><td>白白賜給了<\/td><td>完成式：恩典的禮物<\/td><\/tr><\/table>","gram":"<p><strong>第 17 節用時間先後作論證：先有的約，不能被後來的律法廢掉。<\/strong><\/p><p>διαθήκην προκεκυρωμένην ὑπὸ τοῦ θεοῦ（diathēkēn prokekyrōmenēn hypo tou theou）：完成分詞，神親自確立，而且一直有效。ὁ μετὰ τετρακόσια καὶ τριάκοντα ἔτη γεγονὼς νόμος（ho meta tetrakosia kai triakonta etē gegonōs nomos） 把律法放在後面。四百三十年從哪裡算？出 12:40 說：「以色列人住在埃及共有四百三十年。」（出 12:40）創 15:13 卻說「苦待他們四百年」（創 15:13），司提反也說「四百年」（徒 7:6）。<\/p><p>各家的對法：一、七十士譯本的出 12:40 作「住在埃及地和迦南地」，四百三十年從亞伯拉罕進迦南算到出埃及，保羅照他讀者手上的聖經說話；二、「四百年」是整數，「四百三十年」是精確數；三、從應許最後一次向雅各重申（創 46 章）算到西奈山。本講義的判斷：哪一種算法都不影響保羅的論點；他要的只是「律法在應許之後很久才來」。<\/p><p>第 18 節是條件句：εἰ γὰρ ἐκ νόμου ἡ κληρονομία（ei gar ek nomou hē klēronomia）, οὐκέτι ἐξ ἐπαγγελίας（ouketi ex epangelias）。兩者互斥，不能並存。結尾 κεχάρισται ὁ θεός（kecharistai ho theos）：χαρίζομαι（charizomai） 與「恩典」同字根，完成式，禮物已經送出，而且一直有效。<\/p>","exp":"<p><strong>「神預先所立的約，不能被那四百三十年以後的律法廢掉」（3:17）。<\/strong><\/p><p>保羅的論證很像一份產權證明。房子早就過戶給你，四百多年後有人拿出一份新文件，說你要再付一筆錢才算數。法律上，後來的文件不能推翻先前已經生效的贈與。律法很重要，但它來得晚，不能改寫神早就簽好的應許。<\/p><p>「承受產業，若本乎律法，就不本乎應許」（3:18）。這兩條路不能混合。若產業要靠守律法賺來，它就是工錢，不是禮物；若它是禮物，就不能再要人用守律法補差價。保羅用的動詞是「白白賜給」，與恩典同一個字根。神把產業送給亞伯拉罕，是送，不是賣。<\/p><p>這一點對今天很實際。很多基督徒口裡說「得救本乎恩」，心裡卻覺得要做得夠好，神才會繼續愛我。保羅說：禮物送出去，就不會因為後來加了一份清單而變成貸款。我們順服，是因為已經收到了禮物，不是為了保住它。<\/p>"},{"a":19,"z":20,"star":2,"grk":"<p lang=\"grc\">Τί οὖν ὁ νόμος; τῶν παραβάσεων χάριν προσετέθη, ἄχρις οὗ ἔλθῃ τὸ σπέρμα ᾧ ἐπήγγελται, διαταγεὶς διʼ ἀγγέλων ἐν χειρὶ μεσίτου·<\/p><p lang=\"grc\">ὁ δὲ μεσίτης ἑνὸς οὐκ ἔστιν, ὁ δὲ θεὸς εἷς ἐστιν.<\/p>","lit":"<p>那麼律法是甚麼？它是為了過犯的緣故被添上的，直到那被應許的子孫來到，是藉著天使在中保的手中被頒定的。<\/p><p>而中保不是屬於一方的，但神是一位。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Τί οὖν ὁ νόμος<\/td><td>Ti oun ho nomos<\/td><td>那麼律法是甚麼<\/td><td>預先回答讀者會有的反問<\/td><\/tr><tr><td>τῶν παραβάσεων χάριν<\/td><td>tōn parabaseōn charin<\/td><td>為了過犯的緣故<\/td><td>χάριν 後置；三種讀法<\/td><\/tr><tr><td>προσετέθη<\/td><td>prosetethē<\/td><td>被添上<\/td><td>不是原本的根基，是後加的<\/td><\/tr><tr><td>ἄχρις οὗ ἔλθῃ τὸ σπέρμα<\/td><td>achris hou elthē to sperma<\/td><td>直到那子孫來到<\/td><td>律法有期限<\/td><\/tr><tr><td>διʼ ἀγγέλων<\/td><td>di' angelōn<\/td><td>藉著天使<\/td><td>徒 7:53；來 2:2<\/td><\/tr><tr><td>ἐν χειρὶ μεσίτου<\/td><td>en cheiri mesitou<\/td><td>在中保的手中<\/td><td>中保：摩西<\/td><\/tr><tr><td>ὁ δὲ θεὸς εἷς ἐστιν<\/td><td>ho de theos heis estin<\/td><td>但神是一位<\/td><td>示瑪的回聲<\/td><\/tr><\/table>","gram":"<p><strong>Τί οὖν ὁ νόμος（Ti oun ho nomos）——讀到這裡，任何猶太讀者都會問：那律法到底有甚麼用？<\/strong><\/p><p>τῶν παραβάσεων χάριν προσετέθη（tōn parabaseōn charin prosetethē）。χάριν（charin） 放在名詞後面，意思是「為了……的緣故」。為了過犯的甚麼？各家讀法有三：<\/p><p>一、<strong>為了顯明過犯<\/strong>：律法把罪變成看得見、說得出的「越界」；「哪裡沒有律法，那裡就沒有過犯」（羅 4:15）。二、<strong>為了限制過犯<\/strong>：律法像圍欄，在基督來以前約束罪的蔓延；這與 3:23–24 的「看守」「師傅」相合。三、<strong>為了使過犯增多<\/strong>：「律法本是外添的，叫過犯顯多」（羅 5:20）。本講義以第一說為主，第二說為輔：律法顯出罪，也在一段時間裡看守人。προσετέθη（prosetethē） 是「被加上」，與 5:20 的「外添」意思相近；ἄχρις οὗ ἔλθῃ τὸ σπέρμα（achris hou elthē to sperma） 給律法定下期限。<\/p><p>διαταγεὶς διʼ ἀγγέλων（diatageis di' angelōn）：舊約出埃及記沒有說律法是藉天使頒佈的；這使我們想起申 33:2「從萬萬聖者中來臨」（申 33:2）的七十士譯本，也想起司提反說「你們受了天使所傳的律法」（徒 7:53）。保羅用這一點說明：律法是經過層層轉交的。<\/p><p>第 20 節 ὁ δὲ μεσίτης ἑνὸς οὐκ ἔστιν（ho de mesitēs henos ouk estin）, ὁ δὲ θεὸς εἷς ἐστιν（ho de theos heis estin），據說有三百種解釋。主要三說：一、中保代表雙方，律法是雙方的約，要看人守不守；應許只出於一位神，單方面成立。二、中保代表「多方」（天使、百姓），律法是間接傳來的；應許是神親口直接說的。三、ἑνὸς（henos） 回指 3:16 的那「一個」子孫：摩西作中保，不能造出那一個家；神是一位，他要的是一個家（羅 3:30；3:28 的 εἷς（heis））。本講義取第一、二說合讀，並保留第三說的眼光。<\/p>","exp":"<p><strong>「這樣說來，律法是為甚麼有的呢？」（3:19）保羅自己提出最難的問題。<\/strong><\/p><p>講了這麼多「不是因行律法」，聽的人難免會想：那神給律法是多此一舉嗎？保羅的回答分三層。<\/p><p>第一，律法是「為過犯添上的」（3:19）。它讓人看見自己越了界。沒有交通規則，超速只是開得快；有了限速牌，超速就是違規。律法不製造罪，它把罪照出來，叫人不能再說「我沒有問題」。<\/p><p>第二，律法有期限：「等候那蒙應許的子孫來到」（3:19）。律法不是永遠的主角，它是在應許與基督之間的過渡安排。這不是貶低律法；羅馬書說「律法是聖潔的」（羅 7:12）。只是它從來不是被設計來使人稱義的。<\/p><p>第三，律法是「藉天使經中保之手設立的」（3:19），應許卻是神親口說的。第 20 節「中保本不是為一面作的；神卻是一位」（3:20）是全本新約最難懂的句子之一，但大方向清楚：律法經過轉手，要看雙方；應許直接出於神，單方面成立。人守不住律法，應許卻不會因為人的失敗而落空。<\/p><p>「神卻是一位」也回響著以色列每日誦讀的示瑪：「耶和華我們神是獨一的主。」（申 6:4）同一位神，要叫受割禮的和未受割禮的都因信稱義。律法的功用、三分法今天怎樣看，本章議題頁並陳各家，全卷立場見議題「律法、稱義與『因信』」。<\/p>"},{"a":21,"z":22,"star":2,"grk":"<p lang=\"grc\">Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ; μὴ γένοιτο· εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι, ὄντως ἐκ νόμου ἂν ἦν ἡ δικαιοσύνη.<\/p><p lang=\"grc\">ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν ἵνα ἡ ἐπαγγελία ἐκ πίστεως Ἰησοῦ Χριστοῦ δοθῇ τοῖς πιστεύουσιν.<\/p>","lit":"<p>那麼律法是與神的應許作對的嗎？斷乎不是！因為若是賜下了一個能使人活的律法，義就真的會是出於律法了。<\/p><p>但是聖經把一切都圈在罪之下，為要使應許出於耶穌基督的信，被賜給那些信的人。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>κατὰ τῶν ἐπαγγελιῶν<\/td><td>kata tōn epangeliōn<\/td><td>與應許作對<\/td><td>追蹤：ἐπαγγελία<\/td><\/tr><tr><td>μὴ γένοιτο<\/td><td>mē genoito<\/td><td>斷乎不是<\/td><td>保羅最強烈的否定<\/td><\/tr><tr><td>ζῳοποιῆσαι<\/td><td>zōopoiēsai<\/td><td>使人活<\/td><td>律法做不到的事<\/td><\/tr><tr><td>συνέκλεισεν<\/td><td>synekleisen<\/td><td>圈在一起、關起來<\/td><td>3:23 同字根<\/td><\/tr><tr><td>τὰ πάντα<\/td><td>ta panta<\/td><td>一切<\/td><td>中性：無一例外<\/td><\/tr><tr><td>ἐκ πίστεως Ἰησοῦ Χριστοῦ<\/td><td>ek pisteōs Iēsou Christou<\/td><td>出於耶穌基督的信<\/td><td>πίστις Χριστοῦ：兩種讀法<\/td><\/tr><\/table>","gram":"<p><strong>第 21 節以 μὴ γένοιτο（mē genoito） 回答：律法與應許不是對手。<\/strong><\/p><p>Ὁ οὖν νόμος κατὰ τῶν ἐπαγγελιῶν τοῦ θεοῦ（Ho oun nomos kata tōn epangeliōn tou theou） 是保羅預先替讀者問的問題；μὴ γένοιτο（mē genoito） 是他最強的否定。接著是與事實相反的條件句：εἰ γὰρ ἐδόθη νόμος ὁ δυνάμενος ζῳοποιῆσαι（ei gar edothē nomos ho dynamenos zōopoiēsai）, ὄντως ἐκ νόμου ἂν ἦν ἡ δικαιοσύνη（ontōs ek nomou an ēn hē dikaiosynē）。ἂν（an） 加未完成式表示「可惜不是這樣」。律法的問題不在它與應許作對，而在它沒有 ζῳοποιῆσαι（zōopoiēsai） 的能力。2:21 已經說過：「義若是藉著律法得的，基督就是徒然死了。」（2:21）<\/p><p>第 22 節 ἀλλὰ συνέκλεισεν ἡ γραφὴ τὰ πάντα ὑπὸ ἁμαρτίαν（alla synekleisen hē graphē ta panta hypo hamartian）：聖經再次被擬人化。τὰ πάντα（ta panta） 是中性，比「眾人」更廣。羅 11:32 用同一個動詞：「神將眾人都圈在不順服之中，特意要憐恤眾人。」（羅 11:32）圈起來的目的是 ἵνα（hina），是為了應許。<\/p><p><strong>✝ πίστις Χριστοῦ（pistis Christou）<\/strong>：ἐκ πίστεως Ἰησοῦ Χριστοῦ（ek pisteōs Iēsou Christou） 字面是「耶穌基督的信」。屬格有兩讀。<strong>受格屬格<\/strong>：以基督為對象的信，「信耶穌基督」——和合本與多數譯本。<strong>主格屬格<\/strong>：「基督的信實」，指基督順服至死的信實（海斯、賴特等）。支持「基督的信實」的理由：句末已有 τοῖς πιστεύουσιν（tois pisteuousin）「那信的人」，若前面也是人的信，便重複了；3:23、25 說「信」來到，像是在說一件歷史事件，即基督的來臨。支持「信基督」的理由：3:6–9 一路講的是亞伯拉罕與信徒的信；保羅從未在別處清楚說「基督信神」；2:16 明說「連我們也信了基督耶穌」（2:16）。本講義照和合本「信基督」解經，同時承認「基督的信實」讀法有真實的洞見：我們能信，是因為他先信實。<\/p>","exp":"<p><strong>「這樣，律法是與神的應許反對嗎？斷乎不是！」（3:21）<\/strong><\/p><p>保羅剛說完律法有期限、是轉手的，馬上防止讀者走到另一個極端：把律法當成敵人。律法和應許不是對手，它們分工不同。應許給生命，律法顯明需要。律法若能叫人活，神就不必差他的兒子了。<\/p><p>「但聖經把眾人都圈在罪裡」（3:22）。這是一幅監獄的畫面。不是只有外邦人在裡面，猶太人也在；不是只有壞人在裡面，好人也在。全人類被同一道牆圍住。這聽起來很絕望，但緊接的一句改變了一切：圈起來，是「使所應許的福因信耶穌基督，歸給那信的人」（3:22）。神把所有人關在同一個地方，是為了用同一把鑰匙放所有人出來。<\/p><p>那把鑰匙是信。這裡的「信」要講兩面，而且兩面不衝突。我們信基督，這是和合本的讀法，也是第 3 章一路講的亞伯拉罕之信。但我們能信，是因為基督先信實——他走完了順服的路，一直到十字架。信心不是我們拿來換取應許的新功勞，是投靠一位信實的主。所以人不必一直問「我的信心夠不夠用力」；焦點在他，不在我。<\/p><p>這也防備一種隱藏的律法主義：把「信心」本身變成新的行為，用信心的大小來分等級。保羅說應許是「歸給那信的人」，沒有說歸給信得最好的人。<\/p>"},{"a":23,"z":25,"star":2,"grk":"<p lang=\"grc\">Πρὸ τοῦ δὲ ἐλθεῖν τὴν πίστιν ὑπὸ νόμον ἐφρουρούμεθα συγκλειόμενοι εἰς τὴν μέλλουσαν πίστιν ἀποκαλυφθῆναι.<\/p><p lang=\"grc\">ὥστε ὁ νόμος παιδαγωγὸς ἡμῶν γέγονεν εἰς Χριστόν, ἵνα ἐκ πίστεως δικαιωθῶμεν·<\/p><p lang=\"grc\">ἐλθούσης δὲ τῆς πίστεως οὐκέτι ὑπὸ παιδαγωγόν ἐσμεν.<\/p>","lit":"<p>而在那信來到以前，我們在律法之下被看守著，被圈起來，直到那將要被啟示出來的信。<\/p><p>所以律法成了我們的看管孩子的家奴，直到基督，為要使我們出於信被稱義；<\/p><p>而那信既已來到，我們就不再在看管孩子的家奴之下。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἐφρουρούμεθα<\/td><td>ephrouroumetha<\/td><td>我們被看守<\/td><td>軍事用語：駐防、看守<\/td><\/tr><tr><td>συγκλειόμενοι<\/td><td>synkleiomenoi<\/td><td>被圈起來<\/td><td>與 3:22 同字根<\/td><\/tr><tr><td>τὴν μέλλουσαν πίστιν<\/td><td>tēn mellousan pistin<\/td><td>那將要來的信<\/td><td>和合本「那將來的真道」<\/td><\/tr><tr><td>παιδαγωγὸς<\/td><td>paidagōgos<\/td><td>看管孩子的家奴<\/td><td>不是老師<\/td><\/tr><tr><td>εἰς Χριστόν<\/td><td>eis Christon<\/td><td>直到／引到基督<\/td><td>時間或目的<\/td><\/tr><tr><td>οὐκέτι ὑπὸ παιδαγωγόν<\/td><td>ouketi hypo paidagōgon<\/td><td>不再在家奴之下<\/td><td>孩子長大了<\/td><\/tr><\/table>","gram":"<p><strong>◆ 3:24 的 παιδαγωγός（paidagōgos）：和合本「訓蒙的師傅」，原文不是老師。<\/strong><\/p><p>第 23 節兩個動詞疊在一起：ἐφρουρούμεθα（ephrouroumetha） 是駐防、看守，συγκλειόμενοι（synkleiomenoi） 是圈起來，接 3:22 的 συνέκλεισεν（synekleisen）。這是「被看管」的語言，可以是保護，也可以是限制。τὴν πίστιν（tēn pistin） 帶冠詞，又說它「來到」，和合本意譯為「這因信得救的理」；信在這裡幾乎被當作一個時代來看，就是基督來臨之後的時代。<\/p><p>παιδαγωγός（paidagōgos） 在希臘羅馬家庭裡，是負責看管孩子的家奴：送孩子上學、提書包、管規矩，必要時也打罵。他不是教書的先生，教書的另有其人。孩子長大，大約到成年的年紀，他的工作就結束了。古代文獻對這個角色有兩種描寫：有的嚴厲討厭，有的忠心慈愛。保羅的重點不在嚴不嚴，而在「有期限」。<\/p><p>εἰς Χριστόν（eis Christon） 有兩讀：一、時間的「直到基督」，與 3:23「直圈到」、3:25「從此就不在師傅的手下」一致；二、目的的「引到基督」，和合本「引我們到基督那裡」取這一讀。本講義以時間為主、目的為輔：律法看管人直到基督來，而它的看管本身也把人指向基督。第 25 節 ἐλθούσης δὲ τῆς πίστεως（elthousēs de tēs pisteōs） 是獨立屬格，οὐκέτι ὑπὸ παιδαγωγόν（ouketi hypo paidagōgon） 宣告看管期滿。<\/p>","exp":"<p><strong>「律法是我們訓蒙的師傅，引我們到基督那裡，使我們因信稱義。」（3:24）<\/strong><\/p><p>中文「訓蒙的師傅」容易讓人以為律法是一位老師，教我們一步一步認識基督。原文的畫面更生活化：一位家奴，每天牽著孩子的手走到學校門口。他管孩子不亂跑，提醒他守規矩，有時候很嚴。但他不
