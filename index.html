ξ（sarx） 譯作「情慾」，指的不是身體本身，是以自己為中心的那個舊生命。<\/p><\/blockquote>","exp":"<p>「不要自欺，神是輕慢不得的。人種的是甚麼，收的也是甚麼」（6:7）。這是加拉太書最常被引用、也最常被講錯的一句話。<\/p><p>先看它不是甚麼。<strong>它不是因果報應。<\/strong>業報的想法是：你今天受的苦，一定是你從前種下的；所以看見受苦的人，就要問他種了甚麼。主耶穌的門徒問過同樣的問題：「這人生來是瞎眼的，是誰犯了罪？」（約 9:2）主的回答是：「也不是這人犯了罪，也不是他父母犯了罪」（約 9:3）。所以絕不可以用 6:7 對一個生病、喪子、遭難的人說「你一定是種了甚麼」——那正是約伯的朋友說的話，「耕罪孽、種毒害的人都照樣收割」（伯 4:8），而神說他們議論得不對（伯 42:7）。<\/p><p><strong>它也不是奉獻投資。<\/strong>6:6 剛講到供給施教的人，所以這一節常被接成「你奉獻一千，神會讓你收一萬」。但第 8 節自己解釋了撒種是甚麼：不是一筆一筆的錢，是兩塊田——「順著情慾撒種的，必從情慾收敗壞；順著聖靈撒種的，必從聖靈收永生」（6:8）。收成的不是更多的錢，是敗壞或永生。哥林多後書講義第 9 章講「少種的少收，多種的多收」（林後 9:6）時已經畫過同一條線：撒種講的是慷慨的心，不是神的利息（紅線七）。<\/p><p>那麼它是甚麼？<strong>是生命的方向。<\/strong>每一天，人都在把時間、心思、力氣種進某一塊田。種進自己的肉體，就是以自己為中心——5:19–21 那張清單是它的收成：不是一次就爛掉，是慢慢朽壞。種進聖靈，是 5:25「靠聖靈行事」——收成是 5:22 那一個果子，一直長到永生。<\/p><p>所以這一節對加拉太人是警告，也是安慰。警告：攪擾者推銷的割禮、日子、面子，都是種在肉體上的，看起來很屬靈，收的卻是朽壞。安慰：順著聖靈走的每一步，沒有一步是白走的。<\/p>"},{"a":9,"z":10,"star":1,"grk":"<p lang=\"grc\">τὸ δὲ καλὸν ποιοῦντες μὴ ἐγκακῶμεν καιρῷ γὰρ ἰδίῳ θερίσομεν μὴ ἐκλυόμενοι.<\/p><p lang=\"grc\">ἄρα οὖν ὡς καιρὸν ἔχομεν ἐργαζώμεθα τὸ ἀγαθὸν πρὸς πάντας, μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως.<\/p>","lit":"<p>而行美好的事，我們不要灰心；因為在它自己的時候，我們要收，只要我們不鬆手。<\/p><p>所以，既然我們有時機，我們要向眾人作善事，尤其是向信心的家人。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τὸ δὲ καλὸν ποιοῦντες<\/td><td>to de kalon poiountes<\/td><td>行美好的事<\/td><td>現在分詞：一直在做<\/td><\/tr><tr><td>μὴ ἐγκακῶμεν<\/td><td>mē enkakōmen<\/td><td>我們不要洩氣<\/td><td>勸勉的假設語氣<\/td><\/tr><tr><td>καιρῷ γὰρ ἰδίῳ<\/td><td>kairō gar idiō<\/td><td>因為在它自己的時候<\/td><td>時候是定好的<\/td><\/tr><tr><td>μὴ ἐκλυόμενοι<\/td><td>mē eklyomenoi<\/td><td>只要不鬆手<\/td><td>像弓弦鬆了、人累到虛脫<\/td><\/tr><tr><td>ὡς καιρὸν ἔχομεν<\/td><td>hōs kairon echomen<\/td><td>趁我們有時機<\/td><td>第二個 καιρός<\/td><\/tr><tr><td>τοὺς οἰκείους τῆς πίστεως<\/td><td>tous oikeious tēs pisteōs<\/td><td>信心的家人<\/td><td>οἶκος「家」的形容詞<\/td><\/tr><\/table>","gram":"<p><strong>兩節裡有兩個 καιρός（kairos）。<\/strong>第 9 節 καιρῷ γὰρ ἰδίῳ θερίσομεν（kairō gar idiō therisomen），「因為在它自己的時候，我們要收」；第 10 節 ὡς καιρὸν ἔχομεν（hōs kairon echomen），「趁著我們有時機」。收成的時候是神定的，撒種的時機卻在今天。ἰδίῳ（idiō） 與 6:5 的 τὸ ἴδιον（to idion） 是同一個字：各人有自己的背包，收成也有它自己的季節。<\/p><p>μὴ ἐγκακῶμεν（mē enkakōmen） 是勸勉的假設語氣：「讓我們不要洩氣」；林後 4:1、16 的「不喪膽」是同一個動詞。μὴ ἐκλυόμενοι（mē eklyomenoi） 是條件分詞：「只要不鬆手」——這個動詞原指弓弦鬆了、人累到虛脫。第 10 節 ἄρα οὖν（ara oun） 是保羅愛用的雙重結論詞，把整段收起來：πρὸς πάντας（pros pantas） 在前，μάλιστα δὲ πρὸς τοὺς οἰκείους τῆς πίστεως（malista de pros tous oikeious tēs pisteōs） 在後。οἰκείους（oikeious） 從 οἶκος（oikos）「家」來，弗 2:19 說外邦信徒是「上帝家裡的人」（弗 2:19），用的是同一個字。<\/p>","exp":"<p>「我們行善，不可喪志；若不灰心，到了時候就要收成」（6:9）。這句話是對累了的人說的。扛別人的重擔、挽回跌倒的人、供給施教的人、天天順著聖靈撒種——做久了，人會累。保羅沒有說「屬靈的人不會累」，他說：不要鬆手。<\/p><p>「到了時候」是這一節的安慰，也是紅線七的另一半。收成的時候是神定的，不是我們算的。有的種子今年發芽，有的要等很多年；有的收成在今生，有的要等到永生（6:8）。所以不能拿眼前的光景，去判斷一個人種得好不好：一個忠心服事卻看不見果效的人，不是種錯了；一個看似順利的人，也不一定種對了。<\/p><p>第 10 節把行善的範圍打開：「有了機會就當向眾人行善，向信徒一家的人更當這樣」（6:10）。「眾人」在前，教會的愛不是關起門來的；「一家的人」更當這樣，因為擔子是一家人一起分的。6:2 的「彼此」，在這裡有了名字：信心的家人。加拉太的教會曾為割禮分了桌子（2:12），保羅在信末提醒他們：你們是同一個家。照顧別人的人累了，也要被這個家照顧。<\/p>"},{"a":11,"z":13,"star":2,"grk":"<p lang=\"grc\">Ἴδετε πηλίκοις ὑμῖν γράμμασιν ἔγραψα τῇ ἐμῇ χειρί.<\/p><p lang=\"grc\">ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί, οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι, μόνον ἵνα τῷ σταυρῷ τοῦ Χριστοῦ μὴ διώκωνται·<\/p><p lang=\"grc\">οὐδὲ γὰρ οἱ περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν, ἀλλὰ θέλουσιν ὑμᾶς περιτέμνεσθαι ἵνα ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται.<\/p>","lit":"<p>你們看，我用何等大的字母，親手寫給你們。<\/p><p>凡想要在肉體上作出好看外表的，這些人強迫你們受割禮，只是為了不因基督的十字架受逼迫。<\/p><p>因為就連那些受割禮的，他們自己也不遵守律法；他們卻想要你們受割禮，為了在你們的肉體上誇口。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Ἴδετε πηλίκοις ὑμῖν γράμμασιν<\/td><td>Idete pēlikois hymin grammasin<\/td><td>看哪，用何等大的字母<\/td><td>πηλίκος：多大的；講字形，不講篇幅<\/td><\/tr><tr><td>ἔγραψα τῇ ἐμῇ χειρί<\/td><td>egrapsa tē emē cheiri<\/td><td>我用自己的手寫<\/td><td>書信式過去式：「我現在寫」<\/td><\/tr><tr><td>εὐπροσωπῆσαι ἐν σαρκί<\/td><td>euprosōpēsai en sarki<\/td><td>在肉體上作出好看的臉<\/td><td>πρόσωπον「臉」；新約只此一次<\/td><\/tr><tr><td>ἀναγκάζουσιν<\/td><td>anankazousin<\/td><td>他們強迫<\/td><td>2:3、2:14「勉強」同一個字<\/td><\/tr><tr><td>μόνον ἵνα<\/td><td>monon hina<\/td><td>只不過是為了<\/td><td>揭穿動機<\/td><\/tr><tr><td>οἱ περιτεμνόμενοι<\/td><td>hoi peritemnomenoi<\/td><td>那些受割禮的<\/td><td>現在分詞；SBLGNT 沒有 Strong 編號<\/td><\/tr><tr><td>ἐν τῇ ὑμετέρᾳ σαρκὶ καυχήσωνται<\/td><td>en tē hymetera sarki kauchēsōntai<\/td><td>在你們的肉體上誇口<\/td><td>誇口的地方是別人的身體<\/td><\/tr><\/table>","gram":"<p><strong>6:11 是全信的轉折：保羅從代筆者手裡接過了筆。<\/strong><\/p><p>古代書信常由書記代筆，寫信人在結尾親筆問安；羅 16:22 有代筆的德提，帖後 3:17 保羅說「我的筆跡就是這樣」（帖後 3:17）。ἔγραψα（egrapsa） 是書信式過去式：讀信的人看到時已是過去，寫的人說的是「我現在寫」。所以多數學者認為，親筆的部分從 6:11 開始，一直到 6:18；少數人認為整封信都是保羅親筆。πηλίκοις（pēlikois） 修飾 γράμμασιν（grammasin），指字母的大小，不是信的長度——和合本「字是何等的大」譯得對；英王欽定本譯成「多長的一封信」，是把字形讀成了篇幅。<\/p><p>為甚麼字大？各說並陳：①眼疾說——4:15 加拉太人願意「把自己的眼睛剜出來給我」（4:15），4:13 說他「身體有疾病」（4:13），學者推測他視力不好；②強調說——像今天把要緊的話印成粗體，大字就是畫線；③手的說法——做帳棚的手粗，或受過傷，寫不出書記那種工整的小字。經文沒有說，本講義不定一說，以②為最穩：無論原因是甚麼，大字的作用是叫人停下來讀。<\/p><blockquote><p>第 12 節 ὅσοι θέλουσιν εὐπροσωπῆσαι ἐν σαρκί（hosoi thelousin euprosōpēsai en sarki）：εὐπροσωπέω（euprosōpeō） 由「好」與 πρόσωπον（prosōpon）「臉」合成，新約只此一次，就是中文的「做面子」。οὗτοι ἀναγκάζουσιν ὑμᾶς περιτέμνεσθαι（houtoi anankazousin hymas peritemnesthai）——ἀναγκάζω（anankazō） 正是 2:3 提多「沒有勉強」受割禮、2:14 保羅責問彼得「勉強外邦人」的那個字。μόνον ἵνα（monon hina） 是揭穿：「只不過是為了」。第 13 節 οὐδὲ γὰρ οἱ περιτεμνόμενοι αὐτοὶ νόμον φυλάσσουσιν（oude gar hoi peritemnomenoi autoi nomon phylassousin）：現在分詞 περιτεμνόμενοι（peritemnomenoi） 可讀「那些受割禮的人」，指傳割禮的猶太派教師；也可讀「那些正在受割禮的人」，指已被說動的加拉太信徒。多數學者取前者，和合本也是。<\/p><\/blockquote>","exp":"<p>「請看我親手寫給你們的字是何等的大呢」（6:11）。全封信寫到這裡，保羅放下口述，自己拿起筆。像一位父親寫完一封很重的信，最後幾行要自己寫，而且寫得很大——這一段是他要加拉太人一定不能錯過的。<\/p><p>接著他揭開攪擾者的底牌。「凡希圖外貌體面的人都勉強你們受割禮，無非是怕自己為基督的十字架受逼迫」（6:12）。這是保羅對攪擾者動機的判斷——要加拉太人受割禮的，是那些傳割禮的人，不是保羅；保羅說的是他們為甚麼這樣熱心：為了面子。在猶太群體裡，帶回一群受了割禮的外邦人，是一份體面的成績單；帶回一群沒受割禮、卻說自己是亞伯拉罕子孫的人，就要面對同胞的白眼與逼迫。割禮成了他們的保護色。<\/p><p>第 13 節更尖銳：「他們那些受割禮的，連自己也不守律法；他們願意你們受割禮，不過要藉著你們的肉體誇口」（6:13）。他們要的不是加拉太人更愛神，是加拉太人身上的記號，好在別人面前誇。這是一切宗教操控的樣子：<strong>我的成功，要寫在你的身上。<\/strong>決志的人數、聚會的出席、受洗的統計，都可以是美事；但當一個人需要別人身上的成績來撐自己的面子，他就和加拉太的對手站到同一邊了（立場三）。<\/p><p>這裡也要守住紅線三：保羅揭穿的是一群具體的教師、一種具體的動機，不是猶太人。他自己是「生來的猶太人」（2:15），他責備的是怕受逼迫、而要人受割禮的面子工程，不是一個民族。今天的「割禮」可能是一種語言、一套服裝規矩、一張會員卡——信耶穌還要再加上甚麼，才算我們的人？凡是為了讓我們好看而加在別人身上的，都是 6:12 的面子（立場一）。<\/p>"},{"a":14,"z":14,"star":3,"grk":"<p lang=\"grc\">ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, διʼ οὗ ἐμοὶ κόσμος ἐσταύρωται κἀγὼ κόσμῳ.<\/p>","lit":"<p>但至於我，斷不可誇口，除非在我們主耶穌基督的十字架上；藉著它，世界對我已被釘在十字架上，我對世界也是。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἐμοὶ δὲ μὴ γένοιτο<\/td><td>emoi de mē genoito<\/td><td>至於我，斷乎不可<\/td><td>μὴ γένοιτο：本卷第三次（2:17；3:21）<\/td><\/tr><tr><td>καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ<\/td><td>kauchasthai ei mē en tō staurō<\/td><td>誇口，除非在十字架上<\/td><td>εἰ μή：唯一的例外<\/td><\/tr><tr><td>τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ<\/td><td>tou kyriou hēmōn Iēsou Christou<\/td><td>我們主耶穌基督的<\/td><td>用全名，鄭重得像立誓<\/td><\/tr><tr><td>διʼ οὗ<\/td><td>di' hou<\/td><td>藉著它／他<\/td><td>可指十字架，也可指基督<\/td><\/tr><tr><td>ἐμοὶ κόσμος ἐσταύρωται<\/td><td>emoi kosmos estaurōtai<\/td><td>世界對我已被釘<\/td><td>完成式被動，與 2:19--20 呼應<\/td><\/tr><tr><td>κἀγὼ κόσμῳ<\/td><td>kagō kosmō<\/td><td>我對世界也是<\/td><td>動詞省略；雙向的死<\/td><\/tr><\/table>","gram":"<p><strong>6:14 是全卷地勢圖的最高點（98），也是本卷「誇口」一字的終點。<\/strong><\/p><p>句首 ἐμοὶ δὲ（emoi de） 是強烈的對照：6:13 的「他們」要藉別人的肉體誇口，「至於我」——。接著是 μὴ γένοιτο（mē genoito），「斷乎不可」，本卷前兩次用在 2:17 與 3:21，都是否定一個荒謬的推論；這一次否定的是保羅自己：我絕不可以誇別的。καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ（kauchasthai ei mē en tō staurō） 用 εἰ μή（ei mē） 開出唯一的例外。保羅用的是全名 τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ（tou kyriou hēmōn Iēsou Christou），鄭重得像在立誓。<\/p><p>διʼ οὗ（di' hou） 的 οὗ（hou） 是陽性單數關係代名詞，而「十字架」與「主耶穌基督」在原文都是陽性，文法無法決定先行詞：可以讀成「藉著這十字架」，也可以讀成「藉著他」。和合本「因這十字架」取前者，多數英譯亦然。本講義從和合本，因為十字架是全節的焦點；兩讀意思相通——十字架就是那位被釘的基督。<\/p><blockquote><p>ἐσταύρωται（estaurōtai） 是完成式被動，和 2:19--20 交界處的 συνεσταύρωμαι（synestaurōmai） 同一個字根、同一個時態：已經被釘了，而且結果到今天仍然有效。後半句 κἀγὼ κόσμῳ（kagō kosmō） 省略了動詞，形成雙向的交錯：世界對我是死的，我對世界也是死的。κόσμος（kosmos） 在這裡不是大自然，是 4:3「世俗小學」（4:3）——原文 τὰ στοιχεῖα τοῦ κόσμου（ta stoicheia tou kosmou）——那一套以肉體、記號、面子衡量人的體系。<\/p><\/blockquote>","exp":"<p>〔哥林多〕林後 5:14--15（哥林多後書講義第 5 章）<\/p><p>「但我斷不以別的誇口，只誇我們主耶穌基督的十字架」（6:14）。這是加拉太書的山頂，也是本章的章題。<\/p><p>先看他把甚麼放在對面。6:13 的人要「藉著你們的肉體誇口」（6:13）——誇別人身上的記號，誇自己帶來的成績。保羅說：我只誇一樣東西，而那一樣，正是他們最怕的。6:12 說他們要人受割禮，是「怕自己為基督的十字架受逼迫」（6:12）；保羅卻把十字架高舉成唯一的誇口。<strong>對手躲的，正是保羅誇的。<\/strong><\/p><p>在第一世紀，十字架不是項鍊上的裝飾，是羅馬人處死奴隸與叛亂者的刑具，是一個不在餐桌上提的字。誇十字架，就像今天有人說「我只誇那座刑場」。保羅不是喜歡痛苦；他誇的是在那裡發生的事：「基督既為我們受了咒詛」（3:13），「他是愛我，為我捨己」（2:20）。人能誇的一切——血統、割禮、學問、熱心（腓 3:4–8）——在十字架面前都失去了重量。<\/p><p>前一卷走過同一條路。哥林多後書裡，誇口被翻成誇軟弱：「我更喜歡誇自己的軟弱，好叫基督的能力覆庇我」（林後 12:9）；那一卷第 5 章說基督替眾人死，「是叫那些活著的人不再為自己活」（林後 5:15）。加拉太書把這條線翻到底：連軟弱也不再是誇口的對象，只剩十字架。<\/p><p>後半句說出十字架怎樣改變一個人：「因這十字架，就我而論，世界已經釘在十字架上；就世界而論，我已經釘在十字架上」（6:14）。這是 2:20「我已經與基督同釘十字架」（2:20）的另一面。那個用面子、記號、成績衡量人的世界，對保羅已經死了——它的稱讚不再能抬高他，它的白眼也不再能壓垮他。這不是冷漠，保羅仍為加拉太人「再受生產之苦」（4:19）；這是自由：一個人不再需要世界給他面子，才能放手去愛。<\/p><p>321 在這裡才接上來：無己不是沒有自己，是自己不再需要靠別的東西撐著。人可以不再誇口，因為他已經被那一位愛到底了（2:20）。<\/p>"},{"a":15,"z":16,"star":3,"grk":"<p lang=\"grc\">οὔτε γὰρ περιτομή τί ἐστιν οὔτε ἀκροβυστία, ἀλλὰ καινὴ κτίσις.<\/p><p lang=\"grc\">καὶ ὅσοι τῷ κανόνι τούτῳ στοιχήσουσιν, εἰρήνη ἐπʼ αὐτοὺς καὶ ἔλεος, καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ.<\/p>","lit":"<p>因為割禮不算甚麼，未受割禮也不算甚麼，乃是新的創造。<\/p><p>而凡要照這準繩排列而行的，願平安在他們身上，和憐憫，也在神的以色列身上。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>οὔτε γὰρ περιτομή τί ἐστιν<\/td><td>oute gar peritomē ti estin<\/td><td>因為割禮算不得甚麼<\/td><td>τί：「甚麼東西」<\/td><\/tr><tr><td>οὔτε ἀκροβυστία<\/td><td>oute akrobystia<\/td><td>未受割禮也不算<\/td><td>兩邊一起歸零<\/td><\/tr><tr><td>ἀλλὰ καινὴ κτίσις<\/td><td>alla kainē ktisis<\/td><td>乃是新的創造<\/td><td>林後 5:17 同一個片語<\/td><\/tr><tr><td>τῷ κανόνι τούτῳ<\/td><td>tō kanoni toutō<\/td><td>這條準繩<\/td><td>κανών：量尺、規矩<\/td><\/tr><tr><td>στοιχήσουσιν<\/td><td>stoichēsousin<\/td><td>他們要排列而行<\/td><td>5:25「靠聖靈行事」同一個動詞<\/td><\/tr><tr><td>εἰρήνη ἐπʼ αὐτοὺς καὶ ἔλεος<\/td><td>eirēnē ep' autous kai eleos<\/td><td>平安在他們身上，和憐憫<\/td><td>祝禱的句式<\/td><\/tr><tr><td>καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ<\/td><td>kai epi ton Israēl tou theou<\/td><td>和／就是在神的以色列身上<\/td><td>καί 兩讀<\/td><\/tr><\/table>","gram":"<p><strong>6:15 是 5:6 的回音，只換了最後幾個字。<\/strong><\/p><p>5:6 說「受割禮不受割禮全無功效，惟獨使人生發仁愛的信心才有功效」（5:6）；6:15 先說 οὔτε γὰρ περιτομή τί ἐστιν（oute gar peritomē ti estin），再說 οὔτε ἀκροβυστία（oute akrobystia）——兩邊一起歸零——然後是 ἀλλὰ καινὴ κτίσις（alla kainē ktisis）。林前 7:19 還有第三個版本：只要守神的誡命。三處合讀：生發仁愛的信心、新的創造、遵守神的誡命，是同一個新生命的三個面。καινὴ κτίσις（kainē ktisis） 沒有冠詞，也沒有動詞：可以讀成「新造的人」（個人，和合本），也可以讀成「新的創造」（神在基督裡開始的整個新世界）；林後 5:17 用的是同一個片語。兩讀不必二選一：神的新創造，從一個個被更新的人開始。<\/p><p>第 16 節 τῷ κανόνι τούτῳ στοιχήσουσιν（tō kanoni toutō stoichēsousin）：κανών（kanōn） 是量尺、準繩；στοιχέω（stoicheō） 是排成一列前進，5:25「靠聖靈行事」用的就是它。「此理」指 6:14–15：只誇十字架，作新造的人。<\/p><blockquote><p>◆ καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ（kai epi ton Israēl tou theou） 是全卷最難的一個 καί（kai）。<strong>讀法一，「和」：<\/strong>平安加給照此理而行的人，也加給「神的以色列」——另一群人，指信主的猶太人，或將來要得救的以色列（羅 11:26）。理由：保羅在別處從未直接稱教會為「以色列」；καί（kai） 最自然的意思就是「和」。<strong>讀法二，「就是」（解說的 καί（kai））：<\/strong>照此理而行的人，就是神的以色列——同一群人，指在基督裡、由猶太與外邦信徒組成的全教會。理由：全卷說以信為本的人「就是亞伯拉罕的子孫」（3:7），6:15 才說割禮不割禮都不算，若緊接著又按割禮分出一群人，論證就自相矛盾。學者也觀察到，這句祝禱使我們想起「願平安歸於以色列」（詩 125:5），但保羅沒有明說引用。本講義採讀法二為主要判斷，同時明說：這不表示神棄絕了肉身的以色列——保羅在羅 11:1–2 斷然否認（立場四）。<\/p><\/blockquote>","exp":"<p>〔哥林多〕林後 5:17（哥林多後書講義第 5 章）<\/p><p>「受割禮不受割禮都無關緊要，要緊的就是作新造的人」（6:15）。全卷的爭論，被這一節一筆勾銷。傳割禮的人說：割禮要緊。保羅若只說「不受割禮才要緊」，就只是換了另一個記號——今天有些教會以「我們不那樣做」自豪，其實是同一個錯。保羅說：兩邊都不算。要緊的，是神在一個人身上作了新的事。<\/p><p>哥林多後書說：「若有人在基督裡，他就是新造的人，舊事已過，都變成新的了」（林後 5:17）。同一個片語，在加拉太書落在割禮的爭論上。新造不是在舊的生命上加一個記號，是神從頭再造一次。2:20 說「現在活著的不再是我，乃是基督在我裡面活著」（2:20），同一節接著說「他是愛我，為我捨己」（2:20）——新造的人不是被抹掉的人，是被愛重新造過的人（見第 2 章）。<\/p><p>這也是本卷那條線的終點：從 1:6「去從別的福音」（1:6），到 6:15「新造的人」。別的福音是在基督後面加一個「和」字——基督和割禮、基督和日子、基督和我們的規矩；新造是把那個「和」字拿掉，只剩基督作成的事。<\/p><p>第 16 節是祝福：「凡照此理而行的，願平安、憐憫加給他們，和神的以色列民」（6:16）。「此理」就是準繩：十字架與新造。照著它排隊前進的人，不分猶太人、外邦人，都是神的子民——這是本講義的主要讀法（立場四）。但這一節絕不可以講成「神棄絕了猶太人，教會取代了他們」。保羅在羅馬書自己問：「上帝棄絕了他的百姓嗎？斷乎沒有！」（羅 11:1）他自己就是以色列人。「神的以色列民」是一個把外邦人接進來的名字，不是一個把猶太人趕出去的名字（紅線三）。<\/p><p>平安與憐憫，是這封信少有的溫柔。它從「我希奇」（1:6）開口，沒有感恩段；寫到這裡，保羅終於為他們祝福。<\/p>"},{"a":17,"z":18,"star":2,"grk":"<p lang=\"grc\">Τοῦ λοιποῦ κόπους μοι μηδεὶς παρεχέτω, ἐγὼ γὰρ τὰ στίγματα τοῦ Ἰησοῦ ἐν τῷ σώματί μου βαστάζω.<\/p><p lang=\"grc\">Ἡ χάρις τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ μετὰ τοῦ πνεύματος ὑμῶν, ἀδελφοί· ἀμήν.<\/p>","lit":"<p>從今以後，誰也不要給我添勞苦；因為我在我的身體上背著耶穌的烙印。<\/p><p>我們主耶穌基督的恩典與你們的靈同在，弟兄們。阿們。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Τοῦ λοιποῦ<\/td><td>Tou loipou<\/td><td>從今以後<\/td><td>表時間的屬格<\/td><\/tr><tr><td>κόπους μοι μηδεὶς παρεχέτω<\/td><td>kopous moi mēdeis parechetō<\/td><td>誰也不要給我添勞苦<\/td><td>κόπος：勞苦、麻煩<\/td><\/tr><tr><td>τὰ στίγματα τοῦ Ἰησοῦ<\/td><td>ta stigmata tou Iēsou<\/td><td>耶穌的烙印<\/td><td>烙在奴僕身上、標明主人的記號<\/td><\/tr><tr><td>ἐν τῷ σώματί μου βαστάζω<\/td><td>en tō sōmati mou bastazō<\/td><td>我在我的身體上背著<\/td><td>βαστάζω：6:2、6:5 同一個動詞<\/td><\/tr><tr><td>μετὰ τοῦ πνεύματος ὑμῶν<\/td><td>meta tou pneumatos hymōn<\/td><td>與你們的靈同在<\/td><td>和合本譯「在你們心裡」<\/td><\/tr><tr><td>ἀδελφοί<\/td><td>adelphoi<\/td><td>弟兄們<\/td><td>原文最後一個字（之後只剩一聲阿們）<\/td><\/tr><\/table>","gram":"<p><strong>Τοῦ λοιποῦ（Tou loipou） 是表時間的屬格：「從今以後」，也可讀作「至於其餘的」。<\/strong>κόπους μοι μηδεὶς παρεχέτω（kopous moi mēdeis parechetō），「誰也不要再給我添勞苦」——κόπος（kopos） 是勞苦、麻煩；4:11 保羅怕自己在他們身上「枉費了工夫」（4:11），用的是同一個字族。他不是不許人再發問，是不要再有人拿割禮來爭他的福音與使徒的身分。<\/p><p>ἐγὼ γὰρ（egō gar） 的「我」與 6:12–13 的「他們」對照。τὰ στίγματα（ta stigmata） 是 στίγμα（stigma） 的複數，新約只此一次，原指烙在奴僕、俘虜、牲口身上的記號，標明屬於哪一位主人；有些神廟的奴僕也身帶神明的烙印。βαστάζω（bastazō） 與 6:2、6:5 是同一個動詞：保羅要人扛彼此的重擔、背自己的背包，他自己身上背的，是耶穌的記號。<\/p><blockquote><p>這個字不是中世紀以後所說的「聖痕」——身上忽然出現與基督釘痕相同的傷口的神蹟。上下文說得清楚：這些記號是為主受的傷，是「被棍打了三次；被石頭打了一次」（林後 11:25）留下的。第 18 節的祝禱與腓 4:23、門 25 幾乎一樣，但加拉太書在 ὑμῶν（hymōn） 之後多了一個呼格 ἀδελφοί（adelphoi），放在 ἀμήν（amēn） 之前。和合本照中文語氣把「弟兄們」移到句首；原文裡，它是這封信最後一個字，之後只剩一聲阿們。<\/p><\/blockquote>","exp":"<p>〔背景〕徒 14:19（使徒行傳講義第 14 章）<\/p><p>「從今以後，人都不要攪擾我，因為我身上帶著耶穌的印記」（6:17）。對手要在加拉太人的身上留一個記號，好拿去誇；保羅說：我身上早已有記號了。<\/p><p>那些記號從哪裡來？使徒行傳講義第 14 章講過路司得：「但有些猶太人從安提阿和以哥念來，挑唆眾人，就用石頭打保羅，以為他是死了，便拖到城外」（徒 14:19）。若照南加拉太說，路司得正是收信的教會之一——加拉太人當中，可能有人親眼看過保羅被拖出城外。他身上的疤，他們認得。<strong>一個要別人身上的記號來誇口，一個用自己身上的傷來作見證。<\/strong><\/p><p>這裡要守住一條界線：<strong>「耶穌的印記」不是聖痕。<\/strong>不是身上忽然出現釘痕的神蹟，也不是屬靈等級的證書；它是為福音挨的打、受的傷。今天若有人拿身上的異象或記號來證明自己的權柄，正好走回 6:12 的面子。保羅身上的記號，不是叫人看他，是叫人看他屬於誰。<\/p><p>而且這是奴僕的烙印。全卷講了五章「你不是奴僕」（4:7），最後一節自傳，保羅卻說：我身上帶著主人的記號。這不是矛盾，這是全卷的結論：從律法的奴僕變成神的兒子，然後自由地作「基督的僕人」（1:10）——被釋放的人，甘心帶著那位贖他的主的名字。<\/p><p>最後一句是祝福：「弟兄們，願我主耶穌基督的恩常在你們心裡。阿們」（6:18）。這封最嚴厲的信，沒有感恩段，開口就是「我希奇」（1:6）；但它原文在阿們之前的最後一個字是「弟兄們」。保羅責備了他們、警告了他們，最後仍然叫他們家人。恩典從頭到尾包著這封信：開頭是「藉著基督之恩召你們的」（1:6），結尾是「我主耶穌基督的恩」（6:18）。中間所爭的，就是不要在恩典後面再加任何東西。<\/p>"}]},"serm":{"1":{"min":18,"blocks":[["h","《將他兒子啟示在我心裡》"],["p","弟兄姊妹平安，今天我們開始讀加拉太書，從第一章讀起。"],["p","我想先問你一個問題。請你不要急著回答，在心裡停一下。"],["q","如果今天晚上，一位天使真的站在你床邊，滿身是光，"],["q","他對你說：「你信的福音不完整。我來告訴你，還缺了甚麼。」"],["p","你會信嗎？"],["p","我們再把問題換一個樣子。"],["p","如果站在你面前的不是天使，是一位你很敬重的屬靈前輩。"],["p","他帶你信主，他為你流過淚，他說話很有份量。"],["p","有一天他告訴你：單單信耶穌還不夠，你還要再加上一樣，才算真的得救。"],["p","你會信嗎？"],["p","而且他說的那一樣，聽起來常常很屬靈，很合理，甚至很有保障。"],["p","加拉太的弟兄姊妹，就碰到了這一題。"],["p","今天這一章，保羅替他們回答。"],["p","他的答案很短，也很重。"],["q","「但無論是我們，是天上來的使者，若傳福音給你們，與我們所傳給你們的不同，他就應當被咒詛。」（1:8）"],["p","連天使也不必信。連保羅自己改了口，也不必信。"],["p","為甚麼保羅說得這麼重？今天我們就沿著這一章，走三步去看。"],["p","先聽這封信是怎麼開頭的。"],["q","「作使徒的保羅（不是由於人，也不是藉著人，乃是藉著耶穌基督，與叫他從死裡復活的父神）」（1:1）"],["p","第一句話還沒說完，保羅就插進了一個括號。"],["p","不是由於人，也不是藉著人。"],["p","保羅說：我站在這裡，不是哪一群人發給我的委任狀，也不是哪一位前輩轉手給我的。"],["p","為甚麼一開口就要講這個？"],["p","因為在加拉太，有人正在說：保羅不過是個二手的傳道人。"],["p","所以這個括號，不是自誇。這個括號，就是全卷的第一個論點。"],["p","然後是問安。保羅在祝福裡，塞進了整個福音。"],["q","「基督照我們父神的旨意，為我們的罪捨己，要救我們脫離這罪惡的世代。」（1:4）"],["p","請你留意，這是全卷第一次講到基督是誰。"],["p","他說：基督，就是那一位把自己給出去的。"],["p","捨己，是基督的事。不是我們補上的。"],["p","在保羅要加拉太人做任何事以前，他先說，基督已經做了甚麼。"],["p","接著第五節："],["q","「但願榮耀歸於神，直到永永遠遠。阿們！」（1:5）"],["p","保羅還沒有開始責備，先把榮耀歸給神。"],["p","這一聲阿們，是他提筆以前，替自己下的錨。"],["p","然後，你會聽見一件很不尋常的事。"],["p","保羅寫給教會的信，問安之後，幾乎都有一段感恩。"],["p","加拉太書沒有。"],["p","問安一完，第六節第一個字就是："],["q","我希奇。"],["p","這是保羅寫給教會的書信裡，唯一沒有感恩段的一封。"],["p","不是他不愛他們。是他急了。"],["p","一個父親看見孩子站在懸崖邊，是不會先說客套話的。"],["q","第一步：加一樣，就不是福音。"],["q","「我希奇你們這麼快離開那藉著基督之恩召你們的，去從別的福音。」（1:6）"],["p","「離開」這個字，原文是現在式。意思是：你們正在轉移，正在換陣營。"],["p","請你也留意，保羅沒有說，你們離開了一套道理。"],["p","他說，你們離開了那一位，那藉著基督之恩召你們的。"],["p","離開福音，從來不只是換一個想法。是轉身離開一個人。"],["p","還有「這麼快」。"],["p","福音不是被一場逼迫奪走的。"],["p","是被一個看起來更完整、更有保障的版本，悄悄換掉的。"],["p","那麼，加拉太人遇到了甚麼？"],["p","保羅離開以後，有一批人來到這些外邦人的教會。"],["p","他們也信耶穌。他們講十字架，也許講得很熱心。"],["p","可是他們說：外邦人信了耶穌還不夠，還要受割禮，守律法，才算真的進了亞伯拉罕的家。"],["p","我要說清楚，這是他們的主張，不是保羅的。"],["p","保羅對這套主張，只下了一句評語："],["q","「那並不是福音，不過有些人攪擾你們，要把基督的福音更改了。」（1:7）"],["p","我希望你聽見這一點。他們沒有拿掉基督。"],["p","他們只是在基督後面，加了一個字。"],["q","一個「和」字。"],["p","基督，和割禮。基督，和節期。基督，和我們這一套。"],["p","「更改」這個字，原文是扭轉、顛倒。"],["p","為甚麼加一點點，就顛倒了？"],["p","因為一旦得救需要「基督再加上一樣」，那一樣就成了真正的門檻。"],["p","人會去守那一扇門，會用那一扇門，判斷誰在裡面，誰在外面。"],["p","基督就從終點，變成了排隊的起點。"],["p","弟兄姊妹，今天還有人在講割禮嗎？很少。"],["p","可是那個「和」字，一直都在。"],["p","信耶穌，和我們的宗派。信耶穌，和我們的語言。"],["p","這些東西本身未必有錯。"],["p","錯在它們被放到基督旁邊，成了「這樣才算數」的條件。"],["p","哥林多後書講義第十一章講過同一種危險，那裡有人「另傳一個耶穌」。"],["q","名目不同，結構一樣：耶穌，再加上我們認可的東西。"],["p","現在我們回到開頭那一節最重的話。"],["p","保羅說了兩次：他就應當被咒詛。"],["q","「我們已經說了，現在又說，若有人傳福音給你們，與你們所領受的不同，他就應當被咒詛。」（1:9）"],["p","請你看第八節，保羅第一個放上檢驗台的是誰？"],["q","是「我們」。"],["p","他沒有說：凡不同意我的人，當被咒詛。"],["p","他說：就算是我自己改了口，也一樣。"],["q","準則高過傳的人。"],["p","加拉太人只要問一件事：傳的，是那一位為我們的罪捨己的基督，還是基督再加上別的？"],["p","還有，「咒詛」這個字，原文是 ἀνάθεμα。"],["p","保羅沒有叫加拉太人去懲罰誰，去趕走誰，去羞辱誰。"],["p","他把那人交在神的審判之下。審判的是神，不是教會的拳頭。"],["p","所以我要在講台上說一句很清楚的話。"],["q","這兩節，不可以拿來咒詛跟我們教義不同、宗派不同的弟兄姊妹。"],["p","受洗用點水還是浸水，聚會講不講方言，教會怎樣治理，唱詩用甚麼樂器。"],["p","這些是真實的差異，可是都不是保羅說的「別的福音」。"],["p","別的福音，是在基督之外，加上得救的條件。"],["p","如果我們拿這兩節去咒詛那些弟兄姊妹，我們就正好犯了攪擾者同樣的錯。"],["p","把我們自己的一套，加成了得救的條件。"],["p","站在這裡講道的我，要先問：我傳的福音，有沒有悄悄加了甚麼？"],["p","那保羅為甚麼說得這麼重？"],["p","一個醫生看見有人在全村的水井裡下毒，他說話不會溫和。"],["p","保羅重的不是脾氣，是愛。他寧可說最重的話，也不要他們喝下那口水。"],["p","然後第十節，他說出了自己的心。"],["q","「我現在是要得人的心呢？還是要得神的心呢？我豈是討人的喜歡嗎？若仍舊討人的喜歡，我就不是基督的僕人了。」（1:10）"],["p","一個說得出「應當被咒詛」的人，不可能是在討好誰。"],["p","「僕人」這個字，原文是奴僕。"],["p","奴僕只有一位主人。他的去留，他的是非，都由主人定。"],["p","保羅不是說「我不在乎人」。他是說：「我已經有一位主人了。」"],["p","弟兄姊妹，這一節對我們華人特別扎心。"],["p","我們很重面子，也很怕給別人難堪。"],["p","講台上不敢講罪。小組裡不敢說不同意。"],["p","分別在哪裡？叫鄰舍喜悅，是為了他得益處。討人喜歡，是為了我自己得認可。"],["q","前者是愛，後者是怕。"],["p","當「別人會怎麼看我」，成了我做決定的那一位主人，基督就被擠到第二位了。"],["p","你最近有沒有一句真話，因為怕丟面子，一直沒有說出口？"],["p","這也是另一種「和」字。基督，和別人的眼光。"],["p","講到這裡，你也許會問：保羅，你憑甚麼這麼肯定？"],["p","保羅接下來，就要回答這一題。他回答的方法，是講自己的故事。"],["q","第二步：不是出於人。"],["q","「弟兄們，我告訴你們，我素來所傳的福音不是出於人的意思。」（1:11）"],["q","「因為我不是從人領受的，也不是人教導我的，乃是從耶穌基督啟示來的。」（1:12）"],["p","保羅不是也從教會聽過耶穌的事嗎？"],["p","當然聽過。他就是因為聽見了，才去逼迫的。"],["p","可是那一位被釘在木頭上的人，就是神的兒子。這一件事，沒有人說服得了他。"],["p","是神親自打開的。"],["q","資訊可以傳授，啟示只能領受。"],["p","那他從前是甚麼樣的人？"],["q","「你們聽見我從前在猶太教中所行的事，怎樣極力逼迫殘害神的教會。」（1:13）"],["p","「逼迫」「殘害」這兩個字，原文都是未完成式。"],["p","那不是一次失手，是一種生活。一直在追，一直要毀掉它。"],["p","「殘害」這個字，古人常用來寫軍隊洗劫一座城。"],["p","保羅說，我當年洗劫的，是神的教會。"],["q","「我又在猶太教中，比我本國許多同歲的人更有長進，為我祖宗的遺傳更加熱心。」（1:14）"],["p","他是同一輩裡最出色的那一個。"],["p","他很熱心。熱心到拿刀對著神的教會。"],["p","從人的角度看，他是最不可能接受這個福音的人。"],["p","所以他的福音，只能另有來源。"],["p","那些來到加拉太的教師，也很熱心。熱心要外邦人守割禮，守律法。"],["p","保羅好像在說：這種熱心，我太熟悉了。我曾經是裡面最好的一個。"],["q","熱心本身，不能證明方向是對的。"],["p","我也要說清楚，保羅不是在貶低猶太人。他到老都說自己是猶太人。"],["p","他否定的，是他自己從前那一種，要把不一樣的人除掉的熱心。"],["p","然後，經文轉了一個彎。只有兩個字："],["q","然而。"],["q","「然而，那把我從母腹裡分別出來、又施恩召我的神，既然樂意將他兒子啟示在我心裡，叫我把他傳在外邦人中」（1:15–16）"],["p","請你看這一個長句，主詞是誰？"],["p","是神。分別出來，是神；施恩召，是神；樂意，是神；啟示，也是神。"],["p","保羅自己的動詞，要到最後才出現。"],["p","他的一生，從前全是他自己的動詞：逼迫，殘害，長進，熱心。"],["p","現在，全換成了神的動詞。"],["p","「從母腹裡分別出來」，這使我們想起耶利米，神說，你未出母胎，我已分別你為聖。"],["p","保羅在母腹裡，還沒有受割禮，神就已經把他分別出來了。"],["p","連使徒的呼召，都在任何記號、任何功課之前。"],["p","那麼加拉太的外邦人得救，還需要甚麼「再加上」呢？"],["p","再聽這一章的題目，就藏在這一句裡："],["q","將他兒子啟示在我心裡。"],["p","保羅在大馬士革路上得著的，不是一份更正確的教義表。"],["p","他得著的，是一個人。"],["p","使徒行傳講義第九章講過那一天。光從天上照下來，他仆倒在地，問了一句："],["q","「主啊！你是誰？」（徒 9:5）"],["p","這就是福音。福音不是一套說法，是一位兒子。"],["p","弟兄姊妹，你的信仰，是從教會繼承下來的一套說法，還是你親自被這一位遇見過？"],["p","傳承很寶貴。可是沒有被啟示過的傳承，很容易變成攪擾者那樣的規矩。"],["p","被那一位兒子遇見過的人，才知道福音不能再加甚麼。"],["q","「我就沒有與屬血氣的人商量，也沒有上耶路撒冷去見那些比我先作使徒的，惟獨往阿拉伯去，後又回到大馬士革。」（1:16–17）"],["p","這不是傲慢，不是不聽勸。"],["p","是這件事的源頭，不能由人來批准。"],["p","可是呼召的根，要扎在神親自的啟示裡。不然，風一吹就倒。"],["p","然後他往阿拉伯去了。這一段，使徒行傳沒有記。"],["p","我們只知道，那是一段不在台上、沒有人看見的日子。"],["p","如果你現在正在這樣一段日子裡，請你不要以為那是浪費。"],["p","神把兒子啟示在一個人心裡，那個人會變成甚麼樣子？"],["p","這一章最後幾節，給了我們一個答案。答案不在保羅身上，在別人的口裡。"],["q","第三步：一個被改變的人。"],["q","「過了三年，才上耶路撒冷去見磯法，和他同住了十五天。」（1:18）"],["p","「去見」這個字，原文在新約只出現這一次，是去拜訪、去認識一個人。"],["p","他去認識彼得，當然也聽彼得講耶穌的事。"],["p","可是他不是去領受福音，不是去拿授權。"],["p","保羅沒有反耶路撒冷，也沒有看不起彼得。"],["p","他珍惜這一份相交，只是不讓相交變成授權。"],["p","然後第二十節，他在一段平淡的年表裡，忽然起誓："],["q","「我寫給你們的不是謊話，這是我在神面前說的。」（1:20）"],["p","可見有人在流傳另一個版本的故事，說他是耶路撒冷的學生，後來偏離了老師。"],["p","保羅怎麼回應？他沒有把自己的故事講大，他把細節講準。"],["p","在神面前說話，不加油，也不添醋。"],["p","再往下，他去了敘利亞和基利家。猶太的教會，一直沒有見過他的面。"],["p","請你想像那個畫面。"],["q","猶太地一間小小的家庭教會，晚上，幾盞油燈。"],["q","有人從北邊來，帶來一個消息。"],["p","坐在那裡的，也許有一位姊妹，她的丈夫當年被掃羅抓走。"],["p","然後他們聽見了這一句話："],["q","「那從前逼迫我們的，現在傳揚他原先所殘害的真道。」（1:23）"],["p","原文那個「逼迫我們的」，好像一個外號。外號還在，裡面的人已經全變了。"],["p","從前他洗劫的，現在他傳揚。"],["p","那一屋子的人，聽完了，做了甚麼？"],["q","「他們就為我的緣故，歸榮耀給神。」（1:24）"],["p","請你聽清楚，他們沒有說：「保羅真了不起。」"],["p","他們把榮耀歸給神。"],["q","一個被改變的人，叫人看見的不是他，是那一位改變他的神。"],["p","「為我的緣故」，原文跟第十六節是同一個片語，「在我」。"],["p","神把兒子啟示在我裡面；眾教會就在我身上，把榮耀歸給神。"],["p","弟兄姊妹，這也給今天的我們一點安慰。"],["p","有人會問：我從前做過那樣的事，傷過那樣的人，我還配事奉嗎？"],["p","保羅的過去，沒有被藏起來，也沒有被美化。"],["p","它被放在恩典旁邊，正好顯出恩典有多大。"],["p","我們不必急著證明自己，只要讓神繼續在我們身上做工，讓人慢慢看見。"],["p","現在，我們回到開頭那一題。"],["p","讀完這一章，我們可以回答了。"],["p","不必信。不是因為我們比天使強，是因為那一位，已經夠了。"],["p","請你再聽一次，這封信裡第一次講到基督的那一句："],["q","為我們的罪捨己。"],["p","他給得完全，所以不需要我們再補上甚麼。"],["p","這一位捨己的基督，就是神樂意啟示在保羅心裡的那一位兒子。"],["p","今天，我們只要記得：福音不是基督和甚麼。福音就是基督。"],["q","加一樣，就不是福音。少不了他，也不必再加。"],["p","我們國度321空中團契常說，不再是我，乃是基督。是那一位愛我、為我捨己的基督。"],["p","這一句話，在加拉太書第一章，已經有了最早的樣子。"],["p","不是保羅努力把自己藏起來，是神的兒子在他裡面，太亮了。"],["p","所以人看見的，是神。"],["p","這個禮拜，我想請你做兩件小事。"],["p","第一件，問自己：我信耶穌，心裡有沒有加了一個「和」字？有的話，寫下來，交給主，對祂說：你已經夠了。"],["p","第二件，想一句你因為怕丟面子，一直沒有說出口的真話。"],["p","用愛心，用溫柔，找一個合適的時候，說出來。"],["p","讓人在你身上，看見的不是你，是神。"],["p","我們一起低頭禱告。"]]},"2":{"min":17,"blocks":[["h","《現在活著的不再是我，乃是基督在我裡面活著》"],["p","弟兄姊妹平安，今天我們一起讀加拉太書第二章。"],["p","今天我想請你和我一起，停在一個畫面上。不要急著往下翻，慢慢看。"],["q","安提阿，一間信徒的家，傍晚。"],["q","一張長長的桌子。桌上有餅，有一鍋燉菜，有幾個陶碗。"],["p","坐在桌邊的，有猶太人，也有外邦人。"],["p","有人從小守潔淨的條例長大，有人幾年前還在拜偶像。"],["p","桌子當中，坐著一位大家都認得的人：磯法，就是彼得。"],["p","現在，請你把畫面定住。"],["q","彼得剛剛放下碗筷。他站起來了。"],["p","他沒有說話。他端起自己的碗，往屋子另一頭走。"],["p","那一頭，另擺了一張桌子。"],["p","門口剛進來幾個人，是從耶路撒冷來的。"],["p","再看彼得旁邊。有一個人，手撐在桌上，身子也離開了板凳。"],["q","那是巴拿巴。他也站起來了。"],["p","再看留在原位的人。"],["p","一位外邦弟兄，手上還拿著半塊餅，看著彼得的背影。"],["p","沒有人罵他。可是他心裡很清楚，剛才那一刻發生了甚麼事。"],["p","最後，看屋子的角落。有一個人沒有動，臉色很難看。那是保羅。"],["q","這一格畫面裡，沒有人講一句道理。可是桌子已經在講道了。"],["p","保羅後來把這一幕寫進了信裡。"],["q","「從雅各那裡來的人未到以先，他和外邦人一同吃飯，及至他們來到，他因怕奉割禮的人，就退去與外邦人隔開了。」（2:12）"],["q","「其餘的猶太人也都隨著他裝假，甚至連巴拿巴也隨夥裝假。」（2:13）"],["p","整卷加拉太書最低的一點，就在這裡。"],["p","最高的一點，也在這一章，只隔了七節。"],["p","那一節，我們很熟，很多人掛在牆上。"],["p","可是今天我想請你看見，它不是在安靜的書房裡寫的。"],["p","它是從這一張分開的桌子旁邊，長出來的。"],["p","今天我們走三步：一張分開的桌子，不是因行律法，不再是我。"],["p","要看懂安提阿，得先往回看幾年。"],["q","「過了十四年，我同巴拿巴又上耶路撒冷去，並帶著提多同去。」（2:1）"],["p","巴拿巴是猶太人，提多是希臘人，沒有受割禮。"],["p","這一行人本身，就是一張小小的餐桌。"],["p","耶路撒冷沒有勉強提多受割禮。"],["p","可是有「偷著引進來的假弟兄」在施壓。"],["p","要外邦人受割禮才算數，是這些人的主張，不是保羅的。"],["p","他們沒有否認耶穌，只是在耶穌後面加了一個「和」字。"],["q","「我們就是一刻的工夫也沒有容讓順服他們」（2:5）"],["p","請你記住這一句。等一下講到「不再是我」，我們會回來找它。"],["p","然後，三位柱石向保羅和巴拿巴「用右手行相交之禮」。"],["p","工場分開了，福音沒有分開。分工，不是分家。"],["p","握手之後只有一個請求：要記念窮人。"],["p","保羅說，這是他本來就熱心去做的。"],["p","因信稱義的福音，從來不叫人不管窮人。"],["p","請你記住這一隻右手。因為下一個畫面，就是安提阿。"],["q","第一步：一張分開的桌子。"],["q","「後來，磯法到了安提阿；因他有可責之處，我就當面抵擋他。」（2:11）"],["p","「他和外邦人一同吃飯」，這個動詞原文是未完成式。"],["p","不是吃過一次，是一向如此。一餐又一餐，一個禮拜又一個禮拜。"],["p","彼得在哥尼流家學過這一課：神叫他不可把任何人看作俗而不潔淨。"],["p","他學會了，也活出來了。"],["p","然後，門口來了人。"],["p","請你留意，彼得沒有上台宣布新的神學。"],["p","他沒有說外邦人不潔淨，也沒有說割禮是得救的條件。"],["p","他的道理一個字都沒有改。他只是換了一張桌子。"],["p","「退去」原文也是未完成式，可以讀成「漸漸退去」。"],["p","先少來一次，再坐到桌子另一頭，最後就固定在另一張桌子了。"],["q","很多分開，都不是一聲巨響，是一步一步的退。"],["p","彼得為甚麼退？經文說得很直接：「因怕」。"],["p","不是怕挨打，是怕失去在那個圈子裡的位置。"],["p","怕被人說：你就是那個跟外邦人混在一起的人。"],["p","我們華人對這件事很熟。這叫面子。"],["q","有己的另一面，常常不是張狂，是怕。"],["p","「裝假」，原文的字根，是古代戲台上戴面具的演員。"],["p","彼得心裡知道外邦人是潔淨的，臉上卻演出另一套。"],["q","裝假不是信錯了，是活得和自己信的不一樣。"],["p","而且這是一場群戲。一個領袖換一張桌子，一群人就跟著換。"],["p","然後是全卷最叫人心痛的三個字：「甚至連」。甚至連巴拿巴。"],["p","使徒行傳說他「是個好人，被聖靈充滿，大有信心」（徒 11:24）。"],["p","幾年前，和保羅一起接過那隻右手的，也是他。"],["p","「隨夥裝假」，原文是被動的，「被一起帶走」，像被一股水流沖走。"],["p","好人，也會被沖走。這是這一節要我們謙卑的地方。"],["p","弟兄姊妹，你有沒有這樣慢慢退出一張桌子的經驗？"],["p","一個你從前常坐在一起的人，因為別人怎麼看，你不太坐過去了。"],["p","沒有吵架，也沒有說破。只是換了位子。"],["p","那一位拿著半塊餅的外邦弟兄，看懂了：原來我們還不夠格。"],["q","分桌的訊息不需要講出來，桌子本身就在講道。"],["q","「但我一看見他們行的不正，與福音的真理不合，就在眾人面前對磯法說」（2:14）"],["p","「行的不正」，原文字面是「腳走得不直」。"],["p","福音的真理，不只是紙上的道理，也是一條要用腳走的路。"],["p","彼得的道理還是直的，他的腳歪了。"],["q","一張分開的桌子，不是禮節的問題，是福音的問題。"],["q","「你既是猶太人，若隨外邦人行事，不隨猶太人行事，怎麼還勉強外邦人隨猶太人呢？」（2:14）"],["p","耶路撒冷沒有勉強提多。"],["p","安提阿的彼得，卻用一張桌子在勉強外邦人。"],["p","「當面抵擋」，原文就是「當著他的臉」。"],["p","彼得在看來客的臉色。"],["p","保羅不看彼得的臉色，他當著那張臉說話，不在背後傳話。"],["p","領袖怎樣公開指正領袖，分寸在哪裡，講義的議題頁整理過，這裡不展開。"],["p","我只想請你看見：跌倒的人，沒有被丟掉。"],["p","後來在耶路撒冷，同一位彼得站起來說："],["q","「我們得救乃是因主耶穌的恩，和他們一樣，這是我們所信的」（徒 15:11）"],["p","「和他們一樣」。彼得回到那一張桌子了。"],["p","弟兄姊妹，今天華人教會也有自己的桌子。國語堂、粵語堂、英語堂。"],["p","語言分堂，可以是為了福音的方便。"],["p","讓阿嬤聽得懂，讓孩子聽得懂，這是愛。"],["p","可是如果幾個堂從來不一起吃飯，不一起禱告，提到對方，語氣裡帶著「他們那邊的」，"],["q","那就不再是分堂了，那是分桌。是彼得那一張分開的桌子。"],["p","合一不是大家都一樣。可是合一，一定要落在桌上。"],["p","保羅在眾人面前問完那一句，話沒有停。"],["p","他從一張桌子，一下子講到最深的地方。"],["q","第二步：不是因行律法。"],["p","「我們這生來的猶太人，不是外邦的罪人」——保羅把自己和彼得放在一起。"],["p","他沒有否認自己是猶太人。加拉太書不是一本反猶太的書。"],["q","「既知道人稱義不是因行律法，乃是因信耶穌基督，連我們也信了基督耶穌」（2:16）"],["p","請你聽那三個字：連我們。"],["p","連有律法、受了割禮的我們，也得和外邦人一樣，空著手來到基督面前。"],["p","那麼請問：猶太人也是因信稱義，外邦人又何必先變成猶太人？"],["q","餐桌的問題，根子是福音的問題。"],["p","「稱義」是法庭的字，原文一直是被動的。宣告的是神，不是我們自己。"],["q","「因為凡有血氣的，沒有一人因行律法稱義。」（2:16）"],["p","坐這張桌子的和那張桌子的，在神的法庭上，沒有人帶著自己的成績單進去。"],["p","「律法的行為」指甚麼，傳統的讀法和保羅新觀各有強調；講義的議題頁有整理。"],["p","本講義站在宗教改革的底線：稱義是神白白的恩典，單單因信。"],["p","也接受新觀的提醒：在加拉太，因信稱義的第一個結果，是猶太人和外邦人可以一起吃飯。"],["p","今天這兩種「律法的行為」都還在。"],["p","一種說：你要做到這些，神才喜悅你。一種說：你要像我們，才算自己人。"],["q","兩種都是在耶穌後面加了一個「和」字。"],["p","兩種都不是福音。"],["p","「信耶穌基督」，原文也可以讀成「耶穌基督的信實」。我們照和合本讀，"],["p","可是另一個讀法留下一個安慰：我們能信，是因為他先信實。"],["p","攪擾的人反駁說：你們放下律法，和外邦人同桌，不就成了「罪人」嗎？"],["p","那是他們的推論。保羅只回一句：「斷乎不是！」然後他說："],["q","「我素來所拆毀的，若重新建造，這就證明自己是犯罪的人。」（2:18）"],["p","福音拆掉了一道把猶太人和外邦人隔開的牆。"],["p","彼得端著碗走到另一張桌子，就是一塊一塊，把那道牆砌回去。"],["p","這裡我要放一道護欄。「不是因行律法」，不等於「行為不重要」。"],["p","記念窮人重要，怎樣待人重要。"],["p","我們不是靠這些得救，是得救了，才活出這些。"],["p","另一邊也一樣：新的規條，不管多屬靈，都不可以變成進門的條件。"],["p","保羅這一段話，是怎樣收尾的？"],["p","我們先跳過大家最熟的那一節，看最後一句。"],["q","第三步：不再是我。"],["q","「我不廢掉神的恩；義若是藉著律法得的，基督就是徒然死了。」（2:21）"],["p","「徒然」，原文 δωρεὰν，平常的意思是「白白地」。"],["p","神的恩典是白白給的。可是在這裡，是另一面：白死了。"],["p","攪擾的人沒有拿掉十字架，只是在十字架後面加了一點點。"],["p","保羅說，加一點點，十字架就成了多餘的。"],["q","每一張分開的桌子，都在無聲地說：基督的死還不夠。"],["p","那麼，怎樣才醫得好一張分開的桌子？"],["p","保羅的答案，不是「彼得，你要更勇敢」。"],["q","「我因律法，就向律法死了，叫我可以向神活著。」（2:19）"],["p","「死了」，原文是一次過去的事。不是我正在努力死，是我已經死過了。"],["p","律法的判決，落在基督身上，也落在與他聯合的我身上。"],["p","一個死過的人，不再怕那些眼光，因為判決已經執行過了。"],["p","彼得退回去，是因為他還怕。保羅說：我向那些眼光，已經死了。"],["p","而死的目的，是活：「叫我可以向神活著」。"],["p","同樣禱告，同樣讀經，可以是兩種生命。"],["p","一種在交成績單，一種在回應愛。"],["p","然後，才是這一節。我們一個字都不省，整句讀。"],["q","「我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信神的兒子而活；他是愛我，為我捨己。」（2:20）"],["p","先看第一個字。"],["q","συνεσταύρωμαι。"],["p","這個動詞是完成式，又是被動。"],["p","完成式是：已經被釘了，到今天仍然是。"],["p","被動是：是被釘的，不是自己釘的。"],["p","很多人把這一節聽成一份每天的功課：我每天要努力把自己釘死，今天又沒有釘好。"],["p","於是無己變成了另一種行律法，另一張成績單。"],["q","不是我每天把自己再釘一次。是我每天承認，我已經在那裡了。"],["p","這是神作的事。你今天早上醒來，它就已經是真的了。"],["p","再看下一句。保羅沒有說「我不再活」，他說「活著的不再是我」。"],["p","活還在，生命的主人換了。"],["p","緊接著他又說：「我如今在肉身活著」。"],["p","保羅還在。他仍然吃飯，走路，生氣，流淚。"],["p","你數一數這一節裡有幾個「我」：我已經，我裡面，我如今，愛我，為我。"],["q","保羅沒有把「我」刪掉。他把「我」交給了愛他的那一位。"],["q","「他是愛我，為我捨己。」（2:20）"],["p","說這句話的，是一個曾經逼迫教會的人。神的兒子愛的，偏偏是他。"],["q","無己不是我消失了，是我被愛了。"],["p","講到這裡，我必須把幾扇門關上。"],["p","因為這幾個字，在教會裡傷過不少人。"],["p","「不再是我」，不等於我不重要。同一節說，神的兒子愛我，為我捨己。"],["p","「同釘」，不等於我每天要把自己釘死。剛才講過了，那是神作的。"],["p","「基督在我裡面活」，不等於我的想法就是基督的想法。"],["p","同一章，彼得被當面抵擋了。"],["p","最要緊的一扇：「無己」，不等於要忍受傷害，不可以說不。"],["p","寫這一節的人，對假弟兄「一刻的工夫也沒有容讓」，對大使徒彼得「當面抵擋」。"],["q","無己的人不是沒有骨頭，是骨頭換成了基督的。"],["p","如果有人一邊傷害你，一邊對你說：你要無己，你要忍，那不是加拉太書第二章。"],["p","說「不」，常常正是讓基督作王的一步。"],["p","如果你的處境有危險，請今天就告訴一個信得過的人。"],["p","現在，我們回到那一格畫面。彼得為甚麼站起來？因為「我」還活著。"],["p","一個人若要靠別人的眼光保住自己，就得不停地換桌子。"],["p","一個已經與基督同釘、被基督愛著的人，不需要靠換桌子保住自己。"],["p","他的價值，已經在十字架上定了。"],["q","所以他可以和任何人同坐。"],["p","桌子分開，因為有人活在別人的眼光裡；保羅抵擋，因為真理不能讓步；醫治分桌的，是釘。"],["p","到這裡，我們才可以說國度321空中團契那一句話："],["p","無己不再是我乃是基督，不是我自己活乃是基督在我裡面活。"],["p","它的根不在我們的口號裡，在那下半句：他是愛我，為我捨己。"],["q","無己，不是我努力變得沒有自己。是我被一位捨己的主愛到，不必再為自己活。"],["p","弟兄姊妹，最後一次看那一格畫面。"],["p","這一格，保羅沒有讓它停在那裡。"],["p","他在旁邊寫上了一行字：神的兒子，為我捨己。"],["p","為站起來的彼得，為被沖走的巴拿巴，為拿著半塊餅的那位外邦弟兄，也為保羅。"],["q","基督不是徒然死的。他的死，夠讓所有的人同坐一桌。"],["p","你不必更佩服保羅。你只要更認識這一位愛你、為你捨己的主。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，想一想你最近慢慢退出了哪一張桌子。"],["p","端著你的碗，坐回去一次。"],["p","第二件，早上醒來，不要對自己說：今天我要把自己釘死。"],["p","請你對主說：主啊，我已經與你同釘十字架了。"],["p","然後把那下半句也說出來：你是愛我，為我捨己。"],["p","我們一起低頭禱告。"]]},"3":{"min":18,"blocks":[["h","《基督既為我們受了咒詛》"],["p","弟兄姊妹平安，今天我們一起讀加拉太書第三章。"],["p","今天我想請你記住一個希臘字。只有一個。"],["q","προεγράφη。"],["p","和合本把它翻成兩個字：活畫。"],["p","可是保羅那個時代的人一聽見這個字，想到的不是一幅畫。"],["p","是城裡的告示。"],["p","城門口、市場邊的牆上，官府有事要全城知道，就寫出來，貼在那裡。"],["p","誰走過，誰都看得見。"],["p","保羅說，我在你們中間傳福音的時候，就是這樣做的。"],["q","「耶穌基督釘十字架，已經活畫在你們眼前」（3:1）"],["p","我把十字架，貼在你們全城的牆上。"],["p","加拉太人沒有一個到過各各他，沒有親眼看見耶穌被釘。可是保羅講道，講到他們好像就站在十字架前面。"],["p","請你想一想，你信主的那一天，你的牆上貼的是甚麼？"],["p","總有那麼一刻，你看見了，那位被釘的，是為你。"],["p","今天這一章要問的是：那張告示，還在牆上嗎？"],["p","我們沿著這一章走三步：畫，咒，師。"],["p","保羅離開以後，來了一批人。"],["p","他們沒有叫加拉太人不要信耶穌。他們很尊重耶穌。"],["p","他們只是說：信耶穌很好，再加上割禮，才算完全。"],["q","他們沒有拿掉基督，只是在基督後面，加了一個「和」字。"],["p","這個主張是他們的，不是保羅的。保羅整封信，就是在拆這個「和」字。"],["p","第二章他講了安提阿的那張餐桌。彼得退去，不和外邦人一起吃飯了。"],["p","然後，從那張餐桌，他說出了整封信的樞紐："],["q","「我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著；並且我如今在肉身活著，是因信神的兒子而活；他是愛我，為我捨己。」（2:20）"],["p","請你聽最後那半句：他是愛我，為我捨己。"],["q","第一步：畫。活畫在眼前。"],["q","「無知的加拉太人哪，耶穌基督釘十字架，已經活畫在你們眼前，誰又迷惑了你們呢？」（3:1）"],["p","第三章的第一句，不是一個論證，是一聲喊叫。"],["p","「無知」這個字，不是說他們笨。"],["p","原文的意思是：沒有用心去想。明明看過，怎麼會忘記？"],["p","再聽「迷惑」這個字。"],["p","它在當時的民間，指的是用邪眼看人。被看的人會中邪，失去判斷。"],["p","請你聽清楚，保羅不是說基督徒會中邪。"],["p","今天也有人怕犯沖，怕風水，怕被人下咒。這一節不是要我們更怕。"],["q","真正叫人失去判斷的，不是邪眼，是別的福音。"],["p","這方面的疑問，講義的議題頁有整理。"],["p","問題不是加拉太人沒看過，是有人讓他們把眼睛移開了。"],["p","眼睛一離開十字架，加上去的東西，就顯得很合理了。"],["p","這一句最後一個字，是「釘十字架」。"],["p","原文是完成式：被釘了，而且一直是那一位被釘的。"],["p","教會甚麼時候最容易被迷惑？"],["p","就是講台上甚麼都講，只是十字架不再在正中間的時候。"],["q","「我只要問你們這一件：你們受了聖靈，是因行律法呢？是因聽信福音呢？」（3:2）"],["p","加拉太人是外邦人。他們沒有受過割禮，也沒有守過摩西的律法。"],["p","可是他們受了聖靈。"],["p","那答案就很清楚了。聖靈不是賞給守律法的人，是賜給聽了、信了的人。"],["p","一個是做，一個是聽。"],["p","你得著神的那一天，是你做到了甚麼嗎？還是你聽見了，就信了？"],["q","「你們既靠聖靈入門，如今還靠肉身成全嗎？」（3:3）"],["p","攪擾他們的人說：信耶穌是開始，受割禮才是成熟。"],["p","今天我們不談割禮了。可是那個「和」字，還在。"],["p","信主是起步，說我們這一種語言，穿我們這一種衣服，才算自己人。"],["p","可是一旦說成「沒有這個，就不算」，那就是今天的割禮。"],["p","保羅的意思很簡單：用甚麼開始，就用甚麼走下去。"],["p","這不是說行為不重要。第五章會講聖靈結出來的果子。"],["p","只是果子是從聖靈長出來的，不是我們拿來換聖靈的。"],["p","講完加拉太人自己的經歷，保羅把他們帶到一個更早的晚上。"],["q","第二步：咒。成了咒詛。"],["q","「亞伯拉罕信神，這就算為他的義」（3:6）"],["p","攪擾的人手上有一張王牌，是創世記第十七章，割禮的約。"],["p","保羅沒有否認第十七章。他只是請大家往前翻兩章。"],["p","本系列創世記講義第十五章講過那一夜。"],["p","亞伯蘭年紀老了，沒有兒子。神領他到帳棚外面，叫他數天上的星。"],["q","「亞伯蘭信耶和華，耶和華就以此為他的義。」（創 15:6）"],["p","那一夜，他沒有受割禮，沒有律法，也還沒有獻以撒。"],["p","「算為」是一個記帳的字。神親手，把義記在他的帳上。"],["p","信不是一種功勞，信是伸出手，把神給的接過來。"],["q","「那以信為本的人，就是亞伯拉罕的子孫。」（3:7）"],["p","作亞伯拉罕的兒女，不看血統，不看身上的記號，看你是不是像他一樣信。"],["p","這不是說猶太人從此不算數。保羅自己就是生來的猶太人。"],["p","他要說的是：門只有一道，就是信。猶太人和外邦人，從同一道門進來。"],["q","「聖經既然預先看明，神要叫外邦人因信稱義，就早已傳福音給亞伯拉罕，說：『萬國都必因你得福。』」（3:8）"],["p","請你留意，應許是萬國在亞伯拉罕裡得福。"],["p","不是萬國先變成猶太人，才能得福。"],["p","外邦人不必換掉自己的民族，才能進神的家。"],["q","「可見那以信為本的人和有信心的亞伯拉罕一同得福。」（3:9）"],["p","不是坐在亞伯拉罕家的偏桌，是和他坐同一張桌子。"],["p","這就接回安提阿的那張餐桌。彼得一退，就把應許裡的「一同」拆開了。"],["p","可是「得福」才剛講完，保羅馬上說了全章最刺耳的一句。"],["q","「凡以行律法為本的，都是被咒詛的」（3:10）"],["p","他要加拉太人看清楚：你們想加上去的那條路，不是更高一層。"],["p","是走回咒詛的底下。"],["q","「凡不常照律法書上所記一切之事去行的，就被咒詛。」（3:10）"],["p","律法不是自助餐，不能挑幾道菜。選了割禮，就等於簽下整份合約。"],["p","律法像一面鏡子。它照得出臉上的污點，卻不能替你洗臉。"],["p","這一節怎樣讀，學者有爭論，議題頁有並陳。"],["p","今天的「行律法」，可能有兩張臉。"],["p","一張是數算自己：這個禮拜讀了幾章，禱告了多久，奉獻了多少。"],["p","一張是擋住別人：我們這一堂，我們這一派，我們這一種講法。"],["p","兩張臉，都是在耶穌後面，加一個「和」字。"],["q","「沒有一個人靠著律法在神面前稱義，這是明顯的；因為經上說：『義人必因信得生。』」（3:11）"],["p","信靠神的人說：我接受。靠律法的人說：我做到。"],["p","這也不是叫人輕看行為。因信得生命的人，生命一定會長出順服來。"],["p","只是次序不能倒過來：先領受生命，再在生命裡順服。"],["p","講到這裡，整個房間好像都暗下來了。"],["p","律法的判決是真的。一個字也沒有作廢。"],["p","然後，第十三節，沒有任何連接詞，突然出現一個名字。"],["q","「基督既為我們受了咒詛，就贖出我們脫離律法的咒詛；因為經上記著：『凡掛在木頭上都是被咒詛的。』」（3:13）"],["p","請你看和合本這一節的小字註腳。"],["p","「受了咒詛」，原文是「成了」咒詛。"],["p","保羅不只說基督被咒詛。他說基督成了咒詛本身。"],["q","咒詛沒有被一筆勾銷，是被他擔下了。"],["p","本系列哥林多後書講義第五章，講過另一句一樣驚人的話。"],["q","「神使那無罪的，替我們成為罪」（林後 5:21）"],["p","成為罪，成了咒詛。都不是說他變成了罪人。"],["p","是說他站進了罪和咒詛的位置，替我們承受。"],["p","神學上怎樣理解，議題頁有並陳。保羅只用兩個字：替我們。"],["p","再看「贖出」這個字。"],["p","它是從奴隸市場來的。一個人被賣了，要有人付價，把他領出來。"],["p","加拉太人想走回律法底下，就像被贖出來的人，又自己走回市場。"],["p","你有沒有這樣過？明明被贖出來了，還常常回到那個攤位前面站著。"],["p","掛在木頭上，原是福音最大的絆腳石。保羅卻說：正因為這樣，他才擔得起那份咒詛。"],["p","然後第十四節，說出十字架的兩個目的。"],["q","「這便叫亞伯拉罕的福，因基督耶穌可以臨到外邦人，使我們因信得著所應許的聖靈。」（3:14）"],["p","第八節那個應許，萬國都必因你得福，是經過十字架才兌現的。"],["p","應許的終點，也不是一塊地，不是一個民族的特權。"],["p","是神自己的靈，住進人的裡面。"],["p","這一段若講得只剩「我得救了」，就講少了一半。"],["q","被同一個十字架贖出來的人，不能再坐兩張桌子。"],["p","講到這裡，保羅換了一個稱呼。"],["p","前面他叫他們「無知的加拉太人」。現在他說：弟兄們。"],["q","第三步：師。帶路的師傅。"],["q","「弟兄們，我且照著人的常話說：雖然是人的文約，若已經立定了，就沒有能廢棄或加增的。」（3:15）"],["p","「文約」這個字，在當時的日常生活裡，就是遺囑。"],["p","一份遺囑立好了，生效了，旁人不能作廢，也不能在後面加條款。"],["p","攪擾的人沒有說應許作廢。他們做的，正是在後面加一條：還要受割禮。"],["q","「神並不是說『眾子孫』，指著許多人，乃是說『你那一個子孫』，指著一個人，就是基督。」（3:16）"],["p","這個讀法學者有不同的看法，議題頁有整理。講台上，我們只抓住一件事。"],["p","你問：我夠不夠資格承受神的應許？"],["p","答案只有一個：你是不是在基督裡。"],["q","「但神是憑著應許把產業賜給亞伯拉罕。」（3:18）"],["p","很多人口裡說得救本乎恩，心裡卻覺得，要做得夠好，神才會繼續愛我。"],["p","禮物送出去了，不會因為後來多了一張清單，就變成了貸款。"],["q","「這樣說來，律法是為甚麼有的呢？」（3:19）"],["p","保羅說，律法是「為過犯添上的」。"],["p","沒有限速牌的時候，超速只是開得快。有了牌子，超速就是違規。"],["p","律法不製造罪。它把罪照出來，叫人不能再說：我沒有問題。"],["p","而且律法有期限：「等候那蒙應許的子孫來到」。"],["q","「但聖經把眾人都圈在罪裡，使所應許的福因信耶穌基督，歸給那信的人。」（3:22）"],["p","神把所有人關在同一個地方，是為了用同一把鑰匙，放所有的人出來。"],["p","那把鑰匙是信。可是請你記得：我們能信，是因為他先信實。"],["p","他走完了順服的路，一直走到十字架。焦點在他，不在你的信心夠不夠用力。"],["q","「律法是我們訓蒙的師傅，引我們到基督那裡，使我們因信稱義。」（3:24）"],["p","「訓蒙的師傅」，原文是 παιδαγωγός。"],["p","這個人，不是老師。"],["p","在那個時代有錢人的家裡，他是一個家奴。"],["p","每天早上，牽著主人家孩子的手，提著書包，送他走到學堂門口。"],["p","可是他不是孩子的父親。家業也不是從他手上來的。"],["p","等孩子長大了，他的工作就做完了。"],["q","他的工作，是把孩子送到。"],["p","所以這一節要避開兩個誤用。"],["p","一個是把律法講成壞人，好像舊約的神很兇，新約的神才溫柔。"],["p","那位家奴是父親派來的。看管本身，也是愛。"],["p","另一個是以為，不在師傅手下，就是沒有規矩了。"],["p","長大的兒子不再需要人牽著過馬路，不是因為馬路變安全了。"],["p","是因為他裡面有了判斷。第五章會說，那是聖靈的引導。"],["q","「但這因信得救的理既然來到，我們從此就不在師傅的手下了。」（3:25）"],["p","我認識一些弟兄姊妹，信主很多年了，還活得像那個被牽著手的孩子。"],["p","保羅輕輕地對你說：你已經過了那個年紀了。"],["q","師傅把你帶到的地方，是父親的家。"],["q","「所以，你們因信基督耶穌都是神的兒子。」（3:26）"],["p","不是更守規矩的學生，是兒女。"],["q","「你們受洗歸入基督的都是披戴基督了。」（3:27）"],["p","攪擾的人要的記號是割禮。刻在身上，而且只有男人能受。"],["p","保羅指著的記號是洗禮。猶太人、外邦人，男的、女的，都一樣受。"],["p","然後，是這一章的山頂。"],["q","「並不分猶太人、希臘人，自主的、為奴的，或男或女，因為你們在基督耶穌裡都成為一了。」（3:28）"],["p","這三組，正是那個時代最深的三道牆。"],["p","猶太人不和外邦人同桌。主人不和奴僕平起平坐。男人站在女人前面。"],["p","保羅說，在基督裡，這三道牆，不再決定誰屬於神，誰可以坐上桌子。"],["p","「成為一」的「一」，原文是陽性的。不是一樣東西，是一個人。"],["q","可是請你聽清楚：合一，不是一樣。"],["p","保羅沒有說，猶太人要變成希臘人，女人要變成男人。"],["p","披戴基督，是同一件衣服，穿在不同的身體上。"],["p","高的、矮的，男的、女的，說閩南語的、說英語的、說馬來語的。"],["p","衣服沒有把身體換掉。可是人一看，認出來的是那件衣服。"],["p","所以這一節，不能拿來抹平一切差異，叫人否定自己的文化和身分。"],["p","也不能反過來，拿差異替排斥找理由：我們這一堂比較屬靈，他們那一族比較難帶。"],["p","語言分堂，可以是為了福音的方便。"],["p","但分堂，不可以變成彼得那一張分開的桌子。"],["p","「或男或女」，今天在教會裡有不少討論。"],["p","有弟兄姊妹認為，這裡講的是救恩上的平等，不取消家庭和教會裡的分工。"],["p","也有弟兄姊妹認為，這是保羅的原則，男女都可以擔任一切的職分。"],["p","兩邊都是敬重聖經的弟兄姊妹。講義兩邊並陳，不替各教會做決定。"],["p","可是兩邊都必須同意一件事："],["q","3:28 之後，任何貶低、輕看女性的講法，都違背福音。"],["q","「你們既屬乎基督，就是亞伯拉罕的後裔，是照著應許承受產業的了。」（3:29）"],["p","一個子孫是基督。屬基督的人，就在那一個子孫裡面。"],["p","外邦人不必先變成猶太人，才能作亞伯拉罕的後裔。"],["p","可是這一節，絕不能講成教會取代了以色列，神不要猶太人了。"],["q","「神棄絕了他的百姓嗎？斷乎沒有！」（羅 11:1）"],["p","第二十九節說的，是外邦人被接進來，不是猶太人被趕出去。"],["p","弟兄姊妹，我們回到開頭那個字。"],["q","προεγράφη。"],["p","城牆上的告示。"],["p","可是今天讀完第三章，我們才發現，那張告示上寫的，不是一條規定。"],["p","不是：你要做到這些，才可以進來。"],["p","告示上，是一個被掛在木頭上的人。"],["p","律法那一句「凡掛在木頭上都是被咒詛的」，最後落在他一個人身上。"],["p","所以亞伯拉罕的福，才能臨到外邦人，臨到你，臨到我。"],["p","所以那個帶路的家奴，才能把我們一路送到父親的家門口。"],["p","所以猶太人、希臘人，為奴的、自主的，男的、女的，才能坐上同一張桌子。"],["q","他是愛我，為我捨己。"],["p","這就是我們團契那一句話的根。"],["p","不是我自己活，乃是基督在我裡面活。可是先有他為我捨己，才有他在我裡面活。"],["p","你今天不必更佩服保羅。你只要把眼睛，再放回那一張告示上。"],["p","這個禮拜，我想請你做兩件很小的事。"],["p","第一件，問自己一個問題：我的信仰裡，在耶穌後面，有沒有偷偷加了一個「和」字？"],["p","找到了，就在主面前，把那個「和」字擦掉。"],["p","第二件，這個禮拜，找一個和你不一樣的弟兄姊妹，一起吃一頓飯。"],["p","因為被同一個十字架贖出來的人，坐的是同一張桌子。"],["p","我們一起低頭禱告。"]]},"4":{"min":18,"blocks":[["h","《你不是奴僕，乃是兒子了》"],["p","弟兄姊妹平安，今天我們一起讀加拉太書第四章。"],["p","今天開頭，我想借一個人的口說話。"],["p","經文沒有留下他的名字。他是加拉太教會裡一個普通的外邦信徒，信主兩年。"],["p","那一天聚會完，有人很熱心地拉住他，說："],["q","「你信耶穌很好。可是你沒有受割禮，你還不算真正的亞伯拉罕子孫。」"],["p","那一晚，他睡不著。下面這幾句，是我替他說的。"],["q","我是在路司得信主的。那時候，進城的是一個病人，身體不好，說話也不好聽。"],["q","照我們的習慣，看見這樣的人，是要吐一口唾沫，轉身走開的。"],["q","可是他講的那一位，被掛在木頭上的耶穌，抓住了我。我把家裡的神像搬了出去。"],["q","兩年了。我以為我已經在家裡了。今天他們說，我還在門外。"],["q","我到底是這家的兒子，還是一個還在試用期的僕人？"],["p","這段獨白是我替他說的，經文裡沒有。"],["p","可是加拉太書第四章，就是保羅寫給這樣一個人的回信。"],["p","也許，也是寫給你的。"],["p","有沒有人，或者你自己心裡那個聲音，對你說過：你這樣還不夠？"],["p","讀經不夠，奉獻不夠，還不夠像一個真正的基督徒？"],["p","今天這一章，我們用三個字走完：子，痛，約。"],["q","第一件事：兒子的名分。"],["p","保羅先畫了一幅家裡的圖。"],["q","「我說那承受產業的，雖然是全業的主人，但為孩童的時候卻與奴僕毫無分別」（4:1）"],["p","一個大戶人家，遺囑上寫著，產業全是這個孩子的。"],["p","可是孩子還小。他不能簽字，不能動用一分錢，每天有人管著他。"],["p","從外面看，他和家裡的僕人沒有兩樣。"],["p","可是他不是僕人。他只是還沒有到時候。"],["p","那個時候，第二節說，是「他父親預定的」。不是孩子定的，是父親定的。"],["p","保羅說，律法那一段日子，就是這樣的日子。律法像那位師傅，管著，看著，教著。"],["p","可是師傅從來不是那份產業本身。"],["p","第三節有一個字很叫人吃驚：「我們為孩童的時候」。保羅說「我們」。"],["p","一個生來的猶太人，一個熱心的法利賽人，把自己和拜偶像的外邦人，放在同一張課表上。"],["p","他不是說律法和偶像一樣壞。他是說，兩樣底下，人有同一個姿勢。"],["q","靠守住一套規條，來確定自己在神面前的位置。"],["p","然後是全章的轉軸。"],["q","「及至時候滿足，神就差遣他的兒子，為女子所生，且生在律法以下」（4:4）"],["p","孩子不能叫自己長大，奴僕不能替自己贖身。那一天，是父親自己來成就的。"],["p","神沒有在天上發一道命令說：你們自由了。"],["p","祂差遣祂的兒子，被一個女子懷在腹中，第八天受割禮，活在律法底下。"],["p","他走進了我們站的地方。"],["q","「要把律法以下的人贖出來，叫我們得著兒子的名分。」（4:5）"],["p","「兒子的名分」，原文是 τὴν υἱοθεσίαν，是羅馬法裡收養的那個字。"],["p","一個人被收養，舊的債一筆勾銷，換了新的姓，和親生的兒子有一樣的繼承權。"],["p","文件一簽，孩子不會因為某一天表現不好，就被退回孤兒院。"],["p","所以你今天早上覺得離神很遠，你的收養文件，並沒有因此作廢。"],["p","然後，加拉太書最溫暖的一句話來了。"],["q","「你們既為兒子，神就差他兒子的靈進入你們的心，呼叫：『阿爸！父！』」（4:6）"],["p","前面三章滿是爭辯、咒詛、律法。到這裡，忽然聽見一個孩子叫父親。"],["p","請你聽這節的次序：你們既為兒子，神就差了靈。"],["p","不是你叫得夠大聲，才變成兒子。是你已經是兒子了，那靈在你裡面替你叫出來。"],["q","呼叫，是身分自己長出來的聲音。"],["p","「阿爸」是亞蘭文，小孩子叫爸爸的話；「父」是希臘文。"],["p","猶太信徒和外邦信徒，用各自的母語，叫同一位父親。第二章那張被拆開的餐桌，在這一聲裡又合起來了。"],["p","這使我們想起客西馬尼園那一夜，耶穌也是這樣叫的："],["q","「阿爸！父啊！在你凡事都能」（可 14:36）"],["p","我知道，有些人「阿爸」兩個字很難叫出口。也許你的父親很遙遠，很嚴厲，或者根本不在。"],["p","請你聽好：這一節沒有說，你要叫得很順，才算是兒子。"],["p","有時候那一聲很小，有時候只是一聲嘆息。可是那靈仍然在你裡面叫著。"],["p","然後保羅把整段收成一句，讓每一個人帶回家。"],["q","「可見，從此以後，你不是奴僕，乃是兒子了；既是兒子，就靠著神為後嗣。」（4:7）"],["p","前面都是「你們」，這裡忽然變成單數的「你」。保羅好像一個一個叫出名字來。"],["p","請你再聽一次和合本這一句。它沒有說「你漸漸不是奴僕」。"],["p","它說：從此以後，你不是。"],["q","身分是宣告，不是進度。"],["p","一個被收養的孩子，進門那一天，就是這家的兒子。"],["p","他還會犯錯，還會因為從前的習慣害怕、討好、躲起來。可是這些都不改變門牌上的姓。"],["p","很多基督徒活得像一個「快要成為兒子」的僕人。表現好，覺得神很近；失敗了，覺得要重新申請。"],["q","奴僕靠表現留下來，兒子靠父親留下來。"],["p","那一晚睡不著的弟兄，有人告訴他：你還在門外。"],["p","保羅的回答是：你已經在家裡了，不必再補交任何一張申請表。"],["p","可是講到這裡，保羅的聲音忽然變了。"],["p","因為一個已經是兒子的人，竟然想走回奴僕的房間去。"],["q","第二件事：回去作奴僕。"],["p","加拉太人從前拜的是甚麼，使徒行傳講義第十四章講過。"],["p","在路司得，宙斯廟的祭司牽著牛、拿著花圈，要向保羅和巴拿巴獻祭。"],["p","保羅說，那些是「本來不是神的」。這些人真的離開了偶像，認識了真神。"],["p","然後第九節，保羅說到一半，停下來改了自己的話。"],["q","「現在你們既然認識神，更可說是被神所認識的」（4:9）"],["p","主角從人換成了神。"],["p","一個人若只知道「我認識神」，會一直擔心自己認識得夠不夠。"],["p","一個人若知道「神認識我」，他就可以安息。"],["p","可是接著，保羅問了一個很重的問題："],["q","「怎麼還要歸回那懦弱無用的小學，情願再給他作奴僕呢？」（4:9）"],["p","「情願」，沒有人逼他們，是他們自己想要。"],["p","為甚麼自由的人會想回到奴僕的房間？因為那裡規則很清楚，守了多少條，就知道自己有幾分。"],["p","保羅沒有說律法是異教。他是說，把任何東西放在基督旁邊當作得救的保險，靈魂就回到同一種姿勢。"],["p","第十節，碰到我們華人信徒最常問的問題。"],["q","「你們謹守日子、月份、節期、年份」（4:10）"],["p","「謹守」，原文是 παρατηρεῖσθε，是一直緊緊盯著、怕出錯的那種眼光。"],["p","那麼，基督徒可以過春節、中秋、清明嗎？"],["p","保羅責備的不是「有日子」，是把日子當作與神關係的條件，或者當作掌管禍福的力量。"],["q","分辨的關鍵不是日子，是你在那一天信靠誰。"],["p","除夕回家吃團圓飯，向長輩拜年，中秋一家人賞月，這是親情，是孝敬，是文化。"],["p","基督徒可以參與，而且可以在裡面活出見證。"],["p","可是祭拜、燒香、向祖先求福，擇日、看時辰、看風水，就不只是文化了。"],["p","那是第八節說的：給那些本來不是神的作奴僕。信靠的對象換了。"],["p","所以兩邊都要講。不要一概妖魔化，叫初信的人從此不回家過年。那是另一個軛。"],["p","也不要一概放任，把求問吉凶輕輕說成「只是習俗」。"],["p","清明節跟家人去掃墓，獻一束花，在墓前為家人禱告，不燒香。這樣去，往往比不去更能把福音帶進家裡。"],["p","詳細的討論，在講義的議題頁和全卷立場，今天說到這裡。"],["p","然後，是全章最低的一句。"],["q","「我為你們害怕，惟恐我在你們身上是枉費了工夫。」（4:11）"],["p","他在路司得被石頭打過，被拖到城外。爬起來，還是回去堅固門徒。"],["p","現在他怕這一切都白費了。不是因為他們去拜偶像，是因為他們在基督之外多守一些日子。"],["p","保羅沒有用一句「交託給神」把擔心蓋過去。害怕可以說出來，只是不要讓它變成控制。"],["p","接著，保羅放下辯論，翻開一本舊相簿。"],["q","「你們知道我頭一次傳福音給你們，是因為身體有疾病。」（4:13）"],["p","是甚麼病？經文沒有說，我們也不猜。"],["p","第十四節說他們「沒有厭棄我」，原文是沒有吐唾沫。開頭那位弟兄記得的，就是這一幕。"],["p","他們沒有吐。他們接待這個病人，「如同基督耶穌」。"],["p","福音在加拉太，是從一個病人的口裡傳開的。"],["p","那麼，那些人是怎麼把他們帶走的？"],["q","「那些人熱心待你們，卻不是好意，是要離間你們，叫你們熱心待他們。」（4:17）"],["p","和合本的小字說，「離間你們」，原文是把你們關在外面。"],["p","這就是開頭那一句話的手法：先叫你覺得自己還在門外，再給你一道只有他們才有的門。"],["q","真福音把人請進同一張桌子。假熱心把人關在外面，好叫他們來求。"],["p","然後，保羅換了一個稱呼。全卷只有這一次。"],["q","「我小子啊，我為你們再受生產之苦，直等到基督成形在你們心裡。」（4:19）"],["p","「生產之苦」，原文是 ὠδίνω，是婦人臨盆的陣痛。"],["p","前面還有一個「再」字。他們歸信的時候，保羅痛過一次；現在他們走回去，他要再痛一次。"],["p","孩子走偏了，最痛的不是旁觀的人，是生他的人。"],["p","可是請你聽他陣痛的目標。他沒有說：直等到你們像我，聽我的話。"],["p","他說：直等到基督成形。"],["p","屬靈父母的成功，不是孩子變成自己的翻版，是孩子身上長出基督的樣子。"],["q","在孩子身上找自己，那是控制，不是生養。"],["p","第一點和這一點要一起聽。被收養是一天的事；基督成形卻像懷胎，要時間，有陣痛，也會反覆。"],["p","身分不靠成長換來。成長，是從身分裡長出來的。"],["p","講到這裡，保羅好像擦乾了眼淚，又回到論證。這一次，他用那群人最喜歡的東西：律法。你們想要律法？那就聽聽律法這本書怎麼說。"],["q","第三件事：兩個婦人。"],["p","亞伯拉罕有兩個兒子。本系列創世記講義第十六章和第二十一章，講過他們的故事。"],["p","以實瑪利的出生，是撒萊的一個計畫："],["q","「求你和我的使女同房，或者我可以因她得孩子。」（創 16:2）"],["p","神應許了兒子，可是等太久了。人就用自己的辦法，替神的應許找一條捷徑。"],["p","以撒正好相反。亞伯拉罕老了，撒拉不能生了，人的辦法全部用完了。"],["q","「那使女所生的是按著血氣生的；那自主之婦人所生的是憑著應許生的。」（4:23）"],["p","請聽清楚，保羅比的是兩種出生方式。"],["p","一種是人靠自己的力氣、自己的計畫生出來的。一種是神憑著應許，在人不可能的地方生出來的。"],["p","割禮是在肉體上作的記號。那群人要的，正是一個「按著血氣」的保證。"],["q","「這都是比方：那兩個婦人就是兩約。」（4:24）"],["p","「比方」，原文是 ἀλληγορούμενα，說的是一件事，指的是另一件事。"],["p","保羅自己標明了：我在打比方。所以我們照他的比方講滿；可是也只在這裡講，不把這個讀法推到別的經文。"],["p","他像在黑板上畫了兩欄。一欄是夏甲：西奈山的約，生子為奴，和現在的耶路撒冷同類。"],["p","一欄是撒拉：應許的約，自主，那在上的耶路撒冷。"],["p","弟兄姊妹，這裡我要非常小心，也請你跟我一起小心。"],["q","保羅比的是兩個約、兩種出生方式，不是兩個民族。"],["p","有人把這一段拿來輕看猶太人，也有人拿它來講阿拉伯人、講穆斯林。那都是把保羅沒有說的話，塞進他的嘴裡。"],["p","「現在的耶路撒冷」，在保羅的比方裡，指的是那一套要外邦人受割禮才算數的宗教。"],["p","保羅自己就是生來的猶太人。他在羅馬書說："],["q","「神並沒有棄絕他預先所知道的百姓。」（羅 11:2）"],["p","還有一件事要說清楚：夏甲本人，不是這個故事的反派。"],["p","她是一個被安排、被使用、後來被趕出去的使女。"],["p","她懷著孩子逃到曠野，在水泉旁邊，神的使者找到了她。然後她給神起了一個名字。"],["q","「夏甲就稱那對她說話的耶和華為『看顧人的神』。」（創 16:13）"],["p","夏甲，是見證神看顧人的那一個人。"],["p","保羅在比方裡用她代表一個約，不是在評價她這個人，更不是在評價她的後代。"],["p","撒拉那一欄，保羅只寫了一句："],["q","「但那在上的耶路撒冷是自主的，她是我們的母。」（4:26）"],["p","外邦信徒不必搬到耶路撒冷，不必改成猶太人的樣子，才有一個屬靈的母親。他們的戶籍，是神親自登記的。"],["p","然後保羅引以賽亞書，說那個「未曾經過產難的」要高聲歡呼。"],["p","又是那個陣痛的字。從人看是絕路的地方，神生出最多的兒女。"],["q","你的出生，是神在不可能之處作成的。"],["q","「當時，那按著血氣生的逼迫了那按著聖靈生的，現在也是這樣。」（4:29）"],["p","那位睡不著的弟兄，有人在他耳邊說：你還不完整。保羅說，這種壓力正好說明你是哪一種兒女。"],["p","然後是那一句很硬的話，引自創世記："],["q","「把使女和她兒子趕出去！因為使女的兒子不可與自主婦人的兒子一同承受產業。」（4:30）"],["p","在比方裡要趕出去的，不是一群人，是一個約，一種出生方式。"],["p","意思是：不要讓「信耶穌再加上割禮」那一套，在教會裡和福音同坐，一同分產業。"],["p","所以這一節，絕不能拿來趕走意見不同的弟兄，也絕不能拿來給任何民族定罪。"],["p","而且創世記沒有讓夏甲消失在曠野。水用盡了，她放聲大哭，神說："],["q","「不要害怕，神已經聽見童子的聲音了。」（創 21:17）"],["p","比方裡她代表西奈的約；創世記裡，神始終看顧她。這兩句話要一起講。"],["p","最後，保羅收在一句宣告上。"],["q","「弟兄們，這樣看來，我們不是使女的兒女，乃是自主婦人的兒女了。」（4:31）"],["p","和第七節一樣，這是宣告，不是勸勉。他沒有說「你們要努力成為」，他說：你們是。"],["p","今天也許沒有人要你受割禮。可是「你還在門外」這句話，換了很多種說法。"],["p","每一句，都是在基督後面加了一個「和」字。"],["p","我們回到開頭那一晚。那位弟兄在燈下讀這封信，讀到第四節，停了下來。"],["q","神就差遣他的兒子，為女子所生，且生在律法以下。"],["p","原來那一位兒子，自己走進了律法底下，走進了奴僕的房間。"],["p","最後，他被掛在木頭上，為我們受了咒詛。"],["p","他走到門外，好叫我們進到門裡。"],["p","然後神又差了一次，差他兒子的靈，進到我們心裡。"],["p","所以那一晚，那位弟兄不必再問：我到底算不算數？"],["p","他可以在黑暗裡，用自己的母語，小聲叫一聲：阿爸，父。"],["p","那一聲，是那位兒子的靈，在他裡面叫出來的。"],["p","這也是我們團契說「無己」的根。"],["q","「現在活著的不再是我，乃是基督在我裡面活著……他是愛我，為我捨己。」（2:20）"],["p","無己，不是一個奴僕把自己抹掉。是一個兒子知道自己被愛，不必再為自己爭一個位置。"],["p","這個禮拜，每天睡前，用一句話禱告就好。不必先列出今天做得好不好，只叫一聲：阿爸，父。"],["p","如果你身邊有一位初信的人，正被一句「你還不夠」壓著，請坐到他旁邊，把第七節讀給他聽。"],["q","從此以後，你不是奴僕，乃是兒子了。"],["p","我們一起低頭禱告。"]]},"5":{"min":18,"blocks":[["h","《你們當順著聖靈而行》"],["p","弟兄姊妹平安，今天我們一起讀加拉太書第五章。"],["p","今天我想請你帶兩個數字回家。十五，和一。"],["p","請你先聽保羅列的一張單子。我念的時候，你可以在心裡數。"],["q","「情慾的事都是顯而易見的，就如姦淫、污穢、邪蕩、拜偶像、邪術、仇恨、爭競、忌恨、惱怒、結黨、紛爭、異端、嫉妒、醉酒、荒宴等類。」（5:19–21）"],["p","數完了嗎？十五樣。"],["p","可是保羅沒有在十五停下來。他最後加了兩個字：等類。"],["p","意思是，這張單子列不完。"],["p","原文還有一個細節：「情慾的事」，那個「事」字是複數。"],["p","然後保羅翻過來，列另一張單子。"],["q","「聖靈所結的果子，就是仁愛、喜樂、和平、忍耐、恩慈、良善、信實、溫柔、節制。」（5:22–23）"],["p","這一張是九樣。"],["p","可是請你聽仔細：保羅沒有說「果子們」。"],["p","「果子」這個字，原文是單數。後面的動詞，也是單數。"],["q","不是九個果子。是一個果子，九種滋味。"],["p","一邊是十五，而且還在往上加。"],["p","一邊是一。只有一個。"],["p","肉體的路，是一張越拉越長的清單。"],["p","聖靈的路，是一個生命，慢慢長出來。"],["p","有人跟他們說：信耶穌很好，可是還不夠。還要再加上割禮，再加上節期。"],["p","那是攪擾他們的人的主張，不是保羅的。"],["p","他們沒有拿掉基督。他們只是在基督後面，加了一個「和」字。"],["p","這一章有三個字：軛，酵，果。"],["p","我們沿著它走三步：站立得穩，自由的方向，一個果子。"],["q","第一步：站立得穩。"],["q","「基督釋放了我們，叫我們得以自由。所以要站立得穩，不要再被奴僕的軛挾制。」（5:1）"],["p","原文是同一個字根重複兩次：為了自由，基督使我們自由。"],["p","基督釋放我們，不是要把我們轉手交給另一個主人。"],["p","「要站立得穩」卻是現在式的命令：一直站著。"],["p","被釋放，是一次完成的。站得住，要天天站。"],["p","原文 ζυγός，是套在牛頸上的那一根橫木。"],["p","軛的重，不只在那根木頭。是從此不能自己決定往哪裡走。"],["p","請注意那個「再」字。不要「再」被奴僕的軛挾制。"],["p","加拉太人多半是外邦人。他們從前已經背過一副軛。"],["q","「怎麼還要歸回那懦弱無用的小學，情願再給他作奴僕呢？」（4:9）"],["p","從偶像的軛，換到律法的軛。形狀不一樣，都是軛。"],["p","這也使我們想起主耶穌的話："],["q","「因為我的軛是容易的，我的擔子是輕省的。」（太 11:30）"],["p","基督徒不是沒有軛的人。我們是從一副壓死人的軛底下出來，走到一位柔和謙卑的主身邊。"],["q","「我－保羅告訴你們，若受割禮，基督就與你們無益了。」（5:2）"],["p","我們回到數字。攪擾的人的算術是這樣的：基督，加一點割禮，等於更穩妥。"],["p","保羅的算術正好相反。"],["q","基督加上任何東西，不等於更多。等於基督無益。"],["p","因為一旦割禮成了條件，你倚靠的就不再是基督，是基督加上你自己。"],["q","「我再指著凡受割禮的人確實地說，他是欠著行全律法的債。」（5:3）"],["p","割禮不是一張單據，是一整本帳。"],["p","然後是全章最重的一句。"],["q","「你們這要靠律法稱義的，是與基督隔絕，從恩典中墜落了。」（5:4）"],["p","請你看主詞是誰：「要靠律法稱義的」。"],["p","這裡沒有說，一個基督徒犯了某一個罪，軟弱了一次，就從恩典中掉下去。"],["p","「墜落」這個字，原文用來說一條船被風吹離航道。"],["p","往哪裡偏？從恩典，偏到律法上。從靠基督，偏到靠自己的表現。"],["q","今天最容易從恩典中墜落的，常常不是跌倒的人，是以為自己做得夠好的人。"],["p","真信徒會不會失去救恩？加爾文派與阿民念派的看法不同，講義的議題頁有並陳。"],["p","可是兩邊都同意：這一節的墜落，是轉去靠律法稱義。回來的路，就是回到恩典。"],["p","所以，如果你今天坐在這裡，心裡很怕自己已經掉出恩典了。"],["p","請你聽這一句：恩典從來不靠你抓得多緊，靠的是那位召你的。"],["q","「原來在基督耶穌裡，受割禮不受割禮全無功效，惟獨使人生發仁愛的信心才有功效。」（5:6）"],["p","它擋住律法主義：你的資歷、背景、宗派標記，在基督裡都不加分。"],["p","它也擋住放縱：信心若生不出愛，就不是這一節所說的信心。"],["p","次序要講清楚。我們不是因為愛人而稱義。我們是因信稱義，然後這信心藉著愛活出來。"],["q","愛不是門票。愛是信心的出口。"],["p","有人說「我信主了，行為無所謂」，這一節不答應。"],["p","有人說「你愛得不夠，所以還不算得救」，這一節也不答應。"],["q","「你們向來跑得好，有誰攔阻你們，叫你們不順從真理呢？」（5:7）"],["p","「攔阻」這個字，原文 ἐνέκοψεν，是在跑道上從旁邊切進來，把人撞出路線。"],["p","問題出在半路。有人切進來，叫他們換到一條看起來更認真的跑道。"],["q","「一點麵酵能使全團都發起來。」（5:9）"],["p","這句諺語，保羅在哥林多前書第五章也用過。哥林多前書講義第五章講過那一次。"],["p","保羅說，酵不在乎大小，在乎會不會擴散。一條附加的規矩，遲早改變整個福音的味道。"],["q","「我在主裡很信你們必不懷別樣的心；但攪擾你們的，無論是誰，必擔當他的罪名。」（5:10）"],["q","「若是這樣，那十字架討厭的地方就沒有了。」（5:11）"],["p","「討厭的地方」，原文是絆腳石。"],["p","保羅若肯加上割禮，就不會再受逼迫。給福音加上一點東西，常常是為了讓福音不那麼刺耳。"],["q","「恨不得那攪亂你們的人把自己割絕了。」（5:12）"],["p","這是一句很重的話。多數學者認為，保羅在用反諷：既然你們以割為敬虔，何不割到底？"],["p","保羅可以說這麼重的話嗎？講義的議題頁有整理。"],["p","我只請你看三件事。他對準的是拆毀羊群的教師，不是軟弱的羊。"],["p","他說的是一個交給神的願望，不是號召教會動手。"],["p","他的怒氣，是為了別人的自由，不是為了自己的面子。"],["q","這一節，不能拿來為今天在網路上辱罵別人辯護。"],["p","它的鋒芒，其實向著裡面：凡是在十字架之外，給人加條件的，都要聽見這句話的重量。"],["p","包括站在講台上的人。包括我。"],["p","可是一個剛聽見「你不必」的人，很容易接著聽成「所以我想怎樣就怎樣」。"],["p","保羅預先看見了這條路。他轉過身，去擋另一邊。"],["q","第二步：自由的方向。"],["q","「弟兄們，你們蒙召是要得自由，只是不可將你們的自由當作放縱情慾的機會，總要用愛心互相服事。」（5:13）"],["p","自由有兩個敵人。一個在前面，叫你回去背軛。"],["p","一個在後面，叫你把自由交給肉體。"],["p","兩個敵人看起來相反，結局卻一樣：都叫人重新變成奴僕。"],["p","「機會」這個字，原文 ἀφορμή，是一個軍事用語。"],["p","自由若交給肉體，就等於在自己的海岸上，替敵人留了一塊灘頭。"],["p","「互相服事」，原文是「藉著愛，彼此作奴僕」。"],["p","這個「作奴僕」，和第一節「奴僕的軛」，是同一個字根。"],["q","基督救我們脫離奴役，是為了叫我們彼此作愛的奴僕。"],["p","奴僕是被逼著服事。兒子是甘心服事。"],["p","一個怕被定罪，所以做；一個被愛夠了，所以做。"],["p","可是請你不要漏掉「彼此」兩個字。"],["p","這不是叫某一群人無限付出，讓另一群人坐著被服事。"],["p","也不是叫受傷的人默默忍受，不可以說不。"],["p","愛裡的奴僕是彼此的。你擔當人，也被人擔當。"],["p","照顧人的人，也需要被照顧。"],["p","哥林多前書講義第八章講過同一個原則：自由，要朝著弟兄的益處走。"],["q","「因為全律法都包在『愛人如己』這一句話之內了。」（5:14）"],["p","攪擾的人要加拉太人把那整本帳背起來。保羅說，全律法的心，在一句話裡。"],["p","第三節說，受割禮的人欠著要「行」全律法。"],["p","第十四節說，全律法在一句話裡「被成全」了。原文是完成式被動。"],["p","一個是你拚命去做完。一個是在愛裡，律法要的，已經被填滿了。"],["p","標準沒有降低，反而更深了。規條只管得到手，愛要管到心。"],["q","「你們要謹慎，若相咬相吞，只怕要彼此消滅了。」（5:15）"],["p","保羅用的是野獸的字。咬，吞，最後吃光。"],["p","第十三節說「彼此作奴僕」，第十五節卻是「彼此吞吃」。同一個「彼此」，方向完全反過來。"],["p","弟兄姊妹，律法主義和放縱，都會咬人。"],["p","律法主義用規條咬人：「你不夠屬靈。」"],["p","放縱用私慾咬人：「我想要的，你得讓開。」"],["p","方向相反，牙齒一樣尖。"],["p","教會群組裡的筆戰，小組裡的冷言冷語，同工之間的互相拆台，都是這一節的今天。"],["p","出路不是更多的規條，也不是從此不談是非。"],["p","是回到第十三節：彼此作愛的奴僕。"],["p","可是，這怎麼做得到？"],["p","保羅的答案，不是第十六樣規條。"],["q","第三步：一個果子。"],["q","「我說，你們當順著聖靈而行，就不放縱肉體的情慾了。」（5:16）"],["p","「行」這個字，原文 περιπατεῖτε，是很日常的行走。一步，一步。"],["p","不是偶爾一次的屬靈高峰。是上班、吃飯、回訊息、跟家人說話的每一步。"],["p","保羅沒有說：你們先拚命壓住情慾，聖靈就會來。"],["p","他說：順著聖靈而行，就不放縱肉體的情慾。"],["p","後半句原文是雙重否定，是希臘文裡最強的「絕不」。"],["p","這不是第二道命令，是第一道命令帶來的應許。"],["p","對付肉體的方法，不是眼睛一直盯著肉體，是把腳步跟上聖靈。"],["p","走夜路的時候，與其一直數路上有幾個坑，不如緊跟那個提燈的人。"],["q","「因為情慾和聖靈相爭，聖靈和情慾相爭，這兩個是彼此相敵」（5:17）"],["p","保羅很誠實。屬靈的人，不是沒有掙扎的人。"],["p","基督徒裡面是不是有兩個本性？各家說法不同，講義的議題頁有並陳。"],["p","掙扎是真的。結局不是平手。"],["q","「但你們若被聖靈引導，就不在律法以下。」（5:18）"],["p","「被引導」是被動的，像一個孩子，被父親牽著手走。"],["p","現在，我們回到開頭的那個十五。"],["p","性方面三樣，宗教兩樣，醉酒荒宴兩樣。"],["p","剩下最大的一組，有八樣，全部是人與人之間的毀壞。"],["q","照這張單子，一位從不喝酒、卻在教會裡拉幫結派的人，和一位醉酒的人，一樣活在肉體裡。"],["p","然後是第二十一節的重話。"],["q","「我從前告訴你們，現在又告訴你們，行這樣事的人必不能承受神的國。」（5:21）"],["p","這一句不能刪掉，也不能講成恐嚇。"],["p","不能刪掉，因為它擋住放縱。一個人說「我信主了，怎樣生活都沒關係」，保羅不答應。"],["p","不能講成恐嚇，因為「行」這個字，原文是現在分詞。"],["p","說的是以這些事為生活方式，安然住在裡面的人。"],["p","不是偶然跌倒、心裡痛悔的人。"],["p","對跌倒的人，保羅在下一章第一句，就留了一條回來的路。"],["q","「若有人偶然被過犯所勝，你們屬靈的人就當用溫柔的心把他挽回過來」（6:1）"],["p","所以，如果你今天聽到這張清單，心裡發痛。"],["p","那個痛，正是聖靈還在你裡面動工的記號。"],["p","得救的條件，是信靠基督。生命的改變，是得救的果子。這兩件事不要倒過來。"],["p","現在，我們來看那個「一」。"],["p","肉體出產的，是「作為」，一件一件做出來的。"],["p","聖靈出產的，是「果子」，一棵樹活著，自然長出來的。"],["p","如果是九個果子，我們很容易把它當成九項功課。"],["p","這個月操練忍耐，下個月操練溫柔，年底再檢查自己結了幾個。"],["p","可是它是一個果子，九種滋味。"],["p","你不能只要其中一樣，也不能用其中一樣，頂替其他八樣。"],["p","果子也不是擠出來的。"],["p","你有沒有看過一棵蘋果樹，咬緊牙關，擠出一顆蘋果？"],["p","它只是活著，連在根上。到了季節，就結果子。"],["p","主耶穌說："],["q","「常在我裡面的，我也常在他裡面，這人就多結果子」（約 15:5）"],["p","這不表示基督徒甚麼都不用做。「順著聖靈而行」是命令，「靠聖靈行事」也是命令。"],["p","可是我們做的，是跟上聖靈。果子，是聖靈結的。"],["p","我們團契常講 920：操練活出無己的 0，結出聖靈的 9。"],["p","讀過這一節，我們就知道，這個 9 不是九項功課，是一個生命。"],["p","是第二章那一句話，長出來的樣子。"],["q","「現在活著的不再是我，乃是基督在我裡面活著……他是愛我，為我捨己。」（2:20）"],["p","請你一定連下半句一起聽。不再是我，不是說我不重要。"],["p","是一個被愛到這個地步的我，交給了真正的主人。"],["q","被愛的人，才結得出愛的果子。"],["q","「凡屬基督耶穌的人，是已經把肉體連肉體的邪情私慾同釘在十字架上了。」（5:24）"],["p","保羅先問身分：你是屬誰的？"],["p","「釘」是過去式。屬基督的人，在信主歸入基督的那一刻，已經對肉體說了「不」。"],["p","所以這一節不是叫你每天努力把自己釘死。"],["p","第二章的「同釘」是被動的，是神作成的。這裡，是我們在信的那一刻，同意了神所作的。"],["p","也請你不要把「邪情私慾」聽成「一切感受」。"],["p","保羅在這封信裡也會希奇，也會心裡作難，也會為他們再受生產之苦。"],["p","屬基督的人，仍然會傷心，會生氣，會說「不」。"],["q","不同的是，這些感受不再坐在王位上。"],["q","「我們若是靠聖靈得生，就當靠聖靈行事。」（5:25）"],["p","「行事」這個字，原文 στοιχῶμεν，是軍隊排成行列，跟上步伐。"],["p","它和第四章「世俗的小學」，是同一個字根。"],["p","從前，人被規條排成隊伍。如今，我們跟上聖靈的步伐。"],["q","「不要貪圖虛名，彼此惹氣，互相嫉妒。」（5:26）"],["p","自覺比較屬靈的人，容易向下挑釁人。自覺不如人的人，容易向上嫉妒人。"],["p","「嫉妒」，就是那張十五樣清單裡的一樣。肉體的單子，又從教會的後門溜進來了。"],["p","治本的方法不是比較，是跟上。"],["p","眼睛看著帶隊的那一位，就不必一直看旁邊的人。"],["p","弟兄姊妹，我們回到那兩個數字。"],["p","十五，還在往上加。一，只有一個。"],["p","仁愛，喜樂，和平，忍耐，恩慈，良善，信實，溫柔，節制。"],["p","你聽著，像不像在讀一張清單？"],["p","還是，像在認一個人？"],["p","一個被人咬、卻不還口的人，一個到最後都可靠的人。"],["p","主耶穌說，他心裡柔和謙卑；他的軛是容易的。"],["p","第二章說，他在我裡面活著。"],["p","所以那一個果子，說到底，就是他的生命，在我們身上長出來的樣子。"],["p","肉體的單子永遠列不完，因為它沒有中心。"],["p","聖靈的果子只有一個，因為它有一個根：那位愛我，為我捨己的主。"],["q","我們要的不是更長的清單，是更深地連在他身上。"],["p","你不必更佩服保羅，也不必更佩服今天的講員。你只要更認識這一位主。"],["p","這個禮拜，我想請你做兩件很小的事。"],["p","第一件，問自己一個問題：我在基督後面，有沒有偷偷加了一個「和」字？"],["p","信耶穌，和我的表現。信耶穌，和某一個規矩。或者，你把它加在別人身上。"],["p","找到了，就把它放下。回到第一節：基督釋放了我們。"],["p","第二件，找一個人，用愛去當他的僕人。一件小事就好。"],["p","也讓別人有機會服事你。彼此，才是愛的奴僕。"],["p","如果這個禮拜，你又咬了人，又跌倒了，請記得第六章第一節。回來的路一直在。"],["p","因為果子不是你擠出來的。是他在你裡面活著，慢慢長出來的。"],["p","我們一起低頭禱告。"]]},"6":{"min":18,"blocks":[["h","《只誇我們主耶穌基督的十字架》"],["p","弟兄姊妹平安，今天我們一起讀加拉太書第六章，這封信的最後一章。"],["p","上個月，我去幫一位弟兄搬家。"],["p","早上八點，四樓，沒有電梯。"],["p","樓梯間很窄，紙箱堆到門口，每個人手上都是汗。"],["p","到了中午，我發現搬家其實只有兩種東西。"],["p","一種是自己的背包。"],["p","錢包、手機、鑰匙、換洗的衣服。那個背包，每個人自己背。"],["p","另一種，是那台冰箱。"],["p","雙門的，很重。一個人抬，不是抬不動，是會受傷。"],["q","所以我們四個人，一人一個角，喊一、二、三，一起抬。"],["p","那天下午我一直在想：如果有人把冰箱當成背包，叫屋主一個人背下四樓，那是殘忍。"],["p","搬家搬得好不好，就看你分不分得清楚，哪一個是背包，哪一個是冰箱。"],["p","保羅在這一章，也講到這兩種東西。"],["q","「你們各人的重擔要互相擔當，如此，就完全了基督的律法。」（6:2）"],["q","「因為各人必擔當自己的擔子。」（6:5）"],["p","中文都是「擔當」，好像互相矛盾。原文卻是兩個字：一個是冰箱，一個是背包。"],["p","今天我們沿著這一章，走三步：擔，種，印。"],["p","保羅寫給教會的信，開頭幾乎都先感謝神。只有這一封沒有。"],["p","他一開口就說：「我希奇」。"],["q","「你們這麼快離開那藉著基督之恩召你們的，去從別的福音。」（1:6）"],["p","有一批人來到加拉太。他們沒有叫人不要信耶穌。"],["p","他們只是說：信耶穌很好，再加上割禮，才算完整。"],["p","這是他們的主張，不是保羅的。"],["q","第一步：擔。一起扛，與自己背。"],["p","第六章的第一個字，是一聲稱呼。"],["q","「弟兄們，若有人偶然被過犯所勝，你們屬靈的人就當用溫柔的心把他挽回過來」（6:1）"],["p","前一節剛說：「不要貪圖虛名，彼此惹氣，互相嫉妒。」"],["p","保羅轉過身，先叫他們一聲：弟兄們。"],["p","然後他講的第一個情境，是有人跌倒了。"],["p","結果子的教會，還是會有人跌倒。分別不在有沒有人跌倒，在跌倒的人怎樣被對待。"],["p","「偶然被過犯所勝」，原文的意思，是被搶先一步抓住，措手不及。"],["p","「挽回」這個字，原文是 καταρτίζετε。"],["p","福音書裡，雅各和約翰在船上補網，用的就是這個字；希臘的醫生，用它講接骨。"],["p","挽回不是開除，也不是審判。是補網，是接骨。"],["p","所以挽回不是假裝沒事。網破了要補，罪要被說出來。"],["p","可是目的始終是讓這個人重新站起來，不是讓教會出一口氣。"],["p","誰來接骨？「你們屬靈的人」。"],["p","這不是一個階級，是上一章說的「靠聖靈行事」的人。他的記號，正好是溫柔。"],["p","這節最後一句，忽然從「你們」換成單數的「你」。"],["q","「又當自己小心，恐怕也被引誘。」（6:1）"],["p","挽回是一家人的事。警醒，是你自己的事。"],["p","然後是第二節，那台冰箱。"],["q","「你們各人的重擔要互相擔當」（6:2）"],["p","「重擔」，原文是 βάρος 的複數。"],["p","意思是壓得人站不起來的重量。"],["p","可能是一場病，一次失業；也可能是照顧一位失智的父親，已經照顧了八年。"],["p","這種重量，一個人扛，會受傷。"],["p","所以「互相」這個字，在原文放在整句的最前面。"],["p","上一章，這個字用在「相咬相吞」。"],["p","同一個「彼此」，可以用來咬，也可以用來扛。"],["q","「如此，就完全了基督的律法。」（6:2）"],["p","攪擾的人要加拉太人守律法，受割禮，守日子，好像那樣才叫完全。"],["p","保羅說：你們要完全律法嗎？有一條路，是他們沒有走的。"],["p","彎下腰，去扛另一個人的重量。"],["p","「完全」，原文是填滿。律法沒有被丟掉，它在一群彼此扛擔子的人中間，被填滿了。"],["p","這也是 2:20 落地的樣子。"],["q","「我已經與基督同釘十字架……他是愛我，為我捨己。」（2:20）"],["p","基督先扛了我最重的那一份。"],["p","可是講到這裡，我必須停下來。因為這一節，最容易被講成另一副軛。"],["p","「你是基督徒，就要擔當別人的重擔，不可以拒絕。」"],["p","對一個照顧家人多年，已經撐不住的人說這句話，"],["p","那正是主耶穌責備的：「把難擔的重擔捆起來，擱在人的肩上」（太 23:4）。"],["p","請你看主詞。是「彼此」，不是「你一個人」。"],["p","冰箱是四個人抬的。不是壓在最肯抬的那一個人身上。"],["q","照顧別人的人，自己也是「彼此」裡的一個。他也需要被人扛。"],["q","「人若無有，自己還以為有，就是自欺了。」（6:3）"],["p","一個人以為自己了不起，就不會彎腰。"],["q","「各人應當察驗自己的行為；這樣，他所誇的就專在自己，不在別人了」（6:4）"],["p","「察驗」，是驗金子的字。"],["p","不是和跌倒的人比，是把自己的工作，單獨放到神面前，放進火裡看。"],["q","「因為各人必擔當自己的擔子。」（6:5）"],["p","動詞一樣，名詞換了。這裡的擔子，原文是 φορτίον。"],["p","是旅人、士兵行軍時，自己背的那個行囊。"],["p","這是背包，不是冰箱。"],["p","行軍的時候，各人背自己的行囊；有人倒下了，全隊停下來一起抬他。"],["p","兩種都是愛，兩種也都是界線。"],["p","這兩個字，救了兩種人。"],["p","一種人，把 6:2 講成無限付出。"],["p","他替所有人背背包。最後，自己倒在樓梯間。"],["p","保羅對他說：別人的背包，不是你的。"],["p","你可以說「這一件，我不能替你做」。這不是不愛，這是分得清楚。"],["p","另一種人，拿 6:5 當冷漠的理由。"],["p","保羅對他說：壓垮人的重擔不是背包。你不扛，就是不肯完全基督的律法。"],["p","分辨的問題只有一個。"],["q","這個重量，是他背得起的背包，還是已經壓得他站不起來的冰箱？"],["p","扛了別人的重擔，人會累。保羅知道。"],["p","所以他從搬家，換到了田裡。"],["q","第二步：種。撒種與收成。"],["q","「在道理上受教的，當把一切需用的供給施教的人。」（6:6）"],["p","教導的人，也是「彼此」裡的一個。他的生計，是一家人一起分的擔子。"],["p","「供給」這個字，原文是 κοινωνία 的動詞：有分，相交。"],["p","會眾不可以說「各人背自己的背包」，就把傳道人的需要撒手不管。"],["p","傳道人也不可以把這一節，當成向人要錢的槓桿。"],["p","然後，是這封信裡最常被引用，也最常被講錯的一句話。"],["q","「不要自欺，神是輕慢不得的。人種的是甚麼，收的也是甚麼。」（6:7）"],["p","「輕慢」這個字，原文從「鼻孔」來。是皺著鼻子，把人當傻瓜耍。"],["p","可是人不能把神當傻瓜。"],["p","這句話，我們要先講清楚它不是甚麼。"],["q","它不是因果報應。"],["p","報應的想法是：你今天受的苦，一定是你從前種下的。"],["p","主耶穌的門徒問過一模一樣的問題。"],["p","「這人生來是瞎眼的，是誰犯了罪？」（約 9:2）"],["p","主的回答是：「也不是這人犯了罪，也不是他父母犯了罪」（約 9:3）。"],["q","所以請你絕不要用這一節，對一個受苦的人說：「你一定是種了甚麼。」"],["p","如果你曾經被人這樣說過，今天我要告訴你：那不是這一節的意思。"],["q","它也不是奉獻投資。"],["p","第八節，保羅自己解釋了撒種是甚麼。"],["q","「順著情慾撒種的，必從情慾收敗壞；順著聖靈撒種的，必從聖靈收永生。」（6:8）"],["p","你聽，收成不是更多的錢。是敗壞，或者永生。"],["p","那麼，它是甚麼？"],["q","它是生命的方向。"],["p","第八節最要緊的，不是種子，是那個小小的介系詞：「種到」哪裡。"],["p","而且「撒種的」是現在分詞：一直在撒的人。"],["p","不是一筆一筆的交易，是一天一天的方向。"],["p","每一天，你都在把時間、心思、力氣，種進某一塊田。"],["p","晚上滑手機到兩點，是種在一塊田裡；早上五分鐘安靜禱告，是種在另一塊田裡。"],["p","種進自己的肉體，就是凡事以自己為中心。"],["p","種進聖靈，收成是第五章那一個果子，一直長到永生。"],["p","所以順著聖靈走的每一步，沒有一步是白走的。"],["q","「我們行善，不可喪志；若不灰心，到了時候就要收成。」（6:9）"],["p","這句話，是對累了的人說的。"],["p","保羅沒有說：屬靈的人不會累。"],["p","他說：不要鬆手。「灰心」這個字，原文是弓弦鬆了，人累到虛脫。"],["p","「到了時候」，原文是「在它自己的時候」。"],["p","收成有它自己的季節。那個季節，是神定的，不是我們算的。"],["p","一個忠心服事、卻看不見果效的人，不是種錯了。"],["p","收成的時候在神手裡；撒種的時機，在你今天手裡。"],["q","「所以，有了機會就當向眾人行善，向信徒一家的人更當這樣。」（6:10）"],["p","「眾人」在前面。教會的愛，不是關起門來的愛。"],["p","「一家的人」，原文從「家」這個字來：信心的家人。"],["p","第二節的「彼此」，在這裡有了名字。"],["p","照顧別人的人累了，也要被這個家照顧。"],["p","講到這裡，保羅做了一個動作。"],["p","他從替他代筆的人手裡，把筆拿了過來。"],["q","第三步：印。只誇十字架。"],["q","「請看我親手寫給你們的字是何等的大呢！」（6:11）"],["p","保羅說：你們看，我寫的字好大。"],["p","為甚麼字大？有人說他眼睛不好，有人說做帳棚的手粗。經文沒有說。"],["p","最後這幾行，他要加拉太人一定不能錯過。"],["p","他要他們看見的第一件事，是對手的底牌。"],["q","「凡希圖外貌體面的人都勉強你們受割禮，無非是怕自己為基督的十字架受逼迫。」（6:12）"],["p","「外貌體面」，原文是一個很少見的字：εὐπροσωπῆσαι。"],["p","在肉體上，作出一張好看的臉。用我們的話說：要面子。"],["p","請你聽清楚，要人受割禮的，是那些人，不是保羅。"],["p","帶回一群受了割禮的外邦人，是一張體面的成績單。"],["p","帶回一群沒受割禮的，就要挨白眼，受逼迫。割禮，成了他們的保護色。"],["q","「他們願意你們受割禮，不過要藉著你們的肉體誇口。」（6:13）"],["p","我的成功，要寫在你的身上。"],["p","這是一切宗教操控的樣子。"],["p","我們也要守住一條線：保羅揭穿的，是一群具體的教師、一種具體的動機，不是猶太人。"],["p","今天的割禮，可能是一種語言，一套服裝規矩，一張會員卡。"],["p","信耶穌，還要再加上甚麼，才算我們的人？"],["p","然後，全卷的山頂到了。"],["q","「但我斷不以別的誇口，只誇我們主耶穌基督的十字架」（6:14）"],["p","「但我」，原文放在最前面，和上一節的「他們」正面相對。"],["p","他用了全名：我們主耶穌基督。鄭重得像在立誓。"],["q","對手躲的，正是保羅誇的。"],["p","保羅把那個十字架，高高舉起來，當成他唯一的誇口。"],["p","在第一世紀，十字架不是項鍊上的裝飾，是羅馬人處死奴隸的刑具。"],["p","誇十字架，就像今天有人說：我這一生，只誇那座刑場。"],["p","保羅不是喜歡痛苦。他誇的，是在那裡發生的事。"],["q","「基督既為我們受了咒詛，就贖出我們脫離律法的咒詛」（3:13）"],["p","前一卷哥林多後書，誇口被翻成誇軟弱。"],["p","「我更喜歡誇自己的軟弱，好叫基督的能力覆庇我」（林後 12:9）"],["p","加拉太書把這條線翻到底。連軟弱也不誇了，只剩十字架。"],["q","「因這十字架，就我而論，世界已經釘在十字架上；就世界而論，我已經釘在十字架上。」（6:14）"],["p","這個「世界」，不是山和海。是那一套用面子、記號、成績來量人的體系。"],["p","這個「釘」，原文是完成式，和 2:20「同釘十字架」是同一個時態。"],["p","已經釘了，到今天還有效。而且是被釘，是神作的，不是我每天努力把自己釘死。"],["p","那個世界的稱讚，再也抬不高他；那個世界的白眼，也再壓不垮他。"],["p","這不是冷漠。保羅還在為加拉太人流淚，像母親生產一樣痛。"],["q","這是自由：一個人不再需要世界給他面子，才能放手去愛。"],["p","國度321說「不再是我」，從這裡才接得上來。"],["p","「不再是我」不是我不重要，也不是我沒有感受，不能說不。"],["p","是我不再需要靠別的東西撐著。因為有一位，「他是愛我，為我捨己」（2:20）。"],["q","「受割禮不受割禮都無關緊要，要緊的就是作新造的人。」（6:15）"],["p","全卷的爭論，被這一節一筆勾銷。"],["p","保羅若只說「不受割禮才要緊」，那只是換了另一個記號。"],["p","保羅說：兩邊都不算。要緊的，是神在一個人身上，作了新的事。"],["p","「新造」，原文 καινὴ κτίσις，和哥林多後書第五章是同一個片語。"],["p","「若有人在基督裡，他就是新造的人，舊事已過，都變成新的了」（林後 5:17）。"],["p","全卷那條線，從第一章「去從別的福音」，走到這裡「新造的人」。"],["p","別的福音，是在基督後面加一個「和」字：基督和割禮，基督和日子，基督和我們的規矩。"],["q","新造，是把那個「和」字拿掉。只剩基督作成的事。"],["q","「凡照此理而行的，願平安、憐憫加給他們，和神的以色列民。」（6:16）"],["p","「神的以色列民」指誰，學者有兩種讀法，講義有並陳。"],["p","我們採的讀法是：照這把尺走的人，不分猶太人、外邦人，都是神的子民。"],["p","可是這一節，絕不可以講成神棄絕了猶太人。"],["p","保羅在羅馬書自己問：「上帝棄絕了他的百姓嗎？斷乎沒有！」（羅 11:1）"],["p","這是一個把外邦人接進來的名字，不是一個把猶太人趕出去的名字。"],["q","「從今以後，人都不要攪擾我，因為我身上帶著耶穌的印記。」（6:17）"],["p","「印記」，原文是 στίγματα。"],["p","古代烙在奴僕身上的記號，標明這個人屬於哪一位主人。"],["p","保羅要我們扛彼此的冰箱，背自己的背包。他自己身上背的，是耶穌的記號。"],["p","那些記號從哪裡來？使徒行傳講義第十四章講過路司得。"],["q","「就用石頭打保羅，以為他是死了，便拖到城外」（徒 14:19）"],["p","坐在那裡聽信的人，也許有人親眼看過他被拖出城外。他身上的疤，他們認得。"],["q","一邊要別人身上的記號來誇口，一邊用自己身上的傷來作見證。"],["p","所以請你記得，這不是後來所說的聖痕，不是身上忽然出現釘痕的神蹟。"],["p","這些記號，不是叫人看保羅，是叫人看保羅屬於誰。"],["p","弟兄姊妹，我們回到那個搬家的樓梯間。"],["p","有一件重量，是你我四個人一起抬，也抬不動的。"],["p","那是我們的罪，和律法的咒詛。"],["p","約翰說，主耶穌「背著自己的十字架」出來。那個「背」，原文也是同一個字。"],["p","他一個人，把最重的那一份，背上了各各他。"],["q","所以保羅說：我斷不以別的誇口，只誇這個十字架。"],["p","因為這個十字架，神沒有在我們的舊生命上貼一個記號。"],["p","祂把我們重新造了一次。新造的人。"],["p","新造的人，身上也開始帶著記號。不是割禮，是屬於耶穌的痕跡。"],["p","為了扛一個人的重擔，熬過的夜；為了不加那一個「和」字，挨過的白眼。"],["p","你不必更佩服保羅。你只要更認識他所誇的那一位。"],["p","這個禮拜，我想請你做兩件很小的事。"],["p","第一件，想一想你身邊，誰正被一台冰箱壓著。"],["p","打一通電話，問他：這一角，我可以幫你抬嗎？"],["p","第二件，如果你自己就是那個一直在抬的人，請你找一個人，說出來。"],["p","讓這個家，也來抬你那一角。"],["p","最後，請你聽這封信的最後一個字。"],["p","這是保羅寫給教會最嚴厲的一封信。沒有感恩，開口就是「我希奇」。"],["q","「弟兄們，願我主耶穌基督的恩常在你們心裡。阿們！」（6:18）"],["p","和合本把「弟兄們」放在句首。可是在原文裡，它排在最後。"],["p","整封信的最後一個字，後面只剩一聲阿們。"],["p","一封從「我希奇」開始的信，用「弟兄們」結束。"],["p","十字架之下，我們不是誰的成績單，我們是一家人。"],["q","弟兄們。"],["p","我們一起低頭禱告。"]]}},"issues":[{"id":"ISS00_1","t":"書信的處境與原則——割禮在加拉太代表甚麼？今天的「割禮」可能是甚麼？","r":"2:3--5；5:2--6；6:12--15","ch":[],"why":"一、原則照守、落點隨處境——沿用哥林多前書立場一（林前議題「書信的處境與原則」），本卷補述割禮作為身分門檻。加拉太書整封信圍著一件今天的華人教會幾乎沒有人在爭的事打轉：外邦信徒要不要受割禮。若只把它當成第一世紀的猶太習俗，這封信讀完就與我們無關；若把一切宗教形式都叫作「割禮」，這封信又會變成拆毀一切的鐵鎚。割禮在加拉太到底代表甚麼、今天的「割禮」可能是甚麼，必須在開卷講定，全卷每一章的落點才不會失準。","pos":[["【一】經文問的是甚麼","","<p>書信的總原則，本講義沿用哥林多前書立場一，不重寫：保羅寫信給特定地區、特定年代、遇到特定問題的教會；讀信的人要先找出他的「因為」，原則照守，落點隨處境，判斷的理由一定要講出來。全卷每一章照「書信」三問來讀：加拉太人遇到甚麼？保羅從福音推出甚麼原則？今天這原則落在哪裡？<\/p><p>本卷要補的只有一段：<strong>割禮在加拉太不是一個衛生習慣，也不只是一個古老的儀式，而是一道身分的門檻。<\/strong>受了割禮，才算真正進了亞伯拉罕的家、才配和猶太信徒同坐一桌。所以保羅在耶路撒冷寸步不讓：「但與我同去的提多，雖是希臘人，也沒有勉強他受割禮」（2:3），「我們就是一刻的工夫也沒有容讓順服他們，為要叫福音的真理仍存在你們中間。」（2:5）到了第 5 章，他的話說得更重：「我－保羅告訴你們，若受割禮，基督就與你們無益了。」（5:2）信末親筆又點破對方的動機：「凡希圖外貌體面的人都勉強你們受割禮，無非是怕自己為基督的十字架受逼迫。」（6:12）<\/p><p><strong>經文問的是：割禮本身是罪嗎？保羅反對的是那一刀，還是那一刀背後的意思？今天的教會既然沒有人要外邦信徒受割禮，這封信還在對誰說話——今天的「割禮」可能是甚麼？<\/strong><\/p>"],["歷史鎖定派（割禮之爭是第一世紀猶太人與外邦人之間的事，今天沒有直接的對應）","","<p>認為加拉太書處理的是一個非常具體、已經結束的問題：在教會剛從猶太群體裡長出來的頭幾十年，外邦人入教要不要先成為猶太人。耶路撒冷會議（徒 15）之後，這個問題在教會裡已經有了定案；今天的讀者應該把這封信當成教會史上一場重要的辯論來讀，不要急著把今天的爭議套進去。這派的優點是尊重處境，也擋住了一種常見的濫用：凡是自己不喜歡的教會規矩，都說成「又在行割禮」。<\/p><p><strong>難處：<\/strong>保羅反對割禮的理由沒有一個是只屬於第一世紀的。他從十字架講起：「義若是藉著律法得的，基督就是徒然死了。」（2:21）他從聖靈講起：「你們既靠聖靈入門，如今還靠肉身成全嗎？」（3:3）他從新造講起：「受割禮不受割禮都無關緊要，要緊的就是作新造的人。」（6:15）這些「因為」一個也沒有隨著第一世紀過去。若把整封信鎖進歷史，教會就失去了新約裡最清楚的一封「不可以在基督後面加任何東西」的信——而這個試探，每一個世代都有。<\/p>"],["一概擴大派（一切宗教形式、教會規矩與傳統，都是今天的「割禮」）","","<p>認為加拉太書的精意是反對一切外在的宗教形式：固定的禮儀、教會的會規、聚會的次序、洗禮的方式、奉獻的制度，凡是「要這樣做」的都可疑，都是在恩典上加條件。這派抓住了一件真實的事：保羅確實說「原來在基督耶穌裡，受割禮不受割禮全無功效，惟獨使人生發仁愛的信心才有功效。」（5:6）外在的形式本身救不了人，也不能拿來量人的屬靈。<\/p><p><strong>難處：<\/strong>保羅自己並不反對一切形式。同一封信裡他提到洗禮：「你們受洗歸入基督的都是披戴基督了。」（3:27）他吩咐教會要供養教導的人（6:6），要「用溫柔的心把他挽回過來」（6:1），還說「如此，就完全了基督的律法。」（6:2）使徒行傳甚至記載他親手給提摩太行了割禮（徒 16:3）——那一刀是為了福音的方便，不是進門的條件。可見保羅反對的不是形式本身，是<strong>把形式變成得救、蒙悅納、同坐一桌的條件<\/strong>。一概擴大，到最後會把教會的一切秩序都拆光，連彼此相愛的具體樣式也一起拆掉。<\/p>"],["原則—應用派（割禮是身分門檻；今天凡被加在基督後面當作門檻的，都是「割禮」）","","<p>沿用哥林多前書立場一：先找出保羅的「因為」，再問這個「因為」今天落在哪裡。在加拉太，割禮之所以成為問題，是因為它被當作<strong>「信了耶穌還不夠，還要再加上這一樣，才算真正的神子民」<\/strong>。對手沒有拿掉基督，他們只是在基督後面加了一個「和」字。保羅的判斷因此有兩面：當割禮只是一個猶太人的身分或一種宣教的方便，他可以放手（徒 16:3；林前 9:20）；當割禮被當成門檻，他寸步不讓（2:3–5）。<\/p><p>這派的優點是同時擋住了前面兩種錯：它不把加拉太書鎖進歷史，也不把它變成拆毀一切的鐵鎚。<strong>難處<\/strong>是它需要判斷：同一個做法，在甲處是方便，在乙處可能已經是門檻；判斷的人自己也可能把喜好說成原則。所以判斷的理由要講出來，而且要問被擋在門外的人怎麼感受，不只問站在門裡的人怎麼想。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用哥林多前書立場一的原則—應用讀法。原則照守：人進入神的家，只有一個門——基督；任何「還要再加上」的門檻，都是另一個福音（1:6–7；5:2–6）。落點隨處境：今天的「割禮」可能是一種語言、一種文化、一套服裝規矩、一個宗派的標記、一份會員的資格。<\/strong><\/p><p>檢驗的方法是把這件事放進一句話裡：「你信了耶穌，<strong>還要<\/strong>＿＿＿，才算真正屬於我們。」填進去的若是「會說國語」「會唱我們的詩歌」「穿得像我們一樣」「受過我們宗派的洗」「上完我們的課程、簽了我們的約」「說方言」「每天讀經三章」——這些本身都不是罪，有的還很美好；但一旦它們成為<strong>算不算數<\/strong>的門檻，它們就是今天的割禮。保羅在 6:12–13 點出的動機也要照一照自己：我們要人加上這一樣，是為了他好，還是為了我們好看、為了不被自己的圈子說話？<\/p><p>這不是說教會不可以有會籍、有課程、有聚會的次序；保羅也有。只是這些東西要放在「進門以後一起走路的方式」，不可以放在「進門的條件」。全卷六章的落點，都照這一條量：<strong>信耶穌，再加上甚麼才算數？<\/strong><\/p>"],["【四】這件事該不該影響你的信心","","<p>不該——反過來說，這一條正是保護信心的。一個人若曾經在某間教會裡覺得自己永遠是外人：口音不對、家世不對、背景不對、穿著不對、恩賜不對，好像信了耶穌還差一截才配坐上桌，加拉太書正好告訴他：<strong>那一截，基督已經補滿了。<\/strong>「你們受洗歸入基督的都是披戴基督了。」（3:27）你不必先變成別人，才能成為神的兒子。<\/p><p>同時，這一條也保護我們不去傷人。我們很少會要人受割禮，卻很容易在不知不覺中要人先像我們。321 說「焦點在耶穌，不在自己」，落在這裡就是：<strong>讓人看見的門是基督，不是我們的習慣。<\/strong>保羅說他「只誇我們主耶穌基督的十字架」（6:14），一間只誇十字架的教會，門是開著的；一間誇自己傳統的教會，門口往往站著一位看不見的守門人。<\/p>"]],"con":[],"say":"本講義的全卷立場：沿用哥林多前書立場一——原則照守、落點隨處境，判斷的理由要講出來。割禮在加拉太是身分的門檻：人進神的家只有一個門，就是基督；任何「還要再加上」的門檻都是另一個福音。今天的「割禮」可能是語言、文化、服裝規矩、宗派標記或會員資格——本身不是罪，當成門檻就是。不把這封信鎖進歷史，也不用它拆毀一切秩序。","care":"牧養底線：講「今天的割禮」時，不可以點名嘲笑某一個教會、宗派或族群的傳統，那等於又立了一道新的門檻。要想到席上那些在教會裡一直覺得自己是外人的人：新移民、說方言或不說方言的人、從別的宗派轉來的人、家境或學歷與多數會友不同的人、離過婚又回到教會的人——對他們，3:27–28 要清楚講出來。也要想到那些很認真守教會規矩的老信徒，不要讓他們覺得自己的忠心被說成律法主義；要分辨的是把規矩當門檻，不是守規矩本身。講完，會眾記得的應該是基督這一個門，而不是又學會了一個指責別人的新名詞。"},{"id":"ISS00_2","t":"律法、稱義與「因信」——人怎樣在神面前被稱為義？基督徒和舊約律法是甚麼關係？","r":"2:16；3:10--14；3:19--25；5:14；6:2","ch":[],"why":"二、稱義是神白白的恩典，單單因信，不靠行律法；同時吸收保羅新觀的提醒：加拉太的稱義也是一張餐桌——本講義的全卷立場之二（本卷新立）。過去五十年保羅研究最大的爭論就在加拉太書與羅馬書；華人教會講台上，這一題又常常落成兩種錯：一種是把「因信稱義」講成行為不重要，另一種是把「律法還有效」講成新的規條、當作進門的條件。守安息日、守飲食、十一奉獻的問題，也都從這一題長出來。這一題若不在開卷講定，第 2、3 章就講不清楚。","pos":[["【一】經文問的是甚麼","","<p>經文問的是三件事：人怎樣在神面前被稱為義？是「因行律法」，還是「因信」（2:16）？律法既然不能使人稱義，神為甚麼要給律法——「這樣說來，律法是為甚麼有的呢？」（3:19）基督徒今天和舊約律法是甚麼關係？<\/p><p>在進入各家之前，先讓經文自己說五件事。<strong>一、稱義是神的宣告，不是人的成就<\/strong>：「神要叫外邦人因信稱義」（3:8）——主詞是神。<strong>二、沒有人能靠律法稱義<\/strong>：「凡以行律法為本的，都是被咒詛的」（3:10）；「沒有一個人靠著律法在神面前稱義，這是明顯的」（3:11）。<strong>三、基督擔下了咒詛<\/strong>：「基督既為我們受了咒詛，就贖出我們脫離律法的咒詛」（3:13）。<strong>四、律法不是壞的，是有期限的<\/strong>：「律法是我們訓蒙的師傅，引我們到基督那裡，使我們因信稱義。」（3:24）「但這因信得救的理既然來到，我們從此就不在師傅的手下了。」（3:25）<strong>五、律法被愛成全了<\/strong>：「因為全律法都包在『愛人如己』這一句話之內了。」（5:14）「你們各人的重擔要互相擔當，如此，就完全了基督的律法。」（6:2）<\/p><p>各家的爭論不在這五件事要不要信，而在三個問題的細節：「律法的行為」指甚麼？加拉太的問題到底是甚麼？舊約律法的哪些部分今天還要照守？<\/p>"],["傳統觀點（路德、加爾文；今天許多福音派學者）","","<p>宗教改革以來的讀法：「律法的行為」（ἔργα νόμου）指一切想靠自己的遵行在神面前得義的努力；加拉太的問題是人想靠行為得救；「稱義」是神在法庭上宣告罪人為義——不是因為他變好了，是因為基督替他受了咒詛（3:13），他的罪被算在基督身上，基督的義算在他身上。路德說加拉太書是他「娶過門的妻子」，正因為這封信把他從「怎樣才能得到一位恩慈的神」的恐懼裡釋放出來。今天穆爾（Douglas Moo）、施賴納（Thomas Schreiner）、韋斯特霍姆（Stephen Westerholm）等學者仍然為這條路辯護。<\/p><p>這派最強的地方是 3:10–13：保羅講的是「咒詛」，是罪人在神面前的處境，不只是誰屬於哪一群人。<strong>難處：<\/strong>它有時把第一世紀的猶太教一概描寫成冷冰冰的「賺取救恩的宗教」，這對許多真心敬畏神、知道自己靠恩典蒙揀選的猶太人並不公平；而且若只講個人在法庭上的稱義，很容易忽略加拉太書的第一個場景其實是一張餐桌（2:11–14）——彼得退去，不是因為他想靠行為得救，是因為他怕和外邦人同桌。<\/p>"],["保羅新觀（桑德斯 E. P. Sanders、鄧雅各 J. D. G. Dunn、賴特 N. T. Wright 等）","","<p>1977 年桑德斯出版《保羅與巴勒斯坦猶太教》，提出第一世紀猶太教是一種「約法主義」：靠恩典進約，靠守律法留在約裡——不是靠行為賺取救恩。鄧雅各在此基礎上主張：「律法的行為」主要指標記猶太身分的界線——割禮、飲食、安息日——也就是<strong>誰屬於神的子民<\/strong>；加拉太的問題是外邦人要不要先變成猶太人，才能坐上神子民的餐桌；「稱義」是神宣告誰屬於他的立約群體。賴特進一步把稱義放進神對亞伯拉罕「萬國都必因你得福」（3:8）的應許裡講。<\/p><p>這派最強的地方是把 2:11–16 讀活了：保羅講「人稱義不是因行律法」（2:16），正是緊接著安提阿的餐桌說的。<strong>難處：<\/strong>若「律法的行為」只是身分標記，3:10 引申 27:26「凡不常照律法書上所記一切之事去行的，就被咒詛」就不好解釋——那裡講的是「一切之事」，不只是割禮與飲食；3:13 基督「受了咒詛」也不只是拆一道族群的牆。而且它對稱義的重新定義，容易讓「罪人怎樣與聖潔的神和好」這個問題退到後面去。<\/p>"],["律法的三分法（道德律、禮儀律、民事律；改革宗與多數福音派）","","<p>認為舊約律法可分三類：<strong>禮儀律<\/strong>（獻祭、潔淨、節期、割禮）在基督裡成全而終止；<strong>民事律<\/strong>（以色列作為國家的刑罰與司法）隨著以色列神權國家的結束不再直接適用；<strong>道德律<\/strong>（以十誡為綱）反映神不變的性情，今天仍然有效，不是稱義的途徑，而是蒙恩之人生活的指引（威斯敏斯德信條第十九章）。這套分法讓人可以同時說「但你們若被聖靈引導，就不在律法以下」（5:18）與「全律法都包在愛人如己這一句話之內」（5:14）。<\/p><p><strong>難處：<\/strong>保羅在加拉太書裡講律法，從來沒有這樣分開；他說「凡受割禮的人……是欠著行全律法的債」（5:3），是把律法當成一個整體。三分法是一個有用的整理工具，卻不是經文自己的分類；而且安息日在十誡之中，卻在新約被列入「節期、月朔、安息日」（西 2:16）一類，三分法在這一點上需要額外的說明。<\/p>"],["新約神學與時代論（摩西之約整體已經完成或屬於另一個時代）","","<p><strong>新約神學<\/strong>認為整個摩西之約是一個整體，在基督裡已經完成；基督徒活在「基督的律法」之下（6:2；林前 9:21），舊約的道德誡命凡在新約重申的照守，因為是基督吩咐的，不是因為摩西吩咐的。<strong>時代論<\/strong>則把摩西律法放在以色列的時代，認為教會時代的信徒在恩典之下，不在律法之下（羅 6:14），而神對以色列的安排另有一條線。兩者都很認真地對待 3:17–25 的「時間線」：律法是四百三十年以後加上的，有一個「直等到」的期限。<\/p><p><strong>難處：<\/strong>新約神學若處理不慎，容易讓會眾覺得舊約與今天無關，而耶穌說「我來不是要廢掉，乃是要成全」（太 5:17），保羅也說「更是堅固律法」（羅 3:31）。時代論把以色列與教會分得很開，與 3:29「你們既屬乎基督，就是亞伯拉罕的後裔」所說外邦信徒與亞伯拉罕應許的連續性之間，需要更多的說明（見議題「在基督裡成為一：族群、性別、以色列與教會」）。<\/p>"],["守安息日的教會（基督復臨安息日會的讀法）","","<p>基督復臨安息日會認為十誡是神永恆的道德律，第四誡的第七日安息日因此今天仍要遵守；加拉太書 4:10 與歌羅西書 2:16 所說的「節期、月朔、安息日」，是指禮儀性的節期與年度的安息日，不是十誡的每週安息日。他們的官方信條同樣明說：人得救是因著恩典、藉著信，守安息日不是得救的條件，而是蒙恩的人順服的表現。這個讀法提醒其他教會：不要把「我們不守安息日」講成神不在乎時間的分別為聖。<\/p><p><strong>難處：<\/strong>4:10 的「日子」與西 2:16 的「安息日」，在原文都沒有排除每週的安息日；羅馬書 14:5 也說「有人看這日比那日強；有人看日日都是一樣。只是各人心裡要意見堅定。」新約沒有任何一處要外邦信徒守第七日。若在實際的教會生活裡，守不守安息日成了判斷誰是真教會的標準，那就已經走到加拉太書所警告的那一步了。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：稱義是神白白的恩典，單單因信，不靠行律法——這是宗教改革的底線，也是 2:16 與 3:10–14 的明文。<\/strong>3:10「凡以行律法為本的，都是被咒詛的」與 3:13「基督……成了咒詛」不只是在講身分界線，是在講罪人在神面前的處境。加拉太書的福音是十字架的福音，不只是餐桌的福音。<\/p><p><strong>同時吸收新觀的正確提醒：加拉太的稱義，一開始就是一張猶太人和外邦人可以同坐的桌子<\/strong>（2:11–16）。「因信稱義」在加拉太書裡的第一個結果，是彼得應該回到外邦人的桌上。一個只講個人得救、不講合一的稱義，是講少了一半的稱義。所以今天的「律法的行為」可以是想賺得神喜悅的宗教表現（傳統觀點的提醒），也可以是把人擋在桌子外面的身分標記（新觀的提醒）——<strong>兩種都是在耶穌後面加一個「和」字。<\/strong><\/p><p>律法對基督徒：<strong>不是稱義的途徑，也不是丟掉的廢紙<\/strong>——它把我們帶到基督那裡（3:24），然後在聖靈的果子裡被成全（5:14、22–23；6:2）。三分法、新約神學、時代論，各有幫助也各有難處，本講義不替各教會決定採哪一套整理，但都要守住這兩句話。第 2、3 章的原文解經處理 ἔργα νόμου 時，一律並陳兩種讀法。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：<strong>人得救是因著神的恩典、藉著信靠基督；聖靈在信徒裡面結出愛的果子。<\/strong>路德與賴特爭的是「律法的行為」最主要指甚麼，不是基督有沒有為我們死；改革宗與時代論爭的是律法怎樣整理，不是人能不能靠自己得救。爭論的是細節，不是福音本身。<\/p><p>而且這一題的答案，本身就是一種安慰。「我只要問你們這一件：你們受了聖靈，是因行律法呢？是因聽信福音呢？」（3:2）你在神面前站得住，不是因為你今天讀經禱告夠不夠多、奉獻夠不夠準時、聚會有沒有缺席，是因為「他是愛我，為我捨己」（2:20）。連信心本身也不是你的功勞：你的信是投靠一位信實的主，焦點在他，不在你信得夠不夠用力。<strong>所以你可以放心地去行善，不是為了被接納，是因為已經被接納了。<\/strong><\/p>"]],"con":[],"say":"本講義的全卷立場：稱義是神白白的恩典，單單因信，不靠行律法——宗教改革的底線，也是 2:16 與 3:10–14 的明文；同時吸收保羅新觀的提醒：加拉太的稱義一開始就是一張猶太人和外邦人同坐的桌子。律法不是稱義的途徑，也不是廢紙：它帶我們到基督那裡，在聖靈的果子裡被成全。","care":"牧養底線：不用「因信稱義」叫人覺得行為不重要——5:6「使人生發仁愛的信心」與 5:21「必不能承受神的國」都要講（紅線二）；也不用「律法還有效」把新的規條加在信徒身上、當作進門的條件（紅線二）。不嘲笑或貶低守安息日、守飲食條例的弟兄姊妹，羅 14:5–6 說各人心裡要意見堅定；錯不在守，在把守當成得救的條件（5:2–4）。席上會有長期活在「我做得不夠」的恐懼裡、聽到律法就喘不過氣的人，對他們先講 3:13 與 2:20 下半句；也會有聽到「白白的恩典」就鬆懈的人，對他們講 5:13。不要讓這一題變成學者名字的展覽，講完會眾記得的應該是十字架。"},{"id":"ISS00_3","t":"基督徒的自由：在律法主義與放縱之間——節期、飲食、習俗與華人節慶怎樣看？","r":"4:8--11；5:1；5:13--18","ch":[],"why":"三、自由是真的，但以三個問題檢驗：把人帶近基督，還是加在基督後面？是用愛服事人，還是給肉體開門？是聖靈引導，還是私慾的理由？——本講義的全卷立場之三（本卷新立）。加拉太書是全本聖經講「自由」最多的一卷；華人信徒每年都要面對春節、清明、中秋與家族的祭拜，初信者最常問的就是「我還可以回家過年嗎」「清明可以去掃墓嗎」。這一題講得太緊，人會被另一個軛綁住、與家人斷絕；講得太鬆，人會回到「那些本來不是神的」面前。","pos":[["【一】經文問的是甚麼","","<p>「基督釋放了我們，叫我們得以自由。所以要站立得穩，不要再被奴僕的軛挾制。」（5:1）經文問的是：這自由到甚麼程度？基督徒可以喝酒嗎？可以過聖誕節嗎？可以過春節、清明、中秋嗎？可以擇日嗎？甚麼是「放縱情慾的機會」（5:13）？<\/p><p>先讓經文自己說四件事。<strong>一、自由是真的，而且是基督付了代價換來的<\/strong>：「要把律法以下的人贖出來，叫我們得著兒子的名分。」（4:5）<strong>二、自由有兩個敵人<\/strong>：一邊是「奴僕的軛」（5:1），就是律法主義；一邊是「放縱情慾的機會」（5:13），就是放縱。<strong>三、自由有一個方向<\/strong>：「總要用愛心互相服事。」（5:13）<strong>四、自由有一位帶路的<\/strong>：「但你們若被聖靈引導，就不在律法以下。」（5:18）<\/p><p>難題落在 4:10：「你們謹守日子、月份、節期、年份」（4:10），緊接著是「我為你們害怕，惟恐我在你們身上是枉費了工夫。」（4:11）保羅責備的到底是甚麼？這一節決定了基督徒怎樣看一切節期與曆法。<\/p>"],["4:10 讀法一：猶太節期說（安息日、月朔、逾越節被當成稱義的條件）","","<p>認為上下文是割禮與律法之爭，「日子、月份、節期、年份」就是摩西律法的安息日、月朔、三大節期與安息年；攪擾的人要外邦信徒照猶太曆法過日子，才算真正進了神的約。歌羅西書也把「節期、月朔、安息日」（西 2:16）並列，說「這些原是後事的影兒；那形體卻是基督。」（西 2:17）這派的優點是緊貼全卷的論證主線。<\/p><p><strong>難處：<\/strong>4:8–9 的上下文說的是「從前你們不認識神的時候，是給那些本來不是神的作奴僕」（4:8），現在又「要歸回那懦弱無用的小學」（4:9）——「歸回」二字表示這是他們<strong>從前<\/strong>過的日子；可是外邦的加拉太人從前並沒有守過猶太節期。只讀成猶太節期，「歸回」就講不通。<\/p>"],["4:10 讀法二：異教曆法說（歸信前的星象、月相與神廟節日）","","<p>認為加拉太人歸信以前，生活在希臘—羅馬與當地宗教的曆法之下：吉日凶日、月相、星宿、皇帝崇拜與神廟的節期，背後是對「世俗小學」（4:3）——許多學者認為包括被當成神明的天象與靈界勢力——的懼怕。保羅說他們若照日子過活，就是回到拜假神時的那種奴役。這派把「歸回」講得很通。<\/p><p><strong>難處：<\/strong>整封信從頭到尾沒有提到偶像節期的具體名目，攪擾的人傳的明明是割禮與律法（5:2–4；6:12–13）；若只讀成異教曆法，4:10 就和全卷的論證脫了節，好像保羅突然換了一個話題。<\/p>"],["4:10 讀法三：兩者合併說（被帶回一種「照日子過才蒙神喜悅」的宗教）","","<p>認為保羅是刻意把兩件事放在一起：攪擾的人要加拉太人照猶太曆法過日子，保羅的判斷是——這在結構上和你們從前拜假神時一模一樣。<strong>內容<\/strong>不同（一個是神所設立的節期，一個是假神的節日），<strong>功能<\/strong>卻相同：都是要人靠著守對日子、做對儀式，來保證自己在神或眾神面前的地位。這就是為甚麼保羅敢把「律法以下」（4:4–5）和「世俗小學」（4:3、9）放在同一段裡講——對一個已經是兒子的人，兩者都是退回奴僕的身分。<\/p><p><strong>難處：<\/strong>這個讀法要求讀者接受保羅一個很大膽的比較——把神所賜的律法節期與異教曆法並列。它需要清楚說明：保羅不是說摩西律法是假神的宗教，而是說<strong>把它當成得救的條件<\/strong>，就等於落回一切宗教共有的那一種奴役。說不清楚，會被誤聽成反猶太。<\/p>"],["華人節慶的兩種極端：一概妖魔化與一概「只是文化」","","<p>一端認為春節、清明、中秋、端午都與民間信仰糾纏在一起，基督徒應當一概不過、不回家、不參加，才算與世界分別出來。這一端的心志是要保守信仰的純正，也正確地看見許多節慶背後確實有祭拜與求福的成分。<strong>難處：<\/strong>它常常讓初信者與家人斷絕往來，叫家人覺得「信了耶穌就不要祖宗、不要父母」，這不是自由，是另一個軛；它也把「日子」本身當成問題，正好落在 4:10 所說「照日子過」的另一面。<\/p><p>另一端認為拜祖先、燒香、擇日、看風水都「只是文化」「只是孝順」，基督徒照做無妨。這一端的心志是要尊重家人、不讓信仰成為家庭的裂痕。<strong>難處：<\/strong>保羅說得很清楚，那是「給那些本來不是神的作奴僕」（4:8），是「歸回那懦弱無用的小學」（4:9）。向祖先求福、看時辰定吉凶，問題不在那一天是幾月幾日，而在<strong>那一天我把平安交給誰<\/strong>。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：4:10 採「兩者合併」讀法為主要判斷；基督徒有自由，但自由的檢驗標準有三：一、它把人帶近基督，還是把基督變成還要再加上的一項？（5:2–4）二、它是用愛服事人，還是給肉體開門？（5:13）三、它是聖靈的引導，還是我的私慾找的理由？（5:16–18）<\/strong><\/p><p><strong>節期<\/strong>：基督徒可以過聖誕、復活節來記念主，也可以不過；但不可以把過不過當成屬靈與否的標準——「守日的人是為主守的。」（羅 14:6）<strong>華人節慶<\/strong>：春節的團圓、中秋的賞月、清明的追思，本身是文化，基督徒可以參與並活出見證；祭拜、燒香、向祖先求福、擇日看時辰、看風水，則是「給那些本來不是神的作奴僕」——這不是文化，是信靠的對象換了。<strong>分辨的關鍵不是日子，是我在那一天信靠誰。<\/strong>不一概妖魔化，也不一概放任。<\/p><p>喝酒、娛樂、飲食等一般的自由問題，同樣照三個檢驗量，並記得哥林多前書已經講過的那一句：「只是你們要謹慎，恐怕你們這自由竟成了那軟弱人的絆腳石。」（林前 8:9）各章碰到這些範圍，一句帶過，回指這裡。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。自由的界線，各教會、各家庭有不同的判斷；有的弟兄清明節去掃墓、獻花、為家人禱告，有的弟兄那一天選擇不去；有的家庭過聖誕，有的不過。<strong>但「基督是唯一的門」「用愛心互相服事」，各派都同意。<\/strong>在可以有不同看法的事上，羅馬書說「信心軟弱的，你們要接納，但不要辯論所疑惑的事。」（羅 14:1）<\/p><p>真正會傷害信心的，不是某一個節日過或不過，而是把信仰活成一張「可以／不可以」的清單——不管那張清單是緊的還是鬆的。加拉太書給的不是一張更好的清單，是一位帶路的：「我們若是靠聖靈得生，就當靠聖靈行事。」（5:25）一個知道自己是兒子的人，過年回家可以理直氣壯地愛父母、不拿香，因為他不怕日子，也不怕人；他只是在每一個日子裡，都呼叫「阿爸！父！」（4:6）。<\/p>"]],"con":[],"say":"本講義的全卷立場：基督徒的自由是真的，但以三個問題檢驗——把人帶近基督還是加在基督後面？用愛服事人還是給肉體開門？聖靈引導還是私慾的理由？節期可以過也可以不過；春節團圓、中秋、清明追思是文化，祭拜、燒香、向祖先求福、擇日看時辰、看風水是給那些本來不是神的作奴僕。分辨的關鍵不是日子，是信靠誰。","care":"牧養底線：不把華人節慶一概妖魔化，叫初信者與家人斷絕往來——那不是自由，是另一個軛；清明節不去掃墓，和清明節去掃墓、獻花、為家人禱告而不燒香，是兩種不同的見證，後者往往更能把福音帶進家裡。也不把拜祖先、擇日、算命講成只是文化，4:9 說那是歸回懦弱無用的小學。不用「自由」為傷害別人、絆倒軟弱的人辯護（5:13；林前 8:9）。席上會有剛因為不拿香而與父母起衝突、正在流淚的初信者，也會有家中長輩過世、不知道喪禮怎麼辦的人：不要在講台上替他們做決定，會後單獨陪他們想，必要時陪他們回家；不要說「你就是不夠堅定」。"},{"id":"ISS00_4","t":"在基督裡成為一：族群、性別、以色列與教會——3:28 與 6:16 怎樣讀？","r":"2:11--14；3:26--29；4:21--31；6:16","ch":[],"why":"四、合一不是一樣；性別角色兩派並陳；以色列與教會採 6:16「就是」讀法，同時明說神沒有棄絕他的百姓；絕不使猶太人被輕看——本講義的全卷立場之四（本卷新立）。3:28 是全本新約被引用得最多、也被拉扯得最厲害的一節：有人用它抹平一切差異，有人用它為女性按牧辯護，有人用差異為族群分堂找理由；4:21–31 與 6:16 又曾被用來講成對猶太人或阿拉伯人的定罪。這一題講錯，傷的是會眾席上真實的女性、少數族群與猶太朋友。","pos":[["【一】經文問的是甚麼","","<p>「並不分猶太人、希臘人，自主的、為奴的，或男或女，因為你們在基督耶穌裡都成為一了。」（3:28）經文問的是：「成為一」是甚麼意思？差異消失了嗎？教會裡還可以有族群的分堂、性別的分工嗎？外邦信徒是「亞伯拉罕的後裔」（3:29）、教會是「神的以色列民」（6:16）嗎？那肉身的以色列呢？<\/p><p>先讓經文自己說四件事。<strong>一、「成為一」的根據是基督，不是我們的相同<\/strong>：「你們受洗歸入基督的都是披戴基督了。」（3:27）——同一件衣服，不同的身體。<strong>二、合一是要落在餐桌上的<\/strong>：彼得「退去與外邦人隔開了」（2:12），被保羅稱為「與福音的真理不合」（2:14）——分桌就是違背福音。<strong>三、3:28 的三組，正是當時社會最深的三條隔閡<\/strong>：民族、階級、性別。拉比文獻記載一段晨禱，感謝神沒有使自己成為外邦人、奴僕、女人；希臘哲人也有類似的話，感謝自己生為希臘人而不是化外人、生為男人而不是女人。<strong>保羅把古代世界這三條牆全部拆掉<\/strong>——他拆的不是某一個民族的牆，是全人類的牆。<\/p><p><strong>四、6:16「神的以色列民」是一個難解的片語<\/strong>：「凡照此理而行的，願平安、憐憫加給他們，和神的以色列民。」（6:16）原文 καὶ ἐπὶ τὸν Ἰσραὴλ τοῦ θεοῦ 的 καί，可以讀成「和」（另一群人），也可以讀成「就是」（同一群人）。<\/p>"],["性別：互補派（3:28 講救恩上的平等，不取消教會與家庭裡的角色分工）","","<p>認為 3:28 的上下文是誰是亞伯拉罕的後裔、誰可以承受產業（3:29），講的是男女在救恩、在神面前的身分完全平等；但這並不取消神在創造時所設的角色分工。保羅在別處仍然區分教會與家庭中的角色（提前 2:12；弗 5:22–33），所以今天教會的長老或主任牧師職分保留給男性，丈夫在家中負起帶領的責任，是順服整本聖經。這派的優點是認真對待保羅全部的書信，不讓一節經文吞掉其他經文。<\/p><p><strong>難處：<\/strong>3:28 的另外兩組——猶太人與希臘人、自主的與為奴的——保羅都推出了具體的社會後果：彼得必須回到外邦人的桌上，腓利門要收回阿尼西母「不再是奴僕，乃是高過奴僕」。若唯獨第三組只停留在「神面前的身分」，需要說明為甚麼。而且互補派在實踐上常常滑向把女性的恩賜關在門外，那是這一派自己的優秀學者也反對的。<\/p>"],["性別：平等派（3:28 是原則，其他經文是處境性的應用）","","<p>認為 3:28 是保羅神學的原則宣告，其他限制女性的經文是針對特定教會處境的應用（例如以弗所假教師的問題）；既然在基督裡「或男或女」都成為一了，今天男女都可以按恩賜擔任教會一切的職分。保羅自己的同工名單裡就有女性：非比是堅革哩教會的女執事，百基拉與丈夫一同教導亞波羅，安多尼古和猶尼亞安被稱為「在使徒中是有名望的」。這派的優點是把 3:28 的社會後果講得一致，也看見了新約裡女性實際的服事。<\/p><p><strong>難處：<\/strong>它需要對提摩太前書 2 章、哥林多前書 11、14 章等經文給出令人信服的處境解釋，而這些解釋本身在學界仍有爭議；若處理不慎，容易變成「凡不合原則的經文都是處境」，讓讀者覺得可以自己挑選哪些經文算數。<strong>兩派都是福音派、都敬重聖經權威<\/strong>（回指哥林多前書立場二）。<\/p>"],["以色列與教會：取代論、實現論、時代論","","<p><strong>取代論<\/strong>認為教會完全取代了以色列，肉身的以色列在神的計畫裡已經沒有特別的地位。<strong>難處：<\/strong>教會歷史上，這個讀法常被拿來為輕看、仇視、甚至迫害猶太人辯護；而保羅自己說「神並沒有棄絕他預先所知道的百姓。」（羅 11:2）<\/p><p><strong>實現論／一個子民論<\/strong>認為教會是以色列的延續與擴大：以色列中信主的餘民，與外邦信徒一同接在同一棵橄欖樹上（羅 11:17–24），同屬一個子民；「你們既屬乎基督，就是亞伯拉罕的後裔，是照著應許承受產業的了。」（3:29）這派同時保留羅 11 章對肉身以色列將來的盼望。<strong>難處：<\/strong>它要很小心地說明，「延續與擴大」不等於「取代」，否則容易在講台上滑回取代論。<\/p><p><strong>時代論<\/strong>認為以色列與教會是兩個不同的子民，神對以色列的地土與國度應許，將來仍要在肉身以色列身上實現。這派嚴肅地對待「神的恩賜和選召是沒有後悔的」（羅 11:29）。<strong>難處：<\/strong>它與 3:29 和 3:28「都成為一了」之間的張力需要說明，而且常常帶著一套預設的末世時間表，這是本系列鐵律四所不採的。<\/p>"],["6:16 的 καί：「和」（另一群人）還是「就是」（同一群人）","","<p><strong>「和」說<\/strong>：和合本照字面譯作「和神的以色列民」，認為保羅在祝福「凡照此理而行的」（全體信徒）之後，另外祝福一群人——或是信主的猶太人，或是將來要得救的以色列全家（羅 11:26）。支持的理由是：保羅在新約其他地方用「以色列」，都指肉身的以色列；而且「平安、憐憫」的次序暗示第二群人是需要憐憫的。<strong>難處：<\/strong>在一封從頭到尾拆除猶太人與外邦人界線的信裡，在最後一節又把信徒分成兩群，顯得與全卷的論證不合。<\/p><p><strong>「就是」說<\/strong>：認為 καί 在這裡是解釋性的，「凡照此理而行的」就是「神的以色列民」——整個教會，不分猶太人和外邦人。支持的理由是全卷的論證：「那以信為本的人，就是亞伯拉罕的子孫」（3:7），3:29 已經說外邦信徒是亞伯拉罕的後裔，6:15 剛說完「受割禮不受割禮都無關緊要」。<strong>難處：<\/strong>這是新約唯一一處可能把教會稱為「以色列」的地方，孤例必須謹慎；而且若講成「所以肉身以色列不再是以色列」，就越過了經文，落入取代論。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：合一不是一樣。<\/strong>3:28 沒有說猶太人變成希臘人、女人變成男人；它說的是在基督裡，這些差異不再決定誰更靠近神、誰可以坐上桌子。<\/p><p><strong>性別分工的問題，兩派並陳，本講義不替各教會決定<\/strong>；但兩派都必須同意：3:28 之後，任何貶低、輕看、排斥女性的講法與做法都違背福音。<\/p><p><strong>以色列與教會：本講義採 6:16 的「就是」讀法為主要判斷<\/strong>（教會是神的以色列民），同時誠實地說明和合本譯作「和」、另一讀法也有它的理由；<strong>並且明說羅 11 章：神沒有棄絕他的百姓<\/strong>——「我且說，神棄絕了他的百姓嗎？斷乎沒有！因為我也是以色列人」（羅 11:1）。保羅自己是「生來的猶太人」（2:15）。4:21–31 比的是兩個約、兩種出生方式，不是兩個民族；夏甲本人不是反派，她是給神起名「看顧人的神」（創 16:13）的人。<strong>絕不採取任何使猶太人或阿拉伯人被輕看、被仇視的講法<\/strong>（紅線三）。<\/p><p><strong>族群：華人教會的語言分堂可以是為了福音的方便，但不可以變成彼得那一張分開的桌子。<\/strong>檢驗標準是：不同堂的人有沒有一起吃飯、一起禱告、一起作決定？<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。性別角色與以色列的問題，各派已經爭論了很久，敬虔愛主的人站在不同的位置上；<strong>但「在基督裡成為一」各派都同意。<\/strong>你可以是互補派或平等派，可以是時代論者或不是，仍然和另一位弟兄姊妹同坐在主的桌前。<\/p><p>真正會影響信心的，是教會不肯一起吃飯。一個新移民、一位女傳道、一個從別的族群來的初信者，若在教會裡感受到的是一道看不見的牆，他會懷疑的不只是這間教會，而是福音本身。所以這一題最後落在我們自己身上：「因他使我們和睦，將兩下合而為一，拆毀了中間隔斷的牆」（弗 2:14）——<strong>牆已經被基督拆了，我們不要再砌回去。<\/strong><\/p>"]],"con":[],"say":"本講義的全卷立場：合一不是一樣——在基督裡，差異不再決定誰更靠近神、誰可以坐上桌子。性別角色兩派並陳，不替各教會決定，但任何貶低女性的講法都違背福音；以色列與教會採 6:16「就是」讀法為主要判斷，同時明說神沒有棄絕他的百姓（羅 11:1–2），絕不使猶太人被輕看；分堂可以是福音的方便，不可以變成分開的桌子。","care":"牧養底線：不用 3:28 抹平一切差異，叫人否定自己的文化、身體或身分；也不用差異為排斥找理由——「我們這一堂比較屬靈」「他們那一族比較難帶」。不在講台上替各教會決定女性按牧的問題，但要讓會眾聽見兩派都敬重聖經。4:25、30 與 6:16 一律受紅線三約束。席上可能有曾因性別被拒於服事之外而受傷的姊妹、在教會裡一直被當成客人的少數族群、有猶太或阿拉伯背景的朋友：不要拿他們當例子，會後單獨關心，先聽他們的經歷，不急著替教會辯護。"},{"id":"ISS00_5","t":"加拉太在哪裡？這封信寫於何時？——北加拉太說還是南加拉太說？","r":"1:2；4:13--14；徒 13:13--14:23；16:6；18:23","ch":[],"why":"全卷通用：收信人與年代。「加拉太」在保羅的時代有兩個意思：一個是民族的地區（中北部的加拉太人），一個是羅馬的行省（向南包括彼西底的安提阿、以哥念、路司得、特庇）。選哪一個，決定了這封信寫給誰、寫於耶路撒冷會議之前還是之後、第 2 章對應使徒行傳哪一次上耶路撒冷。這些不會改變福音，卻會改變讀者怎樣把加拉太書與使徒行傳放在一起讀，必須在開卷交代清楚。","pos":[["【一】經文問的是甚麼","","<p>保羅「寫信給加拉太的各教會」（1:2），又叫他們「無知的加拉太人哪」（3:1）。他提到自己「頭一次傳福音給你們，是因為身體有疾病」（4:13），而他們「沒有輕看我，也沒有厭棄我，反倒接待我，如同神的使者，如同基督耶穌。」（4:14）信裡三次提到巴拿巴（2:1、9、13），好像收信人都認識他。<\/p><p>「加拉太」這個名字有兩層意思。主前三世紀，一支高盧人（凱爾特人）遷入小亞細亞中北部，定居在安居拉、佩西努、他文一帶，這是<strong>民族的加拉太<\/strong>。主前 25 年，羅馬設立加拉太行省，範圍向南擴大，包括彼西底、呂高尼的一部分——也就是使徒行傳 13–14 章保羅第一次旅行所到的彼西底的安提阿、以哥念、路司得、特庇，這是<strong>行省的加拉太<\/strong>。<strong>經文問的是：這封信寫給哪一個加拉太？寫於何時？與使徒行傳的哪幾章對應？<\/strong><\/p>"],["北加拉太說（民族的加拉太；寫於第二、三次旅行之後，約主後 53–57 年）","","<p>認為收信人是中北部的民族加拉太人，保羅在第二次旅行時「經過弗呂家、加拉太一帶地方」（徒 16:6）建立教會，第三次旅行時「挨次經過加拉太和弗呂家地方，堅固眾門徒」（徒 18:23），4:13 的「頭一次」正好對應這兩次探訪。書信大約寫於主後 50 年代中期，地點可能在以弗所或馬其頓。這是古代教父與十九世紀許多德國學者的主流看法，也有萊特富特（J. B. Lightfoot）的支持。優點是「加拉太人」（3:1）這個稱呼，用在民族的加拉太人身上最自然；而加拉太書與羅馬書在主題上的接近，也符合兩封信寫作時間相近的推想。<\/p><p><strong>難處：<\/strong>使徒行傳沒有記載保羅在北加拉太建立任何一間教會、也沒有提到任何一座城；巴拿巴只和保羅一起走過第一次旅行（南加拉太），北加拉太的教會未必認識他；而且攪擾的人從猶太來，走到南方的城市比深入中北部的高原要容易得多。<\/p>"],["南加拉太說・早期（行省的加拉太；寫於耶路撒冷會議之前，約主後 48–49 年）","","<p>認為收信人就是使徒行傳 13–14 章所建立的彼西底的安提阿、以哥念、路司得、特庇各教會。十九世紀末蘭賽爵士（William Ramsay）實地考察小亞細亞後大力主張此說，今天許多福音派學者採用。若寫於耶路撒冷會議（徒 15）之前，加拉太書就是保羅現存最早的一封信；2:1–10「過了十四年」那一次上耶路撒冷，對應的是使徒行傳 11:27–30 送捐款的那一次——保羅說「我是奉啟示上去的」（2:2），亞迦布正是「藉著聖靈指明天下將有大饑荒」（徒 11:28）；耶路撒冷的柱石「只是願意我們記念窮人」（2:10），也與那次送捐款的目的相合。這也解釋了為甚麼保羅在全信裡沒有引用耶路撒冷會議的決議：會議還沒有開。<\/p><p><strong>難處：<\/strong>2:1–10 的內容——割禮問題、提多、與柱石們的協議——和使徒行傳 15 章的主題非常接近，許多學者認為兩處講的是同一件事；而早期說必須假定割禮之爭在會議之前已經爆發過一次，然後才在會議上正式處理。<\/p>"],["南加拉太說・晚期（行省的加拉太；寫於耶路撒冷會議之後）","","<p>同樣認為收信人是南加拉太的教會，但把 2:1–10 等同於使徒行傳 15 章的耶路撒冷會議，書信寫於會議之後，大約在第二次旅行期間或稍後。保羅第二次旅行時再次經過特庇與路司得（徒 16:1），4:13 的「頭一次」就有了著落。這派的優點是讓加拉太書第 2 章與使徒行傳第 15 章互相印證，兩處都有巴拿巴、都有割禮之爭、都有耶路撒冷的使徒與長老。<\/p><p><strong>難處：<\/strong>若會議已經開過、決議已經寫成書信送到各教會（徒 15:23–29；16:4），保羅在加拉太書裡最需要的正是這份決議，他為甚麼一句都不提？而且 2:1–10 說是「背地裡對那有名望之人說的」（2:2），聽起來不像使徒行傳 15 章那樣的公開會議。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：傾向南加拉太說，但這個判斷不影響解經。<\/strong>主要的理由有三：一、使徒行傳清楚記載了南加拉太的教會怎樣建立，北加拉太卻沒有任何記載；二、巴拿巴在信中被當成收信人熟悉的人；三、使徒行傳 14 章的遭遇——保羅在路司得被石頭打、「以為他是死了，便拖到城外」（徒 14:19）——與 6:17「我身上帶著耶穌的印記」、4:13–14 收信人當日的接待，讀起來彼此呼應。<\/p><p>至於早期或晚期，本講義<strong>不作硬性決定<\/strong>：第 2 章的〔背景〕互見行把使徒行傳 11:27–30 與 15:1–35 都列出來，兩種對應的理由並陳；第 4 章的〔背景〕互見行指向使徒行傳 13:13–14:23。各章碰到收信人、年代與路線的問題，一句帶過，回指這裡；耶路撒冷會議本身的討論，見本系列使徒行傳講義第 15 章。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。北加拉太說與南加拉太說，爭的是一封信寄到地圖上的哪一塊、早寫還是晚寫幾年，不是這封信說了甚麼。不論收信人住在安居拉還是路司得，他們聽到的都是同一句話：「基督釋放了我們，叫我們得以自由。」（5:1）學者對年代與地點的爭論，反而說明這封信是寫給真實的人、真實的城市、真實的處境——它不是一篇從天上掉下來的論文，是一位病中被接待過的傳道人，寫給他所愛的教會的信。<\/p><p>如果南加拉太說是對的，這件事還有一層溫柔：那些教會是在逼迫中建立的，保羅離開時對他們說「我們進入神的國，必須經歷許多艱難。」（徒 14:22）幾年以後，他寫信叫他們不要為了避開逼迫而接受割禮（6:12）——<strong>同一群人，同一個福音，同一個十字架。<\/strong><\/p>"]],"con":[],"say":"本講義的判斷：傾向南加拉太說（收信人是使徒行傳 13–14 章建立的彼西底的安提阿、以哥念、路司得、特庇各教會），早期或晚期不作硬性決定，第 2 章並列使徒行傳 11 章與 15 章兩種對應；這個判斷不影響解經。耶路撒冷會議的討論見本系列使徒行傳講義第 15 章。","care":"這一題容易在查經班裡變成地理考試，讓不熟悉歷史的弟兄姊妹覺得自己讀不懂聖經。講台上一兩句帶過、配一張地圖就夠了，不要把北南之爭講成誰比較有學問的比賽；也不要讓剛信主的人以為，必須先弄清楚這些才能讀加拉太書。可以帶會眾留意 4:13–14：一群人在傳道人生病、外貌不體面的時候接待了他——教會裡正在病中、覺得自己是別人負擔的人，需要聽見這一段。"},{"id":"ISS00_6","t":"「攪擾你們的人」是誰？他們傳的是甚麼？","r":"1:7；2:4；2:12；5:10--12；6:12--13","ch":[],"why":"全卷通用：對手。加拉太書是一封寫給第三者聽的辯論信：我們只聽見保羅這一方的話，對手的主張要從他的回應裡重建。「攪擾你們的人」是誰、他們從哪裡來、傳的是甚麼，決定了全卷每一章的「因為」怎樣讀；若把他們講成一群不信耶穌的人，就看不見這封信真正的危險——他們沒有拿掉基督，只是在基督後面加了一個「和」字。這也正是今天講台最需要照見自己的地方。","pos":[["【一】經文問的是甚麼","","<p>保羅從來沒有說出這些人的名字，只描寫他們的作為：「不過有些人攪擾你們，要把基督的福音更改了」（1:7）；「因為有偷著引進來的假弟兄，私下窺探我們在基督耶穌裡的自由，要叫我們作奴僕。」（2:4）「但攪擾你們的，無論是誰，必擔當他的罪名。」（5:10）「凡希圖外貌體面的人都勉強你們受割禮，無非是怕自己為基督的十字架受逼迫。」（6:12）「他們願意你們受割禮，不過要藉著你們的肉體誇口。」（6:13）安提阿的事件裡，還有一群「從雅各那裡來的人」（2:12）。<\/p><p>從保羅的回應可以重建出他們的主張大約是：你們信耶穌是對的，但要成為亞伯拉罕真正的子孫，還要受割禮、守律法；保羅的福音是打了折扣的，因為他不是耶路撒冷的原始使徒。（以上是對手的主張，不是保羅的。）<strong>經文問的是：這些人是誰？他們和耶路撒冷的使徒是甚麼關係？他們傳的到底是甚麼？<\/strong><\/p>"],["猶太派信徒說（從猶太來、要外邦信徒守摩西律法的猶太基督徒）","","<p>這是最多學者的看法：他們是信耶穌的猶太人，多半從猶太或耶路撒冷來，和使徒行傳 15 章那些人是同一類——「有幾個人從猶太下來，教訓弟兄們說：『你們若不按摩西的規條受割禮，不能得救。』」（徒 15:1）「惟有幾個信徒，是法利賽教門的人，起來說：『必須給外邦人行割禮，吩咐他們遵守摩西的律法。』」（徒 15:5）他們有創世記 17 章的割禮之約為根據，有猶太人千年的傳統為後盾，很可能真心認為自己是在「完成」保羅沒有做完的工作。這也解釋了保羅為甚麼花兩章講自己的福音不是從人來的（1:11–2:10）——對方在質疑他的使徒權柄。<\/p><p><strong>難處：<\/strong>6:13「他們那些受割禮的」原文是現在分詞，可以讀成「那些正在受割禮的人」，似乎指向已經受了割禮的外邦人，而不是生來的猶太人；此外，保羅說他們「怕自己為基督的十字架受逼迫」（6:12），這個動機需要說明他們到底怕誰。<\/p>"],["外邦歸信者說（已經受了割禮、熱心推廣割禮的外邦信徒）","","<p>以 6:13 的現在分詞為主要根據，認為攪擾的人是加拉太本地的外邦信徒，他們自己剛受了割禮，便熱心勸別人也這樣做，或許是出於對耶路撒冷教會的仰慕，或許是要在猶太會堂與羅馬當局面前取得合法宗教的保護。這派提醒我們：熱心推廣「再加上」的，往往不是外來的人，而是剛剛自己加上了的人。<\/p><p><strong>難處：<\/strong>2:4 的「偷著引進來的假弟兄」、2:12「從雅各那裡來的人」與 1:7 的「有些人」，整體的圖像是有一群人從外面來；保羅說「攪擾你們的，無論是誰」（5:10），語氣像是在講一群收信人之外的人。單用一個分詞，撐不起整個重建。<\/p>"],["「從雅各那裡來的人」說（攪擾者得到耶路撒冷教會領袖的授權）","","<p>認為攪擾的人與耶路撒冷教會、特別是雅各有直接關聯，甚至自稱奉他差派；2:12「從雅各那裡來的人未到以先，他和外邦人一同吃飯，及至他們來到，他因怕奉割禮的人，就退去與外邦人隔開了」（2:12），顯示雅各身邊的人確實能讓彼得退縮。有些學者（十九世紀的杜賓根學派）甚至把整個初期教會描寫成保羅與耶路撒冷使徒兩派的對立。<\/p><p><strong>難處：<\/strong>保羅明說雅各、磯法、約翰「就向我和巴拿巴用右手行相交之禮」（2:9），而且「那些有名望的，並沒有加增我甚麼」（2:6）——柱石們與保羅在福音上是一致的。保羅責備彼得的是「裝假」（2:13），是行為與信念不一致，不是說彼得信的是另一個福音。使徒行傳 15:24 也記載耶路撒冷的書信說：「我們並沒有吩咐他們」——這些人可能借了雅各的名字，卻不代表雅各的立場。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：攪擾的人主要是猶太派的信徒教師，很可能從猶太來，可能自稱與耶路撒冷有關，也可能已經吸引了一些加拉太本地的外邦信徒跟著推廣。他們傳的是「信耶穌再加上」——信耶穌，再加上割禮與守律法，才算真正的神子民。<\/strong><\/p><p>這個判斷有三個講台上的後果。<strong>一、他們的主張一律說清楚是誰的，不寫成保羅的<\/strong>；講台上引他們的話要說「對手說」「攪擾的人說」。<strong>二、不把他們和雅各、彼得畫上等號<\/strong>：柱石們與保羅「用右手行相交之禮」（2:9），彼得的問題是怕人，不是異端。<strong>三、不把他們講成不信耶穌的人<\/strong>：他們最危險的地方，正在於他們看起來非常屬靈、非常熱心（4:17），而且他們的「再加上」有聖經作根據。今天最需要被照見的，往往不是外面的異端，是我們自己講台上的「和」字。<\/p><p>屬靈權柄、真假使徒的判斷，本卷沿用哥林多後書立場三，不另立；5:12 保羅的重話與 1:8–9 的「咒詛」，各章碰到時回指這裡與紅線四。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。我們只聽得見保羅這一方的話，對手的面貌有些模糊；但他們傳的是甚麼，經文一點也不模糊：在基督後面加上一個條件。這個試探在每一個世代都換一套衣服回來，所以這封信每一個世代都用得上。<\/p><p>這一題也保護我們不去亂貼標籤。保羅說「別的福音」，是指在基督之外加上得救的條件；不是指和我們在聚會方式、詩歌風格、末世看法、洗禮形式上意見不同的人。他把第一個放上檢驗台的，是「但無論是我們，是天上來的使者」（1:8）——<strong>他先檢驗自己。<\/strong>一個讀懂加拉太書的人，不會急著找出誰是今天的「攪擾者」，而會先問：我有沒有在別人的信心後面，加上我自己的條件？<\/p>"]],"con":[],"say":"本講義的立場：「攪擾你們的人」主要是猶太派的信徒教師，可能自稱與耶路撒冷有關；他們沒有拿掉基督，傳的是「信耶穌再加上」割禮與守律法。他們的主張一律說清楚是誰的，不寫成保羅的；不把他們等同於雅各或彼得，也不用 1:8–9 咒詛意見不同的人。屬靈權柄的判斷沿用哥林多後書立場三。","care":"牧養底線：不用 1:8–9「他就應當被咒詛」咒詛意見不同的人，也不把「攪擾你們的人」當成攻擊別的教會、別的宗派或前任牧者的武器（紅線四）。席上會有剛從一個強調規條、控制很強的團體出來的人，聽到這一題可能又痛又釋放，要讓他知道他的感受是真的，也不要催他立刻去批評那個團體；也會有曾經熱心推廣某套規矩、現在發現自己可能就是「再加上」的人——對他，不要定罪，指給他看彼得被抵擋之後仍是柱石，回頭的路是開著的。"},{"id":"ISS00_7","t":"加拉太書與羅馬書——同一個福音，為甚麼寫成兩種樣子？","r":"2:16；3:6--14；4:4--7；羅 1:16--17；3:21--4:25；8:14--17","ch":[],"why":"全卷通用：兩封書信。加拉太書與羅馬書都講亞伯拉罕、因信稱義、律法、兒子的名分與「阿爸！父！」，許多讀者因此把加拉太書當成羅馬書的「簡寫本」，或反過來說保羅後來改變了想法。兩封信在語氣與某些說法上確實不同：加拉太書對律法說得很重，羅馬書說律法是聖潔的；加拉太書幾乎沒有講以色列的將來，羅馬書用了三章。這兩
